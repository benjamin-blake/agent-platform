    ideal_behavior: Model and prompt routing changes are compared on representative graded tasks before authority expands.
    gap: Portability is structurally guarded by SLOC limits, but capability-tier quality is not empirically routed.
    compensating_controls_considered: Independent review and deterministic validation catch structural defects, not behavioral quality
      regressions.
    change_type: enforce
    proposed_change: Implement T4.14 before T4.4 raises autonomy, and use results to calibrate model-tier routing rather than hard-code
      a fashionable provider.
    acceptance: Golden fixtures include success, refusal, injection, degraded-provider, and cost/latency measures; CI reports statistically
      interpretable deltas and blocks autonomy promotion on material regression.
