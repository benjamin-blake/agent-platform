    title: The autonomous recommendation iteration remains an executable design, not an operating path
    evidence: docs/ROADMAP-PLATFORM.yaml:6656-6869; T4.1,T4.2,T4.3,T4.9a,T4.10a,T4.11
    evidence_kind: static
    current_behavior: The orchestrator, personas, queue producer, callback, and bounded loop policy are not started.
    ideal_behavior: One bounded queue-fed iteration diagnoses, changes, independently verifies, merges, and measures an outcome without
      required human action.
    gap: Operational mvp_complete is materially incomplete even though roadmap coverage is substantial.
    compensating_controls_considered: The interactive /orient-/plan-/implement and governed CI/CD path is a property-matched safety
      fallback, but it requires human actions and therefore does not satisfy the autonomy definition.
    change_type: resequence
    proposed_change: Build the minimal producer, contracts, callback, budget, then orchestration/personas; retain concurrency=1 and
      human escalation.
    acceptance: A sandbox end-to-end run completes one recommendation with authenticated SHA-bound verdict, bounded retries, rollback/escalation,
      and no manual transition.
    severity: high
    severity_rationale: This is the named MVP outcome; skipping it leaves autonomy operationally absent.
    confidence: CONFIRMED
