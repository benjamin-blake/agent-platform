  - q: Q3
    verdict: required_changes
    basis:
    - PRA-01
    - PRA-02
    - PRA-04
    - PRA-06
    prose: High findings must close for named completeness frames; most are owned, so the need is execution and resequencing rather
      than architectural proliferation.
  - q: Q4
    verdict: substantial_simplification
    basis:
    - PRA-05
    prose: Completing the migration can retire one persistent service, one workflow, one authority, and multiple maintained concepts
      while preserving P4/P6/P8.
  - q: Q5
    verdict: sequence_with_assumptions
    basis:
    - PRA-01
    - PRA-02
    - PRA-03
    - PRA-04
    - PRA-05
    prose: Prioritize evidence and migration closure before authority expansion. The sequence assumes causal telemetry is identifiable
      and autonomy remains the intended leverage point.
    priority_sequence:
    - rank: 1
      ids:
      - PRA-05
      - T2.26
      - T2.36
      outcome_unlocked: one operational-data and maintenance path
      why_now: It clears T3.2 and reduces operating load.
      prerequisite:
      - T2.19
      skipped_counterfactual: Causal verification stays blocked and legacy machinery remains.
    - rank: 2
      ids:
      - PRA-01
      - T3.2
      - T3.3
      - T3.4
      outcome_unlocked: trusted outcome-linked learning
      why_now: It tests the premise before scaling autonomy.
      prerequisite:
      - T2.36
      - T1.13
      skipped_counterfactual: The platform cannot know whether accepted changes improve outcomes.
    - rank: 3
      ids:
      - PRA-04
      - T4.13
      - T4.10a
      - T4.11
      outcome_unlocked: contained first-live personas
      why_now: Containment must precede write authority.
      prerequisite:
      - T4.1 design seam
      skipped_counterfactual: Untrusted inputs can steer personas or loops can run without bounded budgets.
    - rank: 4
      ids:
      - PRA-02
      - T4.3
      - T4.9a
      - T4.1
      - T4.2
      outcome_unlocked: one governed autonomous iteration
      why_now: Evidence and containment prerequisites then make orchestration meaningful.
      prerequisite:
      - rank 2
      - rank 3
      skipped_counterfactual: mvp_complete remains operationally impossible.
    - rank: 5
      ids:
      - PRA-03
      - T4.14
      - T4.4
      outcome_unlocked: evidence-based model routing and safe authority promotion
      why_now: Measure quality before increasing autonomy.
      prerequisite:
      - T4.2 fixtureable personas
      skipped_counterfactual: Prompt/model regressions remain invisible and A-gate promotion lacks behavioral evidence.
  - q: Q6
    answers:
    - question: What evidence would falsify the north star?
      answer: A joined negative-control study where all platform gates pass but post-change outcome quality declines would falsify
        current closure claims and force redesign of T3.2/T3.4.
      basis:
      - PRA-01
    - question: What should deliberately never be automated?
      answer: Unbounded authority expansion, bootstrap-admin mutation, and interpretation of untrusted content as policy should remain
        human-ratified or structurally forbidden.
      basis:
      - PRA-04
    - question: What recurring sole-developer cost is inherited?
      answer: Parallel migration maintenance, workflow monitoring, evidence review, and provider/cloud drift are the dominant recurring
        costs; retire legacy paths promptly.
      basis:
      - PRA-05
    - question: What triggers redesign rather than incremental roadmap work?
      answer: Non-identifiable outcomes, sustained model regressions, regulatory scope expansion, or queue economics worse than interactive
        operation should trigger topology and autonomy-premise review.
      basis:
      - PRA-01
      - PRA-03
