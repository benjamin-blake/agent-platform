      - cloud analysis agent
      - control-plane loop closure
      - post-change outcome
      dedup_hit_count: 4
      note: Distinct ownership records counted across roadmap items/decisions and prior-audit references.
    effort: L
    depends_on: []
    sequencing:
      safe_to_queue_now: true
      blocked_behind: []
      note: Dependency-valid ordering reflected in Q5.
    simplification_effect:
      authorities_removed: 0
