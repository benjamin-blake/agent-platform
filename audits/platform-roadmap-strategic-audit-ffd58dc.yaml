    title: Outcome-linked recursive improvement is adequately designed but unbuilt
    evidence: docs/ROADMAP-PLATFORM.yaml:5926-6085; T2.36, T3.2, T3.3, T3.4
    evidence_kind: static
    current_behavior: The causal verifier, telemetry migration, cloud analysis, and control-plane closure are not started.
    ideal_behavior: A durable intent-to-outcome chain demonstrates that accepted changes improve outcomes and catches degradation.
    gap: Coverage exists, but operational MVP and mature-platform closure cannot be claimed.
    compensating_controls_considered: Typed schemas, verifier foundation T3.1, and human review preserve safety but cannot establish
      post-change causal improvement.
    change_type: resequence
    proposed_change: Execute T2.26 -> T2.36 -> T3.2 -> T3.3 -> T3.4 before autonomous orchestration expansion.
    acceptance: A synthetic and one real non-confidential iteration join intent, action, verification, cost, and post-change outcome;
      T3.2 latest run passes and a negative-control degradation is detected.
    severity: high
    severity_rationale: Without this chain every component can report activity while decisions worsen.
    confidence: CONFIRMED
    roadmap_crossref:
      classification: planned-unbuilt
      item_ids:
      - T2.36
      - T3.2
      - T3.3
      - T3.4
      dedup_search_terms:
