  automation_options_comparison:
  - option: github-native-auto-merge
    strengths: Respects branch protection and avoids a custom merge token.
    weaknesses: Needs policy workflow and repository feature support.
    fit: Best for eligible low-risk updates after DEPEND-02/03.
  - option: direct-workflow-merge
    strengths: Flexible and immediate.
    weaknesses: Requires contents write and custom bypass-safe logic.
    fit: Reject as default; excess credential surface.
  - option: merge-queue
    strengths: Serializes validated heads and reduces race risk.
    weaknesses: Operational overhead for a low-concurrency sole-maintainer repo.
    fit: Consider only if measured concurrency/conflicts justify it.
  - option: scheduled-maintenance
    strengths: Creates bounded review cadence.
    weaknesses: Still depends on a human and can batch unrelated risk.
    fit: Fallback for human-review classes.
  - option: renovate
    strengths: Broad managers, custom regex, dashboards, and stale controls.
    weaknesses: Adds bot/config complexity and another trust surface.
    fit: Consider if Dependabot plus derivation cannot cover nonstandard inputs.
  - option: manual-review
    strengths: Strong judgment for majors/native/infrastructure.
    weaknesses: Orphan-prone without explicit escalation.
    fit: Required for high-blast-radius classes, paired with stale policy.
  findings:
  - id: DEPEND-01
    surface: S2
    question: Q3
    dimension: VD9
    title: Native pgclient and DuckDB extension bytes lack verified digests and provenance
    candidate_ids:
    - C6
    evidence: scripts/build_lambda_packaging.py:261-347
    evidence_kind: static
    current_behavior: Builds prefer mutable S3 objects or download version-addressed extension bytes and accept the returned bytes
      without a committed digest or signature.
    ideal_behavior: Each native or extension input has a committed digest/provenance record checked before packaging.
    gap: A compromised or replaced upstream/vendored object can enter a trusted Lambda layer without an integrity verdict.
    compensating_controls_considered: Pinned DuckDB version, HTTPS, private S3, deterministic ZIPs, and smoke tests constrain location
      and behavior but do not authenticate source bytes.
    change_type: enforce
    proposed_change: Add a machine-readable native/extension inventory with SHA-256 digests and verify every fetched object before
      layer assembly.
    acceptance: A tampered S3 fallback or CDN extension fails the build before ZIP creation; all pgclient files and three extensions
      have reviewed identities.
    severity: high
    severity_rationale: Unverified native bytes execute inside production Lambda artifacts; existing controls do not fail on source-byte
      substitution.
    confidence: CONFIRMED
    roadmap_crossref:
      classification: novel
