  - id: DEPEND-02
    surface: S1
    question: Q3
    dimension: VD4
    title: Production Python resolution does not consume the transitive lock
    candidate_ids:
    - C2
    - C3
    - C7
    - C13
    evidence: scripts/import_governance.py:52-95
    evidence_kind: static
    current_behavior: requirements.lock pins the root runtime closure, but CI and operational workflows install floor/range requirements;
      the sync gate checks only that each root name appears somewhere in the lock.
    ideal_behavior: Tested and deployed production Python closures resolve from an enforced lock or hashes, with deliberate platform-specific
      derivations.
    gap: The reviewed lock does not determine installed bytes and stale transitive pins are not detected.
    compensating_controls_considered: Fresh runner resolution and post-merge tests exercise a resolution, but not necessarily the
      reviewed or later rebuilt resolution.
    change_type: enforce
    proposed_change: Generate and consume platform-appropriate hashed locks for production/dev closures and make sync validation
      compare a regenerated lock, not subset presence.
    acceptance: Changing a requirement without regenerating its lock fails; CI and production artifact builders consume the reviewed
      lock or a mechanically derived platform lock.
    severity: high
    severity_rationale: Unbounded resolver drift materially weakens reproducibility across tested and deployed Python closures.
    confidence: CONFIRMED
    roadmap_crossref:
      classification: novel
      item_ids: []
      dedup_search_terms:
      - requirements.lock consumed
      - hashed requirements
      - lockfile subset presence
      dedup_hit_count: 0
      confidence: CONFIRMED
      note: Decision 80 added the present lock but no owning unbuilt item closes consumption and full synchronization.
    effort: M
    depends_on: []
    sequencing:
      safe_to_queue_now: true
      blocked_behind: []
      note: Define closures before expanding automation.
