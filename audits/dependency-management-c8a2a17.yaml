  automation_policy:
    patch:
      verdict: auto-merge
      mechanism: GitHub-native auto-merge for eligible low-risk changes; protected human review otherwise.
      gates: Immutable inputs, reproducible resolution, required CI, dependency review, and affected artifact build/smoke where applicable.
      deployment_effect: Governed main-push channel refreshes affected consumers; infrastructure remains gated.
      recovery: Forward-fix on post-merge red; disable eligibility and escalate recurring failures.
      stale_handling: Supersede obsolete updates; escalate breached age after a measured baseline, without inventing an SLO.
      rationale: Balances sole-maintainer toil, production blast radius, and least privilege.
      confidence: CONFIRMED
