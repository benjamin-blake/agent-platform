    degraded_dedup: false
    degraded_fetch: true
    degraded_external_research: true
    degraded_empirical: true
    degraded_publish: true
    contract_notes: 'fetch: origin remote absent and origin/main unavailable; audited local HEAD and remote-freshness claims are
      HYPOTHESIS; cache: recommendations refreshed successfully 2026-07-26 with recs_read_status ok; external-research: web search
      returned HTTP 401, so vendor claims are HYPOTHESIS and overall cannot be leading; empirical: no remote or GitHub read path,
      so the required five-PR sample was unavailable and lifecycle-frequency claims are HYPOTHESIS; publish: push failed - origin
      remote is not configured; validation: scripts.validate --pre failed because origin/main is unavailable and pre-existing HEAD
      verification-registry entries are not admitted; audited deliverables passed YAML/cardinality and git diff checks'
    stale_anchors: []
  question_answers:
  - q: Q1
    verdict: partial
    basis:
    - DEPEND-01
    - DEPEND-03
    - DEPEND-06
    prose: Root Python inputs are declared at requirements.txt:1-39 and Lambda manifests name layer consumers, but native, extension,
      workflow-local, ownership, and lifecycle metadata are fragmented.
  - q: Q2
    verdict: incomplete
    basis:
    - DEPEND-03
    prose: .github/dependabot.yml:1-23 covers only root pip and GitHub Actions; no equal six-property alternative closes the omitted
      ecosystems.
  - q: Q3
    verdict: weak
    basis:
    - DEPEND-01
    - DEPEND-02
    - DEPEND-05
    prose: The DuckDB version has a lockstep SSOT at config/lambda/ducklake/version.yaml:1-8, but the main lock is not consumed and
      downloaded bytes lack verified digests.
  - q: Q4
    verdict: orphan-prone
    basis:
    - DEPEND-04
    - DEPEND-05
    prose: Required checks exist at terraform/github/repo.tf:93-107, yet there is no deterministic green-PR disposition; empirical
      frequency is HYPOTHESIS because the remote sample was unavailable.
  - q: Q5
    verdict: insufficient
    basis:
    - DEPEND-03
    - DEPEND-04
    - DEPEND-05
    prose: The current policy groups routine root updates but does not classify risk, automate safe disposition, or close deployment
      for all authorities.
  - q: Q6
    verdict: lagging
    basis:
    - DEPEND-01
    - DEPEND-02
    - DEPEND-03
    - DEPEND-04
    - DEPEND-05
    - DEPEND-06
    - DEPEND-07
    prose: Repository evidence shows strong protected CI and least privilege, but external comparison is HYPOTHESIS because official
      browsing failed.
    external_checklist:
    - property: authoritative manifests
      rating: partial
      evidence: Root requirements and Lambda manifests exist; DEPEND-03 identifies fragmented authorities.
    - property: reproducible lock/digest resolution
      rating: missed
      evidence: DEPEND-01 and DEPEND-02.
    - property: automated inventory and closure validation
      rating: partial
      evidence: Import and manifest checks exist; DEPEND-06 names missing external inventory.
    - property: dependency PR protected CI
      rating: met
      evidence: .github/workflows/ci.yml:6-10 and terraform/github/repo.tf:93-107.
    - property: branch protection
      rating: met
      evidence: terraform/github/repo.tf:81-115.
    - property: risk-tiered policy
      rating: missed
      evidence: DEPEND-04.
    - property: distinct security updates
      rating: missed
      evidence: No repository policy distinct from ordinary updates; DEPEND-04.
    - property: trusted Dependabot metadata
      rating: missed
      evidence: No dependency merge classifier exists; DEPEND-04.
    - property: noise and stale controls
      rating: partial
      evidence: Groups and five-PR limits exist at .github/dependabot.yml:7-12,18-23; DEPEND-04 covers missing stale/supersession.
    - property: artifact build and smoke evidence
      rating: partial
      evidence: Governed Lambda workflows smoke deployed code, but DEPEND-05 identifies trigger/layer gaps.
    - property: post-merge ownership and recovery
      rating: partial
      evidence: CI-RCA forward-fix and sole maintainer exist; DEPEND-04/05 cover gaps.
    - property: integrity and least privilege
      rating: partial
      evidence: Read-only defaults at terraform/github/repo.tf:126-135 property-match token blast radius; DEPEND-01/07 cover integrity
        gaps.
    - property: reasoned mechanism choice
      rating: missed
      evidence: No dependency-specific choice contract; DEPEND-04.
    - property: latency and EOL observability
      rating: missed
      evidence: DEPEND-06.
  - q: Q7
    answers:
    - question: transitive vulnerability visibility
      answer: 'Partial: the transitive lock exists, but no complete vulnerability inventory/closure policy is enforced.'
      basis:
      - DEPEND-02
      - DEPEND-06
    - question: whether the lock is consumed or only checked
      answer: Only subset-checked; installs use requirements ranges, not requirements.lock.
      basis:
      - DEPEND-02
    - question: import-to-distribution mapping
      answer: 'Partial: normalization exists, but no complete import-to-distribution and runtime-consumer inventory.'
      basis:
      - DEPEND-06
    - question: lazy/optional imports
      answer: Some lazy dependencies are manually documented in DUCKLAKE_DEPS; completeness is not mechanically proven.
      basis:
      - DEPEND-03
      - DEPEND-06
    - question: native and managed-layer ownership
      answer: Managed/custom layer roles are documented, but native byte ownership and provenance are incomplete.
      basis:
      - DEPEND-01
    - question: GitHub Action mutability
      answer: Most references are mutable major tags; a few monitoring workflows demonstrate SHA pins.
      basis:
      - DEPEND-07
    - question: Terraform and pre-commit coverage
      answer: Neither Terraform roots nor pre-commit repos have configured updater entries.
      basis:
      - DEPEND-03
    - question: licenses/provenance/SBOM
      answer: No repository-wide license, provenance, or SBOM policy was found.
      basis:
      - DEPEND-01
      - DEPEND-06
    - question: batching versus bisectability
      answer: Minor/patch grouping reduces noise but can reduce bisectability; protected checks remain the compensating control.
      basis:
      - DEPEND-04
    - question: unmaintained/EOL packages
      answer: No EOL inventory or accountable exception lifecycle was found.
      basis:
      - DEPEND-06
    - question: Dependabot-token and secret behavior
      answer: Dependabot PRs receive read-oriented CI permissions; no merge identity exists, so secrets are not a current auto-merge
        bypass.
      basis:
      - DEPEND-04
    - question: deployment of merged Lambda changes
      answer: Dependency authorities are missing from deploy path filters and DuckLake layer publication is not closed.
      basis:
      - DEPEND-05
    - question: rollback versus forward-fix
      answer: Post-merge failures use forward-fix/CI-RCA; no dependency-specific rollback is present.
      basis:
      - DEPEND-04
      - DEPEND-05
    - question: security and ordinary update SLOs
      answer: No numeric SLO is evidenced; measure age and remediation latency before setting policy ranges.
      basis:
      - DEPEND-04
      - DEPEND-06
    - question: whether stale-update monitoring itself can become noisy or orphaned
      answer: Yes; implement deduplicated state transitions and alert only on breached policy, not every scan.
      basis:
      - DEPEND-04
    - question: whether accountable maintenance ownership and escalation survive 30 days of human absence
      answer: No; the sole maintainer is an owner but no deterministic 30-day escalation/disposition mechanism exists.
      basis:
      - DEPEND-04
    - question: 'executor-discovered: can a dependency-only change alter a Lambda layer without changing its deployment trigger'
      answer: Yes; script/list or manifest changes can miss workflow path filters or fail to publish/attach a new layer.
      basis:
      - DEPEND-05
