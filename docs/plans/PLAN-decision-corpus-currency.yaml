execution_steps:
  - >-
    scripts/decisions_md.py -- move _is_compacted_stub here VERBATIM as public is_compacted_stub(block),
    bringing _BOLD_STATUS_RE with it. Do not change its logic. Also expose the status half as public
    status_is_superseded(block) -- FIRST match of _BOLD_STATUS_RE, group(1) split on '--', stripped, ==
    'Superseded' -- and have is_compacted_stub call it, so exactly ONE status predicate exists for the check
    (I1), the graduated VP step 1, and the tests to share. Re-implementing it anywhere is the DAF-03
    violation this plan invokes against others. PIN THE SIGNATURE:
    derive_currency(row: dict, inbound_supersedes: set[int], inbound_amends: set[int]) -> str, where `row`
    is a PARSER row from parse_decisions_md (it needs `raw_block`, which the index projection deliberately
    excludes), and the two arguments are the PER-ROW inbound sets already resolved by the caller from
    corpus-wide maps -- the generator builds those maps once per build_index() call. `inbound_supersedes`
    is built from the index's unioned `supersedes` semantics (inverse-superseded_by UNION title_supersedes),
    matching what build_index already computes.
    PIN THE STATUS SOURCE: both is_compacted_stub/status_is_superseded AND the `amended` branch's
    "status begins with 'Amended'" test read the BOLD MARKER on `raw_block`, never `row['status']`.
    parse_decisions_md prefers the metadata envelope over the bold marker (scripts/decisions_md.py:468), so
    the two can diverge on any enveloped entry; the bold marker is the corpus-wide spelling and the only one
    the historical band carries. Add derive_currency(row, inbound_supersedes,
    inbound_amends) evaluated in this precedence: 'superseded_compacted' if is_compacted_stub; else
    'superseded_pointer' if the row has a victim-side superseded_by OR an inbound supersedes edge; else
    'amended' if it has an inbound amends edge OR its status begins with 'Amended'; else 'current'.
    Corpus-wide edge maps are parameters, never recomputed per row.
  - >-
    scripts/checks/decisions/validate_decision_entry_conformance.py -- replace the private function with a
    module-level alias `_is_compacted_stub = is_compacted_stub`. Do NOT delete the private name: line 22 of
    its test imports it and that file is at exactly 500 SLOC. CRITICAL: `_BOLD_STATUS_RE` is defined
    LOCALLY in this module (line 48) and has a SECOND consumer at line 178 (`_envelope_body_conflicts`).
    Moving it to the parser without re-importing it here is a NameError at import time that kills every
    decisions check and reds `--pre` before any VP step can run. Extend this module's existing
    `from scripts.decisions_md import ...` line with `_BOLD_STATUS_RE` in the same edit.
  - >-
    docs/contracts/decision-entry.yaml -- add a currency section with `values` (the four tokens), per-token
    derivation rules, a consumer_contract stating only superseded_compacted may filter and the others
    annotate without reducing severity, explicit reversal_conditions (documentation only -- see the
    accepted-cost note in constraints), and a note recording the reversed/deferred trade. The grandfather
    hook itself does NOT go here: it is a module-level constant in the check module, per Decision 165 clause
    4 ("growing the hook later is a reviewed code edit, never a config edit"). Decision 149 clause 3 is NOT
    a precedent for it -- orphan_baseline.yaml seeds dec-010 and is a config file, so it is neither
    empty-at-install nor code-resident. Cross-reference compaction.stub_grammar rather than restating it.
  - >-
    scripts/decisions_index.py -- build the two inverted edge maps once per build_index() call and project
    currency onto live rows only. The generator does NOT validate or raise. Preserve byte-stability. Extend
    the module docstring's field-derivation list.
  - >-
    scripts/checks/decisions/validate_decision_currency.py -- five invariants: I1 every LIVE entry whose
    status marker resolves to 'Superseded' derives superseded_compacted, using the FIRST match of
    _BOLD_STATUS_RE with '--' normalization (never a substring/findall match, which hits live Decisions 149
    and 160 where the marker is merely QUOTED; I1 is live-scoped because currency is, and under the PINNED
    first-match predicate that scoping is a no-op today -- zero archive entries resolve to 'Superseded'.
    The 11-archive-entry figure quoted in earlier drafts came from the plain-substring measure this plan
    forbids); I2 currency present on exactly the live
    rows; I3 every emitted value is in the contract vocabulary; I4 no live entry carries a Reversed or
    Deferred status marker outside the grandfather hook; I5 the decision-scout skill contains both
    consumer-contract clauses AND that the status-prose fallback is ABSENT (the literal
    "whose status is active" must not appear). The absence half is the headline safety property -- without
    it nothing standing prevents the prose branch being reintroduced -- so I5 is presence-AND-absence, not
    presence-only.
    PIN THE INPUT MODEL (do not invent one): the check signature is
    validate_decision_currency(failed: list[str], root: Path | None = None) with root defaulting to
    _common.ROOT, mirroring the seam validate_decision_entry_conformance already uses. It reads currency
    values from the COMMITTED root/docs/decisions-index.json (never build_index(), which takes no arguments
    and hardcodes its paths, so it cannot be pointed at a fixture); status markers from
