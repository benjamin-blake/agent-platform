rollback: >-
  Revertible in one commit, with one caveat stated honestly. Reverting scripts/decisions_index.py and
  regenerating restores the previous index byte-for-byte (build_index is deterministic and excludes volatile
  fields). Reverting the skill, prose-budget, registry-sequence and validate.py re-export restores the prior
  gate behaviour; the new check module can be deleted and its registry row removed. The predicate promotion
  in scripts/decisions_md.py IS genuinely behaviour-preserving in this revision -- it is a verbatim move, not
  a strengthening -- so it may be left in place independently. No corpus entry, warehouse row, or deployed
  artifact is touched. The caveat: the blocking gate itself is the live surface, so any plan scoped between
  merge and revert was scoped under the new filter and is not retroactively re-scoped by the revert.
