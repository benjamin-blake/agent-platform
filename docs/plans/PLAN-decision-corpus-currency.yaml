schema_version: 4
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: "decision-corpus-currency"
intent: >-
  Give the decision corpus a derived, deterministic per-entry currency projection in the generated
  docs/decisions-index.json, enforce its safety invariants with a registered check, and repoint the
  BLOCKING decision-scout gate onto it, so the gate stops branching on free-text status prose and starts
  annotating the partially-superseded entries it currently reports as fully current.
plan_type: IMPLEMENTATION
verification_tier: V2
plan_path: docs/plans/PLAN-decision-corpus-currency.yaml
phase: >-
  Platform governance / decision-corpus read model. Not a tier_item slice: this is an ad_hoc_rec pairing
  (rec-3055 defect + rec-3056 mechanism) against the decision-scout gate. Adjacent to T1.5 (the STRATEGIC,
  CD.17-frozen portal cutover that eventually retires docs/decisions-index.json); closes none of T1.5's
  criteria and is designed to survive that cutover unchanged.
scope:
  - file: scripts/decisions_md.py
    action: Modify
    purpose: >-
      Promote the compaction-stub predicate out of the checks layer into the shared parser as a public
      is_compacted_stub(block), moved VERBATIM (same two-marker logic), and add derive_currency() returning
      exactly one token. DAF-03's single-parser rule requires ONE derivation with two consumers.
  - file: scripts/checks/decisions/validate_decision_entry_conformance.py
    action: Modify
    purpose: >-
      Replace the private _is_compacted_stub body with a module-level alias to the promoted predicate, the
      same private-alias pattern scripts/decisions_md.py already uses for _extract_superseded_by. The alias
      is required: this module's test imports the private name directly and that file is at exactly 500 SLOC.
  - file: scripts/decisions_index.py
    action: Modify
    purpose: >-
      Project a currency value onto live rows only. The generator never raises on an unexpected value --
      validation is the registered check's job, so check_index_freshness keeps failing cleanly instead of
      surfacing an uncaught traceback.
  - file: scripts/checks/decisions/validate_decision_currency.py
    action: Create
    purpose: >-
      New registered check enforcing the five currency invariants that carry this plan's safety property.
      This is the machine-readable home of the governance rule (only the compaction-stub token may filter),
      chosen over a numbered Decision per the operator ruling that the proof of a decision belongs in code
      -- a routing the corpus itself compels, since Decision 150's field_semantics row routes exactly this
      content to the owning contract and says "Never a numbered Decision".
  - file: scripts/checks/registry.py
    action: Modify
    purpose: >-
      Sequence validate_decision_currency into the --pre and full tiers, glob-gated on the surfaces it
      reads (docs/DECISIONS.md, docs/DECISIONS_ARCHIVE.md, docs/decisions-index.json,
      docs/contracts/decision-entry.yaml, .claude/skills/decision-scout/SKILL.md) PLUS its own module path,
      following the validate_actions_evidence precedent -- otherwise a PR editing only the check itself
      skips it in --pre.
  - file: scripts/validate.py
    action: Modify
    purpose: >-
      Add the facade re-export line for validate_decision_currency. Required: dispatch is
      globals()[name](failed), so without it --pre KeyErrors on the check name.
  - file: docs/contracts/decision-entry.yaml
    action: Modify
    purpose: >-
      Add the currency section: the four-token vocabulary, each token's derivation rule, the consumer
      contract that ONLY superseded_compacted may filter, explicit reversal conditions, and the recorded
      reversed/deferred trade. The grandfather hook itself does NOT go here -- it is a module-level constant
      in the check module (see constraints).
  - file: .claude/skills/decision-scout/SKILL.md
    action: Modify
    purpose: >-
      Repoint Phase 2 step 7 onto the typed currency field, add currency to the Phase 1 step 1 field
      enumeration, and delete the now-moot "Citing reversed decisions as governing" anti-pattern. Must land
      at or below the 11,325-byte prose budget; the measured formulation lands at 11,315 bytes.
  - file: config/prose_budgets.yaml
    action: Modify
    purpose: Ratchet the S4 decision-scout entry DOWN to the post-edit size. A decrease is always unrestricted.
  - file: config/agent/verification_registry/registry.yaml
    action: Modify
    purpose: >-
      Append the TWO graduation rows owed by VP steps 1 and 5. In scope deliberately: Decision 166 point 6 calibrated
      this file's 6,000-line ceiling precisely because "every graduating /implement plan appends to it",
      and the never-a-second-raise pre-commitment governs what happens when the ceiling FIRES, not whether
      to graduate. Measured post-rebase at 4,707 EFFECTIVE lines against the 6,000 limit
      (config/structural_size_budgets.yaml declares unit: effective-lines), so 1,293 free; raw count 4,885.
      Two rows cost roughly 18 lines.
  - file: tests/decisions_md/test_currency.py
    action: Create
    purpose: >-
      Unit coverage for is_compacted_stub and derive_currency across all four tokens, both inbound-edge
      cases, and explicit PRECEDENCE cases using synthetic rows. New file rather than an append: the
      sibling test_parse.py is at 493 SLOC.
  - file: tests/checks/decisions/test_validate_decision_currency.py
    action: Create
    purpose: >-
      Unit coverage for each of the check's five invariants, each with a synthetic FAILING fixture. The
      failing fixtures live here, on injected input -- never as a verification step that mutates the
      tracked corpus.
  - file: tests/test_decisions_index.py
    action: Modify
    purpose: >-
      Integration spot-checks and the live-rows-only invariant. MUST also update
      test_entry_shape_is_the_stable_projection_only, which asserts an exact 12-key set for every entry and
      necessarily breaks under a live-only projection.
  - file: docs/decisions-index.json
    action: Modify
    purpose: Regenerated committed artifact. Never hand-edited.
bundled_recommendations:
  - rec-3055
  - rec-3056
infrastructure_dependencies: []
acceptance_criteria:
  - >-
    docs/decisions-index.json carries a currency field on every live:true entry and on no live:false entry,
    with values drawn only from the vocabulary declared in docs/contracts/decision-entry.yaml.
  - >-
    Decision 44 and Decision 58 derive 'superseded_compacted'; Decision 37 (victim-side pointer) and
    Decision 80 (inbound supersedes edge from Decision 104's "partially supersedes Decision 80 point 3"
    heading) both derive 'superseded_pointer'; Decision 43 and Decision 67 derive 'amended'; Decision 168
    derives 'current'. Additionally the superseded_compacted SET equals the set of live entries carrying a
    '**Status:** Superseded' marker -- structural and count-free, so it survives corpus growth (both are
    {44, 58} today). The live distribution measured at planning time (91 current, 26 amended, 2
    superseded_pointer, 2 superseded_compacted) is INFORMATIONAL: no verification step pins those counts,
    because VP step 1 is graduated and a pinned count would red-line every unrelated PR adding a Decision.
  - >-
    validate_decision_currency is registered, glob-gated, sequenced into --pre and full, re-exported in
    scripts/validate.py, and each of its five invariants has a synthetic fixture proving it FAILS when
    violated.
  - >-
    Invariant I1 asserts the DISCRIMINATING direction -- every LIVE entry whose status marker resolves to
    'Superseded' derives 'superseded_compacted' -- so a malformed compaction that a human reads as superseded
    but which silently falls out of the filterable class fails the build. The predicate is pinned: FIRST
    match of scripts.decisions_md._BOLD_STATUS_RE, group(1) split on '--', stripped, compared == 'Superseded'.
    A PLAIN SUBSTRING match ('**Status:** Superseded' in block) is FORBIDDEN: measured, it matches 15
    entries including live Decisions 149 and 160, which merely QUOTE the marker in their bodies, and would
    red-line CI on day one. (findall over _BOLD_STATUS_RE with the same '--' normalization happens to yield
    the same {44, 58} as first-match today, but first-match is the pinned spelling because it is what
    is_compacted_stub already uses.)
  - >-
    The decision-scout skill's step 7 branches on currency, names 'superseded_compacted' as the only
    demoting value, states 'superseded_pointer' is never filtered and never severity-reduced, and the skill
    file is at or below its config/prose_budgets.yaml entry.
  - >-
    Exactly one compaction-stub predicate definition exists (in scripts/decisions_md.py); the conformance
    check reaches it through an alias and its existing test suite -- including the parametrized
    _is_compacted_stub cases -- passes UNCHANGED.
  - >-
    docs/decisions-index.json remains under the 131,000-byte pin and bin/venv-python -m scripts.validate
    --pre exits 0.
verification_plan:
  - step: 1
    phase: pre-deploy
    action: >-
      Exercise the derivation against the real corpus and assert the token for each representative class,
      including the inbound-edge case an earlier draft of this plan missed.
    command: "bin/venv-python -c \"import yaml, pathlib; from scripts.decisions_index import build_index; from scripts.decisions_md import parse_decisions_md, status_is_superseded; ds=build_index()['decisions']; d={e['number']:e for e in ds}; exp={44:'superseded_compacted',58:'superseded_compacted',37:'superseded_pointer',80:'superseded_pointer',43:'amended',67:'amended',168:'current'}; bad={n:(d[n].get('currency'),v) for n,v in exp.items() if d[n].get('currency')!=v}; assert not bad, bad; vocab=set(yaml.safe_load(pathlib.Path('docs/contracts/decision-entry.yaml').read_text())['currency']['values']); live=[e for e in ds if e['live']]; assert all(e.get('currency') in vocab for e in live), [e['number'] for e in live if e.get('currency') not in vocab]; rows={r['decision_id']:r['raw_block'] for r in parse_decisions_md()}; marked={n for n,b in rows.items() if status_is_superseded(b)}; compacted={e['number'] for e in live if e['currency']=='superseded_compacted'}; assert compacted==(marked & {e['number'] for e in live}), (sorted(compacted), sorted(marked)); print('derivation OK; compacted set ==', sorted(compacted))\""
    expected: >-
      Exits 0. The seven named entries carry their expected tokens, every live entry's token is in the
      contract vocabulary, and the superseded_compacted SET equals the set of live entries carrying a
      '**Status:** Superseded' marker. All three assertions are structural and count-free, so they survive
      corpus growth.
    fix_if: >-
      A mismatch on 37 or 80 means supersession is being read from only one edge direction; both the
      victim-side pointer and the inbound supersedes edge must yield 'superseded_pointer'. A set mismatch on
      the last assertion means a marked entry failed to derive the filterable token (a malformed compaction)
      or an unmarked entry acquired it. Do NOT pin raw counts here: this step is graduated, and a count would
      red-line every unrelated PR that adds a Decision.
    hermetic: true
    graduation: graduate
    graduation_check_id: "decisions-index-currency-derivation"
  - step: 2
    phase: pre-deploy
    action: >-
      Prove invariant I1 is DISCRIMINATING rather than definitional, using the check's own synthetic
      failing fixtures. No tracked file is mutated: the failing corpora are injected, so there is no
      restore path to get wrong.
    command: "bash -c \"grep -q 'class TestInvariantsFailWhenViolated' tests/checks/decisions/test_validate_decision_currency.py || { echo 'required failing-fixture class absent'; exit 1; }; bin/venv-python -m pytest 'tests/checks/decisions/test_validate_decision_currency.py::TestInvariantsFailWhenViolated' -q\""
    expected: >-
      The grep guard confirms TestInvariantsFailWhenViolated exists, then every test in it passes. The
      existence guard is mandatory: `pytest -k` matching nothing exits 0 with '0 selected' (measured), so a
      selector-only step would pass vacuously if the class were never written. That class must hold one test
      per invariant (five); the count is the implementer's obligation under test_obligations, not something
      this command asserts. The I1 fixture is the load-bearing one: an entry carrying '**Status:** Superseded' whose pointer is absent must FAIL the
      check, proving I1 asserts status-marker implies compacted rather than restating the derivation.
    fix_if: >-
      If an I1 fixture passes the check instead of failing it, the invariant was written in the definitional
      direction (compacted implies markers), which can never fire because the derivation IS that predicate.
      Invert it to the converse direction.
    hermetic: false
    graduation: waive
    graduation_waiver_reason: >-
      This is a pytest selector over fixtures that exist only to fail; the steady-state invariant it proves
      is already enforced continuously by validate_decision_currency in both tiers, so a registry row would
      duplicate a live gate rather than add a signal.
  - step: 3
    phase: pre-deploy
    action: Assert the live-rows-only projection, so archive rows are not thickened ahead of rec-3012's skeletonization.
    command: "bin/venv-python -c \"from scripts.decisions_index import build_index; ds=build_index()['decisions']; miss=[e['number'] for e in ds if e['live'] and 'currency' not in e]; extra=[e['number'] for e in ds if not e['live'] and 'currency' in e]; assert not miss and not extra, (miss, extra); print('live-only projection OK; live', sum(1 for e in ds if e['live']))\""
    expected: "Exits 0. Every live:true row has a currency key; no live:false row has one."
    fix_if: >-
      Entries in 'extra' mean archive rows are being thickened, which Decision 166's deferral to rec-3012
      asks to avoid. If tests/test_decisions_index.py::test_entry_shape_is_the_stable_projection_only fails
      at step 9, that is expected: it asserts an exact 12-key set for EVERY entry and must be updated.
    hermetic: true
    graduation: waive
    graduation_waiver_reason: >-
      Duplicates invariant I2 of validate_decision_currency, which asserts the same live-only shape on every
      run of both tiers.
  - step: 4
    phase: pre-deploy
    action: >-
      Prove the contract vocabulary is causal by removing it: confirm the check FAILS against a contract
      copy whose currency vocabulary omits a token the corpus actually emits.
    command: "bash -c \"grep -q 'class TestContractVocabularyIsCausal' tests/checks/decisions/test_validate_decision_currency.py || { echo 'required vocabulary fixture class absent'; exit 1; }; bin/venv-python -m pytest 'tests/checks/decisions/test_validate_decision_currency.py::TestContractVocabularyIsCausal' -q\""
    expected: >-
      Collects at least one vocabulary fixture and it passes. The fixture feeds the check a contract whose
      values list omits 'superseded_pointer' while the corpus emits it, and the check must report a
      violation. The collection-count guard is mandatory for the same reason as step 2.
    fix_if: >-
      If the check passes against the truncated vocabulary, it is reading its token list from the generator
      rather than the contract, which reduces the contract section to a mention with no reader.
    hermetic: false
    graduation: waive
    graduation_waiver_reason: >-
      Duplicates invariant I3 of validate_decision_currency; the fixture exists to prove the invariant
      discriminates, and the invariant itself already runs in both tiers.
  - step: 5
    phase: pre-deploy
    action: >-
      Assert the single-parser rule by object identity, and that the promotion was verbatim rather than a
      re-implementation.
    command: "bin/venv-python -c \"import scripts.decisions_md as m, scripts.checks.decisions.validate_decision_entry_conformance as c, pathlib; assert c._is_compacted_stub is m.is_compacted_stub, 'checks module does not reach the shared predicate object'; assert pathlib.Path('scripts/checks/decisions/validate_decision_entry_conformance.py').read_text().count('def _is_compacted_stub')==0; print('single-parser rule OK (identity-checked)')\""
    expected: >-
      Exits 0. The identity check is the discriminating assertion: a re-implemented copy would satisfy a
      name grep but fail 'is'.
    fix_if: >-
      An identity failure means the alias was implemented as a wrapper function or a second definition; make
      it a direct module-level alias so the two consumers cannot drift.
    hermetic: true
    graduation: graduate
    graduation_check_id: "compaction-stub-predicate-single-source"
  - step: 6
    phase: pre-deploy
    action: >-
      Assert the consumer contract in the gate text itself: step 7 names the only demoting token, states the
      never-filtered rule, and retains no status-prose fallback.
    command: "bash -c \"rg -q 'superseded_compacted' .claude/skills/decision-scout/SKILL.md && rg -q 'NEVER filtered and NEVER severity-reduced' .claude/skills/decision-scout/SKILL.md && test $(rg -c 'whose status is active' .claude/skills/decision-scout/SKILL.md || echo 0) -eq 0 && echo 'consumer contract present'\""
    expected: "Prints 'consumer contract present'."
    fix_if: >-
      A missing clause means the skill was repointed without the safety rule, which would let an
      implementation demote superseded_pointer and reproduce the exact aggressive-filter defect this plan
      exists to prevent. Note these are presence/absence checks, not semantic ones -- invariant I5 carries
      all three continuously (including the absence half, so the prose branch cannot be reintroduced later),
      and neither can prove the LLM honours the clause at dispatch time.
    hermetic: true
    graduation: waive
    graduation_waiver_reason: >-
      Duplicates invariant I5 of validate_decision_currency, which asserts the same three conditions --
      both presence clauses AND the absence of the status-prose fallback -- against the skill file on every
      run of both tiers.
  - step: 7
    phase: pre-deploy
    action: >-
      Assert the skill file landed within its prose budget as measured against the ORIGIN/MAIN budget value,
      not the same-commit ratcheted one, so the assertion cannot be satisfied by moving the goalposts.
    command: "bin/venv-python -c \"import pathlib; n=len(pathlib.Path('.claude/skills/decision-scout/SKILL.md').read_bytes()); assert n<=11325, (n, 11325); print(f'skill {n} B within the pre-existing 11,325 B budget')\""
    expected: >-
      Exits 0. The measured formulation lands at 11,315 B against the 11,325 B baseline; the budget entry is
      then ratcheted down to the measured size in the same commit.
    fix_if: >-
      Over budget means the rewrite did not pay for itself. Shorten the step-7 clause. Do NOT add a raise
      marker: under Decision 165 it requires a Decision body naming this skill path and this plan mints none,
      and Decision 160 point 7 deliberately removed the previous marker. If it cannot fit, ABORT the skill
      edit and re-plan the consumer half; the projection half still ships and is independently useful.
    hermetic: true
    graduation: waive
    graduation_waiver_reason: >-
      validate_prose_limits already enforces every S4 entry against config/prose_budgets.yaml on every --pre
      run, so a registry row would duplicate a live pre-merge gate.
  - step: 8
    phase: pre-deploy
    action: >-
      Confirm the committed index is drift-free. Read-only by design: regeneration is an execution step,
      never a verification step, so this stays safe under validate_vp_replay.
    command: bin/venv-python -m scripts.decisions_index --check
    expected: "Prints 'Decisions index is current.' and exits 0."
    fix_if: >-
      Drift means the committed artifact was not regenerated. Run
      bin/venv-python -m scripts.decisions_index --write, then re-run this step.
    hermetic: true
    graduation: waive
    graduation_waiver_reason: >-
      validate_decisions_index_freshness is already a registered, UNGATED --pre check performing exactly this
      drift comparison (scripts/checks/registry.py:116).
  - step: 9
    phase: pre-deploy
    action: Run the full test suite for every touched module, including the new unit coverage.
    command: >-
      bin/venv-python -m pytest tests/decisions_md/ tests/test_decisions_index.py
      tests/checks/decisions/test_validate_decision_entry_conformance.py
      tests/checks/decisions/test_validate_decision_currency.py -q
    expected: >-
      All tests pass. The pre-existing conformance suite -- including the parametrized
      'superseded_with_pointer' case, which has NO **Date:** marker and expects True -- passes UNCHANGED,
      because the predicate is promoted verbatim rather than strengthened.
    fix_if: >-
      A failure on 'superseded_with_pointer' means the predicate was strengthened during promotion. Revert
      to the verbatim two-marker logic: that test file is at exactly 500 SLOC and cannot absorb an edit, and
      the four-marker variant classifies the identical set on the real corpus, so the strengthening buys
      nothing and costs a forbidden oracle edit.
    hermetic: false
    graduation: waive
    graduation_waiver_reason: >-
      These selectors already run under both validate tiers via the standing pytest gate; a registry row
      would restate the pytest invocation without adding an independent signal.
  - step: 10
    phase: pre-deploy
    action: Confirm the index stays under its byte pin and report remaining headroom.
    command: "bin/venv-python -c \"import pathlib; n=len(pathlib.Path('docs/decisions-index.json').read_bytes()); assert n<=131000, n; print(f'index {n} B, headroom {131000-n} B of the 131,000 B pin')\""
    expected: >-
      Exits 0. Measured projection is 115,871 B with 15,129 B of headroom, against a 112,314 B baseline
      (+3,557 B).
    fix_if: >-
      Materially less headroom than about 15,100 B means more than the currency string was projected (an
      amended_by list or a currency_basis field). Remove the extra field; do not raise the pin, which
      Decision 166 reversal condition (g) reserves for landing rec-3012 first.
    hermetic: true
    graduation: waive
    graduation_waiver_reason: >-
      tests/test_decisions_index.py already pins the committed index against _COMMITTED_INDEX_MAX_BYTES in a
      standing assertion.
  - step: 11
    phase: pre-deploy
    action: >-
      Run the authoritative fast-tier presubmit (which now includes the new currency check), then the FULL
      tier. Both are required: this plan declares handoff_policy.full_validation_required_before_commit, and
      validate_handoff_full_tier rejects any segment containing --pre, so a --pre-only plan fails that gate
      on its own PR. The chained form satisfies the matcher's second segment.
    command: bin/venv-python -m scripts.validate --pre && bin/venv-python -m scripts.validate
    expected: >-
      Both invocations exit 0, with validate_decision_currency, validate_decisions_index_freshness,
      validate_prose_limits, validate_sloc_limits, validate_structural_size_limits,
      validate_handoff_full_tier and validate_verification_registry all passing.
    fix_if: >-
      A KeyError on validate_decision_currency means the scripts/validate.py facade re-export line is
      missing. A validate_sloc_limits failure names the file: scripts/validate.py is at 498 of 500 SLOC, so
      the re-export takes it to 499, leaving ONE line of headroom -- if it crosses, the re-export block is
      the wrong place to absorb it, so decompose per Decision 80's facade pattern rather than registering a
      budget entry for the repo's central gate file; tests/test_decisions_index.py is at 457. If tests/test_decisions_index.py crosses 500 (457 today, real headroom), do NOT
      create a tests/decisions_index/ package: scripts/decisions_index.py is absent from
      _CONCERN_SPLIT_TEST_PACKAGES and _RETIRING_GRANDFATHER_HOMES is empty, so it mirrors to the FLAT file
      and a package would fail check_test_file_exists. Move the integration spot-checks into
      tests/decisions_md/test_currency.py (already in scope) instead.
    hermetic: false
    graduation: waive
    graduation_waiver_reason: >-
      The presubmit IS the gate; it passes at origin/main, so a registry row would be tautological and
      inadmissible under the VF-06 origin-must-FAIL differential.
  - step: 12
    phase: post-deploy
    action: Confirm the bundled recommendations closed after the squash merge carried the Resolves trailer.
    command: "bin/venv-python -m scripts.ops_data_portal --sync && bin/venv-python -c \"import json, pathlib; rows=[json.loads(l) for l in pathlib.Path('logs/.recommendations-log.jsonl').read_text().splitlines() if l.strip()]; latest={r['id']: r for r in rows}; bad={i: latest.get(i,{}).get('status') for i in ('rec-3055','rec-3056') if latest.get(i,{}).get('status')!='closed'}; assert not bad, bad; print('rec-3055 and rec-3056 closed')\""
    expected: Exits 0. Both recommendations report status 'closed' in the refreshed read cache.
    fix_if: >-
      A non-closed status means rec-autoclose.yml did not fire. Fall back to
      bin/venv-python -m scripts.ops_data_portal --update-rec rec-NNNN --status closed --resolution "..."
      per Decision 70. Never call scripts.sync.ops directly and never hand-edit the read cache.
test_obligations:
  - source: scripts/decisions_md.py
    behavior: >-
      is_compacted_stub is the promoted two-marker predicate, byte-for-byte in behaviour; derive_currency
      returns 'superseded_compacted' only for a stub, 'superseded_pointer' for a victim-side pointer OR an
      inbound supersedes edge, 'amended' for an inbound amends edge or a status-prose amendment, else
      'current' -- in that precedence order.
    verification_step: 9
    test_selector: tests/decisions_md/test_currency.py
    red_green_expectation: >-
      Red before (neither symbol exists), green after. The discriminating cases are synthetic: a row that is
      both a stub and amended must resolve to 'superseded_compacted', and a row with only an inbound
      supersedes edge must resolve to 'superseded_pointer'. The real corpus discriminates stub-vs-pointer on
      its own (D44 and D58 are stubs AND carry inbound supersedes edges from 117 and 76), but holds no entry
      discriminating stub-vs-amended or pointer-vs-amended, which is why those two need synthetic rows.
  - source: scripts/decisions_index.py
    behavior: >-
      currency is projected onto live:true rows only, and build_index stays byte-stable across two
      consecutive calls. The generator never raises on an unexpected value.
    verification_step: 9
    test_selector: tests/test_decisions_index.py
    red_green_expectation: >-
      Red before (no currency key on any row), green after. test_entry_shape_is_the_stable_projection_only
      must be updated in the same commit to branch on live; the determinism and byte-pin tests stay green.
  - source: scripts/checks/decisions/validate_decision_currency.py
    behavior: >-
      Five invariants fail loudly when violated: I1 an entry with a '**Status:** Superseded' marker that does
      not derive superseded_compacted; I2 currency present on an archive row or missing from a live row; I3
      an emitted value outside the contract vocabulary; I4 a live entry carrying a Reversed or Deferred
      status marker not listed in the empty-at-install grandfather hook; I5 the decision-scout skill missing
      either consumer-contract clause OR carrying the status-prose fallback ("whose status is active")
      again -- I5 is presence-AND-absence, so reintroducing the prose branch fails the build.
    verification_step: 9
    test_selector: tests/checks/decisions/test_validate_decision_currency.py
    red_green_expectation: >-
      Red before (module absent), green after, with one passing and one deliberately-FAILING synthetic
      fixture per invariant so no invariant can pass vacuously. I1's failing fixture is load-bearing.
  - source: scripts/checks/decisions/validate_decision_entry_conformance.py
    behavior: >-
      Compacted-stub exemption behaviour is unchanged after the private predicate becomes an alias, and
      _is_compacted_stub remains importable by name for the existing parametrized test.
    verification_step: 9
    test_selector: tests/checks/decisions/test_validate_decision_entry_conformance.py
    red_green_expectation: >-
