    returning one token, evaluated in this order: 'superseded' if is_compacted_stub; else
    'superseded_cited' if the row has a superseded_by pointer; else 'amended' if the row has any inbound
    amends edge OR its status begins with 'Amended'; else 'current'. Inbound amends requires corpus-wide
    context, so accept the inverted edge map as a parameter rather than recomputing it per row.
  - >-
    scripts/checks/decisions/validate_decision_entry_conformance.py -- delete the private _is_compacted_stub
