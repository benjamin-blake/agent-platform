rollback: >-
  Fully revertible in one commit: the change is additive to a generated projection plus a prose repoint.
  Reverting scripts/decisions_index.py and regenerating with
  bin/venv-python -m scripts.decisions_index --write restores the previous index byte-for-byte (build_index
  is deterministic and excludes volatile fields). Reverting the skill and prose-budget edits restores the
  status-prose branch. The predicate promotion in scripts/decisions_md.py is behaviour-preserving and may
  be left in place independently. No corpus entry, warehouse row, or deployed artifact is touched, so there
  is no data migration to unwind.
