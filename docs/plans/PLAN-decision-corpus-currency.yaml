execution_steps:
  - >-
    scripts/decisions_md.py -- add a public is_compacted_stub(block) requiring ALL FOUR Decision 149 stub
    markers, sourcing their spellings from docs/contracts/decision-entry.yaml
    compaction.stub_grammar.body_markers (match on the marker prefix, not the angle-bracket placeholder
    text). Add derive_currency(row, superseded_by_inbound, amended_by_inbound) evaluated in this precedence:
    'superseded_compacted' if is_compacted_stub; else 'superseded_pointer' if the row has a victim-side
    superseded_by OR an inbound supersedes edge; else 'amended' if it has an inbound amends edge OR its
    status begins with 'Amended'; else 'current'. Corpus-wide edge maps are parameters, never recomputed
    per row.
  - >-
    scripts/checks/decisions/validate_decision_entry_conformance.py -- replace the private
    _is_compacted_stub function body with a module-level alias `_is_compacted_stub = is_compacted_stub`
    imported from scripts.decisions_md. Do NOT delete the private name: line 22 of its test imports it
    directly and that test file is at exactly 500 SLOC.
  - >-
    docs/contracts/decision-entry.yaml -- add a currency section with `values` (the four tokens), a per-token
    derivation rule, a consumer_contract stating only superseded_compacted may filter and the others annotate
    without reducing severity, and an explicit note recording that Reversed/Deferred are outside the
    vocabulary with invariant I4 as the guard. Cross-reference compaction.stub_grammar rather than restating it.
  - >-
    scripts/decisions_index.py -- build the two inverted edge maps once per build_index() call, project
    currency onto live rows only, and validate each emitted value against the contract vocabulary at
    projection time, raising on divergence. Preserve byte-stability. Extend the module docstring's
    field-derivation list.
  - >-
    scripts/checks/decisions/validate_decision_currency.py -- new registered check with four invariants: I1
    every superseded_compacted entry carries all four stub markers (read from the contract, checked against
    the raw block); I2 currency is present on exactly the live rows; I3 every emitted value is in the
    contract vocabulary; I4 no live entry carries a Reversed or Deferred status marker. Add a fifth
    consumer-side assertion that the decision-scout skill names superseded_compacted and the literal "NEVER
    filtered".
  - >-
    scripts/checks/registry.py -- sequence validate_decision_currency into the --pre and full tiers next to
    the sibling decisions checks. scripts/validate.py -- add the matching
    `from scripts.checks.decisions.validate_decision_currency import validate_decision_currency  # noqa:
    F401,E402` re-export line.
  - >-
    .claude/skills/decision-scout/SKILL.md -- replace Phase 2 step 7 with the currency branch, add `currency`
    to the Phase 1 step 1 field enumeration, and delete the "Citing reversed decisions as governing"
    anti-pattern. Measure the byte count before and after; the target is approximately 11,304 B.
  - >-
    config/prose_budgets.yaml -- ratchet the S4 decision-scout entry down to the measured post-edit size.
  - >-
    tests/decisions_md/test_currency.py -- unit coverage for both symbols including synthetic PRECEDENCE
    cases (a stub that also has an inbound amends edge must resolve to superseded_compacted; a three-marker
    near-stub must not) and both inbound-edge cases.
  - >-
    tests/checks/decisions/test_validate_decision_currency.py -- one passing and one deliberately-failing
    fixture per invariant, so no invariant can pass vacuously.
  - >-
    tests/test_decisions_index.py -- add the corpus spot-checks and the live-only invariant, and UPDATE
    test_entry_shape_is_the_stable_projection_only (lines 49-66) to branch on live rather than assert a
    single fixed key set. Watch the 500 SLOC limit; decompose per Decision 128/131 if crossed.
  - >-
    Regenerate the committed index -- bin/venv-python -m scripts.decisions_index --write.
  - >-
    Execute the Verification Plan -- run each step, loop until pass. On an unrecoverable failure, stop and
    run RCA rather than working around it (Decision 55).
  - >-
    Commit with "Resolves: rec-3055, rec-3056" in the squash-merge commit body. When closing rec-3055, state
    in its resolution that the shipped fix reframes the filed one (status-prose keying was the defect;
    keying on superseded_by would have been the more dangerous bug).
  - >-
    Report: what was implemented, the measured index size and headroom, the measured skill size against its
    budget, and the verification results.
work_areas: []
rollback: >-
  Revertible in one commit, with one caveat stated honestly. Reverting scripts/decisions_index.py and
  regenerating restores the previous index byte-for-byte (build_index is deterministic and excludes volatile
  fields). Reverting the skill, prose-budget, registry-sequence and validate.py re-export restores the prior
  gate behaviour; the new check module can be deleted or left inert. The predicate promotion in
  scripts/decisions_md.py is behaviour-preserving and may be left in place independently. No corpus entry,
  warehouse row, or deployed artifact is touched. The caveat: the blocking gate itself is the live surface,
  so any plan scoped between merge and revert was scoped under the new filter and is not retroactively
  re-scoped by the revert.
