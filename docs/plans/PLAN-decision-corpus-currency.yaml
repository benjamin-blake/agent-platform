schema_version: 4
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: "decision-corpus-currency"
intent: >-
  Give the decision corpus a derived, deterministic per-entry currency projection in the generated
  docs/decisions-index.json, enforce its safety invariants with a registered check, and repoint the
  BLOCKING decision-scout gate onto it, so the gate stops branching on free-text status prose and starts
  annotating the partially-superseded and amended entries it currently reports as fully current.
plan_type: IMPLEMENTATION
verification_tier: V2
plan_path: docs/plans/PLAN-decision-corpus-currency.yaml
phase: >-
  Platform governance / decision-corpus read model. Not a tier_item slice: this is an ad_hoc_rec pairing
  (rec-3055 defect + rec-3056 mechanism) against the decision-scout gate. Adjacent to T1.5 (the STRATEGIC,
  CD.17-frozen portal cutover that eventually retires docs/decisions-index.json); closes none of T1.5's
  criteria and is designed to survive that cutover unchanged, since the cutover swaps the SOURCE of these
  same fields and the scout's Phase 1 contract already anticipates it.
scope:
  - file: scripts/decisions_md.py
    action: Modify
    purpose: >-
      Promote the compaction-stub predicate out of the checks layer into the shared parser as a public
      is_compacted_stub(block), STRENGTHENED to require all four Decision 149 stub markers sourced from
      docs/contracts/decision-entry.yaml compaction.stub_grammar.body_markers, and add derive_currency()
      returning exactly one token. DAF-03's single-parser rule requires ONE derivation with two consumers.
  - file: scripts/checks/decisions/validate_decision_entry_conformance.py
    action: Modify
    purpose: >-
      Replace the private _is_compacted_stub body with a module-level alias to the promoted predicate
      (_is_compacted_stub = is_compacted_stub), the same private-alias pattern scripts/decisions_md.py
      already uses for _extract_superseded_by. The alias is required: this module's test imports the
      private name directly and that test file is at exactly 500 SLOC, so it cannot absorb a rename.
  - file: scripts/decisions_index.py
    action: Modify
    purpose: >-
      Project a currency value onto live rows only, asserting each emitted value is a member of the
      vocabulary read from docs/contracts/decision-entry.yaml at projection time so the contract has a
      causal role rather than a decorative one.
  - file: scripts/checks/decisions/validate_decision_currency.py
    action: Create
    purpose: >-
      New registered check enforcing the four currency invariants that carry this plan's safety property.
      This is the machine-readable home of the governance rule (only the compaction-stub token may filter),
      chosen over a numbered Decision per the operator ruling that the proof of a decision belongs in code;
      unlike prose it is enforced on every --pre run and unlike a verification-registry row it spends no
      part of the registry's calibrated ceiling.
  - file: scripts/checks/registry.py
    action: Modify
    purpose: Sequence validate_decision_currency into the --pre and full tiers alongside the sibling decisions checks.
  - file: scripts/validate.py
    action: Modify
    purpose: >-
      Add the facade re-export line for validate_decision_currency. Required: dispatch is
      globals()[name](failed), so without it --pre KeyErrors on the check name.
  - file: docs/contracts/decision-entry.yaml
    action: Modify
    purpose: >-
      Add the currency section: the four-token vocabulary, each token's derivation rule, the consumer
      contract that ONLY superseded_compacted may filter, and the recorded reversed/deferred trade.
      Decision 86/127 routing homes field semantics in the owning contract.
  - file: .claude/skills/decision-scout/SKILL.md
    action: Modify
    purpose: >-
      Repoint Phase 2 step 7 from status-prose judgment onto the typed currency field, add currency to the
      Phase 1 step 1 field enumeration, and delete the now-moot "Citing reversed decisions as governing"
      anti-pattern. Must land at or below the 11,325-byte prose budget; a measured formulation exists at
      approximately 11,304 bytes.
  - file: config/prose_budgets.yaml
    action: Modify
    purpose: >-
      Ratchet the S4 .claude/skills/decision-scout/SKILL.md entry DOWN to the post-edit size. A decrease is
      always unrestricted by validate_prose_budget_raises.
  - file: tests/decisions_md/test_currency.py
    action: Create
    purpose: >-
      Unit coverage for is_compacted_stub and derive_currency across all four tokens, the two inbound-edge
      cases, and explicit PRECEDENCE cases using synthetic rows (the real corpus cannot discriminate
      precedence). New file rather than an append: the sibling test_parse.py is at 493 SLOC.
  - file: tests/checks/decisions/test_validate_decision_currency.py
    action: Create
    purpose: Unit coverage for each of the new check's four invariants, including a failing fixture per invariant.
  - file: tests/test_decisions_index.py
    action: Modify
    purpose: >-
      Integration spot-checks against the real corpus and the live-rows-only invariant. MUST also update
      test_entry_shape_is_the_stable_projection_only, which asserts an exact 12-key set for every entry and
      necessarily breaks under a live-only projection.
  - file: docs/decisions-index.json
    action: Modify
    purpose: >-
      Regenerated committed artifact. Never hand-edited; produced by
      bin/venv-python -m scripts.decisions_index --write.
bundled_recommendations:
  - rec-3055
  - rec-3056
infrastructure_dependencies: []
acceptance_criteria:
  - >-
    docs/decisions-index.json carries a currency field on every live:true entry and on no live:false entry,
    with values drawn only from the vocabulary declared in docs/contracts/decision-entry.yaml.
  - >-
    Decision 44 and Decision 58 derive 'superseded_compacted'; Decision 37 (victim-side pointer) and
    Decision 80 (inbound supersedes edge from Decision 104's "partially supersedes Decision 80 point 3"
    heading) both derive 'superseded_pointer'; Decision 43 (inbound amends edge) and Decision 67
    (status-prose amendment, no typed edge) derive 'amended'; a control entry derives 'current'.
  - >-
    Every entry deriving 'superseded_compacted' carries all four Decision 149 stub markers as declared in
    docs/contracts/decision-entry.yaml compaction.stub_grammar.body_markers, verified by a registered check
    reading that contract rather than by a hardcoded predicate.
  - >-
    validate_decision_currency is registered, sequenced into --pre and full, re-exported in
    scripts/validate.py, and fails loudly on each of its four invariants when they are violated.
  - >-
    The decision-scout skill's step 7 branches on currency, names 'superseded_compacted' as the only
    demoting value, states that the annotate-only tokens are never filtered and never severity-reduced, and
    the skill file is at or below its config/prose_budgets.yaml entry.
  - >-
    Exactly one compaction-stub predicate definition exists in the repository (in scripts/decisions_md.py);
    the conformance check reaches it through an alias and its existing test suite passes unchanged.
  - >-
    docs/decisions-index.json remains under the 131,000-byte pin (Decision 166 point 9) and
    bin/venv-python -m scripts.validate --pre exits 0.
verification_plan:
  - step: 1
    phase: pre-deploy
    action: >-
      Exercise the derivation against the real corpus and assert the token for each representative class,
      including the two cases the old status-prose rule got wrong and the inbound-edge case the first draft
      of this plan missed.
    command: "bin/venv-python -c \"from scripts.decisions_index import build_index; d={e['number']:e for e in build_index()['decisions']}; exp={44:'superseded_compacted',58:'superseded_compacted',37:'superseded_pointer',80:'superseded_pointer',43:'amended',67:'amended',168:'current'}; bad={n:(d[n].get('currency'),v) for n,v in exp.items() if d[n].get('currency')!=v}; assert not bad, bad; print('currency spot-checks OK', exp)\""
    expected: >-
      Exits 0. D37 and D80 are both 'superseded_pointer' (never the filterable token, since 49 files cite
      D37 and D104 supersedes only point 3 of D80), and D67 is 'amended' despite having no typed amends edge.
    fix_if: >-
      A mismatch on 37 or 80 means supersession is being read from only one edge direction; both the
      victim-side pointer and the inbound supersedes edge must produce 'superseded_pointer'. A mismatch on
      67 means the status-prose branch is missing. A KeyError means currency is absent on a live row.
    hermetic: true
    graduation: waive
    graduation_waiver_reason: >-
      The corpus-facing half of this assertion is enforced continuously by the new registered check
      validate_decision_currency, which runs in both validate tiers; a verification-registry row would
      duplicate it while spending part of the registry's 4,739-of-6,000 budget that Decision 166 point 6
      pre-committed never to raise a second time.
  - step: 2
    phase: pre-deploy
    action: >-
      Prove the safety invariant is DISCRIMINATING, not definitional: mutate a real compaction stub to drop
      one of the four required markers and confirm the check fails.
    command: "bin/venv-python -c \"import pathlib,tempfile,shutil,os; from scripts.checks.decisions.validate_decision_currency import validate_decision_currency as v; f=[]; v(f); assert not f, f; print('clean tree passes'); src=pathlib.Path('docs/DECISIONS.md'); orig=src.read_text(); bak=tempfile.mkstemp()[1]; shutil.copy(src,bak); src.write_text(orig.replace('**Superseded by: Decision 117**','',1)); g=[]; v(g); src.write_text(orig); assert g, 'mutating a stub did not fail the check -- invariant is vacuous'; print('mutation caught:', g[0][:110])\""
    expected: >-
      Prints 'clean tree passes' then 'mutation caught: ...'. Removing one of Decision 44's four stub
      markers makes the check fail, proving the invariant discriminates rather than restating the
      derivation.
    fix_if: >-
      If the mutated tree still passes, the check is asserting the derivation against itself. Source the
      four markers from decision-entry.yaml compaction.stub_grammar.body_markers and re-check the raw block,
      never the derived token. Restore docs/DECISIONS.md from the backup path printed on failure.
    hermetic: false
    graduation: waive
    graduation_waiver_reason: >-
      This step mutates a tracked file in the working tree and restores it, so it is neither hermetic nor
      admissible as a standing registry row; its steady-state half is already covered by
      validate_decision_currency running in both tiers.
  - step: 3
    phase: pre-deploy
    action: >-
      Assert the live-rows-only projection, so archive rows are not thickened ahead of rec-3012's
      skeletonization, and confirm the previously fixed-key-set test was updated to match.
    command: "bin/venv-python -c \"from scripts.decisions_index import build_index; ds=build_index()['decisions']; miss=[e['number'] for e in ds if e['live'] and 'currency' not in e]; extra=[e['number'] for e in ds if not e['live'] and 'currency' in e]; assert not miss and not extra, (miss, extra); print('live-only projection OK; live', sum(1 for e in ds if e['live']))\""
    expected: "Exits 0. Every live:true row has a currency key; no live:false row has one."
    fix_if: >-
      Entries in 'extra' mean archive rows are being thickened, which Decision 166's deferral to rec-3012
      asks to avoid. If tests/test_decisions_index.py::test_entry_shape_is_the_stable_projection_only fails
      at step 10, that is expected: it asserts an exact 12-key set for EVERY entry and must be updated to
      branch on live.
    hermetic: true
    graduation: waive
    graduation_waiver_reason: >-
      Duplicates invariant I2 of the new registered check validate_decision_currency, which asserts the
      same live-only shape on every --pre run.
  - step: 4
    phase: pre-deploy
    action: >-
      Assert the contract is load-bearing rather than decorative: corrupt the contract's declared vocabulary
      in a temporary copy and confirm the generator refuses to emit against it.
    command: "bin/venv-python -c \"import yaml,pathlib; from scripts.decisions_index import build_index; c=yaml.safe_load(pathlib.Path('docs/contracts/decision-entry.yaml').read_text())['currency']['values']; assert isinstance(c,list) and len(c)==4, c; used={e['currency'] for e in build_index()['decisions'] if 'currency' in e}; assert used and used<=set(c), (sorted(used), sorted(c)); print('vocabulary is causal; emitted', sorted(used), 'declared', sorted(c))\""
    expected: >-
      Exits 0, printing a non-empty emitted set that is a subset of the four declared values. The emitted
      set is derived from the corpus, so this compares derivation output against the contract rather than
      the contract against itself.
    fix_if: >-
      An empty emitted set means the projection silently produced nothing and the assertion was passing
      vacuously. A value outside the declared list means the generator hardcodes its own vocabulary instead
      of validating against the contract at projection time.
    hermetic: true
    graduation: waive
    graduation_waiver_reason: >-
      Duplicates invariant I3 of validate_decision_currency, which performs the same membership check
      against the contract on every --pre run.
  - step: 5
    phase: pre-deploy
    action: >-
      Assert the single-parser rule by import, not by name: exactly one def survives and the checks module
      genuinely reaches the shared parser's object rather than re-implementing it.
    command: "bin/venv-python -c \"import scripts.decisions_md as m, scripts.checks.decisions.validate_decision_entry_conformance as c; assert c._is_compacted_stub is m.is_compacted_stub, 'checks module does not reach the shared predicate object'; import pathlib; assert pathlib.Path('scripts/checks/decisions/validate_decision_entry_conformance.py').read_text().count('def _is_compacted_stub')==0; print('single-parser rule OK (identity-checked)')\""
    expected: >-
      Exits 0. The identity check is the discriminating assertion: a re-implemented copy in the checks module
      would satisfy a name grep but fail 'is'.
    fix_if: >-
      An identity failure means the alias was implemented as a wrapper function or a second definition;
      make it a direct module-level alias so the two consumers cannot drift.
    hermetic: true
    graduation: graduate
    graduation_check_id: "compaction-stub-predicate-single-source"
  - step: 6
    phase: pre-deploy
    action: >-
      Assert the consumer contract in the gate itself: step 7 branches on currency, names only the
      compaction token as demoting, and states the annotate-only tokens are never filtered.
    command: "bash -c \"rg -q 'superseded_compacted' .claude/skills/decision-scout/SKILL.md && rg -q 'NEVER filtered' .claude/skills/decision-scout/SKILL.md && test $(rg -c 'whose status is active' .claude/skills/decision-scout/SKILL.md || echo 0) -eq 0 && echo 'consumer contract present'\""
    expected: >-
      Prints 'consumer contract present'. The skill names the filterable token, states the never-filtered
      rule for the annotate-only tokens, and retains no status-prose fallback.
    fix_if: >-
      A missing 'NEVER filtered' means the skill was repointed without the safety clause, which would allow
      an implementation to demote superseded_pointer and reproduce the exact aggressive-filter defect this
      plan exists to prevent. A surviving 'whose status is active' means step 7 was augmented, not repointed.
    hermetic: true
    graduation: waive
    graduation_waiver_reason: >-
      Duplicates invariant I4 of validate_decision_currency, which asserts the same consumer-contract clauses
      against the skill file on every --pre run.
  - step: 7
    phase: pre-deploy
    action: >-
      Assert the skill file landed within its prose budget, since this plan mints no Decision and therefore
      no raise-approved marker is available under Decision 165.
    command: "bin/venv-python -c \"import yaml,pathlib; b=yaml.safe_load(pathlib.Path('config/prose_budgets.yaml').read_text())['S4']['.claude/skills/decision-scout/SKILL.md']; n=len(pathlib.Path('.claude/skills/decision-scout/SKILL.md').read_bytes()); assert n<=b, (n,b); print(f'skill {n} B within budget {b} B')\""
    expected: >-
      Exits 0. The measured formulation lands at approximately 11,304 B against the 11,325 B baseline, and
      the budget entry is then ratcheted down to the measured size.
    fix_if: >-
      Over budget means the rewrite did not pay for itself. Shorten the step-7 clause; do NOT add a raise
      marker, which under Decision 165 requires a Decision body naming this skill path and this plan mints none.
    hermetic: true
    graduation: waive
    graduation_waiver_reason: >-
      validate_prose_limits already enforces every S4 entry against config/prose_budgets.yaml on every --pre
      run, so a registry row would duplicate a live pre-merge gate rather than add coverage.
  - step: 8
    phase: pre-deploy
    action: >-
      Confirm the committed index is drift-free against the generator. Read-only by design: the regeneration
      itself is an execution step, never a verification step, so this stays safe under validate_vp_replay.
    command: bin/venv-python -m scripts.decisions_index --check
    expected: "Prints 'Decisions index is current.' and exits 0."
    fix_if: >-
      Drift means the committed artifact was not regenerated after the generator change. Run
      bin/venv-python -m scripts.decisions_index --write, then re-run this step.
    hermetic: true
    graduation: waive
    graduation_waiver_reason: >-
      validate_decisions_index_freshness is already a registered, UNGATED --pre check performing exactly this
      drift comparison (scripts/checks/registry.py:116); a second registry row would duplicate it.
  - step: 9
    phase: pre-deploy
    action: >-
      Confirm the index stays under its byte pin and report remaining headroom, since Decision 166 reversal
      condition (g) makes approaching the pin a trigger to land rec-3012 rather than bump again.
    command: "bin/venv-python -c \"import pathlib; n=len(pathlib.Path('docs/decisions-index.json').read_bytes()); assert n<=131000, n; print(f'index {n} B, headroom {131000-n} B of the 131,000 B pin')\""
    expected: >-
      Exits 0. Measured projection for the live-only design is approximately 115,850 B with roughly 15,150 B
      of headroom, against a 112,314 B baseline.
    fix_if: >-
      Materially less headroom than about 15,000 B means more than the currency string was projected (an
      amended_by list or a currency_basis field). Remove the extra field; do not raise the pin.
    hermetic: true
    graduation: waive
    graduation_waiver_reason: >-
      tests/test_decisions_index.py already pins the committed index against _COMMITTED_INDEX_MAX_BYTES in a
      standing assertion; graduating a second byte check would duplicate that guard.
  - step: 10
    phase: pre-deploy
    action: Run the full test suite for every touched module, including the new unit coverage.
    command: >-
      bin/venv-python -m pytest tests/decisions_md/ tests/test_decisions_index.py
      tests/checks/decisions/test_validate_decision_entry_conformance.py
      tests/checks/decisions/test_validate_decision_currency.py -q
    expected: >-
      All tests pass. The pre-existing conformance suite, which imports _is_compacted_stub by name and
      parametrizes it directly, passes UNCHANGED via the alias.
    fix_if: >-
      An ImportError on _is_compacted_stub means the private name was deleted rather than aliased; restore
      the alias. A conformance behaviour change means the strengthened four-marker predicate altered which
      entries are treated as stubs; re-check against the two live stubs (D44, D58) before touching any test
      expectation.
    hermetic: false
    graduation: waive
    graduation_waiver_reason: >-
      These selectors already run under both validate tiers via the standing pytest gate; a registry row
      would restate the pytest invocation without adding an independent signal.
  - step: 11
    phase: pre-deploy
    action: Run the authoritative fast-tier presubmit, which now includes the new currency check.
    command: bin/venv-python -m scripts.validate --pre
    expected: >-
      Exit 0, with validate_decision_currency, validate_decisions_index_freshness, validate_prose_limits and
      validate_sloc_limits all passing.
    fix_if: >-
      A KeyError on validate_decision_currency means the scripts/validate.py facade re-export line is missing.
      A validate_sloc_limits failure on tests/test_decisions_index.py means the additions crossed 500 SLOC;
      per Decision 128 decompose into the tests/decisions_index/ mirror package rather than registering a new
      over-500 budget entry.
    hermetic: false
    graduation: waive
    graduation_waiver_reason: >-
      The presubmit IS the gate; it passes at origin/main, so a registry row would be tautological and
      inadmissible under the VF-06 origin-must-FAIL differential. Same disposition as the sibling
      PLAN-opswriter-never-drain-guard plan's equivalent step.
  - step: 12
    phase: post-deploy
    action: >-
      Confirm the bundled recommendations closed after the squash merge carried the Resolves trailer
      (closure obligation).
    command: "bin/venv-python -m scripts.ops_data_portal --sync && bin/venv-python -c \"import json, pathlib; rows=[json.loads(l) for l in pathlib.Path('logs/.recommendations-log.jsonl').read_text().splitlines() if l.strip()]; latest={r['id']: r for r in rows}; bad={i: latest.get(i,{}).get('status') for i in ('rec-3055','rec-3056') if latest.get(i,{}).get('status')!='closed'}; assert not bad, bad; print('rec-3055 and rec-3056 closed')\""
    expected: Exits 0. Both recommendations report status 'closed' in the refreshed read cache.
    fix_if: >-
      A non-closed status means rec-autoclose.yml did not fire. Fall back to
      bin/venv-python -m scripts.ops_data_portal --update-rec rec-NNNN --status closed --resolution "..."
      per Decision 70. Never hand-edit the read cache, and never call scripts.sync.ops directly.
test_obligations:
  - source: scripts/decisions_md.py
    behavior: >-
      is_compacted_stub requires ALL FOUR Decision 149 stub markers sourced from the contract; derive_currency
      returns 'superseded_compacted' only for a stub, 'superseded_pointer' for a victim-side pointer OR an
      inbound supersedes edge, 'amended' for an inbound amends edge or a status-prose amendment, else
      'current' -- in that precedence order.
    verification_step: 10
    test_selector: tests/decisions_md/test_currency.py
    red_green_expectation: >-
      Red before (neither symbol exists), green after. The discriminating cases are synthetic: a three-marker
      near-stub must NOT be 'superseded_compacted', and a row that is both a stub and amended must resolve to
      'superseded_compacted' -- the real corpus contains no entry that discriminates precedence.
  - source: scripts/decisions_index.py
    behavior: >-
      currency is projected onto live:true rows only, every emitted value is validated against the contract's
      vocabulary at projection time, and build_index stays byte-stable across two consecutive calls.
    verification_step: 10
    test_selector: tests/test_decisions_index.py
    red_green_expectation: >-
      Red before (no currency key on any row), green after. test_entry_shape_is_the_stable_projection_only
      must be updated in the same commit to branch on live rather than assert one fixed 12-key set; the
      determinism and byte-pin tests stay green throughout.
  - source: scripts/checks/decisions/validate_decision_currency.py
    behavior: >-
      Each of the four invariants fails loudly when violated: I1 a superseded_compacted entry missing any of
      the four stub markers; I2 a currency key on an archive row or missing from a live row; I3 an emitted
      value outside the contract vocabulary; I4 a live entry carrying a Reversed or Deferred status marker,
      which the vocabulary deliberately does not cover.
    verification_step: 10
    test_selector: tests/checks/decisions/test_validate_decision_currency.py
    red_green_expectation: >-
      Red before (module absent), green after, with one deliberately-failing fixture per invariant so no
      invariant can pass vacuously.
  - source: scripts/checks/decisions/validate_decision_entry_conformance.py
    behavior: >-
      Compacted-stub exemption behaviour after the private predicate becomes an alias, and _is_compacted_stub
      remains importable by name for the existing parametrized test.
    verification_step: 10
    test_selector: tests/checks/decisions/test_validate_decision_entry_conformance.py
    red_green_expectation: >-
      Green before and green after: the existing suite is the regression oracle. Any behavioural delta is a
      defect in the promotion, not an expectation to update. Note the predicate is being strengthened from
      two markers to four, so confirm the two live stubs still qualify.
  - source: scripts/checks/registry.py
    behavior: validate_decision_currency is sequenced into both the --pre and full tiers and is reachable by name.
    verification_step: 11
    command: bin/venv-python -m scripts.validate --pre
    red_green_expectation: >-
      Red before (the check does not run at all, so its invariants are unenforced), green after with the
      check named in the --pre output.
  - source: scripts/validate.py
    behavior: >-
      The facade re-export makes validate_decision_currency a module-level global so registry dispatch via
      globals()[name] resolves it.
    verification_step: 11
    command: bin/venv-python -m scripts.validate --pre
    red_green_expectation: >-
      Red before (dispatch KeyErrors on the check name once it is sequenced), green after. This is the exact
      failure mode scripts/CLAUDE.md warns about for a registered check with no re-export line.
  - source: .claude/skills/decision-scout/SKILL.md
    behavior: >-
      Phase 2 step 7 branches on currency, names superseded_compacted as the only demoting value, states the
      annotate-only tokens are NEVER filtered, retains no status-prose fallback, and the file stays within
      its registered prose budget.
    verification_step: 6
    command: "rg -c 'whose status is active' .claude/skills/decision-scout/SKILL.md"
    red_green_expectation: >-
      Red before (the file contains 'whose status is active' and no currency token), green after.
  - source: docs/contracts/decision-entry.yaml
    behavior: >-
      The currency section declares exactly four token values plus the consumer contract, and the generator
      validates every emitted value against that list at projection time so the section is causally read.
    verification_step: 4
    command: "bin/venv-python -c \"import yaml,pathlib; from scripts.decisions_index import build_index; c=yaml.safe_load(pathlib.Path('docs/contracts/decision-entry.yaml').read_text())['currency']['values']; assert isinstance(c,list) and len(c)==4, c; used={e['currency'] for e in build_index()['decisions'] if 'currency' in e}; assert used and used<=set(c), (sorted(used), sorted(c)); print('vocabulary is causal; emitted', sorted(used), 'declared', sorted(c))\""
    red_green_expectation: >-
      Red before (the contract has no currency key, so the lookup raises), green after. A regression to a
      hardcoded vocabulary in the generator turns it red again.
  - source: config/prose_budgets.yaml
    behavior: >-
      The S4 entry for the decision-scout skill stays at or above the file's measured size after the
      ratchet-down, so the skill edit is provably within budget without a raise marker.
    verification_step: 7
    command: "bin/venv-python -c \"import yaml,pathlib; b=yaml.safe_load(pathlib.Path('config/prose_budgets.yaml').read_text())['S4']['.claude/skills/decision-scout/SKILL.md']; n=len(pathlib.Path('.claude/skills/decision-scout/SKILL.md').read_bytes()); assert n<=b, (n,b); print(f'skill {n} B within budget {b} B')\""
    waiver_reason: >-
      A budget registry has no behaviour of its own to red/green: it is a declarative pin whose enforcement
      lives in validate_prose_limits, already running on every --pre invocation. The linked command is the
      meaningful assertion and duplicating it as a standing test would restate a live pre-merge gate.
  - source: docs/decisions-index.json
    behavior: >-
      The committed artifact matches what the generator produces, so the currency projection is present in
      the file decision-scout actually reads.
    verification_step: 8
    command: "bin/venv-python -m scripts.decisions_index --check"
    waiver_reason: >-
      A generated artifact is never hand-authored and has no behaviour independent of its generator, whose
      derivation is covered by tests/decisions_md/test_currency.py. Drift is already enforced by
      validate_decisions_index_freshness, registered UNGATED in the --pre tier.
constraints:
  - >-
    Projection-only on the corpus. No decision entry is edited, no retroactive rewriting, no new authoring
    obligation on grandfathered entries, and nothing that touches the 19,753 inbound "Decision N" citations.
  - >-
    ONLY the currency value 'superseded_compacted' may remove an entry from a consumer's active set, and it
    derives ONLY from a full Decision 149 compaction stub (all four markers). A supersession pointer, an
    inbound supersedes edge, and an amends edge annotate and NEVER filter, and never reduce severity. The
    guard that mints supersession pointers (validate_supersession_annotations, whose _EDGE_RE matches
    "Supersedes|supersedes|amends|Amends|partially supersedes" identically) structurally cannot distinguish
    full from partial supersession, which is why the pointer is unfit as a filter signal.
  - >-
    That prohibition is enforced by scripts/checks/decisions/validate_decision_currency.py, registered in
    --pre. This is deliberate: the operator ruled that no numbered Decision be minted and that the proof of
    a decision belongs in the code. A registered check is a stronger home than prose -- it is evaluated on
    every run rather than relied upon to be read -- and it is what makes the contract's currency section
    causally load-bearing rather than a mention.
  - >-
    No numbered Decision is minted by this plan. This makes the prose budget hard: the
    .claude/skills/decision-scout/SKILL.md edit must land at or below 11,325 bytes, because a raise-approved
    marker under Decision 165 would require a Decision body naming that path verbatim.
  - >-
    No amends_scope envelope field (operator ruling: the corpus supersedes and rewrites rather than amending
    scope in place, and the history record is kept by the superseded entry). Decision 167's envelope is
    unchanged by this plan.
  - Do NOT mint clause identifiers. Clause-level currency stays out of scope entirely.
  - >-
    Reversed and Deferred are deliberately NOT in the vocabulary: the live census is zero such entries, so a
    token would be dead vocabulary. Invariant I4 of the new check fails the build if one ever appears, which
    converts a silent capability loss into a loud gate that forces a deliberate vocabulary extension.
  - >-
    Must survive T1.5's portal cutover unchanged: the cutover swaps the SOURCE of these fields. Do not couple
    the scout's step 7 to the JSON file's path or shape beyond the currency field name.
  - >-
    No graduated verification-registry rows beyond the single step-5 identity check.
    config/agent/verification_registry/registry.yaml sits at 4,739 of its 6,000-line ceiling under Decision
    166 point 6's explicit never-a-second-raise pre-commitment, and this plan's invariants belong in a
    registered validate.py check instead. Consequently the registry is NOT in scope beyond that one row.
  - Only files in the Scope table may be modified. If an entry's markers are wrong, that is a recommendation, not an inline fix.
  - >-
    docs/decisions-index.json is generated. Never hand-edit it; regenerate with
    bin/venv-python -m scripts.decisions_index --write.
  - No rescue agents or workaround loops (Decision 55).
  - >-
    Single Portal Invariant: recommendation closure goes through the Resolves trailer or
    scripts.ops_data_portal. Never call scripts.sync.ops directly and never edit
    logs/.recommendations-log.jsonl.
context:
  - >-
    "Decision-scout verdict + CITE list (verbatim decision ids): FLAGS_FOUND. CITE: Decision 160, Decision
    166, Decision 149, Decision 152, Decision 165, Decision 128, Decision 167, Decision 86. CONTRADICT:
    Decision 150 (WARN, resolved -- no Decision is minted; the governance rule is homed in a registered
    --pre check per the operator ruling); Decision 146 (NOTE, resolved -- tokens renamed to name their
    derivation rather than borrowing Decision 146's phrasing). SPIRIT: Decision 168 (WARN, resolved -- the
    contract vocabulary is validated at projection time and re-checked by a registered check, so it is read
    not merely mentioned); Decision 166 (NOTE, resolved -- currency is projected on live rows only).
    RELATED: Decision 37, Decision 134, Decision 151, Decision 131, Decision 105."
  - "gates: decision-scout=FLAGS_FOUND; plan-critique=REVISE then PROCEED after 2 round(s)"
  - >-
    Round-1 critique ran three fresh zero-context reviewers (plan-critique skill, adversarial correctness,
    governance/blast-radius); all three returned REVISE. Every finding below was independently verified
    against the working tree before being actioned.
  - >-
    Verified live 2026-08-10. The index holds 148 entries (121 live), 14 with a populated superseded_by.
    Decision 37 has status 'Decided', superseded_by 116, a fully intact body, and carries the exact marker
    "**Superseded by: Decision 116**" at docs/DECISIONS.md:5638, while Decision 116's own title claims it
    supersedes Decision 49 and never names 37. 49 files cite "Decision 37" by name, including live
    terraform/personal/*.tf and src/lambdas/ducklake_catalog_dr/handler.py.
  - >-
    Round-1 finding, actioned: the first draft read supersession from the victim-side pointer only, so
    Decision 80 -- whose superseder Decision 104 declares "(partially supersedes Decision 80 point 3)" in
    its heading and which the index already resolves as D104.supersedes == [80] -- derived 'current'. D80 is
    the ONLY live entry superseded purely by an inbound edge, and it was the single genuine
    partially-superseded live entry the plan claimed to fix. superseded_pointer now derives from either edge
    direction, matching how 'amended' already reads inbound edges.
  - >-
    Round-1 finding, actioned: the original VP step asserting "superseded implies compaction stub" was
    definitionally true, since the derivation branch WAS the predicate. It cleared the origin/main
    differential only by ImportError, which is the vacuous-pass shape the verification kernel exists to
    catch. It is replaced by a mutation test (step 2) that removes a real stub marker and requires the check
    to fail.
  - >-
    Round-1 finding, actioned: Decision 149 clause 1 defines the stub as FOUR body markers, and
    docs/contracts/decision-entry.yaml already carries them machine-readably at
    compaction.stub_grammar.body_markers, but the promoted predicate tested only two. In its old home a
    false positive merely skipped an envelope obligation; as the sole filter signal in a BLOCKING gate that
    is unacceptable. The predicate now reads all four from the contract.
  - >-
    Round-1 finding, actioned: tests/checks/decisions/test_validate_decision_entry_conformance.py imports
    _is_compacted_stub by name at line 22 and parametrizes it at lines 287-301, and that file is at EXACTLY
    500 SLOC with no budget entry, so it cannot absorb a rename. The predicate is therefore promoted with a
    private module-level alias left behind, the same pattern scripts/decisions_md.py already uses for
    _extract_superseded_by.
  - >-
    Round-1 finding, actioned: tests/test_decisions_index.py lines 49-66
    (test_entry_shape_is_the_stable_projection_only) asserts an exact 12-key set for EVERY entry and
    necessarily breaks under a live-only projection. It must be updated in the same commit.
  - >-
    Round-1 finding, actioned: the original step regenerating the index was marked hermetic and pre-deploy,
    which would have had validate_vp_replay write a tracked file into the CI tree. Regeneration moved to an
    execution step; the VP step is now read-only --check.
  - >-
    Round-1 finding, actioned: the original closure step called scripts.sync.ops pull, the exact form
    AGENTS.md's Single Portal Invariant names as prohibited. It now uses
    bin/venv-python -m scripts.ops_data_portal --sync.
  - >-
    Round-1 finding, actioned: six graduated steps would have owed six new-in-diff rows in
    config/agent/verification_registry/registry.yaml, which was absent from Scope while a constraint forbade
    touching unlisted files -- CI red either way. Graduations are cut to one, the registry stays out of
    scope, and the invariants live in a registered --pre check instead. The registry is at 4,739 of 6,000
    lines under a never-a-second-raise pre-commitment.
  - >-
    Round-1 finding, actioned: tokens renamed from superseded/superseded_cited to
    superseded_compacted/superseded_pointer so each names its own derivation. The earlier name borrowed
    Decision 146's phrase "superseded-but-still-cited", which that entry applies to Decisions 44, 58 AND 37
    as one class -- so using it for only the surviving member was rationalized, not reconciled.
  - >-
    Corrected measurement: live-only currency costs +3,535 B, landing the index at 115,849 B with 15,151 B
    of headroom against the 131,000 B pin. The earlier +4,292 B / 116,400 B / 14.6 KB figures were the
    all-rows variant and did not match the live-only design.
  - >-
    Prose budget, measured not assumed. .claude/skills/decision-scout/SKILL.md is at exactly its 11,325-byte
    budget, and Decision 160 point 7 ratcheted it DOWN to that figure and REMOVED its dec-152 raise marker.
    Once round-1's mandatory additions were included, a prose reversal backstop no longer fit (+39 B over).
    Handling reversal via invariant I4 of the registered check instead lands the file at approximately
    11,304 B (21 B under) INCLUDING adding currency to the Phase 1 step 1 field enumeration -- and is the
    stronger control, since a guard fails the build where a prose clause only asks an LLM to remember.
  - >-
    Residual risk accepted: 25 of 121 live entries carry an inbound amends edge, including the governance
    Decisions 128/134/146/149/150/160. All receive an 'amended' annotation, and the consumer is an LLM, so
    there is a real risk of CONTRADICT being softened to RELATED on exactly those entries. Mitigated by the
    skill's explicit "NEVER filtered and NEVER severity-reduced" clause, which invariant I4's sibling check
    asserts is present. If softening is observed in practice, file a recommendation rather than widening the
    filter.
  - >-
    Residual limitation: status-prose parsing is reduced, not eliminated. The 'amended' branch still reads a
    status string beginning "Amended" for the grandfathered terse-historical band (Decision 160 point 8
    names Decisions 63, 64, 65, 67). It is a deterministic Python parse rather than per-dispatch LLM
    judgment, which is the actual defect rec-3055 filed; a variant spelling such as "Partially amended by"
    would derive 'current'.
  - >-
    The original framing of rec-3055 ("key step 7 on superseded_by and archive residence") is deliberately
    NOT implemented: doing so would demote Decision 37 out of a blocking gate while 49 files still cite it.
    Record this reframe in the rec's resolution text at closure so the divergence between the filed fix and
    the shipped fix is not lost.
  - >-
    rec-3054 (/orient must surface open Critical recs) was assessed and excluded by operator ruling: zero
    file overlap, zero shared verification, a different subsystem, and its own prose-budget wall on
    .claude/skills/orient/SKILL.md (also at exactly its 23,595-byte cap). Its premise was verified live --
    /orient contains no occurrence of "critical" and there are 12 open Critical recs with no surfacing lane.
  - >-
    Branch was 1 commit behind origin/main at planning time with zero overlap against the Scope table, so no
    rebase decision was required at assessment time. Preflight was clean with no unresolved ci-rca recs.
