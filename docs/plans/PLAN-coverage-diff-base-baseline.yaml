schema_version: 3
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: "coverage-diff-base-baseline"
intent: >-
  Restore the post-merge diff-aware validation layer by fixing the push-context diff-base
  class defect in the shared git primitives, and make the full-tier 100%-coverage gate
  live-but-satisfiable via a committed per-file coverage baseline -- unblocking the
  outbox-test-hermeticity implementation without reddening main.
plan_type: IMPLEMENTATION
verification_tier: V2
plan_path: docs/plans/PLAN-coverage-diff-base-baseline.yaml
phase: >-
  ci_rca-adjacent platform-integrity fix (soft-warn category: ad_hoc_rec / ci-rca-adjacent;
  no tier_item named). Supersedes the literal fixes proposed by rec-2903 and complements
  rec-2902 (whose debt paydown is a follow-on plan).
scope:
  - file: scripts/checks/_common.py
    action: Modify
    purpose: >-
      Add resolve_diff_base() -- the single shared push-context-aware diff-base primitive
      (Decision 104/148 sole-home). Returns merge-base(origin/main, HEAD) normally; when that
      merge-base equals HEAD (post-merge main / push context) returns HEAD~1, guarded on
      HEAD~1 existing (shallow/root fallback: HEAD, with a loud printed warning). Refactor
      get_changed_files() and get_status_aware_diff() to consume it. PR-context output must
      stay byte-identical (Decision 135 strictly-additive invariant).
  - file: scripts/test_coverage_checker.py
    action: Modify
    purpose: >-
      Delete the private merge-base block in get_changed_source_files() (lines ~494-524) and
      consume _common.resolve_diff_base() instead (no third diff-base convention, Decision
      129 pt 5). Fix rec-943 -- switch check_per_file_coverage's --cov argument from module
      string to a file-path source spec so importlib-loaded modules are measured. Consume the
      baseline compare from scripts/checks/misc/coverage_baseline.py. File is 470/500 SLOC:
      net growth must stay under the limit; all new logic lives in the new module.
  - file: scripts/checks/misc/coverage_baseline.py
    action: Create
    purpose: >-
      Single home collocating baseline semantics with enforcement (AGENTS.md collocation
      rule) - load config/coverage_baseline.yaml ({repo-relative path: pct} + inline
      markers), expose a compare helper (pass iff measured_pct >= baseline_pct, values to 1
      decimal), and the @register validate_coverage_baseline_edits check - diff-aware vs
      origin/main, fails any LOWERED entry or NEW sub-100 registration lacking an inline
      "# baseline-lowered: dec-NNN <reason>" marker naming a real "## Decision NNN:" header
      (mirror of scripts/checks/sloc/validate_sloc_budget_raises.py); raises toward 100 and
      removals always unrestricted.
  - file: config/coverage_baseline.yaml
    action: Create
    purpose: >-
      One-time grandfather roster (Decision 130-style fixed roster) seeded at implement time
      by measuring, with the new exclude_lines and path-spec measurement in place, every
      known sub-100 file (scripts/ops_writer.py, scripts/sync/ops.py,
      scripts/checks/ops_governance/validate_outbox_staleness.py,
      scripts/checks/ci_guards/validate_actions_evidence.py, scripts/roadmap/plan_audit.py,
      scripts/session/postflight.py, scripts/validate.py) PLUS every source file this plan
      itself modifies that measures below 100 after its new tests land. Each entry carries
      "# grandfathered dec-NNN (one-time roster)" citing the carrying Decision.
  - file: scripts/checks/misc/validate_test_coverage.py
    action: Modify
    purpose: >-
      Make the registered gate baseline-aware - a changed file WITH a baseline entry fails
      iff measured < entry; a changed file WITHOUT an entry fails iff measured < 100
      (standard unchanged for unbaselined files).
  - file: scripts/checks/registry.py
    action: Modify
    purpose: >-
      Register validate_coverage_baseline_edits in pre_sequence() (adjacent to
      validate_sloc_budget_raises, mirroring its diff-aware-guard placement) and in
      full_sequence() immediately after validate_test_coverage.
  - file: scripts/validate.py
    action: Modify
    purpose: >-
      Facade re-export line for validate_coverage_baseline_edits (scripts/CLAUDE.md
      registration contract - without it dispatch KeyErrors).
  - file: pyproject.toml
    action: Modify
    purpose: >-
      Add [tool.coverage.report] exclude_lines covering "pragma: no cover" (preserve
      default) and "if __name__ == .__main__.:" - removes structurally-uncoverable
      entry-point blocks repo-wide in one edit (ops_writer.py measured 69.6% -> 75.0%)
      without touching any Lambda-packaged source file.
  - file: .github/workflows/ci.yml
    action: Modify
    purpose: >-
      Add fetch-depth: 2 to the main-validate job's checkout step so HEAD~1 exists for the
      push-context diff base (squash-merge convention, Decision 76 - every merge to main is
      a single commit, so depth 2 suffices). No new check is added to ci.yml.
  - file: docs/DECISIONS.md
    action: Modify
    purpose: >-
      Append the carrying Decision (next free number - 158 at planning time, RE-CHECK the
      max "## Decision NNN:" header at implement time). Condensed draft in
      execution_steps. Keep under ~2.5KB - DECISIONS.md is at 480KB of the 500KB ceiling.
  - file: tests/test_checks_registry.py
    action: Modify
    purpose: >-
      Mirror home for scripts/checks/_common.py (checker maps _common.py/registry.py here).
      Add resolve_diff_base() tests - push-context detection via a temp-git-repo fixture
      (HEAD == origin/main, clean tree -> base is HEAD~1), PR-context passthrough, missing
      HEAD~1 fallback, and a PR-context invariance test asserting get_status_aware_diff()
      and get_changed_files() outputs are unchanged on a feature branch.
  - file: tests/test_test_coverage_checker.py
    action: Create
    purpose: >-
      Mirror home (flat rule) for scripts/test_coverage_checker.py - previously nonexistent,
      required by check_test_file_exists once this plan touches the checker. Cover
      get_changed_source_files() consuming the shared base, the path-spec --cov fix
      (fixture: module loaded via importlib.spec_from_file_location under a bare name is
      still measured, closing rec-943), and baseline-aware pass/fail semantics.
  - file: tests/checks/misc/test_coverage_baseline.py
    action: Create
    purpose: >-
      Mirror home for the new module - baseline load/compare unit tests plus guard tests:
      lowering an entry without marker FAILS, with a valid dec-citing marker PASSES,
      raising/removing entries always passes, new sub-100 registration without marker FAILS.
  - file: tests/checks/misc/test_validate_test_coverage.py
    action: Modify
    purpose: >-
      Extend existing wrapper tests for the baseline-aware gate branch (entry present vs
      absent) using injected file lists - no live pytest subprocess needed.
bundled_recommendations:
  - rec-2903
  - rec-943
infrastructure_dependencies: []
acceptance_criteria:
  - >-
    Push-context correctness: with HEAD == origin/main and a clean tree (temp-repo fixture),
    get_changed_source_files(), get_changed_files(), and get_status_aware_diff() each report
    the files changed by HEAD~1..HEAD, not an empty set.
  - >-
    PR-context invariance (Decision 135): on a feature branch, all three surfaces return
    outputs identical to pre-change behaviour - selection can only grow, and here it must
    not change at all.
  - >-
    Structural-exclusion correctness: with the new exclude_lines,
    scripts/ops_writer.py measures 75.0% (was 69.6%) with zero source edits, and no
    missing-lines entry falls inside its __main__ block (lines >= 716).
  - >-
    Baseline gate semantics: a changed file with a baseline entry fails iff measured <
    entry; without an entry, fails iff measured < 100; the seeded roster passes for a
    simulated change-set of [scripts/ops_writer.py, scripts/sync/ops.py] (the
    outbox-test-hermeticity blocker scenario).
  - >-
    Baseline tamper-guard: lowering any entry or adding a new sub-100 entry without an
    inline "# baseline-lowered: dec-NNN <reason>" marker naming a real Decision header
    fails validate_coverage_baseline_edits; raises and removals pass unrestricted.
  - >-
    rec-943 closed by mechanism: scripts/roadmap/plan_audit.py (importlib-loaded test
    idiom) yields a numeric per-file coverage result, not an informational skip.
  - >-
    main-validate checks out with fetch-depth 2, and the Decision 124 ops_portal carve-out
    still holds (map_source_to_test returns None for scripts/ops_portal/ paths).
  - >-
    The carrying Decision is recorded in docs/DECISIONS.md with forward-reference
    amendments to the Decision 48 V2 row and the Decision 124 premise, plus reversal
    conditions; a coverage-debt-paydown rec is filed via the ops portal.
verification_plan:
  - step: 1
    phase: pre-deploy
    action: >-
      Run the shared-primitive tests - push-context detection (temp-repo fixture),
      PR-context invariance, HEAD~1-missing fallback.
    command: bin/venv-python -m pytest tests/test_checks_registry.py -q
    expected: Exit 0; new resolve_diff_base tests all pass.
    fix_if: >-
      Push context misdetected (merge-base comparison wrong), PR-context outputs changed
      (Decision 135 violation), or fallback not loud - fix _common.py, not the tests.
    hermetic: false
    graduation: graduate
    graduation_check_id: push-context-diff-base-tests
  - step: 2
    phase: pre-deploy
    action: >-
      Run the coverage-checker and baseline-module tests - path-spec measurement of an
      importlib-loaded fixture module (rec-943), baseline compare semantics, tamper-guard
      marker enforcement.
    command: bin/venv-python -m pytest tests/test_test_coverage_checker.py tests/checks/misc/test_coverage_baseline.py tests/checks/misc/test_validate_test_coverage.py -q
    expected: Exit 0; importlib fixture measured numerically; guard fails lowering-without-marker and passes raise/removal.
    fix_if: >-
      Importlib fixture still yields no coverage data (path-spec not honoured - check
      pytest-cov source-spec form) or guard direction inverted.
    hermetic: false
    graduation: graduate
    graduation_check_id: coverage-baseline-gate-tests
  - step: 3
    phase: pre-deploy
    action: >-
      Live PR-context sanity - the corrected checker on THIS branch reports exactly the
      .py source files this plan changes.
    command: >-
      bin/venv-python -c "import importlib.util,sys,pathlib; sys.path.insert(0,'.');
      spec=importlib.util.spec_from_file_location('tcc','scripts/test_coverage_checker.py');
      m=importlib.util.module_from_spec(spec); spec.loader.exec_module(m);
      files={str(p.relative_to(pathlib.Path.cwd())) for p in m.get_changed_source_files()};
      assert 'scripts/test_coverage_checker.py' in files and 'scripts/checks/_common.py' in files, files; print(sorted(files))"
    expected: Prints this plan's changed source files; assertion passes.
    fix_if: Empty or wrong set - the shared-base consumption in the checker is broken.
    hermetic: true
    graduation: waive
    graduation_waiver_reason: >-
      Asserts against this branch's own transient diff - meaningless as a standing
      regression check once the branch merges; the durable behaviour is covered by the
      graduated step-1/step-2 test selectors.
  - step: 4
    phase: pre-deploy
    action: >-
      Verify exclude_lines takes effect without source edits - measure ops_writer.py and
      assert no missing line falls in the __main__ block and the percentage rose to 75.0.
    command: >-
      bin/venv-python -m pytest tests/ops_writer/ -q --no-header --cov=scripts.ops_writer
      --cov-report=json:logs/debug/.vp-cov.json >/dev/null 2>&1;
      bin/venv-python -c "import json; d=json.load(open('logs/debug/.vp-cov.json'));
      f=[v for k,v in d['files'].items() if 'ops_writer' in k][0];
      assert not [l for l in f['missing_lines'] if l>=716], 'main block still counted';
      pct=f['summary']['percent_covered']; assert 74.5<=pct<=76.0, pct; print(f'ops_writer.py {pct:.1f}%')"
    expected: Prints ops_writer.py ~75.0%; no missing lines at or after 716.
    fix_if: >-
      __main__ lines still missing - exclude_lines regex wrong (dots in the pattern are
      regex wildcards, keep the canonical coverage.py form).
    hermetic: false
    graduation: not-applicable
  - step: 5
    phase: pre-deploy
    action: Assert main-validate's checkout carries fetch-depth 2.
    command: >-
      bin/venv-python -c "import yaml; w=yaml.safe_load(open('.github/workflows/ci.yml'));
      s=w['jobs']['main-validate']['steps'][0]; assert 'checkout' in s['uses'], s;
      assert s.get('with',{}).get('fetch-depth')==2, s; print('fetch-depth: 2 present')"
    expected: Exit 0, prints confirmation.
    fix_if: Checkout step moved position - locate the actions/checkout step by uses-match instead of index.
    hermetic: true
    graduation: graduate
    graduation_check_id: main-validate-fetch-depth
  - step: 6
    phase: pre-deploy
    action: >-
      Prove the Decision 124 ops_portal carve-out survives the gate going live -
      map_source_to_test still returns None for scripts/ops_portal/ paths.
    command: >-
      bin/venv-python -c "import importlib.util,sys,pathlib; sys.path.insert(0,'.');
      spec=importlib.util.spec_from_file_location('tcc','scripts/test_coverage_checker.py');
      m=importlib.util.module_from_spec(spec); spec.loader.exec_module(m);
      r=m.map_source_to_test(pathlib.Path.cwd()/'scripts/ops_portal/portal.py');
      assert r is None, r; print('ops_portal carve-out intact')"
    expected: Exit 0, carve-out intact.
    fix_if: >-
      Returns a path - the checker refactor disturbed the Decision 124 exclusion; restore
      it before landing.
    hermetic: true
    graduation: graduate
    graduation_check_id: ops-portal-coverage-carveout
  - step: 7
    phase: pre-deploy
    action: >-
      Unblock simulation - run the baseline-aware gate against the hermeticity blocker
      change-set [scripts/ops_writer.py, scripts/sync/ops.py] with the seeded roster and
      expect zero errors.
    command: >-
      bin/venv-python -c "import importlib.util,sys,pathlib; sys.path.insert(0,'.');
      spec=importlib.util.spec_from_file_location('tcc','scripts/test_coverage_checker.py');
      m=importlib.util.module_from_spec(spec); spec.loader.exec_module(m);
      srcs=m.get_changed_source_files(files=['scripts/ops_writer.py','scripts/sync/ops.py']);
      errs=m.check_per_file_coverage(srcs); assert errs==[], errs; print('gate passes with baseline')"
    expected: Exit 0 - both files pass at their baselined values.
    fix_if: >-
      Errors returned - baseline entries missing, seeded above measured values, or the
      compare direction inverted.
    hermetic: false
    graduation: not-applicable
  - step: 8
    phase: pre-deploy
    action: Full fast-tier presubmit, including the new guard's own registration reachability.
    command: bin/venv-python -m scripts.validate --pre
    expected: Exit 0; validate_coverage_baseline_edits appears in the pre-tier run output.
    fix_if: >-
      KeyError on the check name - facade re-export line missing in scripts/validate.py;
      SLOC failure on test_coverage_checker.py - move logic into coverage_baseline.py.
    hermetic: false
    graduation: not-applicable
  - step: 9
    phase: post-deploy
    action: >-
      After squash-merge, on updated local main, confirm the post-merge diff base is live -
      the checker examines the merge's own files instead of an empty set.
    command: >-
      git fetch origin main && git -C . log --oneline -1 origin/main &&
      bin/venv-python -c "import importlib.util,sys,pathlib,subprocess; sys.path.insert(0,'.');
      subprocess.run(['git','checkout','-q','main']); subprocess.run(['git','pull','-q','origin','main']);
      spec=importlib.util.spec_from_file_location('tcc','scripts/test_coverage_checker.py');
      m=importlib.util.module_from_spec(spec); spec.loader.exec_module(m);
      files=m.get_changed_source_files(); assert files, 'post-merge diff base still empty'; print(sorted(str(p) for p in files))"
    expected: Non-empty list naming this plan's merged .py files.
    fix_if: Empty - push-context detection failed on real main; RCA before any further merges (Decision 55).
  - step: 10
    phase: post-deploy
    action: >-
      Closure obligation - confirm rec-2903 and rec-943 auto-closed via the Resolves
      trailer, after syncing the read cache.
    command: >-
      bin/venv-python -m scripts.sync.ops sync && bin/venv-python -c "import json;
      rows=[json.loads(l) for l in open('logs/.recommendations-log.jsonl') if l.strip()];
      st={r['id']:r['status'] for r in rows if r['id'] in ('rec-2903','rec-943')};
      assert set(st.values())=={'closed'}, st; print(st)"
    expected: Both recs show status closed.
    fix_if: >-
      Still open - rec-autoclose.yml did not fire; fall back to
      "bin/venv-python -m scripts.ops_data_portal --update-rec <id> --status closed
      --resolution <text>" per Decision 70.
constraints:
  - >-
    No Lambda-packaged file in scope - compute_affected_artifacts returns {} for every
    scope file (verified at planning time), which is what keeps this V2 under Decision 79.
    Do NOT add scripts/ops_writer.py or any manifest-matched file to scope
    mid-implementation; if a packaged file becomes unavoidable, STOP and re-plan as V3.
  - >-
    Atomicity is load-bearing: the seeded baseline (and baseline-aware gate) must land in
    the SAME PR as the diff-base fix and fetch-depth change - never after. Landing the
    measurement fix alone reddens main on the next merge touching a sub-100 file, filing a
    critical ci-rca rec that hard-blocks the planning queue (Decision 73/142).
  - >-
    scripts/test_coverage_checker.py is 470/500 SLOC and unregistered - it must stay under
    500 (Decision 102/128: decompose, don't register). New logic goes to
    scripts/checks/misc/coverage_baseline.py; the deleted private merge-base block buys
    headroom.
  - >-
    _common.py consumers use qualified _common.<name> access (Decision 104/148); do not
    change get_changed_files()'s deleted-path filtering contract or
    get_status_aware_diff()'s A/M/D/untracked vocabulary.
  - >-
    validate.py is the single source of truth - ci.yml gains only checkout configuration
    (fetch-depth), never a check that is not in validate.py first.
  - >-
    Decision 82 framing discipline: the diff-base + fetch-depth work is a MEASUREMENT
    CORRECTION (the gate examined an empty set); only the baseline is a (bounded,
    grandfathered) threshold change. The Decision entry must state which is which.
  - >-
    No rescue agents or workaround loops (Decision 55); on unrecoverable V3-like failure
    in post-deploy steps, stop and RCA.
  - >-
    The DECISIONS.md entry stays concise (~2.5KB) - the file is at 480KB of the 500KB
    Decision 145 ceiling.
context:
  - >-
    Root cause: scripts/checks/_common.py's get_changed_files() and get_status_aware_diff()
    plus test_coverage_checker.get_changed_source_files() all resolve their diff base via
    merge-base(origin/main, HEAD). On a push-to-main run HEAD IS origin/main, so the base
    is HEAD and the diff is empty - every diff-aware full-tier check (validate_vp_replay,
    validate_graduation_completeness, validate_verifier_same_pr_guard,
    validate_environment_taxonomy, validate_lambda_deploy_gating,
    validate_data_model_standard, validate_test_coverage) silently no-ops post-merge.
    20 call sites across 10 modules consume these primitives. Verified empirically on main.
  - >-
    Measured coverage debt (with current config): scripts/ops_writer.py 69.6% (108/355
    missing; 28 are the __main__ block, 30 drain(), 31 compact()), scripts/sync/ops.py
    73.5% (84/317), validate_outbox_staleness.py 95.8%, validate_actions_evidence.py 98.7%.
    plan_audit.py / session/postflight.py / validate.py currently INFO-SKIP via the rec-943
    hole and become measurable (and baseline-eligible) once it closes.
  - >-
    rec-2902 is deliberately NOT bundled: this plan unblocks via the baseline; the actual
    drain()/compact()/sync-ops test paydown is an operator-confirmed follow-on plan
    (planned immediately after this one merges) that will bundle rec-2902 plus the paydown
    rec filed by this plan's execution step. rec-2903's own fix (fetch-depth: 0 alone) was
    verified insufficient - fetch depth was never the defect; the diff base is - superseded
    per Decision 55/72/129 (fix the generator, not the occurrence).
  - >-
    ci-rca deferral rationale (Related-Work check): rec-2882 (critical, terraform IAM
    apply-role) is being handled by another agent per operator direction 2026-07-30 - the
    #806 merge on main addresses that surface. This plan shares no file, Decision, or
    failure category with it; deferral logged here per the planning skill's Related-Work
    conditions.
  - >-
    Verification-tier determination: compute_affected_artifacts({all scope files}) == {} -
    no active Lambda manifest matches, so Decision 79 does not force V3; scope is pure
    Python + config + workflow-checkout config -> V2.
  - >-
    Decision-scout verdict + CITE list (verbatim decision ids): round 1 BLOCK (Decision 79
    - original approach edited Lambda-packaged ops_writer.py; resolved by pivoting all
    edits out of packaged files). Round 2 FLAGS_FOUND on the revised approach. CITE:
    Decision 104, Decision 148, Decision 135, Decision 153, Decision 150, Decision 149,
    Decision 142, Decision 73, Decision 55, Decision 72, Decision 129, Decision 131,
    Decision 79, Decision 86, Decision 132. Flags resolved in-plan: Decision 48 V2-row
    narrowed by forward reference in the carrying Decision; Decision 124 stale premise
    corrected by forward reference with a carve-out VP proof (step 6); Decision 128-mirror
    tamper guard on baseline lowering; Decision 102 respected via the separate
    coverage_baseline.py module; Decision 130 one-time-roster framing with a filed paydown
    rec and a growth reversal condition.
  - "gates: decision-scout=FLAGS_FOUND (after 1 BLOCK->pivot round) after 2 round(s); plan-critique=PROCEED after 1 round(s)"
  - >-
    Main advanced during planning (ad02653 -> 89c87ff, merges #804/#806 touching
    registry.py and validate.py); branch fast-forwarded cleanly onto 89c87ff before
    authoring, so all planning facts were re-verified against the current tree. Max
    Decision header is 157 at planning time -> carrying Decision drafted as 158;
    RE-CHECK the max header at implement time (numbering race).
  - >-
    Local full-tier nuance: with the corrected base, a full run on a CLEAN main checkout
    (local or CI) examines the last merge's files - by design, that is exactly the
    post-merge contract; PR/branch runs are unchanged.
pre_implementation_checklist:
  - Branch confirmed not on main
  - docs/PROJECT_CONTEXT.md read
  - DECISIONS.md read
  - All files in scope located and readable
  - Acceptance criteria understood and verifiable
  - compute_affected_artifacts re-run over final scope list returns {} (V2 guard)
execution_steps:
  - >-
    scripts/checks/_common.py - add resolve_diff_base() (merge-base normally; HEAD~1 when
    merge-base == rev-parse HEAD; loud fallback to HEAD if HEAD~1 absent); refactor
    get_changed_files() and get_status_aware_diff() onto it, preserving their existing
    output contracts byte-for-byte in PR context.
  - >-
    scripts/test_coverage_checker.py - replace the private merge-base block in
    get_changed_source_files() with the shared helper (import scripts.checks._common via
    the already-injected ROOT sys.path); switch check_per_file_coverage to a file-path
    --cov source spec (rec-943); route the per-file verdict through the baseline compare
    helper. Keep the file under 500 SLOC.
  - >-
    Create scripts/checks/misc/coverage_baseline.py (load + compare + the
    validate_coverage_baseline_edits guard as specified in scope) and
    config/coverage_baseline.yaml; register the guard in scripts/checks/registry.py
    (pre_sequence adjacent to validate_sloc_budget_raises; full_sequence immediately after
    validate_test_coverage) and add the facade re-export line in scripts/validate.py.
  - >-
    scripts/checks/misc/validate_test_coverage.py - baseline-aware gate semantics: entry
    present -> fail iff measured < entry; absent -> fail iff measured < 100.
  - >-
    pyproject.toml - [tool.coverage.report] exclude_lines with the canonical coverage.py
    patterns for "pragma: no cover" and the __main__ guard.
  - >-
    .github/workflows/ci.yml - fetch-depth: 2 on main-validate's actions/checkout step.
  - >-
    Seed config/coverage_baseline.yaml: measure (post-exclude_lines, path-spec) each file
    named in the scope entry's roster plus every source file in this plan's own diff; for
    each result < 100.0, record the floored-to-1-decimal value with the grandfather
    marker; files measuring 100 are omitted. Files whose mapped tests still yield no data
    after the rec-943 fix are recorded at their measured value, never guessed.
  - >-
    Write the tests listed in scope (tests/test_checks_registry.py additions,
    tests/test_test_coverage_checker.py, tests/checks/misc/test_coverage_baseline.py,
    tests/checks/misc/test_validate_test_coverage.py extensions). Every new test file
    stays under 500 SLOC (Decision 128/130).
  - >-
    docs/DECISIONS.md - append the carrying Decision (re-check next free number; drafted
    as 158): (1) class fix - push-context diff base centralised in
    _common.resolve_diff_base(); when merge-base(origin/main, HEAD) == HEAD the base is
    HEAD~1; main-validate checks out fetch-depth 2 (squash convention, Decision 76). A
    MEASUREMENT CORRECTION, not a relaxation (Decision 82 framing) - the diff-aware
    full-tier layer previously no-oped on main. (2) coverage baseline -
    config/coverage_baseline.yaml is a one-time grandfather roster (Decision 130 style);
    changed files with an entry fail iff measured < entry, unbaselined files keep the 100%
    standard - narrowing Decision 48's V2 row by forward reference (100% remains the
    standard; baselined files are bounded grandfathered debt with paydown tracked by
