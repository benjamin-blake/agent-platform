execution_steps:
  - >-
    Create .claude/hooks/session_start_commit_signing.py. Read commit.gpgsign and gpg.format via
    git config. Exit 0 immediately, writing nothing, unless commit.gpgsign is true AND gpg.format is
    ssh -- this keeps the hook inert on non-signing surfaces such as CI runners. Otherwise resolve
    the allowed-signers path as $HOME/.config/git/ccweb_allowed_signers, create parent dirs, and
    create the file if absent containing only a short "#" header comment explaining that it exists
    so git does not short-circuit its SSH-signature verdict to N, and that it is deliberately empty
    because this container cannot verify signatures. Then set
    "git config --global gpg.ssh.allowedSignersFile <path>". Use --global (not --local) because the
    signing identity is a container-level fact, the harness configures signing globally, and the
    Stop hook may run from any worktree or cwd. Make it idempotent: if the config already names an
    existing file, make no writes. Type hints throughout; never raise; always exit 0; print one
    status line.
  - >-
    Register the hook in .claude/settings.json under hooks.SessionStart, invoked as
    "bin/venv-python .claude/hooks/session_start_commit_signing.py". Do not reorder or remove any
    existing hook (Decision 138).
  - >-
    Create tests/hooks/test_session_start_commit_signing.py covering: (a) commit.gpgsign false ->
    no config written; (b) gpg.format not ssh -> no config written; (c) happy path -> file created
    with its header comment and gpg.ssh.allowedSignersFile set to it; (d) second invocation is a
    no-op; (e) config already naming an existing file -> no rewrite. Every test sets both HOME and
    GIT_CONFIG_GLOBAL to tmp_path (GIT_CONFIG_GLOBAL is the lever that actually redirects
    --global). Follow tests/hooks/test_fresh_branch_base.py for shape (Decision 131).
  - >-
    Rewrite the AGENTS.md "### Commit signing" subsection. Rank content by load-bearingness and
    keep as much as fits under the ~759-byte ceiling, cutting from the bottom: (1) CC-web commits
    are SSH-signed by the harness and GitHub reports them Verified -- use the literal phrase
    "SSH-signed", which VP step 4 greps for; (2) local %G? is N/B only because in-container
    verification is unavailable, so it is not evidence about the signature; (3) the SessionStart
    hook configures allowedSignersFile so the Stop hook's signature check stops false-positiving --
    and if the hook still fires, read WHICH half fired, because the committer-email half
    (%ce != noreply@anthropic.com) is a real trigger whose amend/reset-author remediation is
    correct; (4) do NOT reset-author or --amend -S to chase the SIGNATURE flag -- it only churns
    SHAs; (5) the Decision 83 back-reference. Retitle away from "unsigned is expected". Verify the
    byte ceiling with VP step 6 before committing.
  - >-
    Edit the terraform/github/repo.tf comment above the ruleset's closing brace. Keep "No
    required_signatures: intentional -- do not add" verbatim. Replace the justification with
    Decision 83's ratified grounds: main-protection is a deliberately MINIMAL rule set (required
    checks limited to pr-validate and terraform-validate, admin bypass always, strict = false,
    terraform-converged advisory), and every additional rule needs its own justification -- none
    exists for required_signatures. State explicitly that server-side verification is NOT the
    blocker (GitHub reports these commits Verified), so no wedging or capability claim is made.
    Update the AGENTS.md cross-reference to quote the NEW subsection heading exactly (VP step 4
    greps for this). Change no resource attribute. Do not run terraform (not installed; Decision
    119).
  - >-
    Edit .claude/skills/audit-prompt/SKILL.md line ~217, which currently reads "Commit with
    user.name=Claude, user.email=noreply@anthropic.com, --no-gpg-sign if signing is unavailable".
    Remove the --no-gpg-sign clause entirely so composed prompts neither carry the false premise
    nor instruct a fresh session to produce a genuinely unsigned commit. This edit must only REMOVE
    text -- the file sits at exactly its S4 budget with zero headroom.
  - >-
    Edit docs/audit-prompts/AUDIT-platform-roadmap-mvp-triage.md line ~435: the entry currently
    reads "Unsigned CC-web commits (`git log %G? = N`) -- expected, per AGENTS.md" under a
    "Deliberate constraints -- DO NOT flag these as defects" heading. Replace it so it states that
    CC-web commits are SSH-signed (use that literal phrase; VP step 4 greps for it) and that a
    local %G? of N or B is a verification artefact, not a defect -- preserving the do-not-flag
    intent while removing the false premise.
  - >-
    Edit .claude/commands/plan.md: add "git push -u origin HEAD" immediately after the Step 8
    "plan({slug}): initial plan" commit; add a one-line instruction in the Step 9 and Step 10
    iteration loops to push each revision commit immediately (a plain push fast-forwards, since
    revision commits are additive); and change Step 11's push to
    "git push --force-with-lease -u origin HEAD", which the post-rebase push requires once the
    branch is already pushed. Keep the existing Step 11 ordering otherwise.
  - >-
    File a recommendation via the ops portal (call get_rec_write_guidance() before file_rec()).
    Content: /root/.claude/stop-hook-git-check.sh treats "%G? == N" as proof of a missing
    signature, but git returns N for ANY ssh-signed commit when gpg.ssh.allowedSignersFile is
    unset, so the check false-positives on every correctly signed CC-web commit; the hook's own
    comment asserts B/U/E for unverifiable signatures, which does not hold for gpg.format=ssh.
    Include (a) the coupling fragility -- the repo-side mitigation depends on the predicate testing
    == "N", and an upstream tightening to != "G" would silently disable it; and (b) the deferred
    sweep of the ten historical audit prompts named in the constraints. source=planning,
    automatable=false (harness-owned file, outside the repo).
  - >-
    Execute the Verification Plan -- run each step; loop until pass; on unrecoverable failure stop
    and RCA rather than patching around it (Decision 55).
  - "Report: what was implemented, verification results, and the filed rec id."
rollback: >-
  Fully reversible and low-blast-radius. Remove the SessionStart entry from .claude/settings.json
  and delete .claude/hooks/session_start_commit_signing.py plus its test; run
  "git config --global --unset gpg.ssh.allowedSignersFile" and delete
  $HOME/.config/git/ccweb_allowed_signers to restore the prior %G? == N behaviour. The AGENTS.md,
  repo.tf, audit-prompt skill, audit-prompt, and plan.md edits are independently revertible by git
  revert of the squash-merge commit. No infrastructure is applied and no data is written, so
  nothing outside the repo and the container-local git config needs undoing. The filed rec is
  closed via the ops portal if the diagnosis is ever superseded.
