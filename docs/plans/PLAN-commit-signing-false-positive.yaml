schema_version: 3
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: "commit-signing-false-positive"
intent: >-
  Eliminate a recurring per-session token sink in which the CC-web harness Stop hook falsely reports
  every local commit as "Unverified (missing signature)", by configuring the git setting whose
  absence causes the false positive and correcting the four live surfaces that record the wrong
  root cause -- including the audit-prompt generator that keeps minting it into new artefacts.
plan_type: IMPLEMENTATION
verification_tier: V2
plan_path: docs/plans/PLAN-commit-signing-false-positive.yaml
phase: >-
  Platform / agent-surface friction reduction. No tier_item: this is an ad-hoc friction fix
  surfaced from repeated session transcripts (soft-warn exception category ad_hoc_rec /
  user_explicit_out_of_scope), so the Tier Item Freshness Gate is skipped by rule.
scope:
  - file: .claude/hooks/session_start_commit_signing.py
    action: Create
    purpose: >-
      SessionStart hook. When commit.gpgsign is true AND gpg.format is ssh, ensure an
      allowed-signers file exists under $HOME and point gpg.ssh.allowedSignersFile at it, so git
      stops short-circuiting its SSH-signature verdict to N. Contents-agnostic (the N->B transition
      depends only on the setting naming a file), idempotent, no-op on non-signing surfaces,
      always exit 0.
  - file: .claude/settings.json
    action: Modify
    purpose: Register the new hook in the SessionStart hooks array.
  - file: AGENTS.md
    action: Modify
    purpose: >-
      Replace the "### Commit signing (CC-web: unsigned is expected)" subsection, whose premise
      ("commits land unsigned", "signing is unavailable in this harness") is factually wrong, with
      the verified mechanism. Retain the do-not-amend / do-not-reset-author directive and the
      committer-email distinction.
  - file: .claude/commands/plan.md
    action: Modify
    purpose: >-
      Push immediately after the Step 8 plan commit AND after every Step 9/10 critique-revision
      commit, so no unpushed commit spans a gate turn boundary; change Step 11's push to
      --force-with-lease, which the post-rebase push then requires.
  - file: terraform/github/repo.tf
    action: Modify
    purpose: >-
      Comment-only. Replace the false "0-byte placeholder / would wedge" justification for omitting
      required_signatures with Decision 83's actual ratified grounds (a deliberately minimal rule
      set), and repoint the AGENTS.md cross-reference at the retitled subsection. Keeps the
      "intentional -- do not add" directive verbatim.
  - file: .claude/skills/audit-prompt/SKILL.md
    action: Modify
    purpose: >-
      THE GENERATOR. Line ~217 instructs composed audit prompts to commit with "--no-gpg-sign if
      signing is unavailable". This is the live surface that keeps minting the false premise into
      every new audit prompt, and following it would produce a genuinely unsigned commit (git
      accepts --no-gpg-sign even with commit.gpgsign=true). Remove the --no-gpg-sign clause.
  - file: docs/audit-prompts/AUDIT-platform-roadmap-mvp-triage.md
    action: Modify
    purpose: >-
      Correct line ~435, which asserts "Unsigned CC-web commits (git log %G? = N) -- expected, per
      AGENTS.md" under a "Deliberate constraints -- DO NOT flag these as defects" heading. Unlike
      the other audit prompts, this instance is finding-suppression guidance rather than generated
      commit-flow boilerplate, so the generator fix does not reach it.
  - file: tests/hooks/test_session_start_commit_signing.py
    action: Create
    purpose: >-
      Unit coverage for the hook: the two no-op guards (gpgsign disabled, gpg.format not ssh), the
      happy path, idempotency, and the already-configured no-op. All under an isolated HOME and
      GIT_CONFIG_GLOBAL.
bundled_recommendations: []
infrastructure_dependencies:
  - >-
    terraform/github/repo.tf is comment-only. No resource attribute changes, so terraform plan is
    expected to be a no-op. terraform/github/ is the human-gated local-apply root (T2.12 / CD.20);
    no apply is required or requested by this plan, and no agent self-directs one (Decision 126).
  - >-
    terraform is NOT installed in this container and terraform/github/ uses the github.com-hosted
    integrations/github provider, so local init/validate/plan is egress-blocked (Decision 119).
    Verified: _TERRAFORM_ROOTS in scripts/checks/_terraform.py includes terraform/github, and the
    terraform-validate CI job runs unconditionally on every PR with no paths filter -- it is the
    authoritative verifier and including this file adds no CI cost.
acceptance_criteria:
  - >-
    Running .claude/hooks/session_start_commit_signing.py in the CC-web container leaves
    gpg.ssh.allowedSignersFile set to a path that exists.
  - >-
    After the hook runs, the harness Stop hook's own signature predicate
    (git log --format='%h %G? %ce' <upstream>..HEAD piped through awk '$2 == "N" || $3 !=
    "noreply@anthropic.com"') returns EMPTY for this branch's commits, where before the change it
    returned every commit.
  - >-
    The hook makes NO git-config change when commit.gpgsign is not true or gpg.format is not ssh,
    so it is inert on surfaces that do not sign (notably CI runners).
  - The hook is idempotent and exits 0 on every path, including every failure path.
  - .claude/settings.json registers the hook in SessionStart and remains valid JSON.
  - >-
    AGENTS.md no longer asserts that CC-web commits are unsigned or that signing is unavailable,
    still forbids reset-author / --amend -S churn, and still distinguishes the harness predicate's
    two independent triggers (missing signature vs committer email != noreply@anthropic.com).
  - >-
    The AGENTS.md rewrite keeps the S1 root_ambient_load_set prose budget satisfied
    (current bytes <= 33215) with NO budget raise and no edit to config/prose_budgets.yaml.
  - >-
    terraform/github/repo.tf still carries an explicit "do not add required_signatures" directive,
    grounded on Decision 83's ratified minimal rule set and explicitly NOT on any claim that GitHub
    cannot verify these commits; its AGENTS.md cross-reference names the retitled subsection.
  - >-
    .claude/skills/audit-prompt/SKILL.md no longer instructs composed audit prompts to use
    --no-gpg-sign, so newly generated prompts stop carrying the false premise, and the file does
    not grow (its S4 budget headroom is exactly 0).
  - >-
    docs/audit-prompts/AUDIT-platform-roadmap-mvp-triage.md no longer instructs auditors that
    unsigned CC-web commits are an expected deliberate constraint.
  - >-
    .claude/commands/plan.md pushes after the Step 8 commit and after each Step 9/10 revision
    commit, and uses --force-with-lease at Step 11.
  - >-
    A recommendation is filed recording the upstream harness Stop-hook defect, the coupling
    fragility (the repo-side mitigation depends on the harness predicate testing $2 == "N"; if
    upstream tightens it to != "G" the mitigation silently stops working), and the deferred sweep
    of the ten historical audit prompts excluded below.
verification_plan:
  - step: 1
    phase: pre-deploy
    action: >-
      Prove the hook flips the harness Stop hook's signature predicate from firing to clean on this
      branch's real, signed commits. End-to-end behavioural proof against the live harness signer.
      Note this mutates --global gpg.ssh.allowedSignersFile -- the same mutation the hook performs
      at every SessionStart, so it introduces no side effect the session would not already have.
    command: >-
      bin/venv-python .claude/hooks/session_start_commit_signing.py >/dev/null 2>&1; test -f "$(git
      config --get gpg.ssh.allowedSignersFile)" && test -z "$(git log --format='%h %G? %ce'
      origin/main..HEAD | awk '$2 == "N" || $3 != "noreply@anthropic.com"')" && echo PREDICATE_CLEAN
    expected: >-
      Prints `PREDICATE_CLEAN`. Before the change the same awk emits one line per branch commit
      (each with %G? == N), which is exactly the text the harness Stop hook echoes when it exits 2.
    fix_if: >-
      Non-empty awk output means %G? is still N -- check that gpg.ssh.allowedSignersFile is set and
      that the path exists. An unset value means the hook took a guard exit; rerun without
      redirecting stderr to see which guard tripped.
    hermetic: false
    graduation: not-applicable
  - step: 2
    phase: pre-deploy
    action: >-
      Prove the hook's guard and idempotency behaviour via the unit suite (no-op when gpgsign is
      false, no-op when gpg.format is not ssh, happy path, repeat-run no-op, already-configured
      no-op), all under an isolated HOME and GIT_CONFIG_GLOBAL.
    command: bin/venv-python -m pytest tests/hooks/test_session_start_commit_signing.py -q
    expected: All tests pass.
    fix_if: >-
      A failing guard test means the hook writes git config on a non-signing surface; a failing
      isolation test means the suite is leaking into the real global git config.
    hermetic: false
    graduation: graduate
    graduation_check_id: cc-web-signing-hook-unit-suite
  - step: 3
    phase: pre-deploy
    action: >-
      Independent adversarial probe of the guards, outside the agent-authored test file: run the
      hook twice against a throwaway HOME and GIT_CONFIG_GLOBAL with commit.gpgsign=false, and
      assert it wrote nothing and exited 0 both times.
    command: >-
      bash -c 'D=$(mktemp -d); export HOME="$D" GIT_CONFIG_GLOBAL="$D/gc"; git config --global
      commit.gpgsign false; bin/venv-python .claude/hooks/session_start_commit_signing.py
      >/dev/null 2>&1 || exit 1; bin/venv-python .claude/hooks/session_start_commit_signing.py
      >/dev/null 2>&1 || exit 1; test -z "$(git config --global --get
      gpg.ssh.allowedSignersFile)" && echo GUARD_HELD_EXIT0'
    expected: >-
      Prints `GUARD_HELD_EXIT0` -- both runs exited 0 and neither set gpg.ssh.allowedSignersFile.
    fix_if: >-
      Empty output with a non-zero exit means the hook raised instead of exiting 0 (it runs on
      every SessionStart and must never wedge startup). A non-empty config value means the guard
      is missing and the hook writes config on surfaces that do not sign.
    hermetic: true
    graduation: graduate
    graduation_check_id: cc-web-signing-hook-guard-holds
  - step: 4
    phase: pre-deploy
    action: >-
      Prove the stale premise is gone from all four live surfaces, that each carries the corrected
      wording (not merely an absent phrase), that the generator no longer mints --no-gpg-sign, that
      both anti-churn directives survive, and that repo.tf's cross-reference tracks the retitled
      AGENTS.md heading rather than dangling.
    command: >-
      bash -c 'S=docs/audit-prompts/AUDIT-platform-roadmap-mvp-triage.md; K=.claude/skills/audit-prompt/SKILL.md;
      ! grep -rqiE "signing is unavailable|commits land unsigned|0-byte placeholder|Unsigned CC-web
      commits" AGENTS.md terraform/github/repo.tf "$S" "$K" && ! grep -q -- "--no-gpg-sign" "$K" &&
      grep -qi "SSH-signed" AGENTS.md && grep -qi "SSH-signed" "$S" && grep -q "do not add"
      terraform/github/repo.tf && grep -qi "reset-author" AGENTS.md && H=$(grep -o "### Commit
      signing[^\"]*" AGENTS.md | head -1) && grep -qF "$H" terraform/github/repo.tf && echo
      PREMISE_CORRECTED'
    expected: >-
      Prints `PREMISE_CORRECTED`. No false-premise phrase survives in any of the four files, both
      AGENTS.md and the MVP-triage prompt positively assert commits are SSH-signed, the generator
      no longer emits --no-gpg-sign, repo.tf still forbids adding required_signatures, AGENTS.md
      still forbids reset-author churn, and repo.tf quotes the current AGENTS.md heading.
    fix_if: >-
      A false-premise match means stale text survived a partial edit. A missing "SSH-signed"
      assertion means a file was blanked rather than corrected -- the positive leg exists so this
      guard cannot pass on a skipped edit. A heading mismatch means the retitle left repo.tf
      pointing at a subsection that no longer exists.
    hermetic: true
    graduation: graduate
    graduation_check_id: cc-web-signing-premise-corrected
  - step: 5
    phase: pre-deploy
    action: >-
      Prove the hook is registered in SessionStart and that settings.json is still valid JSON --
      a malformed edit would disable every hook, including never_on_main.py (Decision 138).
    command: >-
      bin/venv-python -c "import json,sys;d=json.load(open('.claude/settings.json'));g=[k.get('command','')
      for b in d['hooks']['SessionStart'] for k in b['hooks']];sys.exit(0 if
      any('session_start_commit_signing' in c for c in g) else 1)" && echo REGISTERED
    expected: Prints `REGISTERED`.
    fix_if: >-
      A JSON decode error means the settings.json edit broke the file. A non-zero exit with valid
      JSON means the hook exists but is not wired into SessionStart, so it never runs.
    hermetic: true
    graduation: graduate
    graduation_check_id: cc-web-signing-hook-registered
  - step: 6
    phase: pre-deploy
    action: >-
      Prove the AGENTS.md rewrite stays inside the S1 ambient prose ratchet and that the
      audit-prompt skill did not grow, without any budget edit. Headroom at planning time: S1
      33100/33215 (115 bytes) and the existing subsection is 644 bytes, so the replacement ceiling
      is about 759 bytes; .claude/skills/audit-prompt/SKILL.md sits at 25800/25800, exactly zero.
    command: >-
      bin/venv-python -c "from scripts.checks.prose import prose_limits;f=[];prose_limits.validate_prose_limits(f);raise
      SystemExit(1 if f else 0)" && echo PROSE_OK && git diff --quiet origin/main --
      config/prose_budgets.yaml && echo BUDGET_UNRAISED
    expected: >-
      Prints `PROSE_OK` then `BUDGET_UNRAISED` -- every gated surface is within budget and
      config/prose_budgets.yaml was not modified at all.
    fix_if: >-
      An over-budget failure on S1 means the AGENTS.md rewrite exceeded its ceiling: cut lower-value
      bullets in the ranked order given in execution step 5 (the Decision 83 back-reference goes
      first -- repo.tf already points here, so the reverse pointer is the least load-bearing). An
      over-budget failure on the audit-prompt skill means the edit added text where it must only
      remove. Do NOT relocate ambient git-ops guidance into .claude/commands/plan.md to dodge the
      budget: this guidance is needed by every session, not just /plan. Do NOT take a
      Decision-cited raise, and do NOT reseed the budgets file in either direction.
    hermetic: true
    graduation: waive
    graduation_waiver_reason: >-
      Not admissible under VF-06's differential gate: the asserted property (all gated surfaces
      within budget, budgets file unmodified) already holds on origin/main, so run_differential
      would find the check passing on the reverted tree and reject the row as tautological. It is a
      regression guard on a pre-existing invariant, not evidence of this change.
  - step: 7
    phase: pre-deploy
    action: >-
      Prove the /plan command pushes before the critique gates, pushes each revision commit, and
      force-pushes with lease after the Step 11 rebase. Anchors on both literal push forms so a
      later restructure cannot satisfy it with an unrelated push line.
    command: >-
      bash -c 'grep -q -- "git push --force-with-lease" .claude/commands/plan.md && grep -q "git
      push -u origin HEAD" .claude/commands/plan.md && test "$(grep -c "git push"
      .claude/commands/plan.md)" -ge 3 && echo PUSH_EARLY_WIRED'
    expected: >-
      Prints `PUSH_EARLY_WIRED`; plan.md contains the Step 8 plain push, a Step 9/10 revision-commit
      push, and the leased Step 11 push.
    fix_if: >-
      Fewer than three push sites means a commit site was missed -- an unpushed revision commit
      re-strands the next turn boundary, which is the exact friction this change removes. A missing
      --force-with-lease means Step 11 fails once the branch is already pushed before its rebase.
    hermetic: true
    graduation: graduate
    graduation_check_id: cc-web-plan-push-early-wired
  - step: 8
    phase: pre-deploy
    action: >-
      Confirm the harness-defect recommendation was actually filed and carries the coupling
      fragility, by refreshing the local read cache and grepping it.
    command: >-
      bash -c 'bin/venv-python -m scripts.sync.ops pull >/dev/null 2>&1; grep -qiE
      "allowedSignersFile|stop-hook-git-check" logs/.recommendations-log.jsonl && echo REC_FILED'
    expected: Prints `REC_FILED`.
    fix_if: >-
      No match means execution step 8 was skipped or the portal write failed. Portal writes fail
      loudly with no offline outbox (Decision 84 I-4) -- verify the chain with
      "aws sts get-caller-identity --profile agent_platform" and re-file.
    hermetic: false
    graduation: not-applicable
  - step: 9
    phase: pre-deploy
    action: Run the authoritative pre-merge gate over the whole change.
    command: bin/venv-python -m scripts.validate --pre
    expected: Exit 0.
    fix_if: Address each reported failure; do not bypass with --ignore-budget.
    hermetic: false
    graduation: not-applicable
constraints:
  - >-
    Do NOT reintroduce a probe-sign / SSHSIG key-derivation step. Verified empirically: the N->B
    transition depends only on gpg.ssh.allowedSignersFile naming a file -- an empty file, an
    unrelated key, and a nonexistent path all yield B. Deriving the real key cannot change the
    outcome (local verification can never run: ssh-keygen is absent and the harness signer accepts
    only -Y sign), and writing a derived key would assert a principal-to-key trust binding this
    container never authenticated. An empty, comment-headed file is the more honest artefact
    (Decision 100: do not substitute custom tooling for native behaviour).
  - >-
    Do NOT justify the hook's guards as preventing a masked unsigned commit. Verified empirically:
    a commit with no signature reports %G? = N whether or not allowedSignersFile is set, so the
    harness predicate still catches it; and with commit.gpgsign true a broken signer makes git
    commit FAIL outright rather than emit an unsigned commit. The guards exist so the hook is inert
    on non-signing surfaces, not as a safety interlock. State that honestly -- an unverified
    mechanism claim is exactly what this plan exists to delete from the repo.
  - >-
    Do NOT ground the repo.tf directive on any wedging claim. The human confirmed GitHub reports
    these commits as Verified for both actors, so required_signatures would most likely NOT wedge
    the squash-merge flow -- asserting otherwise would replace one unverified mechanism claim with
    another. Ground it on what Decision 83 actually ratified: a deliberately minimal rule set.
  - >-
    Do NOT delete, edit, or otherwise disable /root/.claude/launcher-settings.json or
    /root/.claude/stop-hook-git-check.sh. They are harness-owned, outside the repo, regenerated per
    container, and the human explicitly deprioritised that route.
  - >-
    Do NOT add a Stop hook intended to suppress the harness one. Claude Code merges hooks from all
    settings sources additively; there is no override or cancel semantics, so a repo Stop hook
    exiting 0 cannot neutralise the harness hook's exit 2. Verified this session: the harness
    SessionStart hook and the repo's six SessionStart hooks all ran in the same session.
  - >-
    Ten already-composed audit prompts also carry the false premise and are deliberately EXCLUDED
    from scope: AUDIT-decisions-authoring-format.md:545, AUDIT-pending-cd-premise-validity.md:540,
    AUDIT-terraform-deploy-redesign.md:730, AUDIT-decision-consolidation-growth.md:676,
    AUDIT-rust-lambda-executor-feasibility.md:264, AUDIT-audit-scope-discovery.md:581,
    AUDIT-decision-log-premise-integrity.md:559, AUDIT-executor-substrate-and-billing-shape.md:849,
    AUDIT-repository-structure.md:667, AUDIT-terraform-deployment-strategy.md:365. Rationale: each
    is generated commit-flow boilerplate emitted by the audit-prompt skill, and a composed prompt
    is the historical record of the brief handed to one past session -- the same immutability
    argument applied to merged plan documents below. Fixing the GENERATOR stops new prompts from
    carrying it, which is the durable fix; the MVP-triage prompt is in scope only because its
    instance is hand-written finding-suppression guidance the generator fix cannot reach. This
    exclusion is recorded rather than silent, and the residual sweep is named in the filed rec.
  - >-
    The allowed-signers file lives under $HOME and is NEVER committed, echoed into a repo-tracked
    file, or printed into CI logs (Decision 101).
  - >-
    Tests MUST isolate both HOME and GIT_CONFIG_GLOBAL (GIT_CONFIG_GLOBAL is the reliable lever --
    HOME alone does not redirect git's global config in every invocation). A test that writes the
    real --global config is a defect.
  - >-
    AGENTS.md must stay within the S1 prose ratchet (<= 33215 bytes for the ambient load set) and
    .claude/skills/audit-prompt/SKILL.md must not grow at all (S4 headroom is exactly 0, so that
    edit may only remove text). No raise-approved marker, and no edit to config/prose_budgets.yaml
    in either direction.
  - >-
    Leave .claude/skills/implement/SKILL.md untouched -- it has 10 bytes of S4 budget headroom and
    already documents the --force-with-lease rule the push-early change depends on.
  - >-
    terraform/github/repo.tf is comment-only. Change no resource attribute; do not add
    required_signatures; do not run or request a terraform apply (Decision 126).
  - >-
    Both commit-safety layers stay intact: never_on_main.py (PreToolUse) and the pre-commit hook
    (Decision 138 / CD.5). The new SessionStart hook augments them and must not reorder or weaken
    either.
  - >-
    docs/plans/PLAN-commit-signing-cc-web.yaml is deliberately NOT edited. A merged plan document
    is an immutable historical record of what was decided at the time, not a live instruction
    surface; this plan's context section records the supersession instead.
  - No new numbered Decision -- an operational-fact correction routes to a rec (Decision 150).
  - No new standing prose-architecture doc under docs/ (Decision 86).
  - No emojis; ASCII hyphens only. Python 3.12+ with type hints; ruff line length 127.
  - No rescue agents or workaround loops (Decision 55).
context:
  - >-
    Root cause, established empirically this session in the live container. Commits in CC-web ARE
    SSH-signed: git cat-file -p HEAD shows a gpgsig "-----BEGIN SSH SIGNATURE-----" header on every
    local commit. Global config carries commit.gpgsign=true, gpg.format=ssh, and
    gpg.ssh.program=/tmp/code-sign (a symlink to the harness environment-manager binary, which
    signs with a HOST-HELD key and prints "Key file ... (ignored, using server key)"). The 0-byte
    user.signingkey file is therefore a placeholder, not evidence that signing is broken.
  - >-
    git log --format=%G? returns N NOT because a signature is missing but because
    gpg.ssh.allowedSignersFile is unset -- git 2.43 short-circuits SSH-signature verification to N
    before inspecting the commit. Setting the key to ANY existing path yields B instead of N. Local
    verification can never reach G in this container: ssh-keygen is not installed, and the harness
    signer rejects everything except -Y sign ("unsupported code-sign operation: currently only
    SSH-style signing (-Y sign) is supported").
  - >-
    Two claims from the first draft of this plan were tested and FALSIFIED, and the design was
    reduced accordingly. (1) Setting allowedSignersFile cannot mask a genuinely unsigned commit: a
    commit with no gpgsig header reports %G? = N with the setting pointed at an existing empty file,
    identical to the unset case, because the setting only affects verification of a signature that
    exists. (2) With commit.gpgsign true and a deliberately failing signer, git commit aborts with
    "fatal: failed to write commit object" and creates no commit at all. The first draft's
    probe-sign, SSHSIG parser, and four-branch "fail-safe" therefore defended a failure mode git's
    own semantics preclude, and were deleted.
  - >-
    The defect is in the harness Stop hook /root/.claude/stop-hook-git-check.sh (registered by
    /root/.claude/launcher-settings.json). Its inline comment asserts "signed-but-locally-
    unverifiable commits report B/U/E, so this is a reliable presence check" -- empirically false
    for gpg.format=ssh. Its check is gated on commit.gpgsign==true and scoped to <upstream>..HEAD,
    so it fires only on UNPUSHED commits; a push clears it. That is why the push-early change to
    .claude/commands/plan.md is the second half of the fix -- it targets the hook's LEGITIMATE
    unpushed-commit branch (lines 63-71), which is separate from the false-positive signature
    branch the hook file addresses.
  - >-
    Upstream-coupling fragility (record this in the filed rec too). The mitigation works by turning
    "no signature" (N) into "bad signature" (B) and relying on the harness predicate testing
    $2 == "N". If upstream tightens that predicate to != "G", the repo-side hook silently stops
    working, because G is unreachable in this container. The failure mode is a return to today's
    noise, not a correctness regression, but it is unrecorded anywhere upstream can see it.
  - >-
    End-to-end simulation against the real harness hook script, on a scratch repo with one unpushed
    signed commit: WITHOUT allowedSignersFile it exits 2 with the "Unverified (missing signature)"
    text and the amend/reset-author remediation; WITH it set, the signature branch passes and the
    hook falls through to its legitimate "1 unpushed commit(s)" message; after git push it exits 0.
  - >-
    The harness predicate has TWO independent triggers: awk '$2 == "N" || $3 !=
    "noreply@anthropic.com"'. Only the signature half is a false positive. The committer-email half
    is a real check for which the hook's amend/reset-author remediation is CORRECT. The AGENTS.md
    rewrite must keep that distinction, folded into the "if it still fires" bullet, so the blanket
    do-not-amend directive does not train agents to ignore a legitimate trigger.
  - >-
    The human confirmed (2026-08-03) that GitHub reports commits from this surface as Verified for
    both the human and the agent. Two consequences: the local N/B flag is purely a
    local-verification artefact, AND the old repo.tf claim that required_signatures "would wedge"
    the merge flow is itself unsupported -- which is why the re-grounding cites Decision 83's
    minimal-ruleset design rather than any wedging or verifiability claim.
  - >-
    Surface census for the false premise, measured by repo-wide grep this session: 14 live
    occurrences across 13 files. Four are in scope (AGENTS.md, terraform/github/repo.tf,
    .claude/skills/audit-prompt/SKILL.md as the generator, and the hand-written MVP-triage
    instance). Ten are already-composed audit prompts, excluded with rationale in the constraints.
    The first draft of this plan said "three surfaces" and its VP grep pattern did not even match
    the MVP-triage text, so that acceptance criterion had zero coverage -- both were caught by the
    round-2 critique and are fixed here.
  - >-
    Prior art and why it was wrong. docs/plans/PLAN-commit-signing-cc-web.yaml (merged) diagnosed
