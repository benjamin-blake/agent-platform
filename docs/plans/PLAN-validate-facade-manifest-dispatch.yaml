rollback: >-
  Revert the single squash commit. The change is self-contained: dispatch, manifests, tests, the
  registry rows, and the Decision entries all move together, and no artefact outside the repo is
  written. The one asymmetry worth naming is that reverting restores the facade AND the
  pre-derivation tier order together -- they are coupled by construction, which is why they ship in
  one commit rather than two.
