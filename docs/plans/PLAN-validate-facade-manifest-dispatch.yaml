slug: "validate-facade-manifest-dispatch"
intent: >-
  Delete the 189-SLOC check-facade re-export block from scripts/validate.py and rewire check
  dispatch from globals()[name] to per-domain declarative manifests resolved lazily at call time,
  ending the "adding a check touches the SLOC-capped aggregator" coupling that Decision 104 left
  in place and making the merge gate's import closure independent of every check's dependencies.
plan_type: IMPLEMENTATION
verification_tier: V2
plan_path: docs/plans/PLAN-validate-facade-manifest-dispatch.yaml
phase: >-
  Platform hygiene / SLOC governance (Decision 128), amending Decision 104's facade mechanism and
  discharging Decision 159's stated SLOC-raise retirement condition. PR2 of a two-PR split; PR1
  merged as c2d0acd (#881).
