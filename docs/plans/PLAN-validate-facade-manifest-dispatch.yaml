acceptance_criteria:
  - scripts/validate.py contains zero `from scripts.checks.<domain>.<module> import` statements and is at or below 320 SLOC, with no entry added to config/sloc_budgets.yaml.
  - Importing scripts.validate imports NO check module -- the merge gate's import closure is independent of every check's dependencies, which is what makes the venv-less terraform-validate required check robust.
  - Dispatch resolves the defining module at call time, so patching that module intercepts; the resolved callable is never cached, proven by a negative control that fails if a warm cache is introduced.
  - Every @register'd check name has exactly one manifest Entry and vice versa, with exactly one declared unsequenced exception (validate_terraform_try); no duplicate names; no manifest names a module outside its own domain package.
  - registry.all_checks() returns the complete roster without importing scripts.validate, and its contents equal the union of manifest-declared names -- asserted by set identity, never by a hardcoded count.
  - Every Entry.module is a plain string constant that resolves to a real dependency-graph node, enforced by a registered check (not prose), which fails on an f-string, a colon form, and an unresolvable module.
  - The driver->check graph edges the manifests produce equal the set of declared Entry.module values -- compared by edge IDENTITY, not cardinality.
  - Under a ~20-file synthetic check-module diff, the affected-set selector still selects the manifest/registry tests despite CAP=35 truncation; a one-file sentinel is explicitly NOT accepted as evidence.
  - Tier check-name MEMBERSHIP is preserved exactly for both tiers against a baseline captured before editing; scaffold anchors keep their exact frozen order; and ordering dependencies OD-1..OD-6 hold. Byte-parity of check ORDER is explicitly NOT claimed.
  - No `patch("validate.<check_name>")` site and no `vars(_validate)` dispatch assertion remains, while the ~60 scaffolding/stdlib patch sites still resolve (asserted non-empty, so the grep cannot pass vacuously).
  - tests/test_checks_registry.py is deleted, its dec-159 budget entry is removed, and the _CHECKS_REGISTRY_MECHANISM_FILES special case is gone -- discharging Decision 159's stated retirement condition.
  - Every graduated registry row referencing an in-scope path either still resolves or is deliberately retired in this PR, with the choice recorded -- including the four literal-path rows enumerated in context.
  - docs/contracts/check-manifest.yaml passes validate_contract_drift as a declared Class D contract whose evaluator demonstrably reads it.
  - The new Decision carries the Decision 167 yaml envelope with a significance routing claim; Decisions 162 and 163 gain `Amended by` blockquotes with their existing reversal sentences byte-unchanged; docs/decisions-index.json is regenerated.
  - The full presubmit tier passes and emits the same check roster as a baseline captured before editing.
verification_plan:
  - step: 1
    phase: pre-deploy
    action: Importing scripts.validate pulls in NO check module -- the facade is gone in substance, not just in syntax.
    command: 'bin/venv-python -c "import subprocess,sys; code=chr(10).join([\"import sys, importlib\", \"importlib.import_module(chr(115)+chr(99)+chr(114)+chr(105)+chr(112)+chr(116)+chr(115)+chr(46)+chr(118)+chr(97)+chr(108)+chr(105)+chr(100)+chr(97)+chr(116)+chr(101))\", \"leaked=[m for m in sys.modules if m.startswith(chr(115)+chr(99)+chr(114)+chr(105)+chr(112)+chr(116)+chr(115)+chr(46)+chr(99)+chr(104)+chr(101)+chr(99)+chr(107)+chr(115)+chr(46)) and m.count(chr(46))>=3 and not m.rsplit(chr(46),1)[1].startswith(chr(95))]\", \"print(len(leaked), sorted(leaked)[:5])\", \"sys.exit(1 if leaked else 0)\"]); r=subprocess.run([sys.executable,\"-c\",code],capture_output=True,text=True); print(r.stdout.strip(), r.stderr.strip()[-300:]); sys.exit(r.returncode)"'
    expected: >-
      Zero leaked check modules. A fresh subprocess is required -- the parent interpreter may
      already have imported check modules for other reasons, which would mask the property.
      Private helpers (_manifest, _schema, _common, _scaffolding) are excluded by the leading-
      underscore filter; those are the mechanism, not checks.
    fix_if: >-
      A non-zero count means some import path still eagerly binds check modules, so the venv-less
      terraform-validate job still depends on every check's transitive imports and the facade was
      only syntactically removed.
    hermetic: true
    graduation: graduate
    graduation_check_id: "validate-import-closure-excludes-check-modules"
  - step: 2
    phase: pre-deploy
    action: resolve() is late-bound and never caches the callable -- with a negative control that a warm cache would fail.
    command: 'bin/venv-python -m pytest tests/checks/registry/test_resolution.py -q'
    expected: >-
      Patching a check's DEFINING module intercepts dispatch; rebinding the module attribute
      between two resolve() calls is observed by the second call; an unknown name raises a named
      error rather than KeyError-ing deep in dispatch.
    fix_if: >-
      A warm callable cache makes unittest.mock.patch silently no-op, which turns every
      mock-based test of a check into a vacuous pass inside a merge gate. Verified empirically
      this session: late-bound getattr intercepts, a cached callable does not.
    hermetic: true
    graduation: graduate
    graduation_check_id: "registry-resolve-is-late-bound"
  - step: 3
    phase: pre-deploy
    action: Manifest<->@register bijection, duplicate-name, cross-package, and the all_checks() eager-population contract.
    command: 'bin/venv-python -m pytest tests/checks/registry/test_manifest_contracts.py -q'
    expected: >-
      Every registered name has exactly one Entry and every Entry a registration, with exactly one
      declared unsequenced exception (validate_terraform_try, invoked inside the terraform_checks
      bundle). No name appears in two manifests. No manifest names a module outside its own
      package. all_checks() is complete WITHOUT importing scripts.validate, and equals the union
      of manifest-declared names by set identity.
    fix_if: >-
      @register remains the identity oracle and is the only sound oracle for orphan detection; a
      manifest entry with no registration is a check that dispatches but is invisible to
      validate_ci_rca_taxonomy and contracts/_population.py, both of which read all_checks().
    hermetic: true
    graduation: graduate
    graduation_check_id: "manifest-registry-bijection-holds"
  - step: 4
    phase: pre-deploy
    action: The bare-string-literal grammar has an executable evaluator that actually discriminates.
    command: 'bin/venv-python -m pytest tests/checks/deps/test_validate_check_manifests.py -q'
    expected: >-
      The check FAILS on each of: an f-string module value, a "module:attr" colon form, a module
      resolving to no graph node, and a segment token present in _schema.py but not the contract
      (or vice versa). Each negative case is asserted to fail; a test that only asserts the clean
      tree passes would be vacuous.
    fix_if: >-
      Decision 168: a rule with no evaluator is not a rule. dependency_graph.py's _PATCH_STRING_RE
      is anchored `^(src|scripts)(\.\w+)+$`, so an f-string or colon form silently matches nothing
      and severs the driver->check edge with no error anywhere -- exactly Decision 135's failure
      mode.
    hermetic: true
    graduation: graduate
    graduation_check_id: "manifest-entries-are-bare-string-literals"
  - step: 5
    phase: pre-deploy
    action: Driver->check graph edges equal the declared Entry.module set -- edge IDENTITY, not count.
    command: 'bin/venv-python -m pytest "tests/checks/registry/test_manifest_contracts.py::TestGraphEdges" -q'
    expected: >-
      For each of the 18 manifests, the set of graph successors equals the set of that manifest's
      Entry.module values. Set equality, never a count comparison -- a cardinality check passes
      while pointing at the wrong modules.
    fix_if: >-
      A missing edge means affected-test selection silently stops selecting the driver's tests
      when a check module changes, which is invisible until a regression ships.
    hermetic: true
    graduation: graduate
    graduation_check_id: "manifest-driver-edges-match-entry-modules"
  - step: 6
    phase: pre-deploy
    action: The driver edge survives CAP=35 truncation under a ~20-file synthetic diff (a one-file sentinel is vacuous).
    command: 'bin/venv-python -m pytest "tests/checks/registry/test_manifest_contracts.py::TestAffectedSetSurvival" -q'
    expected: >-
      Feeding ~20 changed check modules to the affected-set selector still yields the manifest and
      registry tests. Measured premise: today a check-module change selects 18 tests and ZERO
      tests/validate/*; under the new design the driver edge is a 4-hop transitive ancestor at
      priority rank 2, which CAP=35 (scripts/checks/deps/affected_tests.py:59) truncates first.
    fix_if: >-
      A one-file chain sentinel passes trivially and proves nothing about the truncation boundary,
      which is where this actually breaks. If the edge is truncated, the fix is priority rank, not
      raising CAP.
    hermetic: true
    graduation: graduate
    graduation_check_id: "affected-set-retains-driver-tests-under-synthetic-diff"
  - step: 7
    phase: pre-deploy
    action: MUTATION with control arm -- an f-string module value in a real manifest must redden the grammar evaluator.
    command: 'bin/venv-python -c "import pathlib,re,shutil,subprocess,sys,tempfile; q=chr(34); tmp=pathlib.Path(tempfile.mkdtemp())/chr(119)+chr(116); tmp=pathlib.Path(str(tmp)); subprocess.run([\"git\",\"worktree\",\"add\",\"--detach\",str(tmp)],check=True,capture_output=True); shutil.copytree(\"scripts\",tmp/\"scripts\",dirs_exist_ok=True); shutil.copytree(\"tests\",tmp/\"tests\",dirs_exist_ok=True); shutil.copytree(\"docs/contracts\",tmp/\"docs/contracts\",dirs_exist_ok=True); sel=[\"tests/checks/deps/test_validate_check_manifests.py\"]; run=lambda: subprocess.run([sys.executable,\"-m\",\"pytest\",*sel,\"-q\"],cwd=tmp,capture_output=True,text=True).returncode; ctl=run(); assert ctl==0, (\"CONTROL ARM FAILED -- harness broken, result is meaningless\", ctl); p=tmp/\"scripts/checks/sloc/_manifest.py\"; s=p.read_text(); m=re.search(r\"module=\\\"(scripts\\.[\\w.]+)\\\"\", s); assert m, \"no bare module= literal found -- manifest shape changed\"; s2=s[:m.start()]+\"module=f\\\"{__name__.rsplit(chr(46),1)[0]}.\"+m.group(1).rsplit(chr(46),1)[1]+\"\\\"\"+s[m.end():]; p.write_text(s2); mut=run(); subprocess.run([\"git\",\"worktree\",\"remove\",\"--force\",str(tmp)],capture_output=True); print(\"control\",ctl,\"mutant\",mut); sys.exit(0 if mut!=0 else 1)"'
    expected: >-
      Control arm exits 0 (harness sound); mutant exits non-zero. The f-string still yields a
      correct module path at runtime, so ONLY a grammar check that inspects the AST -- not one
      that merely resolves the value -- can detect it. That is the whole point.
    fix_if: >-
      Control failing means the harness is broken and the result is meaningless. Mutant passing
      means the evaluator resolves values rather than inspecting literals, and the silent
      edge-severing failure mode is still open.
    hermetic: false
    graduation: waive
    graduation_waiver_reason: >-
      Requires a scratch git worktree plus an in-place source mutation -- multi-command and
      non-hermetic, so not expressible in any canonical primitive slot. It is the one-time
      decisive proof that step 4's evaluator discriminates, while step 4 is the standing gate.
  - step: 8
    phase: pre-deploy
    action: Tier membership is preserved exactly and ordering dependencies OD-1..OD-6 hold.
    command: 'bin/venv-python -m pytest tests/checks/registry/test_sequences.py -q && bin/venv-python -c "import json,pathlib,sys; from scripts.checks import registry; b=pathlib.Path(\"logs/debug/tier-baseline.json\"); assert b.exists(), \"baseline missing -- capture it before editing (pre_implementation_checklist)\"; B=json.loads(b.read_text()); pre={s.name for s in registry.pre_sequence() if s.kind==\"check\"}; full={s.name for s in registry.full_sequence() if s.kind==\"check\"}; assert pre==set(B[\"pre\"]), (sorted(pre^set(B[\"pre\"]))); assert full==set(B[\"full\"]), (sorted(full^set(B[\"full\"]))); print(\"membership preserved\", len(pre), len(full))"'
    expected: >-
