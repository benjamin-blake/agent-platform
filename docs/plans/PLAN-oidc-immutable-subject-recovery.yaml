execution_steps:
  - >-
    PR-1 step 1 -- terraform/personal/oidc.tf: append "benjamin-blake@217728084/theseus@1252427466" to
    local.github_repos as a third entry. It is a REPO SEGMENT, not a full sub prefix: the six sub sites
    already render "repo:${repo}:<suffix>", so an entry beginning with "repo:" would render
    "repo:repo:..." and match nothing. Re-ground the dual-slug comment to explain the immutable format
    and that the numeric ids, not the names, are the durable identity. AUTHORING CAUTION: the
    re-grounded comment must not contain the literal "github_repos = [" (the invariant test's regex
    takes the first file-wide match) nor "local.github_repo" followed by a non-word character
    (TestNoScalarSurvivor).
  - >-
    PR-1 step 2 -- terraform/bootstrap/github_ci_apply.tf: make the identical one-entry change to its
    own local.github_repos, and refresh the stale sub-shape comment at lines 41-44. Same authoring
    caution as step 1.
  - >-
    PR-1 step 3 -- tests/checks/iam_tf/test_oidc_trust_slug_invariants.py: FIRST extend the module's
    file set to also read terraform/personal/oidc_ci_roles.tf and terraform/personal/oidc_pipeline_roles.tf
    -- it currently reads only oidc.tf and github_ci_apply.tf, and three of the five expected suffixes
    (:ref:refs/heads/agent/*, :pull_request, :ref:refs/pull/*) appear in neither, so VP step 2 cannot
    pass without this. Then add TestImmutableSubjectEntry asserting (a) both roots declare an entry of
    the form NAME@DIGITS/NAME@DIGITS carrying owner id 217728084 and repo id 1252427466, (b) no entry
    in either list begins with "repo:", and (c) the flattened expansion yields all five expected
    immutable sub literals. Leave the existing Decision 94 and cross-root assertions untouched.
  - >-
    PR-1 step 4 -- .github/workflows/ci.yml: add the zero-credential identity anchor to the pr-validate
    job, echoing the github.repository_id and github.repository_owner_id context values. pr-validate
    uses no OIDC and no AWS, so it runs green during the outage. This makes the numeric ids the trust
    policy pins falsifiable against GitHub rather than against this plan's own literals.
  - >-
    PR-1 step 5 -- docs/DECISIONS.md: add Decision 172 recording the immutable-subject migration,
    amending the dual-slug ruling that Decision 171 will carry. Include reversal conditions and the
    pre-stage-before-future-renames playbook (a future rename changes only the NAME halves; trusting a
    not-yet-mintable sub is harmless, so pre-stage additively before renaming). Use the typed yaml
    envelope with a significance routing token per Decision 167/150.
  - >-
    PR-1 step 6 -- run VP steps 1, 2, 3, 6, 9 and 10, then commit, push, open PR-1, and merge on green.
    Confirm on the PR run that the identity-anchor printed ids equal the pinned literals BEFORE
    proceeding to the apply.
  - >-
    PR-1 step 7 -- BREAK-GLASS APPLY (human-gated, Decision 126). From the admin container under
    agent_platform_admin: terraform init both roots (personal needs the Decision 120 mirror), run plan
    with -target on aws_iam_role.github_ci_branch, .github_ci_pr, .github_ci_planner, .github_ci_deploy
    for terraform/personal and a whole-root plan for terraform/bootstrap. PRESENT BOTH PLAN OUTPUTS TO
    THE HUMAN AND STOP. Apply only on explicit human direction. Confirm the trust diff is additive --
    no statement removed, no condition operator changed.
  - >-
    PR-1 step 8 -- run VP steps 11 and 12 to prove live assume under the immutable sub, exercising each
    role first as VP step 12 describes (deploy is not driven by this plan; record it as pending). Then
    run one terraform-apply-sandbox workflow_dispatch acknowledge-and-retry to write the convergence
    record green, and run VP step 13.
  - >-
    PR-2 step 1 -- create scripts/ci/convergence_advisory.py, extracting the advisory-status inline
    run: body (terraform-apply-sandbox.yml lines ~666-740, ~74 lines). It must read the convergence
    record and return a status state plus description, discriminating: NoSuchKey (success,
    pass-on-absent), credential/authorization failure (error, UNVERIFIED -- cannot read the record;
    not evidence of convergence), red record (failure), pending_gated (success with the routed-pending
    description), green (success). Discriminate on the error code, never on empty output -- that
    conflation is the defect. Reuse the NoSuchKey-vs-other-error pattern already at
    terraform-drift.yml:198-225 rather than inventing one. This extraction is REQUIRED before any line
    is added to that workflow (529/529 structural budget).
  - >-
    PR-2 step 2 -- create tests/test_convergence_advisory.py covering all five outcomes above, flat
    under tests/ per the scripts/ci convention.
  - >-
    PR-2 step 3 -- .github/workflows/terraform-apply-sandbox.yml advisory-status: replace the inline
    body with a thin adapter call to the new module (Decision 162), give the assume step an id, and add
    a negative-branch classifier. Keep the JOB green -- it must never red a PR, and terraform-converged
    must remain a non-required check (Decision 83).
  - >-
    PR-2 step 4 -- .github/workflows/terraform-apply-sandbox.yml speculative-plan: add a
    negative-branch classifier on oidc_plan that surfaces the failed assume (and states that no plan.bin
    was persisted, so the merge-time apply will fail closed) instead of silently skipping every step.
  - >-
    PR-2 step 5 -- .github/workflows/terraform-drift.yml: replace the positive-only gating with a
    negative-branch classifier that fails the job loudly when the assume fails. An assume failure is an
    ERROR, not drift: the workflow's own stated invariant already mandates loud on errors, the record
    stays untouched, and config/ci_rca_taxonomy.yaml deliberately excludes terraform-drift from ci-rca
    so there is no rec storm. Remove the now-stale bootstrap-window justification comment -- the
    planner role exists.
  - >-
    PR-2 step 6 -- create scripts/checks/ci_guards/validate_oidc_failopen_guards.py. Predicate: for
    every step in .github/workflows that uses aws-actions/configure-aws-credentials AND declares
    continue-on-error: true, require (a) a non-empty id, and (b) at least one reference to
    steps.<id>.outcome in a NEGATIVE branch anywhere in the same job. Match .outcome EXCLUSIVELY --
    never .conclusion, which GitHub forces to success under continue-on-error, so accepting it would
    admit a permanently-dead classifier. The negative match must be quoting-agnostic and tolerate the
    expression-split form: ci.yml's sanctioned mirror_oidc classifier compares the interpolated
    outcome to "success" with DOUBLE quotes, with the != separated from the word outcome by the
    closing expression braces and a quote character -- so use a proximity or line-scoped match
    accepting the single-quoted, double-quoted and bare forms. Scan step-level if: expressions, env:
    mappings, AND inline run: bodies (rec-2861 proposes moving mirror_oidc's reference into env:). No
    allowlist, no baseline. Report each violation with file and step name.
  - >-
    PR-2 step 7 -- register the check: add its Entry to scripts/checks/ci_guards/_manifest.py (pre=True,
    full_segment matching its ci_guards siblings, with pre_globs covering the workflows directory and
    the check's own module path) and add the function_to_category row to config/ci_rca_taxonomy.yaml
    that scripts.roadmap.plan_obligations requires for a new check module.
  - >-
    PR-2 step 8 -- create tests/checks/ci_guards/test_validate_oidc_failopen_guards.py with inline
    workflow fixtures covering: no id (fires), id with only positive equals-success gates (fires), id
    with an if:-level negative classifier (silent), id with a double-quoted run-body negative
    classifier in the exact ci.yml mirror_oidc shape (silent), a .conclusion-only reference (fires),
    and a step without continue-on-error (ignored entirely).
  - >-
    PR-2 step 9 -- run VP steps 4, 5, 7, 8 and 10, then commit, push, open PR-2, and merge on green.
    Include the Resolves: rec-3138 trailer in the squash-merge body of whichever PR lands last, with a
    resolution naming the immutable-subject root cause.
  - >-
    Execute Verification Plan -- run each step; loop until pass; on unrecoverable V3 failure stop and
    RCA (Decision 55)
  - >-
    File the follow-on recs named in Context under NOT IN SCOPE (legacy-entry contraction,
    PLAN-repo-rename-relicense re-scoping, environment-taxonomy.yaml:95 comment, the post-heal red-run
    and rec-close backlog sweep, and the undriven github_ci_deploy live-assume evidence)
  - 'Report: what was implemented, verification results'
work_areas: []
rollback: >-
  The trust change is purely additive -- the two legacy name-only entries stay trusted throughout, so
  reverting is a matter of removing the third list entry and re-applying via the same break-glass path.
  Nothing is removed at any point in this plan, so no role can lose a trust path it had before. The
  workflow changes revert cleanly by git revert of PR-2; the guard is a new module and its removal
  restores the prior (silent) behaviour without touching any other check.
