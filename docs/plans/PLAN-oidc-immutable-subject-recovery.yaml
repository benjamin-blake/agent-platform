rollback: >-
  The trust change is purely additive -- the two legacy name-only entries stay trusted throughout, so
  reverting is a matter of removing the third list entry and re-applying via the same break-glass path.
  Nothing is removed at any point in this plan, so no role can lose a trust path it had before. The
  workflow changes revert cleanly by git revert of PR-2; the guard is a new module and its removal
  restores the prior (silent) behaviour without touching any other check.
