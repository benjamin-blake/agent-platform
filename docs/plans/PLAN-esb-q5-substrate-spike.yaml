constraints:
  - >-
    THE EXCLUSION IS A RECORDED OPERATOR DECISION, NOT A DEFERRAL, AND IT IS NOT RE-OPENABLE MID-IMPLEMENTATION.
    The container arm (ECS/Fargate) and the shared-filesystem arm (EFS) are OUT OF SCOPE for three reasons the
    Decision must state: (1) STANDING COST -- both require a private network this AWS account has never had
    (measured: zero aws_vpc, aws_subnet, aws_nat_gateway, aws_vpc_endpoint, aws_ecs_* or aws_efs_* resources
    across all 38 terraform files), which is greenfield network infrastructure, and NAT bills hourly, unlike
    every other component here which is pay-per-use. (2) OPERABILITY -- network engineering is outside the
    operator's expertise; network failure modes are quiet and its costs standing, a bad combination to own while
    learning the domain. (3) RE-ARM CONDITIONS, which make this reversible rather than a dead end: revisit if
    (i) the platform matures to where standing network cost is justifiable, or (ii) these two arms fail to
    discriminate -- if durable and SFN come out close, or both show heavy workspace re-materialization, that IS
    the signal the Lambda framing is wrong and the container class earns its network build.
  - >-
    THE EXCLUSION DOES NOT RETIRE CD.27's ECS RUN TASK ESCAPE HATCH. CD.27's ratified discipline point keeps ECS
    Run Task as the only remaining Fargate path, and T4.1 carries a live exit criterion requiring a synthetic
    20-minute runTask.sync integration. What is excluded is the container class as a LAYER-2 PERSONA SUBSTRATE
    ARM IN THIS SPIKE. Writing the exclusion as though it retired the escape hatch would be a frame-lock of
    exactly the kind Decision 75 names -- state the boundary explicitly in the Decision.
  - >-
    EFS's ELIMINATION OF hosted_cli_runner IS RECORDED, NOT ASSUMED AWAY. CD.43 criterion W2 requires that a
    store which silently eliminates a CD.27 candidate be recorded as an explicit decision. EFS is structurally
    unreachable from GitHub-hosted runners, so selecting it would eliminate hosted_cli_runner outright. EFS is
    excluded here rather than selected, so the elimination does not occur -- and the Decision says so, together
    with the condition under which it would have to be recorded (if that reachability ever changes and EFS is
    re-armed).
  - >-
