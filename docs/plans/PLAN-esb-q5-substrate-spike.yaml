schema_version: 4
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: "esb-q5-substrate-spike"
intent: >-
  Run the audit's Q5 stub-persona spike at the two VPC-free arms the operator scoped -- the same minimal
  decision_scout loop as a Lambda DURABLE FUNCTION driven by Step Functions, and as HAND-ROLLED stateless
  Lambdas driven by Step Functions per iteration, each forced-killed mid-loop -- then discharge ESB-04 with a
  THIN numbered Decision that states the ruling and its reversal conditions and CITES the comparative record,
  the measurements and the per-arm detail to docs/plans/reports/esb-q5-spike-findings.yaml.
plan_type: IMPLEMENTATION
verification_tier: V3
plan_path: docs/plans/PLAN-esb-q5-substrate-spike.yaml
phase: >-
  Platform T4.1 / T4.2 (executor substrate) -- the CD.27 layer-2 substrate spike and the CD.43 workspace-store
  selection it feeds. Wave 5, the final wave, of the remediation run against
  audits/executor-substrate-and-billing-shape-ad02653.yaml; waves 1-4 (PLAN-esb-text-fix-bundle,
  PLAN-esb-workspace-store-criteria, PLAN-esb-fallback-spec-carrier, PLAN-esb-routing-rationale) are merged at
  f3e4e6d. Remediates ESB-04 (audits/executor-substrate-and-billing-shape-ad02653.yaml:887-907) against the Q5
  spike specification (same file, :315-337). First wave in the run that provisions real AWS infrastructure.
fallback_reevaluation:
  reevaluated_on: "2026-08-18"
  substrate_status: >-
    No Lambda Durable Functions API-semantics regression observed or reported at plan-filing time; the
    incumbent substrate's semantics are unchanged since CD.27's fallback_spec was written in wave 3.
  verdict: continue_on_current_substrate
  basis: >-
    Reviewed against CD.27 fallback_spec.trigger (an API-semantics regression inside the first 12 months after
    CD.27 ratifies). CD.27 is still state pending, so the trigger's live window has not opened and no
    regression evidence exists to evaluate. Recorded at FILING time deliberately -- recording an anticipated
    spike outcome here would be the after-the-fact assertion ESB-02 exists to remove. Sharpened for this wave's
    narrowed scope: fallback_spec.lapse_condition fires only if the spike pins a substrate carrying no
    Lambda-checkpoint-replay dependency (its own text names long_running_container and hosted_cli_runner). Both
    arms this plan measures are replay-based by CD.27's own classification
    (docs/ROADMAP-PLATFORM.yaml:947), so the lapse_condition CANNOT fire this wave. That is a disclosed
    consequence of the operator's exclusion, recorded here rather than discovered later.
scope:
  - file: scripts/esb_q5_spike/__init__.py
    action: Create
    purpose: >-
      Package marker so the spike modules are importable via bin/venv-python -m. A scripts/ SUBPACKAGE and
      deliberately NOT under src/ -- re-measured this session at f3e4e6d, compute_affected_artifacts returns {}
      for every scripts/esb_q5_spike/ path but returns {'data-pipeline': [...], 'ops-compaction': [...]} for
      'src/lambdas/esb_q5_durable/handler.py', because src/ is an include pattern on BOTH active manifests.
      Placing the spike under src/ would drag two unrelated production artifacts into CD.16 per-Lambda
      build/deploy/smoke-test scope. See the PLACEMENT context entry.
  - file: scripts/esb_q5_spike/loop.py
    action: Create
    purpose: >-
      The single minimal persona loop, written once and shared verbatim by BOTH compute arms so the arms differ
      only in substrate, never in business logic. read-workspace -> mocked-LLM-step -> tool-call ->
      write-artefact, N iterations, with an explicit resume cursor. decision_scout's loop shape, per CD.27's own
      ESB-04 precondition text naming decision_scout as the spike vehicle.
  - file: scripts/esb_q5_spike/mock_llm.py
    action: Create
    purpose: >-
      The only LLM surface in the spike. Deterministic, offline, and side-effect-recording: every call appends a
      (run_id, iteration, step) row to an append-only call ledger in the spike's own S3 prefix, so a resumed run
      that re-issues an already-completed step is DETECTABLE as a duplicate ledger row rather than inferred from
      logs. This ledger IS the resume-without-reissue measurement.
  - file: scripts/esb_q5_spike/workspace.py
    action: Create
    purpose: >-
      Workspace persistence strategies behind one registry (STRATEGIES) so the measurement harness enumerates
      them rather than naming them. Exactly two entries, both mandatory: s3_per_object and s3_tarball. With EFS
      and container-local both excluded, S3-sync is the backing store under test and the audit itself calls it
      "the only backing store portable across the full candidate set"; its per-object and tarball shapes have
      materially different cost and latency profiles and CD.43 criterion W5 demands BOTH a byte term and an
      object-count term, so the re-materialization metric is meaningless with one.
  - file: scripts/esb_q5_spike/handlers.py
    action: Create
    purpose: >-
      The two Lambda entry points, both wrapping loop.py: the durable-function arm (checkpoint/replay inside one
      invocation) and the stateless per-iteration arm (one invocation per loop iteration, state carried in the
      Step Functions execution plus an S3 workspace pointer). Kept in one module so the hand-roll residue
      measurement compares two implementations of the same contract side by side.
  - file: scripts/esb_q5_spike/measure.py
    action: Create
    purpose: >-
      The measurement harness: drives one arm, issues the forced kill mid-loop, resumes, and emits the three
      audit metrics (resume-without-reissue, hand-roll residue, workspace re-materialization cost) into
      findings.yaml. Derives strategy coverage from workspace.STRATEGIES rather than a hard-coded list, so a
      strategy added without a measurement fails the class check instead of passing silently.
  - file: tests/esb_q5_spike/__init__.py
    action: Create
    purpose: Test package marker mirroring scripts/esb_q5_spike/ (tests/checks/ precedent).
  - file: tests/esb_q5_spike/test_loop.py
    action: Create
    purpose: >-
      Unit coverage for what must be right BEFORE anything is provisioned: the loop's resume cursor, and BOTH
      DIRECTIONS of the mock's duplicate-detection ledger (a resumed run that re-issues a completed step is
      flagged; one that does not is NOT flagged). Re-measured this session, map_source_to_test returns None for
      every scripts/esb_q5_spike/ path (a NEW scripts/ subpackage is outside the six whitelisted families), so
      validate_test_coverage imposes no home -- these tests exist because AGENTS.md requires them, not because a
      checker demands the path.
  - file: tests/esb_q5_spike/test_workspace.py
    action: Create
    purpose: >-
      Round-trip coverage for both S3 strategies (materialize -> mutate -> re-materialize) against a local fake,
      plus the registry-completeness invariant measure.py depends on. Exercises real code paths.
  - file: tests/esb_q5_spike/test_arms.py
    action: Create
    purpose: >-
      Coverage for the two arm entry points and the harness: that both arms delegate to the SAME shared loop
      (the arms differ only in substrate), and that measure.measured_strategies() derives from
      workspace.STRATEGIES rather than a hard-coded list.
  - file: scripts/checks/iam_tf/_read_coverage.py
    action: Modify
    purpose: >-
      MEASURED THIS SESSION, AND THE FINDING BOTH PRIOR DRAFTS MISSED: aws_sfn_state_machine appears in NONE of
      CHECKED_TYPES / ENUMERATED_IAM_TYPES / TRANSITIVE_TYPES / NON_AWS_TYPES / NO_GRANT_TYPES, and
      _check_resource('aws_sfn_state_machine', ...) returns "unmapped resource type ... add a coverage rule",
      which validate_ci_refresh_read_coverage turns into a hard failure. The spike CANNOT introduce a Step
      Functions state machine under terraform/personal without a read classification. Adds the CHECKED_TYPES
      entry (states: refresh-read actions + the name attribute), nothing else.
  - file: scripts/checks/iam_tf/_write_coverage.py
    action: Modify
    purpose: >-
      The write half of the same gate, and equally load-bearing: this module is DISCOVERY-DRIVEN -- "every
      DISCOVERED terraform/personal resource type must be either WRITE_COVERAGE-mapped or WRITE_EXEMPT_TYPES-
      exempt ... A type that is neither FAILS LOUD" (module docstring). Adds the WRITE_COVERAGE entry for
      aws_sfn_state_machine with its resource marker on the agent-platform-esb-q5-* state-machine ARN family.
  - file: scripts/checks/iam_tf/_write_companions.py
    action: Modify
    purpose: >-
      LIFECYCLE_COMPANIONS is MANDATORY-DECLARATION over exactly WRITE_COVERAGE's key set -- a type with no
      create/update/delete row FAILS LOUD, and an empty companion tuple is legal only with a collocated
      justification. Adds the three phase rows for aws_sfn_state_machine, answering "what else does its delete
      phase call?" at review time rather than at the first live gated destroy.
  - file: tests/checks/iam_tf/test__read_coverage.py
    action: Modify
    purpose: >-
      Coverage for the new classification, both directions: aws_sfn_state_machine resolves to a read spec, and a
      still-unmapped type continues to produce the "unmapped resource type" finding (the guard must not have been
      widened into a catch-all).
  - file: tests/checks/iam_tf/test__write_coverage.py
    action: Modify
    purpose: >-
      Coverage for the WRITE_COVERAGE entry and, in the other direction, that a discovered-but-unmapped type
      still fails loud.
  - file: tests/checks/iam_tf/test__write_companions.py
    action: Modify
    purpose: >-
      Coverage that all three lifecycle phases are declared for aws_sfn_state_machine and that removing any one
      of them still fails the mandatory-declaration rule.
  - file: terraform/personal/esb_q5_spike.tf
    action: Create
    purpose: >-
      The whole spike stack, count-gated behind ONE default-false flag: two Lambda functions packaged from
      scripts/esb_q5_spike/ (named agent-platform-esb-q5-* so the EXISTING DailyOps log-read grant on
      /aws/lambda/agent-platform-* covers them without a second policy change), one Step Functions state machine
      per arm, the spike S3 prefix, the execution roles, AND the DailyOps `states:` grant as its OWN
      aws_iam_role_policy on the existing PlatformDev role. The grant lives HERE, not in platform_roles.tf,
      because that file measures exactly 587 effective lines against its exactly-587 structural budget -- any
      added line breaches it and would force a budget raise, where Decision 128 says decompose and the terraform
      class's own relief valve is "decompose by resource family (native .tf multi-file)". NO VPC, subnet, NAT
      gateway, VPC endpoint, ECS or EFS resource, and no Lambda vpc_config -- the exclusion is enforced
      structurally by absence and swept repo-wide by VP step 2, not asserted in prose.
  - file: terraform/personal/variables.tf
    action: Modify
    purpose: >-
      One new bool variable, esb_q5_spike_enabled, default false. No second flag: there is no EFS arm to gate,
      and adding a flag for an excluded arm would leave a provisioning path for something the operator excluded.
  - file: terraform/personal/oidc.tf
    action: Modify
    purpose: >-
      github_ci_planner's refresh-read grants live here (measured: this file holds the lambda:Get*/events:*/
      logs:*/cloudwatch:* read statements; 245 effective lines, so the terraform-class 500 ceiling has headroom).
      Adds the `states:` refresh-read statement so the new state machines are refresh-read-covered in the
      planner half of the two plan-capable role policies the coverage gate requires.
  - file: terraform/bootstrap/github_ci_apply_policy.tf
    action: Modify
    purpose: >-
      The apply half of the same requirement: github_ci_apply's identity policy gains the `states:` refresh-read
      and write grants for the agent-platform-esb-q5-* state-machine family. ADMIN-ONLY ROOT -- Axis A bootstrap
      is "admin-only (agent_platform_admin), NEVER auto-apply, out-of-band from CD pipeline". This edit lands in
      the PR but its apply is an out-of-band operator action that must precede the personal-root apply.
  - file: terraform/bootstrap/github_ci_apply_boundary.tf
    action: Modify
    purpose: >-
      A boundary is a CEILING: measured this session, DataPlaneAllow's service list carries s3/athena/glue/
      dynamodb/lambda/logs/events/sns/cloudwatch/secretsmanager/ssm and NO states:. Without the ceiling
      extension, BOTH the apply-role grant above and the DailyOps grant in the spike .tf are silently denied by
      the identity/boundary intersection -- PlatformDev carries this same boundary. Same admin-only root, same
      out-of-band apply ordering.
  - file: docs/plans/reports/esb-q5-spike-findings.yaml
    action: Create
    purpose: >-
      THE CITED EVIDENCE RECORD, and the load-bearing half of this wave's re-shaped deliverable. Machine-parseable:
      audit_q5_arm_set, arms[], excluded_arms{} with all three recorded reasons each, the per-arm measured
      metrics, the per-strategy re-materialization records, the W6 scale basis with its measurement command and
      date, the derived comparative table over CD.27's five pinned candidates, and the per-option W1-W8
      disposition of CD.43's seven-member option_set. A data artifact in the home docs/CLAUDE.md's class->home
      map names for spike notes (live sibling precedent: docs/plans/reports/ducklake-spike-findings.md) -- NOT a
      standing prose-architecture doc, so Decision 86's intent-doc freeze is not engaged. Classified
      workflow_outputs by the structural engine (measured), so it carries no size ceiling.
  - file: docs/DECISIONS.md
    action: Modify
    purpose: >-
      ONE new entry, `## Decision 173:` (re-check the max header at execution time per the numbering-race note;
      172 is the current max, measured). THIN by construction: the ruling, the exclusion with its three recorded
      reasons, the reversal conditions, the ESB-06 residual, and the explicit entry-versus-evidence split -- with
      the comparative record, measurements and per-arm detail CITED to the findings file. NO COMPACTION PASS:
      re-measured at f3e4e6d the ceilings have headroom (see the CEILINGS context entry), and Decision 37 in
      particular is NOT compacted -- 14 live files cite its Secrets-Manager runtime-fetch precedent, its
      superseder restates none of it, and its eligibility is an open human adjudication.
  - file: docs/decisions-index.json
    action: Modify
    purpose: >-
      Regenerated projection of the new entry. Measured this session by splice-and-regenerate with the SHIPPED
      generator: the entry costs 925 index bytes, taking the index from 119,189 to 120,114 against the
      131,000-byte pin -- 10,886 bytes of headroom after. Not a binding constraint this wave.
  - file: docs/ROADMAP-PLATFORM.yaml
    action: Modify
    purpose: >-
      FIVE sites move as one set, not one site at a time (see the CLASS-VERSUS-SITE SWEEP context entry): (i)
      CD.43 workspace_store_selection.selected_store replaces TBD_at_CD.43_ratification with the measured
      selection and status leaves criteria_only (:1497-1498); (ii) CD.43's `detail` prose asserting they stay
      that way until ratification is compacted per Decision 147's ratified-CD norm (:1477-1487); (iii) CD.43's
      "Criteria-only discipline" discipline point, which asserts "no field on this CD names a chosen backing
      store", is re-grounded (:1564-1569); (iv) CD.43 flips to the canonical ratified shape (state /
      ratified_as / filed_via, same dec-NNN in both id fields); (v) cost_projection.nat_contingency.applies_to
