      pending, and the graduated cd27-layer2-preconditions-cover-esb01 row pins the three declared precondition
      ids. The remaining half asserts that THIS plan's newest entry names ESB-06 and a rec id, which is
      transient entry content: once a later Decision becomes the newest, a graduated row reading "the newest
      entry" would assert the wrong entry forever.
  - step: 10
    phase: pre-deploy
    action: >-
      Per-entry authoring cap and corpus-ceiling governance, PRINTED rather than assumed. Confirm the new entry
      is at or under the 6,144-byte cap the hard-fail gate measures, confirm no corpus ceiling is breached after
      the regeneration, and print every headroom figure so this wave's own budget claim is on the record.
    command: >-
      bin/venv-python -c "import pathlib,re; from scripts.decisions_md import iter_decision_sections; from
      scripts.checks.decisions.validate_decisions_size import _PER_ENTRY_CAP_BYTES, _DECISIONS_LIVE_MAX_H2,
      _DECISIONS_COMBINED_MAX_BYTES; live=pathlib.Path('docs/DECISIONS.md').read_text(encoding='utf-8');
      arch=pathlib.Path('docs/DECISIONS_ARCHIVE.md'); secs={int(m.group(1)):b for m,b in
      iter_decision_sections(live)}; new=max(secs); assert new==173, f'expected the new entry to be Decision 173,
      newest header is {new} -- re-check the numbering race'; size=len(secs[new].encode('utf-8')); assert
      size<=_PER_ENTRY_CAP_BYTES, f'Decision {new} is {size} bytes, over the {_PER_ENTRY_CAP_BYTES}-byte
      per-entry authoring cap'; h=len(re.findall(r'(?m)^## Decision \d+:',live));
      comb=len(live.encode('utf-8'))+len(arch.read_bytes());
      idx=len(pathlib.Path('docs/decisions-index.json').read_bytes()); assert h<=_DECISIONS_LIVE_MAX_H2 and
      comb<=_DECISIONS_COMBINED_MAX_BYTES and idx<=131000, f'a corpus ceiling is breached: headers {h}, combined
      {comb}, index {idx}'; print('OK entry', new, 'is', size, 'bytes, cap headroom', _PER_ENTRY_CAP_BYTES-size,
      '; headers', h, 'headroom', _DECISIONS_LIVE_MAX_H2-h, '; combined headroom',
      _DECISIONS_COMBINED_MAX_BYTES-comb, '; index headroom', 131000-idx)"
    expected: >-
      Exit 0 with a line containing `cap headroom`, `headers`, `combined headroom` and `index headroom`, every
      figure non-negative. Proved in both directions this session: on f3e4e6d it exits 1 with an "expected the
      new entry to be Decision 173, newest header is 172 -- re-check the numbering race" assertion; on the
      scratch post-change tree it printed "OK entry 173 is 5183 bytes, cap headroom 961 ; headers 126 headroom 6
      ; combined headroom 37183 ; index headroom 10886".
    fix_if: >-
      `over the 6,144-byte per-entry authoring cap` means the entry drifted back toward the wave-4 shape --
      the repair is to MOVE content to docs/plans/reports/esb-q5-spike-findings.yaml and cite it, never to
      trim the ruling or the reversal conditions, and never to plan a compaction pass (the ceilings have
      headroom; the cap is a per-entry authoring norm, not a corpus-size symptom). `expected the new entry to be
      Decision 173` means a concurrent PR claimed the number -- shift to the next free number here and in every
      coupled site (ratified_as, filed_via, the findings record). `a corpus ceiling is breached` prints all
      three figures; read which one, and note that archival relieves only the header count while compaction is
      the only lever on combined bytes.
    hermetic: true
    graduation: waive
    graduation_waiver_reason: >-
      validate_decisions_size IS the standing enforced guard for the per-entry cap and both corpus ceilings, and
      it runs in the --pre and full tiers already. A graduated duplicate is non-admissible for the same measured
      reason as step 7: reverting removes the entry, the cap check passes on origin/main, and the row fails VF-05
      differential admission as tautological. The step is retained for its PRINTED headroom figures, which are
      the evidence for this plan's no-compaction-pass claim.
  - step: 11
    phase: pre-deploy
    action: >-
      Registry growth is budgeted, not assumed. Assert exactly the four planned esb-q5 rows landed, that check_id
      values stay unique, and that the registry is still at or under its measured structural budget -- printing
      the remaining headroom so the next wave inherits a number rather than a guess.
    command: >-
      bin/venv-python -c "import pathlib,yaml; from scripts.checks.structural._classify import effective_lines;
      p=pathlib.Path('config/agent/verification_registry/registry.yaml'); text=p.read_text(encoding='utf-8');
      rows=yaml.safe_load(text)['entries']; ids=[r['check_id'] for r in rows]; mine=sorted(i for i in ids if
      i.startswith('esb-q5-')); assert len(mine)==4, f'expected exactly 4 graduated esb-q5 rows, found
      {len(mine)}: {mine}'; assert len(ids)==len(set(ids)), 'duplicate check_id in the registry';
      budget=yaml.safe_load(pathlib.Path('config/structural_size_budgets.yaml').read_text(encoding='utf-8'))['budgets'][p.as_posix()];
      eff=effective_lines(text); assert eff<=budget, f'registry is {eff} effective lines, over its {budget}
      budget -- Decision 128 says decompose or retire rows, never raise'; print('OK', len(rows), 'registry
      rows,', len(mine), 'esb-q5 rows;', eff, 'effective lines of', budget, ', headroom', budget-eff)"
    expected: >-
      Exit 0 with a line beginning `OK` and ending with a non-negative `headroom` figure. Proved failing this
      session on f3e4e6d: exits 1 with an "expected exactly 4 graduated esb-q5 rows, found 0: []" assertion, and
      the same command's budget leg passes today at 5,836 effective lines of 6,000.
    fix_if: >-
      `expected exactly 4 graduated esb-q5 rows` means a plan-declared graduation was skipped or an extra one was
      added -- the four are fixed at plan time by graduation_check_id and the count is the registry budget's
      constraint, not a preference. `over its budget` means the four rows were authored too verbosely -- tighten
      the check_spec commands; do NOT raise the budget, which Decision 128 makes a reviewable exception requiring
      an authorizing Decision marker (Decision 165) that this wave has no grounds to write.
    hermetic: true
    graduation: waive
    graduation_waiver_reason: >-
      A registry row that asserts how many rows the registry has is self-referential -- it would have to be
      amended by every subsequent graduating plan, and it asserts a count fixed by THIS plan rather than a
      durable property. The durable half (schema validity, unique ids, differential admission of added rows) is
      already validate_verification_registry's job in the --pre tier, and the size half is
      validate_structural_size_limits'.
  - step: 12
    phase: pre-deploy
    action: >-
      Discharge this plan's declared handoff_policy. Run the FULL presubmit tier to completion IN THE FOREGROUND
      and block on its result before any commit or PR; the full tier exceeds a single Bash invocation, so do not
      background it and do not substitute --pre.
    command: bin/venv-python -m scripts.validate
    expected: "All checks passed, exit 0, including every HARD_GATE verifier."
    fix_if: >-
      Any failure means the declared full_validation_required_before_commit obligation is not discharged -- fix
      the named check and rerun the full tier from the start. A timeout is timeout_disposition blocked: resume
      later and rerun full from the start, never commit on a partial run.
    hermetic: false
    graduation: not-applicable
  - step: 13
    phase: post-deploy
    action: >-
      Provision through the Decision 126 infra channel only, in the two-root order the boundary requires. First
      the operator applies terraform/bootstrap out-of-band (admin-only, never CI); then the PR touching
      terraform/personal/** plans and applies, with the trust/destroy legs routed to tf-gated-apply. The agent
      runs no terraform apply in either root.
    command: >-
      bin/venv-python -c "print('confirm via mcp__github__pull_request_read get_check_runs that
      terraform-validate and the terraform-apply-sandbox speculative-plan job are green, that the operator has
      applied terraform/bootstrap out-of-band, and that the gated-apply run for the new IAM roles completed after
      human approval')" && aws stepfunctions list-state-machines --profile agent_platform --region eu-west-2
      --query "stateMachines[?contains(name, 'esb-q5')].name" --output text
    expected: >-
      The named CI checks are green, the bootstrap apply is confirmed, the gated-apply run shows a completed
      human approval, and the stepfunctions query lists both spike state machines.
    fix_if: >-
      An empty stepfunctions result with green checks means the flag is still false -- set esb_q5_spike_enabled
      true in the sandbox tfvars path and re-run the channel. An AccessDenied on the stepfunctions call means the
      boundary DataPlaneAllow extension or the DailyOps states: grant did not land -- check the BOOTSTRAP root
      first, because a boundary that does not permit states: silently denies an identity grant that is present
      and looks correct. A red terraform-validate is a real defect: fix the terraform on the branch, never work
      around it with a local apply, which Decision 126 forecloses outside the human-gated break-glass tier.
    hermetic: false
    graduation: not-applicable
  - step: 14
    phase: post-deploy
    action: >-
      Run each arm end-to-end, force-kill it mid-loop, and resume it. Assert the measurement actually
      DISCRIMINATES: the call ledger must show the completed-step count and any duplicate rows, per arm, and the
      hand-roll residue must be recorded with its constituent parts named rather than as a bare XS/S/M letter.
    command: >-
      bin/venv-python -m scripts.esb_q5_spike.measure --arm all --forced-kill mid-loop --emit
      docs/plans/reports/esb-q5-spike-findings.yaml && bin/venv-python -c "import yaml;
      f=yaml.safe_load(open('docs/plans/reports/esb-q5-spike-findings.yaml',encoding='utf-8')); m=f['measured'];
      missing=[a for a in f['arms'] if a not in m]; assert not missing, f'arm(s) never measured: {missing}';
      bad=[a for a,v in m.items() if v.get('duplicate_ledger_rows') is None or v.get('completed_steps') is None
      or not v.get('residue',{}).get('scale') or not v.get('residue',{}).get('parts')]; assert not bad, f'arm(s)
      with an incomplete metric record: {bad}'; print('OK', len(m), 'arms measured;',
      {a:v['duplicate_ledger_rows'] for a,v in m.items()}, ';residue', {a:v['residue']['scale'] for a,v in
      m.items()})"
    expected: >-
      Exit 0 with a line beginning `OK` reporting per-arm duplicate-row counts and per-arm residue scales. A
      duplicate-row count that differs between the arms, or a residue scale that differs, is the discriminating
      outcome the spike exists to produce.
    fix_if: >-
      Identical numbers on both arms mean either the forced kill did not land mid-loop (it fired before the first
      checkpoint or after the last -- move the kill point into the middle of the iteration range and re-run) or
      the arms genuinely do not discriminate. The second case is NOT a harness bug to retry around: it is re-arm
      condition (ii) firing, and the correct response is to record the non-discrimination in findings.yaml,
      decline the substrate selection, and hand back per the GATE 2 constraint. An arm that never resumes is
      likewise a recordable finding carried into the comparative record.
    hermetic: false
    graduation: not-applicable
  - step: 15
    phase: post-deploy
    action: >-
      Measure workspace re-materialization for every registered strategy on every arm that ran, at the W6 scale
      basis, recording wall-clock, request/object count and bytes for each pair -- and record the W6 basis itself
      with the measurement command and the date it was run.
    command: >-
      bin/venv-python -m scripts.esb_q5_spike.measure --rematerialization-only --emit
      docs/plans/reports/esb-q5-spike-findings.yaml && bin/venv-python -c "import yaml;
      f=yaml.safe_load(open('docs/plans/reports/esb-q5-spike-findings.yaml',encoding='utf-8'));
      r=f['rematerialization']; pairs=[(a,s) for a in f['arms'] for s in f['strategies']]; missing=[p for p in
      pairs if p[1] not in r.get(p[0],{})]; assert not missing, f'unmeasured arm/strategy pairs: {missing}';
      thin=[(a,s) for a,s in pairs if not all(k in r[a][s] for k in ('wall_clock_s','object_count','bytes'))];
      assert not thin, f'pair(s) missing a W5 term: {thin}'; w6=f['scale_basis']; assert w6.get('command') and
      w6.get('measured_on') and w6.get('bytes'), f'W6 scale basis incomplete: {w6}'; print('OK', len(pairs),
      'arm x strategy pairs all measured with all three W5 terms; W6 basis', w6['bytes'], 'bytes measured',
      w6['measured_on'])"
    expected: >-
      Exit 0 with a line beginning `OK` reporting the pair count and the W6 basis bytes and date, with each pair
      carrying wall_clock_s, object_count and bytes.
    fix_if: >-
      An unmeasured pair means an arm/strategy combination was skipped -- run it rather than dropping the pair.
      `missing a W5 term` means one of the byte or object-count terms was omitted, and CD.43 W5 requires both
      because per-request pricing can dominate for a many-small-files tree even when the byte term looks small.
      `W6 scale basis incomplete` means the dependency-environment size was quoted rather than measured -- run
      the sizing command, record it verbatim with the date, and never copy a stale figure.
    hermetic: false
    graduation: not-applicable
  - step: 16
    phase: post-deploy
    action: >-
      Teardown. Flip the flag false through the same infra channel, let the destroy route to tf-gated-apply, and
      sweep for residual spike resources by name prefix so no cost floor survives the spike.
    command: >-
      aws stepfunctions list-state-machines --profile agent_platform --region eu-west-2 --query
      "stateMachines[?contains(name,'esb-q5')].name" --output text && aws lambda list-functions --profile
      agent_platform --region eu-west-2 --query "Functions[?contains(FunctionName,'esb-q5')].FunctionName"
      --output text
    expected: "Both queries return empty -- no state machine and no Lambda carrying the esb-q5 prefix."
    fix_if: >-
      A non-empty result means the destroy did not fully land -- re-check that the flag reads false on main and
      that the gated-apply destroy run completed rather than being left awaiting approval. Do not delete the
      residue with a console or CLI delete: that puts state out of band with terraform and the next apply
      resurrects or errors on it.
    hermetic: false
    graduation: not-applicable
