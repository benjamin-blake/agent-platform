  - file: config/agent/verification_registry/registry.yaml
    action: Modify
    purpose: >-
      FOUR graduated rows, and the count is set by MEASUREMENT, not preference: the registry is 5,836 effective
      lines against its 6,000 structural budget (config class), so 164 lines of headroom exist and a
      command_exit_zero row of the shape this repo already uses costs roughly 25-37 lines. Four rows fit with
