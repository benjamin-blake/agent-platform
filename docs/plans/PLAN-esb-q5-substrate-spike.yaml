  - file: tests/esb_text_fix/test_workspace_store_criteria.py
    action: Modify
    purpose: >-
      THE SECOND MISSED SITE, found by this session's class-versus-site sweep and present in neither prior
      draft: this suite reads the LIVE roadmap and pins the deferral --
      test_cd43_is_pending_and_r2_shaped asserts state=="pending" / ratified_as is None /
