      Decision 82 clause -- the contract is both the correct home and the cheaper one. Additive: the existing
      checks read their own keys by name, so a third class does not disturb them.
  - file: docs/plans/reports/esb-q5-spike-findings.yaml
    action: Create
    purpose: >-
      THE CITED EVIDENCE RECORD, and the load-bearing half of this wave's re-shaped deliverable. Machine-parseable:
