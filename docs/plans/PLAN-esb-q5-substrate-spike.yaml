rollback: >-
  Every spike resource is count-gated behind one default-false flag, so infrastructure rollback is flipping the
  flag false and letting the destroy route through tf-gated-apply -- the same path teardown uses, with no bespoke
  teardown to write -- a flag flip, NEVER a deletion of the spike terraform family, which the graduated step-2
  row asserts exists. The IAM classification-map edits and the grant edits are safe to leave in place across
  teardown (they classify and permit a resource type that no longer exists, which the discovery-driven gate
  simply stops asserting), so nothing here is time-critical -- but reverting the BOOTSTRAP-TIER privilege
  widening is NOT optional. The operator has directed that revert and it is tracked as rec-3192, which lands
  AFTER the spike is destroyed and OWNS that work; this plan deliberately does not widen its scope to include
  it. If any revert is performed, the map edits and the terraform must move together or the coverage gate goes
  red. Rollback of the governance edits is a revert of the
  DECISIONS.md and roadmap hunks plus an index regeneration and a revert of the re-grounded pytest -- those three
  are coupled and must revert together, since the tests read the live roadmap. The ops portal Decision write, the
  backfill and the ESB-06 rec filing are the non-revertible steps, which is why they are sequenced last, behind
  the human confirmation gate, and after Gate 2 is known. If Gate 2 stops the plan, the Decision still lands as
  the comparative record plus the fired re-arm condition, and only the CD.43 flip and its coupled sites are
  withheld.
