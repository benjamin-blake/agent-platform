bundled_recommendations: []
closes_criteria: []
infrastructure_dependencies:
  - >-
    terraform/personal (the sandbox environment on Axis A) is the ONLY auto-applying root -- measured:
    terraform-apply-sandbox.yml's paths filter and WORKDIR are terraform/personal/** exclusively, and the legacy
    terraform/ root has no apply pipeline. That is why the spike stack must live in terraform/personal and why
    the Step Functions IAM-coverage work below is unavoidable rather than a design choice. Deployment follows
    Decision 126's infra intent: a PR touching terraform/** is the sole trigger; CI plans and applies. This
    plan's agent NEVER runs terraform apply. The speculative-plan pipeline (CD.35 Wave 2 / T2.21) applies -- a
    PR-time plan is reviewed and saved, then re-applied at merge with no re-plan (Decision 77 no-TOCTOU).
    docs/contracts/environment-taxonomy.yaml is the sole SoT for guard classification, saved-plan persistence and
    the convergence-record shape; this plan names the required checks and does not restate the mechanics.
  - >-
    TWO ROOTS, TWO GATES, IN ORDER. terraform/bootstrap is Axis A `bootstrap`: "admin-only
    (agent_platform_admin), NEVER auto-apply, out-of-band from CD pipeline". Three bootstrap edits live there --
    the boundary DataPlaneAllow `states:` extension, github_ci_apply's `states:` WRITE grants
    (github_ci_apply_policy.tf), and its `states:` REFRESH-READ Sid (github_ci_apply_reads.tf, per Decision 156)
    -- and all three must be applied out-of-band by the operator BEFORE the personal-root apply. The boundary
    edit is a precondition twice over: it is the ceiling for github_ci_apply AND for the spike's own
    boundary-carrying agent-platform-esb-q5-* roles, so without it every `states:` grant on either side is
    silently denied by the identity/boundary intersection. Disclosed cost, surfaced at plan time: ONE operator
    bootstrap apply plus two tf-gated-apply approvals (stack up, stack down). It is NOT three operator applies
    -- see the AUTHORITY-BUDGET REACHABILITY context entry for the PlatformDev design that would have cost that
    and why it was rejected.
  - >-
    THREE new IAM roles -- one shared arm-Lambda execution role, one driver-Lambda execution role, and one Step
    Functions execution role -- carry trust policies, and the teardown is a destroy. (Round 2 planned five; the
    EventBridge target role was removed in favour of an aws_lambda_permission and the two arms share one
    execution role, which cut two roles out of the literal-enumeration surface.) Each of the three must be
    enumerated as a LITERAL ARN in BOTH plan-capable read policies in this same PR, and the Step Functions role
    additionally needs an iam:PassRole conditioned on states.amazonaws.com. Trust and
    destroy route to the human-gated tf-gated-apply Environment rather than auto-applying. Every one of these
    roles is named agent-platform-esb-q5-* and boundary-carrying, so their INLINE POLICIES are in budget --
    github_ci_apply's IAMRoleWriteBounded Sid grants iam:PutRolePolicy on role/agent-platform-* conditioned on
    the mandatory boundary, and authority_budget.json v2 puts create+update of aws_iam_role_policy /
    aws_iam_role_policy_attachment on that prefix in budget. No policy is written to any role outside that
    prefix, which is what keeps the whole personal-root diff inside the normal gated pipeline. Guard
    classification of each diff is the taxonomy contract's call, not this plan's.
  - >-
    Local terraform is NOT installed in this container and terraform/personal's third-party kislerdm/neon
    provider cannot init from a stock CC-web session (Decision 119, terraform/CLAUDE.md). All local terraform
    verification is grep-only; the AUTHORITATIVE verifiers are CI's `terraform-validate` check and the
    speculative-plan job in the terraform-apply-sandbox workflow, with the gated legs in the
    tf-gated-apply-prototype workflow. No local terraform init/validate/plan appears in any VP step.
  - >-
    The account has NO VPC-based infrastructure and this plan adds none. Re-measured at f3e4e6d: a sweep of all
    38 terraform/**/*.tf files for aws_vpc, aws_subnet, aws_nat_gateway, aws_vpc_endpoint, aws_ecs_* and aws_efs_*
    resources returns ZERO matches, and zero Lambda vpc_config blocks. That measured zero is the factual basis of
    the exclusion's standing-cost reason AND the invariant VP step 2 defends repo-wide.
  - >-
    Region is pinned eu-west-2 (terraform/personal/variables.tf aws_region default). CD.43 criterion W3 requires
    costs be RECOMPUTED at decision time against that pin, not carried from the audit. The corpus already holds a
    recomputed eu-west-2 NAT figure at docs/ROADMAP-PLATFORM.yaml:342-347 (nat_contingency,
    standing_usd_per_month "33-35", confidence medium, rate_basis stated) -- re-verify it at implement time
    rather than re-deriving it, and see the W4 EGRESS-CLAIM context entry for the term it is and is not allowed
    to be.
acceptance_criteria:
  - >-
    docs/plans/reports/esb-q5-spike-findings.yaml partitions the audit's full Q5 arm set into `arms` and
    `excluded_arms` with no member missing from both and none in both, and every excluded arm carries all three
    recorded reasons (standing cost, operability, re-arm conditions) as non-empty entries.
  - >-
    A repo-wide sweep of terraform/**/*.tf finds ZERO aws_vpc, aws_subnet, aws_nat_gateway, VPC endpoint,
    aws_ecs_* and aws_efs_* resources and zero Lambda vpc_config blocks, while the
    terraform/personal/esb_q5_spike*.tf FAMILY exists, declares at least one aws_sfn_state_machine, count-gates
    every spike resource on var.esb_q5_spike_enabled, and that variable is declared with default false. The
    exclusion is enforced by absence, class-wide, and swept over the family rather than one filename.
  - >-
    Every strategy registered in scripts/esb_q5_spike/workspace.py STRATEGIES has a measured re-materialization
    record in findings.yaml for every arm that ran -- including BOTH s3_per_object and s3_tarball, each carrying
    a wall-clock term, a request/object-count term and a byte term (CD.43 W5). A registered-but-unmeasured
    strategy, or a measured-but-unregistered one, fails the check.
  - >-
    No module under scripts/esb_q5_spike/ imports a production write surface (scripts.ops_data_portal,
    scripts.ops_writer, scripts.s3_log_store, src.common.ducklake_writes, ducklake_writer) and no live LLM client
    surface is referenced outside scripts/esb_q5_spike/mock_llm.py.
  - >-
    aws_sfn_state_machine is classified in the read map, the write-coverage map, and all three
    LIFECYCLE_COMPANIONS phases, and validate_ci_refresh_read_coverage passes clean over terraform/personal with
    the spike stack present -- i.e. the state machines are refresh-read-covered in BOTH plan-capable role
    policies and write-covered by github_ci_apply.
  - >-
    The grants sit in their Decision 156 homes and are asserted both ways: the `states:` refresh-read Sid is in
    terraform/bootstrap/github_ci_apply_reads.tf, the `states:` write verbs are in
    terraform/bootstrap/github_ci_apply_policy.tf, and NO `states:` read verb appears in that inline
    write-authority document. The boundary DataPlaneAllow carries `states:` as the ceiling for both
    github_ci_apply and the spike's own boundary-carrying roles.
  - >-
    Every IAM role the spike creates is named agent-platform-esb-q5-* and carries
    permissions_boundary = agent-platform-github-ci-apply-boundary, and no spike resource writes a policy onto
    PlatformDev -- so every personal-root IAM diff stays inside github_ci_apply's IAMRoleWriteBounded budget and
    the plan needs NO out-of-band admin apply in terraform/personal.
  - >-
    EVERY spike IAM role, derived from the terraform rather than from a hand-written list, is enumerated as a
    LITERAL ARN in BOTH plan-capable read policies -- IAMRolesRead in terraform/bootstrap/github_ci_apply_reads.tf
    and IAMPlatformRolesRead in terraform/personal/oidc.tf. Adding the agent-platform-* prefix instead does not
    satisfy this and is measured not to (Decision 35 / Decision 98 clause 2, literal-only for iam: role reads).
  - >-
    github_ci_apply carries an iam:PassRole grant conditioned iam:PassedToService = states.amazonaws.com, and
    states:TagResource and states:UntagResource are granted together. No EventBridge target carries a role_arn,
    so no events.amazonaws.com PassRole is required and no fourth role enters the enumeration set.
  - >-
    Every file in the terraform/personal/esb_q5_spike*.tf family is under the 500-effective-line terraform-class
    budget with the measured sizes PRINTED, and no structural budget anywhere is raised.
  - >-
    The Decision 125 coupling exception is recorded as a TYPED conformance.spike_class field in
    docs/contracts/environment-taxonomy.yaml -- the contract clause 2 makes the sole SoT -- and asserted both
    ways: no spike Lambda carries ignore_changes=[source_code_hash], and the terraform points at that typed
    record rather than carrying the exception only as a comment. This matters because
    validate_deploy_channel_conformance globs only ducklake*.tf and prod_lambdas.tf and cannot see the spike
    family at all.
  - >-
    findings.yaml carries a measurement_subject block barring persona-loop wall-clock, per-iteration duration
    and timeout-headroom claims (the LLM steps are mocked), naming workspace re-materialization as the ONE
    wall-clock term the spike is entitled to, AND naming the condition under which the timeout-headroom term
    must be re-measured against a live-call profile; the same three appear in the numbered Decision's reversal
    conditions.
  - >-
    The deterministic V-tier floor computed over this plan's own scope is V3 AND is forced by the .tf rows alone
    -- recomputing the floor with the .tf rows removed yields a tier below V3, proving no scope file matches
    active-manifest Lambda code -- and no new src/lambdas/*/manifest.yaml exists.
  - >-
    Each of the two arms was forced-killed mid-loop and resumed, and findings.yaml records per arm: the
    duplicate-ledger-row count (resume-without-reissue), the hand-roll residue on the audit's XS/S/M scale with
    the residue's constituent parts NAMED, and per-strategy re-materialization cost.
  - >-
    docs/DECISIONS.md gains exactly one new `## Decision NNN:` entry, that entry is at or under the 6,144-byte
    per-entry authoring cap, and the printed headroom figures for the per-entry cap, the 132-header ceiling, the
    780,000-byte combined ceiling and the 131,000-byte index pin are all non-negative. No compaction pass is
    performed and Decision 37 is untouched.
  - >-
    The comparative record over CD.27's five pinned candidates, the per-arm measurements, and the per-option
    W1-W8 disposition of CD.43's seven-member option_set live in findings.yaml, and the numbered Decision CITES
    that file rather than restating it -- while the Decision itself carries the ruling, the exclusion, the
    reversal conditions and the ESB-06 residual.
  - >-
    CD.43 is fully flipped and every coupled site moves with it: selected_store no longer reads
    TBD_at_CD.43_ratification, status no longer reads criteria_only, state/ratified_as/filed_via carry the
    canonical ratified shape with the same dec-NNN in both id fields, the "Criteria-only discipline" point no
    longer asserts that no field names a chosen store, nat_contingency.applies_to names the exclusion, the
    live-roadmap pytest suite is re-grounded, and the literal TBD_at_CD.43_ratification survives at EXACTLY ONE
    site in docs/ROADMAP-PLATFORM.yaml -- CD.27's ESB-01 precondition, where it correctly describes the act.
  - >-
    CD.27 reads state pending and the new Decision names ESB-06's determinism-rules-plus-static-check obligation
    as the sole remaining layer-2 blocker, with a follow-on rec id recorded. The two are checked as one
    conditional assertion in both directions: if CD.27 were flipped to ratified it would instead have to carry a
    non-empty precondition_discharge entry for each of ESB-01, ESB-04 and ESB-06.
  - >-
    config/agent/verification_registry/registry.yaml carries exactly four new esb-q5-* rows and remains at or
    under its 6,000-effective-line structural budget, with the measured headroom printed.
  - >-
    After teardown the spike flag reads default-false on origin/main and the gated destroy run completed; the
    residual AWS resource sweep is SURFACED for an operator identity holding states:List*/lambda:List* and
    reported empty, because PlatformDev holds neither and this plan refuses to widen it.
verification_plan:
  - step: 1
    phase: pre-deploy
    action: >-
      findings.yaml is the spike's evidence record and this step is its reader. The exclusion is recorded as a
      CLASS over the audit's whole Q5 arm set, not as two names someone remembered: require the partition into
      arms[] and excluded_arms{}, assert both directions (nothing in both, nothing in neither), and require
      every excluded arm to carry all three recorded reasons. Require the measurement_subject block -- the
      mocked-LLM disclaimer, the one wall-clock term the spike IS entitled to, and the condition that reopens
      the timeout-headroom bar. And require the GOVERNANCE-COST result: this run measured, without setting out
      to, that standing up either substrate here is dominated by IAM governance cost rather than by
      resume-machinery code. That is real data about BOTH arms, already paid for, and it is recorded as a
      result rather than a footnote -- including the condition under which it makes the adoption decision
      insensitive to what the spike measures.
    command: >-
      bin/venv-python -c "import pathlib,yaml; p=pathlib.Path('docs/plans/reports/esb-q5-spike-findings.yaml'); assert
      p.exists(), 'findings.yaml absent'; f=yaml.safe_load(p.read_text(encoding='utf-8'));
      full=set(f['audit_q5_arm_set']); arms=set(f['arms']); exc=f['excluded_arms']; both=sorted(arms & set(exc));
      assert not both, f'arm declared as both built and excluded: {both}'; missing=sorted(full - arms - set(exc));
      assert not missing, f'audit arm(s) neither built nor excluded: {missing}'; extra=sorted((arms | set(exc)) -
      full); assert not extra, f'arm(s) outside the audit Q5 set: {extra}';
      need=('standing_cost','operability','re_arm_conditions'); bad=sorted((a,k) for a,v in exc.items() for k in need
      if not str(v.get(k,'')).strip()); assert not bad, f'excluded arm(s) missing a recorded reason: {bad}';
      ms=f.get('measurement_subject') or {}; assert str(ms.get('mocked_llm_disclaimer','')).strip(), 'findings.yaml
      records no measurement_subject.mocked_llm_disclaimer -- the LLM steps are mocked, so a wall-clock or
      timeout-headroom claim would have an unrepresentative subject (Decision 82)'; assert
      str(ms.get('entitled_wall_clock_term','')).strip(), 'findings.yaml does not name the ONE wall-clock term the
      spike is entitled to (workspace re-materialization), so the disclaimer would read as barring the W5 term it must
      not bar'; gc=f.get('governance_cost') or {}; need=('fixed_cost_observed','insensitivity_condition');
      gaps=sorted(k for k in need if not str(gc.get(k,'')).strip()); assert not gaps, f'findings.yaml records no
      governance_cost {gaps} -- this run measured that standing up EITHER substrate is dominated by IAM governance
      cost rather than resume-machinery code, which is a RESULT about both arms and belongs in the record'; assert
      str(ms.get('reopen_condition','')).strip(), 'findings.yaml names no reopen_condition for the timeout-headroom
      bar -- the disclaimer gates the axis on which the arms most plausibly differ, so the condition that reopens it
      must be recorded'; print('OK partition covers', len(full), 'audit arms;', len(arms), 'built,', len(exc),
      'excluded, all with 3 recorded reasons; measurement subject and reopen condition disclosed; governance cost
      recorded; both directions clean')"
    expected: >-
      Exit 0 with a line beginning `OK partition covers`, containing `measurement subject and reopen condition
      disclosed` and `governance cost recorded`, ending `both directions clean`. Proved in both directions: on
      f3e4e6d it exits 1 with a "findings.yaml absent" assertion, and against a findings file missing the
      governance_cost block, or missing measurement_subject.reopen_condition, it exits 1 naming that specific
      omission; on the scratch post-change tree it prints the OK line.
    fix_if: >-
      `audit arm(s) neither built nor excluded` names an arm dropped without a record -- write it into
      excluded_arms with its three reasons, or build it. Do NOT satisfy this by shrinking audit_q5_arm_set: that
      set is the audit's, and editing it to match what was built is exactly the unwritten-premise defect ESB-04
      exists to remove. `excluded arm(s) missing a recorded reason` names the arm and the field. `records no
      measurement_subject.mocked_llm_disclaimer` means the Decision 82 discipline was skipped -- write the
      disclaimer barring persona-loop wall-clock, per-iteration duration and timeout-headroom claims, and write
      entitled_wall_clock_term naming workspace re-materialization, whose subject (bytes and objects moved) is
      real and unmocked. Do NOT discharge that by deleting the W5 wall-clock term: the disclaimer is scoped to
      the LOOP. `names no reopen_condition` means the bar was recorded without the condition that lifts it.
      `records no governance_cost` means the run's own most transferable measurement was dropped -- write
      fixed_cost_observed and insensitivity_condition. Do NOT resolve it by softening the finding: if the
      plumbing differential is small against the fixed governance cost, saying so IS the result.
    hermetic: true
    graduation: graduate
    graduation_check_id: "esb-q5-exclusion-partitions-audit-arm-set"
  - step: 2
    phase: pre-deploy
    action: >-
      The exclusion is enforced STRUCTURALLY over every terraform file in the repo, swept as a FAMILY
      (terraform/personal/esb_q5_spike*.tf) because the stack is pre-decomposed by resource family. Assert: zero
      networked resources and zero vpc_config anywhere under terraform/; the family exists and declares a state
      machine; the flag is declared default-false and gates every spike resource; every spike IAM role is
      boundary-carrying; every spike name is inside the agent-platform-esb-q5-* prefix; nothing is written to
      PlatformDev; no EventBridge target carries a role_arn; and every family file is under the
      500-effective-line terraform-class budget with the measured sizes PRINTED. This step is ALSO the reader
      for the typed conformance.spike_class record -- it derives the actual coupling state from the terraform it
      has already parsed and asserts the contract agrees, failing closed on DISAGREEMENT and equally on ABSENCE.
      That reuse is deliberate: giving the field a reader inside an existing enforced step is what keeps it from
      being a declared-but-unread surface, and a reader that passed on absence would be the same fail-open shape
      deleted from step 7 this round. Comments are stripped before every structural scan -- proved necessary,
      since the exception pointer names the very construct the ignore_changes assertion forbids.
    command: >-
      bin/venv-python -c "import pathlib,re,yaml; files=sorted(pathlib.Path('terraform').rglob('*.tf')); assert files,
      'no terraform files found'; strip=lambda s: chr(10).join(l for l in s.splitlines() if not
      l.lstrip().startswith('#'));
      fam=r'aws_vpc|aws_subnet|aws_nat_gateway|aws_vpc_endpoint|aws_ecs_[a-z_]+|aws_efs_[a-z_]+';
      hits={str(p):sorted(set(re.findall(r'resource\s+\"('+fam+r')\"', strip(p.read_text(encoding='utf-8'))))) for p
      in files}; hits={k:v for k,v in hits.items() if v}; assert not hits, f'networked/excluded-family resource(s)
      present: {hits}'; vpc=[str(p) for p in files if re.search(r'\n\s*vpc_config\s*\{',
      strip(p.read_text(encoding='utf-8')))]; assert not vpc, f'Lambda vpc_config block(s) present: {vpc}';
      spike=sorted(pathlib.Path('terraform/personal').glob('esb_q5_spike*.tf')); assert spike, 'no
      terraform/personal/esb_q5_spike*.tf -- the sweep would pass vacuously';
      body=chr(10).join(p.read_text(encoding='utf-8') for p in spike); code=strip(body); assert
      re.search(r'resource\s+\"aws_sfn_state_machine\"', code), 'the spike family declares no Step Functions state
      machine -- there is no arm to drive'; blocks=re.findall(r'resource\s+\"([a-z0-9_]+)\"\s+\"([a-z0-9_]+)\"\s*\{',
      code); ungated=[n for _,n in blocks if not
      re.search(r'\"'+n+r'\"\s*\{[^}]*?count\s*=\s*var\.esb_q5_spike_enabled', code, re.S)]; assert not ungated,
      f'spike resource(s) not count-gated on var.esb_q5_spike_enabled: {ungated}'; roles=[n for ty,n in blocks if
      ty=='aws_iam_role']; assert roles, 'the spike family declares no IAM role -- the boundary sweep would pass
      vacuously'; unbounded=[n for n in roles if not
      re.search(r'\"'+n+r'\"\s*\{[^}]*?permissions_boundary\s*=\s*[^\n]*agent-platform-github-ci-apply-boundary',
      code, re.S)]; assert not unbounded, f'spike role(s) missing the mandatory permissions_boundary (Decision 144
      cl.3): {unbounded}'; names=re.findall(r'name\s*=\s*\"([^\"]+)\"',
      code)+re.findall(r'function_name\s*=\s*\"([^\"]+)\"', code); offprefix=sorted({m for m in names if not
      m.startswith('agent-platform-esb-q5-')}); assert not offprefix, f'spike names a resource outside the
      agent-platform-esb-q5-* prefix, so it falls outside the IAMRoleWriteBounded budget: {offprefix}'; assert
      'PlatformDev' not in code and 'platform_dev' not in code, 'the spike writes to PlatformDev, which is outside
      github_ci_apply IAMRoleWriteBounded role/agent-platform-* budget -- approve-then-AccessDeny'; actual='DECOUPLED'
      if re.search(r'ignore_changes\s*=\s*\[[^\]]*source_code_hash', code) else 'COUPLED';
      tax=pathlib.Path('docs/contracts/environment-taxonomy.yaml'); assert tax.exists(),
      'docs/contracts/environment-taxonomy.yaml is missing -- the conformance class has no sole SoT to read';
      conf=(yaml.safe_load(tax.read_text(encoding='utf-8')) or {}).get('conformance') or {};
      declared=conf.get('spike_class'); assert declared, 'conformance.spike_class is ABSENT from
      docs/contracts/environment-taxonomy.yaml -- fail-closed on absence, because a reader that passes when the field
      is missing is the same fail-open shape this round deleted from step 7'; assert declared==actual,
      f'conformance.spike_class declares {declared!r} but the spike terraform is actually {actual!r} -- the contract
      and the code disagree'; assert actual=='COUPLED', 'a spike Lambda carries ignore_changes=[source_code_hash] --
      this stack is deliberately COUPLED (Decision 125 scoped exception)'; assert
      re.search(r'environment-taxonomy\.yaml', body), 'the spike terraform does not point at the typed
      conformance.spike_class record';
      targets=re.findall(r'resource\s+\"aws_cloudwatch_event_target\"[^{]*\{(.*?)\n\}', code, re.S); withrole=[t for t
      in targets if 'role_arn' in t]; assert not withrole, 'an EventBridge target carries role_arn, which would need
      an events.amazonaws.com iam:PassRole grant and another enumerated role -- use aws_lambda_permission instead
      (precedent: terraform/scheduled_agents.tf)'; from scripts.checks.structural._classify import effective_lines;
      sizes={p.name: effective_lines(p.read_text(encoding='utf-8')) for p in spike}; over={k:v for k,v in
      sizes.items() if v>500}; assert not over, f'spike terraform file(s) over the 500-effective-line terraform-class
      budget -- Decision 128 says decompose by resource family, never raise: {over}';
      v=pathlib.Path('terraform/personal/variables.tf').read_text(encoding='utf-8'); assert
      re.search(r'variable\s+\"esb_q5_spike_enabled\"[^}]*default\s*=\s*false', v, re.S), 'esb_q5_spike_enabled is not
      declared with default false in terraform/personal/variables.tf'; print('OK', len(files), 'terraform files swept;
      0 networked resources; 0 vpc_config;', len(blocks), 'spike resources all count-gated;', len(roles), 'roles all
      boundary-carrying; 0 PlatformDev writes; 0 role-carrying event targets; conformance.spike_class', declared,
      'agrees with the code; sizes', sizes, 'all under 500; flag default false')"
    expected: >-
      Exit 0 with a line beginning `OK` and ending `flag default false`, reporting the terraform-file count, the
      count-gated spike-resource count, the boundary-carrying role count, the agreed `conformance.spike_class`
      value and the per-file `sizes` map. Proved in both directions: on f3e4e6d it exits 1 with a "no
      terraform/personal/esb_q5_spike*.tf" assertion; against a synthetic split stack it printed the OK line
      with 3 roles. Each clause was proved negatively in isolation -- stripping permissions_boundary, adding a
      PlatformDev reference, adding ignore_changes, adding an event target WITH role_arn, deleting the taxonomy
      pointer, DELETING conformance.spike_class, and setting it to DECOUPLED against COUPLED code each produce
      their own named assertion.
    fix_if: >-
      A named file and family means a networked resource was introduced -- delete it. The container and
      shared-filesystem arms are EXCLUDED by operator decision; re-introducing one is a reversal, and a reversal
      goes through the recorded re-arm conditions, not a terraform edit. `spike role(s) missing the mandatory
      permissions_boundary` means the role would guard-route to the gated Environment and then AccessDeny (the
      DEP-02 shape) -- add the boundary, which is also what puts the role's inline policies inside the apply
      role's budget. `outside the agent-platform-esb-q5-* prefix` or `writes to PlatformDev` means the diff has
      left the IAMRoleWriteBounded budget -- rename into the prefix; do NOT ask for an out-of-band admin apply.
      `an EventBridge target carries role_arn` means another role and an events.amazonaws.com PassRole grant
      have been silently introduced -- use aws_lambda_permission instead. `conformance.spike_class is ABSENT`
      means the typed record was never written -- write it in docs/contracts/environment-taxonomy.yaml, which
      clause 2 makes the sole SoT; do NOT relax this reader to tolerate absence. `declares X but the spike
      terraform is actually Y` means contract and code have diverged -- fix whichever is wrong, and note that
      the terraform is the fact and the contract is the record. `over the 500-effective-line terraform-class
      budget` means the family needs a further split by resource family -- Decision 128 makes that the default
      and a raise the Decision-cited exception this wave has no grounds to write.
    hermetic: true
    graduation: graduate
    graduation_check_id: "esb-q5-no-networked-terraform-resources"
  - step: 3
    phase: pre-deploy
    action: >-
      Both S3 sync strategies are measured, expressed as a class assertion over the strategy registry rather than
      as two named-strategy assertions. Every entry in workspace.STRATEGIES must be exercised by the measurement
      harness and vice versa, and the registry must contain both mandated S3 shapes.
    command: >-
      bin/venv-python -c "from scripts.esb_q5_spike import workspace, measure; reg=set(workspace.STRATEGIES);
      assert {'s3_per_object','s3_tarball'} <= reg, f'registry is missing a mandated S3 strategy: {sorted(reg)}';
      covered=set(measure.measured_strategies()); missing=sorted(reg-covered); assert not missing, f'registered
      but never measured: {missing}'; extra=sorted(covered-reg); assert not extra, f'harness measures a strategy
      that is not registered: {extra}'; print('OK', len(reg), 'registered strategies,', len(covered), 'measured;
      both directions clean')"
    expected: >-
      Exit 0 with a line beginning `OK` and the registered and measured counts equal, ending `both directions
      clean`. Failing direction proved this session by construction: scripts.esb_q5_spike does not exist at
      f3e4e6d, so the import raises ModuleNotFoundError and the command exits non-zero.
    fix_if: >-
      `registered but never measured` means the harness enumerates a stale hard-coded list -- change
      measure.measured_strategies() to derive from workspace.STRATEGIES rather than adding the missing name by
      hand, or the same defect recurs on the next strategy. `registry is missing a mandated S3 strategy` means
      one of the two shapes was never implemented -- implement it in workspace.py; dropping it is not available,
      because CD.43 criterion W5 demands both a byte term and an object-count term and the re-materialization
      metric is meaningless with one shape.
    hermetic: true
    graduation: waive
    graduation_waiver_reason: >-
      Non-admissible under VF-05 differential admission rather than merely inconvenient: the row's own subject
      (scripts/esb_q5_spike/) is created by this plan, so a graduated row here duplicates the coverage step 4's
      graduated row already gives the same module set, and the registry has a measured 164 effective lines of
      headroom that four rows consume with margin and five do not. The property is additionally guarded by
      tests/esb_q5_spike/test_arms.py::test_measured_strategies_derives_from_the_registry, which IS run by the
      graduated step-6 row.
  - step: 4
    phase: pre-deploy
    action: >-
      Mocked LLM and no production writes, swept over every spike module rather than the one that looked risky.
      Assert no module under scripts/esb_q5_spike/ names a production write surface, and that no module other
      than mock_llm.py names a live LLM client surface.
    command: >-
      bin/venv-python -c "import pathlib; mods=sorted(pathlib.Path('scripts/esb_q5_spike').rglob('*.py')); assert
      mods, 'no spike modules found';
      banned=('scripts.ops_data_portal','scripts.ops_writer','scripts.s3_log_store','src.common.ducklake_writes','ducklake_writer');
      hits={str(p):[b for b in banned if b in p.read_text(encoding='utf-8')] for p in mods};
      hits={k:v for k,v in hits.items() if v}; assert not hits, f'spike module names a production write surface:
      {hits}'; live=('litellm','anthropic','openai','scripts.llm'); llm={str(p):[t for t in live if t in
      p.read_text(encoding='utf-8')] for p in mods if p.name!='mock_llm.py'};
      llm={k:v for k,v in llm.items() if v}; assert not llm, f'live LLM surface outside the mock: {llm}';
      print('OK', len(mods), 'spike modules; 0 production write surfaces; 0 live LLM paths outside
      mock_llm.py')"
    expected: >-
      Exit 0 with a line beginning `OK` and ending `0 live LLM paths outside mock_llm.py`. Proved failing this
      session on f3e4e6d: exits 1 with a "no spike modules found" assertion.
    fix_if: >-
      A named module and surface means the spike would write to a production table or call a real provider --
      remove that name from the named module and route the behaviour through mock_llm.py or the spike's own S3
      prefix. Do not add the module to an exemption list; no-production-writes is the whole basis on which this
      spike is safe to run.
