      survives -- option_set/coverage_cases completeness, the rejected-option record, and W1-W8 well-formedness.
      test_t41_names_the_criteria_and_leaves_the_choice_open (:103-116) and
      test_decision_scope_notes.py::test_cd27_stays_pending_with_expected_filed_via SURVIVE unchanged and are
