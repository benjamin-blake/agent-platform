bundled_recommendations: []
closes_criteria: []
infrastructure_dependencies:
  - >-
    terraform/personal (the sandbox environment on Axis A) is the ONLY auto-applying root -- measured:
    terraform-apply-sandbox.yml's paths filter and WORKDIR are terraform/personal/** exclusively, and the legacy
    terraform/ root has no apply pipeline. That is why the spike stack must live in terraform/personal and why
    the Step Functions IAM-coverage work below is unavoidable rather than a design choice. Deployment follows
    Decision 126's infra intent: a PR touching terraform/** is the sole trigger; CI plans and applies. This
    plan's agent NEVER runs terraform apply. The speculative-plan pipeline (CD.35 Wave 2 / T2.21) applies -- a
    PR-time plan is reviewed and saved, then re-applied at merge with no re-plan (Decision 77 no-TOCTOU).
    docs/contracts/environment-taxonomy.yaml is the sole SoT for guard classification, saved-plan persistence and
    the convergence-record shape; this plan names the required checks and does not restate the mechanics.
  - >-
    TWO ROOTS, TWO GATES, IN ORDER. terraform/bootstrap is Axis A `bootstrap`: "admin-only
    (agent_platform_admin), NEVER auto-apply, out-of-band from CD pipeline". The boundary DataPlaneAllow
    extension and the github_ci_apply `states:` grants live there and must be applied out-of-band by the operator
    BEFORE the personal-root apply, or every states: grant downstream is denied by the identity/boundary
    intersection and the spike cannot start an execution. This is a disclosed cost, surfaced at plan time: this
    plan costs at least one operator bootstrap apply plus two tf-gated-apply approvals (stack up, stack down).
  - >-
    New IAM roles (two Lambda execution roles and one Step Functions execution role) carry trust policies, the
    DailyOps states: grant is an inline-policy ADD on a managed boundary-carrying role, and the teardown is a
    destroy. Trust and destroy route to the human-gated tf-gated-apply Environment rather than auto-applying;
    the in-budget inline-policy diff routes per the taxonomy contract's guard classification, which is that
    file's call and not this plan's.
  - >-
    Local terraform is NOT installed in this container and terraform/personal's third-party kislerdm/neon
    provider cannot init from a stock CC-web session (Decision 119, terraform/CLAUDE.md). All local terraform
    verification is grep-only; the AUTHORITATIVE verifiers are CI's `terraform-validate` check and the
    speculative-plan job in the terraform-apply-sandbox workflow, with the gated legs in the
    tf-gated-apply-prototype workflow. No local terraform init/validate/plan appears in any VP step.
  - >-
    The account has NO VPC-based infrastructure and this plan adds none. Re-measured at f3e4e6d: a sweep of all
    38 terraform/**/*.tf files for aws_vpc, aws_subnet, aws_nat_gateway, aws_vpc_endpoint, aws_ecs_* and aws_efs_*
    resources returns ZERO matches, and zero Lambda vpc_config blocks. That measured zero is the factual basis of
    the exclusion's standing-cost reason AND the invariant VP step 2 defends repo-wide.
  - >-
    Region is pinned eu-west-2 (terraform/personal/variables.tf aws_region default). CD.43 criterion W3 requires
    costs be RECOMPUTED at decision time against that pin, not carried from the audit. The corpus already holds a
    recomputed eu-west-2 NAT figure at docs/ROADMAP-PLATFORM.yaml:342-347 (nat_contingency,
    standing_usd_per_month "33-35", confidence medium, rate_basis stated) -- re-verify it at implement time
    rather than re-deriving it, and see the W4 EGRESS-CLAIM context entry for the term it is and is not allowed
    to be.
acceptance_criteria:
  - >-
    docs/plans/reports/esb-q5-spike-findings.yaml partitions the audit's full Q5 arm set into `arms` and
    `excluded_arms` with no member missing from both and none in both, and every excluded arm carries all three
    recorded reasons (standing cost, operability, re-arm conditions) as non-empty entries.
  - >-
    A repo-wide sweep of terraform/**/*.tf finds ZERO aws_vpc, aws_subnet, aws_nat_gateway, VPC endpoint,
    aws_ecs_* and aws_efs_* resources and zero Lambda vpc_config blocks, while terraform/personal/esb_q5_spike.tf
    exists, declares at least one aws_sfn_state_machine, count-gates every spike resource on
    var.esb_q5_spike_enabled, and that variable is declared with default false. The exclusion is enforced by
    absence, class-wide.
  - >-
    Every strategy registered in scripts/esb_q5_spike/workspace.py STRATEGIES has a measured re-materialization
    record in findings.yaml for every arm that ran -- including BOTH s3_per_object and s3_tarball, each carrying
    a wall-clock term, a request/object-count term and a byte term (CD.43 W5). A registered-but-unmeasured
    strategy, or a measured-but-unregistered one, fails the check.
  - >-
    No module under scripts/esb_q5_spike/ imports a production write surface (scripts.ops_data_portal,
    scripts.ops_writer, scripts.s3_log_store, src.common.ducklake_writes, ducklake_writer) and no live LLM client
    surface is referenced outside scripts/esb_q5_spike/mock_llm.py.
  - >-
    aws_sfn_state_machine is classified in the read map, the write-coverage map, and all three
    LIFECYCLE_COMPANIONS phases, and validate_ci_refresh_read_coverage passes clean over terraform/personal with
    the spike stack present -- i.e. the state machines are refresh-read-covered in BOTH plan-capable role
    policies and write-covered by github_ci_apply.
  - >-
    The deterministic V-tier floor computed over this plan's own scope is V3 AND is forced by the .tf rows alone
    -- recomputing the floor with the .tf rows removed yields a tier below V3, proving no scope file matches
    active-manifest Lambda code -- and no new src/lambdas/*/manifest.yaml exists.
  - >-
    Each of the two arms was forced-killed mid-loop and resumed, and findings.yaml records per arm: the
    duplicate-ledger-row count (resume-without-reissue), the hand-roll residue on the audit's XS/S/M scale with
    the residue's constituent parts NAMED, and per-strategy re-materialization cost.
  - >-
    docs/DECISIONS.md gains exactly one new `## Decision NNN:` entry, that entry is at or under the 6,144-byte
    per-entry authoring cap, and the printed headroom figures for the per-entry cap, the 132-header ceiling, the
    780,000-byte combined ceiling and the 131,000-byte index pin are all non-negative. No compaction pass is
    performed and Decision 37 is untouched.
  - >-
    The comparative record over CD.27's five pinned candidates, the per-arm measurements, and the per-option
    W1-W8 disposition of CD.43's seven-member option_set live in findings.yaml, and the numbered Decision CITES
    that file rather than restating it -- while the Decision itself carries the ruling, the exclusion, the
    reversal conditions and the ESB-06 residual.
  - >-
    CD.43 is fully flipped and every coupled site moves with it: selected_store no longer reads
    TBD_at_CD.43_ratification, status no longer reads criteria_only, state/ratified_as/filed_via carry the
    canonical ratified shape with the same dec-NNN in both id fields, the "Criteria-only discipline" point no
    longer asserts that no field names a chosen store, nat_contingency.applies_to names the exclusion, the
    live-roadmap pytest suite is re-grounded, and the literal TBD_at_CD.43_ratification survives at EXACTLY ONE
    site in docs/ROADMAP-PLATFORM.yaml -- CD.27's ESB-01 precondition, where it correctly describes the act.
  - >-
    CD.27 reads state pending and the new Decision names ESB-06's determinism-rules-plus-static-check obligation
    as the sole remaining layer-2 blocker, with a follow-on rec id recorded. The two are checked as one
    conditional assertion in both directions: if CD.27 were flipped to ratified it would instead have to carry a
    non-empty precondition_discharge entry for each of ESB-01, ESB-04 and ESB-06.
  - >-
    config/agent/verification_registry/registry.yaml carries exactly four new esb-q5-* rows and remains at or
    under its 6,000-effective-line structural budget, with the measured headroom printed.
  - >-
    After teardown the spike flag reads false on main and a resource sweep of the spike's own name prefix returns
    zero live state machines and zero live Lambdas.
verification_plan:
  - step: 1
    phase: pre-deploy
    action: >-
      The exclusion is recorded as a CLASS over the audit's whole Q5 arm set, not as two names someone
      remembered. Require findings.yaml to partition that set into arms[] and excluded_arms{}, assert both
      directions (nothing in both, nothing in neither), and require every excluded arm to carry all three
      recorded reasons as non-empty entries.
    command: >-
      bin/venv-python -c "import pathlib,yaml; p=pathlib.Path('docs/plans/reports/esb-q5-spike-findings.yaml');
      assert p.exists(), 'findings.yaml absent'; f=yaml.safe_load(p.read_text(encoding='utf-8'));
      full=set(f['audit_q5_arm_set']); arms=set(f['arms']); exc=f['excluded_arms']; both=sorted(arms &
      set(exc)); assert not both, f'arm declared as both built and excluded: {both}'; missing=sorted(full - arms
      - set(exc)); assert not missing, f'audit arm(s) neither built nor excluded: {missing}';
      extra=sorted((arms | set(exc)) - full); assert not extra, f'arm(s) outside the audit Q5 set: {extra}';
      need=('standing_cost','operability','re_arm_conditions'); bad=sorted((a,k) for a,v in exc.items() for k in
