rollback: >-
  Revert as one commit. The four schema pin sites must move together in either direction - a partial
  revert leaves the S1 guard pinning a schema the producer no longer emits, which is worse than either
  end state. Because `body` is unchanged by construction, no fingerprint backfill or chain repair is
  needed; bundle sha256 values shift back, which is inert for the reasons given in Context. rec-2923's
  why_chain correction (VP step 8) is a warehouse write and is NOT reverted by a code revert - it is
  correct independently of whether this code lands.
