- >-
  Origin: rec-2923 (Critical, open, source=ci_rca) filed a factually wrong why_chain for run
  30615075007 - it asserted a same-budget retry ran and starved, and that apply was blocked WITHOUT
  latching the convergence record red. Neither is true: PR #812 (rec-2924) established that inherited
  errexit aborted the composite step at the first classifier call, so the retry never ran, `outcome`
  was never written, and step 17 wrote status=red for a run in which terraform apply was skipped.
- >-
  Root cause of the mis-narration: `--log-failed` returns only failed steps, so step 17 - the always-run
  step where the consequence landed - was absent from the agent's evidence. Step 15's log ends abruptly
  with no "Reviewer verdict:" line, and the agent filled the gap by narrating action.yml's intended
  control flow as observed fact.
- >-
  Precision on that premise: the step table was already ON the runner - ci-rca.yml:183 fetches the jobs
  payload and evidence.py:388-391 parses it for classify_failures. What was missing is that nothing
  SURFACED it to the agent or VALIDATED its completeness. This plan surfaces and validates data the
  pipeline already had.
- >-
  Three findings established by running rec-2923's filed context through the live validator, which
  reshaped this plan. (i) The existing guard ALREADY FIRED and warn mode swallowed it -
  _validate_ci_rca_context_v2 returns a citation deficiency and the rec carries warn_mode_reject
  {reasons: [schema_deficiency], mode_at_write: warn}. So no write-time check blocks anything today;
  they tag. (ii) rca_confidence `low` routes NOWHERE - ci_rca_signals.py filters on `undetermined`
  alone, so a self-declared low-confidence rec is consumed identically to a high-confidence one; the
  preflight gauge read undetermined_count 0 of 19 while rec-2923 sat in the queue. (iii) The citation
  regex covers `yaml` but not `yml`, so no citation to any workflow or action file in this repo can
  match - which is WHY rec-2923 was schema-deficient.
- >-
  Sharper edge on (iii): the source location rec-2923 cited as its systemic cause, action.yml:86-89, is
  the STARVED branch PR #812 later proved was dead code that never executed. The existing citation hook
  points at SOURCE, not at evidence, so it rewards the exact behaviour that caused the defect - reason
  from source, cite source. Fixing the yml gap is a bug fix, not an endorsement of that shape; see the
  named follow-on below.
- >-
  Fable advice-consult reconciliation. ADOPTED - the stamp-plus-echo hybrid (the derived fact is
  code-computed, satisfying ci-rca-lifecycle.yaml:128, while the echo remains a comprehension probe),
  which dissolves the either/or the earlier revision was stuck on; and routing `low` to the abstention
  surface, which the consult rated the single highest-value edit because it is the only change here
  that would have altered rec-2923's disposition under current flags. ADAPTED - typed epistemic
  anchoring is deferred, not rejected (below). REJECTED - forced-iteration "prove you read it" loops
  (the consult judged them folk remedy whose legitimate kernel is already the echo), and adversarial
  LLM review as a gate (acceptable only warn-only, and unjustified at n=1).
- >-
  NAMED FOLLOW-ON, with a trigger rather than a date: typed epistemic anchoring of why_chain entries -
  each entry tagged `observed_log` (carrying a verbatim quote that substring-matches the envelope body
  after whitespace normalisation), `source_inference` (a file:line that exists in the tree), or
  `hypothesis_unobserved` (referencing a stamped unobserved step). This inverts the quantifier: instead
  of detecting bad claims, which is undecidable, it requires every claim to carry a positive
  machine-checkable anchor, which is decidable. It is the intervention that would actually have blocked
  rec-2923's fabrication, since no quote exists that survives byte-match against the bundle-hashed body.
  It is deferred because it changes the schema, the agent instructions and every historical rec, and we
  have n=1. TRIGGER: build it as check-6 if warn-mode telemetry shows mis-narration recurring after
  this plan lands.
- >-
  Honest statement of what this plan does and does not achieve: it closes the information gap
  (disclosure), stamps the derived fact, forces the agent to read the manifest, and closes the
  abstention hole. It does NOT prevent a compliant agent from narrating about a disclosed unobserved
  step, and in warn mode it does not block anything at all. The abstention routing is the load-bearing
  behavioural change; everything else is instrumentation that becomes enforcement if and when strict
  mode is enabled.
- >-
  Relationship to the GAL-01 audit: GAL-01 replaced an unbounded whole-run `gh run view --log` fallback
  with a bounded failed-jobs-only selection plus a truncation envelope. It did NOT introduce the blind
  spot - `--log-failed` was always primary and returned non-empty here. What it did was build the
  envelope, and the envelope declares only VOLUME. The audit asked "Can truncation bias diagnosis?" and
  never asked whether SCOPE can; its acceptance wording, "retain failed job/step identity", treats the
  failed-step universe as given. This plan completes that envelope on the axis the audit did not examine.
- >-
  External integration note for `gh run view --json jobs`: step indexes are positional
  (`enumerate(steps, 1)` in _failed_jobs), deliberately NOT the payload's own step `number`, because
  the existing failed_steps entries already use the positional convention and the two must agree. If
  `steps` is absent for a job the scope block for that job is empty, U contributes nothing, and check-5
  silently no-ops - a fixture cannot detect this, so the contract records it as a known degradation.
- >-
  Bundle identity note: evidence.py:552 recomputes bundle["sha256"] over the whole bundle INCLUDING
  retrieval_evidence, so every bundle sha changes under this plan. Harmless - the bundle sha is per-run
  identity for local lookup, not a dedup key - but stated so it is not mistaken for chain damage.
- >-
  Note for GAL-03's implementer: after the v2 bump,
  tests/verify_ci_workflow/test_ci_rca_and_canary.py:420's negative fixture still passes (it asserts
  main(...) == 1 on a malformed envelope) but its semantics shift from "malformed body-less envelope"
  to "wrong schema version" - still valid, marginally weaker.
- >-
  rec-2923 closure split: this plan CORRECTS the why_chain (VP step 10) because ci-rca-lifecycle.yaml's
  bump_rule forbids mutating a closed head. It does NOT close the rec. The successor - the STARVED-
  surface plan carrying transcript archival, the Decision 155 marker, rec-2664 and the composite-action
  errexit guard - closes it via a `Resolves: rec-2923` trailer; if unavailable, since #812 already
  merged without one, it uses closure_dependency.manual_route (`--update-rec --status closed
  --resolution` then an explicit stamp_fixed_by_sha). That route is documented for rec-autoclose-sourced
  recs and rec-2923 is terraform-apply-sandbox-sourced, so the contract edit notes it is being applied
  slightly outside its stated scope.
- >-
  T2.39's exit criteria c2 and c3 are marked `met` but were structurally dead code from the day they
  landed until PR #812 - verified by unit-testing review_verdict.py's exit contract, never by driving
  the composite step under the `bash --noprofile --norc -e -o pipefail` invocation GitHub uses. No
  criterion flip is owed now that #812 restored them; the generalisation is the successor's errexit guard.
