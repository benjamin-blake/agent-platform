schema_version: 3
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: ci-rca-evidence-scope-declaration
intent: >-
  Make the CI-RCA retrieval envelope declare its own evidence SCOPE, not just its volume; stamp the
  unobserved-step set in code and require the agent to echo it back; and close the abstention hole that
  let a self-declared low-confidence, factually wrong post-mortem be consumed as if it were sound.
plan_type: IMPLEMENTATION
verification_tier: V2
plan_path: docs/plans/PLAN-ci-rca-evidence-scope-declaration.yaml
phase: >-
  Ad hoc CI-RCA quality remediation behind rec-2923; completes the GAL-01 evidence envelope from
  audits/github-actions-log-management-c144530f02d1 on the scope axis that audit did not examine.
scope:
- file: scripts/ci_rca/fetch_logs.py
  action: Modify
  purpose: >-
    _failed_jobs() already parses the complete steps array from the `gh run view --json jobs` call it
    already makes, then discards every step whose conclusion is not failure/timed_out/cancelled.
    Retain the failed job's full per-step table as {step_index, conclusion, log_retrieved} and emit it
    as a new top-level `scope` block, keyed BY JOB. Step names are not emitted. The `--log-failed`
    invocation, _fallback_logs, and the `body` blob are unchanged.
- file: scripts/ci_rca/log_evidence.py
  action: Modify
  purpose: >-
    Bump SCHEMA to ci-rca-log-evidence/v2 and add _validate_scope() wired into validate_envelope().
    validate_envelope is a positive-key validator that silently tolerates unknown keys, so without
    _validate_scope an absent scope block degrades invisibly (Decision 55).
- file: scripts/ci_rca/evidence_input.py
  action: Modify
  purpose: >-
    load_retrieval_input() copies a fixed key tuple (line 21) into retrieval_evidence. Add "scope" so
    the declaration reaches the bundle; without this the field is computed then silently dropped.
- file: scripts/ops_portal/ci_rca_schema.py
  action: Modify
  purpose: >-
    Two changes. (i) Add `unobserved_steps: Optional[list[int]]` to CiRcaContext - the agent's echo
    field. (ii) FIX _WHY_CHAIN_CITATION_RE (line 38): the alternation covers `yaml` but not `yml`, so
    no citation to any GitHub workflow or action file in this repo can ever match. This is why
    rec-2923 was stamped schema_deficiency - its terminus cited action.yml:36 and action.yml:86-89 and
    neither counted. Loosening-only, consistent with the CIRCA-04 precedent in the same file.
- file: scripts/ops_portal/ci_rca_runtime.py
  action: Modify
  purpose: >-
    Two changes. (i) Tier-B STAMP: compute the authoritative unobserved-step set from the verified
    bundle's retrieval_evidence.scope and stamp it onto context_v2_json beside fingerprint /
    failure_category / affected_nodeids / escape_class (lines 179-189), so the derived fact is
    code-computed per ci-rca-lifecycle.yaml:128. (ii) check-5 in _run_ci_rca_cross_check (line 99;
    issue block 198-254): compare the AGENT-supplied unobserved_steps echo against that authoritative
    set and stamp on mismatch. The stamp is the record; the echo is a comprehension probe.
- file: scripts/preflight/ci_rca_signals.py
  action: Modify
  purpose: >-
    _derive_ci_rca_undetermined_open (line 61) and _fetch_ci_rca_undetermined_recs (line 96) filter on
    rca_confidence == "undetermined" ONLY. The enum is high|medium|low|undetermined, so a `low` rec
    routes nowhere - rec-2923 self-rated low and was consumed identically to a high-confidence record.
    Widen the filter to {low, undetermined} and retitle the section accordingly.
- file: scripts/checks/ci_guards/validate_actions_evidence.py
  action: Modify
  purpose: _validate_s1 pins the schema string on line 73 AND repeats it in the message on line 74; both move to v2.
- file: docs/contracts/github-actions-evidence.yaml
  action: Modify
  purpose: >-
    Update both schema strings - diagnostic_classes.ci_rca_log_evidence.schema (line 42) and
    s1_linkage.schema (line 44). Only line 44 is enforced; line 42 is caught only by VP8's grep.
- file: docs/contracts/ci-rca-lifecycle.yaml
  action: Modify
  purpose: >-
    Record the scope field semantics (per-job keying, the log_retrieved derivation for both retrieval
    paths, the legal conclusion domain, orthogonality to volume truncation), the stamp-plus-echo split
    and why it satisfies line 128's in-code rule, and the honesty bounds in AC13.
- file: .claude/agents/scheduled/ci-rca.md
  action: Modify
  purpose: >-
    Step 2's bundle field list omits retrieval_evidence entirely - grep confirms zero occurrences, so
    even GAL-01's volume `limits` block is invisible to its only consumer. List
    retrieval_evidence.limits and .scope; require unobserved_steps in the Step 4 template; state that a
    listed step was NOT observed and must not be narrated from source.
- file: tests/test_ci_rca_fetch_logs.py
  action: Modify
  purpose: Add TestScopeStepTableTotality - totality, both-path log_retrieved derivation, multi-job, hostile step name.
- file: tests/test_ci_rca_log_evidence.py
  action: Modify
  purpose: Add TestScopeDeclarationCounterfactuals and TestFingerprintInputPinned.
- file: tests/test_ci_rca_evidence_input.py
  action: Modify
  purpose: Add TestScopePropagation.
- file: tests/ci_rca/evidence/test_main_emit.py
  action: Modify
  purpose: >-
    Its TestEmitDir fixture (lines 23-41) hand-builds a scope-less envelope through publish_envelope
    and will raise under AC6 once _validate_scope lands. Give the fixture a scope block.
- file: tests/checks/ci_guards/test_validate_actions_evidence.py
  action: Modify
  purpose: Cover the v2 linkage assertion and rejection of a stale v1 contract.
- file: tests/ops_data_portal/test_ci_rca_schema.py
  action: Modify
  purpose: Cover the unobserved_steps field and the yml citation fix, including a red fixture that fails pre-fix.
- file: tests/ops_data_portal/test_ci_rca_runtime.py
  action: Modify
  purpose: >-
    Add TestUnobservedStepsStampAndEcho. See the SLOC constraint - this file is at 403 SLOC and may
    need decomposing rather than growing.
- file: tests/session/preflight/test_ci_rca_signals.py
  action: Modify
  purpose: Cover the widened {low, undetermined} abstention filter, including a low-confidence rec now surfacing.
- file: config/agent/verification_registry/registry.yaml
  action: Modify
  purpose: Graduate the seven counterfactuals named in the VP as standing regression guards.
bundled_recommendations: []
infrastructure_dependencies: []
acceptance_criteria:
- >-
  AC1 - The envelope carries a top-level `scope` block keyed BY JOB, listing for each failed job EVERY
  step that executed as {step_index, conclusion, log_retrieved}. For run 30615075007's shape, steps 16
  (skipped) and 17 (success) both appear with log_retrieved=false. Totality is asserted producer-side
  by VP step 3 because the validator structurally cannot see it - AC6's superset rule is satisfied by
  scope == failed_steps.
- >-
  AC2 - The legal `conclusion` domain for a scope entry is stated explicitly and is strictly wider than
  failed_steps' closed {failure, timed_out, cancelled}: it admits success and skipped, and admits a
  null/absent conclusion for a not-started step (routine in a cancelled job, which _failed_jobs
  explicitly selects). Copying _validate_jobs' narrow enum would reject every real envelope, and since
  publish_envelope's ValueError escapes uncaught to fetch_logs.main() that would fail the whole CI-RCA
  job and file NO rec at all.
- >-
  AC3 - `log_retrieved` is derived STRUCTURALLY, never by searching `body`: on retrieval_path="primary"
  true exactly for steps in failed_steps; on "fallback" true for every step of a job in
  fallback_selection.queried_job_ids and false for every step of a job in unqueried_job_ids, because
  `gh run view --job <id> --log` returns that job's whole log.
- >-
  AC4 - `log_retrieved` is orthogonal to volume truncation and the contract says so: it means "this
  step's log was within the retrieval request's scope", not "every line is present in body". No
  validation rule couples the two, so a truncated body can never reject a valid envelope.
- >-
  AC5 - The authoritative unobserved-step set U is a set of {job_id, step_index} pairs, never a flat
  index space: `scope` is per-job, and a step index is only unique within its job. The
  agent-facing echo field carries the same pair shape. U is RUN-scoped, not bundle-scoped, because
  scripts/ci_rca/evidence.py:549-552 copies the same retrieval_evidence object onto every bundle of a
  multi-failure run; the contract says so explicitly.
- >-
  AC6 - `log_evidence.validate_envelope` REJECTS an envelope whose scope block is absent, whose per-job
  step set is not a superset of that job's failed_steps, whose indexes are unsorted or non-unique
  within a job, whose conclusions disagree with failed_steps, or whose log_retrieved flags contradict
  retrieval_path and fallback_selection. Mere omission of the key does not pass.
- >-
  AC7 - The unobserved-step set is STAMPED IN CODE onto context_v2_json from the verified bundle,
  alongside fingerprint / failure_category / affected_nodeids / escape_class at ci_rca_runtime.py
  179-189. It is therefore a portal-derived Tier-B fact and satisfies ci-rca-lifecycle.yaml:128
  ("computed IN CODE, never by the LLM RCA agent"). The agent's own field is a separate echo and is
  never the stored authority.
- >-
  AC8 - check-5 compares the agent's echo against the stamped authoritative set as sets of
  {job_id, step_index} pairs. Absent, subset, superset and wrong-set all stamp in warn mode and raise
  in strict mode; an exact match does not stamp; a bundle with no scope block degrades silently.
- >-
  AC9 - Replaying rec-2923's shape trips check-5: a bundle whose scope marks steps 16 and 17
  log_retrieved=false against a context carrying no echo field at all.
- >-
  AC10 - rca_confidence `low` reaches the preflight abstention surface. The filter widens from
  {undetermined} to {low, undetermined} and the section title stops claiming to be undetermined-only.
  A fixture rec at rca_confidence=low appears; one at high does not. This is the only change in the
  plan that would have altered rec-2923's disposition under the CURRENT feature-flag settings.
- >-
  AC11 - _WHY_CHAIN_CITATION_RE accepts `yml` as well as `yaml`. A red fixture citing
  `.github/workflows/ci.yml:12` fails against the pre-fix pattern and passes after. The change is
  loosening-only, so no historical rec is newly rejected.
- >-
  AC12 - The bytes of `body` are unchanged for any given source log. A test asserts
  error_signature_from_log_tail over the post-change envelope's body equals a FROZEN GOLDEN SIGNATURE
  literal captured from origin/main before any source edit - not a same-tree recomputation, which
  would be tautological - so Decision 142's non-pytest fingerprint keyspace provably does not fork.
- >-
  AC13 - The contract states three honest bounds rather than implying prevention. (i) PROSE - check-5
  enforces disclosure, not honesty: an agent that echoes correctly and then still narrates about those
  steps is compliant. (ii) VOLUME - unobserved_steps enumerates scope-axis blind spots only; a step
  marked log_retrieved=true whose log was cut by `limits` truncation is a real blind spot it will never
  contain, and `limits` remains the sole reporter of that axis. (iii) MODE - CI_RCA_STRICT_MODE is
  `warn`, so check-5 tags rather than blocks on landing; rec-2923 was itself stamped
  schema_deficiency in warn mode and filed regardless.
- >-
  AC14 - AC8's silent-degradation cases are enumerated, not left implicit: check-5 is unreachable when
  evidence_bundle_ref is absent (ci_rca_runtime.py:133-140, including the rca_confidence='undetermined'
  branch that returns with no stamp even in strict mode) and when the bundle file is not found locally
  (line 173). The bundle-absent route is the one the agent instructions explicitly endorse, and its
  accepted mitigation is that it already forces mandatory human review.
- >-
  AC15 - `.github/workflows/ci-rca.yml` is not modified, and `--log-failed` remains the retrieval
  mechanism, so Decision 72's named clause needs no amendment and PLAN-ci-rca-authority-anchor's guard
  and byte-for-byte env/run snapshot remain valid.
- >-
  AC16 - `retrieval_evidence.scope` is present in the bundle produced by `scripts.ci_rca.evidence
  --retrieval-envelope ...`, not merely in the envelope on disk.
- >-
  AC17 - No NEW GitHub-supplied free text enters the STRUCTURED fields of the envelope; step names are
  not emitted. This is deliberately narrower than "no GitHub free text in the envelope", which is
  false - `body` is raw `gh run view` output and has always carried step names verbatim.
- >-
  AC18 - The schema string reads ci-rca-log-evidence/v2 at all FIVE pin sites (log_evidence.SCHEMA,
  validate_actions_evidence lines 73 and 74, github-actions-evidence.yaml lines 42 and 44), with no v1
  left in scripts/, docs/contracts/ or .github/ outside __pycache__.
- >-
  AC19 - rec-2923's context_v2_json is corrected in the warehouse while the rec remains OPEN, by
  reading the existing blob, mutating why_chain in place, and writing the WHOLE blob back -
  update_rec's `merged = {**existing, **updates}` is a shallow merge, so a partial blob would erase
  fingerprint, evidence_bundle_ref and occurrence_count. fingerprint survival is asserted. update_rec
  does not re-validate context_v2_json (_UPDATE_CONTENT_VALIDATED_FIELDS omits it), so the one-shot
  validates before writing. Closure is NOT performed here.
- >-
  AC20 - Every changed Python source line is covered under the changed-file 100 percent coverage gate,
  and literal `bin/venv-python -m scripts.validate --pre` and `bin/venv-python -m scripts.validate`
  both exit zero before PR readiness.
verification_plan:
- step: 1
  phase: pre-deploy
  action: Prove the fingerprint input is pinned against a frozen golden captured from origin/main.
  command: bin/venv-python -m pytest tests/test_ci_rca_log_evidence.py::TestFingerprintInputPinned
  expected: error_signature_from_log_tail over the post-change body equals the frozen literal.
  fix_if: >-
    A differing signature means scope data leaked into the log body - move it back to the structured
    sibling. Do NOT re-salt or refresh the golden to accommodate the leak; that forks the keyspace
    Decision 142 deliberately kept disjoint.
  hermetic: true
  graduation: graduate
  graduation_check_id: ci-rca-scope-fingerprint-input-pinned
- step: 2
  phase: pre-deploy
  action: Prove the envelope validator enforces the scope block and accepts the full conclusion domain.
  command: bin/venv-python -m pytest tests/test_ci_rca_log_evidence.py::TestScopeDeclarationCounterfactuals
  expected: >-
    Absent scope, a per-job step set narrower than failed_steps, unsorted or duplicate indexes,
    conclusions disagreeing with failed_steps, and log_retrieved flags contradicting
    retrieval_path/fallback_selection all raise ValueError. A well-formed envelope validates; so do one
    containing success and skipped steps, one containing a null-conclusion step in a cancelled job, and
    a truncated-body envelope (limits.complete=false).
  fix_if: >-
    A tolerated-unknown-key pass means _validate_scope is not wired into validate_envelope. If the
    success/skipped/null or truncated-body cases REJECT, the implementation copied _validate_jobs'
    narrow enum or coupled log_retrieved to body content - both fail the whole CI-RCA job via
    publish_envelope's uncaught ValueError and file no rec at all.
  hermetic: true
  graduation: graduate
  graduation_check_id: ci-rca-scope-rejection-matrix
- step: 3
  phase: pre-deploy
  action: Prove producer-side step-table totality, both-path derivation, and multi-job pair keying.
  command: bin/venv-python -m pytest tests/test_ci_rca_fetch_logs.py::TestScopeStepTableTotality
  expected: >-
    With the run 30615075007 fixture, scope lists every executed step including 16 and 17, both
    log_retrieved=false. On the fallback path every step of a queried job is true and of an unqueried
    job false. With a two-failed-job fixture where job A step 3 is unretrieved and job B step 3 is
    retrieved, the pair keying keeps them distinct. The hostile step name never appears in the envelope.
  fix_if: >-
    If scope equals failed_steps the producer is still dropping succeeded steps and AC6's superset rule
    will NOT catch it. If the two-job case collides, the implementation flattened to a bare index space.
  hermetic: true
  graduation: graduate
  graduation_check_id: ci-rca-scope-step-table-totality
- step: 4
  phase: pre-deploy
  action: Prove the declaration survives the bundle boundary.
  command: bin/venv-python -m pytest tests/test_ci_rca_evidence_input.py::TestScopePropagation
  expected: load_retrieval_input carries `scope` into retrieval_evidence, and a v1 envelope is rejected.
  fix_if: If scope is on disk but absent from retrieval_evidence, the fixed key tuple at line 21 was not extended.
  hermetic: true
  graduation: graduate
  graduation_check_id: ci-rca-scope-bundle-propagation
- step: 5
  phase: pre-deploy
  action: >-
    Prove the authoritative set is stamped in code and that check-5 catches rec-2923's shape without
    punishing a correct echo.
  command: bin/venv-python -m pytest tests/ops_data_portal/test_ci_rca_runtime.py::TestUnobservedStepsStampAndEcho
  expected: >-
    The stamp lands on context_v2_json from the verified bundle even when the agent supplied no echo.
    The rec-2923 replay (no echo, scope declaring steps 16 and 17 unretrieved) is stamped in warn mode
    and raises in strict. An exact-pair-set echo is not stamped. Subset, superset, wrong-set and a
    flat-index echo are stamped. A bundle with no scope degrades silently.
  fix_if: >-
    If the exact-match control is stamped, the comparison is order- or type-sensitive - compare as sets
    of pairs. If the stamp is missing when the echo is absent, the Tier-B write was made conditional on
    the agent's field, which inverts AC7.
  hermetic: true
  graduation: graduate
  graduation_check_id: ci-rca-unobserved-steps-stamp-and-echo
- step: 6
  phase: pre-deploy
  action: >-
    Prove a low-confidence rec now reaches the abstention surface, and that the yml citation fix works.
  command: >-
    bin/venv-python -m pytest tests/session/preflight/test_ci_rca_signals.py
    tests/ops_data_portal/test_ci_rca_schema.py
  expected: >-
    A fixture rec at rca_confidence=low is returned by the abstention derivation and printed under the
    retitled section; one at high is not; undetermined still is. A terminus citing
    `.github/workflows/ci.yml:12` validates, and the same fixture fails against the pre-fix pattern.
  fix_if: >-
    If the low fixture does not surface, only one of the two filter sites was widened - both line 61
    and line 96 gate this. If the yml fixture still fails, the alternation was extended in the wrong
    group.
  hermetic: true
  graduation: graduate
  graduation_check_id: ci-rca-low-confidence-reaches-abstention-surface
- step: 7
  phase: pre-deploy
  action: Confirm the S1 linkage guard moved to v2 and rejects a stale v1 contract.
  command: bin/venv-python -m pytest tests/checks/ci_guards/test_validate_actions_evidence.py
  expected: The guard suite passes against the v2 contract and fails a fixture contract still declaring v1.
  fix_if: Update both line 73 and line 74; do not relax the assertion to accept either version.
  hermetic: true
  graduation: waive
  graduation_waiver_reason: >-
    Step 8 graduates the total-bump property, which is the one that fails when the five pin sites drift
    apart; this step is the module's own standing suite and adds no property step 8 lacks.
- step: 8
  phase: pre-deploy
  action: Confirm the schema bump is total, discriminating "no match" from "grep could not run".
  command: >-
    bash -c 'grep -rnI --exclude-dir=__pycache__ "ci-rca-log-evidence/v1" scripts/ docs/contracts/
    .github/; rc=$?; if [ "$rc" -eq 1 ]; then exit 0; else echo "grep rc=$rc (0=v1 survives,
    2=path unreadable)"; exit 1; fi'
  expected: >-
    Exit 0, no output. -I and --exclude-dir are required: a stale
    scripts/ci_rca/__pycache__/log_evidence.cpython-312.pyc matches on the current tree and would
    otherwise fail the step after a correct bump. tests/ and docs/plans/ are excluded deliberately -
    tests/verify_ci_workflow/test_ci_rca_and_canary.py:420 legitimately keeps a v1 negative fixture.
  fix_if: >-
    A surviving v1 in scripts/ or docs/contracts/ means a partial bump - worse than none, since the
    guard would pin a schema the producer no longer emits. rc=2 means a root path was renamed.
  hermetic: true
  graduation: graduate
  graduation_check_id: ci-rca-log-evidence-schema-v2-total
- step: 9
  phase: pre-deploy
  action: Confirm the GAL-03 surface is untouched, without letting a git failure pass as an empty diff.
  command: >-
    git fetch origin main --quiet && git diff --quiet origin/main...HEAD --
    .github/workflows/ci-rca.yml && bin/venv-python -m pytest
    tests/verify_ci_workflow/test_ci_rca_and_canary.py
  expected: >-
    `git diff --quiet` exits 0 only on an empty diff and non-zero on any change or ref error, and the
    CI-RCA workflow structural suite passes unchanged.
  fix_if: >-
    Any diff means this plan strayed onto GAL-03's surface. `--quiet` rather than a `wc -l | grep -qx 0`
    pipeline is required: that pipeline masks git's exit status and passes while asserting nothing if
    the ref is unresolvable.
  hermetic: false
  graduation: waive
  graduation_waiver_reason: >-
    The assertion is a diff against a moving origin/main and depends on this branch's merge-base rather
    than a stable repository property, so it cannot be a standing registry check.
- step: 10
  phase: pre-deploy
  action: Correct rec-2923's why_chain while it remains open, preserving the rest of its context blob.
  command: >-
    bin/venv-python scripts/oneshot/correct_rec_2923.py --apply && bin/venv-python -m
    scripts.ops_data_portal --sync && bin/venv-python -c "import json,pathlib;
    r=[json.loads(l) for l in pathlib.Path('logs/.recommendations-log.jsonl').read_text().splitlines()
    if l.strip()]; m=[x for x in r if x['id']=='rec-2923'][0];
    c=json.loads(m['context_v2_json']); assert m['status']=='open';
    assert c.get('fingerprint'); assert 'retry never executed' in ' '.join(c['why_chain']);
    print('OK', c['fingerprint'][:12])"
  expected: >-
    The script exits 0 and the assertions pass - rec-2923 still open, fingerprint survived, corrected
    why_chain readable. Reading the cache here is a read-back of a warehouse-derived projection after
    --sync, never a write source.
  fix_if: >-
    There is no CLI route: `--show-rec` does not exist and `--context-v2-json` is parsed but never
    forwarded on the `--update-rec` branch. The one-shot MUST use the Python API in a load-mutate-write
    shape (read via _fetch_rec_from_reader, mutate why_chain, write the WHOLE blob via update_rec) and
    MUST assert `_validate_ci_rca_context_v2(ctx) == []` before writing, because update_rec does not
    re-validate context_v2_json. If the fingerprint assertion fails the blob was replaced, not mutated.
  hermetic: false
  graduation: not-applicable
- step: 11
  phase: pre-deploy
  action: Run focused lint and the fast presubmit before commit, then rerun after the feat commit exists.
  command: >-
    bin/venv-python -m ruff check scripts/ci_rca/ scripts/ops_portal/ scripts/preflight/
    scripts/checks/ci_guards/validate_actions_evidence.py && bin/venv-python -m scripts.validate --pre
  expected: Ruff and the complete fast validator exit zero on both the working and committed trees.
  fix_if: Stop and repair; never report constituent passes as gate success.
  hermetic: false
  graduation: waive
  graduation_waiver_reason: Aggregate lint plus presubmit is an orchestration gate, not one registry node.
- step: 12
  phase: pre-deploy
  action: Run literal full validation before commit and again after the feat commit.
  command: bin/venv-python -m scripts.validate
  expected: Exit zero, including 100 percent changed-source coverage, full pytest, workflow guards, plan replay, registry, pre-commit.
  fix_if: Stop before push or PR and add behavior-relevant tests; do not waive coverage or lower thresholds.
  hermetic: false
  graduation: waive
  graduation_waiver_reason: The full repository validator is not one stable registry node.
constraints:
- >-
  Do NOT change the retrieval mechanism. `--log-failed` stays, ci-rca.yml is not edited, _fallback_logs
  is untouched. Widening retrieval would amend Decision 72's named clause and collide with
  PLAN-ci-rca-authority-anchor.
- >-
  Do NOT let scope data enter `body`. `body` is what error_signature_from_log_tail hashes into the
  non-pytest fingerprint; a leak forks Decision 142's keyspace and orphans every open chain.
- >-
  Do NOT derive log_retrieved by searching `body`, and do NOT copy _validate_jobs' closed
  {failure, timed_out, cancelled} enum into _validate_scope. Both mistakes reject valid envelopes, and
  publish_envelope's ValueError escapes uncaught to fetch_logs.main() - the CI-RCA job fails and NO rec
  is filed, converting a diagnosable failure into a silent one.
- >-
  Do NOT emit GitHub-supplied step names, and do NOT import
  validate_actions_evidence._SECRET_SHAPES into the evidence path. check-5 needs no string matching, so
  names buy nothing; that pattern is also near-inert on prose (it returns False on "deploy token
  abcdefgh") and importing a private symbol from the presubmit-checks package would register a check
  into the global registry as an import side effect.
- >-
  The stamped set is authoritative; the agent echo is NEVER the stored authority. Inverting this
  breaches ci-rca-lifecycle.yaml:128.
- >-
  SEQUENCING: PLAN-ci-rca-authority-anchor (GAL-03, approved, agent waiting) also edits
  config/agent/verification_registry/registry.yaml. Land GAL-03 first and rebase behind it.
- >-
  SLOC, decompose-by-default (Decision 128): scripts/ops_portal/ci_rca_runtime.py is 353 SLOC (~147
  headroom) and tests/ops_data_portal/test_ci_rca_runtime.py is 403 (~97), neither registered, and
  iter_gated_py_files() gates tests/. The new test class plus scope fixtures is the live risk. If
  either would cross 500, decompose into a sibling module - do not raise and do not run
  --update-sloc-budgets.
- All recommendation writes transit the ops portal (Decision 84); VP step 10 reads the cache only after --sync.
