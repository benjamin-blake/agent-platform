rollback: >-
  Single-PR revert. The change is additive plus in-place rebinding: reverting restores the five
  self-contained guards, the dec-161 marker, the AGENTS.md sentence and the prose budget, and drops
  the new module, contract, tests and Decision. No data migration, no infrastructure, no deployed
  artefact, so there is nothing to unwind beyond the commit. If only the retroactive scan proves
  problematic post-merge, the narrower rollback is to add the offending entry keys to the frozen
  grandfather hook (a reviewed code edit, by design) rather than reverting the whole slice.
