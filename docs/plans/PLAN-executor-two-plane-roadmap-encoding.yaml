rollback: >-
  Single-file and fully revertible: `git revert` the encoding commit and the roadmap returns to its
  prior state with no residue anywhere else in the repo, because nothing else was touched -- VP step 8
  asserts exactly that. There are no artifacts to delete, no tables to drop, no deployed resource, and
  no standing check to deregister, since this plan graduates nothing. The two new tier items and the
  new candidate decision are data rows in one document; removing them cannot red main, because no
  check asserts their existence outside this plan's own verification protocol. The one thing that
  should NOT be reverted casually is the record of why the two-arm substrate spike was retired: that
  reasoning is independent of whether this encoding survives, and if the design is later rejected the
  retirement record should be re-homed rather than lost with the revert.
