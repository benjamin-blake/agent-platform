schema_version: 4
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: "executor-two-plane-roadmap-encoding"
intent: >-
  Encode the operator's Two-Plane Executor design into docs/ROADMAP-PLATFORM.yaml, and nothing else.
  The design lives in a hosted artifact (linked in context, and Decision 86 keeps it there rather than
  importing it as repo prose); this plan's deliverable is the ROADMAP DELTA that makes it consistent,
  dependency-mapped and persisted. Three kinds of edit only: re-specifications of what T4.1/T4.2/CD.27/
  CD.43 already say, NEW tier items for mechanism the design needs and no item owns, and exit criteria
  or notes that give every open question from both source artifacts a home. This plan builds no
  executor. It decides WHERE each piece of the design lives in the roadmap, and proves mechanically
  that none of it was dropped.
plan_type: IMPLEMENTATION
verification_tier: V2
plan_path: docs/plans/PLAN-executor-two-plane-roadmap-encoding.yaml
phase: >-
  Platform T4 (executor). Roadmap-encoding precursor to T4.1/T4.2 -- it changes what those items say,
  and adds the items the design needs, without implementing any of them. Supersedes
  PLAN-esb-q5-substrate-spike.yaml, whose two-arm AWS comparison this design retires.

fallback_reevaluation:
  reevaluated_on: "2026-08-18"
  substrate_status: >-
    CD.27's layer-2 incumbent (Lambda Durable Functions, replay-from-checkpoint) is NOT the substrate
    this design selects. The Two-Plane design places every persona on a GitHub-hosted runner with
    LiteLLM in-process, which is not a replay substrate at all -- there is no checkpoint to replay
    from, because a task-attempt either completes within the job or is re-dispatched from the
    warehouse. CD.27 itself remains pending and unratified; this plan files a successor candidate
    decision rather than ratifying either.
  verdict: obligation_lapsed
  basis: >-
    Two CD.27-era ratification obligations lapse under a non-replay substrate, and the design's own
    GOV-3 says to CLAIM that rather than let a reviewer discover the obligations looking unmet. First,
    CD.27's DynamoDB self-checkpoint fallback_spec: its lapse condition names hosted_cli_runner
    explicitly, and a GitHub-hosted runner is that class, so the fallback has no subject. Second,
    ESB-06's determinism rules and their static check: they exist to make replay safe, and a substrate
    that never replays has nothing for them to constrain. Neither obligation is being waived on
    convenience grounds -- both are being reported as inapplicable to the selected substrate, which is
    a scope REDUCTION and is stated as one. This is exactly the claim GOV-3 requires, and VP step 2
    asserts the successor candidate decision carries it.

scope:
  - file: docs/ROADMAP-PLATFORM.yaml
    action: Modify
    purpose: >-
      THE ONLY FILE IN SCOPE, deliberately. The design's information must land in the roadmap to be
      dependency-mapped and machine-checked; anything that lands anywhere else (AGENTS.md, a contract,
      a Decision body) is OUT OF SCOPE HERE and is recorded as a routed follow-up rather than fixed in
      passing. Edits fall in four groups, specified in context: substrate re-specification (CD.44,
      CD.27, CD.43, T4.1, T4.2), two new MVP-critical tier items (T4.15, T4.16), exit criteria onto
      existing items for the design's operational gaps, and consistency notes for the drift both
      source artifacts surfaced. Line budget is the binding physical constraint: the file is 8,610
      lines against Decision 114's 10,000-line ceiling, so the delta has 1,390 lines of headroom and
      VP step 9 asserts it.

bundled_recommendations: []
closes_criteria: []

infrastructure_dependencies:
  - >-
    None. This plan touches one YAML document and runs no AWS call, no deploy, and no network write.
    That is a deliberate property: the design it encodes has large infrastructure implications, and
    separating the ENCODING from the BUILDING is what lets the encoding be reviewed on its own terms.

acceptance_criteria:
  - "docs/ROADMAP-PLATFORM.yaml is the only file modified."
  - "The roadmap validates against the RoadmapDocument schema with no dangling depends_on and no cycles."
  - "The file stays under Decision 114's 10,000-line ceiling."
  - "A candidate decision selects the layer-2 substrate and rules EXPLICITLY on whether a GitHub-hosted runner satisfies CD.27's managed-orchestration-primitive precondition (GOV-1) -- ruling either way is acceptable; leaving it unstated is not."
  - "That candidate decision states in writing whether this is the pinned hosted_cli_runner candidate re-specified or a new one (GOV-2), and claims the two ratification obligations that lapse (GOV-3) rather than leaving them looking unmet."
  - "T4.2's intent no longer specifies Lambda Durable Functions as the persona substrate."
  - "T4.1's intent records how Step Functions reaches a GitHub workflow, and that prepare_workspace allocates a slug rather than returning a filesystem handle."
  - "CD.43 carries a selected store rather than TBD_at_CD.43_ratification, with a per-criterion disposition for W1-W8."
  - "Every GOV/MECH/DATA/OPS identifier from the design artifact resolves to a named roadmap location -- asserted as a class sweep, not by inspection."
  - "Every new tier item is not_started and depends only on live items, so Decision 93's live-to-deferred prohibition is not violated."
  - "The dossier's five named consistency defects each land somewhere: CD.17's unfirability, VF-11's missing carrier, /overseer's roadmap invisibility, T3.10 targeting frozen Life-1 files, and AGENTS.md routing ops_execution_plans to the wrong backend."
  - "No edit fixes a defect outside docs/ROADMAP-PLATFORM.yaml; out-of-file repairs are recorded as routed follow-ups with a named destination."
  - "The retirement of the two-arm AWS substrate spike is recorded with its reason, so a future reader does not re-derive it."

verification_plan:
  - step: 1
    phase: pre-deploy
    action: >-
      The roadmap parses and validates. This is the floor: every other assertion reads the parsed
      document, so a schema failure makes them all vacuous.
    command: bin/venv-python -m scripts.validate --pre
    expected: "Exit 0, `All checks passed`, including `validate_platform_roadmap`."
    fix_if: >-
      A dangling depends_on means a new item names an id that does not exist. A cycle means a new
      edge points backwards into its own ancestry.
    hermetic: false
    graduation: waive
    graduation_waiver_reason: >-
      validate_platform_roadmap is already a standing check in the --pre tier; a registry row would
      duplicate a reader that runs on every PR.
  - step: 2
    phase: pre-deploy
    action: >-
      GOV-1 IS RULED ON, EITHER WAY. The design's own author names this as the likeliest place the
      proposal dies: ESB-04 requires the layer-2 substrate to be a managed orchestration primitive,
      and calling a GitHub-hosted runner one is a reading rather than a fact. This step does not
      require a particular ruling -- it requires that the roadmap contain one.
    command: >-
      bin/venv-python -c "import yaml,pathlib; d=yaml.safe_load(pathlib.Path('docs/ROADMAP-PLATFORM.yaml').read_text());
      cds={c['id']: c for c in d['candidate_decisions']}; sel=[c for c in cds.values() if 'GOV-1' in str(c.get('detail',''))];
      assert sel, 'no candidate decision cites GOV-1 -- the managed-orchestration-primitive precondition is unruled';
      body=str(sel[0].get('detail','')); import re; assert re.search(r'managed[ -]orchestration', body, re.I), 'GOV-1 cited
      without naming the precondition it rules on'; assert re.search(r'\b(satisfies|does not satisfy|supersed)', body, re.I),
      'GOV-1 named but no ruling verb -- state whether the precondition is met or superseded'; print('OK', sel[0]['id'],
      'rules on GOV-1;', len(body), 'chars')"
    expected: >-
      Exits 0 printing `OK CD.NN rules on GOV-1;` and a character count. On origin/main it exits 1
      with `no candidate decision cites GOV-1`.
    fix_if: >-
      Do NOT satisfy this by mentioning GOV-1. The body must name the managed-orchestration-primitive
      precondition and state whether it is met or superseded. An unstated reframing reads as a
      candidate-set violation.
    hermetic: true
    graduation: waive
    graduation_waiver_reason: >-
      Asserts the content of one candidate decision authored by this plan -- a transient fact, not a
      standing platform property.
  - step: 3
    phase: pre-deploy
    action: >-
      THE CLASS SWEEP, and the step this plan exists for. Every identifier the design artifact raises
      -- GOV-1..3, MECH-1..4, DATA-1..4, OPS-1..6 -- must resolve to a named location in the roadmap.
      Asserted as a class over the identifier set rather than as seventeen named assertions, so an
      identifier added to the design later fails the sweep instead of passing silently.
    command: >-
      bin/venv-python -c "import yaml,pathlib; raw=pathlib.Path('docs/ROADMAP-PLATFORM.yaml').read_text();
      ids=[f'GOV-{i}' for i in (1,2,3)]+[f'MECH-{i}' for i in (1,2,3,4)]+[f'DATA-{i}' for i in (1,2,3,4)]+[f'OPS-{i}'
      for i in (1,2,3,4,5,6)]; absent=[i for i in ids if i not in raw]; assert not absent, f'design identifiers with no
      roadmap home at all: {absent}'; d=yaml.safe_load(raw); entries=[(t['id'],str(t)) for t in d['tier_items']]+
      [(c['id'],str(c)) for c in d['candidate_decisions']]+[(q.get('id','OQ'),str(q)) for q in (d.get('open_questions')
      or [])]+[(k.get('id','KG'),str(k)) for k in (d.get('known_gaps') or [])]; blob={i:[eid for eid,s in entries if i in
      s] for i in ids}; orphan=sorted(i for i,v in blob.items() if not v); assert not orphan, f'identifiers present in the
      file but in no tier_item, candidate_decision, open_question or known_gap: {orphan}'; print('OK all', len(ids),
      'design identifiers homed:', {i: v for i, v in sorted(blob.items())})"
    expected: >-
      Exits 0 printing `OK all 17 design identifiers homed:` and the id-to-location map. On origin/main
      it exits 1 listing every identifier as missing.
    fix_if: >-
      An identifier present in a comment but in no structured entry fails the second leg deliberately
      -- a design question parked in a comment is not dependency-mapped and will not survive a
      roadmap edit by another agent.
    hermetic: true
    graduation: waive
    graduation_waiver_reason: >-
      The identifier set belongs to one design artifact; a registry row would pin this design's
      question list into the permanent suite, which the next design would have to amend.
  - step: 4
    phase: pre-deploy
    action: >-
      T4.2 no longer specifies Lambda Durable Functions as the persona substrate, and T4.1 records
      how Step Functions reaches a GitHub workflow. These are the two intent rewrites the design
      forces; asserted separately because they can regress independently.
    command: >-
      bin/venv-python -c "import yaml,pathlib,re; d=yaml.safe_load(pathlib.Path('docs/ROADMAP-PLATFORM.yaml').read_text());
      t={x['id']: x for x in d['tier_items']}; t42=str(t['T4.2'].get('intent','')); assert not re.search(r'[Dd]urable
      [Ff]unction', t42), 'T4.2 still specifies Durable Functions as the persona substrate'; assert re.search(r'(GitHub
      Actions|GitHub-hosted runner)', t42), 'T4.2 does not name the substrate the personas now run on'; assert
      re.search(r'[Ll]ite[Ll][Ll][Mm]', t42), 'T4.2 does not name the transport -- dec-122/164 compliance is the whole
      admissibility argument'; t41=str(t['T4.1'].get('intent','')); assert re.search(r'(workflow_dispatch|repository_dispatch)',
      t41), 'T4.1 does not say how Step Functions reaches a workflow'; assert re.search(r'slug', t41), 'T4.1 does not
      record that prepare_workspace allocates a slug rather than a filesystem handle'; print('OK T4.2 re-substrated,
      T4.1 dispatch + slug recorded')"
    expected: >-
      Exits 0 printing `OK T4.2 re-substrated, T4.1 dispatch + slug recorded`. On origin/main it exits
      1 on the first assertion -- T4.2's intent currently reads "Durable Functions".
    fix_if: >-
      If T4.2 still names Durable Functions anywhere in intent, the re-specification is half-applied
      and a reader will design for the wrong substrate.
    hermetic: true
    graduation: waive
    graduation_waiver_reason: >-
      Asserts the current wording of two tier items, which the next substrate decision would have to
      amend. Transient by construction.
  - step: 5
    phase: pre-deploy
    action: >-
      CD.43 selects a store instead of deferring, and disposes of every criterion it defined. The
      design claims the workspace question dissolves because the workspace is the branch; that claim
      has to survive contact with W1-W8 rather than skipping them.
    command: >-
      bin/venv-python -c "import yaml,pathlib,re; d=yaml.safe_load(pathlib.Path('docs/ROADMAP-PLATFORM.yaml').read_text());
      cd={c['id']: c for c in d['candidate_decisions']}['CD.43']; body=str(cd.get('detail','')); assert
      'TBD_at_CD.43_ratification' not in body, 'CD.43 still defers its store selection'; assert re.search(r'selected_store',
      body), 'CD.43 names no selected_store key'; ws=[w for w in ('W1','W2','W3','W4','W5','W6','W7','W8') if w not in body];
      assert not ws, f'CD.43 selects a store but disposes of no verdict for {ws}'; print('OK CD.43 selects; W1-W8 all
      disposed')"
    expected: >-
      Exits 0 printing `OK CD.43 selects; W1-W8 all disposed`. On origin/main it exits 1 with `CD.43
      still defers its store selection`.
    fix_if: >-
      Do NOT close CD.43 by asserting the question changed shape. If a criterion no longer applies,
      say so per criterion -- a criterion closed by a question that changed shape is a false closure.
    hermetic: true
    graduation: waive
    graduation_waiver_reason: >-
      Asserts one candidate decision's disposition; it changes again the moment the store is revisited.
  - step: 6
    phase: pre-deploy
    action: >-
      NEW ITEMS ARE MVP-ADMISSIBLE. Decision 93's validator forbids a live item depending on a
      deferred one, and it only sees depends_on edges. Every item this plan adds must be not_started
      and depend only on live items, or it imports a deferral it cannot see.
    command: >-
      bin/venv-python -c "import yaml,pathlib; d=yaml.safe_load(pathlib.Path('docs/ROADMAP-PLATFORM.yaml').read_text());
      t={x['id']: x for x in d['tier_items']}; new=[i for i in ('T4.15','T4.16') if i in t]; assert len(new)==2, f'expected
      T4.15 and T4.16, found {new}'; wrong={i: t[i]['status'] for i in new if t[i]['status']!='not_started'}; assert not
      wrong, f'new items must be not_started: {wrong}'; bad={i: [dep for dep in (t[i].get('depends_on') or []) if
      t.get(dep,{}).get('status')=='deferred_post_mvp'] for i in new}; bad={i: v for i, v in bad.items() if v}; assert not
      bad, f'new live items depending on deferred items (Decision 93): {bad}'; dangling={i: [dep for dep in
      (t[i].get('depends_on') or []) if dep not in t] for i in new}; dangling={i: v for i, v in dangling.items() if v};
      assert not dangling, f'new items name ids that do not exist: {dangling}'; print('OK', new, 'not_started, no
      live-to-deferred edges, no dangling deps;', {i: t[i].get('depends_on') for i in new})"
    expected: >-
      Exits 0 printing `OK ['T4.15', 'T4.16'] not_started, no live-to-deferred edges;` and each item's
      dependency list. On origin/main it exits 1 -- neither item exists.
    fix_if: >-
      If a new item needs something from a deferred item, that is a slicing signal, not a dependency
      -- the a-suffix pattern (T4.9a, T4.10a) exists for exactly this and was the remedy the roadmap
      audit chose.
    hermetic: true
    graduation: waive
    graduation_waiver_reason: >-
      Pins two specific item ids from this plan; the next roadmap edit renumbers or retires them.
  - step: 7
    phase: pre-deploy
    action: >-
      THE DOSSIER'S FIVE CONSISTENCY DEFECTS EACH LAND. These are not from the design artifact -- they
      are pre-existing roadmap drift the dossier surfaced, and a roadmap-encoding plan that leaves
      them is encoding into a document it knows is inconsistent.
    command: >-
      bin/venv-python -c "import yaml,pathlib,re; raw=pathlib.Path('docs/ROADMAP-PLATFORM.yaml').read_text();
      d=yaml.safe_load(raw); need={'CD.17-unfirable': r'CD\.17[^\n]{0,400}?(unfirab|cannot fire|not wired|item_field_eq)',
      'VF-11-carrier': r'VF-11[^\n]{0,400}?(carrier|no gate|not in gates)', 'overseer-invisible': r'overseer[^\n]{0,400}?
      (no tier item|invisible|unowned|no depends_on)', 'T3.10-frozen-scope': r'T3\.10[^\n]{0,400}?(frozen|Life 1|dead on
      arrival|sequencing)', 'AGENTS-md-backend-drift': r'(AGENTS\.md[^\n]{0,300}?ops_execution_plans|ops_execution_plans[^\n]{0,300}?AGENTS\.md)'};
      missing=sorted(k for k,p in need.items() if not re.search(p, raw, re.I|re.S)); assert not missing, f'dossier
      consistency defects with no roadmap record: {missing}'; print('OK all 5 dossier defects recorded')"
    expected: >-
      Exits 0 printing `OK all 5 dossier defects recorded`. On origin/main it exits 1 listing all five.
    fix_if: >-
      AGENTS.md and the contracts are OUT OF SCOPE for this plan. Record each defect with its routed
      destination; do not fix it here and do not silently drop it because it cannot be fixed here.
    hermetic: true
    graduation: waive
    graduation_waiver_reason: >-
      A one-off reconciliation list; graduating it would assert these five strings forever, including
      after the underlying defects are fixed and the records removed.
  - step: 8
    phase: pre-deploy
    action: >-
      OUT-OF-FILE REPAIRS ARE ROUTED, NOT PERFORMED. The plan's scope discipline is itself a property
      worth asserting: exactly one file changes, and anything the design implies elsewhere carries a
      named destination.
    command: >-
      bin/venv-python -c "import subprocess; out=subprocess.run(['git','diff','--name-only','origin/main...HEAD'],
      capture_output=True, text=True).stdout.split(); plans=[f for f in out if f.startswith('docs/plans/')];
      other=[f for f in out if not f.startswith('docs/plans/')]; assert other==['docs/ROADMAP-PLATFORM.yaml'],
      f'expected ROADMAP-PLATFORM.yaml as the only non-plan file changed, got {other}'; print('OK single-file scope;
      plan docs:', plans)"
    expected: >-
      Exits 0 printing `OK single-file scope; plan docs:` and this plan's own path. Fails if any other
      repo file was touched.
    fix_if: >-
      A tempting in-passing fix to AGENTS.md or a contract is exactly what this step exists to catch.
      Route it; do not widen the diff.
    hermetic: false
    graduation: waive
    graduation_waiver_reason: >-
      Asserts this plan's own diff shape against origin/main -- meaningless once merged.
  - step: 9
    phase: pre-deploy
    action: >-
      The line budget survives. Decision 114 caps the roadmap at 10,000 lines and the file is already
      8,610, so the encoding has 1,390 lines of headroom. This is a real physical constraint on how
      verbose the delta may be, and it is asserted rather than hoped.
    command: >-
      bin/venv-python -c "import pathlib; n=len(pathlib.Path('docs/ROADMAP-PLATFORM.yaml').read_text().splitlines());
      assert n <= 10000, f'roadmap is {n} lines, over the Decision 114 ceiling of 10000'; print(f'OK roadmap {n} lines,
      {10000-n} of headroom remaining')"
    expected: >-
      Exits 0 printing `OK roadmap N lines, M of headroom remaining`. Passes on origin/main too (8,610)
      -- this is a REGRESSION GUARD on the delta's size, not a differential.
    fix_if: >-
      If the delta breaches the ceiling, do NOT raise it. Decision 114 owns that number and raising it
      is a deliberate exception, not a side effect of an encoding pass. Compress the prose instead.
    hermetic: true
    graduation: waive
    graduation_waiver_reason: >-
      The ceiling is already enforced by validate_platform_roadmap's own size check; a registry row
      would be a second reader of the same limit.
  - step: 10
    phase: pre-deploy
    action: Full presubmit tier, per handoff_policy.
    command: bin/venv-python -m scripts.validate
    expected: "Exit 0, `All checks passed`."
    fix_if: >-
      A timeout is timeout_disposition blocked: resume the named check and rerun the full tier from
      the start rather than reporting a partial pass.
    hermetic: false
    graduation: not-applicable

test_obligations:
  - source: docs/ROADMAP-PLATFORM.yaml
    behavior: >-
      The roadmap validates against RoadmapDocument with no dangling depends_on, no cycles, no
      live-to-deferred edges, and within the Decision 114 line ceiling.
    verification_step: 10
    command: bin/venv-python -m scripts.validate
    waiver_reason: >-
      The roadmap is DATA, not code with behavior. Its schema, dependency graph, id resolution,
      MVP-boundary edges and line ceiling are already owned by validate_platform_roadmap and the
      Decision 93 validator, both standing checks in the validate tier. Verification steps 2-7 and 9
      assert this plan's specific deltas mechanically from the parsed document. A bespoke test would
      pin one encoding pass's content into the permanent suite, which the next roadmap edit would
      have to amend.

constraints:
  - >-
    ONE FILE. docs/ROADMAP-PLATFORM.yaml is the entire scope. The design implies real repairs
    elsewhere -- AGENTS.md routes ops_execution_plans to a retired backend, the NAMED_READS registry
    lacks the plan-fetch verb, contracts carry vocabulary skew -- and NONE of them is performed here.
    Each is recorded in the roadmap with a named destination. VP step 8 asserts the diff shape, because
    an in-passing fix is the likeliest way this plan grows past what a reviewer can hold.
  - >-
    ENCODE, DO NOT DECIDE WHAT THE DESIGN LEFT OPEN. Where the design artifact says a question is
    unanswered (MECH-1's credential model, MECH-3's continuation mechanism), the roadmap records it as
    an owned open item with an owner -- it does not invent an answer. The distinction matters: this
    plan's job is that nothing is dropped, not that everything is solved.
  - >-
    RULE ON GOV-1 EXPLICITLY, EITHER WAY. ESB-04 requires the layer-2 substrate to be a managed
    orchestration primitive. Whether a GitHub-hosted runner is one is a reading, not a fact, and the
    design's own author names this as the likeliest place the proposal dies. A candidate decision that
    selects the substrate WITHOUT ruling on the precondition is inadmissible by construction. Ruling
    "it does not satisfy it, and here is the supersession" is an acceptable outcome; silence is not.
  - >-
    NO NEW STANDING PROSE DOC (Decision 86). The design artifact and the dossier stay hosted. Do not
    import either into docs/ as a companion document -- that is the exact anti-pattern Decision 86
    forbids and would create a second surface to sync. Intent routes to tier items, rationale to
    Decisions, field semantics to contracts.
  - >-
    RESPECT THE LINE CEILING. 1,390 lines of headroom against Decision 114's cap. Prefer amending an
    existing intent to appending a new note; prefer one exit criterion to a paragraph. If the delta
    does not fit, compress it -- raising the ceiling is a deliberate exception that this plan has no
    authority to take.
  - >-
    NEW ITEMS DEPEND ONLY ON LIVE ITEMS. Decision 93's validator sees depends_on edges and nothing
    else. A prose coupling ("MUST conform", "author before T4.2") binds invisibly -- that is EXR-03,
    already a known defect of this roadmap. Where a new item genuinely needs a deferred item's output,
    slice the deferred item rather than adding the edge; the a-suffix pattern exists for this.
  - >-
    THE SPIKE IS RETIRED, AND THE RETIREMENT IS RECORDED. PLAN-esb-q5-substrate-spike.yaml's two-arm
    AWS comparison is superseded by this design, and the reason belongs in the roadmap so nobody
    re-derives it: an agent's real state is a git working tree plus a transcript, not a 256KB
    checkpoint blob, so both arms were forced to hand-build the same S3 workspace layer and the
    headline metric was decided by the shared loop's cursor granularity rather than by either
    substrate. Recording the retirement is in scope; deleting the plan file is not.
  - >-
    DO NOT TOUCH THE FROZEN EXECUTOR. scripts/executor/ and scripts/execute_recommendation.py are
    Life 1 -- roughly 10,300 SLOC retained solely as a reference corpus, never restarted, retiring by
    deletion when Life 2 stops needing it. Its defects are evidence, not a work queue. The only
    roadmap-side action here is the T3.10 sequencing note, because T3.10 is a LIVE item whose
    files_in_scope are frozen Life-1 files.
  - >-
    V2, NOT V3, AND THE FLOOR IS ARGUED. No .tf file, no Lambda artifact, no deployed resource is in
    scope -- the deterministic V-tier floor keys on resource-affecting scope, and a single YAML
    document does not reach it. V2 is claimed because the edits are machine-checkable from the parsed
    document and every VP step is a real command.

context:
  - >-
    THE DESIGN ARTIFACT -- READ IT IN FULL BEFORE REVIEWING THIS PLAN. The Two-Plane Executor design
    is at https://claude.ai/code/artifact/a591749c-cc12-4b5e-b582-ac03595e04dc and is the operator's
    own work, not this plan's proposal. Shape: Step Functions keeps the state machine and carries
    IDENTIFIERS ONLY (rec_id, revision, head SHA, task token); GitHub Actions runs every persona and
    every verification gate, all LiteLLM in-process; the plan artifact lives in ops_execution_plans and
    is fetched by verb. Its governing rule: "Step Functions passes identifiers and permissions. Agents
    fetch content." It carries its own open-question register -- GOV-1..3, MECH-1..4, DATA-1..4,
    OPS-1..6 -- and VP step 3 asserts every one of those seventeen identifiers has a roadmap home.
  - >-
    THE DOSSIER -- the second required reading, at
    https://claude.ai/code/artifact/a290d222-4200-4f2e-a74c-2f9cf07c370f. It is a derived reference on
    what the executor currently IS: two systems sharing one name (Life 1, frozen at ~10,300 SLOC and
    retiring by deletion; Life 2, the CD.27/CD.28 design, zero of sixteen T4 items started), the
    governance lattice, and the drift. It is explicitly NOT authoritative over the roadmap -- its own
    closing section says so, citing Decision 86 -- which is precisely why its claims need encoding
    HERE to bind. Five of its findings are asserted by VP step 7.
  - >-
    WHY THE SCOPE IS ONE FILE, stated because it will look under-ambitious. The design's information
    has to be dependency-mapped and machine-checked to survive; the roadmap is the only artifact in
    this repo that does both. A plan that also touched AGENTS.md, the NAMED_READS registry and three
    contracts would be four plans wearing one hat, and the encoding -- the part that decides where
    each piece LIVES -- would be reviewed last and least. Splitting it out is what makes the placement
    decisions reviewable on their own terms.
  - >-
    THE PLACEMENT DECISIONS ARE THE DELIVERABLE, AND THEY ARE WHAT REVIEWERS SHOULD ATTACK. Four
    groups. GROUP 1, substrate re-specification: a new candidate decision selecting the layer-2
    substrate and ruling on GOV-1/2/3; CD.27's layer-2 clause narrowed rather than deleted; CD.43
    given a selected_store with W1-W8 dispositions; T4.2's persona substrate rewritten; T4.1 given the
    dispatch mechanism and the shrunken prepare_workspace. GROUP 2, two new MVP-critical items: T4.15
    for the Step-Functions-to-GitHub dispatch and callback credential model (MECH-1 plus MECH-2's
    runner-death token failure), which the design calls its single largest unbuilt piece; and T4.16 for
    the execution_plan_by_rec named read verb (DATA-1), which nothing downstream of plan_agent can run
    without. GROUP 3, exit criteria onto EXISTING items rather than new ones -- MECH-3 to T4.11,
    MECH-4 to T4.3, DATA-3 and OPS-2 and OPS-5 to T4.2, OPS-3 to T4.13, OPS-4 to T4.4, OPS-1 and OPS-6
    to T4.1. GROUP 4, consistency records for drift neither this plan nor this file can fix.
  - >-
    WHY ONLY TWO NEW ITEMS. The temptation is one item per open question, which would add ten and make
    the T4 tier unreadable. The test applied: does an existing item already own this surface? MECH-3
    (six-hour continuation) is a loop-budget question and T4.11 is the loop-budget contract. MECH-4
    (unsticking a dead run's rec) is a priority-queue question and T4.3 owns the queue. OPS-3
    (LLM-authored code running with an OIDC session) is a threat-model question and T4.13 is the
    threat model. Only MECH-1 and DATA-1 have no owner at all, and both are on the MVP critical path.
    Two items, not ten.
  - >-
    OPS-5 IS THE ONE THAT SHOULD WORRY A REVIEWER MOST, and it did not come from any of this plan's
    own review passes -- it came from the design artifact. This repository is PUBLIC (Decisions 73/83/
    101), so an Actions runner's default log sink is world-readable. Sinking persona transcripts to S3
    is a PUBLICATION-BOUNDARY REQUIREMENT, not a preference. It is routed to T4.2 as an exit criterion
    because T4.2 is where personas gain the ability to emit anything at all. A reviewer who thinks it
    belongs on its own item, or as a hard gate rather than a criterion, is making exactly the argument
    this plan wants tested.
  - >-
    THE SUPERSESSION THIS PLAN PERFORMS. PLAN-esb-q5-substrate-spike.yaml planned a two-arm AWS
    comparison -- Lambda durable functions versus stateless Lambdas, forced-killed mid-loop. That plan
    survives on branch as history and is NOT deleted here, but its question is retired: both arms hit
    a 256KB cap (durable-functions checkpoints and Step Functions state alike) and were therefore
    forced to offload the real state to S3 and hand-build the same workspace layer, leaving only
    control-flow replay to compare -- and that number was set by the shared loop's per-iteration cursor
    rather than by either substrate. The dossier independently calls the substrate spike "the single
    highest-leverage unowned action"; this design answers it by reasoning instead, which is a claim a
    reviewer should test rather than accept.
  - >-
    WHAT THIS PLAN DELIBERATELY DOES NOT DO, so its limits are a first-class section rather than a
    footnote. It does not build anything. It does not resolve MECH-1's credential model or MECH-3's
    continuation mechanism -- it gives them owners. It does not fix AGENTS.md's ops_execution_plans
    backend claim, the missing NAMED_READS verb, the contract vocabulary skew, or the boundary-pattern
    drift; all four are recorded with destinations. It does not ratify CD.27, CD.28 or CD.44 -- filing
    a candidate decision is not ratifying it. It does not touch the frozen Life-1 executor. And it does
    not settle whether GitHub Actions is the right answer: it makes the design's own admissibility
    question (GOV-1) explicit so that ruling can be reviewed, which is the opposite of assuming it.
  - >-
    AUTHORSHIP AND REVIEW STATE. Written by the overseer directly at the operator's instruction, from
    the operator's own design artifact plus a derived dossier, after the previous plan
    (PLAN-harness-actions-skeleton.yaml) was BLOCKED by three parallel adversarial lenses with twelve
    blocking findings. The review round count restarts here: this plan is structurally different --
    single-file, roadmap-only, no implementation -- so the earlier findings do not transfer, though
    two of their lessons do. Class-versus-site is why VP step 3 is a sweep over the whole identifier
    set rather than seventeen assertions. Remediate-by-adding-mechanism is why Group 3 routes eight
    open questions onto EXISTING items and only two get new ones.

