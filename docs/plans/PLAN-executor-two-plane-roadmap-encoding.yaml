rollback: >-
  Three files and a set of portal writes. The two YAML documents and the Decision 87 amendment revert
  cleanly with `git revert`; nothing is deployed, no table changes, no standing check is registered,
  and this plan graduates nothing. The filed recommendations do NOT revert with the commit -- they are
  warehouse rows, and the correct undo is `--update-rec <id> --status declined` with a resolution
  naming this rollback, never a direct edit to the read cache. Two things should survive a revert
  rather than being lost with it: the Decision 87 amendment, because the circularity it corrects is
  real whether or not this encoding lands, and the routing contract, because it is a general rule that
  outlives this design. If the encoding is abandoned, re-home both rather than reverting them.
