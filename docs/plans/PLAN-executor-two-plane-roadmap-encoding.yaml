schema_version: 4
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: "executor-two-plane-roadmap-encoding"
intent: >-
  Encode the operator's Two-Plane Executor design into the platform roadmap, amend Decision 87 to
  break the plan-authority circularity the design exposes, and state once -- in a contract -- which
  work becomes a roadmap item and which becomes a recommendation. The design itself stays in its
  hosted artifact (Decision 86); this plan's deliverable is the governance delta that makes it
  consistent, dependency-mapped and persisted. It selects no substrate: the decision_scout
  stub-persona spike still does that, AFTER this plan, and this encoding is what gives it a
  properly-specified candidate to test.
plan_type: IMPLEMENTATION
verification_tier: V2
plan_path: docs/plans/PLAN-executor-two-plane-roadmap-encoding.yaml
phase: >-
  Platform T4 (executor). Roadmap-and-governance precursor to T4.1/T4.2 and to the layer-2 substrate
  spike, which this plan gives an owner and sequences after itself.

fallback_reevaluation:
  reevaluated_on: "2026-08-18"
  substrate_status: >-
    CD.27's layer-2 incumbent (Lambda Durable Functions, replay-from-checkpoint) REMAINS the
    incumbent. This plan records the two-plane design as a CANDIDATE and selects nothing. The
    decision_scout stub-persona spike -- named as the resolving instrument by CD.27's own ESB-04,
    ESB-06 and ESB-01 preconditions -- has not run.
  verdict: continue_on_current_substrate
  basis: >-
    An earlier draft of this plan recorded obligation_lapsed on the grounds that a GitHub-hosted
    runner is a non-replay substrate for which CD.27's DynamoDB self-checkpoint fallback is
    inapplicable. That was PREMATURE and is corrected here. The fallback's own lapse_condition fires
    only "if wave 5's Q5 spike pins a layer-2 substrate" -- so claiming the lapse while also retiring
    the spike would have rested the claim on a trigger whose triggering instrument the same plan
    deleted, and would have left CD.27 formally unratifiable, since every declared precondition
    requires discharge and the discharging instrument would no longer exist. The spike is NOT
    retired. Until it runs and pins a substrate, the incumbent stands and no obligation lapses.

scope:
  - file: docs/ROADMAP-PLATFORM.yaml
    action: Modify
    purpose: >-
      The encoding. Four groups: substrate re-specification as a CANDIDATE (new criteria-only
      candidate decision; CD.27's layer-2 clause given a pointer, not a replacement; CD.43 left
      criteria-only because the spike still selects); a new tier item OWNING the layer-2 spike, which
      the dossier calls the single highest-leverage unowned action in the subsystem, plus the two
      MVP-critical items the design needs; the design's open register routed onto existing items as
      exit criteria; and the stale-substrate sweep across every sibling site, which the previous
      round of this plan missed. Line budget is binding: 8,616 lines against Decision 114's 10,000
      ceiling leaves 1,384 -- re-measured after rebase, because the previous draft quoted a stale
      8,610 that main had already moved past.
  - file: docs/DECISIONS.md
    action: Modify
    purpose: >-
      AMEND DECISION 87 to invert its ordering. Decision 87 clause 2 times the git-to-warehouse plan
      authority flip to "the existence of the autonomous plan producer." The two-plane design makes
      that circular: plan_agent cannot function until its plan is warehouse-readable, T4.5 and T4.6
      both depends_on T4.2, and T4.5's deferral rationale is "no warehouse consumer of plans exists
      until the T4.6 loop" -- a consumer this design creates at MVP. The amendment states that plans
      being warehouse-resident is a PREREQUISITE for the autonomous executor, not a consequence of
      it. In-place amendment, matching the sixteen already in this file; adds no new header, and the
      per-entry cap is forward-only so Decision 87's existing 6,370 bytes are not re-measured.
  - file: docs/contracts/work-item-routing.yaml
    action: Create
    purpose: >-
      THE ONE NEW MECHANISM THIS PLAN ADDS, declared rather than smuggled. States which work becomes
      a roadmap tier item, which becomes a recommendation, and which becomes neither -- so a roadmap
      item can carry a rec id instead of a paragraph. Two problems make this load-bearing rather than
      tidy: the roadmap has 1,384 lines of headroom against a hard ceiling, and open_questions /
      known_gaps have NO runtime reader (verified: only the Pydantic schema touches them, and the
      file's own history shows OQ.1/OQ.2 sat resolved for weeks until an audit reconciled them),
      while the rec queue is the one register /orient actively surfaces. Mirrors the routing_rule
      shape decision-entry.yaml already uses at :402.
  - file: docs/contracts/file-router.yaml
    action: Modify
    purpose: >-
      One row registering the new contract for discovery. Mechanical: file-router is the single place
      a path is recorded, and validate_placement gates target resolution.

bundled_recommendations: []
closes_criteria: []

infrastructure_dependencies:
  - >-
    Ops-portal reachability for the recommendation filings in execution steps 12-13. Those are portal
    calls, not file edits -- which is why the single-file scope of the previous draft never excused
    parking out-of-file repairs in an unread register. A write that cannot complete FAILS LOUD at the
    call site; there is no offline outbox.

acceptance_criteria:
  - "Decision 87 carries an amendment stating warehouse-resident plans are a PREREQUISITE for the autonomous executor, not a consequence of it."
  - "The amendment names the circularity it breaks: T4.5/T4.6 both depends_on T4.2 while T4.2 cannot function without their substance."
  - "docs/contracts/work-item-routing.yaml states, as a rule and not an example list, what becomes a tier item, what becomes a rec, and what becomes neither."
  - "The substrate is recorded as a CANDIDATE. No roadmap field asserts a selected layer-2 substrate, because the spike has not run."
  - "A tier item OWNS the layer-2 substrate spike, sequenced after this encoding, keeping the decision_scout stub-persona shape."
  - "CD.27's ESB-04 / ESB-06 / ESB-01 preconditions still name a resolving instrument that exists."
  - "A candidate decision rules EXPLICITLY on GOV-1, by compute reclassification -- Step Functions remains the sole Decision-39-compliant orchestration primitive and layer 2 performs no orchestration -- and NOT by asserting GitHub Actions is itself an orchestration primitive."
  - "T4.2's substrate re-specification reaches exit_criteria, files_in_scope and decomposition_hints, not intent alone."
  - "No T4.2 exit criterion greps a path that the candidate substrate makes empty, so no criterion can pass vacuously."
  - "Every stale-substrate sibling is swept: CD.38's topology assertion, CD.17's stability definition, CD.21, CD.37, T4.10, T5.6, G.9's gate name."
  - "Reverse dependency edges exist: items that cannot run without the new items name them in depends_on."
  - "Every GOV/MECH/DATA/OPS identifier resolves to a lifecycle-tracked field (exit_criteria) or a candidate-decision body -- not to intent prose alone."
  - "The dossier's 'Also unspecified' entries each resolve to a tier item, a rec id, or an explicit not-now with a reason."
  - "Out-of-file repairs are filed as recommendations through the ops portal and referenced by id from the roadmap."
  - "A diff-path guard exit criterion exists covering .github/workflows/** and the Decision 117 boundary patterns at the merge node."
  - "The roadmap stays under the 10,000-line ceiling."

verification_plan:
  - step: 1
    phase: pre-deploy
    action: Full presubmit tier. Schema, dependency graph, contract conformance and placement all gate here.
    command: bin/venv-python -m scripts.validate
    expected: "Exit 0, `All checks passed`."
    fix_if: >-
      A timeout is timeout_disposition blocked: resume the named check and rerun the full tier from
      the start rather than reporting a partial pass.
    hermetic: false
    graduation: not-applicable
  - step: 2
    phase: pre-deploy
    action: >-
      DECISION 87 IS AMENDED AND THE AMENDMENT INVERTS THE ORDERING. The whole reconciliation rests
      on this one edit, so it is asserted by content and not by presence.
    command: >-
      bin/venv-python -c "import re,pathlib; t=pathlib.Path('docs/DECISIONS.md').read_text(encoding='utf-8');
      m=re.search(r'^## Decision 87:.*?(?=^## Decision |\Z)', t, re.M|re.S); assert m, 'Decision 87 missing';
      b=m.group(0); assert re.search(r'[Aa]mendment', b), 'no amendment marker on Decision 87'; assert
      re.search(r'prerequisite', b, re.I), 'the amendment does not state the prerequisite inversion'; assert
      re.search(r'T4\.5', b) and re.search(r'T4\.6', b), 'the amendment does not name the items whose ordering it
      corrects'; assert re.search(r'circular', b, re.I), 'the amendment does not name the circularity it breaks';
      print('OK Decision 87 amended,', len(b.encode()), 'bytes (forward-only cap: not re-measured)')"
    expected: >-
      Exits 0 printing `OK Decision 87 amended,` and a byte count. On origin/main it exits 1 with `no
      amendment marker on Decision 87`.
    fix_if: >-
      Do NOT satisfy this by adding the word prerequisite. The amendment must say WHICH ordering
      inverts and WHY -- that plan_agent cannot function before the flip, so the flip precedes the
      producer rather than following it.
    hermetic: true
    graduation: waive
    graduation_waiver_reason: >-
      Asserts one Decision's amendment text; graduating it would pin one entry's wording into the
      permanent suite forever.
  - step: 3
    phase: pre-deploy
    action: >-
      NOTHING SELECTS A SUBSTRATE. This plan encodes a candidate; the spike selects. The failure mode
      is an encoding that quietly pre-empts the instrument it is sequencing, so the assertion is
      inverted -- it fails if a selection APPEARS.
    command: >-
      bin/venv-python -c "import yaml,pathlib,re; raw=pathlib.Path('docs/ROADMAP-PLATFORM.yaml').read_text();
      d=yaml.safe_load(raw); cds={c['id']: c for c in d['candidate_decisions']}; c43=str(cds['CD.43'].get('detail',''));
      assert 'TBD_at_CD.43_ratification' in c43, 'CD.43 no longer defers -- the spike selects the store, not this
      plan'; assert re.search(r'criteria_only', c43), 'CD.43 lost its criteria-only discipline'; spike=[t for t in
      d['tier_items'] if re.search(r'spike', str(t.get('name','')), re.I) and t['id'].startswith('T4.')]; assert spike,
      'no tier item owns the layer-2 substrate spike'; assert all(t['status']=='not_started' for t in spike), 'the
      spike item is not live'; print('OK no selection recorded; spike owned by', [t['id'] for t in spike])"
    expected: >-
      Exits 0 printing `OK no selection recorded; spike owned by ['T4.NN']`. On origin/main it exits 1
      with `no tier item owns the layer-2 substrate spike`.
    fix_if: >-
      If CD.43's deferral marker was removed, the encoding has selected the workspace store and
      pre-empted the spike. Restore it. The store is chosen by the instrument CD.27's ESB-01
      precondition names, not by this plan.
    hermetic: true
    graduation: waive
    graduation_waiver_reason: >-
      Transient: asserts the pre-spike state of two candidate decisions, which the spike itself
      changes the moment it runs.
  - step: 4
    phase: pre-deploy
    action: >-
      THE SUBSTRATE SWEEP, and the step the previous round of this plan failed. The re-specification
      must reach the fields agents consume -- exit_criteria, files_in_scope, decomposition_hints --
      not intent alone. Asserted over the whole T4 tier as a class, not at the two sites that were
      reported.
    command: >-
      bin/venv-python -c "import yaml,pathlib,re; d=yaml.safe_load(pathlib.Path('docs/ROADMAP-PLATFORM.yaml').read_text());
      t={x['id']: x for x in d['tier_items']}; dur=re.compile(r'[Dd]urable [Ff]unction'); persona_lambda=re.compile(r'src/lambdas/(plan_agent|plan_critic|decision_scout|implement_agent|code_reviewer)');
      hits={i: [k for k in ('exit_criteria','files_in_scope','decomposition_hints') if dur.search(str(x.get(k,'')))
      or persona_lambda.search(str(x.get(k,'')))] for i, x in t.items() if i.startswith('T4.')}; bad={i: v for i, v in
      hits.items() if v}; assert not bad, f'stale persona-substrate references survive in lifecycle-tracked fields:
      {bad}'; vac=[c for c in (t['T4.2'].get('exit_criteria') or []) if 'src/lambdas' in str(c)]; assert not vac,
      f'T4.2 criteria still grep a path the candidate substrate empties (would pass vacuously): {[str(c)[:60] for c in
      vac]}'; print('OK no stale substrate in exit_criteria/files_in_scope/decomposition_hints across', len([i for i in
      t if i.startswith('T4.')]), 'T4 items')"
    expected: >-
      Exits 0 printing `OK no stale substrate in ...` and the T4 item count. On origin/main it exits 1
      listing T4.2 and T4.10 among others.
    fix_if: >-
      This is the class-versus-site defect that blocked the previous round. Rewriting intent while
      leaving files_in_scope pointing at five src/lambdas persona directories is exactly the failure
      -- the planning skill and Decision 79 per-Lambda gating key on files_in_scope, not on prose.
    hermetic: true
    graduation: waive
    graduation_waiver_reason: >-
      The property is durable but its subject is one substrate transition; once the spike selects,
      the forbidden vocabulary changes and a registry row would assert the wrong thing forever.
  - step: 5
    phase: pre-deploy
    action: >-
      STALE-SUBSTRATE SWEEP ACROSS THE GOVERNANCE SURFACE. Five candidate decisions and one gate
      assert the incumbent as settled fact. Each must either point through the narrowed CD.27 or be
      amended; none may be left asserting a topology the candidate contradicts.
    command: >-
      bin/venv-python -c "import yaml,pathlib,re; raw=pathlib.Path('docs/ROADMAP-PLATFORM.yaml').read_text();
      d=yaml.safe_load(raw); need={'CD.38': r'persona cognition', 'CD.17': r'unplanned_resume_rate', 'G.9':
      r'Durable Functions'}; cds={c['id']: str(c) for c in d['candidate_decisions']}; gates={g['id']: str(g) for g in
      d['cross_tier_gates']}; blob={**cds, **gates}; unswept=[k for k, pat in need.items() if k in blob and
      re.search(pat, blob[k]) and not re.search(r'(CD\.4[4-9]|two-plane|candidate substrate)', blob[k])]; assert not
      unswept, f'governance surfaces still assert the incumbent with no pointer to the candidate: {unswept}';
      print('OK CD.38 / CD.17 / G.9 each swept or pointered')"
    expected: >-
      Exits 0 printing `OK CD.38 / CD.17 / G.9 each swept or pointered`. On origin/main it exits 1
      listing all three.
    fix_if: >-
      CD.38 states the plane split backwards ("AWS owns ... persona cognition (Durable Lambdas)") and
      it GATES T4.9a, which is live and MVP. CD.17's stability signal is unplanned_resume_rate, which
      has no referent on a substrate where nothing resumes. G.9's own history records a rename at the
      last substrate pivot -- repeating that omission is the defect, not the rename.
    hermetic: true
    graduation: waive
    graduation_waiver_reason: >-
      Names three specific surfaces mid-transition; the set changes as soon as the spike rules.
  - step: 6
    phase: pre-deploy
    action: >-
      REVERSE DEPENDENCY EDGES. The previous round mapped only forward, reproducing EXR-03 -- the
      defect it quoted. An item that cannot run without a new item must NAME it in depends_on, because
      the eligibility engine reads depends_on and nothing else.
    command: >-
      bin/venv-python -c "import yaml,pathlib,re; d=yaml.safe_load(pathlib.Path('docs/ROADMAP-PLATFORM.yaml').read_text());
      t={x['id']: x for x in d['tier_items']}; new=sorted(i for i in t if re.fullmatch(r'T4\.1[5-9]', i)); assert new,
      'no new T4 items found'; consumers=[i for i in ('T4.2',) if i in t]; missing={c: [n for n in new if n not in
      (t[c].get('depends_on') or [])] for c in consumers}; unmapped={c: v for c, v in missing.items() if len(v)==len(new)};
      assert not unmapped, f'consumers name no new item in depends_on -- the coupling binds invisibly (EXR-03):
      {unmapped}'; deferred={i: [x for x in (t[i].get('depends_on') or []) if t.get(x,{}).get('status')=='deferred_post_mvp']
      for i in new}; deferred={i: v for i, v in deferred.items() if v}; assert not deferred, f'new live items depend on
      deferred items (Decision 93): {deferred}'; print('OK new items', new, '| T4.2 depends_on', t['T4.2'].get('depends_on'))"
    expected: >-
      Exits 0 printing `OK new items [...] | T4.2 depends_on [...]` with at least one new item named.
      On origin/main it exits 1 with `no new T4 items found`.
    fix_if: >-
      A prose coupling ("MUST conform", "author before T4.2") is invisible to the validator. If a new
      item genuinely needs a deferred item's output, slice the deferred item instead -- the a-suffix
      pattern exists for exactly this.
    hermetic: true
    graduation: waive
    graduation_waiver_reason: >-
      Pins specific item ids from one encoding pass; the next roadmap edit renumbers them.
  - step: 7
    phase: pre-deploy
    action: >-
      EVERY DESIGN IDENTIFIER LANDS IN A LIFECYCLE-TRACKED FIELD. The previous round asserted only
      presence anywhere in the item, including intent and progress_note -- necessary but not
      sufficient, because prose carries no open/met status and no closure. This asserts placement.
    command: >-
      bin/venv-python -c "import yaml,pathlib; raw=pathlib.Path('docs/ROADMAP-PLATFORM.yaml').read_text();
      ids=[f'GOV-{i}' for i in (1,2,3)]+[f'MECH-{i}' for i in (1,2,3,4)]+[f'DATA-{i}' for i in (1,2,3,4)]+[f'OPS-{i}'
      for i in (1,2,3,4,5,6)]; absent=[i for i in ids if i not in raw]; assert not absent, f'design identifiers absent
      from the roadmap entirely: {absent}'; d=yaml.safe_load(raw); tracked=[(x['id'], str(x.get('exit_criteria','')))
      for x in d['tier_items']]+[(c['id'], str(c.get('detail',''))) for c in d['candidate_decisions']]; blob={i:
      [eid for eid, s in tracked if i in s] for i in ids}; prose_only=sorted(i for i, v in blob.items() if not v);
      assert not prose_only, f'identifiers present only in intent/note prose, with no exit criterion or candidate-decision
      body to track them: {prose_only}'; print('OK all', len(ids), 'identifiers in lifecycle-tracked fields:', {i: v for
      i, v in sorted(blob.items())})"
    expected: >-
      Exits 0 printing `OK all 17 identifiers in lifecycle-tracked fields:` and the map. On origin/main
      it exits 1 with every identifier absent.
    fix_if: >-
      An identifier in intent prose fails deliberately. Intent is read at plan time but has no owner,
      no status and no closure -- an open question parked there is not tracked, it is mentioned.
    hermetic: true
    graduation: waive
    graduation_waiver_reason: >-
      The identifier set belongs to one design artifact; the next design would have to amend a
      graduated row.
  - step: 8
    phase: pre-deploy
    action: >-
      OUT-OF-FILE REPAIRS ARE FILED AS RECS AND REFERENCED BY ID. The previous round parked them in
      known_gaps, which has no runtime reader. The routing contract now states the rule; this asserts
      it was followed.
    command: >-
      bin/venv-python -c "import yaml,pathlib,re; raw=pathlib.Path('docs/ROADMAP-PLATFORM.yaml').read_text();
      c=yaml.safe_load(pathlib.Path('docs/contracts/work-item-routing.yaml').read_text()); assert c.get('routing_rule')
      or (c.get('routing') or {}).get('rule'), 'work-item-routing.yaml states no routing rule'; rows=str(c); assert
      'recommendation' in rows and 'tier_item' in rows, 'the contract does not name both destinations'; refs=set(re.findall(r'rec-\d+',
      raw)); assert refs, 'no rec ids referenced from the roadmap -- out-of-file repairs were not filed'; print('OK
      routing contract present;', len(refs), 'rec ids referenced from the roadmap:', sorted(refs))"
    expected: >-
      Exits 0 printing `OK routing contract present; N rec ids referenced from the roadmap:` and the
      ids. On origin/main it exits 1 -- the contract does not exist.
    fix_if: >-
      A known_gaps entry is not a substitute. Verified: nothing in scripts/, src/ or .claude/ reads
      open_questions or known_gaps except the Pydantic schema, and OQ.1/OQ.2 sat resolved on disk for
      weeks until an audit reconciled them.
    hermetic: true
    graduation: waive
    graduation_waiver_reason: >-
      Asserts this encoding's own filing discipline; the rec ids are transient.
  - step: 9
    phase: pre-deploy
    action: >-
      THE MERGE-NODE DIFF GUARD EXISTS. ci.yml runs on pull_request, so for a same-repo branch it runs
      the branch's own version of itself -- an implement_agent that edits .github/workflows/ci.yml
      alters the oracle judging it. Decision 117 gates which recs are ADMITTED, never what the agent
      WRITES once admitted.
    command: >-
      bin/venv-python -c "import yaml,pathlib,re; d=yaml.safe_load(pathlib.Path('docs/ROADMAP-PLATFORM.yaml').read_text());
      t4=[x for x in d['tier_items'] if x['id'].startswith('T4.')]; guard=[x['id'] for x in t4 if re.search(r'\.github/workflows',
      str(x.get('exit_criteria',''))) and re.search(r'\bdiff\b', str(x.get('exit_criteria','')), re.I) and
      re.search(r'(merge node|at merge|boundary_patterns|Decision 117)', str(x.get('exit_criteria','')), re.I)];
      assert guard, 'no T4 item carries a merge-node diff-path guard naming both .github/workflows and the Decision 117
      boundary surface -- a guard elsewhere in the roadmap does not cover the executor merge leg'; print('OK merge-node
      diff guard owned by', guard)"
    expected: >-
      Exits 0 printing `OK merge-node diff guard owned by ['T4.NN']`. On origin/main it exits 1 with
      `no diff-path guard recorded`.
    fix_if: >-
      The guard belongs on the AWS side, at the merge node, pinned to the head SHA the callback
      already verified -- that is the plane the agent cannot edit through its own merge loop, which is
      the property the two-plane split exists to provide.
    hermetic: true
    graduation: waive
    graduation_waiver_reason: >-
      Transient placement of one control; it moves when the spike rules on the substrate.
  - step: 10
    phase: pre-deploy
    action: The line ceiling survives, re-measured rather than quoted from a stale draft.
    command: >-
      bin/venv-python -c "import pathlib; n=len(pathlib.Path('docs/ROADMAP-PLATFORM.yaml').read_text().splitlines());
      assert n <= 10000, f'roadmap is {n} lines, over the Decision 114 ceiling of 10000'; print(f'OK roadmap {n} lines,
      {10000-n} of headroom remaining')"
    expected: >-
      Exits 0 printing `OK roadmap N lines, M of headroom remaining`. Passes on origin/main too
      (8,616) -- a regression guard on the delta's size, not a differential.
    fix_if: >-
      Do NOT raise the ceiling. Decision 114 owns that number. Compress, or move content to a rec per
      the routing contract -- which is one of the reasons that contract exists.
    hermetic: true
    graduation: waive
    graduation_waiver_reason: >-
      validate_platform_roadmap already enforces this ceiling; a registry row would be a second reader
      of one limit.

test_obligations:
  - source: docs/ROADMAP-PLATFORM.yaml
    behavior: >-
      Schema-valid, no dangling depends_on, no cycles, no live-to-deferred edges, within the line
      ceiling, and no stale-substrate references in lifecycle-tracked fields.
    verification_step: 1
    command: bin/venv-python -m scripts.validate
    waiver_reason: >-
      The roadmap is DATA. Its schema, dependency graph, MVP-boundary edges and line ceiling are owned
      by validate_platform_roadmap and the Decision 93 validator, both standing checks. Steps 3-7 and
      10 assert this plan's specific deltas mechanically from the parsed document. A bespoke test
      would pin one encoding pass into the permanent suite.
  - source: docs/DECISIONS.md
    behavior: "Decision 87 carries an amendment inverting the plan-authority ordering to a prerequisite."
    verification_step: 1
    command: bin/venv-python -m scripts.validate
    waiver_reason: >-
      Decision entries are prose governed by validate_decisions_size, the category-consistency check
      and validate_decision_entry_conformance, all standing guards. Verification step 2 asserts the
      amendment's four required elements by name.
  - source: docs/contracts/work-item-routing.yaml
    behavior: "States which work becomes a tier item, which becomes a recommendation, and which becomes neither."
    verification_step: 8
    command: >-
      bin/venv-python -c "import yaml,pathlib,re; raw=pathlib.Path('docs/ROADMAP-PLATFORM.yaml').read_text();
      c=yaml.safe_load(pathlib.Path('docs/contracts/work-item-routing.yaml').read_text()); assert c.get('routing_rule')
      or (c.get('routing') or {}).get('rule'), 'work-item-routing.yaml states no routing rule'; rows=str(c); assert
      'recommendation' in rows and 'tier_item' in rows, 'the contract does not name both destinations'; refs=set(re.findall(r'rec-\d+',
      raw)); assert refs, 'no rec ids referenced from the roadmap -- out-of-file repairs were not filed'; print('OK
      routing contract present;', len(refs), 'rec ids referenced from the roadmap:', sorted(refs))"
    red_green_expectation: >-
      Red before the contract exists (file-not-found) and red while the roadmap references no rec id;
      green once the contract states the rule and the out-of-file repairs are filed and referenced.
  - source: docs/contracts/file-router.yaml
    behavior: "The new contract is registered for discovery and its target resolves."
    verification_step: 1
    command: bin/venv-python -m scripts.validate
    waiver_reason: >-
      validate_placement is a standing check that already fails the build if any file-router target
      does not resolve to a git-tracked path, and rejects duplicate topics. A bespoke test would
      assert what that gate asserts on every PR.

constraints:
  - >-
    THIS PLAN SELECTS NO SUBSTRATE. The decision_scout stub-persona spike does, after this encoding.
    An earlier draft retired the spike by reasoning and thereby broke CD.27: ESB-04, ESB-06 and
    ESB-01 all name that spike as the resolving instrument, and every declared precondition requires
    discharge, so deleting the instrument makes the CD formally unratifiable. Record the two-plane
    design as a CANDIDATE. Leave CD.43 criteria-only. VP step 3 fails if a selection appears.
  - >-
    AMEND DECISION 87 RATHER THAN WORKING AROUND IT. Its clause 2 times the plan-authority flip to
    the autonomous producer's existence; the design makes that circular, because the producer cannot
    function until the flip's substance exists and both flip items depends_on the producer. The
    amendment inverts it: warehouse-resident plans are a PREREQUISITE. Do not instead declare the
    flip already fired, re-scope T4.5, or defer the plan-fetch -- all three were considered and are
    patches around a cycle rather than a correction of it.
  - >-
    THE WAREHOUSE READ STAYS; S3-PRIMARY IS REJECTED. ops_execution_plans carries plan_text and steps
    -- the plan body is IN the table, not pointed at from it. A separate S3 document would be a second
    copy to keep in sync and a second agent-facing read path. DuckLake's catalog is metadata over
    Parquet already in S3, so reading by named verb IS reading S3; the choice was never warehouse
    versus S3, it was one copy behind one boundary versus two copies. The residual Neon cold-resume
    concern is real and is answered on the read path by the retry posture writer_transport.py already
    proves on the write side.
  - >-
    RULE GOV-1 BY COMPUTE RECLASSIFICATION, NOT BY ORCHESTRATOR EQUIVALENCE. ESB-04 requires a
    MANAGED orchestration primitive. The admissible argument: Step Functions remains the sole
    orchestration primitive and is Decision-39-compliant; layer 2 under this candidate performs no
    orchestration at all, since there are no checkpoints and no replay. The INADMISSIBLE argument is
    "GitHub Actions is itself a managed orchestration primitive" -- defensible in isolation, but it
    concedes two orchestrators and displaces Decision 39 by implication.
  - >-
    SWEEP THE CLASS, NOT THE SITE. The previous round rewrote T4.2's intent and left its exit_criteria,
    files_in_scope and decomposition_hints asserting Durable Functions, with a verification step that
    grepped intent only. Every substrate edit must reach the lifecycle-tracked fields, and the sweep
    extends to CD.38, CD.17's stability definition, CD.21, CD.37, T4.10, T5.6 and G.9's name.
  - >-
    RECS FOR REPAIRS, TIER ITEMS FOR SEQUENCING. open_questions and known_gaps have no runtime reader
    -- verified across scripts/, src/ and .claude/. File discrete out-of-file defects through the ops
    portal and reference them by id. This is also the line-budget lever: a rec id costs one token
    where a paragraph costs twenty, against 1,384 lines of headroom.
  - >-
    ONE NEW MECHANISM, DECLARED. work-item-routing.yaml is the only thing this plan adds. Everything
    else amends, sweeps, routes or files. If a reviewer finds a second new mechanism, treat it as a
    defect -- the diagnosed recurrence engine here is remediate-by-adding-mechanism.
  - >-
    DO NOT TOUCH THE FROZEN EXECUTOR. scripts/executor/ is Life 1, retained as a reference corpus and
    retiring by deletion. Its defects are evidence, not a work queue. Roadmap-side only: T3.10's
    sequencing note, and the identically-shaped siblings the previous round missed -- T4.9a and T4.8
    both declare NEW files inside that frozen tree.
  - >-
    V2, AND THE FLOOR IS ARGUED. No .tf, no Lambda artifact, no deployed resource. Two YAML documents,
    one markdown amendment, and portal calls. The deterministic V-tier floor keys on resource-affecting
    scope and this does not reach it; V2 is claimed because every VP step is a real command over
    parsed documents.

context:
  - >-
    THE DESIGN -- REQUIRED READING, IN FULL:
    https://claude.ai/code/artifact/a591749c-cc12-4b5e-b582-ac03595e04dc ("Two-Plane Executor"). The
    operator's own work. Step Functions keeps the state machine and carries IDENTIFIERS ONLY; GitHub
    Actions runs every persona and every verification gate, all LiteLLM in-process; the plan artifact
    lives in ops_execution_plans and is fetched by named verb. Governing rule: "Step Functions passes
    identifiers and permissions. Agents fetch content." Its open register is GOV-1..3, MECH-1..4,
    DATA-1..4, OPS-1..6.
  - >-
    THE DOSSIER -- the second required reading:
    https://claude.ai/code/artifact/a290d222-4200-4f2e-a74c-2f9cf07c370f. Two systems share the name
    "executor": Life 1, frozen at ~10,300 SLOC and retiring by deletion, and Life 2, the CD.27/CD.28
    design with zero of sixteen T4 items started. It is explicitly not authoritative over the roadmap
    -- which is why its claims need encoding HERE to bind.
  - >-
    WHY DECISION 87 IS AMENDED RATHER THAN WORKED AROUND. Decision 87 clause 2: the git-to-warehouse
    plan authority flip is "TIMED to the existence of the autonomous plan producer." T4.5 builds the
    entities and is deferred because "no warehouse consumer of plans exists until the T4.6 loop";
    T4.6 performs the flip; both depends_on T4.2. Under the two-plane design plan_agent cannot
    function until its plan is warehouse-readable -- so the producer needs the flip and the flip needs
    the producer. That is a cycle, not a sequencing preference. Three patches were considered and
    rejected: declaring the flip already fired (leaves the roadmap asserting a deferral reason that
    has expired), re-scoping ops_execution_plans as "not really plans" (contradicted by plan_text
    sitting in the table), and deferring the plan-fetch (blocks MVP outright). The operator's
    correction is the only one that removes the cycle: warehouse-resident plans are a PREREQUISITE.
  - >-
    THE RBAC GAP THE AMENDMENT MUST NOT LOSE. Decision 87 clause 5 specifies verb-level RBAC --
    planning personas get insert_plan and cannot mutate status; critique personas get set_plan_status
    and insert_revision and cannot author plan bodies. The design has one verb, save_execution_plan,
    with no split, so nothing structurally stops plan_critic writing plan bodies or plan_agent
    approving its own plan. That is the shape of a recorded Life 1 defect: _detect_critique_cycling
    auto-APPROVED a plan the critic never approved. The amendment inverts the ordering; it must also
    carry the RBAC obligation forward to whichever item now precedes T4.2, or the inversion trades a
    cycle for a safety hole.
  - >-
    WHAT THE THREE-LENS REVIEW FOUND, and what changed because of it. Design merit returned
    SOUND_WITH_RESERVATIONS; placement and consistency both returned BLOCK, twelve blocking findings
    between them. Two lenses independently found the same defect from opposite directions: the
    substrate change landed in intent while the lifecycle-tracked fields kept Durable Functions, and
    the verification was blind to it. Consistency then swept the class properly -- CD.38 states the
    plane split backwards and GATES T4.9a; CD.17's stability signal has no referent on a non-replay
    substrate. Design merit contributed one hole neither the design nor the encoding had: ci.yml runs
    on pull_request, so a same-repo branch runs its own version of the workflow, and an implement_agent
    can edit the oracle that judges it.
  - >-
    THREE DEFECTS IN THE PREVIOUS ROUND, CORRECTED HERE AND NAMED SO THEY ARE NOT RE-INTRODUCED. The
    line count was quoted as 8,610 from before a rebase when the file was already 8,616 -- the same
    stale-figure class this run produced twice before, and the checklist's own "main moves" warning
    did not prevent it. A slug assertion was vacuous because T4.1's intent already contained
    branch_slug. And a GOV-1 check asserted on the FIRST candidate decision mentioning GOV-1, which
    may not be the one that rules.
  - >-
    WHAT THIS PLAN DELIBERATELY DOES NOT DO. It does not select a substrate, ratify CD.27/CD.28/the
    new candidate, or build anything. It does not resolve MECH-1's credential model or MECH-3's
    continuation mechanism -- it gives them owners. It does not fix AGENTS.md's ops_execution_plans
    backend claim, the missing NAMED_READS verb, the contract vocabulary skew or the boundary-pattern
    drift; all four are FILED AS RECS and referenced by id, which is what the routing contract exists
    to make routine. And it does not touch the frozen Life-1 executor.

