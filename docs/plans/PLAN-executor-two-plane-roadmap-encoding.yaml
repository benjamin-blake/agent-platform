rollback: >-
  Four files and a set of portal writes. The YAML documents, the Decision 87 amendment and the
  regenerated index revert cleanly with `git revert`; nothing is deployed, no table changes, and this
  plan graduates nothing. The filed recommendations do NOT revert with the commit -- they are
  warehouse rows, and the correct undo is `--update-rec <id> --status declined` with a resolution
  naming this rollback, never a direct edit to the read cache. Two things should survive a revert
  rather than being lost with it: the Decision 87 residency amendment, because the circularity it
  corrects is real whether or not this encoding lands, and the decision-entry routing row, because it
  is a general rule that outlives this design and serves the rec-supersedes-roadmap direction. A
  THIRD survives on the same grounds: the Decision 87 clause-4 consolidation onto one plans table.
  The two-table split describes entities that were never built, so reverting the consolidation would
  restore a proposal for two tables where one live table already does the work -- the correction is
  true whether or not the two-plane encoding lands. Its revert cost is likewise nil: with the table
  empty until CD.17 reversal, no rows, no verbs and no contract entries move either way. The
  decision-entry.yaml amendment_log entry reverts with its file and needs no separate handling. If
  the encoding is abandoned, re-home all three rather than reverting them.
