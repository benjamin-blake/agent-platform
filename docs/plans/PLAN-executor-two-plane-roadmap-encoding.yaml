schema_version: 4
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: "executor-two-plane-roadmap-encoding"
intent: >-
  Encode the operator's Two-Plane Executor design into the platform roadmap; amend Decision 87 to
  break the plan-residency circularity the design exposes; and complete decision-entry.yaml's routing
  table with the missing work-item row, so a roadmap entry can carry a rec id instead of a paragraph.
  The design stays in its hosted artifact (Decision 86). This plan selects NO substrate -- the
  decision_scout spike does that, after this encoding, and this is what gives it a properly-specified
  candidate to test.
plan_type: IMPLEMENTATION
verification_tier: V2
plan_path: docs/plans/PLAN-executor-two-plane-roadmap-encoding.yaml
phase: >-
  Platform T4 (executor). Roadmap-and-governance precursor to T4.1/T4.2 and to the layer-2 substrate
  spike, which this plan gives an owner and sequences after itself.

fallback_reevaluation:
  reevaluated_on: "2026-08-18"
  substrate_status: >-
    CD.27's layer-2 incumbent remains the incumbent. This plan records the two-plane design as a
    CANDIDATE and selects nothing. The decision_scout spike -- named as the resolving instrument by
    CD.27's own ESB-04, ESB-06 and ESB-01 preconditions -- has not run.
  verdict: continue_on_current_substrate
  basis: >-
    An earlier draft recorded obligation_lapsed while also retiring the spike. That was doubly wrong:
    the lapse_condition fires only "if wave 5's Q5 spike pins a layer-2 substrate", so the claim
    rested on a trigger whose instrument the same plan deleted, and CD.27 would have become formally
    unratifiable because every declared precondition requires discharge. The spike is kept and owned.
    Until it runs, the incumbent stands and no obligation lapses.

scope:
  - file: docs/ROADMAP-PLATFORM.yaml
    action: Modify
    purpose: >-
      The encoding. Records the two-plane design as a CANDIDATE (no selection anywhere); gives the
      layer-2 spike an owning tier item sequenced before T4.2; adds the MVP-critical items the design
      needs with reverse dependency edges; routes the design's open register onto exit_criteria; and
      sweeps the stale-substrate class across every sibling site in lifecycle-tracked fields. Also
      amends T4.5 and T4.6, whose intents restate the Decision 87 clause this plan corrects -- round 2
      amended the Decision and left the items contradicting it. Line budget: 8,616 of 10,000.
  - file: docs/DECISIONS.md
    action: Modify
    purpose: >-
      AMEND DECISION 87, SCOPED TO RESIDENCY. Clause 2 times the git-to-warehouse flip to the
      autonomous producer's existence; the producer cannot function until its plans are
      warehouse-readable, so residency and producer are circular. The amendment makes warehouse
      RESIDENCY of executor plans a prerequisite for T4.2 -- and explicitly leaves the AUTHORITY flip
      for the human PLAN-*.yaml surface timed to T4.6. Round 2 conflated the two; a wholesale
      inversion would supersede Decision 85's git-authoritative clause pre-producer and break diff
      review of human plans for no gain. Executor plans are born warehouse-native and never had a git
      life, so there is nothing to flip for them.
  - file: docs/contracts/decision-entry.yaml
    action: Modify
    purpose: >-
      COMPLETE THE ROUTING TABLE rather than add a second router. significance.routing already carries
      four rows deciding where content goes -- numbered_decision, cd_state_flip, operational_fact,
      field_semantics -- and operational_fact already routes to "a recommendation via file_rec, or a
      tier_item progress_note". The gap is a row for durable sequencing work. Round 2 proposed a
      standalone contract, which cannot land: Decision 168 retired none_grandfathered, every new
      depth-1 contract needs a RESOLVING evaluator, and no in-scope surface could serve as one --
      declaring a check would have been a second new mechanism. Extending this file inherits its
      working evaluator (validate_decision_entry_conformance) and removes the two-routers
      contradiction in the same edit.
  - file: docs/decisions-index.json
    action: Modify
    purpose: >-
      Regenerate. Amending Decision 87 stales the committed index and
      validate_decisions_index_freshness fails on drift. Mechanical consequence of the amendment, not
      a separate change.

bundled_recommendations: []
closes_criteria: []

infrastructure_dependencies:
  - >-
    Ops-portal reachability for the recommendation filings in execution steps 14-15. Portal calls,
    not file edits -- which is why single-file scope never excused parking out-of-file repairs in an
    unread register. A write that cannot complete FAILS LOUD; there is no offline outbox.

acceptance_criteria:
  - "Decision 87's amendment scopes the inversion to RESIDENCY and states that the AUTHORITY flip for the human planning surface stays timed to T4.6."
  - "T4.5 and T4.6's own intents are amended to match -- round 2 amended the Decision and left the items restating the superseded clause."
  - "decision-entry.yaml's significance.routing gains a work-item row, and the routing_rule's question set is extended to reach it."
  - "The routing row states the migration direction: recommendations are the destination form, the roadmap is the bootstrap, and the row names what the roadmap uniquely provides TODAY so the boundary moves as recs gain those capabilities."
  - "The routing table resolves 'deliberate deferral with a reason' -- round 2's three buckets could not, while the plan's own acceptance criteria required it."
  - "No roadmap field asserts a selected layer-2 substrate."
  - "A tier item owns the layer-2 spike, and CD.27's precondition text names that item's id, so ESB-04 / ESB-06 / ESB-01 can discharge against something that exists."
  - "The spike's exit criteria require a workspace-mutating leg and an unstubbed dispatch credential on the candidate arm."
  - "Lifecycle-tracked T4 fields carry CD.27's substrate-neutral P1/P2/P3 property language; candidate-specific mechanism is confined to the candidate decision body."
  - "The stale-substrate sweep detects every declared site, including the 'Durable Lambdas' phrasing and the name and intent fields, not only exit_criteria."
  - "The verb-RBAC obligation names its carrying item and lands as an exit criterion; a content pin is the MVP-side guarantee and the verb split routes to T4.5/T4.6."
  - "The read verb's spec requires pinning a writer-minted id or content hash, because merge_key is rec_id alone and a re-dispatched writer can emit the same revision twice."
  - "The dossier's eight 'Also unspecified' entries each resolve to a tier item, a rec id, or a recorded deferral."
  - "Every GOV/MECH/DATA/OPS identifier resolves to a lifecycle-tracked field, not intent prose."
  - "Newly filed rec ids are referenced from the roadmap -- asserted against origin/main's set, not against a non-empty count."
  - "A merge-node diff-path guard covers .github/workflows/** and the Decision 117 boundary patterns."
  - "The roadmap stays under the 10,000-line ceiling."

verification_plan:
  - step: 1
    phase: pre-deploy
    action: Full presubmit tier. Schema, dependency graph, contract conformance, decisions index and placement all gate here.
    command: bin/venv-python -m scripts.validate
    expected: "Exit 0, `All checks passed`."
    fix_if: >-
      A stale docs/decisions-index.json fails validate_decisions_index_freshness with a regenerate
      hint. A timeout is timeout_disposition blocked: resume the named check and rerun from the start.
    hermetic: false
    graduation: not-applicable
  - step: 2
    phase: pre-deploy
    action: >-
      THE AMENDMENT IS RESIDENCY-SCOPED. Round 2's assertion used markers already present in Decision
      87 (sixteen `[Amendment` markers exist, and `T4.5` already appears in Related), so two of its
      four legs were dead. This asserts only what is genuinely new, and asserts the SCOPE, because a
      wholesale inversion would supersede Decision 85's git clause pre-producer.
    command: >-
      bin/venv-python -c "import re,pathlib; t=pathlib.Path('docs/DECISIONS.md').read_text(encoding='utf-8');
      m=re.search(r'^## Decision 87:.*?(?=^## Decision |\Z)', t, re.M|re.S); assert m, 'Decision 87 missing';
      b=m.group(0); assert re.search(r'residenc', b, re.I), 'the amendment does not scope the inversion to residency';
      assert re.search(r'prerequisite', b, re.I), 'the amendment does not state the prerequisite'; assert
      re.search(r'authority', b, re.I) and re.search(r'T4\.6', b), 'the amendment does not state that the AUTHORITY
      flip stays timed to T4.6'; assert re.search(r'circular', b, re.I), 'the amendment does not name the circularity';
      print('OK Decision 87 residency-scoped,', len(b.encode()), 'bytes')"
    expected: >-
      Exits 0 printing `OK Decision 87 residency-scoped,` and a byte count. On origin/main it exits 1
      on the FIRST leg (`residenc` absent) -- verified, not assumed.
    fix_if: >-
      If the amendment inverts wholesale, human PLAN-*.yaml lose diff review for nothing. Executor
      plans are born warehouse-native; there is nothing to flip for them.
    hermetic: true
    graduation: waive
    graduation_waiver_reason: "Asserts one Decision's amendment text; graduating it pins one entry's wording forever."
  - step: 3
    phase: pre-deploy
    action: >-
      T4.5 AND T4.6 MOVE WITH THE DECISION. Round 2 amended the corpus and left the items restating
      the superseded clause -- T4.5's intent still ends "no warehouse consumer of plans exists until
      the T4.6 loop", the exact sentence this design falsifies.
    command: >-
      bin/venv-python -c "import yaml,pathlib,re; d=yaml.safe_load(pathlib.Path('docs/ROADMAP-PLATFORM.yaml').read_text());
      t={x['id']: x for x in d['tier_items']}; t45=str(t['T4.5'].get('intent','')); t46=str(t['T4.6'].get('intent',''));
      assert not re.search(r'no warehouse\\s+consumer of plans exists', t45), 'T4.5 still carries the deferral rationale
      this design falsifies'; assert re.search(r'(residenc|amended|Decision 87 as amended)', t45+t46, re.I), 'neither
      T4.5 nor T4.6 acknowledges the amended clause'; print('OK T4.5/T4.6 moved with the Decision')"
    expected: >-
      Exits 0 printing `OK T4.5/T4.6 moved with the Decision`. On origin/main it exits 1 on the first
      leg -- the rationale is present verbatim.
    fix_if: >-
      Amending the Decision without the items leaves the roadmap contradicting the corpus at the exact
      seam the amendment exists to close.
    hermetic: true
    graduation: waive
    graduation_waiver_reason: "Two item intents mid-transition; the text changes again when T4.5 is built."
  - step: 4
    phase: pre-deploy
    action: >-
      THE ROUTING TABLE IS COMPLETED, NOT DUPLICATED. Asserts the new row, its migration framing, and
      that the deliberate-deferral case is resolvable -- round 2's three buckets could not resolve it
      while its own acceptance criteria required it.
    command: >-
      bin/venv-python -c "import yaml,pathlib,re; d=yaml.safe_load(pathlib.Path('docs/contracts/decision-entry.yaml').read_text());
      sig=d['significance']; rows=sig['routing']; assert 'work_item' in rows or any('tier_item' in str(v) and 'roadmap'
      in str(v) for v in rows.values()), 'no work-item routing row'; blob=str(sig); assert re.search(r'(bootstrap|supersede|
      destination form|migration)', blob, re.I), 'the row does not state the migration direction'; assert
      re.search(r'(defer|not-now|declined)', blob, re.I), 'the routing table cannot resolve a deliberate deferral';
      assert re.search(r'cross_tier_gate|deferred_post_mvp|exit_criteri', blob), 'the row does not name what the roadmap
      uniquely provides today'; print('OK routing table completed:', sorted(rows))"
    expected: >-
      Exits 0 printing `OK routing table completed:` and the row names. On origin/main it exits 1 with
      `no work-item routing row`.
    fix_if: >-
      Do NOT enumerate topics. Name the CAPABILITY the roadmap uniquely provides today -- gate
      evaluation, MVP-boundary classification, per-criterion exit lifecycle -- so the boundary moves
      on its own as recs gain them. ops_recommendations already carries dependencies VARCHAR[], so
      the graph primitive exists.
    hermetic: true
    graduation: waive
    graduation_waiver_reason: >-
      The row's content is asserted here; validate_decision_entry_conformance owns the file's grammar
      as a standing check, and a registry row would duplicate that reader.
  - step: 5
    phase: pre-deploy
    action: >-
      NOTHING SELECTS, AND THE SPIKE IS DISCHARGEABLE. CD.27's preconditions must name the minted item
      id -- round 2 asserted only that an item with "spike" in its name existed, never that CD.27
      could discharge against it.
    command: >-
      bin/venv-python -c "import yaml,pathlib,re; raw=pathlib.Path('docs/ROADMAP-PLATFORM.yaml').read_text();
      d=yaml.safe_load(raw); cds={c['id']: c for c in d['candidate_decisions']}; c43=str(cds['CD.43'].get('detail',''));
      assert 'TBD_at_CD.43_ratification' in c43, 'CD.43 no longer defers -- the encoding pre-empted the spike';
      spike=[x for x in d['tier_items'] if re.search(r'spike', str(x.get('name','')), re.I) and x['id'].startswith('T4.')];
      assert spike, 'no tier item owns the layer-2 spike'; sid=spike[0]['id']; c27=str(cds['CD.27'].get('detail',''));
      assert sid in c27, f'CD.27 preconditions do not name {sid} -- ESB-04/06/01 cannot discharge against it';
      ec=str(spike[0].get('exit_criteria','')); assert re.search(r'workspace', ec, re.I), 'the spike has no
      workspace-mutating leg -- a read-only persona cannot exercise P2'; assert re.search(r'(unstubbed|not stubbed|real
      credential|MECH-1)', ec, re.I), 'the spike stubs the dispatch credential, hiding the candidate arm largest cost';
      print('OK no selection;', sid, 'owns the spike and is named in CD.27')"
    expected: >-
      Exits 0 printing `OK no selection; T4.NN owns the spike and is named in CD.27`. On origin/main
      it exits 1 with `no tier item owns the layer-2 spike`.
    fix_if: >-
      decision_scout is read-only, so a kill test on it is trivially recoverable on every arm and
      discriminates nothing. The workspace leg is what exercises P2, the highest-severity open finding.
    hermetic: true
    graduation: waive
    graduation_waiver_reason: "Transient pre-spike state; the spike changes it the moment it runs."
  - step: 6
    phase: pre-deploy
    action: >-
      THE SUBSTRATE SWEEP, WIDENED. Round 2's regex missed the "Durable Lambdas" phrasing CD.37 and
      CD.38 actually use, scanned only three fields, and filtered to T4 -- leaving T5.6 and every
      `name` field unswept.
    command: >-
      bin/venv-python -c "import yaml,pathlib,re; d=yaml.safe_load(pathlib.Path('docs/ROADMAP-PLATFORM.yaml').read_text());
      stale=re.compile(r'([Dd]urable [Ff]unction|[Dd]urable [Ll]ambda|src/lambdas/(plan_agent|plan_critic|decision_scout|implement_agent|code_reviewer))');
      fields=('name','intent','exit_criteria','files_in_scope','decomposition_hints'); own=[x for x in d['tier_items']
      if x['id'].startswith('T4.') or x['id']=='T5.6']; ptr=re.compile(r'(per CD\\.27|incumbent|candidate|as amended)',
      re.I); hits={x['id']: [k for k in fields if stale.search(str(x.get(k,''))) and not ptr.search(str(x.get(k,'')))]
      for x in own}; bad={i: v for i, v in hits.items() if v}; assert not bad, f'stale substrate asserted (not
      pointered) in items that own the substrate: {bad}'; cds={c['id']: [k for k in ('title','detail') if
      stale.search(str(c.get(k,'')))] for c in d['candidate_decisions']}; cbad={i: v for i, v in cds.items() if v and
      not re.search(r'(incumbent|candidate|as amended)', str(next(c for c in d['candidate_decisions'] if c['id']==i)),
      re.I)}; assert not cbad, f'candidate decisions assert the incumbent with no incumbent/candidate framing: {cbad}';
      gbad=[g['id'] for g in d['cross_tier_gates'] if stale.search(str(g))]; assert not gbad, f'gates carry stale
      substrate: {gbad}'; print('OK sweep clean across', len(d['tier_items']), 'items,', len(d['candidate_decisions']),
      'CDs,', len(d['cross_tier_gates']), 'gates')"
    expected: >-
      Exits 0 printing `OK sweep clean across N items, M CDs, K gates`. On origin/main it exits 1
      listing substrate-owning items. Scoped to T4.* plus T5.6 with a pointer escape, because a
      descriptive mention elsewhere -- T2.11b names the substrate "(per CD.27)" while labelling scope
      -- is a pointer, not an assertion, and forcing an edit there would be sweep overreach.
    fix_if: >-
      This is the class-versus-site defect. Round 2 named seven sites in prose and detected three.
    hermetic: true
    graduation: waive
    graduation_waiver_reason: "The forbidden vocabulary changes the moment the spike rules; a graduated row would assert the wrong thing."
  - step: 7
    phase: pre-deploy
    action: >-
      LIFECYCLE FIELDS CARRY SUBSTRATE-NEUTRAL PROPERTY LANGUAGE. Round 2 purged the incumbent's
      vocabulary and permitted the candidate's in the same fields -- ESB-05 with the sign flipped,
      making a ruling for the incumbent cost a seven-surface re-sweep and a ruling for the candidate
      cost nothing. Switching cost is bias.
    command: >-
      bin/venv-python -c "import yaml,pathlib,re; d=yaml.safe_load(pathlib.Path('docs/ROADMAP-PLATFORM.yaml').read_text());
      t={x['id']: x for x in d['tier_items']}; cand=re.compile(r'(workflow_dispatch|repository_dispatch|GitHub-hosted
      runner|actions/checkout|runs-on)'); leaked={i: [k for k in ('exit_criteria','files_in_scope','decomposition_hints')
      if cand.search(str(t[i].get(k,'')))] for i in t if i.startswith('T4.')}; leaked={i: v for i, v in leaked.items()
      if v}; assert not leaked, f'candidate-specific mechanism leaked into lifecycle-tracked fields -- a spike ruling
      for the incumbent would cost a re-sweep, which is switching-cost bias: {leaked}'; neutral=str(t['T4.2'].get('exit_criteria',''));
      assert re.search(r'\bP1\b', neutral) and re.search(r'\bP2\b', neutral) and re.search(r'\bP3\b', neutral), 'T4.2
      criteria do not carry CD.27 substrate-neutral P1/P2/P3 property language'; print('OK lifecycle fields
      substrate-neutral; candidate mechanism confined to the CD body')"
    expected: >-
      Exits 0 printing `OK lifecycle fields substrate-neutral; ...`. PASSES ON ORIGIN/MAIN BY DESIGN
      -- a REGRESSION GUARD, not a differential. Main has no candidate mechanism to leak, and T4.2
      already carries P1/P2/P3 (verified). Its whole job is to fail if THIS encoding writes workflow
      paths or runner mechanics into exit_criteria, or strips the neutral property language while
      re-specifying.
    fix_if: >-
      The fields say WHAT MUST BE TRUE (P1/P2/P3); the candidate decision says HOW the candidate would
      make it true. That keeps either spike outcome a small diff.
    hermetic: true
    graduation: waive
    graduation_waiver_reason: "Asserts a mid-transition discipline that ends when the spike rules."
  - step: 8
    phase: pre-deploy
    action: >-
      THE RBAC OBLIGATION HAS A NAMED CARRIER AND AN MVP-SIDE GUARANTEE. Three separate reviews
      pointed at this. Round 2 left it as prose aimed at "the item that now precedes T4.2", never
      naming the item, absent from every acceptance criterion and every VP step.
    command: >-
      bin/venv-python -c "import yaml,pathlib,re; d=yaml.safe_load(pathlib.Path('docs/ROADMAP-PLATFORM.yaml').read_text());
      t={x['id']: x for x in d['tier_items']}; rbac=[i for i in t if re.search(r'(insert_plan|set_plan_status|verb-RBAC|
      verb RBAC)', str(t[i].get('exit_criteria','')), re.I)]; assert rbac, 'no tier item carries the Decision 87 clause-5
      verb-RBAC obligation as an exit criterion'; pin=[i for i in t if re.search(r'(content pin|content hash|writer-minted|
      plan hash)', str(t[i].get('exit_criteria','')), re.I)]; assert pin, 'no MVP-side content-pin guarantee -- a verb
      split cannot be enforced while every persona presents one identity'; print('OK verb-RBAC carried by', rbac, '|
      content pin carried by', pin)"
    expected: >-
      Exits 0 printing `OK verb-RBAC carried by [...] | content pin carried by [...]`. On origin/main
      it exits 1 with `no tier item carries the Decision 87 clause-5 verb-RBAC obligation`.
    fix_if: >-
      A verb split is unenforceable at MVP: all personas share the runner's OIDC identity, so the
      writer boundary cannot distinguish plan_critic from plan_agent. The enforceable substitute is
      the design's own head-SHA idiom applied to the plan -- SFN carries (rec_id, revision,
      ulid-or-hash) and every fetch plus the merge node verifies it, failing closed.
    hermetic: true
    graduation: waive
    graduation_waiver_reason: "Names the carrying items for one transition; they change when T4.5 lands."
  - step: 9
    phase: pre-deploy
    action: >-
      THE READ VERB PINS CONTENT, NOT JUST THE REVISION. merge_key is rec_id alone and revision is
      caller-supplied, so a re-dispatched writer can emit revision N twice with different bodies --
      which makes the design's determinism claim false on the recovery path the substrate is being
      selected for.
    command: >-
      bin/venv-python -c "import yaml,pathlib,re; d=yaml.safe_load(pathlib.Path('docs/ROADMAP-PLATFORM.yaml').read_text());
      t=d['tier_items']; verb=[x['id'] for x in t if re.search(r'(execution_plan_by_rec|named read verb|plan-fetch verb)',
      str(x), re.I)]; assert verb, 'no item owns the plan read verb'; spec=' '.join(str(x.get('exit_criteria','')) for x
      in t if x['id'] in verb); assert re.search(r'(ulid|content hash|writer-minted|idempot)', spec, re.I), 'the verb
      spec does not require pinning a writer-minted id or hash -- (rec_id, revision) is ambiguous under re-dispatch';
      print('OK plan read verb owned by', verb, 'and pins content')"
    expected: >-
      Exits 0 printing `OK plan read verb owned by [...] and pins content`. On origin/main it exits 1
      with `no item owns the plan read verb`.
    fix_if: >-
      Verified: field_semantics gives ops_execution_plans merge_key rec_id, and save_execution_plan
      takes revision as a caller scalar with no uniqueness on the pair.
    hermetic: true
    graduation: waive
    graduation_waiver_reason: "One verb's spec during one transition."
  - step: 10
    phase: pre-deploy
    action: >-
      EVERY DESIGN IDENTIFIER AND EVERY DOSSIER UNSPECIFIED ENTRY HAS A TRACKED HOME. Round 2 covered
      the seventeen identifiers and promised the dossier's eight entries with no execution step, no
      assertion and no routing outcome for a deliberate deferral.
    command: >-
      bin/venv-python -c "import yaml,pathlib,re; raw=pathlib.Path('docs/ROADMAP-PLATFORM.yaml').read_text();
      ids=[f'GOV-{i}' for i in (1,2,3)]+[f'MECH-{i}' for i in (1,2,3,4)]+[f'DATA-{i}' for i in (1,2,3,4)]+[f'OPS-{i}'
      for i in (1,2,3,4,5,6)]; d=yaml.safe_load(raw); tracked=[(x['id'], str(x.get('exit_criteria',''))) for x in
      d['tier_items']]+[(c['id'], str(c.get('detail',''))) for c in d['candidate_decisions']]; blob={i: [e for e, s in
      tracked if i in s] for i in ids}; prose_only=sorted(i for i, v in blob.items() if not v); assert not prose_only,
      f'identifiers with no exit criterion or CD body tracking them: {prose_only}'; uns=['eligibility predicate',
      'failure budget', 'targets', 'closure', 'A0', 'RCA rec', 'queue', 'worker identity']; unhomed=[u for u in uns if
      u.lower() not in raw.lower()]; assert not unhomed, f'dossier unspecified entries with no roadmap home: {unhomed}';
      print('OK', len(ids), 'identifiers tracked;', len(uns), 'dossier entries homed')"
    expected: >-
      Exits 0 printing `OK 17 identifiers tracked; 8 dossier entries homed`. On origin/main it exits 1
      with every identifier absent.
    fix_if: >-
      A deliberate deferral is a legitimate outcome and the completed routing table must resolve it --
      a rec carrying a deferred status and a reason, not silence.
    hermetic: true
    graduation: waive
    graduation_waiver_reason: "One design's question set; the next design would have to amend a graduated row."
  - step: 11
    phase: pre-deploy
    action: >-
      NEW RECS ARE FILED AND REFERENCED. Round 2 asserted a non-empty rec-id set against a roadmap
      that already carries 52 distinct ids -- a check that could never fail. This diffs against
      origin/main.
    command: >-
      bin/venv-python -c "import re,subprocess; head=set(re.findall(r'rec-\d+', open('docs/ROADMAP-PLATFORM.yaml').read()));
      base=set(re.findall(r'rec-\d+', subprocess.run(['git','show','origin/main:docs/ROADMAP-PLATFORM.yaml'],
      capture_output=True, text=True).stdout)); added=sorted(head-base); assert added, f'no NEW rec ids referenced --
      base had {len(base)}, head has {len(head)}; the out-of-file repairs were not filed'; print('OK', len(added), 'new
      rec ids referenced:', added)"
    expected: >-
      Exits 0 printing `OK N new rec ids referenced:` and the ids. On origin/main it exits 1 with `no
      NEW rec ids referenced` -- head and base are identical there, so the set difference is empty.
    fix_if: >-
      known_gaps is not a substitute: nothing outside the Pydantic schema reads it, and OQ.1/OQ.2 sat
      resolved on disk for weeks until an audit reconciled them.
    hermetic: true
    graduation: waive
    graduation_waiver_reason: "Asserts one encoding's filing discipline against one base commit."
  - step: 12
    phase: pre-deploy
    action: >-
      THE MERGE-NODE DIFF GUARD, T4-SCOPED. An earlier draft passed on main via an unrelated T2 item,
      so this requires a T4 owner naming both surfaces.
    command: >-
      bin/venv-python -c "import yaml,pathlib,re; d=yaml.safe_load(pathlib.Path('docs/ROADMAP-PLATFORM.yaml').read_text());
      t4=[x for x in d['tier_items'] if x['id'].startswith('T4.')]; guard=[x['id'] for x in t4 if re.search(r'\.github/workflows',
      str(x.get('exit_criteria',''))) and re.search(r'\bdiff\b', str(x.get('exit_criteria','')), re.I) and
      re.search(r'(merge node|at merge|boundary_patterns|Decision 117)', str(x.get('exit_criteria','')), re.I)]; assert
      guard, 'no T4 item carries a merge-node diff-path guard naming both .github/workflows and the Decision 117
      surface'; print('OK merge-node diff guard owned by', guard)"
    expected: "Exits 0 printing `OK merge-node diff guard owned by ['T4.NN']`. Exits 1 on origin/main."
    fix_if: >-
      ci.yml runs on pull_request, so a same-repo branch runs its own version of the workflow. The
      guard belongs on the plane the agent cannot edit through its own merge loop.
    hermetic: true
    graduation: waive
    graduation_waiver_reason: "Transient placement of one control."
  - step: 13
    phase: pre-deploy
    action: The line ceiling survives, re-measured rather than quoted.
    command: >-
      bin/venv-python -c "import pathlib; n=len(pathlib.Path('docs/ROADMAP-PLATFORM.yaml').read_text().splitlines());
      assert n <= 10000, f'roadmap is {n} lines, over the Decision 114 ceiling'; print(f'OK roadmap {n} lines, {10000-n}
      of headroom')"
    expected: >-
      Exits 0 printing `OK roadmap N lines, M of headroom`. Passes on origin/main too -- a regression
      guard on the delta's size, not a differential.
    fix_if: >-
      Do not raise the ceiling. Compress, or move content to a rec per the completed routing table --
      which is one reason that row exists.
    hermetic: true
    graduation: waive
    graduation_waiver_reason: "validate_platform_roadmap already enforces this ceiling."

test_obligations:
  - source: docs/ROADMAP-PLATFORM.yaml
    behavior: "Schema-valid, acyclic, no live-to-deferred edges, within the ceiling, and free of stale-substrate references in every scanned field."
    verification_step: 1
    command: bin/venv-python -m scripts.validate
    waiver_reason: >-
      The roadmap is DATA. Schema, dependency graph, MVP-boundary edges and line ceiling are owned by
      validate_platform_roadmap and the Decision 93 validator, both standing. Steps 3 and 5-13 assert
      this plan's deltas mechanically from the parsed document.
  - source: docs/DECISIONS.md
    behavior: "Decision 87 carries a residency-scoped amendment leaving the authority flip timed to T4.6."
    verification_step: 2
    command: >-
      bin/venv-python -c "import re,pathlib; t=pathlib.Path('docs/DECISIONS.md').read_text(encoding='utf-8');
      m=re.search(r'^## Decision 87:.*?(?=^## Decision |\Z)', t, re.M|re.S); assert m, 'Decision 87 missing';
      b=m.group(0); assert re.search(r'residenc', b, re.I), 'the amendment does not scope the inversion to residency';
      assert re.search(r'prerequisite', b, re.I), 'the amendment does not state the prerequisite'; assert
      re.search(r'authority', b, re.I) and re.search(r'T4\.6', b), 'the amendment does not state that the AUTHORITY
      flip stays timed to T4.6'; assert re.search(r'circular', b, re.I), 'the amendment does not name the circularity';
      print('OK Decision 87 residency-scoped,', len(b.encode()), 'bytes')"
    red_green_expectation: >-
      Red on origin/main (the word `residenc` is absent from Decision 87); green once the
      residency-scoped amendment lands.
  - source: docs/contracts/decision-entry.yaml
    behavior: "significance.routing gains a work-item row stating the migration direction and resolving deliberate deferral."
    verification_step: 4
    command: >-
      bin/venv-python -c "import yaml,pathlib,re; d=yaml.safe_load(pathlib.Path('docs/contracts/decision-entry.yaml').read_text());
      sig=d['significance']; rows=sig['routing']; assert 'work_item' in rows or any('tier_item' in str(v) and 'roadmap'
      in str(v) for v in rows.values()), 'no work-item routing row'; blob=str(sig); assert re.search(r'(bootstrap|supersede|
      destination form|migration)', blob, re.I), 'the row does not state the migration direction'; assert
      re.search(r'(defer|not-now|declined)', blob, re.I), 'the routing table cannot resolve a deliberate deferral';
      assert re.search(r'cross_tier_gate|deferred_post_mvp|exit_criteri', blob), 'the row does not name what the roadmap
      uniquely provides today'; print('OK routing table completed:', sorted(rows))"
    red_green_expectation: "Red on origin/main (no work-item row); green once the routing table is completed."
  - source: docs/decisions-index.json
    behavior: "The committed index matches the amended corpus."
    verification_step: 1
    command: bin/venv-python -m scripts.validate
    waiver_reason: >-
      A generated projection. validate_decisions_index_freshness is a standing check that fails on
      drift or absence, with a regenerate hint. A bespoke test would assert the generator against
      itself.

constraints:
  - >-
    THE ROUTING RULE IS A MIGRATION DIRECTION, NOT A STATIC BOUNDARY. The operator's long-term vision
    is that recommendations SUPERSEDE the roadmap -- they are the same thing, and the roadmap is the
    bootstrap. ops_recommendations already carries dependencies VARCHAR[], so the dependency-graph
    primitive exists today. Therefore write the row to name what the ROADMAP UNIQUELY PROVIDES NOW --
    cross-tier gate evaluation, MVP-boundary classification, per-criterion exit lifecycle -- and
    default everything else to a rec. As recs gain those capabilities the boundary moves on its own,
    with no rewrite. Do NOT enumerate topics; a topic list would freeze the boundary exactly where the
    vision says it must not stay.
  - >-
    EXTEND decision-entry.yaml; DO NOT ADD A CONTRACT. Decision 168 retired none_grandfathered and
    every new depth-1 contract needs a resolving evaluator. No in-scope surface can serve as one, and
    declaring a check would be a second new mechanism. Extending inherits
    validate_decision_entry_conformance and removes the two-routers contradiction with :397's
    operational_fact row in the same edit.
  - >-
    THIS PLAN SELECTS NO SUBSTRATE. The spike does, after this encoding. Leave CD.43 criteria-only.
    VP step 5 fails if a selection appears.
  - >-
    AMEND DECISION 87 SCOPED TO RESIDENCY. Warehouse RESIDENCY of executor plans is the prerequisite;
    the AUTHORITY flip for the human PLAN-*.yaml surface stays timed to T4.6. A wholesale inversion
    would supersede Decision 85's git clause pre-producer and cost human plans their diff review for
    nothing.
  - >-
    THE VERB SPLIT CANNOT BE ENFORCED AT MVP. Every persona presents one identity at the writer
    boundary, so server-side role scoping distinguishes nothing. The MVP guarantee is a CONTENT PIN --
    SFN carries (rec_id, revision, ulid-or-hash) and every fetch plus the merge node verifies it. The
    verb split routes to T4.5/T4.6 where per-persona credentials exist.
  - >-
    KEEP LIFECYCLE FIELDS SUBSTRATE-NEUTRAL. Use CD.27's P1/P2/P3 property language in exit_criteria;
    confine candidate mechanism to the candidate decision body. Purging the incumbent's vocabulary
    while admitting the candidate's makes ruling for the incumbent cost a re-sweep and ruling for the
    candidate cost nothing -- switching-cost bias, and ESB-05 with the sign flipped.
  - >-
    NO VACUOUS ASSERTIONS. Round 1 and round 2 both shipped checks that could not fail -- a `slug`
    grep already satisfied, an amendment marker already present, a rec-id set already non-empty, and a
    CD.17 leg aimed at a string that lives in CD.27. Every hermetic command here must be run against
    origin/main and confirmed RED for the reason its `expected` names, before this plan is handed off.
  - >-
    DO NOT TOUCH THE FROZEN EXECUTOR. scripts/executor/ is Life 1, retiring by deletion. Roadmap-side
    only, and the sweep includes the siblings round 1 missed -- T4.9a and T4.8 both declare NEW files
    inside that tree, alongside T3.10.
  - >-
    V2, AND THE FLOOR IS ARGUED. Two YAML documents, one markdown amendment, one regenerated index,
    and portal calls. No resource-affecting scope, so the deterministic V-tier floor is not reached.

context:
  - >-
    THE DESIGN -- REQUIRED READING:
    https://claude.ai/code/artifact/a591749c-cc12-4b5e-b582-ac03595e04dc ("Two-Plane Executor"). Step
    Functions keeps the state machine and carries IDENTIFIERS ONLY; GitHub Actions runs every persona
    and every verification gate, all LiteLLM in-process; the plan artifact lives in
    ops_execution_plans and is fetched by named verb. Open register: GOV-1..3, MECH-1..4, DATA-1..4,
    OPS-1..6.
  - >-
    THE DOSSIER -- the second required reading:
    https://claude.ai/code/artifact/a290d222-4200-4f2e-a74c-2f9cf07c370f. Two systems share the name
    "executor": Life 1, frozen and retiring by deletion, and Life 2, zero of sixteen T4 items started.
    Explicitly not authoritative over the roadmap -- which is why its claims need encoding here.
  - >-
    THE LONG-TERM VISION THIS ENCODING MUST NOT FORECLOSE, stated by the operator: recommendations
    eventually SUPERSEDE the roadmap. They are the same thing; the roadmap bootstraps the rec system,
    and the destination is dependency graphs built from rec edges. ops_recommendations already carries
    dependencies VARCHAR[]. That is why the routing row is written as a capability test rather than a
    topic list -- a topic list would freeze the boundary, and this boundary is meant to move.
  - >-
    WHY DECISION 87 IS AMENDED, AND WHY ROUND 2's AMENDMENT WAS TOO BROAD. Clause 2 times the
    git-to-warehouse flip to the autonomous producer's existence, while T4.5's deferral rationale is
    "no warehouse consumer of plans exists until the T4.6 loop" -- a consumer this design creates at
    MVP. Round 2 inverted the whole flip. But the cycle is only in RESIDENCY: the producer needs its
    plans queryable. It does not need AUTHORITY -- executor plans are born warehouse-native and never
    had a git life, so there is nothing to flip for them, while human PLAN-*.yaml keep git/PR diff
    review, which is exactly what clause 2 protected.
  - >-
    THE THREE-LENS RESULT, ROUND 2. Design merit: SOUND_WITH_RESERVATIONS, and it withdrew its
    round-1 S3-primary reservation after verifying that ops_execution_plans carries plan_text -- the
    body is in the table, so an S3 document would be a second copy. Placement: BLOCK, but six of nine
    round-1 findings verified closed red-on-main. Consistency: BLOCK, three blocking, one of which
    (the co-shipped spike plan) is resolved by dropping that plan at the operator's direction.
  - >-
    FIVE VACUOUS ASSERTIONS ACROSS TWO ROUNDS, NAMED SO THE PATTERN STOPS. A `slug` grep satisfied by
    pre-existing text; an `[Amendment` marker already present sixteen times; a `T4.5` match already in
    Related; a rec-id set already holding 52 ids; and a CD.17 leg targeting `unplanned_resume_rate`,
    which lives in CD.27 and never appeared in CD.17. Each was an assertion that was TRUE rather than
    one that DISCRIMINATED. Constraint 7 requires every hermetic command to be proven red on
    origin/main before handoff.
  - >-
    WHAT THIS PLAN DELIBERATELY DOES NOT DO. It selects no substrate, ratifies nothing, and builds
    nothing. It does not resolve MECH-1's credential model or MECH-3's continuation -- it gives them
    owners. It does not fix AGENTS.md's ops_execution_plans backend claim, the missing NAMED_READS
    verb, the contract vocabulary skew or the boundary-pattern drift; those are filed as recs and
    referenced by id. And it does not touch the frozen Life-1 executor.

