schema_version: 4
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: "executor-two-plane-roadmap-encoding"
intent: >-
  Encode the operator's Two-Plane Executor design into the platform roadmap; amend Decision 87 to
  break the plan-residency circularity the design exposes AND to collapse its proposed two-table
  plans split onto the ONE plans table that already exists; and complete decision-entry.yaml's
  routing table with the missing work-item row, so a roadmap entry can carry a rec id instead of a
  paragraph.
  The design stays in its hosted artifact (Decision 86). This plan selects NO substrate -- the
  decision_scout spike does that, after this encoding, and this is what gives it a properly-specified
  candidate to test.
plan_type: IMPLEMENTATION
verification_tier: V2
plan_path: docs/plans/PLAN-executor-two-plane-roadmap-encoding.yaml
phase: >-
  Platform T4 (executor). Roadmap-and-governance precursor to T4.1/T4.2 and to the layer-2 substrate
  spike, which this plan gives an owner and sequences after itself.

fallback_reevaluation:
  reevaluated_on: "2026-08-18"
  substrate_status: >-
    CD.27's layer-2 incumbent remains the incumbent. This plan records the two-plane design as a
    CANDIDATE and selects nothing. The decision_scout spike -- named as the resolving instrument by
    CD.27's own ESB-04, ESB-06 and ESB-01 preconditions -- has not run.
  verdict: continue_on_current_substrate
  basis: >-
    An earlier draft recorded obligation_lapsed while also retiring the spike. That was doubly wrong:
    the lapse_condition fires only "if wave 5's Q5 spike pins a layer-2 substrate", so the claim
    rested on a trigger whose instrument the same plan deleted, and CD.27 would have become formally
    unratifiable because every declared precondition requires discharge. The spike is kept and owned.
    Until it runs, the incumbent stands and no obligation lapses.

scope:
  - file: docs/ROADMAP-PLATFORM.yaml
    action: Modify
    purpose: >-
      The encoding. Records the two-plane design as a CANDIDATE (no selection anywhere); gives the
      layer-2 spike an owning tier item sequenced before T4.2; adds the MVP-critical items the design
      needs with reverse dependency edges; routes the design's open register onto exit_criteria; and
      sweeps the stale-substrate class across every sibling site in lifecycle-tracked fields. Also
      amends T4.5 and T4.6, whose intents restate the Decision 87 clauses this plan corrects -- round 2
      amended the Decision and left the items contradicting it, and T4.5 additionally names two tables
      that do not exist, so its intent is re-pointed at EXTENDING the one live plans table rather than
      building new entities. Line budget: 8,616 lines of 10,000 on origin/main -- 1,384 lines of
      headroom, which this plan's roadmap edits consume; re-measure after any rebase.
  - file: docs/DECISIONS.md
    action: Modify
    purpose: >-
      AMEND DECISION 87, SCOPED TO RESIDENCY. Clause 2 times the git-to-warehouse flip to the
      autonomous producer's existence; the producer cannot function until its plans are
      warehouse-readable, so residency and producer are circular. The amendment makes warehouse
      RESIDENCY of executor plans a prerequisite for T4.2 -- and explicitly leaves the AUTHORITY flip
      for the human PLAN-*.yaml surface timed to T4.6. Round 2 conflated the two; a wholesale
      inversion would supersede Decision 85's git-authoritative clause pre-producer and break diff
      review of human plans for no gain. Executor plans are born warehouse-native and never had a git
      life, so there is nothing to flip for them.
      ALSO AMEND CLAUSE 4, SCOPED TO THE PLANS TABLE: clause 4 splits plan state across `ops_plans`
      and `ops_plan_revisions`, NEITHER OF WHICH EXISTS (verified: absent from
      config/lambda/ducklake/field_semantics.yaml's ops_tables, absent from
      docs/contracts/storage-substrate.yaml, referenced by zero lines of code). The live table is
      `ops_execution_plans`, which already carries plan_text, steps, revision, status and
      critique_history. Per the operator's ruling there is ONE plans table: clause 4 is amended to
      name a single plans table, the two-table split is retired as retired-before-built, and the
      table's NAME is left as an open operator decision. Clause 5's verb-RBAC is untouched -- it is a
      writer concern, not a schema one.
  - file: docs/contracts/decision-entry.yaml
    action: Modify
    purpose: >-
      COMPLETE THE ROUTING TABLE rather than add a second router. significance.routing already carries
      four rows deciding where content goes -- numbered_decision, cd_state_flip, operational_fact,
      field_semantics -- and operational_fact already routes to "a recommendation via file_rec, or a
      tier_item progress_note". The gap is a row for durable sequencing work. Round 2 proposed a
      standalone contract, which cannot land: the `none_grandfathered` evaluator kind no longer
      exists, so every new depth-1 Class D contract needs a RESOLVING evaluator with no debt-record
      escape hatch, and no in-scope surface could serve as one -- declaring a check would have been a
      second new mechanism. Extending this file inherits its working evaluator
      (validate_decision_entry_conformance) and removes the two-routers contradiction in the same
      edit. NOTE THE ATTRIBUTION: Decision 168 clause 3 PERMITTED `absent -> none_grandfathered` on
      baseline-present files; the kind was RETIRED by rec-3059 wave 2 on 2026-08-16
      (PLAN-class-d-enforcers-wave-2), recorded in docs/contracts/contract-population.yaml's
      2026-08-16 amendment_log entry and retirement_notes.evaluator_none_grandfathered. Editing this
      file also OBLIGES a new `amendment_log[]` entry: decision-entry.yaml is Class D (see its
      `contract:` block) with an existing amendment_log at :34, and contract-population.yaml's
      change_detection.amendment_log rule fails validate_contract_drift when a Class D file's
      canonical dump changes with no new entry.
  - file: docs/decisions-index.json
    action: Modify
    purpose: >-
      Regenerate. Amending Decision 87 stales the committed index and
      validate_decisions_index_freshness fails on drift. Mechanical consequence of the amendment, not
      a separate change.

bundled_recommendations: []
closes_criteria: []

infrastructure_dependencies:
  - >-
    Ops-portal reachability for every recommendation filing in the execution steps -- the out-of-file
    repairs, the dossier entries routed to recs, and the out-of-scope four-rows sites. Referenced by
    NAME, not by step number: this plan adds steps, and a numeric range stales on the next edit.
    Portal calls, not file edits -- which is why single-file scope never excused parking out-of-file
    repairs in an unread register. A write that cannot complete FAILS LOUD; there is no offline
    outbox, so re-file after restoring connectivity rather than deferring the reference.

acceptance_criteria:
  - "Decision 87's amendment scopes the inversion to RESIDENCY and states that the AUTHORITY flip for the human planning surface stays timed to T4.6."
  - "T4.5 and T4.6's own intents are amended to match -- round 2 amended the Decision and left the items restating the superseded clause."
  - "decision-entry.yaml's significance.routing gains a work-item row, and the routing_rule's question set is extended to reach it."
  - "The routing row states the migration direction: recommendations are the destination form, the roadmap is the bootstrap, and the row names what the roadmap uniquely provides TODAY so the boundary moves as recs gain those capabilities."
  - "The routing table resolves 'deliberate deferral with a reason' -- round 2's three buckets could not, while the plan's own acceptance criteria required it."
  - "No roadmap field asserts a selected layer-2 substrate."
  - "A tier item owns the layer-2 spike, and CD.27's precondition text names that item's id, so ESB-04 / ESB-06 / ESB-01 can discharge against something that exists."
  - "The spike's exit criteria require a workspace-mutating leg and an unstubbed dispatch credential on the candidate arm."
  - "Lifecycle-tracked T4 fields carry CD.27's substrate-neutral P1/P2/P3 property language; candidate-specific mechanism is confined to the candidate decision body."
  - "The stale-substrate sweep detects every declared site, including the 'Durable Lambdas' phrasing and the name and intent fields, not only exit_criteria."
  - "The verb-RBAC obligation names its carrying item and lands as an exit criterion; a content pin is the MVP-side guarantee and the verb split routes to T4.5/T4.6."
  - "The read verb's spec requires pinning a writer-minted id or content hash, because merge_key is rec_id alone and a re-dispatched writer can emit the same revision twice."
  - "The dossier's eight 'Also unspecified' entries each resolve to a tier item, a rec id, or a recorded deferral."
  - "Every GOV/MECH/DATA/OPS identifier resolves to a lifecycle-tracked field, not intent prose."
  - "Newly filed rec ids are referenced from the roadmap -- asserted against origin/main's set, not against a non-empty count."
  - "A merge-node diff-path guard covers .github/workflows/** and the Decision 117 boundary patterns."
  - "The roadmap stays under the 10,000-line ceiling."
  - "Decision 87 clause 4 names exactly ONE plans table; the ops_plans / ops_plan_revisions split is recorded as retired-before-built, with no migration and nothing to delete because neither table was ever created."
  - "T4.5's intent is re-pointed at EXTENDING the one live plans table; it no longer instructs a builder to create ops_plans and ops_plan_revisions as new entities."
  - "The plans-table NAME is left open: both options (keep ops_execution_plans / rename to ops_plans) and the fact that decides them (the table is empty until CD.17 reversal, so a rename is free today and never cheaper later) are recorded, and no surface names a winner."
  - "The encoding states that the warehouse row is the SOLE plan artifact -- the design's stage-04 S3 plan document is recorded as considered-and-rejected, not transcribed."
  - "The encoding states that a critique verdict is written by the critic or the gate, never by the critiqued persona, and that the content pin's hash is scoped to the plan body EXCLUDING critique_history."
  - "The new work_item routing row carries the literal string `Never a numbered Decision`, so significance.value: work_item cannot be claimed on a numbered Decision entry."
  - "Every `four rows` / `four keys` phrasing inside decision-entry.yaml is corrected when the fifth row lands, and each out-of-scope site (AGENTS.md, the Decision 150 and Decision 167 bodies, the planning skill) is filed as a rec referenced by id."
  - "docs/contracts/decision-entry.yaml gains a new amendment_log[] entry in the same edit that changes any other top-level key."
  - "Every hermetic verification command has a RECORDED per-assertion fault-injection result -- origin/main (waived only for the declared regression guards), subject-removed fixture, decoy fixture."

verification_plan:
  - step: 1
    phase: pre-deploy
    action: Full presubmit tier. Schema, dependency graph, contract conformance, decisions index and placement all gate here.
    command: bin/venv-python -m scripts.validate
    expected: "Exit 0, `All checks passed`."
    fix_if: >-
      A stale docs/decisions-index.json fails validate_decisions_index_freshness with a regenerate
      hint. A timeout is timeout_disposition blocked: resume the named check and rerun from the start.
    hermetic: false
    graduation: not-applicable
  - step: 2
    phase: pre-deploy
    action: >-
      THE AMENDMENT IS RESIDENCY-SCOPED. Round 2 asserted markers already present in Decision 87 (sixteen [Amendment
      markers exist, and T4.5 already appears in Related), so two of its four legs were dead. This asserts only what
      is genuinely new, and asserts the SCOPE. The AUTHORITY leg is paragraph-scoped on purpose: the bare word
      authority already occurs in Decision 87 on origin/main, so authority and T4.6 must co-occur in one paragraph or
      the leg proves nothing.
    command: >-
      bin/venv-python -c "import re,pathlib; t=pathlib.Path('docs/DECISIONS.md').read_text(encoding='utf-8');
      m=re.search(r'^## Decision 87:.*?(?=^## Decision |\Z)', t, re.M|re.S); assert m, 'Decision 87 missing';
      b=m.group(0); assert re.search(r'residenc', b, re.I), 'the amendment does not scope the inversion to residency';
      assert re.search(r'prerequisite', b, re.I), 'the amendment does not state the prerequisite'; assert [p for p in
      re.split(r'\n\s*\n', b) if re.search(r'authority', p, re.I) and re.search(r'T4\.6', p)], 'no single paragraph
      states that the AUTHORITY flip stays timed to T4.6 -- the bare word authority is already present on origin/main,
      so the two must co-occur'; assert re.search(r'circular', b, re.I), 'the amendment does not name the
      circularity'; print('OK Decision 87 residency-scoped,', len(b.encode()), 'bytes')"
    expected: >-
      Exits 0 printing `OK Decision 87 residency-scoped,` and a byte count. On origin/main it exits 1 on the FIRST
      leg, residency absent -- verified, not assumed. Fault-injected both ways against /tmp fixtures: with the
      amendment paragraph removed it fails on residency; with a decoy carrying residency, prerequisite and circular
      but leaving authority only in the paragraph that already holds it on main, it fails on the authority-and-T4.6
      co-occurrence leg.
    fix_if: >-
      If the amendment inverts wholesale, human PLAN-*.yaml lose diff review for nothing. Executor plans are born
      warehouse-native; there is nothing to flip for them. Put the authority sentence and T4.6 in the same paragraph
      -- the leg is paragraph-scoped because the word alone is already there.
    hermetic: true
    graduation: waive
    graduation_waiver_reason: >-
      Asserts one Decision's amendment text; graduating it pins one entry's wording forever.
  - step: 3
    phase: pre-deploy
    action: >-
      T4.5 AND T4.6 MOVE WITH THE DECISION. Round 2 amended the corpus and left the items restating the superseded
      clause -- T4.5 intent still ends "no warehouse consumer of plans exists until the T4.6 loop", the exact sentence
      this design falsifies. The acknowledgement leg is per-item and demands as-amended or residency wording, not a
      bare Decision 87 reference: T4.6 already cites Decision 87 on origin/main, so a pooled Decision-87 grep would be
      satisfied before the edit.
    command: >-
      bin/venv-python -c "import yaml,pathlib,re;
      d=yaml.safe_load(pathlib.Path('docs/ROADMAP-PLATFORM.yaml').read_text()); t={x['id']: x for x in
      d['tier_items']}; t45=str(t['T4.5'].get('intent','')); t46=str(t['T4.6'].get('intent','')); assert not
      re.search(r'no warehouse\s+consumer of plans exists', t45), 'T4.5 still carries the deferral rationale this
      design falsifies'; assert re.search(r'(as amended|residenc)', t45, re.I), 'T4.5 intent does not acknowledge the
      amended clause -- a bare Decision 87 reference is already there on origin/main'; assert re.search(r'(as
      amended|residenc)', t46, re.I), 'T4.6 intent does not acknowledge the amended clause -- a bare Decision 87
      reference is already there on origin/main'; print('OK T4.5/T4.6 moved with the Decision')"
    expected: >-
      Exits 0 printing `OK T4.5/T4.6 moved with the Decision`. On origin/main it exits 1 on the first leg -- the
      rationale is present verbatim (the source YAML wraps it, which is why the regex uses \s+ between warehouse and
      consumer). Fault-injected: reverting T4.5 intent fails leg 1; deleting the falsified sentence without adding
      as-amended/residency wording fails leg 2; moving only T4.5 fails leg 3.
    fix_if: >-
      Amending the Decision without the items leaves the roadmap contradicting the corpus at the exact seam the
      amendment exists to close.
    hermetic: true
    graduation: waive
    graduation_waiver_reason: >-
      Two item intents mid-transition; the text changes again when T4.5 is built.
  - step: 4
    phase: pre-deploy
    action: >-
      THE ROUTING TABLE IS COMPLETED, NOT DUPLICATED. Every leg binds to the work_item ROW itself. Round 3 tested a
      disjunct -- any row mentioning tier_item and roadmap -- which the pre-existing operational_fact row at :393
      already satisfies on origin/main, so an implementation that sprinkled migration vocabulary into the significance
      block without adding the row would have passed. The row key is work_item; validate_decision_entry_conformance
      reads routing keys dynamically, so a fifth row is admissible.
    command: >-
      bin/venv-python -c "import yaml,pathlib,re;
      d=yaml.safe_load(pathlib.Path('docs/contracts/decision-entry.yaml').read_text()); sig=d['significance'];
      rows=sig['routing']; assert 'work_item' in rows, f'no work_item routing row -- significance.routing carries only
      {sorted(rows)}'; row=str(rows['work_item']); rule=str(sig.get('routing_rule','')); assert
      re.search(r'(bootstrap|supersede|destination\s+form|migration)', row, re.I), 'the work_item ROW does not state
      the migration direction; matching that vocabulary anywhere else in the significance block does not count';
      assert re.search(r'(cross_tier_gate|cross-tier\s+gate|deferred_post_mvp|MVP\s+boundary|exit_criteri)', row,
      re.I), 'the work_item ROW does not name what the roadmap uniquely provides today'; assert
      re.search(r'(defer|not-now|declined)', row + ' ' + rule, re.I), 'neither the work_item row nor routing_rule
      resolves a deliberate deferral with a reason'; assert 'work_item' in rule, 'routing_rule question set was not
      extended to reach the work_item row'; print('OK routing table completed:', sorted(rows))"
    expected: >-
      Exits 0 printing `OK routing table completed:` and the row names. On origin/main it exits 1 with the work_item
      row absent (routing carries only cd_state_flip, field_semantics, numbered_decision, operational_fact).
      Fault-injected: deleting the row fails leg 1; a decoy that moves the migration and roadmap-unique vocabulary
      into the operational_fact row and leaves work_item bare still fails, because the legs read the row, not
      str(sig); dropping work_item from routing_rule fails the last leg.
    fix_if: >-
      Do NOT enumerate topics. Name the CAPABILITY the roadmap uniquely provides today -- gate evaluation,
      MVP-boundary classification, per-criterion exit lifecycle -- so the boundary moves on its own as recs gain them.
      ops_recommendations already carries dependencies VARCHAR[], so the graph primitive exists. A fifth row also
      stales FOUR count-bearing statements in decision-entry.yaml, not two: :364 ("One of significance.routing's four
      keys below"), :377 ("the four routing rows are a citable classification vocabulary in their own right"), :382
      ("routes per one of the four rows below instead of minting a new number") and :408 ("one of the four routing
      keys"). A FIFTH statement at :387 miscounts in the other direction -- "for symmetry with
      the other three" becomes four. Update all five when the row lands -- fixing only the two this line used to name leaves the contract
      self-contradicting.
    hermetic: true
    graduation: waive
    graduation_waiver_reason: >-
      The row's content is asserted here; validate_decision_entry_conformance owns the file's grammar as a standing
      check, and a registry row would duplicate that reader.
  - step: 5
    phase: pre-deploy
    action: >-
      NOTHING SELECTS, AND THE SPIKE IS DISCHARGEABLE. CD.27 ESB-04 / ESB-06 / ESB-01 preconditions live in
      discipline_points, NOT in detail -- round 3 asserted against detail, where the id could be dropped anywhere and
      green the check while the precondition still could not discharge. The kill leg is the spike whole purpose and
      was previously unasserted; the realism leg is symmetric, because nothing forced the INCUMBENT arm to be real
      either.
    command: >-
      bin/venv-python -c "import yaml,pathlib,re;
      d=yaml.safe_load(pathlib.Path('docs/ROADMAP-PLATFORM.yaml').read_text()); cds={c['id']: c for c in
      d['candidate_decisions']}; t={x['id']: x for x in d['tier_items']}; assert 'TBD_at_CD.43_ratification' in
      str(cds['CD.43'].get('detail','')), 'CD.43 no longer defers -- the encoding pre-empted the spike'; spike=[x for
      x in d['tier_items'] if x['id'].startswith('T4.') and re.search(r'spike', str(x.get('name','')), re.I) and
      re.search(r'(layer-2|layer\s+2|substrate)', str(x.get('name','')) + ' ' + str(x.get('intent','')), re.I)];
      sids=[x['id'] for x in spike]; assert len(sids) == 1, f'expected exactly one T4 item whose name says spike and
      whose name or intent says layer-2 or substrate; found {sids}'; sid=sids[0]; pre=[str(p) for p in
      cds['CD.27'].get('discipline_points', []) if re.search(r'ratification\s+precondition\s+\(ESB-0[146]\)',
      str(p))]; assert len(pre) == 3, f'CD.27 discipline_points no longer carry three ESB-04/06/01 ratification
      preconditions (found {len(pre)}) -- ESB text lives in discipline_points, never in detail';
      missing=[re.search(r'ESB-0[146]', p).group(0) for p in pre if sid not in p]; assert not missing, f'CD.27
      preconditions {missing} do not name {sid} in discipline_points -- they cannot discharge against it';
      ec=str(spike[0].get('exit_criteria','')); assert re.search(r'workspace', ec, re.I), 'the spike has no
      workspace-mutating leg -- a read-only persona cannot exercise P2'; assert
      re.search(r'(unstubbed|un-stubbed|not\s+stubbed|real\s+credential|live\s+credential)', ec, re.I), 'the spike
      stubs the dispatch credential, hiding the candidate arm largest cost'; assert
      re.search(r'\b(kill|killed|kills|interrupt\w*|terminat\w*)\b', ec, re.I) and
      re.search(r'(mid-loop|mid-run|mid-execution|mid-task|in-flight)', ec, re.I), 'the spike never forces a mid-loop
      kill -- resumability is the property being compared, so criteria without it discriminate nothing'; assert
      re.search(r'(neither\s+arm\s+is\s+stubbed|no\s+arm\s+is\s+stubbed|both\s+arms\s+(are\s+)?(equally\s+)?(real|unstubbed)|same\s+realism|equal\s+realism|symmetric\w*\s+realism|arm\s+symmetry)',
      ec, re.I), 'the spike does not require SYMMETRIC realism -- name it (neither arm is stubbed / the same realism
      on each arm). A bare both-arms phrase attached to one leg leaves a stubbed incumbent arm rigging the comparison
      toward the candidate'; assert sid in [str(v) for v in t['T4.2'].get('depends_on', [])], f'{sid} is not sequenced
      before T4.2 -- T4.2 depends_on does not name it'; print('OK no selection;', sid, 'owns the spike, is named in
      all three CD.27 preconditions, and precedes T4.2')"
    expected: >-
      Exits 0 printing `OK no selection;` then the item id. On origin/main it exits 1 on the ownership leg with found
      []. Fault-injected: removing the spike fails ownership; planting the id in CD.27 detail instead of
      discipline_points fails the precondition leg; naming only two of the three preconditions fails and says which;
      kill-switch wording with no mid-loop kill fails the kill leg; realism claimed for the candidate arm only fails
      the symmetry leg; routing MECH-1 onto the item (which step 10 does) no longer satisfies the credential leg;
      dropping the T4.2 edge fails the sequencing leg; two spike items fail as ambiguous.
    fix_if: >-
      decision_scout is read-only, so a kill test on it is trivially recoverable on every arm and discriminates
      nothing. The workspace leg is what exercises P2, the highest-severity open finding. Say symmetric realism
      explicitly -- neither arm is stubbed, or the same realism on each arm -- because a stubbed incumbent arm rigs
      the comparison toward the candidate exactly as a stubbed candidate arm would rig it the other way.
    hermetic: true
    graduation: waive
    graduation_waiver_reason: >-
      Transient pre-spike state; the spike changes it the moment it runs.
  - step: 6
    phase: pre-deploy
    action: >-
      THE SUBSTRATE SWEEP, WIDENED AND PROXIMITY-SCOPED. Round 2 regex missed the "Durable Lambdas" phrasing CD.37 and
      CD.38 actually use, scanned only three fields, and filtered to T4 -- leaving T5.6 and every name field unswept.
      The pointer escape is now local: the incumbent/candidate/per-CD.27 pointer must sit within 200 chars of the
      mention, because a field-wide escape let the word candidate anywhere in a 3,000-char detail excuse every mention
      in it.
    command: >-
      bin/venv-python -c "import yaml,pathlib,re;
      d=yaml.safe_load(pathlib.Path('docs/ROADMAP-PLATFORM.yaml').read_text()); stale=re.compile(r'([Dd]urable
      [Ff]unction|[Dd]urable
      [Ll]ambda|src/lambdas/(plan_agent|plan_critic|decision_scout|implement_agent|code_reviewer))');
      ptr=re.compile(r'(per CD\.27|incumbent|candidate|as amended)', re.I);
      fields=('name','intent','exit_criteria','files_in_scope','decomposition_hints'); own=[x for x in d['tier_items']
      if x['id'].startswith('T4.') or x['id'] == 'T5.6']; hits={x['id']: [k for k in fields if [m for m in
      stale.finditer(str(x.get(k,''))) if not ptr.search(str(x.get(k,''))[max(0, m.start()-200):m.end()+200])]] for x
      in own}; bad={i: v for i, v in hits.items() if v}; assert not bad, f'stale substrate asserted with no
      incumbent/candidate/per-CD.27 pointer within 200 chars of the mention, in items that own the substrate: {bad}';
      cds={c['id']: [k for k in ('title','detail') if [m for m in stale.finditer(str(c.get(k,''))) if not
      ptr.search(str(c.get(k,''))[max(0, m.start()-200):m.end()+200])]] for c in d['candidate_decisions']}; cbad={i: v
      for i, v in cds.items() if v}; assert not cbad, f'candidate decisions assert the incumbent with no
      incumbent/candidate framing near the mention: {cbad}'; gbad=[g['id'] for g in d['cross_tier_gates'] if [m for m
      in stale.finditer(str(g)) if not ptr.search(str(g)[max(0, m.start()-200):m.end()+200])]]; assert not gbad,
      f'gates assert the incumbent substrate with no pointer within 200 chars of the mention: {gbad}'; print('OK sweep
      clean across', len(d['tier_items']), 'items,', len(d['candidate_decisions']), 'CDs,',
      len(d['cross_tier_gates']), 'gates')"
    expected: >-
      Exits 0 printing `OK sweep clean across` and the three counts. On origin/main it exits 1 listing T4.2 (name,
      intent, files_in_scope, decomposition_hints) and T5.6 (intent); CD.11, CD.27, CD.37, CD.38 and gate G.9 follow
      on the later legs. Scoped to T4.* plus T5.6 with the pointer escape, because a descriptive mention elsewhere --
      T2.11b names the substrate "(per CD.27)" while labelling scope -- is a pointer, not an assertion.
      Fault-injected: reverting T4.2 name fails; a decoy putting the escape word in the same field but >200 chars from
      the mention still fails; unpointering G.9 name or CD.37 detail fails the gate and CD legs.
    fix_if: >-
      This is the class-versus-site defect. Round 2 named seven sites in prose and detected three. The remedy is to
      pointer each mention in place -- "Durable Functions (per CD.27, the incumbent)" -- not to delete the word, and
      not to drop an escape word at the far end of the field.
    hermetic: true
    graduation: waive
    graduation_waiver_reason: >-
      The forbidden vocabulary changes the moment the spike rules; a graduated row would assert the wrong thing.
  - step: 7
    phase: pre-deploy
    action: >-
      LIFECYCLE FIELDS CARRY SUBSTRATE-NEUTRAL PROPERTY LANGUAGE. Round 2 purged the incumbent vocabulary and
      permitted the candidate vocabulary in the same fields -- ESB-05 with the sign flipped, making a ruling for the
      incumbent cost a seven-surface re-sweep and a ruling for the candidate cost nothing. Switching cost is bias. The
      field list is now the same five step 6 sweeps: round 3 scanned only exit_criteria, files_in_scope and
      decomposition_hints, so candidate mechanism written into name or intent escaped the guard entirely.
    command: >-
      bin/venv-python -c "import yaml,pathlib,re;
      d=yaml.safe_load(pathlib.Path('docs/ROADMAP-PLATFORM.yaml').read_text()); t={x['id']: x for x in
      d['tier_items']}; cand=re.compile(r'(workflow_dispatch|repository_dispatch|GitHub-hosted
      runner|actions/checkout|runs-on)');
      fields=('name','intent','exit_criteria','files_in_scope','decomposition_hints'); leaked={i: [k for k in fields
      if cand.search(str(t[i].get(k,'')))] for i in t if i.startswith('T4.')}; leaked={i: v for i, v in leaked.items()
      if v}; assert not leaked, f'candidate-specific mechanism leaked into lifecycle-tracked fields -- a spike ruling
      for the incumbent would cost a re-sweep, which is switching-cost bias: {leaked}';
      neutral=str(t['T4.2'].get('exit_criteria','')); assert re.search(r'\bP1\b', neutral) and re.search(r'\bP2\b',
      neutral) and re.search(r'\bP3\b', neutral), 'T4.2 criteria do not carry CD.27 substrate-neutral P1/P2/P3
      property language'; print('OK lifecycle fields substrate-neutral across', len(fields), 'fields; candidate
      mechanism confined to the CD body')"
    expected: >-
      Exits 0 printing `OK lifecycle fields substrate-neutral across` and the field count. PASSES ON ORIGIN/MAIN BY
      DESIGN -- a REGRESSION GUARD, not a differential. Main has no candidate mechanism to leak in any of the five
      fields (verified), and T4.2 already carries P1/P2/P3. Its whole job is to fail if THIS encoding writes workflow
      paths or runner mechanics into a lifecycle-tracked field, or strips the neutral property language while
      re-specifying. Fault-injected: workflow_dispatch injected into intent and runs-on injected into name both fail
      under the five-field list and both PASS under the round-3 three-field list -- that is the escape this widening
      closes; stripping P1/P2/P3 from T4.2 fails the neutrality leg.
    fix_if: >-
      The fields say WHAT MUST BE TRUE (P1/P2/P3); the candidate decision says HOW the candidate would make it true.
      That keeps either spike outcome a small diff.
    hermetic: true
    graduation: waive
    graduation_waiver_reason: >-
      Asserts a mid-transition discipline that ends when the spike rules.
  - step: 8
    phase: pre-deploy
    action: >-
      THE RBAC OBLIGATION HAS A LIVE CARRIER AND AN MVP-SIDE GUARANTEE. Three separate reviews pointed at this. The
      carrier must be a live item: T4.5 and T4.6 already match insert_plan / set_plan_status / verb-RBAC in their
      exit_criteria on origin/main and are both deferred_post_mvp, so round 3 first leg was satisfied before the edit
      and could never verify the obligation landed MVP-side. The criterion must also route the split to T4.5/T4.6, and
      the content pin must sit on a live item too.
    command: >-
      bin/venv-python -c "import yaml,pathlib,re;
      d=yaml.safe_load(pathlib.Path('docs/ROADMAP-PLATFORM.yaml').read_text()); t={x['id']: x for x in
      d['tier_items']}; live=[i for i in t if str(t[i].get('status','')) not in ('deferred_post_mvp',)]; rbac=[i for i
      in live if re.search(r'(insert_plan|set_plan_status|verb-RBAC|verb\s+RBAC)', str(t[i].get('exit_criteria','')),
      re.I)]; assert rbac, 'no LIVE tier item carries the Decision 87 clause-5 verb-RBAC obligation as an exit
      criterion -- T4.5 and T4.6 already match on origin/main and are both deferred_post_mvp, so neither can discharge
      an MVP-side obligation'; routed=[i for i in rbac if re.search(r'T4\.(5|6)', str(t[i].get('exit_criteria','')))];
      assert routed, f'the live verb-RBAC criterion on {rbac} does not route the split to T4.5/T4.6, where per-persona
      credentials exist'; pin=[i for i in live if
      re.search(r'(content\s+pin|content\s+hash|writer-minted|plan\s+hash)', str(t[i].get('exit_criteria','')),
      re.I)]; assert pin, 'no MVP-side content-pin guarantee on a live item -- a verb split cannot be enforced while
      every persona presents one identity'; print('OK verb-RBAC carried by', routed, 'routing to T4.5/T4.6; content
      pin carried by', pin)"
    expected: >-
      Exits 0 printing `OK verb-RBAC carried by` then the live carrier and the pin carrier. On origin/main it exits 1
      on the first leg, no LIVE carrier -- the two matching items are deferred_post_mvp. Fault-injected: removing the
      live criterion fails leg 1 (the same fixture PASSES under the round-3 unfiltered command, greened by deferred
      T4.5/T4.6 -- that is the defect); a live criterion that never names T4.5/T4.6 fails the routing leg; parking
      every content-pin phrase on deferred T4.5 fails the pin leg.
    fix_if: >-
      A verb split is unenforceable at MVP: all personas share the runner OIDC identity, so the writer boundary cannot
      distinguish plan_critic from plan_agent. The enforceable substitute is the design own head-SHA idiom applied to
      the plan -- SFN carries (rec_id, revision, ulid-or-hash) and every fetch plus the merge node verifies it,
      failing closed. Write the obligation on the MVP-side item that precedes T4.2 and name T4.5/T4.6 as where the
      split itself lands.
    hermetic: true
    graduation: waive
    graduation_waiver_reason: >-
      Names the carrying items for one transition; they change when T4.5 lands.
  - step: 9
    phase: pre-deploy
    action: >-
      THE READ VERB PINS CONTENT, NOT JUST THE REVISION. merge_key is rec_id alone and revision is caller-supplied, so
      a re-dispatched writer can emit revision N twice with different bodies -- which makes the design determinism
      claim false on the recovery path the substrate is being selected for. The ownership leg is bound to exactly one
      LIVE T4 item and reads exit_criteria only: round 3 matched str(x) over the whole item and was already satisfied
      by T1.3 ("All named read verbs are discoverable from NAMED_READS keys") and by T4.5 decomposition_hints, then
      POOLED criteria across every match, so the content pin could green from an unrelated item text.
    command: >-
      bin/venv-python -c "import yaml,pathlib,re;
      d=yaml.safe_load(pathlib.Path('docs/ROADMAP-PLATFORM.yaml').read_text()); verb=[x for x in d['tier_items'] if
      x['id'].startswith('T4.') and str(x.get('status','')) not in ('complete','deferred_post_mvp') and
      re.search(r'(execution_plan_by_rec|named\s+read\s+verb|plan-fetch verb)', str(x.get('exit_criteria','')),
      re.I)]; vids=[x['id'] for x in verb]; assert len(vids) == 1, f'expected exactly one live T4 item owning the plan
      read verb as an exit criterion; found {vids} (T1.3 and T4.5 match on origin/main and are excluded as complete /
      deferred_post_mvp)'; spec=str(verb[0].get('exit_criteria','')); assert
      re.search(r'(ulid|content\s+hash|writer-minted|idempot)', spec, re.I), f'{vids[0]} does not require pinning a
      writer-minted id or content hash -- (rec_id, revision) is ambiguous under re-dispatch'; print('OK plan read verb
      owned by', vids[0], 'and pins content')"
    expected: >-
      Exits 0 printing `OK plan read verb owned by` and the single item id. On origin/main it exits 1 with found [] --
      T1.3 is complete and T4.5 is deferred_post_mvp, so both are excluded. Fault-injected: removing the criterion
      fails (the same fixture PASSES under the round-3 whole-item command, greened by T1.3 and T4.5); pinning only
      (rec_id, revision) fails the spec leg; putting the ULID wording on a DIFFERENT live T4 item still fails, because
      nothing is pooled; two claimants fail as ambiguous.
    fix_if: >-
      Verified: field_semantics gives ops_execution_plans merge_key rec_id, and save_execution_plan takes revision as
      a caller scalar with no uniqueness on the pair.
    hermetic: true
    graduation: waive
    graduation_waiver_reason: >-
      One verb's spec during one transition.
  - step: 10
    phase: pre-deploy
    action: >-
      EVERY DESIGN IDENTIFIER AND EVERY DOSSIER UNSPECIFIED ENTRY HAS A TRACKED HOME. Round 3 probed the dossier with
      eight substrings of which FIVE already occur on origin/main -- targets (10 hits), closure (50), A0 (41, it
      matches the audit SHA 7d57a0d), RCA rec (13, it matches "source=ci_rca rec") and queue (51, e.g.
      ops_priority_queue) -- and it searched the raw file, so prose anywhere satisfied it. It also listed "worker
      identity", which is NOT one of the eight: that phrase belongs to the dossier Claiming-and-concurrency
      subsection. The real eighth entry is the GitHub credential model for file_pr and merge (PAT versus App, scopes,
      storage, rotation), which had no probe at all and is NOT covered by MECH-1 -- MECH-1 is the SFN-to-GitHub
      dispatch credential, a different one. Every probe here was verified ABSENT on origin/main, and every entry must
      land in a tracked field, not in prose.
    command: >-
      bin/venv-python -c "import yaml,pathlib,re;
      d=yaml.safe_load(pathlib.Path('docs/ROADMAP-PLATFORM.yaml').read_text()); ids=[f'GOV-{i}' for i in
      (1,2,3)]+[f'MECH-{i}' for i in (1,2,3,4)]+[f'DATA-{i}' for i in (1,2,3,4)]+[f'OPS-{i}' for i in (1,2,3,4,5,6)];
      tracked=[(x['id'], str(x.get('exit_criteria',''))) for x in d['tier_items']]+[(c['id'], str(c.get('detail','')))
      for c in d['candidate_decisions']]; prose_only=sorted(i for i in ids if not [e for e, s in tracked if i in s]);
      assert not prose_only, f'identifiers with no exit criterion or CD body tracking them: {prose_only}'; uns={'queue
      seeding for the first queue-fed run':
      r'(seed\w*\s+the\s+priority\s+queue|queue\s+seeding|first\s+queue-fed\s+run)', 'which eligibility predicate is
      authoritative': r'eligibility\s+predicate', 'what reliability-is-proven means numerically':
      r'(reliability\s+is\s+proven|numeric\s+threshold\s+for\s+(each\s+)?autonomy\s+gate|A0.{0,3}A5\s+numeric)',
      'where an executor-authored RCA rec surfaces': r'(executor-rca|executor-postmortem)', 'what counts as done
      across the three closure points': r'(closure\s+adjudicat|closure\s+point|adjudicat\w+\s+between\s+closure)',
      'whether a cross-run failure budget exists': r'(cross-run\s+)?failure\s+budget', 'the GitHub credential model
      for file_pr and merge':
      r'(PAT\s+vers?us\s+(GitHub\s+)?App|GitHub\s+credential\s+model|credential\s+model\s+for\s+file_pr)', 'whether
      ops_recommendations gains a plural targets field': r'(plural\s+targets|targets\s+field|targets\s+VARCHAR)'};
      unhomed=sorted(k for k, p in uns.items() if not [e for e, s in tracked if re.search(p, s, re.I)]); assert not
      unhomed, f'dossier Also-unspecified entries with no tracked home -- each must land in a tier item exit criterion
      or a candidate decision body, not in intent prose: {unhomed}'; print('OK', len(ids), 'identifiers tracked;',
      len(uns), 'dossier entries homed')"
    expected: >-
      Exits 0 printing `OK 17 identifiers tracked; 8 dossier entries homed`. On origin/main it exits 1 on the
      identifier leg with all seventeen absent; each of the eight dossier probes is independently verified to match
      zero times on origin/main, so the second leg is red for its own reason too. Fault-injected: dropping MECH-4
      fails naming it; removing the failure-budget criterion fails naming that entry; writing an entry into intent
      prose instead of a tracked field still fails; answering the eighth entry by pointing at MECH-1 plus a bare
      file_pr mention fails, which is the point.
    fix_if: >-
      A deliberate deferral is a legitimate outcome and the completed routing table must resolve it, but NOT as a
      deferred-status rec: _VALID_STATUSES at scripts/executor/jsonl_store.py:90 admits only open, closed, failed,
      declined and superseded, enforced at scripts/ops_data_portal.py:449 and mirrored in scripts/ops_portal/cli.py:188,
      so that write loud-fails at the portal. deferred exists only in the contract vocabulary at
      docs/contracts/ops_recommendations.yaml:184 -- the very skew this plan files a rec about, not a status to write
      against. Route by the tie-break the constraints now carry: an MVP-boundary or gate-semantics deferral goes to the
      roadmap, which owns gate evaluation and boundary classification today; a one-off not-now goes to a declined rec
      carrying the reason. Either way it is referenced by id from the tracked field, not silence. The eighth entry is the
      file_pr/merge credential model and is distinct from MECH-1; do not discharge one with the other.
    hermetic: true
    graduation: waive
    graduation_waiver_reason: >-
      One design's question set; the next design would have to amend a graduated row.
  - step: 11
    phase: pre-deploy
    action: >-
      NEW RECS ARE FILED AND REFERENCED. Round 2 asserted a non-empty rec-id set against a roadmap that already
      carries 52 distinct ids -- a check that could never fail. This diffs against origin/main, and guards the
      baseline read itself: an empty git show would make the set difference vacuously satisfied.
    command: >-
      bin/venv-python -c "import re,subprocess; head=set(re.findall(r'rec-\d+',
      open('docs/ROADMAP-PLATFORM.yaml').read())); base=set(re.findall(r'rec-\d+',
      subprocess.run(['git','show','origin/main:docs/ROADMAP-PLATFORM.yaml'], capture_output=True,
      text=True).stdout)); assert base, 'the origin/main baseline read back empty -- the diff would be vacuously
      satisfied'; added=sorted(head-base); assert added, f'no NEW rec ids referenced -- base had {len(base)}, head has
      {len(head)}; the out-of-file repairs were not filed'; print('OK', len(added), 'new rec ids referenced:', added)"
    expected: >-
      Exits 0 printing the count and `new rec ids referenced:` with the ids. On origin/main it exits 1 with no NEW rec
      ids -- head and base are identical there (52 and 52), so the set difference is empty. Fault-injected in a
      scratch git fixture: identical head and base fails; substituting a rec id that already exists in the base fails;
      deleting the origin/main ref fails on the new baseline-non-empty leg rather than passing vacuously.
    fix_if: >-
      known_gaps is not a substitute: nothing outside the Pydantic schema reads it, and OQ.1/OQ.2 sat resolved on disk
      for weeks until an audit reconciled them.
    hermetic: true
    graduation: waive
    graduation_waiver_reason: >-
      Asserts one encoding's filing discipline against one base commit.
  - step: 12
    phase: pre-deploy
    action: >-
      THE MERGE-NODE DIFF GUARD, T4-SCOPED AND SINGLE-CRITERION. An earlier draft passed on main via an unrelated T2
      item. Round 3 scoped it to T4 but still ANDed three regexes over the joined exit_criteria blob, so three
      unrelated criteria each carrying one token would have satisfied it -- and T4.13/T4.14 already match diff while
      T4.1 already matches the merge-node alternation on origin/main. All three tokens must now occur in ONE
      criterion.
    command: >-
      bin/venv-python -c "import yaml,pathlib,re;
      d=yaml.safe_load(pathlib.Path('docs/ROADMAP-PLATFORM.yaml').read_text()); t4=[x for x in d['tier_items'] if
      x['id'].startswith('T4.')]; crits={x['id']: ([str(x.get('exit_criteria'))] if isinstance(x.get('exit_criteria'),
      str) else [str(c) for c in (x.get('exit_criteria') or [])]) for x in t4}; guard=[i for i, cs in crits.items() if
      [c for c in cs if re.search(r'\.github/workflows', c) and re.search(r'\bdiff', c, re.I) and re.search(r'(merge
      node|at merge|boundary_patterns|Decision 117)', c, re.I)]]; assert guard, 'no T4 item carries a SINGLE exit
      criterion naming .github/workflows, a diff, and the merge node or the Decision 117 boundary surface -- three
      separate criteria each mentioning one of the three do not constitute the guard'; print('OK merge-node diff guard
      owned by', guard)"
    expected: >-
      Exits 0 printing `OK merge-node diff guard owned by` and the owning ids. Exits 1 on origin/main -- no T4 exit
      criterion names .github/workflows at all. Fault-injected: removing the criterion fails; a decoy that splits the
      three tokens across three separate criteria on the same item still fails.
    fix_if: >-
      ci.yml runs on pull_request, so a same-repo branch runs its own version of the workflow. The guard belongs on
      the plane the agent cannot edit through its own merge loop, and it has to be ONE criterion so the diff, the
      workflow path and the merge node are gated together.
    hermetic: true
    graduation: waive
    graduation_waiver_reason: >-
      Transient placement of one control.
  - step: 13
    phase: pre-deploy
    action: The line ceiling survives, re-measured rather than quoted.
    command: >-
      bin/venv-python -c "import pathlib; n=len(pathlib.Path('docs/ROADMAP-PLATFORM.yaml').read_text().splitlines());
      assert n <= 10000, f'roadmap is {n} lines, over the Decision 114 ceiling'; print(f'OK roadmap {n} lines,
      {10000-n} of headroom')"
    expected: >-
      Exits 0 printing `OK roadmap` then the line count and the headroom. Passes on origin/main too (8,616 lines) -- a
      DECLARED regression guard on the delta size, not a differential. Fault-injected with synthetic fixtures: 10,001
      lines fails naming the ceiling, 9,999 lines passes.
    fix_if: >-
      Do not raise the ceiling. Compress, or move content to a rec per the completed routing table -- which is one
      reason that row exists.
    hermetic: true
    graduation: waive
    graduation_waiver_reason: >-
      validate_platform_roadmap already enforces this ceiling.

test_obligations:
  - source: docs/ROADMAP-PLATFORM.yaml
    behavior: >-
      Schema-valid, acyclic, no live-to-deferred edges, within the ceiling, and free of stale-substrate references in
      every scanned field.
    verification_step: 1
    command: bin/venv-python -m scripts.validate
    waiver_reason: >-
      The roadmap is DATA. Schema, dependency graph, MVP-boundary edges and line ceiling are owned by
      validate_platform_roadmap and the Decision 93 validator, both standing. Steps 3 and 5-13 assert this plan deltas
      mechanically from the parsed document, each one fault-injected against a subject-removed fixture and a decoy
      fixture.
  - source: docs/DECISIONS.md
    behavior: >-
      Decision 87 carries a residency-scoped amendment leaving the authority flip timed to T4.6.
    verification_step: 2
    command: >-
      bin/venv-python -c "import re,pathlib; t=pathlib.Path('docs/DECISIONS.md').read_text(encoding='utf-8');
      m=re.search(r'^## Decision 87:.*?(?=^## Decision |\Z)', t, re.M|re.S); assert m, 'Decision 87 missing';
      b=m.group(0); assert re.search(r'residenc', b, re.I), 'the amendment does not scope the inversion to residency';
      assert re.search(r'prerequisite', b, re.I), 'the amendment does not state the prerequisite'; assert [p for p in
      re.split(r'\n\s*\n', b) if re.search(r'authority', p, re.I) and re.search(r'T4\.6', p)], 'no single paragraph
      states that the AUTHORITY flip stays timed to T4.6 -- the bare word authority is already present on origin/main,
      so the two must co-occur'; assert re.search(r'circular', b, re.I), 'the amendment does not name the
      circularity'; print('OK Decision 87 residency-scoped,', len(b.encode()), 'bytes')"
    red_green_expectation: >-
      Red on origin/main: residency is absent from Decision 87, and the authority-and-T4.6 leg is paragraph-scoped
      because the bare word authority is already present there. Green once the residency-scoped amendment lands.
  - source: docs/contracts/decision-entry.yaml
    behavior: >-
      significance.routing gains a work_item row stating the migration direction and resolving deliberate deferral,
      and routing_rule is extended to reach it.
    verification_step: 4
    command: >-
      bin/venv-python -c "import yaml,pathlib,re;
      d=yaml.safe_load(pathlib.Path('docs/contracts/decision-entry.yaml').read_text()); sig=d['significance'];
      rows=sig['routing']; assert 'work_item' in rows, f'no work_item routing row -- significance.routing carries only
      {sorted(rows)}'; row=str(rows['work_item']); rule=str(sig.get('routing_rule','')); assert
      re.search(r'(bootstrap|supersede|destination\s+form|migration)', row, re.I), 'the work_item ROW does not state
      the migration direction; matching that vocabulary anywhere else in the significance block does not count';
      assert re.search(r'(cross_tier_gate|cross-tier\s+gate|deferred_post_mvp|MVP\s+boundary|exit_criteri)', row,
      re.I), 'the work_item ROW does not name what the roadmap uniquely provides today'; assert
      re.search(r'(defer|not-now|declined)', row + ' ' + rule, re.I), 'neither the work_item row nor routing_rule
      resolves a deliberate deferral with a reason'; assert 'work_item' in rule, 'routing_rule question set was not
      extended to reach the work_item row'; print('OK routing table completed:', sorted(rows))"
    red_green_expectation: >-
      Red on origin/main: routing carries only cd_state_flip, field_semantics, numbered_decision and operational_fact.
      Green once the work_item row lands with the migration direction and the roadmap-unique capability in the ROW
      itself -- planting that vocabulary in another row does not green it.
  - source: docs/decisions-index.json
    behavior: >-
      The committed index matches the amended corpus.
    verification_step: 1
    command: bin/venv-python -m scripts.validate
    waiver_reason: >-
      A generated projection. validate_decisions_index_freshness is a standing check that fails on drift or absence,
      with a regenerate hint. A bespoke test would assert the generator against itself.

constraints:
  - >-
    THE ROUTING RULE IS A MIGRATION DIRECTION, NOT A STATIC BOUNDARY. The operator's long-term vision
    is that recommendations SUPERSEDE the roadmap -- they are the same thing, and the roadmap is the
    bootstrap. ops_recommendations already carries dependencies VARCHAR[], so the dependency-graph
    primitive exists today. Therefore write the row to name what the ROADMAP UNIQUELY PROVIDES NOW --
    cross-tier gate evaluation, MVP-boundary classification, per-criterion exit lifecycle -- and
    default everything else to a rec. As recs gain those capabilities the boundary moves on its own,
    with no rewrite. Do NOT enumerate topics; a topic list would freeze the boundary exactly where the
    vision says it must not stay.
  - >-
    EXTEND decision-entry.yaml; DO NOT ADD A CONTRACT. The `none_grandfathered` evaluator kind is
    gone, so every new depth-1 Class D contract needs a RESOLVING evaluator and there is no debt
    record to fall back on. ATTRIBUTION, corrected: Decision 168 clause 3 PERMITTED
    `absent -> none_grandfathered` on baseline-present files -- it did NOT retire the kind. rec-3059
    wave 2 (PLAN-class-d-enforcers-wave-2, 2026-08-16) converted the last two carriers
    (composite-action-shape, iam-simulate-fixture) to resolving `{check: <name>}` evaluators and then
    retired the kind itself: the EnforcementRoute model and the EvaluatorSpec.none_grandfathered
    field no longer exist, so it is unrepresentable rather than merely discouraged. See
    contract-population.yaml's 2026-08-16 amendment_log entry and
    retirement_notes.evaluator_none_grandfathered. The conclusion is STRONGER under the correct
    attribution, not weaker. No in-scope surface can serve as a resolving evaluator, and declaring a
    check would be a second new mechanism. Extending inherits validate_decision_entry_conformance and
    removes the two-routers contradiction with :397's operational_fact row in the same edit.
    Because decision-entry.yaml is itself a Class D contract, the same edit MUST add a new
    `amendment_log[]` entry (contract-population.yaml change_detection.amendment_log) -- the
    obligation is symmetric with the decisions-index regeneration the scope already names.
  - >-
    THIS PLAN SELECTS NO SUBSTRATE. The spike does, after this encoding. Leave CD.43 criteria-only.
    VP step 5 fails if a selection appears.
  - >-
    AMEND DECISION 87 SCOPED TO RESIDENCY. Warehouse RESIDENCY of executor plans is the prerequisite;
    the AUTHORITY flip for the human PLAN-*.yaml surface stays timed to T4.6. A wholesale inversion
    would supersede Decision 85's git clause pre-producer and cost human plans their diff review for
    nothing.
  - >-
    THE VERB SPLIT CANNOT BE ENFORCED AT MVP. Every persona presents one identity at the writer
    boundary, so server-side role scoping distinguishes nothing. The MVP guarantee is a CONTENT PIN --
    SFN carries (rec_id, revision, ulid-or-hash) and every fetch plus the merge node verifies it. The
    verb split routes to T4.5/T4.6 where per-persona credentials exist.
  - >-
    KEEP LIFECYCLE FIELDS SUBSTRATE-NEUTRAL. Use CD.27's P1/P2/P3 property language in exit_criteria;
    confine candidate mechanism to the candidate decision body. Purging the incumbent's vocabulary
    while admitting the candidate's makes ruling for the incumbent cost a re-sweep and ruling for the
    candidate cost nothing -- switching-cost bias, and ESB-05 with the sign flipped.
  - >-
    NO VACUOUS ASSERTIONS -- AND THE STANDARD IS THREE FAULT INJECTIONS, NOT ONE ORIGIN/MAIN RUN.
    Rounds 1, 2 and 3 each shipped checks that could not fail (enumerated in the vacuous-assertions
    context bullet). The earlier form of this constraint demanded that EVERY hermetic command be
    confirmed RED on origin/main; that is both self-contradictory and the wrong standard -- steps 7
    and 13 are DECLARED regression guards that pass on main by design, two reviewers ruled that
    legitimate, so the constraint could never be discharged as written; and a single red-on-main run
    proves only that the subject is absent from main, not that the assertion DISCRIMINATES. The bar
    is now three proofs per assertion leg: (1) RED on origin/main for the reason its `expected`
    names; (2) RED against a SUBJECT-REMOVED fixture -- the subject of that leg deleted from an
    otherwise-final tree; and (3) RED against a DECOY fixture that satisfies a WRONG leg -- the
    vocabulary planted in a neighbouring row, field, item or paragraph the check must not accept.
    EXEMPTION, named explicitly: verification_plan steps 7 and 13 are DECLARED REGRESSION GUARDS and
    PASS on origin/main by design; leg (1) is waived for those two steps and for no others. They are
    NOT exempt from legs (2) and (3) and must still be fault-injected in the removed direction --
    step 7 with candidate mechanism injected into each of the five scanned fields and with P1/P2/P3
    stripped from T4.2, step 13 with a 10,001-line fixture. The results are RECORDED per assertion,
    per the matching execution step; a constraint on its own has now failed three times.
  - >-
    DO NOT TOUCH THE FROZEN EXECUTOR. scripts/executor/ is Life 1, retiring by deletion. Roadmap-side
    only, and the sweep includes the siblings round 1 missed -- T4.9a and T4.8 both declare NEW files
    inside that tree, alongside T3.10.
  - >-
    V2, AND THE FLOOR IS ARGUED. Two YAML documents, one markdown amendment, one regenerated index,
    and portal calls. No resource-affecting scope, so the deterministic V-tier floor is not reached.
  - >-
    ONE PLANS TABLE -- OPERATOR RULING. `ops_plans` and `ops_plan_revisions` DO NOT EXIST. Verified:
    absent from config/lambda/ducklake/field_semantics.yaml's `ops_tables` (which holds ops_decisions,
    ops_execution_plans, ops_priority_queue, ops_recommendations, ops_session_log, ops_smoke_events),
    absent from docs/contracts/storage-substrate.yaml, and referenced by zero lines of code -- they
    exist ONLY as the proposal in Decision 87 clause 4, in T4.5/T4.6's intents, and in prose that
    quotes them. Meanwhile `ops_execution_plans` is `status: live` on DuckLake-on-Neon and already
    carries plan_text, steps, revision, status and critique_history. The operator has ruled: there
    must be only ONE plans table, and the two names were most likely a mistake. So: amend Decision 87
    clause 4 to name a SINGLE plans table; retire the ops_plans / ops_plan_revisions split as
    retired-before-built (no migration, no deprecation window, nothing to delete -- neither table was
    ever created); and re-point T4.5's intent at EXTENDING the live table rather than constructing new
    entities. Clause 4's separate-revisions-table idea is UNNECESSARY: the table's write_mode is scd2
    and storage-substrate.yaml already records its grain as `one row per plan revision (rec_id,
    revision); current = latest revision per rec_id`, so per-revision history exists by construction.
    Clause 5's verb-RBAC is a WRITER concern, not a schema one, and survives the consolidation
    untouched -- do not fold it into clause 4.
  - >-
    THE PLANS-TABLE NAME IS AN OPEN OPERATOR DECISION -- DO NOT RESOLVE IT. Record both options and
    the fact that decides them, and write every edit so the consolidation lands under EITHER name.
    Option A, keep `ops_execution_plans`: zero edits to field_semantics.yaml, storage-substrate.yaml,
    scripts/ops_portal/execution_plans.py, scripts/sync/ops.py or the reader verbs. Option B, rename
    to `ops_plans`: Decision 87's own vocabulary, and the better name once the table holds human plans
    as well as executor ones. THE DECIDING FACT: storage-substrate.yaml records
    `graduation_blocker: CD.17 reversal + executor resume (table lands empty until then)`, so the
    table has NO ROWS -- a rename costs no data migration today, and gets steadily more expensive from
    the moment the executor starts writing. Write `the single plans table (name TBD -- see the open
    naming decision)` and carry the deciding fact with it; do not name a winner in the roadmap, in the
    Decision 87 amendment, or in the candidate decision.
  - >-
    THE WAREHOUSE ROW IS THE SOLE PLAN ARTIFACT -- DO NOT IMPORT THE DESIGN'S DUAL WRITE. The design's
    stage 04 publishes both the plan document to S3 AND the queryable projection to
    ops_execution_plans. That dual write is REJECTED: the table carries `plan_text`, so the plan BODY
    is already in the row, and an S3 document would be a second copy behind a second read path with no
    reconciliation story. The execution step that authors the candidate decision says to record the
    two-plane design, and a FAITHFUL transcription would import the dual write with nothing failing --
    which is exactly why this is written as an instruction rather than left to the transcriber's
    judgement. Transcribe selectively: the warehouse row is the sole plan artifact; if S3 is mentioned
    at all, it is mentioned as considered-and-rejected, with the plan_text reason.
  - >-
    A CRITIQUE VERDICT IS NEVER WRITTEN BY THE CRITIQUED PARTY. `critique_history` is a COLUMN on the
    plan row (field_semantics.yaml `ops_tables.ops_execution_plans.columns.critique_history`), and its
    only write path is `save_execution_plan` (scripts/ops_portal/execution_plans.py), which takes a
    whole ExecutionPlan dict -- the PLANNER's write path. Taken literally that leaves exactly two
    shapes and both are forbidden: either the critic re-submits the entire plan body (a critic that
    can rewrite the plan it critiqued), or the planner records the critique against itself. Decision
    87 clause 5 exists to forbid precisely that pair. The encoding must therefore state that critique
    verdicts are written by the CRITIC or by the GATE, never by the critiqued persona -- and that the
    content pin's hash is scoped to the plan BODY EXCLUDING `critique_history`, because a pin taken
    over the whole row is invalidated by every critique append and would fail closed on the loop's
    normal path. Naming the boundary is in scope here; BUILDING the split verb is not -- that routes
    to T4.5/T4.6 with the rest of the verb split.
  - >-
    THE work_item ROW MUST CARRY THE LITERAL `Never a numbered Decision`.
    scripts/checks/decisions/validate_decision_entry_conformance.py rejects a claimed routing row ONLY
    when that row's own contract text contains the exact literal string `Never a numbered Decision`
    (`_NEVER_NUMBERED_DECISION_TEXT`, tested in `_significance_issues`). The `operational_fact` and
    `field_semantics` rows carry it; `numbered_decision` and `cd_state_flip` deliberately do not. A
    work_item row that omits it silently makes `significance.value: work_item` CLAIMABLE on a numbered
    Decision entry -- the exact contradiction the check exists to catch, and a new one this plan would
    have introduced. Write the literal into the ROW BODY verbatim; do not paraphrase it, do not put it
    only in routing_rule, and do not rely on the check inferring intent.
  - >-
    `deferred` IS NOT A WRITABLE REC STATUS. `scripts/executor/jsonl_store.py:90` sets
    `_VALID_STATUSES = {open, closed, failed, declined, superseded}`, enforced at
    `scripts/ops_data_portal.py` (and matched by `--status` choices in scripts/ops_portal/cli.py).
    `deferred` exists only in CONTRACT vocabulary (docs/contracts/ops_recommendations.yaml:184 lists
    `open, closed, in_progress, deferred, ...`) -- it is precisely the contract-versus-code skew this
    plan files a rec about, so do not discharge a deferral by writing a status the portal rejects. A
    deliberate deferral is `--update-rec <id> --status declined` with a resolution stating why-not-now
    and what would reopen it, OR a roadmap tier item / exit criterion. TIE-BREAK, because
    `we will not decide X yet` currently routes BOTH ways: this plan's own routing constraint makes
    MVP-boundary classification a capability the ROADMAP uniquely provides today, and deferring
    executor work IS an MVP-boundary classification. So -- a deferral that classifies work relative to
    the MVP boundary, or that needs gate/exit-criterion lifecycle, goes to the ROADMAP; a deferral
    that is a one-off not-now-for-this-reason with no boundary and no gate semantics goes to a
    `declined` rec. VP step 10's fix_if still reads `a rec carrying a deferred status`; that phrasing
    is SUPERSEDED by this constraint. The verification_plan is frozen (its assertions are
    fault-injected and proven), so it was deliberately not edited in place.

context:
  - >-
    THE DESIGN -- REQUIRED READING:
    https://claude.ai/code/artifact/a591749c-cc12-4b5e-b582-ac03595e04dc ("Two-Plane Executor"). Step
    Functions keeps the state machine and carries IDENTIFIERS ONLY; GitHub Actions runs every persona
    and every verification gate, all LiteLLM in-process; the plan artifact lives in
    ops_execution_plans and is fetched by named verb. Open register: GOV-1..3, MECH-1..4, DATA-1..4,
    OPS-1..6.
  - >-
    THE DOSSIER -- the second required reading:
    https://claude.ai/code/artifact/a290d222-4200-4f2e-a74c-2f9cf07c370f. Two systems share the name
    "executor": Life 1, frozen and retiring by deletion, and Life 2, zero of sixteen T4 items started.
    Explicitly not authoritative over the roadmap -- which is why its claims need encoding here.
  - >-
    THE LONG-TERM VISION THIS ENCODING MUST NOT FORECLOSE, stated by the operator: recommendations
    eventually SUPERSEDE the roadmap. They are the same thing; the roadmap bootstraps the rec system,
    and the destination is dependency graphs built from rec edges. ops_recommendations already carries
    dependencies VARCHAR[]. That is why the routing row is written as a capability test rather than a
    topic list -- a topic list would freeze the boundary, and this boundary is meant to move.
  - >-
    WHY DECISION 87 IS AMENDED, AND WHY ROUND 2's AMENDMENT WAS TOO BROAD. Clause 2 times the
    git-to-warehouse flip to the autonomous producer's existence, while T4.5's deferral rationale is
    "no warehouse consumer of plans exists until the T4.6 loop" -- a consumer this design creates at
    MVP. Round 2 inverted the whole flip. But the cycle is only in RESIDENCY: the producer needs its
    plans queryable. It does not need AUTHORITY -- executor plans are born warehouse-native and never
    had a git life, so there is nothing to flip for them, while human PLAN-*.yaml keep git/PR diff
    review, which is exactly what clause 2 protected.
  - >-
    THE THREE-LENS RESULT, ROUND 2. Design merit: SOUND_WITH_RESERVATIONS, and it withdrew its
    round-1 S3-primary reservation after verifying that ops_execution_plans carries plan_text -- the
    body is in the table, so an S3 document would be a second copy. Placement: BLOCK, but six of nine
    round-1 findings verified closed red-on-main. Consistency: BLOCK, three blocking, one of which
    (the co-shipped spike plan) is resolved by dropping that plan at the operator's direction.
  - >-
    VACUOUS ASSERTIONS ACROSS THREE ROUNDS -- AN OPEN PATTERN, NOT SETTLED HISTORY, AND THE FIX IS A
    METHOD. Rounds 1-2 shipped five: a `slug` grep satisfied by pre-existing text; an `[Amendment`
    marker already present sixteen times; a `T4.5` match already in Related; a rec-id set already
    holding 52 ids; and a CD.17 leg targeting `unplanned_resume_rate`, which lives in CD.27 and never
    appeared in CD.17. ROUND 3 FOUND MORE, NOT FEWER -- at least four further legs that were already
    satisfied on origin/main before any edit: the routing disjunct greened by the pre-existing
    operational_fact row at :393; the verb-RBAC leg greened by deferred T4.5/T4.6, which could never
    verify an MVP-side obligation; the plan-read-verb leg greened by T1.3 and T4.5 under a whole-item
    `str(x)` match; and the merge-node guard satisfiable by three unrelated criteria each carrying one
    of its three tokens. On top of those, five of the eight dossier probes (`targets`, `closure`,
    `A0`, `RCA rec`, `queue`) matched on origin/main on their own, and a sixth listed entry
    (`worker identity`) was not even one of the eight. That is NINE OR MORE distinct
    non-discriminating legs across THREE rounds, and the count rose every round. Every one was an
    assertion that was TRUE rather than one that DISCRIMINATED. The fix is NOT another constraint --
    three rounds of constraints have now failed to stop it. The fix is FAULT INJECTION AS A METHOD,
    with a per-assertion result recorded before handoff: see the no-vacuous-assertions constraint and
    the execution step that makes recording it a deliverable.
  - >-
    THE PLANS TABLE ALREADY EXISTS, AND THERE IS ONLY ONE. Verified against the tree, not against
    Decision 87's prose: `ops_plans` and `ops_plan_revisions` appear in no schema, no contract and no
    code -- only in Decision 87 clause 4, in T4.5/T4.6's intents, and in downstream plan/contract
    prose that quotes them. `ops_execution_plans` is `status: live` on DuckLake-on-Neon
    (docs/contracts/storage-substrate.yaml), write_mode scd2, merge_key rec_id, grain `one row per
    plan revision (rec_id, revision); current = latest revision per rec_id`, and its columns already
    include plan_text, steps, revision, status and critique_history. The operator has ruled that there
    is ONE plans table. This encoding therefore retires a two-table split that was never built, which
    costs nothing today and removes a second surface T4.5 would otherwise have had to construct. What
    it does NOT do is pick the surviving NAME -- that is left open, with the deciding fact recorded
    (the table is empty until CD.17 reversal, so a rename is free now and never cheaper later).
  - >-
    TWO DESIGN CONCERNS THE EARLIER DRAFTS ADDRESSED NOWHERE. (a) The design's stage 04 publishes the
    plan document to S3 AND a projection to ops_execution_plans. The table carries plan_text, so the
    body is already in the row and the S3 copy is a second artifact with a second read path -- the
    round-2 design-merit lens withdrew its own S3-primary reservation for exactly this reason, yet an
    execution step still tells the implementer to record the two-plane design, and a faithful
    transcription would re-import the dual write with nothing failing. (b) `critique_history` is a
    column on the PLAN row whose only write path is `save_execution_plan`, the planner's path -- so a
    literal reading forces either a critic that can rewrite the plan it critiqued, or a planner that
    records the verdict against itself. Both are what Decision 87 clause 5 exists to forbid. Neither
    concern is machine-detectable from the current verification plan, which is why both are now
    written as constraints and as execution-step instructions rather than left to review. It selects no substrate, ratifies nothing, and builds
    nothing. It does not resolve MECH-1's credential model or MECH-3's continuation -- it gives them
    owners. It does not fix AGENTS.md's ops_execution_plans backend claim, the missing NAMED_READS
    verb, the contract status-vocabulary skew (three-way: ops_recommendations.yaml:184
    lists `in_progress` and `deferred`, which _VALID_STATUSES rejects, AND omits `failed`, which it
    accepts) or the boundary-pattern drift; those are filed as recs and
    referenced by id. And it does not touch the frozen Life-1 executor.

