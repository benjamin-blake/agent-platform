acceptance_criteria:
  - >-
    All 20 seedable free-form docs/contracts/*.yaml files carry a valid Class D `contract:` block
    with a unique `subject`; every file registered in file-router.yaml has `subject` equal to its
    route `topic`.
  - >-
    Twelve of the 21 files declare a genuinely RESOLVING evaluator (check or agent_surface) under
    the gate's own resolve_evaluator; no file declares an evaluator that does not resolve.
  - >-
    Every `none_grandfathered` claim carries a complete enforcement_route (reason, consumer,
    mechanism, blocker, shape); the schema REJECTS an incomplete one, proven by a failing test.
  - >-
    `validate_contract_drift` fails when `census.grandfathered` exceeds `ratchet.grandfathered_max`
    -- the pin is bound to reality, not merely direction-guarded.
  - >-
    `ratchet.grandfathered_max` is 19, `status_active_max` is 16, and
    `evaluator_none_grandfathered_max` is 8, each matching the live census exactly.
  - >-
    `validate_decisions_size` APPENDS to `failed` for a new-in-diff entry over 6,144 bytes, and
    still never measures a historical entry; docs/contracts/decision-entry.yaml's
    `size_governance.per_entry_size_norm.tier` states hard-fail, matching the code.
  - >-
    The evaluator matcher accepts a path-shaped literal ending in the contract basename and
    REJECTS a whitespace-bearing prose literal ending in the same basename.
  - "`bin/venv-python -m scripts.validate` (full tier) exits 0."
verification_plan:
  - step: 1
    phase: pre-deploy
    action: Structured enforcement route is mandatory -- an incomplete none_grandfathered claim is rejected by the schema
    command: bin/venv-python -m pytest tests/test_contracts.py tests/checks/contracts/validate_contract_drift/test_grandfather_only.py -q
    expected: Tests pass; a none_grandfathered claim missing mechanism/consumer/blocker/shape raises ValidationError
    fix_if: A bare-string or partial route is accepted -- the debt record is optional again, which is the failure this plan exists to prevent
    graduation: graduate
    graduation_check_id: enforcement-route-required-on-none-grandfathered
  - step: 2
    phase: pre-deploy
    action: Path-shaped matcher accepts a full-path literal AND rejects a whitespace-bearing prose literal
    command: bin/venv-python -m pytest tests/checks/contracts/test__population.py -q
    expected: Both pass -- docs/contracts/decision-entry.yaml resolves; the _write_companions.py prose sentence ending in iam-simulate-fixture.yaml does NOT
    fix_if: The prose case resolves -- the matcher certifies a comment as an evaluator, exactly the "mention, not reading" loophole the rule exists to close
    graduation: graduate
    graduation_check_id: evaluator-matcher-rejects-prose-literal
  - step: 3
    phase: pre-deploy
    action: Every seeded contract's declared evaluator genuinely resolves against the real tree
    command: bin/venv-python -m pytest tests/checks/contracts/validate_contract_drift/test_evaluator_resolution.py tests/checks/contracts/validate_contract_drift/test_real_population.py -q
    expected: Pass; no declared check/agent_surface evaluator fails resolution
    fix_if: A declared evaluator does not resolve -- correct the declaration to none_grandfathered WITH a route, never weaken the matcher to fit
    graduation: waive
    graduation_waiver_reason: >-
      Asserts the live census and the current declared-evaluator set, both of which legitimately
      change as contracts are added or enforcers are built under rec-3059; a graduated registry
      slot would go stale on the next contract and force a waiver detour every time.
  - step: 4
    phase: pre-deploy
    action: The ratchet pin is bound to reality -- an unshaped 22nd file fails against grandfathered_max
    command: bin/venv-python -m pytest tests/checks/contracts/test__ratchet.py tests/checks/contracts/validate_contract_drift/test_ratchet.py -q
    expected: Pass, including a case where census.grandfathered exceeds the pin and the gate FAILS
    fix_if: An over-pin census passes -- the ratchet is still decorative and part (c) delivered nothing
    graduation: graduate
    graduation_check_id: contract-population-pin-bound-to-census
  - step: 5
    phase: pre-deploy
    action: Live census matches the three declared pins exactly
    command: 'bin/venv-python -m scripts.validate --pre 2>&1 | grep -E "Census: scanned=40 ritual=16 declared=5 grandfathered=19 evaluator_none_grandfathered=8 status_active=16 skipped=0"'
    expected: The census line matches verbatim
    fix_if: Any bucket differs -- re-derive the pins from the scan, never hand-edit a pin to match a wrong assignment (Decision 168 reversal (b), "correct the count, never round up")
    graduation: waive
    graduation_waiver_reason: >-
      The exact bucket values are this landing's install-time census and legitimately move as
      contracts are seeded or enforcers land; step 4 graduates the invariant (pin >= census) that
      must hold permanently, which is the durable property.
  - step: 6
    phase: pre-deploy
    action: Per-entry decision-size cap now HARD-FAILS a new over-cap entry
    command: bin/venv-python -m pytest tests/checks/decisions/test_validate_decisions_size.py -q
    expected: A new-in-diff entry over 6,144 bytes appends to `failed`; a historical over-cap entry still does not
    fix_if: The over-cap new entry only warns -- Decision 167 clause 3's pre-commitment has not actually fired
    graduation: graduate
    graduation_check_id: decisions-per-entry-cap-hard-fails
  - step: 7
    phase: pre-deploy
    action: Contract and code agree on the cap's tier (CFG-06 parity)
    command: 'grep -A2 "per_entry_size_norm" docs/contracts/decision-entry.yaml | grep -q "cap_bytes: 6144" && grep -q "hard-fail" docs/contracts/decision-entry.yaml'
    expected: Both present -- the contract states hard-fail, matching validate_decisions_size.py
    fix_if: The contract still says WARN -- the field-semantics home contradicts the enforcing code, reproducing the exact drift class this sweep exists to close
    graduation: graduate
    graduation_check_id: decision-entry-tier-matches-validator
  - step: 8
    phase: pre-deploy
    action: The instruction-architecture check fails loudly on a missing contract instead of passing vacuously
    command: bin/venv-python -m pytest tests/checks/contracts/test_validate_instruction_architecture_layers.py -q
    expected: Pass, including a new case where an absent contract file produces a failure rather than a silent stub-dict fallback
    fix_if: The absent-contract case still passes -- the evaluator declaration is cosmetic and the check can pass while reading nothing
    graduation: graduate
    graduation_check_id: instruction-architecture-contract-presence-required
  - step: 9
    phase: pre-deploy
    action: Structural-size budget bump is loud, not inherited
    command: grep -q "iam-simulate-fixture.yaml" config/structural_size_budgets.yaml && grep "iam-simulate-fixture" config/structural_size_budgets.yaml | grep -q "dec-168"
    expected: The entry cites dec-168 with a reason naming this sweep, not the stale dec-166 install-time census text
    fix_if: The dec-166 marker is still in place -- per Decision 166 point 6 the marker matches the KEY not the VALUE, so the raise would pass silently (Decision 128 spirit violation)
    graduation: graduate
    graduation_check_id: iam-simulate-budget-marker-recited
  - step: 10
    phase: pre-deploy
    action: Fast presubmit green end to end
    command: bin/venv-python -m scripts.validate --pre
    expected: Exit 0, "All checks passed"
    fix_if: Any check fails -- diagnose and fix on branch; never weaken a gate to land the sweep
    graduation: not-applicable
  - step: 11
    phase: pre-deploy
    action: Full validation green before handoff
    command: bin/venv-python -m scripts.validate
    expected: Exit 0
    fix_if: Any check fails -- forward-fix per the CI-failure protocol, never auto-revert
    graduation: not-applicable
test_obligations:
  - source: scripts/contracts_schema.py
    behavior: A none_grandfathered claim without a complete enforcement route must be rejected at model construction.
    verification_step: 1
    test_selector: tests/test_contracts.py::TestEvaluatorSpec::test_none_grandfathered_requires_complete_enforcement_route
    red_green_expectation: red before (free-text string accepted), green after (ValidationError on incomplete route)
  - source: scripts/checks/contracts/_population.py
    behavior: A path-shaped literal ending in the basename resolves; a whitespace-bearing prose literal ending in the same basename does not.
    verification_step: 2
    test_selector: tests/checks/contracts/test__population.py::TestModuleContainsLiteral::test_prose_literal_with_whitespace_is_rejected
    red_green_expectation: red before (no path-shaped support at all), green after
  - source: scripts/checks/contracts/_ratchet.py
    behavior: The gate fails when census.grandfathered exceeds ratchet.grandfathered_max, and the two new counter pins guard their own direction.
    verification_step: 4
    test_selector: tests/checks/contracts/test__ratchet.py::TestPinBinding::test_census_over_pin_fails
    red_green_expectation: red before (module absent; pin never compared to census), green after
  - source: scripts/checks/contracts/validate_contract_drift.py
    behavior: Pass 1 rejects a Class D file whose none_grandfathered route is incomplete, and the ratchet leg enforces all three pins.
    verification_step: 1
    test_selector: tests/checks/contracts/validate_contract_drift/test_grandfather_only.py::TestEnforcementRoute::test_incomplete_route_fails
    red_green_expectation: red before, green after
  - source: scripts/checks/contracts/validate_instruction_architecture_layers.py
    behavior: An absent or unparseable instruction-architecture.yaml fails the check instead of silently falling back to a stub dict.
    verification_step: 8
    test_selector: tests/checks/contracts/test_validate_instruction_architecture_layers.py::TestContractPresence::test_missing_contract_fails
    red_green_expectation: red before (passes vacuously), green after
  - source: scripts/checks/decisions/validate_decisions_size.py
    behavior: A new-in-diff decision entry over the 6,144-byte cap appends to `failed`; historical entries are still never measured.
    verification_step: 6
    test_selector: tests/checks/decisions/test_validate_decisions_size.py::TestPerEntryCap::test_new_over_cap_entry_fails
    red_green_expectation: red before (WARN only, `failed` untouched), green after
constraints:
  - >-
    NO new numbered Decision. Decisions 167 (clause 3) and 168 (reversal (b), which names this
    sweep as its own completing act) pre-authorize everything here. Routing claim, stated
    explicitly per the Decision 150 clause 1 field-semantics row + Decision 86/127: the evaluator
    grammar, route grammar, and pin values are field semantics whose home is
    docs/contracts/contract-population.yaml, not a numbered entry.
  - >-
    Build NO enforcers for the 9 unenforced files. This plan produces the ROUTE DESIGN only;
    building is rec-3059's scope. Explicit human ruling this session.
  - >-
    Do NOT restructure exit-criteria-ledger.yaml to get past the smuggling detector. It is
    genuinely Class-A-field-shaped and the detector is correct to reject it; it stays free-form as
    the single named exception, with its route recorded in contract-population.yaml.
  - >-
    Do NOT fix read-engine.yaml's verb drift here (rec-3095). The route records it as the proving
    instance for the verb-parity enforcer built under rec-3059.
  - >-
    Never weaken a gate to make the sweep land. If a declared evaluator does not resolve, correct
    the declaration to none_grandfathered WITH a route -- do not loosen the matcher to fit.
  - >-
    Decision 128 decompose-by-default: _population.py is at 402/500 SLOC; the ratchet work goes in
    the new _ratchet.py. Never raise a SLOC budget to absorb this plan.
  - >-
    Decision 169: check edits stay inside scripts/checks/<domain>/ and its _manifest.py -- never
    scripts/validate.py.
  - "No rescue agents or workaround loops (Decision 55)."
context:
  - >-
    "Decision-scout verdict + CITE list (verbatim decision ids)": FLAGS_FOUND (122 of 122 triaged,
    no BLOCK). CITE: Decision 168, Decision 167, Decision 165, Decision 166, Decision 150,
    Decision 86, Decision 118, Decision 169, Decision 163, Decision 48.
  - "gates: decision-scout=FLAGS_FOUND; plan-critique=<verdict> after <N> round(s)"
  - >-
    Scout flag D168 WARN (resolved in scope): 5 router-registered files have topics that differ
    from their basename -- inference-provider -> model-routing-config, instruction-architecture ->
    instruction-architecture-contract, deploy-paths -> deploy-paths-navigation, decision-entry ->
    decision-entry-contract, overseer-dispatch -> overseer-dispatch-contract. Subject takes the
    route topic; router topics are NOT renamed (other surfaces cite them).
  - >-
    Scout flag D128 SPIRIT WARN (resolved in scope): config/structural_size_budgets.yaml:186
    already carries "# raise-approved: dec-166 contracts class grandfather, install-time census".
    Per Decision 166 point 6, authorization_failure matches the entry KEY never its VALUE, so one
    marker permanently authorizes every future bump of that entry -- the iam-simulate-fixture raise
    would otherwise land silently. The marker reason is rewritten and re-cited to dec-168.
  - >-
    Scout flag D168 NOTE / D150 NOTE (accepted): the path-shaped matcher makes the enforced rule
    broader than Decision 168 clause 2's prose. Landed via contract + amendment_log under D168
    reversal (a) ("extend the union, never bypass the resolution bar"); a full-path literal is
    STRONGER evidence of reading than a bare basename, and per D168's own Significance clause the
    contract is the SoT for the evaluator grammar.
  - >-
    VERIFIED BY AST, NOT GREP (the task brief's premise was materially wrong here): of the ~10
    files claimed to be "loaded via full-path literals but invisible to the matcher", only TWO are
    -- decision-entry.yaml (validate_decision_entry_conformance, validate_decision_currency) and
    github-actions-evidence.yaml (validate_actions_evidence). deploy-paths, composite-action-shape,
    ci-rca-lifecycle and candidate-decision-ratification have NO code loader at all (docstrings and
    comments only). inference-provider, log-storage and iam-simulate-fixture have real loaders that
    are not reachable from any registered check. instruction-architecture is blocked by a dynamic
    importlib load two hops out, not by the matcher.
  - >-
    MATCHER TRAP (must not regress): a naive endswith rule FALSELY resolves iam-simulate-fixture.yaml,
    because scripts/checks/iam_tf/_write_companions.py ends a long prose annotation string with that
    path and is one-hop-imported by validate_ci_refresh_read_coverage. The matcher must reject any
    literal containing whitespace.
  - >-
    ENFORCEMENT ROUTE MAP (the discovery deliverable this plan exists to produce; transcribe into
    each file's enforcement_route). read-engine -> src/common/ducklake_reads.py NAMED_READS; assert
    read_surface.named_verbs.verbs == NAMED_READS keys; blocker no registered check owns the reader
    verb registry; shape check. marker-grammar -> scripts/checks/_marker_guard.py; assert __all__ ==
    binding_surface.exports (verified identical, 8 == 8 today -- cheapest route); blocker no check
    reads the contract; shape check. composite-action-shape ->
    scripts/checks/ci_guards/_workflow_shell_bodies.py; have the guard read rules/known_r1_violators
    from the contract instead of its hardcoded _R1_KNOWN_VIOLATORS second copy; blocker the guard
    hardcodes what the contract declares; shape check. log-storage -> scripts/s3_log_store.py;
    PROMOTE the existing tests/s3_log_store/test_write_through_registry.py to a registered check;
    blocker the assertion exists only as a test; shape check. telemetry-lexicon -> none;
    assert lexicon.model.canonical_tables each resolve to a Class A contract and collapses targets
    are valid (all four exist today -- buildable now, NOT gated on T2.36); blocker no check exists;
    shape check. inference-provider -> scripts/llm/model_registry.py; assert provider_defaults /
