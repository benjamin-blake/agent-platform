    action: Modify
    purpose: >-
      Seed the Class D block (subject decision-entry-contract per its file-router topic), AND flip
      size_governance.per_entry_size_norm.tier from WARN to hard-fail -- this key is the
      field-semantics home for the tier, so leaving it stale reproduces the CFG-06 defect class.
