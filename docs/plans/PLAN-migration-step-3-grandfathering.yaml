slug: "migration-step-3-grandfathering"
intent: >-
  Complete migration step 3 of audits/contract-first-governance-33c8667.yaml by seeding the 21
  free-form docs/contracts files as Class D mechanism contracts carrying an HONEST evaluator, and
  fire Decision 167 clause 3's dated pre-commitment (per-entry decision-size cap WARN -> hard-fail).
  Files with no evaluator record a REQUIRED structured enforcement route rather than a bare
  grandfather note, so the follow-on enforcer plan (rec-3059) inherits a per-file design map and a
  downward-only debt ratchet instead of a blessed permanent exemption.
plan_type: IMPLEMENTATION
verification_tier: V2
plan_path: docs/plans/PLAN-migration-step-3-grandfathering.yaml
phase: >-
  T2.56 (Normative / contract / ADR layering) -- migration step 3 of
  audits/contract-first-governance-33c8667.yaml. Closes NO T2.56 exit criterion (c1/c2 both remain
  open; this is the audit's step-3 completing act, not the tier item's).
scope:
  - file: docs/contracts/contract-population.yaml
    action: Modify
    purpose: >-
      Amend evaluator_kinds.check for path-shaped literals; widen agent_surface to Layer-1 ambient
      instruction files; replace none_grandfathered's free-text form with the required
      enforcement_route grammar; add the two new counter pins + the census-binding rule; ratchet
      grandfathered_max 21 -> 19; record exit-criteria-ledger as the single named non-seedable
      exception WITH its route; add the amendment_log entry Pass 2 requires.
  - file: scripts/contracts_schema.py
    action: Modify
    purpose: >-
      EvaluatorSpec.none_grandfathered becomes a structured EnforcementRoute model (reason,
      consumer, mechanism, blocker, shape) instead of free text -- an unenforced claim cannot be
      filed without a route. Zero existing instances, so no migration cost.
  - file: scripts/checks/contracts/_population.py
    action: Modify
    purpose: >-
      Accept a path-shaped string literal whose final segment is the contract basename (rejecting
      any literal containing whitespace); move the ratchet section out to _ratchet.py.
  - file: scripts/checks/contracts/_ratchet.py
    action: Create
    purpose: >-
      Decision 128 decompose-by-default: the ratchet specs, direction checks, the two new counter
      pins, and the pin-vs-census binding. _population.py is at 402/500 SLOC and this plan's
      additions would crowd it.
  - file: scripts/checks/contracts/validate_contract_drift.py
    action: Modify
    purpose: >-
      Wire enforcement-route validation, the two new counter pins, and pin-vs-census enforcement
      into the Pass 1 / ratchet sequence.
  - file: scripts/checks/contracts/validate_instruction_architecture_layers.py
    action: Modify
    purpose: >-
      Assert the contract file exists before delegating (closes a real silent-fallback hole: today
      a missing/unparseable contract falls back to a stub dict and the check passes vacuously).
      Side effect: the full-path literal lands in the check module, so the contract's
      {check: validate_instruction_architecture_layers} evaluator resolves honestly.
  - file: scripts/checks/decisions/validate_decisions_size.py
    action: Modify
    purpose: >-
      Flip the 6,144-byte per-entry authoring cap from WARN to hard-fail per Decision 167 clause 3.
      Forward-only scope and the Decision 149 compacted-stub exemption are unchanged.
