schema_version: 4
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: "coverage-gate-presubmit"
intent: >-
  Restore scripts/platform_roadmap_state.py to its 100% coverage floor by un-shadowing the two
  negative-path fixtures PR #938's pre-filter silently bypassed, and close the escape class that
  let the regression reach main by running the coverage floor inside the pinned pre-merge required
  status check.
plan_type: IMPLEMENTATION
verification_tier: V2
plan_path: docs/plans/PLAN-coverage-gate-presubmit.yaml
phase: >-
  CI-RCA corrective + preventive for the coverage-gate escape class (rec-3211, rec-3212). Adjacent
  to T3.7 (Validation-suite meta-validation, deferred_post_mvp, gated on CD.30 pending) but does not
  claim or close it: this plan adds a pre-merge coverage gate, not mutation testing or dead-test
  detection.
scope:
  - file: tests/platform_roadmap_state/test_state_dict_and_feeds.py
    action: Modify
    purpose: >-
      Un-shadow the two negative-path fixtures whose plan-file text stopped carrying the
      `closes_criteria` substring after PR #938's pre-filter landed, and pin each to the outcome
      that proves its own branch fired -- the malformed fixture must prove yaml.safe_load RAISED,
      the non-dict fixture must prove safe_load RETURNED a non-dict. Asserting only
      needs_followon_plan is what let both go dark silently.
  - file: scripts/validate.py
    action: Modify
    purpose: >-
      Add a single-purpose `--test-coverage-only` flag that dispatches ONLY validate_test_coverage
      against the diff and exits with its status, following --terraform-only's exact shape. Named
      `--test-coverage-only` rather than `--coverage-only` because `--coverage` already exists as a
      deprecated alias for `--verifier-coverage` (advisory, unconditional exit 0); two `--cov*`
      flags with opposite exit contracts would be ambiguous under argparse's default allow_abbrev
      and would reintroduce exactly the "which flag should I use" judgement call Decision 60 removed.
  - file: tests/validate/test_coverage_only.py
    action: Create
    purpose: >-
      Cover the new flag's behaviour in its own module: single-check dispatch, exit 0 on a
      source-free diff, non-zero on a below-floor file. Modelled on TestVerifierCoverageArgv and
      TestUpdateSlocBudgetsArgv (tests/validate/test_scaffold_gates.py:361 and :401) -- the repo's
      actual flag-argv suites. A new file rather than an extension of test_scaffold_gates.py
      because that file sits at exactly 456 SLOC against the 500 limit, and Decision 128 makes
      decomposition the default response, never a budget raise.
  - file: .github/workflows/ci.yml
    action: Modify
    purpose: >-
      Add a coverage-gate STEP to the existing pr-validate job, placed BEFORE the `--pre` step,
      invoking the new flag. A step rather than a dedicated job, for two reasons verified against
      the repo: (1) terraform/github/repo.tf pins required_status_checks to exactly `pr-validate`
      and `terraform-validate`, and signal-green's `needs` list is a wake-comment gate, NOT a merge
      gate -- a separate job would block no merge without a terraform/github apply and a V3
      re-tier; (2) pr-validate's checkout sets `fetch-depth: 0` while terraform-validate's does
      not, and this flag is diff-aware -- modelled on terraform-validate it would find no
      origin/main, fall back to `git diff HEAD` (empty on a clean checkout), and pass vacuously on
      every PR.
bundled_recommendations:
  - rec-3211
  - rec-3212
infrastructure_dependencies: []
acceptance_criteria:
  - scripts/platform_roadmap_state.py measures 100.0% line coverage under tests/platform_roadmap_state.
  - >-
    test_malformed_plan_skipped proves yaml.safe_load RAISED (not merely that it was called), and
    test_plan_yaml_top_level_not_dict_skipped proves safe_load RETURNED a non-dict. Each therefore
    fails if its own branch stops being reached -- a spy that only proves the call happened would
    still pass if a future edit made the malformed fixture parseable, which is the exact silent
    re-shadowing this plan exists to prevent.
  - >-
    `bin/venv-python -m scripts.validate --test-coverage-only` dispatches validate_test_coverage and
    no other check, and exits 0 when the diff touches no source files.
  - >-
    `--test-coverage-only` exits non-zero when a diff-touched source file measures below its floor
    (100%, or its config/coverage_baseline.yaml entry where one exists), demonstrated against a
    deliberately below-floor file rather than only against the happy path.
  - >-
    The pr-validate job -- a pinned required_status_check in terraform/github/repo.tf -- runs the
    gate before its `--pre` step, so a coverage regression is refused before merge.
  - "rec-3211 and rec-3212 are closed via the Resolves: trailer."
verification_plan:
  - step: 1
    phase: pre-deploy
    action: >-
      Measure the previously-failing file against its floor -- the direct corrective proof, and the
      standing discriminator against re-shadowing (any future fixture that stops reaching its branch
      drops this below 100 again).
    command: bin/venv-python -m pytest tests/platform_roadmap_state --cov=scripts.platform_roadmap_state --cov-report=term-missing --cov-fail-under=100 -q
    expected: >-
      Exit 0; term-missing reports scripts/platform_roadmap_state.py at 100% with an empty Missing
      column. Lines 115 and 125-126 specifically are no longer listed.
    fix_if: >-
      Still 98.6% with 115/125-126 missing means the fixture text still lacks the `closes_criteria`
      substring, so the pre-filter at line 112 is still short-circuiting them. Do NOT follow
      rec-3212's prescription (a fixture whose text OMITS the substring) -- that targets line
      111-112, which was covered by PR #938's own TestKeylessPlanSkipsYamlParse class, and will not
      move this number.
    hermetic: false
    graduation: waive
    graduation_waiver_reason: >-
      Graduating this as a standing registry check would duplicate validate_test_coverage's own
      floor enforcement, which this plan is simultaneously promoting into the pre-merge required
      check. The guard belongs in the gate, not beside it. It also costs ~141s measured, well
      outside the cheap-standing-check bar.
  - step: 2
    phase: pre-deploy
    action: >-
      Run the two un-shadowed tests and confirm each pins its OWN branch -- the malformed fixture
      proves safe_load raised, the non-dict fixture proves safe_load returned a non-dict.
    command: bin/venv-python -m pytest tests/platform_roadmap_state/test_state_dict_and_feeds.py -k "malformed_plan_skipped or top_level_not_dict" -q
    expected: Both tests pass, each asserting on its own branch's distinguishing outcome.
    fix_if: >-
      A test asserting only that safe_load was CALLED is insufficient for the malformed case -- it
      would still pass if the fixture became parseable, letting lines 125-126 go dark again. Assert
      the raise.
    hermetic: false
    graduation: graduate
    graduation_check_id: followon-negative-path-fixtures-pin-their-branch
  - step: 3
    phase: pre-deploy
    action: >-
      Confirm --test-coverage-only dispatches ONLY validate_test_coverage, and that it is a genuine
      no-op-and-exit-0 when the diff carries no source changes.
    command: bin/venv-python -m scripts.validate --test-coverage-only
    expected: >-
      Prints the "=== Test coverage check ===" banner and no other check's banner; on a
      docs/plans-only diff prints "No source file changes to check." and exits 0.
    fix_if: >-
      Other check banners appearing means the flag fell through to a full-tier path instead of
      dispatching the single check; a non-zero exit on a source-free diff means the no-change path
      is not short-circuiting.
    hermetic: false
    graduation: graduate
    graduation_check_id: validate-test-coverage-only-dispatches-single-check
  - step: 4
    phase: pre-deploy
    action: >-
      Exercise the flag's unit-level contract, including the DISCRIMINATION proof PROJECT_CONTEXT
      requires of any proposed verifier: with check_per_file_coverage stubbed to report a
      below-floor file, the flag must exit non-zero. Deterministic and creds-free, unlike pointing
      the real measurement path at a live file whose baseline may since have been raised.
    command: bin/venv-python -m pytest tests/validate/test_coverage_only.py -q
    expected: >-
      All TestCoverageOnlyFlag cases pass, including the stubbed below-floor case asserting a
      non-zero exit.
    fix_if: >-
      A missing below-floor case means the suite proves the flag RUNS but never that it REFUSES,
      which is the only behaviour that closes the escape class. Note that invoking
      scripts.test_coverage_checker directly is NOT a substitute -- it self-reports "DIAGNOSTIC
      VERDICT ... not an authoritative validation gate" and exits 0 regardless (verified this
      session).
    hermetic: false
    graduation: graduate
    graduation_check_id: validate-test-coverage-only-flag-suite
  - step: 5
    phase: pre-deploy
    action: >-
      Prove the gate is NOT VACUOUS on a real branch diff -- the failure mode that would make it
      present but toothless. Run the flag on this implementation branch, whose diff touches
      scripts/validate.py, and confirm it actually derives and measures a non-empty source-file set
      rather than reporting "No source file changes to check."
    command: |-
      bin/venv-python -m scripts.validate --test-coverage-only 2>&1 | tee /dev/stderr | grep -qE 'mapping: scripts/validate\.py'
    expected: >-
      The mapping line for scripts/validate.py appears, proving get_changed_source_files() resolved
      a real diff base and the gate measured a file this PR touched. Contrast the vacuous state:
      "No source file changes to check." with examined(0).
    fix_if: >-
      "No source file changes to check." means the diff base did not resolve -- the exact
      failure a checkout without fetch-depth 0 produces, which is why this step exists and why the
      gate lives in pr-validate rather than a new job. Do not accept a green run that examined
      nothing; that is the rec-3163 vacuity condition shipped rather than alarmed on.
    hermetic: false
    graduation: graduate
    graduation_check_id: test-coverage-only-non-vacuous-on-real-diff
  - step: 6
    phase: pre-deploy
    action: >-
      Confirm the coverage-gate step is wired into the pr-validate job and precedes the --pre step
      (CI wiring is grep-verified locally and CI-delegated per Decision 119).
    command: |-
      sed -n '/^  pr-validate:/,/^  main-validate:/p' .github/workflows/ci.yml | grep -q -- '--test-coverage-only'
    expected: Exit 0 -- the --test-coverage-only invocation appears inside the pr-validate job body.
    fix_if: >-
      Absent, or present only after the main-validate boundary, means the gate was wired to the
      post-merge job again and the escape class is untouched. This step proves presence only;
      step 5 is what proves the gate discriminates.
    hermetic: true
    graduation: graduate
    graduation_check_id: ci-pr-validate-invokes-test-coverage-only
  - step: 7
    phase: pre-deploy
    action: >-
      Measure scripts/validate.py against its own coverage floor. It is pinned at 73.0 in
      config/coverage_baseline.yaml (`# baseline-lowered: dec-169`), so an uncovered flag block
      added here can fail the very check this plan is promoting -- the gate would red on its own
      enabling PR.
    command: bin/venv-python -m pytest tests/validate --cov=scripts --cov-report=term-missing --cov-fail-under=73 -q
    expected: scripts/validate.py measures at or above 73.0%.
    fix_if: >-
      Below 73.0 means the new dispatch block is untested. Cover it in
      tests/validate/test_coverage_only.py. Do NOT lower the baseline entry: Decision 165 requires
      the `# baseline-lowered: dec-NNN` marker to name a Decision that AUTHORIZES the lowering, and
      no such Decision exists for this plan.
    hermetic: false
    graduation: graduate
    graduation_check_id: validate-py-holds-73-coverage-floor
  - step: 8
    phase: pre-deploy
    action: >-
      Confirm the fast tier still passes and stays inside its 300s budget with the coverage step
      added ahead of it -- the coverage step runs in a separate process, so --pre's internal clock
      is untouched, but this proves no accounting or budget regression.
    command: bin/venv-python -m scripts.validate --pre
    expected: Exit 0, including validate_check_accounting, within the 300s fast-tier budget.
    fix_if: >-
      An accounting failure means the new mode opened an outcome_scope without a matching
      declaration; a budget breach means coverage work leaked into the fast tier's own clock, which
      this design exists specifically to avoid.
    hermetic: false
    graduation: waive
    graduation_waiver_reason: >-
      This step IS the fast tier; graduating it into the verification registry would make the tier
      a check inside itself. Its cost is the tier's own 300s budget, far outside the
      cheap-standing-check bar.
  - step: 9
    phase: post-deploy
    action: >-
      After merge, confirm the two bundled CI-RCA recs actually closed via the Resolves: trailer.
    command: |-
      bin/venv-python -m scripts.sync.ops sync && grep -cE '"id": "rec-(3211|3212)".*"status": "closed"' logs/.recommendations-log.jsonl
    expected: Prints 2.
    fix_if: >-
      Fewer than 2 means rec-autoclose.yml did not fire; fall back to the documented
      ops_data_portal --update-rec path per Decision 70. Note `sync.ops` accepts only the `sync`
      subcommand (scripts/sync/ops.py:553) -- `pull` is not a valid choice and exits 2.
test_obligations:
  - source: scripts/validate.py
    behavior: >-
      --test-coverage-only dispatches validate_test_coverage alone, exits 0 on a source-free diff,
      and exits non-zero on a diff-touched file below its floor.
    verification_step: 4
    test_selector: tests/validate/test_coverage_only.py::TestCoverageOnlyFlag
    red_green_expectation: >-
      Red before: neither the flag nor the module exists -- `bin/venv-python -m scripts.validate
      --test-coverage-only` exits 2 with "unrecognized arguments" (reproduced live this session).
      Green after: all cases pass, including the below-floor non-zero exit.
  - source: tests/platform_roadmap_state/test_state_dict_and_feeds.py
    behavior: >-
      The two negative-path tests stay bound to the branch they name, so a future short-circuit
      above them fails the suite instead of silently un-reaching it.
    verification_step: 1
    test_selector: tests/platform_roadmap_state/test_state_dict_and_feeds.py::TestComputeFollowonStateMalformedPlanShapes
    red_green_expectation: >-
      Red before: coverage measures 98.58% with lines 115 and 125-126 missing (reproduced live this
      session). Green after: 100.0%, empty Missing column. The coverage number is itself the
      discriminator -- re-shadowing these fixtures reproduces the red.
  - source: .github/workflows/ci.yml
    behavior: The pr-validate job runs the coverage gate before its --pre step.
    verification_step: 6
    command: |-
      sed -n '/^  pr-validate:/,/^  main-validate:/p' .github/workflows/ci.yml | grep -q -- '--test-coverage-only'
    waiver_reason: >-
      Workflow YAML is not unit-testable in-process; Decision 119 makes CI the authoritative
      verifier for workflow wiring, with a local grep-shaped presence assertion standing in.
      Discrimination of the gate itself is carried by VP step 5, not by this presence check.
constraints:
  - >-
    Do NOT promote validate_test_coverage to the --pre tier via pre=True in
    scripts/checks/misc/_manifest.py. _FAST_TIER_BUDGET_SECONDS is 300 and a single file's
    measurement takes ~141s measured (a pytest subprocess is forked per changed source file);
    rec-2987 records a real 5.5-min fast-tier breach on a branch attempting exactly this. The
    coverage step is a SEPARATE `run:` step in the same job, so it never enters
    _scaffold_budget_assertion's elapsed window.
  - >-
    Add a STEP to the pr-validate job, NOT a new job. terraform/github/repo.tf pins
    required_status_checks to exactly `pr-validate` and `terraform-validate`; signal-green's `needs`
    list only suppresses a wake comment and gates no merge. A new job would additionally need a
    terraform/github apply (a different, human-gated deploy channel) and would re-tier this plan to
    V3. The step also inherits pr-validate's `fetch-depth: 0`, without which the diff-aware flag
    resolves no origin/main and passes vacuously.
  - >-
    Place the coverage step BEFORE the `--pre` step. Both share pr-validate's 30-minute job
    timeout, from which Decision 153 clause 3 derives its 1500s forced-run ceiling. Running
    coverage first keeps a ceiling breach attributable to `--pre` on its own clock, as Decision 153
    designed. Known residual: a root-conftest PR (full_suite_forced) that ALSO changes many source
    files could approach the 30-minute job timeout. The conjunction is rare and observable; if it
    materialises it is Decision 153 reversal-condition (b) territory, not a silent regression.
  - >-
    scripts/validate.py stays the single source of truth for checks (AGENTS.md): ci.yml invokes a
    validate.py flag and defines no check of its own. This mirrors --terraform-only /
    terraform-validate exactly.
  - >-
    Dispatch the check via `scripts.checks.registry.resolve("validate_test_coverage")` (Decision 169
    clause 2), never a direct `from scripts.checks.misc.validate_test_coverage import ...`. A direct
    import re-introduces the check facade Decision 169 retired and breaks the import-closure gate.
    Keep the scripts/validate.py delta to the argparse entry plus a short delegation block --
    Decision 169's stated intent is that "scripts/validate.py is never touched again" when adding a
    check, and a flag is inside clause 1's retained surface only if it stays that small.
  - >-
    scripts/validate.py is pinned at 73.0 in config/coverage_baseline.yaml. Cover the new dispatch
    block; do NOT lower the pin. Decision 165 narrows marker validation from existence to
    AUTHORIZATION -- a `# baseline-lowered: dec-NNN` marker must name a Decision that authorizes the
    lowering, and none exists for this plan.
  - >-
    Do NOT reach for registry.skipped() to report an unmeasurable file. It writes a single global
    per-dispatch slot (_CURRENT_DECLARATION) and would OVERWRITE validate_test_coverage's existing
    examined(n, unit="source_files"), converting a genuinely-enforced run into a "skipped" row; its
    docstring also reserves it for "could not examine", not "examined nothing". A skipped() call
    from validate.py after _dispatch_check returns would land outside the outcome_scope and never be
    harvested at all.
  - >-
    The unmeasurable-file question is deliberately OUT of scope and belongs to open rec-3163, which
    was filed to own exactly this vacuity condition. The behaviour lives in
    scripts/checks/misc/coverage_baseline.py::measure_and_check (pct None + continue on a missing
    .coverage.json; a hard "0% coverage" error when a report exists with no matching entry), neither
    of which is a scope file here. Do not widen scope to chase it -- note it and leave rec-3163 open
    and unbundled.
  - >-
    Recorded residual (Decision 163): validate_handoff_full_tier._is_full_tier_segment matches
    `-m scripts.validate` whenever `--pre` is absent, so `-m scripts.validate --test-coverage-only`
    SATISFIES the pre-handoff full-tier guard while running one diff-scoped check. The hole
    pre-exists (--terraform-only, --verifier-coverage, --update-sloc-budgets all match), so this
    widens rather than creates it, but it adds the most temptingly-named instance yet. This plan does
    NOT relieve Decision 163 clause 3's pre-handoff full-tier obligation; file a follow-on rec to
    tighten the matcher rather than fixing it inline here.
  - >-
    Decision 153 adjudication. Under the step design this flag adds no CI job, no event trigger and
    no gating role -- it runs inside the existing pr-validate required check. It is a job adapter
    over an existing full-tier check, the same pre-existing class as --terraform-only, which
    Decision 153 was written alongside without counting as a tier (Decision 60's "two named
    surfaces" already coexists with --terraform-only, --verifier-coverage and
    --update-sloc-budgets). It does carry an invocation flag and a one-check sequence, so the claim
    is NOT that it scores 0-of-5 on clause 4's test; the claim is that flag-plus-check-sequence
    without trigger, role or independent budget contract is the adapter class, not the tier class.
    If a reviewer rejects that, the correct route is a Decision amending 60/73/153 -- not a
    plan-level call.
  - >-
    Do not use config/check_accounting_baseline.yaml. validate_test_coverage is already an adopted
    (not baselined) check under Decision 170, and the guard's _BASELINE_SEED is frozen.
  - No rescue agents or workaround loops (Decision 55).
context:
  - >-
    Root cause is fixture shadowing, not a missing test. PR #938 (722df85) added a substring
    pre-filter at scripts/platform_roadmap_state.py:111-112 (`if "closes_criteria" not in text:
    continue`). Two pre-existing fixtures write plan text lacking that substring:
    test_malformed_plan_skipped ("invalid: [yaml: {content", sole coverer of the `except Exception:
    continue` at 125-126) and test_plan_yaml_top_level_not_dict_skipped ("- a\n- b\n", sole coverer
    of the `continue` at 115). Both now short-circuit at line 112 before the code they were written
    to exercise. They still PASS, because they assert only on the result, which the fast path
    produces identically -- the suite went green while the branches went dark.
  - >-
    rec-3212's stated root cause is inverted and must not be followed. It claims line 111-112 is the
    uncovered branch and prescribes adding a fixture whose text OMITS `closes_criteria`. In fact
    111-112 is covered -- by those two fixtures plus the TestKeylessPlanSkipsYamlParse class, which
    `git log -S` shows landed in 722df85 itself, the very commit rec-3212 blames. Implementing
    rec-3212 as written adds a fourth redundant keyless fixture and leaves coverage at 98.58%.
    Verified live by probe -- substring-carrying variants of both shapes flip the miss set so
    115/125-126 become covered.
  - >-
    Detection gap: validate_test_coverage is registered in scripts/checks/misc/_manifest.py with
    full_segment="full_after_lint" and no pre=True. pre_sequence() carries 83 checks and this is not
    one of them, so the 100% floor is enforced ONLY post-merge (main-validate / Main Canary). Every
    coverage regression is structurally guaranteed to land on main first.
  - >-
    This escape class has been filed four times. rec-2970 (2026-08-03) diagnosed it exactly and was
    closed on a non-discriminating probe (`grep -n validate_test_coverage scripts/checks/registry.py`
    -- satisfied by the pre-existing full-tier registration whether or not the check ever moved).
    rec-3043/3044 (08-05) and rec-3147 (08-15) closed corrective-only. rec-3163 (08-16, open) was
    filed explicitly as the live owner so a third recurrence would have an artifact to point at;
    rec-3211/3212 is that recurrence. The probe-hygiene meta-cause is filed separately as rec-3220
    and is deliberately NOT in this plan's scope.
  - >-
    Branch was 0 commits behind origin/main at planning time (preflight main_freshness: 0 behind, 0
    ahead), so no Main Divergence Assessment deferral applies.
  - >-
    Decision-scout verdict: FLAGS_FOUND (125 of 125 decisions triaged). CITE list: dec-48 (V2 tier
    holds; ci.yml is absent from the V3 trigger list and dec-135 set the ci.yml-step-is-V2
    precedent), dec-73 (two-tier diff-aware CI -- the clause this plan re-opens), dec-159
    (coverage-baseline roster -- per-entry floors, and scripts/validate.py itself pinned at 73.0;
    clause 5 names the full-tier-only tripwire an ACCEPTED RESIDUAL, so closing it is a
    strengthening, not a violation), dec-165 (markers must name an AUTHORIZING Decision), dec-169
    (dispatch via registry.resolve), dec-142 (Resolves: trailer auto-close; this is a TIER escape so
    escape_class does not classify it), dec-72 + dec-55 (RCA-as-plan-source -- rec-3212's inverted
    root cause is refused on the record, not silently deviated from), dec-128 + dec-130
    (structural-size governance covers tests/), dec-153 (tier five-property test; forced-run ceiling
    headroom), dec-60 (flag-surface consolidation), dec-170 (examined/skipped channel; fail-closed
    vacuity NOT committed), dec-163 (universal-in-name/discretionary-in-enforcement), dec-131
    (test-colocation mirror), dec-129 (closest precedent for a pre-merge coverage verifier --
    pattern, not authority), dec-135 (affected-set selection), dec-119 (CI-delegated verification),
    dec-103 (rec lifecycle -- resolution wording only).
  - >-
    Plan-critique round 1 findings and their disposition, all verified against the repo before
    acting. BLOCKER 1 (plan specified two mutually exclusive designs): FIXED -- the file was rewritten
    whole to the step design, purging the stale job-design artifacts. BLOCKER 2 (a separate job
    refuses no merge; required_status_checks pins only pr-validate and terraform-validate):
    CONFIRMED and DECISIVE -- this reverted the design-scout pivot back to a step. BLOCKER 3 (a job
    modelled on terraform-validate is vacuous because that job has no fetch-depth: 0 while the flag
    is diff-aware): CONFIRMED, same resolution. BLOCKER 4 (AC5 unsatisfiable in scope): FIXED by
    scoping the unmeasurable-file question out to rec-3163, its filed owner. BLOCKER 5 (VP used
    `sync.ops pull`, not a valid choice): FIXED to `sync`. HIGH 6 (--test-coverage-only satisfies
    validate_handoff_full_tier): recorded as an explicit residual with a follow-on rec, not fixed
    inline. MEDIUM 7 (a safe_load spy proves the call, not the raise): FIXED in AC2 and VP step 2.
    MEDIUM 8 (--coverage-only collides with the --coverage alias): FIXED by renaming to
    --test-coverage-only. Graduation dispositions reclassified for steps 2, 4, 6, 7 and 8. The false
    `test_terraform_checks.py` precedent claim was corrected to TestVerifierCoverageArgv /
    TestUpdateSlocBudgetsArgv. Split recommendation declined by the human -- kept as one plan.
  - "gates: decision-scout=FLAGS_FOUND (all dispositioned); plan-critique=REVISE round 1 (all findings actioned above)"
pre_implementation_checklist:
  - Branch confirmed not on main
  - docs/PROJECT_CONTEXT.md read
  - only the plan-cited decision sections
  - All files in scope located and readable
  - Acceptance criteria understood and verifiable
execution_steps:
  - >-
    tests/platform_roadmap_state/test_state_dict_and_feeds.py -- give
    test_plan_yaml_top_level_not_dict_skipped's fixture text a `closes_criteria` token while keeping
    it a non-dict at the top level (e.g. a YAML list whose first entry is the literal
    `closes_criteria`), and give test_malformed_plan_skipped's fixture text the token while keeping
    it unparseable (e.g. `closes_criteria: [T-1: {`). Do not weaken either existing assertion.
  - >-
    tests/platform_roadmap_state/test_state_dict_and_feeds.py -- pin each test to its OWN branch.
    For the malformed case assert yaml.safe_load RAISED (e.g. wrap safe_load in a spy that records
    the exception, or assert directly that parsing the fixture text raises) -- a spy proving only
