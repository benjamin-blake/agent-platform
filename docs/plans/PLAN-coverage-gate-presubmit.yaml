schema_version: 4
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: "coverage-gate-presubmit"
intent: >-
  Restore scripts/platform_roadmap_state.py to its 100% coverage floor by un-shadowing the two
  negative-path fixtures PR #938's pre-filter silently bypassed, and close the escape class that
  let the regression reach main by running the coverage floor -- scoped to fast-tier-runnable
  source-to-test mappings -- inside the pinned pre-merge required status check.
plan_type: IMPLEMENTATION
verification_tier: V2
plan_path: docs/plans/PLAN-coverage-gate-presubmit.yaml
phase: >-
  CI-RCA corrective + preventive for the coverage-gate escape class (rec-3211, rec-3212). Adjacent
  to T3.7 (Validation-suite meta-validation, deferred_post_mvp, gated on CD.30 pending) but does not
  claim or close it: this plan adds a pre-merge coverage gate, not mutation testing or dead-test
  detection.
scope:
  - file: tests/platform_roadmap_state/test_state_dict_and_feeds.py
    action: Modify
    purpose: >-
      Un-shadow the two negative-path fixtures whose plan-file text stopped carrying the
      `closes_criteria` substring after PR #938's pre-filter landed, and pin each to the outcome
      that proves its own branch fired -- the malformed fixture must prove yaml.safe_load RAISED,
      the non-dict fixture must prove safe_load RETURNED a non-dict. Asserting only
      needs_followon_plan is what let both go dark silently.
  - file: scripts/validate.py
    action: Modify
    purpose: >-
      Add a single-purpose `--test-coverage-only` flag that dispatches ONLY validate_test_coverage
      against the diff and exits with its status, following --terraform-only's exact shape. Named
      `--test-coverage-only` rather than `--coverage-only` because `--coverage` already exists as a
      deprecated alias for `--verifier-coverage` (advisory, unconditional exit 0); two `--cov*`
      flags with opposite exit contracts would be ambiguous under argparse's default allow_abbrev
      and would reintroduce exactly the "which flag should I use" judgement call Decision 60 removed.
  - file: tests/validate/test_coverage_only.py
    action: Create
    purpose: >-
      Cover the new flag's behaviour in its own module: single-check dispatch, exit 0 on a
      source-free diff, non-zero on a below-floor file, and the tier-selection guard (no
      validation_result.clear() under the flag). Modelled on TestVerifierCoverageArgv and
      TestUpdateSlocBudgetsArgv (tests/validate/test_scaffold_gates.py:361 and :401) -- the repo's
      actual flag-argv suites. A new file rather than an extension of test_scaffold_gates.py
      because that file sits at exactly 456 SLOC against the 500 limit, and Decision 128 makes
      decomposition the default response, never a budget raise.
  - file: scripts/checks/misc/validate_test_coverage.py
    action: Modify
    purpose: >-
      Scope the check's PRE-MERGE mode to fast-tier-runnable source-to-test mappings only. The
      check currently spawns a raw `pytest <test_path> --cov=<dir>` subprocess per changed source
      file with no deferral machinery, so under pr-validate's requirements-fast.txt +
      requirements-dev.txt install a mapped test importing one of the 18 excluded heavy
      distributions collection-errors and hard-reds the pinned required check for a DEPENDENCY
      reason, not a coverage reason. Reuse
      `scripts/checks/_pytest_diff.py::partition_changed_tests_by_collectability(changed_tests)
      -> (runnable, deferred)` -- the same machinery --pre uses, fail-closed by design (anything
      not clearly a heavy-dep defer routes to runnable). Full-tier (main-validate) behaviour is
      unchanged: it keeps enforcing every mapping.
  - file: tests/checks/misc/test_validate_test_coverage.py
    action: Modify
    purpose: >-
      Add a class exercising BOTH partition arms of the new pre-merge scoping: a mapping that
      partitions to `runnable` is enforced (a below-floor measurement still fails), and a mapping
      that partitions to `deferred` is reported as deferred-to-post-merge and does NOT fail. The
      file already exists (TestLoadCoverageChecker / TestValidateTestCoverage /
      TestDeclaredAccounting), so this is a Modify, and the existing per-check colocation home is
      reused rather than a second surface created (Decision 131).
  - file: .github/workflows/ci.yml
    action: Modify
    purpose: >-
      Add a coverage-gate STEP to the existing pr-validate job, placed BEFORE the `--pre` step,
      invoking the new flag. A step rather than a dedicated job, for two reasons verified against
      the repo: (1) terraform/github/repo.tf pins required_status_checks to exactly `pr-validate`
      and `terraform-validate`, and signal-green's `needs` list is a wake-comment gate, NOT a merge
      gate -- a separate job would block no merge without a terraform/github apply and a V3
      re-tier; (2) pr-validate's checkout sets `fetch-depth: 0` while terraform-validate's does
      not, and this flag is diff-aware -- modelled on terraform-validate it would find no
      origin/main, fall back to `git diff HEAD` (empty on a clean checkout), and pass vacuously on
      every PR.
  - file: docs/DECISIONS.md
    action: Modify
    purpose: >-
      Ratify the pre-merge coverage gate as a numbered Decision amending Decision 73 clause 2's
      pre-merge allocation. Moving coverage measurement into the pinned pre-merge check changes
      WHAT runs pre-merge, which the adapter-vs-tier argument in the Decision 153 adjudication
      constraint does not reach; the fast-tier-runnable scoping bounds the cost envelope but does
      not by itself resolve the allocation question. Precedent: Decision 153 amended Decision 73's
      enforcement and earned its own number rather than annotating 73 in place. The drafted text
      is carried in this plan's `context` (the schema is extra="forbid", so there is no top-level
      ratification block); an execution step transcribes it at implement time.
bundled_recommendations:
  - rec-3211
  - rec-3212
infrastructure_dependencies: []
acceptance_criteria:
  - scripts/platform_roadmap_state.py measures 100.0% line coverage under tests/platform_roadmap_state.
  - >-
    test_malformed_plan_skipped proves yaml.safe_load RAISED (not merely that it was called), and
    test_plan_yaml_top_level_not_dict_skipped proves safe_load RETURNED a non-dict. Each therefore
    fails if its own branch stops being reached -- a spy that only proves the call happened would
    still pass if a future edit made the malformed fixture parseable, which is the exact silent
    re-shadowing this plan exists to prevent.
  - >-
    `bin/venv-python -m scripts.validate --test-coverage-only` dispatches validate_test_coverage and
    no other check, and exits 0 when the diff touches no source files.
  - >-
    `--test-coverage-only` exits non-zero when a diff-touched source file measures below its floor
    (100%, or its config/coverage_baseline.yaml entry where one exists), demonstrated against a
    deliberately below-floor file rather than only against the happy path.
  - >-
    In pre-merge mode the floor is enforced ONLY for fast-tier-runnable mappings: a diff-touched
    source file whose mapped test defers on a genuinely-absent excluded heavy dependency is
    reported as explicitly deferred-to-post-merge and does NOT fail the pre-merge gate, while a
    diff-touched source file whose mapped test IS fast-tier-runnable is enforced. Deferral is
    reported, never silent, and the full tier (main-validate) still enforces every mapping.
  - >-
    The pr-validate job -- a pinned required_status_check in terraform/github/repo.tf -- runs the
    gate before its `--pre` step, so a coverage regression is refused before merge.
  - "rec-3211 and rec-3212 are closed via the Resolves: trailer."
verification_plan:
  - step: 1
    phase: pre-deploy
    action: >-
      Measure the previously-failing file against its floor -- the direct corrective proof, and the
      standing discriminator against re-shadowing (any future fixture that stops reaching its branch
      drops this below 100 again).
    command: bin/venv-python -m pytest tests/platform_roadmap_state --cov=scripts.platform_roadmap_state --cov-report=term-missing --cov-fail-under=100 -q
    expected: >-
      Exit 0; term-missing reports scripts/platform_roadmap_state.py at 100% with an empty Missing
      column. Lines 115 and 125-126 specifically are no longer listed.
    fix_if: >-
      Still 98.6% with 115/125-126 missing means the fixture text still lacks the `closes_criteria`
      substring, so the pre-filter at line 112 is still short-circuiting them. Do NOT follow
      rec-3212's prescription (a fixture whose text OMITS the substring) -- that targets line
      111-112, which was covered by PR #938's own TestKeylessPlanSkipsYamlParse class, and will not
      move this number.
    hermetic: false
    graduation: waive
    graduation_waiver_reason: >-
      Graduating this as a standing registry check would duplicate validate_test_coverage's own
      floor enforcement, which this plan is simultaneously promoting into the pre-merge required
      check. The guard belongs in the gate, not beside it. It also costs ~141-197s measured, well
      outside the cheap-standing-check bar.
  - step: 2
    phase: pre-deploy
    action: >-
      Run the two un-shadowed tests and confirm each pins its OWN branch -- the malformed fixture
      proves safe_load raised, the non-dict fixture proves safe_load returned a non-dict.
    command: bin/venv-python -m pytest tests/platform_roadmap_state/test_state_dict_and_feeds.py -k "malformed_plan_skipped or top_level_not_dict" -q
    expected: Both tests pass, each asserting on its own branch's distinguishing outcome.
    fix_if: >-
      A test asserting only that safe_load was CALLED is insufficient for the malformed case -- it
      would still pass if the fixture became parseable, letting lines 125-126 go dark again. Assert
      the raise.
    hermetic: false
    graduation: graduate
    graduation_check_id: followon-negative-path-fixtures-pin-their-branch
  - step: 3
    phase: pre-deploy
    action: >-
      Confirm --test-coverage-only dispatches ONLY validate_test_coverage, and that it is a genuine
      no-op-and-exit-0 when the diff carries no source changes.
    command: bin/venv-python -m scripts.validate --test-coverage-only
    expected: >-
      Prints the "=== Test coverage check ===" banner and no other check's banner; on a
      docs/plans-only diff prints "No source file changes to check." and exits 0.
    fix_if: >-
      Other check banners appearing means the flag fell through to a full-tier path instead of
      dispatching the single check; a non-zero exit on a source-free diff means the no-change path
      is not short-circuiting.
    hermetic: false
    graduation: waive
    graduation_waiver_reason: >-
      Waived on the SAME cost basis as step 1, not on a separate ground. Its `expected` is
      diff-conditional (the "No source file changes to check." half holds only on a source-free
      diff), and on any diff that DOES carry source files it pays the same
      ~141-197s-per-source-file measurement step 1's waiver calls "well outside the
      cheap-standing-check bar". Step 4 already graduates the unit-level proof of the same
      contract (single-check dispatch, exit 0 on a source-free diff, non-zero below floor)
      deterministically and creds-free, so graduating this step would buy a costly, flakier
      duplicate of a registry row that already exists.
  - step: 4
    phase: pre-deploy
    action: >-
      Exercise the flag's unit-level contract, including the DISCRIMINATION proof PROJECT_CONTEXT
      requires of any proposed verifier: with check_per_file_coverage stubbed to report a
      below-floor file, the flag must exit non-zero. Also assert the tier-selection guard --
      validation_result.clear must NOT be called under the flag. Deterministic and creds-free,
      unlike pointing the real measurement path at a live file whose baseline may since have been
      raised.
    command: bin/venv-python -m pytest tests/validate/test_coverage_only.py -q
    expected: >-
      All TestCoverageOnlyFlag cases pass, including the stubbed below-floor case asserting a
      non-zero exit and the case asserting validation_result.clear is not called.
    fix_if: >-
      A missing below-floor case means the suite proves the flag RUNS but never that it REFUSES,
      which is the only behaviour that closes the escape class. Note that invoking
      scripts.test_coverage_checker directly is NOT a substitute -- it self-reports "DIAGNOSTIC
      VERDICT ... not an authoritative validation gate" and exits 0 regardless (verified this
      session). A missing clear-not-called case leaves HIGH 7 unproven.
    hermetic: false
    graduation: graduate
    graduation_check_id: validate-test-coverage-only-flag-suite
  - step: 10
    phase: pre-deploy
    action: >-
      Exercise BOTH arms of the pre-merge runnable/deferred partition under unit test: a mapping
      that partitions to `runnable` is still enforced (a below-floor measurement fails), and a
      mapping that partitions to `deferred` on a genuinely-absent excluded heavy dependency is
      reported as deferred-to-post-merge and does NOT contribute a failure. Both arms are stubbed
      at the partition boundary, so neither installs nor requires a heavy dependency.
    command: bin/venv-python -m pytest tests/checks/misc/test_validate_test_coverage.py -q
    expected: >-
      All cases pass, including the new class's two arms: the runnable arm appends a coverage
      failure, the deferred arm appends none and emits an explicit deferred-to-post-merge line
      naming the source file, its mapped test, and the missing dependency.
    fix_if: >-
      A deferred arm that appends a failure means the partition result is not being consulted
      before the measurement subprocess is forked. A runnable arm that appends nothing means the
      scoping is over-broad and the gate is now vacuous -- the fail-closed direction of
      partition_changed_tests_by_collectability (anything not clearly a heavy-dep defer routes to
      runnable) must be preserved, never inverted. A deferred file that produces no output at all
      is the silent-skip failure mode this step exists to refuse.
    hermetic: false
    graduation: graduate
    graduation_check_id: validate-test-coverage-pre-merge-partition-arms
  - step: 5
    phase: pre-deploy
    action: >-
      Prove the gate is NOT VACUOUS on a real branch diff -- the failure mode that would make it
      present but toothless. Run the flag on this implementation branch, whose diff touches
      scripts/validate.py, and confirm it actually derives and measures a non-empty source-file set
      rather than reporting "No source file changes to check."
    command: |-
      bin/venv-python -m scripts.validate --test-coverage-only 2>&1 | tee /dev/stderr | grep -qE 'mapping: scripts/validate\.py'
    expected: >-
      The mapping line for scripts/validate.py appears. Scope of the claim, precisely: this proves
      get_changed_source_files() resolved a real diff base, the file partitioned to `runnable`, and
      a source-to-test mapping was derived for a file this PR touched. It does NOT prove the
      measurement completed -- coverage_baseline.measure_and_check prints the `mapping:` line
      BEFORE forking the pytest subprocess, and `grep -q` closes the pipe on first match, so the
      run may be torn down mid-measurement. Contrast the vacuous state this discriminates against:
      "No source file changes to check." with examined(0). Measurement completion is proven by
      step 7, not here.
    fix_if: >-
      "No source file changes to check." means the diff base did not resolve -- the exact
      failure a checkout without fetch-depth 0 produces, which is why this step exists and why the
      gate lives in pr-validate rather than a new job. Do not accept a green run that examined
      nothing; that is the rec-3163 vacuity condition shipped rather than alarmed on. A
      deferred-to-post-merge line for scripts/validate.py instead of a mapping line means the
      partition mis-classified a fast-tier-runnable mapping -- fix the classifier, not the gate.
    hermetic: false
    graduation: waive
    graduation_waiver_reason: >-
      This step passes only on a branch whose diff touches scripts/validate.py, so its expected
      outcome is branch-diff-dependent and not expressible as a diff-independent standing check.
      Registry rows are differentially admitted once and then never re-run against a new diff, so
      a row asserting "the mapping line for scripts/validate.py appears" would rot the moment the
      next branch does not touch that file -- admitting a permanently-red or branch-dependent row
      is worse than no row. The non-vacuity property it proves is carried forward by step 10's
      runnable arm, which is diff-independent.
  - step: 6
    phase: pre-deploy
    action: >-
      Confirm the coverage-gate step is wired into the pr-validate job AND that its invocation line
      precedes the `--pre` invocation line inside that job body -- the ordering AC5 asserts (CI
      wiring is grep-verified locally and CI-delegated per Decision 119).
    command: |-
      body=$(sed -n '/^  pr-validate:/,/^  main-validate:/p' .github/workflows/ci.yml)
      cov=$(printf '%s\n' "$body" | grep -n 'validate --test-coverage-only$' | cut -d: -f1 | head -1)
      pre=$(printf '%s\n' "$body" | grep -n 'validate --pre$' | cut -d: -f1 | head -1)
      test -n "$cov" && test -n "$pre" && test "$cov" -lt "$pre"
    expected: >-
      Exit 0. Both invocation lines are found inside the extracted pr-validate job body, and the
      `--test-coverage-only` line number is strictly less than the `--pre` line number -- so the
      gate is not merely present in the job, it runs first.
    fix_if: >-
      An empty `cov` means the gate was wired to the post-merge job again (or past the
      main-validate boundary) and the escape class is untouched. An empty `pre` means the anchor
      drifted -- both greps are end-of-line anchored on the `run:` invocation precisely so the
      job's `--pre` explanatory COMMENT (currently line 48 of the extracted body) cannot be
      mistaken for the invocation; re-anchor rather than dropping the `$`. `cov` not less than
      `pre` means the step was appended after `--pre` instead of before it, which forfeits the
      Decision 153 clause 3 attribution property the placement constraint exists to preserve.
      This step proves presence and ORDER only; step 5 and step 10 are what prove the gate
      discriminates.
    hermetic: true
    graduation: graduate
    graduation_check_id: ci-pr-validate-invokes-test-coverage-only
  - step: 7
    phase: pre-deploy
    action: >-
      Confirm the gate does not red on its own enabling PR. scripts/validate.py is pinned at 73.0
      in config/coverage_baseline.yaml (`# baseline-lowered: dec-169`) and this PR's diff touches
      it, so it is one of the files the gate itself measures. Use the gate's own per-file compare
      -- not a total-coverage threshold -- and assert it reports no below-floor finding for
      validate.py.
    command: |-
      out=$(bin/venv-python -m scripts.validate --test-coverage-only 2>&1); printf '%s\n' "$out"
      printf '%s\n' "$out" | grep -q 'scripts/validate\.py: .*line coverage (expected' && exit 1 || exit 0
    expected: >-
      Exit 0, and the printed output carries no `scripts/validate.py: NN.N% line coverage
      (expected >= 73.0%)` line. scripts/validate.py measures 74% against its 73.0 pin as of this
      session, so headroom exists; this step exists to prove the new uncovered dispatch block did
      not consume it.
    fix_if: >-
      A below-floor line for validate.py means the new dispatch block is untested. Cover it in
      tests/validate/test_coverage_only.py. Do NOT lower the baseline entry: Decision 165 requires
      the `# baseline-lowered: dec-NNN` marker to name a Decision that AUTHORIZES the lowering, and
      no such Decision exists for this plan. Do NOT substitute a total-coverage command such as
      `pytest tests/validate --cov=scripts --cov-fail-under=73`: `--cov-fail-under` is a TOTAL
      threshold across all of `scripts/`, reports 8.46% and fails regardless of validate.py's own
      number (verified this session). The gate compares per file; so must this step.
    hermetic: false
    graduation: waive
    graduation_waiver_reason: >-
      Waived because the row would be permanently red or branch-dependent, and the registry admits
      a row once and never re-runs it against a new diff. `--test-coverage-only` is diff-scoped, so
      on any branch that does not touch scripts/validate.py this step measures nothing and proves
      nothing; on a branch that does, it pays the same ~141-197s-per-source-file cost step 1's
      waiver places well outside the cheap-standing-check bar. The standing enforcement of
      validate.py's 73.0 floor is validate_test_coverage itself -- which this plan is promoting
      into the pre-merge required check -- not a registry row beside it.
  - step: 8
    phase: pre-deploy
    action: >-
      Confirm the fast tier still passes and stays inside its 300s budget with the coverage step
      added ahead of it -- the coverage step runs in a separate process, so --pre's internal clock
      is untouched, but this proves no accounting or budget regression.
    command: bin/venv-python -m scripts.validate --pre
    expected: Exit 0, including validate_check_accounting, within the 300s fast-tier budget.
    fix_if: >-
      An accounting failure means the new mode opened an outcome_scope without a matching
      declaration; a budget breach means coverage work leaked into the fast tier's own clock, which
      this design exists specifically to avoid.
    hermetic: false
    graduation: waive
    graduation_waiver_reason: >-
      This step IS the fast tier; graduating it into the verification registry would make the tier
      a check inside itself. Its cost is the tier's own 300s budget, far outside the
      cheap-standing-check bar.
  - step: 11
    phase: pre-deploy
    action: >-
      Run the BARE full tier before handoff. This plan declares
      handoff_policy.full_validation_required_before_commit: true, and until this step existed the
      obligation was discharged only through the Decision 163 matcher hole the constraints below
      record -- `-m scripts.validate --test-coverage-only` SATISFIES _is_full_tier_segment while
      running one diff-scoped check. A declared obligation discharged by a matcher artifact is
      exactly the declared-vs-executed failure mode Decision 163 clause 2 names; this step
      discharges it for real.
    command: bin/venv-python -m scripts.validate
    expected: >-
      Exit 0 across the whole full-tier sequence, including validate_test_coverage over every
      mapping (not just the fast-tier-runnable subset), validate_sloc_limits, and
      validate_plan_documents over this plan.
    fix_if: >-
      A full-tier-only failure is by definition not reproducible under `--pre` or under
      `--test-coverage-only`; read the reported check name and fix forward (Decision 55), never
      re-run a narrower flag and call the obligation discharged. A full-tier failure that traces to
      a heavy dependency absent from THIS container is an environment gap, not a code failure --
      record it and route to main-validate rather than weakening the check.
    hermetic: false
    graduation: waive
    graduation_waiver_reason: >-
      This step IS the full tier; graduating it into the verification registry would make the tier
      a check inside itself, exactly as step 8's waiver reasons for the fast tier. Its cost is the
      full tier's own honest 15-30-minute budget (Decision 73 point 1), far outside the
      cheap-standing-check bar.
  - step: 9
    phase: post-deploy
    action: >-
      After merge, confirm the two bundled CI-RCA recs actually closed via the Resolves: trailer.
    command: |-
      bin/venv-python -m scripts.ops_data_portal --sync && grep -cE '"id": "rec-(3211|3212)".*"status": "closed"' logs/.recommendations-log.jsonl
    expected: Prints 2.
    fix_if: >-
      Fewer than 2 means rec-autoclose.yml did not fire; fall back to the documented
      ops_data_portal --update-rec path per Decision 70. Use the portal's own `--sync` flag
      (scripts/ops_portal/cli.py:109) -- AGENTS.md's Single Portal Invariant forbids an agent
      calling `scripts.sync.ops` directly, so `-m scripts.sync.ops sync` is not an acceptable
      substitute here even though it reaches the same reader.
test_obligations:
  - source: scripts/validate.py
    behavior: >-
      --test-coverage-only dispatches validate_test_coverage alone, exits 0 on a source-free diff,
      exits non-zero on a diff-touched file below its floor, and does not call
      validation_result.clear (the tier-selection guard).
    verification_step: 4
    test_selector: tests/validate/test_coverage_only.py::TestCoverageOnlyFlag
    red_green_expectation: >-
      Red before: neither the flag nor the module exists -- `bin/venv-python -m scripts.validate
      --test-coverage-only` exits 2 with "unrecognized arguments" (reproduced live this session).
      Green after: all cases pass, including the below-floor non-zero exit and the
      clear-not-called guard case.
  - source: scripts/checks/misc/validate_test_coverage.py
    behavior: >-
      In pre-merge mode the check partitions each changed source file's MAPPED TEST via
      partition_changed_tests_by_collectability and enforces the floor only for the `runnable`
      arm; the `deferred` arm is reported as deferred-to-post-merge and contributes no failure.
      Full-tier behaviour is unchanged -- every mapping is still enforced.
    verification_step: 10
    test_selector: tests/checks/misc/test_validate_test_coverage.py::TestPreMergeRunnablePartition
    red_green_expectation: >-
      Red before: the check has no partition step at all, so a stubbed deferred mapping still
      forks the measurement subprocess and appends a coverage failure -- the new deferred-arm case
      fails and the new runnable-arm case has no code path to assert against. Green after: the
      deferred arm appends no failure and emits an explicit deferred-to-post-merge line, while the
      runnable arm still appends the below-floor failure (fail-closed direction preserved).
  - source: tests/platform_roadmap_state/test_state_dict_and_feeds.py
    behavior: >-
      The two negative-path tests stay bound to the branch they name, so a future short-circuit
      above them fails the suite instead of silently un-reaching it.
    verification_step: 1
    test_selector: tests/platform_roadmap_state/test_state_dict_and_feeds.py
    red_green_expectation: >-
      Red before: coverage measures 98.58% with lines 115 and 125-126 missing (reproduced live this
      session). Green after: 100.0%, empty Missing column. The coverage number is itself the
      discriminator -- re-shadowing these fixtures reproduces the red. The selector is the FILE,
      not a class: the two tests live in DIFFERENT classes (test_malformed_plan_skipped is in
      TestComputeFollowonState at :432; only test_plan_yaml_top_level_not_dict_skipped is in
      TestComputeFollowonStateMalformedPlanShapes at :500), and the file is the narrowest selector
      that genuinely hosts both while still being selected by step 1's directory argument.
  - source: .github/workflows/ci.yml
    behavior: The pr-validate job runs the coverage gate before its --pre step.
    verification_step: 6
    command: |-
      body=$(sed -n '/^  pr-validate:/,/^  main-validate:/p' .github/workflows/ci.yml)
      cov=$(printf '%s\n' "$body" | grep -n 'validate --test-coverage-only$' | cut -d: -f1 | head -1)
      pre=$(printf '%s\n' "$body" | grep -n 'validate --pre$' | cut -d: -f1 | head -1)
      test -n "$cov" && test -n "$pre" && test "$cov" -lt "$pre"
    waiver_reason: >-
      Workflow YAML is not unit-testable in-process; Decision 119 makes CI the authoritative
      verifier for workflow wiring, with a local grep-shaped presence-plus-ordering assertion
      standing in. Discrimination of the gate itself is carried by VP steps 5 and 10, not by this
      structural check.
constraints:
  - >-
    Do NOT promote validate_test_coverage to the --pre tier via pre=True in
    scripts/checks/misc/_manifest.py. _FAST_TIER_BUDGET_SECONDS is 300 and a single file's
