    ## Decision 173: A bounded, reactively-deferred per-file coverage gate runs inside pr-validate ahead of --pre (amends Decision 73 clause 2's pre-merge allocation) (Decided)

    ```yaml
    number: 173
    status: Decided
    decided_date: "<transcription date>"
    amends: [73]
    significance:
      value: numbered_decision
      justification: >-
        A durable architectural commitment that changes WHAT the pinned pre-merge required check
        runs -- not merely how an existing check is invoked -- with reversal-relevant consequences
        for the pre-merge cost envelope and for every future pre-merge gate proposal. (i) The
        specific field_semantics home considered and REJECTED is docs/contracts/check-manifest.yaml,
        which owns the per-domain manifest grammar including tier membership (`pre=` /
        `full_segment=`): this change alters no manifest field's MEANING and leaves
        validate_test_coverage's manifest entry untouched (no pre=True), so a note there would
        describe a field that does not move while leaving the actual commitment -- which checks
        gate merge -- unowned. (ii) amendment_forms (a dated in-place annotation on Decision 73)
        does not suffice: an amendment trailer is an append-only clarification of existing text,
        carrying no significance envelope and no reversal-conditions stanza of its own, so a reader
        arriving from a red pr-validate run would have no citable, reversible anchor for the gate.
        Decision 153 set the governing precedent -- it amended Decision 73's ENFORCEMENT and earned
        its own number rather than annotating 73 in place.
    ```

    **Status:** Decided
    **Date:** <transcription date>
    **Warehouse ID:** dec-173 (keyed on the decision number; synced to ops_decisions via
    `ops_data_portal --backfill-decisions-md` post-merge, per Decision 84)

    **Problem:**
    The per-file coverage floor (`validate_test_coverage`, 100% or a config/coverage_baseline.yaml
    entry) is registered full-tier-only -- `scripts/checks/misc/_manifest.py` sets
    `full_segment="full_after_lint"` and no `pre=True`, and `pre_sequence()`'s 83 checks do not
    include it. Enforcement therefore happens only post-merge, on main-validate, which makes every
    coverage regression structurally guaranteed to land on main before anything objects. The escape
    class has now been filed four times: rec-2970 (2026-08-03, diagnosed exactly, closed on a
    non-discriminating probe), rec-3043/3044 (08-05) and rec-3147 (08-15) (closed corrective-only),
    rec-3163 (08-16, filed as the live owner), and rec-3211/3212 (the recurrence rec-3163 predicted).
    Decision 159 clause 5 already names the full-tier-only tripwire an ACCEPTED RESIDUAL; four
    recurrences is the evidence that the residual should no longer be accepted.

    **Decision:**
    1. **A bounded coverage gate runs inside pr-validate, ahead of `--pre`.** `.github/workflows/ci.yml`'s
       pr-validate job -- one of exactly two checks `terraform/github/repo.tf` pins as
       required_status_checks -- gains a `run:` step invoking `python -m scripts.validate
       --test-coverage-only` BEFORE its existing `--pre` step. This amends Decision 73 clause 2's
       allocation ("PR gating uses fast tier"): the pre-merge gate is now the fast tier PLUS one
       bounded, separately-clocked per-file coverage step. Clause 2's other commitments are
       untouched -- the full tier still runs on push to main and on the scheduled drift canary, and
       the fast tier's own 300s budget assertion is unchanged and unshared.
    2. **Bounded by a REACTIVE absent-heavy-dependency probe -- the bound is load-bearing, not an
       optimisation.** pr-validate installs only requirements-fast.txt + requirements-dev.txt; 18
       distributions are deliberately excluded, and TWO DISTINCT failure shapes follow from that.
       (i) MODULE-SCOPE heavy import: pytest exits before pytest-cov writes `.coverage.json`, the
       per-file percentage comes back None, no error is appended, and the file passes SILENTLY -- an
       unreported hole, not a red. (ii) LAZY / function-scope heavy import, inside a test or the
       production code it exercises: collection succeeds, coverage data IS written, the source
       measures at or near 0%, and a hard below-floor error is appended -- the pinned required check
       reds for a DEPENDENCY reason, which is not a coverage signal and would train sessions to
       distrust the gate. A correct bound must cover BOTH. Pre-merge mode therefore measures ONCE
       (a public single-pass wrapper over `scripts/test_coverage_checker.py`'s `_measure_and_check`
       returns the percentages and the errors together), then REACTIVELY probes only the source
       files that produced a floor error or no usable measurement: each is mapped to its test
       target, normalised to repo-relative POSIX, expanded from a directory target to its
       constituent test modules
       (`scripts/checks/_pytest_diff.py::_expand_directory_test_targets`), and run through
       `_runtime_heavy_dep_defer_reason` against `_excluded_heavy_import_names()`. A probe naming a
       genuinely-absent excluded heavy dependency classifies that source as deferred-to-post-merge,
       reported explicitly with the source file, the probed test module and the absent dependency;
       anything else is a genuine coverage failure and reds the gate (FAIL-CLOSED -- no absent-dep
       root cause means a real failure). The pre-merge gate is therefore a BEST-EFFORT EARLY SIGNAL;
       the post-merge full tier, where the full requirements.txt is installed, remains the
       AUTHORITATIVE floor and enforces every deferred file. Deferral is always reported; a silent
       skip is a defect, not a mode. A `--collect-only` partition
       (`partition_changed_tests_by_collectability`) was considered and REJECTED on verified
       evidence: it is blind to shape (ii), and its per-file, repo-relative-string input contract
       cannot express the absolute-path package-DIRECTORY targets `map_source_to_test` returns for
       33 of 294 mapped sources, so those targets never defer at all.
    3. **Not a third tier.** Applying Decision 153 clause 4's five-property test (invocation flag,
       check sequence, selection scope, trigger/role, budget contract, selected ex ante): the flag
       and a one-check sequence are present, but that sequence is a strict SUBSET of the existing
       full-tier sequence, not a new one; there is no independent selection scope (it reuses
       validate_test_coverage's own diff scoping, with a reactive absent-dependency probe applied
       AFTER measurement rather than a new selection rule); no CI job and no event trigger are added
       and pr-validate's gating role is unchanged; and there is no independent budget contract --
       the step is bounded above by pr-validate's existing 30-minute job timeout and never enters
       `_scaffold_budget_assertion`'s elapsed window. This is the adapter class, alongside
       `--terraform-only` (which Decision 153 was written beside without counting as a tier), not
       the tier class. Decision 60's two named validate surfaces and Decision 73's two CI gating
       roles both survive intact.
    4. **Cost envelope.** One pytest subprocess per changed source file, measured at ~141-197s each
       (141s this session; Decision 163 clause 3 measured the same check over `scripts/validate.py`
       at 3m17s), from a SINGLE measurement pass -- calling `measure_per_file_coverage` and
       `check_per_file_coverage` separately would double it, which is why the public single-pass
       wrapper exists. The reactive probe adds one isolated pytest run per ALREADY-FAILING or
       unmeasured file and nothing at all on a green PR, which is the common case. The step runs on
       its own clock BEFORE `--pre`, so a breach of the shared 30-minute pr-validate job timeout --
       from which Decision 153 clause 3 derives its 1500s forced-run ceiling -- stays attributable
       to whichever step consumed it. Residual, named and accepted: a root-conftest PR
       (`full_suite_forced`) that ALSO changes many source files could approach the job timeout; the
       conjunction is rare and observable.
    5. **Shared-timeout invariant (Decision 153 clause 3).** Decision 153's 1500s forced-run ceiling
       for `--pre` is DERIVED FROM pr-validate's 30-minute (1800s) job timeout, not chosen
       independently of it. Placing a preceding step of wall-clock duration D inside the same job
       changes the invariant that must hold to `D + 1500s + margin <= 1800s`. The coverage step's
       own budget is therefore whatever 1800s leaves once the forced-run ceiling and a margin are
       reserved -- under 300s at the stated ceiling -- and the 1500s ceiling is NOT renegotiable on
       its own: any proposal to raise it, or to let D grow into the margin, must be re-adjudicated
       against the 1800s job timeout as a single budget, per Decision 153 clause 3. Reversal
       condition (a) below is the tripwire for exactly that conjunction.

    **Rationale:**
    Post-merge-only enforcement of a floor that is cheap to check per file, on a repository whose
    merge gate is a single pinned status check, guarantees the regression lands before the signal
    fires -- and four recurrences show the corrective loop does not substitute for the preventive
    one. The alternative of promoting the check to `--pre` via `pre=True` was rejected on measured
    grounds: at ~141-197s per source file against a 300s fast-tier budget, rec-2987 already records
    a real 5.5-minute fast-tier breach on a branch attempting exactly that. A separate CI job was
    rejected because required_status_checks pins only `pr-validate` and `terraform-validate`, so a
    new job would gate no merge without a human-gated terraform/github apply, and because
    terraform-validate's checkout lacks `fetch-depth: 0`, which a diff-aware check requires to
    resolve origin/main at all. A separately-clocked step inside the already-pinned job is the only
    shape that gates merge, keeps the fast tier's budget contract intact, and needs no
    infrastructure apply. Reactive deferral rather than predictive partitioning is the honest shape:
    the predictive probe cannot see the failure that actually reds the gate, and a gate that defers
    the harmless shape while staying blind to the harmful one is worse than no bound, because it
    reads as protection.

    **Reversal conditions:**
    (a) the coverage step's wall clock, in conjunction with a `full_suite_forced` `--pre` run,
    repeatedly approaches pr-validate's 30-minute job timeout -- re-adjudicate under clause 5's
    invariant: cap the per-PR enforced-file count, or return the gate to post-merge, but do not
    silently raise the job timeout and do not renegotiate the 1500s ceiling on its own; (b) the
    reactive probe FALSE-DEFERS a genuine coverage failure more than once, letting the gate go quiet
    -- fix the probe, never loosen the gate (the fail-closed direction is the design); (c) a fifth
    recurrence of the coverage-regression escape class lands despite the gate -- the gate is then
    the wrong instrument and the escape class needs a different one; (d) the gate's scope is
    proposed to widen beyond a best-effort early signal (e.g. installing heavy dependencies into
    pr-validate so nothing defers) -- that changes the fast tier's own dependency contract and must
    be re-adjudicated against Decision 73 clause 2 afresh, not absorbed under this entry. Full
    reversal is deleting the ci.yml step; post-merge enforcement continues unchanged via
    main-validate.

    **Related:** Decision 73 (clause 2's pre-merge allocation, amended here in this entry's body per
    the Decision 134/145 amend-only convention -- Decision 73's own text is not edited), Decision 153
    (the not-a-tier five-property test applied here, the 1500s forced-run ceiling derived from the
    same job timeout, and the precedent of amending Decision 73's enforcement under a new number),
    Decision 60 (two named validate surfaces -- unchanged), Decision 159 clause 5 (the accepted
    residual this closes), Decision 104 (the heavy-dep deferral machinery clause 2's reactive probe
    belongs to), Decision 163 (the pre-handoff full-tier obligation and the 3m17s measurement),
    Decision 169 (registry.resolve dispatch), Decision 165 (baseline markers must name an authorizing
    Decision), Decision 119 (CI-delegated verification of workflow wiring), Decision 55 (forward-fix).
