constraints:
  - >-
    READ-ONLY means the engine never modifies the plan, any registry, any config, or any cache. It
    does NOT mean it runs nothing - the discrimination and selector legs execute candidate commands.
    Any implementation that writes a report file, a cache, or a registry row violates this.
  - >-
    RE-ENTRANCY EXCLUSION (blocking). scripts/validate.py:347-351 exits 0 when _VALIDATE_DEPTH >= 1,
    and a PYTEST_CURRENT_TEST guard does the same. Measured: `_VALIDATE_DEPTH=5 bin/venv-python -m
    scripts.validate --pre` exits 0. The discrimination leg runs inside a validate run (depth 1), so
    without an explicit exclusion it would flag every `-m scripts.validate` step as
    non-discriminating - and Decision 163 MANDATES such a step on every schema-v3/v4 IMPLEMENTATION
    plan (293 of 325 plans carry one). Exclude any command matching the full-tier/fast-tier validate
    invocation from the discrimination leg, and document the exclusion in the contract.
  - >-
    BOUNDED EXECUTION (blocking). Reuse validate_vp_replay's harness and its constants
    (PER_STEP_TIMEOUT_SECONDS=30, MAX_AGGREGATE_SECONDS=120, MAX_REPLAYED_STEPS=20) rather than
    re-deriving them; scripts/validate.py:261 pins _FAST_TIER_BUDGET_SECONDS=300 and these checks run
    inside that budget. Add a self-reference guard: the engine must refuse to execute a command that
    invokes the engine itself (this plan's own step 6 does exactly that).
  - >-
    Do NOT call validate_vp_replay to perform replay. Decision 148 clause 1 rules plan-time replay
    invalid by construction because the FAILURE signal is uninformative on an implementation-less
    tree. The discrimination leg reads only the PASS signal, which is informative in the opposite
    direction. Reuse the module's execution harness; do not reuse its replay semantics.
  - >-
    THREE separate registered checks, not one. The round-1 justification for bundling (that three
    more re-export lines would breach the 500 ceiling) was disproved by measurement: ruff
    line-length is 127 and two check names fit one line, so three checks cost two lines
    (measured 124 and 97 chars) and land validate.py at 499. Bundling would also collapse three
    failure modes into one ci_rca_taxonomy category, whose function_to_category map is strictly 1:1
    across all 96 existing entries.
  - >-
    PROSE RELOCATION ARITHMETIC. planning/SKILL.md has 6 bytes of headroom (55810/55816). Fund the
    additions by relocating two topically-matched Step-8 obligation sections into
    docs/contracts/plan-obligations.yaml: `## Closure Obligation (Workflow Step 8, CONDITIONAL)`
    (1087 B) and `## Related-Work Check (Workflow Step 8, when ci-rca recs are open)` (911 B) =
    1998 B freed, less roughly 250 B for two anchor+pointer stubs, plus the 6 B headroom = about
    1754 B available. Do NOT relocate Preflight Constraints, Verification Tier Guidelines, the
    Decision Scout Gate or the Report Critique Gate - Decision 168 clause 4 requires the contract's
    subject to be unique and singular, and those are different subjects.
  - >-
    Decision 128 does NOT apply to config/prose_budgets.yaml. That registry deliberately diverges
    from the SLOC decompose-by-default valve, and Decisions 114/110 forbid fragmenting a prose
    surface. Relocation to a contract with an anchor+pointer is permitted and is the chosen remedy.
  - >-
    Decision 128 DOES apply to scripts/validate.py (SLOC, unregistered, 500 residual default). If
    the re-exports push it over 500, decompose the facade per Decision 80 - never raise.
  - >-
    Reuse scripts/checks/_common.py plan-resolution helpers (load_plan, plan_paths_from_changed,
    feat_commit_slugs) and scripts/verification_checks.py CANONICAL_SLOTS. Do not re-implement
    selector logic - Decision 135 owns affected-set derivation via map_source_to_test.
  - >-
    The obligation report is ADVISORY to the plan-critique gate. Decision 132 limitation A rules
    graduation-classification correctness "a human/plan-critique call, at plan time, never
    mechanized" - the critic must never defer its verdict to this report.
  - Test files colocate per the Decision 131 mirror rule (tests/checks/planning/).
  - No rescue agents or workaround loops (Decision 55)
  - No emojis; ASCII hyphens only; ruff formatting at line length 127
context:
