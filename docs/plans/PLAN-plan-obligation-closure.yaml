  - >-
    CUT from scope after round 1: the gate-provenance leg and its optional PlanDocument field. The
    critique demonstrated that no surface in the repo records a gate verdict - no check parses the
    gates: line, context is a bare list[str], no session or log artifact carries one - so a
    planner-authored field relocates the self-report into a typed field rather than replacing it.
