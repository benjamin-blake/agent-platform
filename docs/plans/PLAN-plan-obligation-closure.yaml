schema_version: 4
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: "plan-obligation-closure"
intent: >-
  Make the mechanically-decidable half of a plan's obligations computable at plan-authoring time
  instead of discoverable one plan-critique round at a time, so the fresh-context critic spends its
  judgement on adequacy and frame rather than on arithmetic the repo can already do.
plan_type: IMPLEMENTATION
verification_tier: V2
plan_path: docs/plans/PLAN-plan-obligation-closure.yaml
phase: >-
  Platform governance / plan-loop control surface. Adjacent to T2.54 (clause-to-check index,
  not_started) but deliberately narrower: this plan closes obligations for PLAN documents only and
  files the general clause-to-check index as a follow-on rec against T2.54.
scope:
  - file: scripts/checks/planning/__init__.py
    action: Create
    purpose: package marker for the new check domain
  - file: scripts/checks/planning/_manifest.py
    action: Create
    purpose: >-
      Entry literals for the three new checks. This is the registration surface as of Decision 169
      (#883) - scripts/validate.py is never touched. Bare string-literal module=/attr= pairs only,
      per docs/contracts/check-manifest.yaml.
  - file: scripts/checks/planning/obligations.py
    action: Create
    purpose: >-
      Shared read-only obligation engine plus its agent-facing CLI. Public module name because
      `bin/venv-python -m scripts.checks.planning.obligations` IS the documented agent surface.
      Owns the registration-coupling closure rule and the bounded execution harness.
  - file: scripts/checks/planning/validate_plan_scope_closure.py
    action: Create
    purpose: >-
      Static leg. Given scope files + actions, derive the coupled registration rows that become
      obligatory and fail on any omitted from the plan's own scope. The genuinely new capability.
  - file: scripts/checks/planning/validate_plan_discrimination.py
    action: Create
    purpose: >-
      Executing leg, plan-only-PR leg ONLY. A pre-deploy step whose command exits 0 on a tree with
      no implementation cannot be evidence the implementation works.
  - file: scripts/checks/planning/validate_plan_selector_vacuity.py
    action: Create
    purpose: >-
      Executing leg. A pytest selector - `-k` expression OR node id - that already resolves to
      passing tests before the implementation exists passes vacuously.
  - file: scripts/checks/registry.py
    action: Modify
    purpose: >-
      Correct the module docstring's registration procedure only. Dispatch is manifest-driven as of
      Decision 169, so no sequence edit is needed here - but the docstring still omits the
      ci_rca_taxonomy and verification_registry surfaces (verified post-#883).
  - file: config/ci_rca_taxonomy.yaml
    action: Modify
    purpose: one function_to_category row per new check (the map is total over registered checks)
  - file: config/agent/verification_registry/registry.yaml
    action: Modify
    purpose: registry rows for this plan's graduate-disposition verification steps
  - file: docs/contracts/plan-obligations.yaml
    action: Create
    purpose: >-
      Class D mechanism contract owning the obligation-set semantics, and the relocation target that
      keeps planning/SKILL.md net-neutral. Follows the check-manifest.yaml precedent exactly:
      status ratified, ratified_via dec-170, evaluator {check: validate_plan_scope_closure},
      amendment_log as a TOP-LEVEL sibling of contract:.
  - file: docs/contracts/file-router.yaml
    action: Modify
    purpose: >-
      Discovery route whose `topic` equals the contract's `subject` (contract-population.yaml binds
      them). check-manifest.yaml took a route in #883; omitting one leaves the contract
      undiscoverable and the subject binding unexercised.
  - file: .claude/skills/planning/SKILL.md
    action: Modify
    purpose: >-
      Add the obligation-query call sites (Step 4, Step 6b on scope change, pre-critique-round), the
      pre-6b measurement re-derivation gate, and the convergence-cap finding-origin attribution with
      split-as-first-class. Net byte delta MUST be <= 0, funded by relocation (see Constraints).
  - file: .claude/skills/plan-critique/SKILL.md
    action: Modify
    purpose: >-
      Consume the obligation report instead of re-deriving mechanical facts by hand; add
      finding-origin attribution to the structured output.
  - file: .claude/commands/plan.md
    action: Modify
    purpose: Steps 4, 6b and 9 wording for the obligation query and the revised escalation
  - file: scripts/CLAUDE.md
    action: Modify
    purpose: >-
      Complete the "Adding a validate.py check" procedure with the ci_rca_taxonomy and
      verification_registry surfaces. #883 rewrote this procedure from scratch and reproduced the
      identical omission, which is why a check rather than a doc fix is the remedy.
  - file: docs/DECISIONS.md
    action: Modify
    purpose: Decision 170 - the gate-contract change (drafted here, written at implement time)
  - file: tests/checks/planning/__init__.py
    action: Create
    purpose: package marker - all sibling tests/checks/<domain>/ directories carry one
  - file: tests/checks/planning/test__manifest.py
    action: Create
    purpose: mirror test for the domain manifest, required by the Decision 169 procedure
  - file: tests/checks/planning/test_obligations.py
    action: Create
    purpose: unit tests for the closure engine, the bounded harness and the CLI report shape
  - file: tests/checks/planning/test_validate_plan_checks.py
    action: Create
    purpose: discriminating tests for all three registered checks
bundled_recommendations: []
infrastructure_dependencies: []
acceptance_criteria:
  - >-
    `bin/venv-python -m scripts.checks.planning.obligations --plan <path>` prints a structured
    obligation report and ALWAYS exits 0, including on a plan with unmet obligations - it is an
    advisory reporting surface, never a gate. The three registered checks are the gate and exit
    non-zero on an unmet obligation. Both exit contracts are exercised separately below.
  - >-
    Given a plan whose scope creates a scripts/checks/**/validate_*.py file but omits that domain's
    _manifest.py or config/ci_rca_taxonomy.yaml, validate_plan_scope_closure fails and names each.
  - >-
    validate_plan_discrimination runs ONLY on a plan-only PR (no feat({slug}) commit on
    `git log origin/main..HEAD`) and DEFERS with a printed reason otherwise.
  - >-
    validate_plan_discrimination flags a pre-deploy step that exits 0 on the implementation-less
    tree ONLY when that step's graduation disposition is `graduate`; a step declared `waive` with a
    reason is a declared tautology and is never flagged.
  - >-
    The executing legs execute ONLY `hermetic: true` steps, and never execute a command that
    re-enters scripts.validate or invokes the engine itself.
  - >-
    The executing legs are bounded by one SHARED aggregate budget: per-step timeout, aggregate
    wall-clock cap and step cap, sized against the fast tier's 300s assert.
  - >-
    validate_plan_selector_vacuity flags a vacuous pytest selector in BOTH forms - a `-k`
    expression and a `::` node id.
  - >-
    All three checks resolve through manifest dispatch and appear in both tier sequences, and each
    has its own row in config/ci_rca_taxonomy.yaml's function_to_category map.
  - >-
    scripts/CLAUDE.md's and scripts/checks/registry.py's registration procedures each describe all
    five current registration surfaces within the procedure prose itself.
  - >-
    docs/contracts/plan-obligations.yaml is a valid Class D contract at status ratified with
    ratified_via dec-170, evaluator {check: validate_plan_scope_closure}, and a TOP-LEVEL
    amendment_log; and docs/contracts/file-router.yaml carries a route whose topic equals its subject.
  - >-
    .claude/skills/planning/SKILL.md and scripts/CLAUDE.md each have a net byte delta <= 0, and
    config/prose_budgets.yaml carries no new or raised entry for either.
  - >-
    The plan corpus still validates: validate_plan_documents, validate_graduation_completeness,
    validate_verification_registry and validate_handoff_full_tier all return zero failures.
  - Decision 170 is present in docs/DECISIONS.md carrying the Decision 167 typed envelope.
verification_plan:
  - step: 1
    phase: pre-deploy
    hermetic: false
    action: Scope closure obliges a manifest Entry and a taxonomy row for a check-creating plan
    command: >-
      bin/venv-python -m pytest tests/checks/planning/test_obligations.py::TestScopeClosure -q
    expected: passes; the report names the domain _manifest.py and config/ci_rca_taxonomy.yaml as unmet
    fix_if: >-
      no obligation returned - the scope-shape trigger is not matching validate_*.py creation, or it
      still encodes the pre-Decision-169 validate.py re-export rule
    graduation: graduate
    graduation_check_id: plan-obligations-closure-registration
  - step: 2
    phase: pre-deploy
    hermetic: false
    action: Discrimination runs on a plan-only PR and DEFERS on an implement PR
    command: >-
      bin/venv-python -m pytest tests/checks/planning/test_validate_plan_checks.py::TestLegModel -q
    expected: >-
      passes - the check runs when `git log origin/main..HEAD` has no feat({slug}) commit, and
      returns a printed DEFER otherwise
    fix_if: >-
      no leg model - without it this check directly contradicts validate_vp_replay, which FAILS a
      step whose returncode is non-zero (validate_vp_replay.py:118) while this one fails a step whose
      returncode is zero. Both are sequenced in both tiers; on a co-present plan+code PR their pass
      conditions are exact complements.
    graduation: graduate
    graduation_check_id: plan-obligations-leg-model
  - step: 3
    phase: pre-deploy
    hermetic: false
    action: Discrimination flags only `graduate` steps, never declared `waive` tautologies
    command: >-
      bin/venv-python -m pytest tests/checks/planning/test_validate_plan_checks.py::TestDispositionRespect -q
    expected: >-
      passes - a tautological step marked graduate is flagged; a tautological step marked waive with
      a reason is not
    fix_if: >-
      declared waivers are flagged - the check would wedge every plan carrying a legitimate
      regression-ceiling step, including this one (its own steps 18-20 exit 0 by design)
    graduation: graduate
    graduation_check_id: plan-obligations-disposition-respect
  - step: 4
    phase: pre-deploy
    hermetic: false
    action: The executing legs execute only hermetic steps and refuse re-entrant or self-invoking commands
    command: >-
      bin/venv-python -m pytest tests/checks/planning/test_validate_plan_checks.py::TestExecutionConfinement -q
    expected: >-
      passes - non-hermetic steps are skipped unexecuted; a command matching scripts.validate is
      skipped unexecuted; a command invoking the engine itself is refused
    fix_if: >-
      a non-hermetic step is executed - the corpus holds 202 pre-deploy steps invoking aws/boto3/
      terraform/ops_data_portal, and this check runs in the creds-free pr-validate job
    graduation: graduate
    graduation_check_id: plan-obligations-execution-confinement
  - step: 5
    phase: pre-deploy
    hermetic: false
    action: One shared aggregate budget bounds all executing legs
    command: >-
      bin/venv-python -m pytest tests/checks/planning/test_obligations.py::TestBounding -q
    expected: passes - per-step timeout, shared aggregate wall-clock cap and step cap all enforced
    fix_if: >-
      per-leg budgets - three independent 120s budgets plus vp_replay's own is a 480s worst case
      against the 300s assert at scripts/validate.py's fast-tier budget
    graduation: graduate
    graduation_check_id: plan-obligations-shared-budget
  - step: 6
    phase: pre-deploy
    hermetic: false
    action: Selector vacuity covers both `-k` expressions and `::` node ids
    command: >-
      bin/venv-python -m pytest tests/checks/planning/test_validate_plan_checks.py::TestSelectorVacuity -q
    expected: passes for both selector forms
    fix_if: >-
      only -k covered - the corpus holds 237 node-id steps against 133 -k steps, and every selector
      in this plan is a node id, so a -k-only check would be blind to its own plan
    graduation: graduate
    graduation_check_id: plan-obligations-selector-both-forms
  - step: 7
    phase: pre-deploy
    hermetic: false
    action: The CLI runs successfully, exits 0 on unmet obligations, and leaves the tree identical
    command: >-
      bin/venv-python -m pytest tests/checks/planning/test_obligations.py::TestCliContract -q
    expected: >-
      passes - exit 0 on a clean plan AND on a plan with unmet obligations (advisory, not a gate),
      with no file in the tree modified
    fix_if: >-
      non-zero on unmet obligations - the CLI has become a gate, contradicting acceptance criterion 1;
      a mutated tree means the engine writes a cache or report file
    graduation: graduate
    graduation_check_id: plan-obligations-cli-contract
  - step: 8
    phase: pre-deploy
    hermetic: false
    action: The domain manifest is well-formed and all three checks resolve through it
    command: >-
      bin/venv-python -m pytest tests/checks/planning/test__manifest.py -q && bin/venv-python -c "from scripts.checks import registry; [registry.resolve(n) for n in ('validate_plan_scope_closure','validate_plan_discrimination','validate_plan_selector_vacuity')]; print('resolve ok')"
    expected: mirror tests pass and all three names resolve via registry.resolve
    fix_if: >-
      resolve failure - the Entry is missing, or module=/attr= were written as a combined
      "module:attr" string, which docs/contracts/check-manifest.yaml forbids
    graduation: graduate
    graduation_check_id: plan-obligations-manifest-resolve
  - step: 9
    phase: pre-deploy
    hermetic: true
    action: All three checks are members of BOTH tier sequences
    command: >-
      bin/venv-python -c "from scripts.checks import registry; pre={s.name for s in registry.pre_sequence()}; full={s.name for s in registry.full_sequence()}; names=('validate_plan_scope_closure','validate_plan_discrimination','validate_plan_selector_vacuity'); missing=[(n,'pre') for n in names if n not in pre]+[(n,'full') for n in names if n not in full]; assert not missing, missing; print('both sequences ok')"
    expected: exit 0, prints both sequences ok
    fix_if: >-
      missing - set pre=True (with pre_globs) and full_segment= on the Entry. Reachability tests
      alone do not assert sequence membership.
    graduation: graduate
    graduation_check_id: plan-obligations-both-sequences
  - step: 10
    phase: pre-deploy
    hermetic: true
    action: Each check has its own taxonomy row
    command: >-
      bin/venv-python -c "import yaml;m=yaml.safe_load(open('config/ci_rca_taxonomy.yaml'))['function_to_category'];missing=[n for n in ('validate_plan_scope_closure','validate_plan_discrimination','validate_plan_selector_vacuity') if n not in m];assert not missing, f'unmapped checks red the fast tier: {missing}'"
    expected: exit 0
    fix_if: assertion - add the function_to_category rows (this is #874's round-4 blocker, reproduced)
    graduation: graduate
    graduation_check_id: plan-obligations-taxonomy-mapped
  - step: 11
    phase: pre-deploy
    hermetic: true
    action: The contract has the Class D shape the schema actually requires
    command: >-
      bin/venv-python -c "import yaml;d=yaml.safe_load(open('docs/contracts/plan-obligations.yaml'));c=d['contract'];assert c['class']=='D';assert c['status']=='ratified';assert c['ratified_via'];assert c['evaluator']=={'check':'validate_plan_scope_closure'};assert 'amendment_log' in d and 'amendment_log' not in c;print('class D shape ok')"
    expected: exit 0, prints class D shape ok
    fix_if: >-
      shape failure - amendment_log is a TOP-LEVEL sibling of contract:, not a key inside it, and
      ContractMeta is extra=forbid, so a contract carrying it inside contract: fails schema load.
      Mirrors docs/contracts/check-manifest.yaml exactly.
    graduation: graduate
    graduation_check_id: plan-obligations-contract-shape
  - step: 12
    phase: pre-deploy
    hermetic: true
    action: The file-router route exists and its topic equals the contract subject
    command: >-
      bin/venv-python -c "import yaml;r=yaml.safe_load(open('docs/contracts/file-router.yaml'));c=yaml.safe_load(open('docs/contracts/plan-obligations.yaml'))['contract'];routes=[x for x in r['routes'] if x.get('topic')==c['subject']];assert routes, f'no route with topic {c[\"subject\"]!r}';assert 'docs/contracts/plan-obligations.yaml' in routes[0]['targets'];print('route ok')"
    expected: exit 0, prints route ok
    fix_if: >-
      missing - contract-population.yaml binds a route's topic to the contract's subject; without the
      route the contract is undiscoverable and the binding is unexercised
    graduation: graduate
    graduation_check_id: plan-obligations-router-route
  - step: 13
    phase: pre-deploy
    hermetic: true
    action: The contract drift validator returns a real status over the new contract
    command: >-
      bin/venv-python -c "import pathlib;from scripts.checks.contracts.validate_contract_drift import validate_contract_drift;assert pathlib.Path('docs/contracts/plan-obligations.yaml').exists(), 'contract absent - nothing to scan';f=[];validate_contract_drift(f);bad=[x for x in f if 'plan-obligations' in str(x)];assert not bad, bad;print('drift clean for plan-obligations')"
    expected: exit 0, prints drift clean for plan-obligations
    fix_if: >-
      a failure names plan-obligations - the declared evaluator must demonstrably READ the contract
      (Decision 168); a docstring mention alone was ruled insufficient. Calling the function and
      asserting on the failed list is deliberate - the module has no __main__, so invoking it as a
      script exits 0 vacuously.
    graduation: graduate
    graduation_check_id: plan-obligations-contract-drift-clean
  - step: 14
    phase: pre-deploy
    hermetic: true
    action: Both prose surfaces are net-neutral-or-smaller and the relocation actually happened
    command: >-
      bash -c 'grep -q "plan-obligations.yaml" .claude/skills/planning/SKILL.md || { echo "no anchor+pointer"; exit 1; }; for p in .claude/skills/planning/SKILL.md scripts/CLAUDE.md; do b=$(git show origin/main:$p | wc -c); a=$(wc -c < $p); [ "$a" -le "$b" ] || { echo "$p grew $b->$a"; exit 1; }; done; echo net-neutral ok'
    expected: exit 0, prints net-neutral ok
    fix_if: >-
      "no anchor+pointer" means the relocation was not performed; "grew" means relocate more detail
      into the contract. Do NOT raise a prose budget (Decision 166: a second raise is the accretion
      pattern). The anchor assertion is what makes this discriminating - a bare byte comparison
      passes vacuously on an unchanged tree.
    graduation: graduate
    graduation_check_id: plan-obligations-prose-net-neutral
  - step: 15
    phase: pre-deploy
    hermetic: true
    action: Both registration procedures describe all five surfaces inside the procedure prose itself
    command: >-
      bin/venv-python -c "import pathlib,re,sys;t1=pathlib.Path('scripts/CLAUDE.md').read_text();m1=re.search(r'## Adding a validate\.py check(.*?)(?=\n## |\Z)',t1,re.S);t2=pathlib.Path('scripts/checks/registry.py').read_text();m2=re.search(r'\"\"\"(.*?)\"\"\"',t2,re.S);assert m1 and m2,'procedure block not found';[sys.exit(f'{n} procedure omits {s}') for n,b in (('scripts/CLAUDE.md',m1.group(1)),('registry.py',m2.group(1))) for s in ('ci_rca_taxonomy','verification_registry') if s not in b];print('both procedures complete')"
    expected: exit 0, prints both procedures complete
    fix_if: >-
      a surface is missing from a procedure BLOCK. Scoping to the block is what makes this
      discriminating - a file-wide grep already matches registry.py via unrelated text.
    graduation: graduate
    graduation_check_id: plan-obligations-procedure-complete
  - step: 16
    phase: pre-deploy
    hermetic: true
    action: The critique skill consumes the obligation report and emits finding-origin attribution
    command: >-
      bin/venv-python -c "import pathlib;t=pathlib.Path('.claude/skills/plan-critique/SKILL.md').read_text();assert 'scripts.checks.planning.obligations' in t, 'critic does not invoke the obligation query';assert 'finding-origin attribution' in t.lower(), 'no finding-origin attribution in the output shape'"
    expected: exit 0
    fix_if: >-
      assertion - the critic still re-derives mechanical facts, or the structured output lacks the
      attribution field the convergence-cap escalation depends on. Both assertions name concrete
      tokens rather than a bare word so the guard is not satisfiable by any passing sentence.
    graduation: graduate
    graduation_check_id: plan-obligations-critic-consumes-report
  - step: 17
    phase: pre-deploy
    hermetic: true
    action: The plan command invokes the obligation query at its authoring steps
    command: >-
      bin/venv-python -c "import pathlib;t=pathlib.Path('.claude/commands/plan.md').read_text();assert 'scripts.checks.planning.obligations' in t, 'Step 4/6b do not invoke the obligation query'"
    expected: exit 0
    fix_if: assertion - the command file was not wired to the query
    graduation: graduate
    graduation_check_id: plan-obligations-command-wired
  - step: 18
    phase: pre-deploy
    hermetic: true
    action: Decision 170 is present in the corpus
    command: >-
      bin/venv-python -c "import pathlib;t=pathlib.Path('docs/DECISIONS.md').read_text();assert '## Decision 170:' in t, 'Decision 170 absent'"
    expected: exit 0
    fix_if: >-
      absent - write it. Decision 169 was claimed by #883 while this plan was in critique; if 170 is
      also taken at implement time, shift to the next free number and update every reference here.
    graduation: waive
    graduation_waiver_reason: >-
      The header number is not stable at plan time and this plan has already lost one race (169 went
      to #883 mid-critique), so a registry row pinned to '## Decision 170:' would break on the next
      concurrent merge. The durable graduated guard is validate_decision_entry_conformance, already
      sequenced in both tiers.
  - step: 19
    phase: pre-deploy
    hermetic: true
    action: The whole plan-document check family returns zero failures
    command: >-
      bin/venv-python -c "from scripts.checks.roadmap.validate_plan_documents import validate_plan_documents; from scripts.checks.verification.validate_handoff_full_tier import validate_handoff_full_tier; from scripts.checks.verification.validate_graduation_completeness import validate_graduation_completeness; from scripts.checks.verification.validate_verification_registry import validate_verification_registry; f=[]; [fn(f) for fn in (validate_plan_documents, validate_handoff_full_tier, validate_graduation_completeness, validate_verification_registry)]; print(len(f)); assert not f, f"
    expected: exit 0, prints 0
    fix_if: >-
      failures - a scope file lacks a test obligation, the plan declares full validation without a
      full-tier step, a pre-deploy step lacks a disposition, or a registry row is malformed
    graduation: waive
    graduation_waiver_reason: >-
      Measured tautological: this exits 0 against the unchanged tree because the plan is already
      well-formed, so validate_verification_registry's added-entry differential (which materializes
      each new row in a real origin/main worktree and requires FAIL there) would refuse the row. All
      four validators are themselves already sequenced in both tiers, so a graduated row here would
      duplicate a gate that fires on every run.
  - step: 20
    phase: pre-deploy
    hermetic: true
    action: No raise-approved marker was added to either prose entry
    command: >-
      bash -c 'git diff origin/main -- config/prose_budgets.yaml | grep -E "^\+.*raise-approved" && exit 1 || exit 0'
    expected: exit 0 - no added raise marker
    fix_if: >-
      a marker was added - Decision 165 requires an authorizing Decision body naming the 2-segment
      key verbatim; the dec-150 marker authorizes only significance-gate content
    graduation: waive
    graduation_waiver_reason: >-
      Measured tautological: a negative assertion over a diff that is empty on the unchanged tree
      exits 0 today, so the added-entry differential would refuse it. It cannot be made
      discriminating without asserting on a marker this plan deliberately never adds. The standing
      guard is validate_prose_budget_raises, which reads config/prose_budgets.yaml and validates
      marker AUTHORIZATION retroactively on every run (Decision 165).
  - step: 21
    phase: pre-deploy
    hermetic: false
    action: Fast tier is green
    command: bin/venv-python -m scripts.validate --pre
    expected: exit 0
    fix_if: any check fails - fix forward; never disable a check to pass the tier
    graduation: not-applicable
  - step: 22
    phase: pre-deploy
    hermetic: false
    action: Full tier is green (the handoff_policy obligation, Decision 163 / rec-2965)
    command: bin/venv-python -m scripts.validate
    expected: exit 0
    fix_if: >-
      any check fails - fix forward. This step exists because handoff_policy declares
      full_validation_required_before_commit, and validate_handoff_full_tier requires a VP step
      invoking `-m scripts.validate` WITHOUT --pre.
    graduation: not-applicable
test_obligations:
  - source: scripts/checks/planning/__init__.py
    behavior: The package is importable so the manifest-declared modules resolve.
    verification_step: 8
    command: >-
      bin/venv-python -m pytest tests/checks/planning/test__manifest.py -q && bin/venv-python -c "from scripts.checks import registry; [registry.resolve(n) for n in ('validate_plan_scope_closure','validate_plan_discrimination','validate_plan_selector_vacuity')]; print('resolve ok')"
    waiver_reason: >-
      An empty package marker has no behaviour of its own. Its only observable property - that the
      package resolves so registry.resolve can import the declared modules - is exercised
      transitively by step 8, which fails outright if the package does not import.
  - source: scripts/checks/planning/_manifest.py
    behavior: Declares well-formed Entry literals for all three checks in both tiers.
    verification_step: 8
    test_selector: tests/checks/planning/test__manifest.py
    red_green_expectation: red before (manifest absent), green after
  - source: scripts/checks/planning/obligations.py
    behavior: >-
      Closure derives registration coupling; execution is hermetic-confined, shared-budget bounded
      and self-reference guarded; the CLI is advisory and never mutates the tree.
    verification_step: 5
    test_selector: tests/checks/planning/test_obligations.py::TestBounding
    red_green_expectation: red before (module absent, ImportError), green after
  - source: scripts/checks/planning/validate_plan_scope_closure.py
    behavior: Fails a plan whose scope omits an obligated registration row.
    verification_step: 1
    test_selector: tests/checks/planning/test_obligations.py::TestScopeClosure
