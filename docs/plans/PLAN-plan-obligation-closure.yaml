rollback: >-
  Every element is additive or net-neutral except the two prose edits and the registry sequence
  entries. To roll back: remove the three sequence entries and the two validate.py re-export lines
  first (the checks stop running), then the taxonomy and verification-registry rows, then delete the
  new modules. Per-leg check names buy independent reversal - the discrimination leg can be disabled
  without touching scope-closure. Decision 169 is immutable once written; reverse it with a
  superseding entry, never by deletion.
