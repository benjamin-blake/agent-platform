constraints:
  - >-
    SCOPE BOUNDARY. This plan lands the STATIC leg only - obligation closure computed by reading the
    plan document. It executes nothing from any plan. The two executing legs (pre-deploy step
    discrimination, and pytest selector vacuity) are deliberately OUT of scope and are handed to a
    follow-on plan; see the Context note recording why.
  - >-
    THE SIX REGISTRATION SURFACES, enumerated so both corrected procedures say the same thing:
    (1) the check module under scripts/checks/<domain>/; (2) its @register(...) decoration;
    (3) an Entry literal in that domain's _manifest.py (bare string-literal module=/attr=);
    (4) a config/ci_rca_taxonomy.yaml function_to_category row; (5) a
    config/agent/verification_registry/registry.yaml row per graduated VP step; (6) the mirror test
    at tests/checks/<domain>/test_<module>.py enforced by validate_test_coverage. A check in a NEW
    domain additionally requires four hand-maintained scripts/checks/registry.py aggregation edits
    (the _manifest import, the _ALL_ENTRIES splat, _PRE_DOMAIN_ORDER, _FULL_SEGMENT_DOMAIN_ORDER) -
    which is exactly why this plan places its check in the existing roadmap domain.
  - >-
    FORWARD-ONLY SCOPING (blocking). The check evaluates only plans present in the diff, resolved via
    the same helper validate_plan_documents uses. docs/plans/ holds 327 plans; a corpus-wide gate
    reds the tier on day one, and every comparable gate in this repo is explicitly forward-only.
  - >-
    THE CONTRACT IS THE SOURCE OF TRUTH. validate_plan_scope_closure READS its obligation map from
    docs/contracts/plan-obligations.yaml at check time and holds no second copy - the pattern
    decision-entry.yaml uses ("the check reads required_markers from here at check time, never
    hardcodes its own copy"). Everything relocated into that contract must be a rule the check
    actually enforces, or Decision 168's own principle is inverted.
  - >-
    CLOSURE DELEGATES, IT DOES NOT RE-DERIVE. The test-obligation rule is owned by
    validate_plan_documents and the graduate-row rule by validate_graduation_completeness - call
    them, do not reimplement them. Note that a verification-registry row is owed per GRADUATED VP
    STEP, not per created check; the two are independent.
  - >-
    PROSE FUNDING, NAMED (blocking). Both files must land at net delta <= 0 against origin/main.
    planning/SKILL.md (55810/55816, 6 B headroom): fund by relocating `## Closure Obligation`
    (1087 B) and `## Related-Work Check` (911 B) into the contract, leaving anchor+pointer stubs -
    both are Step-8 plan-obligation rules, so the contract's subject stays singular per Decision 168
    clause 4, and both become check-enforced. scripts/CLAUDE.md (2938/2984, and 2938 on origin/main
    so <= 0 means zero growth): fund by cutting the 312 B dispatch-explanation paragraph
    ("resolve(name) is a late-bound getattr...") to a one-line pointer - that text is a THIRD copy of
    what registry.py's docstring and docs/contracts/check-manifest.yaml already own. Do NOT relocate
    Preflight Constraints, Verification Tier Guidelines, the Decision Scout Gate or the Report
    Critique Gate; they are different subjects.
  - >-
    VERIFICATION REGISTRY ROW SHAPE. Each graduate row needs check_id, primitive_slot, guard_target,
    guard_symbol, plan_slug, graduated_at, graduated_by and check_spec. A pytest row uses
    check_spec.node_id; a command row uses an argv LIST carrying UNESCAPED Python source - the \"
    sequences in this plan's YAML are shell escapes and raise SyntaxError under shell=False. Test
    each argv row standalone before committing it.
  - >-
    Decision 128 does NOT apply to config/prose_budgets.yaml; that registry deliberately diverges
    from the SLOC decompose-by-default valve, and Decisions 114/110 forbid fragmenting a prose
    surface. Relocation with an anchor+pointer is the sanctioned remedy.
  - >-
    Reuse scripts/checks/_common.py plan-resolution helpers (load_plan, plan_paths_from_changed) and
    scripts/verification_checks.py CANONICAL_SLOTS. Decision 135 owns affected-set derivation.
  - >-
    The obligation report is ADVISORY to the plan-critique gate. Decision 132 limitation A rules
    graduation-classification correctness "a human/plan-critique call, at plan time, never
    mechanized" - the critic must never defer its verdict to this report.
  - Test files colocate per the Decision 131 mirror rule, with strict per-module naming.
  - No rescue agents or workaround loops (Decision 55)
  - No emojis; ASCII hyphens only; ruff formatting at line length 127
