schema_version: 4
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: "plan-obligation-closure"
intent: >-
  Make the mechanically-decidable half of a plan's obligations computable at plan-authoring time
  instead of discoverable one plan-critique round at a time, so the fresh-context critic spends its
  judgement on adequacy and frame rather than on arithmetic the repo can already do.
plan_type: IMPLEMENTATION
verification_tier: V2
plan_path: docs/plans/PLAN-plan-obligation-closure.yaml
phase: >-
  Platform governance / plan-loop control surface. Adjacent to T2.54 (clause-to-check index,
  not_started) but deliberately narrower: this plan closes obligations for PLAN documents only and
  files the general clause-to-check index as a follow-on rec against T2.54.
scope:
  - file: scripts/checks/planning/__init__.py
    action: Create
    purpose: package marker for the new check domain
  - file: scripts/checks/planning/obligations.py
    action: Create
    purpose: >-
      Shared, read-only obligation engine plus its agent-facing CLI. Public module name (no leading
      underscore) because `bin/venv-python -m scripts.checks.planning.obligations` IS the documented
      agent surface; the repo has no precedent for a private module as an agent entry point.
  - file: scripts/checks/planning/validate_plan_scope_closure.py
    action: Create
    purpose: >-
      Static leg. Given scope files + actions, derive the coupled registry/config rows that become
      obligatory and fail on any omitted from the plan's own scope. This is the genuinely new
      capability - nothing in the repo computes it today.
  - file: scripts/checks/planning/validate_plan_discrimination.py
    action: Create
    purpose: >-
      Executing leg. A pre-deploy step whose command exits 0 against the unchanged tree cannot be
      evidence the implementation works. Separate check name so its CI-RCA category is distinct.
  - file: scripts/checks/planning/validate_plan_selector_vacuity.py
    action: Create
    purpose: >-
      Executing leg. A pytest `-k` selector that matches pre-existing tests passes vacuously.
      Separate check name for the same attribution reason.
  - file: scripts/checks/registry.py
    action: Modify
    purpose: >-
      Sequence the three new checks in both tiers, AND correct the module docstring's registration
      procedure, which names only the module, the @register decoration, the sequence insert and the
      validate.py re-export - omitting ci_rca_taxonomy and the verification registry.
  - file: scripts/validate.py
    action: Modify
    purpose: >-
      Two re-export lines for three checks (measured 124 and 97 chars against ruff line-length 127).
      497 -> 499 effective against the hard 500 residual ceiling.
  - file: config/ci_rca_taxonomy.yaml
    action: Modify
    purpose: >-
      One function_to_category row per new check. Three rows, not one - the map is strictly 1:1
      across all 96 existing entries, so per-leg checks preserve failure attribution.
  - file: config/agent/verification_registry/registry.yaml
    action: Modify
    purpose: registry rows for this plan's graduate-disposition verification steps
  - file: docs/contracts/plan-obligations.yaml
    action: Create
    purpose: >-
      Class D mechanism contract owning the obligation-set semantics. status provisional_v0, so no
      ratified_via is required (contracts_schema.py:193). Also the relocation target that keeps
      planning/SKILL.md net-neutral.
  - file: .claude/skills/planning/SKILL.md
    action: Modify
    purpose: >-
      Add the obligation-query call sites (Step 4, Step 6b on scope change, pre-critique-round), the
      pre-6b measurement re-derivation gate, and the convergence-cap finding-origin attribution with
      split-as-first-class. Net byte delta MUST be <= 0, funded by relocating two Step-8 obligation
      sections into the contract (see Constraints for the arithmetic).
  - file: .claude/skills/plan-critique/SKILL.md
    action: Modify
    purpose: >-
      Consume the obligation report instead of re-deriving mechanical facts by hand; add
      finding-origin attribution to the structured output so the convergence-cap escalation can
      localise findings to a scope segment.
  - file: .claude/commands/plan.md
    action: Modify
    purpose: Steps 4, 6b and 9 wording for the obligation query and the revised escalation
  - file: scripts/CLAUDE.md
    action: Modify
    purpose: >-
      Complete the "Adding a validate.py check" procedure with the ci_rca_taxonomy and
      verification_registry surfaces. Net byte delta MUST be <= 0 (entry is 2984/2984, zero
      headroom) by tightening the existing prose rather than appending.
  - file: docs/DECISIONS.md
    action: Modify
    purpose: Decision 169 - the gate-contract change (drafted here, written at implement time)
  - file: tests/checks/planning/__init__.py
    action: Create
    purpose: package marker - all 18 sibling tests/checks/<domain>/ directories carry one
  - file: tests/checks/planning/test_obligations.py
    action: Create
    purpose: unit tests for the closure engine, the bounding harness and the CLI report shape
  - file: tests/checks/planning/test_validate_plan_checks.py
    action: Create
    purpose: discriminating tests for all three registered checks
bundled_recommendations: []
infrastructure_dependencies: []
acceptance_criteria:
  - >-
    `bin/venv-python -m scripts.checks.planning.obligations --plan <path>` prints a structured
    obligation report and always exits 0 - it is an advisory reporting surface, never a gate. The
    three registered checks are the gate and exit non-zero on an unmet obligation. These two exit
    contracts are deliberately different and both are exercised below.
  - >-
    Given a plan whose scope creates a scripts/checks/**/validate_*.py file but omits
    config/ci_rca_taxonomy.yaml, validate_plan_scope_closure fails and names that file.
  - >-
    Given a plan with a pre-deploy step whose command exits 0 against the current tree,
    validate_plan_discrimination fails and names that step - EXCEPT where the command re-enters
    scripts.validate, which is excluded by the model in Constraints.
  - >-
    Given a plan with a pytest command whose `-k` selector matches at least one pre-existing test,
    validate_plan_selector_vacuity fails and names the selector.
  - >-
    The executing legs are bounded: no single command exceeds the per-step timeout, aggregate
    wall-clock stays under the cap, and the engine refuses to execute a command that invokes itself.
  - >-
    All three checks are reachable from both tier sequences and each has its own row in
    config/ci_rca_taxonomy.yaml's function_to_category map.
  - scripts/validate.py remains at or below 500 effective lines after the two re-export lines.
  - >-
    .claude/skills/planning/SKILL.md and scripts/CLAUDE.md each have a net byte delta <= 0, and
    config/prose_budgets.yaml carries no new or raised entry for either.
  - >-
    scripts/CLAUDE.md's and scripts/checks/registry.py's registration procedures each describe all
    five registration surfaces within the procedure prose itself, not merely somewhere in the file.
  - >-
    The plan corpus still validates: validate_plan_documents, validate_graduation_completeness,
    validate_verification_registry and validate_handoff_full_tier all return zero failures.
  - Decision 169 is present in docs/DECISIONS.md carrying the Decision 167 typed envelope.
verification_plan:
  - step: 1
    phase: pre-deploy
    hermetic: false
    action: Scope closure flags an omitted taxonomy row for a check-creating plan
    command: >-
      bin/venv-python -m pytest tests/checks/planning/test_obligations.py::TestScopeClosure::test_check_creation_obliges_taxonomy_row -q
    expected: passes; the report names config/ci_rca_taxonomy.yaml as unmet
    fix_if: closure returns no obligation - the scope-shape trigger is not matching validate_*.py creation
    graduation: graduate
    graduation_check_id: plan-obligations-closure-taxonomy
  - step: 2
    phase: pre-deploy
    hermetic: false
    action: The discrimination check flags a pre-deploy step that passes against the unchanged tree
    command: >-
      bin/venv-python -m pytest tests/checks/planning/test_validate_plan_checks.py::TestDiscrimination::test_flags_step_passing_on_current_tree -q
    expected: passes; the flagged step id is reported
    fix_if: no flag raised - the leg is not executing the candidate command, or is swallowing exit 0
    graduation: graduate
    graduation_check_id: plan-obligations-discrimination-leg
  - step: 3
    phase: pre-deploy
    hermetic: false
    action: The discrimination check EXCLUDES commands that re-enter scripts.validate
    command: >-
      bin/venv-python -m pytest tests/checks/planning/test_validate_plan_checks.py::TestDiscrimination::test_excludes_self_reentrant_validate_command -q
    expected: >-
      passes - a step whose command is `bin/venv-python -m scripts.validate ...` is not flagged,
      because the _VALIDATE_DEPTH recursion guard makes it exit 0 for reasons unrelated to discrimination
    fix_if: >-
      the step is flagged - the exclusion model is missing. Without it this check false-positives on
      the full-tier step Decision 163 MANDATES on every schema-v3/v4 plan (293 of 325 plans carry one).
    graduation: graduate
    graduation_check_id: plan-obligations-reentrancy-exclusion
  - step: 4
    phase: pre-deploy
    hermetic: false
    action: The selector-vacuity check flags a `-k` selector matching a pre-existing test
    command: >-
      bin/venv-python -m pytest tests/checks/planning/test_validate_plan_checks.py::TestSelectorVacuity::test_flags_vacuous_k_selector -q
    expected: passes
    fix_if: no flag - the leg is not resolving the selector against the collected test set
    graduation: graduate
    graduation_check_id: plan-obligations-selector-vacuity
  - step: 5
    phase: pre-deploy
    hermetic: false
    action: The executing legs are bounded and refuse self-invocation
    command: >-
      bin/venv-python -m pytest tests/checks/planning/test_obligations.py::TestBounding -q
    expected: >-
      passes - per-step timeout enforced, aggregate cap enforced, step cap enforced, and a command
      invoking the engine itself is refused rather than executed
    fix_if: >-
      a bound is missing - reuse validate_vp_replay's harness (PER_STEP_TIMEOUT_SECONDS=30,
      MAX_AGGREGATE_SECONDS=120, MAX_REPLAYED_STEPS=20) rather than re-deriving constants
    graduation: graduate
    graduation_check_id: plan-obligations-bounded-execution
  - step: 6
    phase: pre-deploy
    hermetic: true
    action: The CLI runs successfully and leaves the tree identical
    command: >-
      bash -c 'H=$(git status --porcelain | md5sum); bin/venv-python -m scripts.checks.planning.obligations --plan docs/plans/PLAN-plan-obligation-closure.yaml > /dev/null || { echo "CLI failed"; exit 1; }; A=$(git status --porcelain | md5sum); [ "$H" = "$A" ] || { echo "tree mutated"; exit 1; }; echo readonly ok'
    expected: exit 0, prints readonly ok
    fix_if: >-
      "CLI failed" means the module or entry point is missing; "tree mutated" means the engine writes
      a cache, a registry row, or a report file. The success requirement is what makes this step
      discriminating - a bare tree comparison passes vacuously when the CLI does not exist.
    graduation: graduate
    graduation_check_id: plan-obligations-cli-readonly
  - step: 7
    phase: pre-deploy
    hermetic: false
    action: All three checks are reachable and dispatchable from validate.py
    command: >-
      bin/venv-python -m pytest tests/test_checks_registry.py -q && bin/venv-python -c "import scripts.validate as v; assert all(n in dir(v) for n in ('validate_plan_scope_closure','validate_plan_discrimination','validate_plan_selector_vacuity')), 'missing re-export'"
    expected: registry reachability tests pass and all three names are module-level globals of validate.py
    fix_if: KeyError or assertion - a re-export line or a sequence entry is missing
    graduation: graduate
    graduation_check_id: plan-obligations-registry-reachable
  - step: 8
    phase: pre-deploy
    hermetic: true
    action: Each check has its own taxonomy row, so the fast tier is not reddened and attribution stays 1:1
    command: >-
      bin/venv-python -c "import yaml;m=yaml.safe_load(open('config/ci_rca_taxonomy.yaml'))['function_to_category'];missing=[n for n in ('validate_plan_scope_closure','validate_plan_discrimination','validate_plan_selector_vacuity') if n not in m];assert not missing, f'unmapped checks red the fast tier: {missing}'"
    expected: exit 0
    fix_if: assertion - add the function_to_category rows (this is #874's round-4 blocker, reproduced)
    graduation: graduate
    graduation_check_id: plan-obligations-taxonomy-mapped
  - step: 9
    phase: pre-deploy
    hermetic: true
    action: validate.py stays within the 500-line residual ceiling after the two re-export lines
    command: >-
      bin/venv-python -c "import pathlib;n=len([l for l in pathlib.Path('scripts/validate.py').read_text().splitlines() if l.strip() and not l.strip().startswith('#')]);print(n);assert n <= 500, f'{n} > 500'"
    expected: exit 0, prints 499
    fix_if: >-
      over 500 - do NOT raise the budget (Decision 128 applies to SLOC); decompose the re-export
      facade per Decision 80 and file the remainder
    graduation: waive
    graduation_waiver_reason: >-
      Measured tautological: validate.py is 497/500 today, so this assertion exits 0 against the
      unchanged tree and VF-06 differential admission would refuse the row. It is a regression
      ceiling, not a feature assertion, and the standing guard is the already-registered
      validate_sloc_limits. Retained as a VP step because 499/500 leaves one line of repo-wide
      headroom and the implementer must see the number.
  - step: 10
    phase: pre-deploy
    hermetic: true
    action: Both prose surfaces are net-neutral-or-smaller and the relocation actually happened
    command: >-
      bash -c 'grep -q "plan-obligations.yaml" .claude/skills/planning/SKILL.md || { echo "no anchor+pointer"; exit 1; }; for p in .claude/skills/planning/SKILL.md scripts/CLAUDE.md; do b=$(git show origin/main:$p | wc -c); a=$(wc -c < $p); [ "$a" -le "$b" ] || { echo "$p grew $b->$a"; exit 1; }; done; echo net-neutral ok'
    expected: exit 0, prints net-neutral ok
    fix_if: >-
      "no anchor+pointer" means the relocation was not performed; "grew" means relocate more detail
      into the contract. Do NOT raise a prose budget (Decision 166 spirit: a second raise is the
      accretion pattern). The anchor assertion is what makes this step discriminating - a bare byte
      comparison passes vacuously on an unchanged tree.
    graduation: graduate
    graduation_check_id: plan-obligations-prose-net-neutral
  - step: 11
    phase: pre-deploy
    hermetic: true
    action: No raise-approved marker was added to either prose entry
    command: >-
      bash -c 'git diff origin/main -- config/prose_budgets.yaml | grep -E "^\+.*raise-approved" && exit 1 || exit 0'
    expected: exit 0 - no added raise marker
    fix_if: >-
      a marker was added - Decision 165 requires an authorizing Decision body naming the 2-segment
      key verbatim; the dec-150 marker authorizes only significance-gate content
    graduation: waive
    graduation_waiver_reason: >-
      Measured tautological: a negative assertion over a diff that is empty on the unchanged tree
      exits 0 today, so VF-06 differential admission would refuse the row. It cannot be made
      discriminating without asserting on a marker this plan deliberately never adds. The standing
      guard for this surface is validate_prose_budget_raises, which reads config/prose_budgets.yaml
      and validates marker AUTHORIZATION retroactively on every run (Decision 165 consolidated all
      five raise guards onto _marker_guard.py).
  - step: 12
    phase: pre-deploy
    hermetic: true
    action: The new contract is a valid Class D contract and needs no ratified_via
    command: >-
      bin/venv-python -c "import yaml;c=yaml.safe_load(open('docs/contracts/plan-obligations.yaml'))['contract'];assert c['class']=='D';assert c['status']=='provisional_v0';assert not c.get('ratified_via');assert c.get('subject') and c.get('evaluator') and c.get('amendment_log') is not None;print('class D provisional ok')"
    expected: exit 0
    fix_if: >-
      shape failure - Decision 168 requires class/subject/evaluator/amendment_log; ratified_via is
      required only at status ratified (contracts_schema.py:193)
    graduation: graduate
    graduation_check_id: plan-obligations-contract-class-d
  - step: 13
    phase: pre-deploy
    hermetic: false
    action: The contract's declared evaluator resolves and demonstrably reads it
    command: bin/venv-python -m scripts.checks.contracts.validate_contract_drift 2>&1 | tail -5
    expected: no failure naming plan-obligations.yaml
    fix_if: >-
      evaluator-resolution failure - the agent_surface target must contain the contract basename in
      its text (Decision 168); a docstring mention alone was ruled insufficient
    graduation: waive
    graduation_waiver_reason: >-
      validate_contract_drift is already a registered check sequenced in both tiers (registry.py
      L132, L250), so graduating this would mint a duplicate registry row for a gate that already
      fires on every run. The contract-shape assertions this plan owns are graduated at step 12.
  - step: 14
    phase: pre-deploy
    hermetic: true
    action: The whole plan-document check family returns zero failures
    command: >-
      bin/venv-python -c "from scripts.checks.roadmap.validate_plan_documents import validate_plan_documents; from scripts.checks.verification.validate_handoff_full_tier import validate_handoff_full_tier; from scripts.checks.verification.validate_graduation_completeness import validate_graduation_completeness; f=[]; [fn(f) for fn in (validate_plan_documents, validate_handoff_full_tier, validate_graduation_completeness)]; print(len(f)); assert not f, f"
    expected: exit 0, prints 0
    fix_if: >-
      failures - a scope file lacks a test obligation, the plan declares full validation without a
      full-tier step, or a pre-deploy step lacks a graduation disposition
    graduation: graduate
    graduation_check_id: plan-obligations-plan-doc-family-clean
  - step: 15
    phase: pre-deploy
    hermetic: true
    action: Both registration procedures describe all five surfaces within the procedure prose itself
    command: >-
      bash -c 'bin/venv-python - <<PY
      import pathlib,re,sys
      targets={"scripts/CLAUDE.md":r"## Adding a validate\.py check(.*?)(?=\n## |\Z)","scripts/checks/registry.py":r"^\"\"\"(.*?)\"\"\""}
      for p,pat in targets.items():
          t=pathlib.Path(p).read_text()
          m=re.search(pat,t,re.S|re.M)
          if not m: sys.exit(f"{p}: procedure block not found")
          body=m.group(1)
          missing=[s for s in ("ci_rca_taxonomy","verification_registry") if s not in body]
          if missing: sys.exit(f"{p} procedure omits {missing}")
      print("both procedures complete")
      PY'
    expected: exit 0, prints both procedures complete
    fix_if: >-
      a surface is missing from a procedure BLOCK. Scoping the grep to the procedure block is what
      makes this discriminating - bare file-wide greps already match registry.py today via its
      sequence entries _c("validate_ci_rca_taxonomy") and _c("validate_verification_registry"),
      so a file-wide check would go green with the docstring untouched.
    graduation: graduate
    graduation_check_id: plan-obligations-procedure-complete
  - step: 16
    phase: pre-deploy
    hermetic: true
    action: The critique skill consumes the obligation report and emits finding-origin attribution
    command: >-
      bin/venv-python -c "import pathlib;t=pathlib.Path('.claude/skills/plan-critique/SKILL.md').read_text().lower();assert 'obligation report' in t, 'critic does not consume the report';assert 'attribution' in t, 'no finding-origin attribution'"
    expected: exit 0
    fix_if: assertion - the critic still re-derives mechanical facts, or the output shape lacks attribution
    graduation: graduate
    graduation_check_id: plan-obligations-critic-consumes-report
  - step: 17
    phase: pre-deploy
    hermetic: true
    action: The plan command invokes the obligation query at its authoring steps
    command: >-
      bin/venv-python -c "import pathlib;t=pathlib.Path('.claude/commands/plan.md').read_text();assert 'scripts.checks.planning.obligations' in t, 'Step 4/6b do not invoke the obligation query'"
    expected: exit 0
    fix_if: assertion - the command file was not wired to the query
    graduation: graduate
    graduation_check_id: plan-obligations-command-wired
  - step: 18
    phase: pre-deploy
    hermetic: true
    action: Decision 169 is present in the corpus
    command: >-
      bin/venv-python -c "import pathlib;t=pathlib.Path('docs/DECISIONS.md').read_text();assert '## Decision 169:' in t, 'Decision 169 absent'"
    expected: exit 0
    fix_if: >-
      absent - write it; if a concurrent PR claimed 169, shift to the next free number and update
      every reference in this plan
    graduation: waive
    graduation_waiver_reason: >-
      The header number is not stable at plan time (numbering is not reserved), so a registry row
      pinned to '## Decision 169:' would break the moment a concurrent PR claims that number. The
      durable graduated guard for Decision entries is validate_decision_entry_conformance, which
      already runs in both tiers.
  - step: 19
    phase: pre-deploy
    hermetic: false
    action: Fast tier is green
    command: bin/venv-python -m scripts.validate --pre
    expected: exit 0
    fix_if: any check fails - fix forward; never disable a check to pass the tier
    graduation: not-applicable
  - step: 20
    phase: pre-deploy
    hermetic: false
    action: Full tier is green (the handoff_policy obligation, Decision 163 / rec-2965)
    command: bin/venv-python -m scripts.validate
    expected: exit 0
    fix_if: >-
      any check fails - fix forward. This step exists because handoff_policy declares
      full_validation_required_before_commit, and validate_handoff_full_tier requires a VP step
      invoking `-m scripts.validate` WITHOUT --pre.
    graduation: not-applicable
test_obligations:
  - source: scripts/checks/planning/__init__.py
    behavior: The package is importable so the check modules resolve under globals() dispatch.
    verification_step: 7
    command: >-
      bin/venv-python -m pytest tests/test_checks_registry.py -q && bin/venv-python -c "import scripts.validate as v; assert all(n in dir(v) for n in ('validate_plan_scope_closure','validate_plan_discrimination','validate_plan_selector_vacuity')), 'missing re-export'"
    waiver_reason: >-
      An empty package marker has no behaviour of its own to guard. Its only observable property -
      that the package resolves so the check modules are importable - is exercised transitively by
      step 7, which fails outright if the package does not import. A dedicated test would assert
      nothing the import chain does not already prove.
  - source: scripts/checks/planning/obligations.py
    behavior: >-
      Scope-closure derives coupled obligations from scope shape; the executing harness is bounded
      and self-reference-guarded; the engine never mutates any file.
    verification_step: 1
    test_selector: tests/checks/planning/test_obligations.py::TestScopeClosure::test_check_creation_obliges_taxonomy_row
    red_green_expectation: red before (module absent, ImportError), green after
  - source: scripts/checks/planning/validate_plan_scope_closure.py
    behavior: Fails a plan whose scope omits an obligated coupled file.
    verification_step: 1
    test_selector: tests/checks/planning/test_obligations.py::TestScopeClosure::test_check_creation_obliges_taxonomy_row
    red_green_expectation: red before (check absent), green after
  - source: scripts/checks/planning/validate_plan_discrimination.py
    behavior: >-
      Flags a pre-deploy step passing on the unchanged tree, and excludes commands re-entering
      scripts.validate.
    verification_step: 3
    test_selector: tests/checks/planning/test_validate_plan_checks.py::TestDiscrimination::test_excludes_self_reentrant_validate_command
    red_green_expectation: red before (check absent), green after
  - source: scripts/checks/planning/validate_plan_selector_vacuity.py
    behavior: Flags a pytest -k selector matching pre-existing tests.
    verification_step: 4
    test_selector: tests/checks/planning/test_validate_plan_checks.py::TestSelectorVacuity::test_flags_vacuous_k_selector
    red_green_expectation: red before (check absent), green after
  - source: scripts/checks/registry.py
    behavior: The three checks are sequenced in both tiers and remain reachable.
    verification_step: 7
    test_selector: tests/test_checks_registry.py
    red_green_expectation: red before (registered names not reachable / not sequenced), green after
  - source: scripts/validate.py
    behavior: All three check names are module-level globals so globals()[name] dispatch resolves.
    verification_step: 7
    command: >-
      bin/venv-python -c "import scripts.validate as v; assert all(n in dir(v) for n in ('validate_plan_scope_closure','validate_plan_discrimination','validate_plan_selector_vacuity')), 'missing re-export'"
    red_green_expectation: red before (AssertionError), green after
  - source: config/ci_rca_taxonomy.yaml
    behavior: Every registered check has its own 1:1 function_to_category row.
    verification_step: 8
    command: >-
      bin/venv-python -c "import yaml;m=yaml.safe_load(open('config/ci_rca_taxonomy.yaml'))['function_to_category'];missing=[n for n in ('validate_plan_scope_closure','validate_plan_discrimination','validate_plan_selector_vacuity') if n not in m];assert not missing, f'unmapped checks red the fast tier: {missing}'"
    red_green_expectation: red before (registered-but-unmapped once the checks land), green after
  - source: config/agent/verification_registry/registry.yaml
    behavior: Each graduate-disposition step has a registry row carrying plan_slug.
    verification_step: 19
    command: bin/venv-python -m scripts.validate --pre
    red_green_expectation: red before (rows absent for the new check_ids), green after
  - source: docs/contracts/plan-obligations.yaml
    behavior: Valid Class D contract at provisional_v0 whose evaluator resolves.
    verification_step: 12
    command: >-
      bin/venv-python -c "import yaml;c=yaml.safe_load(open('docs/contracts/plan-obligations.yaml'))['contract'];assert c['class']=='D';assert c['status']=='provisional_v0';assert not c.get('ratified_via');assert c.get('subject') and c.get('evaluator') and c.get('amendment_log') is not None;print('class D provisional ok')"
    red_green_expectation: red before (file absent), green after
  - source: scripts/roadmap/plan_document.py
    behavior: n/a - removed from scope; see Context on the cut provenance leg.
    verification_step: 14
    command: >-
