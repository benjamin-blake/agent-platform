constraints:
  - >-
    REGISTRATION MECHANISM (Decision 169, #883). scripts/validate.py is NEVER touched. A new check is
    a module under scripts/checks/<domain>/ decorated @register(...), plus one Entry(name=, module=,
    attr=, pre=, pre_globs=, full_segment=) literal in that domain's _manifest.py. module= and attr=
    are TWO fields with bare string literals - never a combined "module:attr", never computed. Mirror
    tests live at tests/checks/<domain>/test__manifest.py. Grammar:
    docs/contracts/check-manifest.yaml; evaluator: scripts/checks/deps/validate_check_manifests.py.
  - >-
    TWO-LEG MODEL (blocking). validate_plan_discrimination runs ONLY on a plan-only PR - no
    feat({slug}) commit on `git log origin/main..HEAD` - and DEFERS with a printed reason otherwise.
    Without this it directly contradicts validate_vp_replay, which FAILS a step whose returncode is
    non-zero (validate_vp_replay.py:118) while this check fails a step whose returncode is zero. Both
    are sequenced in both tiers, so on a co-present plan+code PR their pass conditions are exact
    complements. Mirror vp_replay's own _plan_only_pr_leg / _implement_pr_leg split.
  - >-
    DISPOSITION RESPECT (blocking). Flag a tautological step ONLY when its graduation disposition is
    `graduate`. A step declared `waive` with a reason is a DECLARED tautology - that is already the
    VF-06 differential-admission contract, and flagging it would wedge every plan carrying a
    legitimate regression-ceiling or negative-assertion step, including this one (steps 19 and 20
    exit 0 by design). This is why no new PlanDocument field is needed.
  - >-
    HERMETIC CONFINEMENT (blocking). The executing legs execute ONLY steps marked `hermetic: true`,
    matching validate_vp_replay's confinement contract (no network, no AWS, creds-free pr-validate
    job). The corpus holds 202 non-hermetic pre-deploy steps invoking aws/boto3/terraform/
    ops_data_portal, including a live `aws secretsmanager get-secret-value`.
  - >-
    RE-ENTRANCY EXCLUSION (blocking). Excluded commands are SKIPPED WITHOUT EXECUTION, not executed
    and then ignored. scripts/validate.py exits 0 when _VALIDATE_DEPTH >= 1 (measured:
    `_VALIDATE_DEPTH=5 bin/venv-python -m scripts.validate --pre` exits 0), and a PYTEST_CURRENT_TEST
    guard does the same. Use an env-var depth guard, not only a command-string match, so indirect
    re-entry through a wrapper or a test is also caught.
  - >-
    SHARED BOUNDED EXECUTION (blocking). ONE aggregate budget across all executing legs - not one per
    leg. Reuse validate_vp_replay's constants as the ceiling (PER_STEP_TIMEOUT_SECONDS=30,
    MAX_AGGREGATE_SECONDS=120, MAX_REPLAYED_STEPS=20); three independent 120s budgets plus vp_replay's
    own is a 480s worst case against the fast tier's 300s assert. Add a self-reference guard: the
    engine refuses to execute a command that invokes the engine.
  - >-
    CLOSURE DELEGATES, IT DOES NOT RE-DERIVE. The test-obligation rule is owned by
    validate_plan_documents and the graduate-row rule by validate_graduation_completeness - call
    them, do not reimplement them. This check owns ONE new rule: registration coupling (module +
    manifest Entry + taxonomy row + registry rows). The obligation map lives in
    docs/contracts/plan-obligations.yaml and the check READS it - it must not hardcode a second copy,
    which would make a fourth copy of the registration procedure.
  - >-
    PROSE RELOCATION ARITHMETIC. planning/SKILL.md has 6 bytes of headroom (55810/55816); scripts/
    CLAUDE.md has 46 (2938/2984, widened by #883's rewrite). Fund the additions by relocating two
    topically-matched Step-8 obligation sections into docs/contracts/plan-obligations.yaml:
    `## Closure Obligation (Workflow Step 8, CONDITIONAL)` (1087 B) and `## Related-Work Check
    (Workflow Step 8, when ci-rca recs are open)` (911 B) = 1998 B freed, less roughly 250 B for two
    anchor+pointer stubs = about 1754 B available. Do NOT relocate Preflight Constraints, Verification
    Tier Guidelines, the Decision Scout Gate or the Report Critique Gate - Decision 168 clause 4
    requires the contract's subject to be unique and singular, and those are different subjects.
  - >-
    Decision 128 does NOT apply to config/prose_budgets.yaml. That registry deliberately diverges from
    the SLOC decompose-by-default valve, and Decisions 114/110 forbid fragmenting a prose surface.
    Relocation to a contract with an anchor+pointer is permitted and is the chosen remedy.
  - >-
    VERIFICATION REGISTRY ROW SHAPE. Each graduate row needs check_id, primitive_slot, guard_target,
    guard_symbol, plan_slug, graduated_at, graduated_by and check_spec. A pytest row uses
    check_spec.node_id; a command row uses an argv LIST, so steps 9-15's shell one-liners must be
    expressed as ["bin/venv-python","-c", "..."] or ["bash","-c","..."], never a bare string.
  - >-
    Reuse scripts/checks/_common.py plan-resolution helpers (load_plan, plan_paths_from_changed,
    feat_commit_slugs) and scripts/verification_checks.py CANONICAL_SLOTS. Do not re-implement
    selector logic - Decision 135 owns affected-set derivation via map_source_to_test.
  - >-
    The obligation report is ADVISORY to the plan-critique gate. Decision 132 limitation A rules
    graduation-classification correctness "a human/plan-critique call, at plan time, never
    mechanized" - the critic must never defer its verdict to this report.
  - Test files colocate per the Decision 131 mirror rule (tests/checks/planning/).
  - No rescue agents or workaround loops (Decision 55)
  - No emojis; ASCII hyphens only; ruff formatting at line length 127
