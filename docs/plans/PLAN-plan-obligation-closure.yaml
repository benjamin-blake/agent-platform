constraints:
  - >-
    SCOPE BOUNDARY. This plan lands REGISTRATION closure only - obligations derivable structurally
    from a plan's scope rows. Rules requiring semantic judgement or session runtime state are
    explicitly OUT (see Context for the two that were cut and why). The two executing legs are a
    separate follow-on plan.
  - >-
    THE SEVEN REGISTRATION SURFACES, enumerated once so both corrected procedures agree:
    (1) the check module under scripts/checks/<domain>/; (2) its @register(...) decoration;
    (3) an Entry literal in that domain's _manifest.py; (4) a config/ci_rca_taxonomy.yaml
    function_to_category row; (5) a config/agent/verification_registry/registry.yaml row per
    GRADUATED VP step (not per check - the two are independent); (6) the mirror test at
    tests/<mirrored path>/test_<module>.py enforced by validate_test_coverage; (7) for a new depth-1
    scripts/ module, a file-router.yaml scripts_root_allowlist.allowed_files entry enforced by
    validate_placement. A check in a NEW domain additionally requires four hand-maintained
    scripts/checks/registry.py aggregation edits - which is why this plan uses the roadmap domain.
  - >-
    DIFF SCOPING (blocking). Use scripts.checks._common.plan_paths_from_changed - the helper
    validate_graduation_completeness uses - covering plans ADDED OR MODIFIED. Do NOT copy
    validate_plan_documents' approach: it globs the whole directory and its only diff use is a
    private _added_plan_names() matching git status A/?? (added only). A negative test must assert
    docs/plans/ is never globbed.
  - >-
    DELEGATION NAMESPACING (blocking). Call delegates with a throwaway list -
    `tmp: list[str] = []; validate_plan_documents(tmp)` - and re-emit findings under this check's own
    namespaced strings. Passing the caller's list through double-appends the delegate's failures in
    the same run (both are independently sequenced in both tiers), attributing one root cause to a
    different check's ci_rca category and corrupting Priority-0 attribution.
  - >-
    EVALUATOR RESOLUTION IS ONE HOP. contract-population.yaml's evaluator_kinds.check requires the
    evaluator module OR a one-hop scripts/ import to contain the contract basename as an EXECUTABLE
    string literal (docstrings and comments excluded), and the check to be tier-sequenced. So
    scripts/plan_obligations.py must carry "plan-obligations.yaml" in executable position; delegating
    the contract read another hop breaks resolution.
  - >-
    PROSE FUNDING, EXACT. scripts/CLAUDE.md: replace lines 40-41 ONLY - the 196 B dispatch paragraph
    beginning "Dispatch is `scripts.checks.registry.resolve(name)(failed)`" - with a one-line pointer
    at registry.py's docstring. Lines 42-43 carry the file's ONLY mirror-test sentence and MUST
    survive; step 14 asserts it. The budget (2984 B, currently 2938) is the governed constraint and
    is enforced by the already-registered validate_prose_limits - this plan adds no net-neutral gate
    of its own, which would duplicate that guard and freeze the file against unrelated future PRs.
  - >-
    .claude/skills/planning/SKILL.md is deliberately NOT in scope. It has 6 B of headroom and no
    relocation source survives (see Context). The obligation-query call sites belong in
    .claude/commands/plan.md (Layer 3 sequences the workflow) and the critic-side changes in
    plan-critique/SKILL.md (511 B headroom) - a layering argument, not only a budget one.
  - >-
    Reuse scripts/checks/_common.py plan-resolution helpers and scripts/verification_checks.py
    CANONICAL_SLOTS. Decision 135 owns affected-set derivation.
  - >-
    VERIFICATION REGISTRY ROW SHAPE. Each graduate row needs check_id, primitive_slot, guard_target,
    guard_symbol, plan_slug, graduated_at, graduated_by, check_spec. A pytest row uses
    check_spec.node_id; a command row uses an argv LIST carrying UNESCAPED Python source - the \"
    sequences in this YAML are shell escapes and raise SyntaxError under shell=False. Test each argv
    row standalone before committing.
  - >-
    The obligation report is ADVISORY to the plan-critique gate. Decision 132 limitation A rules
    graduation-classification correctness "a human/plan-critique call, at plan time, never
    mechanized" - the critic must never defer its verdict to this report.
  - Test files colocate per the Decision 131 mirror rule, with strict per-module naming.
  - No rescue agents or workaround loops (Decision 55)
  - No emojis; ASCII hyphens only; ruff formatting at line length 127
