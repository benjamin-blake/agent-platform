schema_version: 4
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: "plan-obligation-closure"
intent: >-
  Make a plan's mechanically-derivable coupled obligations computable at authoring time instead of
  discoverable one plan-critique round at a time, so the fresh-context critic spends its judgement on
  adequacy and frame rather than on arithmetic the repo can already do.
plan_type: IMPLEMENTATION
verification_tier: V2
plan_path: docs/plans/PLAN-plan-obligation-closure.yaml
phase: >-
  Platform governance / plan-loop control surface. Adjacent to T2.54 (clause-to-check index,
  not_started) but deliberately narrower: this plan computes obligation CLOSURE for PLAN documents
  only. The general clause-to-check index is filed as a follow-on rec against T2.54.
scope:
  - file: scripts/plan_obligations.py
    action: Create
    purpose: >-
      Read-only obligation engine plus its agent-facing CLI. Lives at the scripts root because
      `bin/venv-python -m scripts.plan_obligations` IS an agent entry point, and
      docs/contracts/file-router.yaml's scripts_root_allowlist is the declared home for entry
      points - a CLI under scripts/checks/ would be a layer inversion.
  - file: scripts/checks/roadmap/validate_plan_scope_closure.py
    action: Create
    purpose: >-
      The single registered check. Placed in the EXISTING roadmap domain, which already owns
      validate_plan_documents - a new scripts/checks/<domain>/ package would additionally require
      four hand-maintained registry.py aggregation edits (see Constraints).
  - file: scripts/checks/roadmap/_manifest.py
    action: Modify
    purpose: >-
      One Entry literal mirroring validate_plan_documents' shape (pre=True with
      pre_globs=("docs/plans/**",), full_segment="full_after_lint"). Bare string-literal
      module=/attr= pairs per docs/contracts/check-manifest.yaml.
  - file: scripts/checks/registry.py
    action: Modify
    purpose: >-
      Module docstring only - complete its registration procedure, which omits the ci_rca_taxonomy,
      verification-registry and mirror-test surfaces. No aggregation edit is needed because roadmap
      is an existing domain.
  - file: config/ci_rca_taxonomy.yaml
    action: Modify
    purpose: function_to_category row for the new check (the map is total over registered checks)
  - file: config/agent/verification_registry/registry.yaml
    action: Modify
    purpose: registry rows for this plan's graduate-disposition verification steps
  - file: docs/contracts/plan-obligations.yaml
    action: Create
    purpose: >-
      Class D mechanism contract holding the obligation map the check READS at check time (never a
      second hardcoded copy). Mirrors docs/contracts/check-manifest.yaml: status ratified,
      ratified_via dec-170, evaluator {check: validate_plan_scope_closure}, amendment_log as a
      TOP-LEVEL sibling of contract:.
  - file: docs/contracts/file-router.yaml
    action: Modify
    purpose: discovery route whose topic equals the contract's subject (contract-population.yaml binds them)
  - file: .claude/skills/planning/SKILL.md
    action: Modify
    purpose: >-
      Add the obligation-query call sites (Step 4, Step 6b on scope change, pre-critique-round) and
      the convergence-cap finding-origin attribution with split-as-first-class. Funded by relocating
      two obligation sections into the contract - see Constraints for the byte arithmetic.
  - file: .claude/skills/plan-critique/SKILL.md
    action: Modify
    purpose: consume the obligation report rather than re-deriving mechanical facts; emit finding-origin attribution
  - file: .claude/commands/plan.md
    action: Modify
    purpose: Steps 4, 6b and 9 wording for the obligation query and the revised escalation
  - file: scripts/CLAUDE.md
    action: Modify
    purpose: >-
      Complete the registration procedure, funded by cutting its 312 B dispatch-explanation
      paragraph to a pointer - that text is a third copy of what registry.py's docstring and
      check-manifest.yaml already own.
  - file: docs/DECISIONS.md
    action: Modify
    purpose: Decision 170 - the gate-contract change (drafted here, written at implement time)
  - file: tests/test_plan_obligations.py
    action: Create
    purpose: mirror test for the engine (validate_test_coverage requires strict per-module naming)
  - file: tests/checks/roadmap/test_validate_plan_scope_closure.py
    action: Create
    purpose: mirror test for the check (strict per-module naming)
bundled_recommendations: []
infrastructure_dependencies: []
acceptance_criteria:
  - >-
    `bin/venv-python -m scripts.plan_obligations --plan <path>` prints a structured obligation report
    and ALWAYS exits 0, including on a plan with unmet obligations - it is advisory, never a gate.
    validate_plan_scope_closure is the gate and exits non-zero on an unmet obligation.
  - >-
    The check is FORWARD-ONLY: it evaluates only plans added or modified in the diff, resolved via
    the same helper validate_plan_documents uses. It never sweeps the 327-plan historical corpus.
  - >-
    Given a plan whose scope creates a scripts/checks/**/validate_*.py file but omits that domain's
    _manifest.py Entry, its ci_rca_taxonomy row, or its mirror test file, the check fails and names
    each omission.
  - >-
    Given a plan naming an open recommendation as its motivation with an empty
    bundled_recommendations, the check fails - the Closure Obligation rule relocated into the
    contract is enforced by the check, not merely stored there.
  - >-
    The check reads its obligation map from docs/contracts/plan-obligations.yaml at check time and
    holds no second hardcoded copy.
  - >-
    validate_plan_scope_closure resolves through manifest dispatch and is a member of both tier
    sequences, and has its own row in config/ci_rca_taxonomy.yaml's function_to_category map.
  - >-
    scripts/CLAUDE.md's and scripts/checks/registry.py's registration procedures each name all six
    current registration surfaces enumerated in Constraints.
  - >-
    docs/contracts/plan-obligations.yaml is a valid Class D contract at status ratified with
    ratified_via dec-170, evaluator {check: validate_plan_scope_closure} and a TOP-LEVEL
    amendment_log; and docs/contracts/file-router.yaml carries a route whose topic equals its subject.
  - >-
    .claude/skills/planning/SKILL.md and scripts/CLAUDE.md each have a net byte delta <= 0 against
    origin/main, and config/prose_budgets.yaml carries no new or raised entry for either.
  - >-
    The plan corpus still validates: validate_plan_documents, validate_graduation_completeness,
    validate_verification_registry, validate_handoff_full_tier and validate_test_coverage all return
    zero failures.
  - Decision 170 is present in docs/DECISIONS.md carrying the Decision 167 typed envelope.
verification_plan:
  - step: 1
    phase: pre-deploy
    hermetic: false
    action: Closure derives the full registration coupling for a check-creating plan
    command: >-
      bin/venv-python -m pytest tests/test_plan_obligations.py::TestRegistrationClosure -q
    expected: >-
      passes; the report names the domain _manifest.py Entry, the ci_rca_taxonomy row and the mirror
      test file as unmet
    fix_if: >-
      an obligation is missing - the map must cover all six surfaces, including the mirror-test rule
      that validate_test_coverage enforces full-tier-only (so an omission passes --pre and reds main)
    graduation: graduate
    graduation_check_id: plan-obligations-registration-closure
  - step: 2
    phase: pre-deploy
    hermetic: false
    action: The check is forward-only and never sweeps the historical corpus
    command: >-
      bin/venv-python -m pytest tests/checks/roadmap/test_validate_plan_scope_closure.py::TestForwardOnly -q
    expected: >-
      passes - with an empty diff the check evaluates zero plans; with a one-plan diff it evaluates
      exactly that plan
    fix_if: >-
      the corpus is swept - docs/plans/ holds 327 plans and a corpus-wide gate reds the tier on day
      one; every comparable gate here is forward-only
    graduation: graduate
    graduation_check_id: plan-obligations-forward-only
  - step: 3
    phase: pre-deploy
    hermetic: false
    action: The check enforces the relocated Closure Obligation rule, not merely stores it
    command: >-
      bin/venv-python -m pytest tests/checks/roadmap/test_validate_plan_scope_closure.py::TestRelocatedRules -q
    expected: passes - a rec-resolving plan with empty bundled_recommendations fails the check
    fix_if: >-
      the rule is unenforced - relocating prose into a contract whose evaluator does not read it
      inverts Decision 168's own principle that a rule with no evaluator is not a rule
    graduation: graduate
    graduation_check_id: plan-obligations-relocated-rules-enforced
  - step: 4
    phase: pre-deploy
    hermetic: false
    action: The check reads its map from the contract and holds no second copy
    command: >-
      bin/venv-python -m pytest tests/checks/roadmap/test_validate_plan_scope_closure.py::TestContractIsSourceOfTruth -q
    expected: passes - mutating the contract's map changes the check's behaviour
    fix_if: >-
      behaviour unchanged - the map is hardcoded, which would make a fourth copy of the registration
      procedure and defeat the contract's evaluator obligation
    graduation: graduate
    graduation_check_id: plan-obligations-contract-is-sot
  - step: 5
    phase: pre-deploy
    hermetic: false
    action: The CLI is advisory and read-only
    command: >-
      bin/venv-python -m pytest tests/test_plan_obligations.py::TestCliContract -q
    expected: >-
      passes - exit 0 on a clean plan AND on a plan with unmet obligations, with no file in the tree
      modified
    fix_if: >-
      non-zero on unmet obligations - the CLI has become a gate, contradicting acceptance criterion 1
    graduation: graduate
    graduation_check_id: plan-obligations-cli-advisory
  - step: 6
    phase: pre-deploy
    hermetic: true
    action: The check resolves through manifest dispatch and sits in both tier sequences
    command: >-
      bin/venv-python -c "from scripts.checks import registry; registry.resolve('validate_plan_scope_closure'); pre={s.name for s in registry.pre_sequence()}; full={s.name for s in registry.full_sequence()}; assert 'validate_plan_scope_closure' in pre, 'absent from --pre'; assert 'validate_plan_scope_closure' in full, 'absent from full'; print('dispatch and both sequences ok')"
    expected: exit 0, prints dispatch and both sequences ok
    fix_if: >-
      UnknownCheckError or an assertion - add the Entry to scripts/checks/roadmap/_manifest.py with
      pre=True and full_segment set. Both-tier membership is safe here because this check executes
      nothing from the plan document.
    graduation: graduate
    graduation_check_id: plan-obligations-dispatch-and-sequences
  - step: 7
    phase: pre-deploy
    hermetic: true
    action: The check has a taxonomy row
    command: >-
      bin/venv-python -c "import yaml;m=yaml.safe_load(open('config/ci_rca_taxonomy.yaml'))['function_to_category'];assert 'validate_plan_scope_closure' in m, 'unmapped check reds the fast tier'"
    expected: exit 0
    fix_if: assertion - add the function_to_category row (this is #874's round-4 blocker, reproduced)
    graduation: graduate
    graduation_check_id: plan-obligations-taxonomy-mapped
  - step: 8
    phase: pre-deploy
    hermetic: true
    action: Both new modules satisfy the strict mirror-test naming rule
    command: >-
      bin/venv-python -c "from pathlib import Path; from scripts.test_coverage_checker import check_test_file_exists; bad=[(m,r) for m in ('scripts/plan_obligations.py','scripts/checks/roadmap/validate_plan_scope_closure.py') for ok,r in [check_test_file_exists(Path(m))] if not ok]; assert not bad, bad; print('mirror tests ok')"
    expected: exit 0, prints mirror tests ok
    fix_if: >-
      a mirror is missing - validate_test_coverage is full-tier only, so an omission passes --pre and
      reds the full tier and post-merge main, spawning a critical ci_rca rec
    graduation: graduate
    graduation_check_id: plan-obligations-mirror-tests
  - step: 9
    phase: pre-deploy
    hermetic: true
    action: The contract has the Class D shape the schema actually requires
    command: >-
      bin/venv-python -c "import yaml;d=yaml.safe_load(open('docs/contracts/plan-obligations.yaml'));c=d['contract'];assert c['class']=='D';assert c['status']=='ratified';assert c['ratified_via']=='dec-170';assert c['evaluator'].get('check')=='validate_plan_scope_closure';assert 'amendment_log' in d and 'amendment_log' not in c;print('class D shape ok')"
    expected: exit 0, prints class D shape ok
    fix_if: >-
      shape failure - amendment_log is a TOP-LEVEL sibling of contract:, not a key inside it, and
      ContractMeta is extra=forbid. The evaluator assertion is a subset check (.get) so an additional
      evaluator key does not red a correct contract.
    graduation: graduate
    graduation_check_id: plan-obligations-contract-shape
  - step: 10
    phase: pre-deploy
    hermetic: true
    action: The file-router route exists and its topic equals the contract subject
    command: >-
      bin/venv-python -c "import yaml;r=yaml.safe_load(open('docs/contracts/file-router.yaml'));c=yaml.safe_load(open('docs/contracts/plan-obligations.yaml'))['contract'];hit=[x for x in r['routes'] if x.get('topic')==c['subject'] and 'docs/contracts/plan-obligations.yaml' in x.get('targets',[])];assert hit, 'no route binding topic to subject';print('route ok')"
    expected: exit 0, prints route ok
    fix_if: missing - contract-population.yaml binds a route's topic to the contract's subject
    graduation: graduate
    graduation_check_id: plan-obligations-router-route
  - step: 11
    phase: pre-deploy
    hermetic: true
    action: The contract-drift validator scans the new contract and reports clean
    command: >-
      bin/venv-python -c "import pathlib;from scripts.checks.contracts.validate_contract_drift import validate_contract_drift;assert pathlib.Path('docs/contracts/plan-obligations.yaml').exists(), 'contract absent - nothing to scan';f=[];validate_contract_drift(f);bad=[x for x in f if 'plan-obligations' in str(x)];assert not bad, bad;print('drift clean for plan-obligations')"
    expected: exit 0, prints drift clean for plan-obligations
    fix_if: >-
      a failure names plan-obligations - the declared evaluator must demonstrably READ the contract
      (Decision 168). Asserting on the failure list rather than invoking the module as a script is
      deliberate: it has no __main__ and would exit 0 vacuously.
    graduation: graduate
    graduation_check_id: plan-obligations-contract-drift-clean
  - step: 12
    phase: pre-deploy
    hermetic: true
    action: Both prose surfaces shrank or held, and the relocation actually happened
    command: >-
      bash -c 'grep -q "plan-obligations.yaml" .claude/skills/planning/SKILL.md || { echo "no anchor+pointer"; exit 1; }; for p in .claude/skills/planning/SKILL.md scripts/CLAUDE.md; do b=$(git show origin/main:$p | wc -c); a=$(wc -c < $p); [ "$a" -le "$b" ] || { echo "$p grew $b->$a"; exit 1; }; done; echo net-neutral ok'
    expected: exit 0, prints net-neutral ok
    fix_if: >-
      "no anchor+pointer" means the relocation was not performed; "grew" means take the named cuts in
      Constraints. Do NOT raise a prose budget (Decision 166: a second raise is the accretion pattern).
    graduation: graduate
    graduation_check_id: plan-obligations-prose-net-neutral
  - step: 13
    phase: pre-deploy
    hermetic: true
    action: Both registration procedures name all six surfaces inside the procedure prose itself
    command: >-
      bin/venv-python -c "import pathlib,re,sys;t1=pathlib.Path('scripts/CLAUDE.md').read_text();m1=re.search(r'## Adding a validate\.py check(.*?)(?=\n## |\Z)',t1,re.S);t2=pathlib.Path('scripts/checks/registry.py').read_text();m2=re.search(r'\"\"\"(.*?)\"\"\"',t2,re.S);assert m1 and m2,'procedure block not found';[sys.exit(f'{n} procedure omits {s}') for n,b in (('scripts/CLAUDE.md',m1.group(1)),('registry.py',m2.group(1))) for s in ('ci_rca_taxonomy','verification_registry','mirror') if s not in b];print('both procedures complete')"
    expected: exit 0, prints both procedures complete
    fix_if: >-
      a surface is missing from a procedure BLOCK. Block-scoping is what makes this discriminating -
      a file-wide grep already matches registry.py via unrelated sequence entries.
    graduation: graduate
    graduation_check_id: plan-obligations-procedure-complete
  - step: 14
    phase: pre-deploy
    hermetic: true
    action: The critique skill consumes the obligation report and emits finding-origin attribution
    command: >-
      bin/venv-python -c "import pathlib;t=pathlib.Path('.claude/skills/plan-critique/SKILL.md').read_text();assert 'scripts.plan_obligations' in t, 'critic does not invoke the obligation query';assert 'finding-origin attribution' in t.lower(), 'no finding-origin attribution in the output shape'"
    expected: exit 0
    fix_if: >-
      assertion - the critic still re-derives mechanical facts, or the structured output lacks the
      attribution field the convergence-cap escalation depends on
    graduation: graduate
    graduation_check_id: plan-obligations-critic-consumes-report
  - step: 15
    phase: pre-deploy
    hermetic: true
    action: The plan command invokes the obligation query at its authoring steps
    command: >-
      bin/venv-python -c "import pathlib;t=pathlib.Path('.claude/commands/plan.md').read_text();assert 'scripts.plan_obligations' in t, 'Step 4/6b do not invoke the obligation query'"
    expected: exit 0
    fix_if: assertion - the command file was not wired to the query
    graduation: graduate
    graduation_check_id: plan-obligations-command-wired
  - step: 16
    phase: pre-deploy
    hermetic: true
    action: Decision 170 is present in the corpus
    command: >-
      bin/venv-python -c "import pathlib;t=pathlib.Path('docs/DECISIONS.md').read_text();assert '## Decision 170:' in t, 'Decision 170 absent'"
    expected: exit 0
    fix_if: >-
      absent - write it. Decision 169 was claimed by #883 while this plan was in critique; if 170 is
      also taken, shift to the next free number and update every reference here, including the
      contract's ratified_via and step 9's assertion.
    graduation: waive
    graduation_waiver_reason: >-
      NOT a tautology - this step is measured discriminating today. The waiver is on registry-row
      durability: the header number is unstable at plan time and this plan has already lost one race
      (169 went to #883 mid-critique), so a permanent row pinned to '## Decision 170:' would break on
      the next concurrent merge. validate_decision_entry_conformance is the durable guard and is
      already sequenced in both tiers.
  - step: 17
    phase: pre-deploy
    hermetic: true
    action: The whole plan-document check family returns zero failures
    command: >-
      bin/venv-python -c "from scripts.checks.roadmap.validate_plan_documents import validate_plan_documents; from scripts.checks.verification.validate_handoff_full_tier import validate_handoff_full_tier; from scripts.checks.verification.validate_graduation_completeness import validate_graduation_completeness; from scripts.checks.verification.validate_verification_registry import validate_verification_registry; f=[]; [fn(f) for fn in (validate_plan_documents, validate_handoff_full_tier, validate_graduation_completeness, validate_verification_registry)]; print(len(f)); assert not f, f"
    expected: exit 0, prints 0
    fix_if: >-
      failures - a scope file lacks a test obligation, the plan declares full validation without a
      full-tier step, a pre-deploy step lacks a disposition, or a registry row is malformed
    graduation: waive
    graduation_waiver_reason: >-
      Measured tautological: this exits 0 against the unchanged tree because the plan is already
      well-formed, so validate_verification_registry's added-entry differential - which materializes
      each new row in a real origin/main worktree and requires FAIL there - would refuse the row. All
      four validators are themselves sequenced in both tiers, so a graduated row would duplicate a
      gate that already fires on every run.
  - step: 18
    phase: pre-deploy
    hermetic: false
    action: Fast tier is green
    command: bin/venv-python -m scripts.validate --pre
    expected: exit 0
    fix_if: any check fails - fix forward; never disable a check to pass the tier
    graduation: not-applicable
  - step: 19
    phase: pre-deploy
    hermetic: false
    action: Full tier is green (the handoff_policy obligation, Decision 163 / rec-2965)
    command: bin/venv-python -m scripts.validate
    expected: exit 0
    fix_if: >-
      any check fails - fix forward. This step exists because handoff_policy declares
      full_validation_required_before_commit, and validate_handoff_full_tier requires a VP step
      invoking `-m scripts.validate` WITHOUT --pre. It is also the only tier that runs
      validate_test_coverage, which enforces the mirror-test rule.
    graduation: not-applicable
test_obligations:
  - source: scripts/plan_obligations.py
    behavior: >-
      Derives the full registration coupling from scope shape, reads its map from the contract, and
      the CLI is advisory and non-mutating.
    verification_step: 1
    test_selector: tests/test_plan_obligations.py::TestRegistrationClosure
    red_green_expectation: red before (module absent, ImportError), green after
  - source: scripts/checks/roadmap/validate_plan_scope_closure.py
    behavior: >-
      Fails a diff-scoped plan that omits an obligated registration row or a relocated
      Closure-Obligation rule; never sweeps the corpus.
    verification_step: 2
    test_selector: tests/checks/roadmap/test_validate_plan_scope_closure.py::TestForwardOnly
    red_green_expectation: red before (check absent), green after
  - source: scripts/checks/roadmap/_manifest.py
    behavior: Declares the check's Entry in both tiers with plan-scoped pre_globs.
    verification_step: 6
    command: >-
      bin/venv-python -c "from scripts.checks import registry; registry.resolve('validate_plan_scope_closure'); pre={s.name for s in registry.pre_sequence()}; full={s.name for s in registry.full_sequence()}; assert 'validate_plan_scope_closure' in pre, 'absent from --pre'; assert 'validate_plan_scope_closure' in full, 'absent from full'; print('dispatch and both sequences ok')"
    red_green_expectation: red before (UnknownCheckError), green after
  - source: scripts/checks/registry.py
    behavior: The docstring procedure names all six registration surfaces.
    verification_step: 13
    command: >-
      bin/venv-python -c "import pathlib,re,sys;t1=pathlib.Path('scripts/CLAUDE.md').read_text();m1=re.search(r'## Adding a validate\.py check(.*?)(?=\n## |\Z)',t1,re.S);t2=pathlib.Path('scripts/checks/registry.py').read_text();m2=re.search(r'\"\"\"(.*?)\"\"\"',t2,re.S);assert m1 and m2,'procedure block not found';[sys.exit(f'{n} procedure omits {s}') for n,b in (('scripts/CLAUDE.md',m1.group(1)),('registry.py',m2.group(1))) for s in ('ci_rca_taxonomy','verification_registry','mirror') if s not in b];print('both procedures complete')"
    red_green_expectation: red before (both procedures omit the surfaces), green after
  - source: config/ci_rca_taxonomy.yaml
    behavior: Every registered check resolves to a category row.
    verification_step: 7
    command: >-
      bin/venv-python -c "import yaml;m=yaml.safe_load(open('config/ci_rca_taxonomy.yaml'))['function_to_category'];assert 'validate_plan_scope_closure' in m, 'unmapped check reds the fast tier'"
    red_green_expectation: red before (registered-but-unmapped once the check lands), green after
  - source: config/agent/verification_registry/registry.yaml
    behavior: Each graduate-disposition step has a well-formed row carrying plan_slug.
    verification_step: 18
    command: bin/venv-python -m scripts.validate --pre
    red_green_expectation: red before (rows absent for the new check_ids), green after
  - source: docs/contracts/plan-obligations.yaml
    behavior: Valid Class D contract, ratified, with an evaluator that genuinely reads it.
    verification_step: 9
    command: >-
      bin/venv-python -c "import yaml;d=yaml.safe_load(open('docs/contracts/plan-obligations.yaml'));c=d['contract'];assert c['class']=='D';assert c['status']=='ratified';assert c['ratified_via']=='dec-170';assert c['evaluator'].get('check')=='validate_plan_scope_closure';assert 'amendment_log' in d and 'amendment_log' not in c;print('class D shape ok')"
    red_green_expectation: red before (file absent), green after
  - source: docs/contracts/file-router.yaml
    behavior: Carries a discovery route whose topic equals the new contract's subject.
    verification_step: 10
    command: >-
      bin/venv-python -c "import yaml;r=yaml.safe_load(open('docs/contracts/file-router.yaml'));c=yaml.safe_load(open('docs/contracts/plan-obligations.yaml'))['contract'];hit=[x for x in r['routes'] if x.get('topic')==c['subject'] and 'docs/contracts/plan-obligations.yaml' in x.get('targets',[])];assert hit, 'no route binding topic to subject';print('route ok')"
    red_green_expectation: red before (no route), green after
  - source: .claude/skills/planning/SKILL.md
    behavior: Carries the obligation-query call sites and the revised convergence rule, net-neutral.
    verification_step: 12
    command: >-
      bash -c 'grep -q "plan-obligations.yaml" .claude/skills/planning/SKILL.md || { echo "no anchor+pointer"; exit 1; }; for p in .claude/skills/planning/SKILL.md scripts/CLAUDE.md; do b=$(git show origin/main:$p | wc -c); a=$(wc -c < $p); [ "$a" -le "$b" ] || { echo "$p grew $b->$a"; exit 1; }; done; echo net-neutral ok'
    waiver_reason: >-
      Agent-instruction prose with no executable surface of its own. Decision 163's
      structural-enforcement requirement is discharged for this file by step 12, a graduate
      disposition that is genuinely discriminating: it asserts the anchor+pointer exists, so it fails
      on the unchanged tree.
  - source: .claude/skills/plan-critique/SKILL.md
    behavior: Consumes the obligation report and emits finding-origin attribution.
    verification_step: 14
    command: >-
