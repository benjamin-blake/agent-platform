  - >-
    Split seam for implementation (one plan, two commits): commit 1 = the engine, the three checks,
    and their registration surfaces (scope rows 1-9, 16-18); commit 2 = the prose wiring, the
    contract relocation, and Decision 169 (scope rows 10-15). Decision 169 belongs to commit 2 - it
