schema_version: 4
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: "plan-obligation-closure"
intent: >-
  Compute a plan's mechanically-derivable REGISTRATION obligations at authoring time instead of
  discovering them one plan-critique round at a time, so the fresh-context critic spends its
  judgement on adequacy and frame rather than on arithmetic the repo can already do.
plan_type: IMPLEMENTATION
verification_tier: V2
plan_path: docs/plans/PLAN-plan-obligation-closure.yaml
phase: >-
  Platform governance / plan-loop control surface. Adjacent to T2.54 (clause-to-check index,
  not_started) but deliberately narrower: registration closure for PLAN documents only.
scope:
  - file: scripts/plan_obligations.py
    action: Create
    purpose: >-
      Read-only registration-closure engine plus its advisory CLI. Depth-1 under scripts/ because
      `bin/venv-python -m scripts.plan_obligations` is an agent entry point and file-router.yaml's
      scripts_root_allowlist is the declared home for those. MUST contain the string literal
      "plan-obligations.yaml" in executable position - contract evaluator resolution follows exactly
      one hop from the check module and excludes docstrings/comments.
  - file: scripts/checks/roadmap/validate_plan_scope_closure.py
    action: Create
    purpose: >-
      The single registered check, a thin delegate. Placed in the EXISTING roadmap domain: a new
      scripts/checks/<domain>/ package would additionally require four hand-maintained registry.py
      aggregation edits.
  - file: scripts/checks/roadmap/_manifest.py
    action: Modify
    purpose: >-
      One Entry mirroring validate_plan_documents' shape - pre=True, pre_globs=("docs/plans/**",),
      full_segment="full_after_lint". Bare string-literal module=/attr= per check-manifest.yaml.
  - file: scripts/checks/registry.py
    action: Modify
    purpose: module docstring only - complete its registration procedure. No aggregation edit (roadmap exists).
  - file: config/ci_rca_taxonomy.yaml
    action: Modify
    purpose: function_to_category row for the new check
  - file: config/agent/verification_registry/registry.yaml
    action: Modify
    purpose: registry rows for this plan's graduate-disposition steps
  - file: docs/contracts/plan-obligations.yaml
    action: Create
    purpose: >-
      Class D contract holding ONLY the registration-surface map the check reads at check time.
      Mirrors check-manifest.yaml: status ratified, evaluator {check: validate_plan_scope_closure},
      amendment_log as a TOP-LEVEL sibling of contract:.
  - file: docs/contracts/file-router.yaml
    action: Modify
    purpose: >-
      TWO edits - the discovery route whose topic equals the contract's subject, AND a
      scripts_root_allowlist.allowed_files entry for scripts/plan_obligations.py. The allowlist has
      57 explicit entries and no globs; validate_placement reds --pre without it. This is itself an
      instance of the obligation class this plan computes.
  - file: .claude/skills/plan-critique/SKILL.md
    action: Modify
    purpose: >-
      Consume the obligation report instead of re-deriving mechanical facts, and emit finding-origin
      attribution so the convergence-cap escalation can localise findings. 511 B of budget headroom.
  - file: .claude/commands/plan.md
    action: Modify
    purpose: >-
      Invoke the obligation query at Steps 4 and 6b, and carry the split-as-first-class convergence
      escalation. Layer 3 sequences the workflow, so this is the call sites' correct home; S3 is
      measured-only with no prose_budgets entry.
  - file: scripts/CLAUDE.md
    action: Modify
    purpose: >-
      Complete the registration procedure. Funded by replacing lines 40-41 (the 196 B dispatch
      paragraph, duplicated in registry.py's docstring and check-manifest.yaml) with a one-line
      pointer. Lines 42-43 MUST be preserved - they carry the file's only mirror-test sentence.
  - file: docs/DECISIONS.md
    action: Modify
    purpose: Decision 170 - the gate-contract change (drafted here, written at implement time)
  - file: tests/test_plan_obligations.py
    action: Create
    purpose: mirror test for the engine (validate_test_coverage enforces strict per-module naming)
  - file: tests/checks/roadmap/test_validate_plan_scope_closure.py
    action: Create
    purpose: mirror test for the check
bundled_recommendations: []
infrastructure_dependencies: []
acceptance_criteria:
  - >-
    `bin/venv-python -m scripts.plan_obligations --plan <path>` prints a structured obligation report
    and ALWAYS exits 0, including on a plan with unmet obligations. validate_plan_scope_closure is
    the gate and exits non-zero on an unmet obligation.
  - >-
    The check is diff-scoped via `scripts.checks._common.plan_paths_from_changed` (the helper
    validate_graduation_completeness uses) and evaluates plans ADDED OR MODIFIED in the diff. It
    never globs docs/plans/, which holds 327 plans.
  - >-
    Run against a synthetic plan whose scope creates a `scripts/checks/**/validate_*.py` file but
    omits the domain _manifest.py Entry, the ci_rca_taxonomy row, the mirror test, or the
    scripts_root_allowlist entry, the check exits non-zero and names each omission by path.
  - >-
    The check reads its obligation map from docs/contracts/plan-obligations.yaml at check time and
    holds no second hardcoded copy.
  - >-
    Delegated checks are called with a throwaway failure list and their findings are re-emitted under
    this check's own namespaced strings, so one root cause never produces two lines attributed to a
    different check's ci_rca category.
  - >-
    validate_plan_scope_closure resolves through manifest dispatch, is a member of both tier
    sequences, and has its own row in config/ci_rca_taxonomy.yaml's function_to_category map.
  - >-
    scripts/CLAUDE.md's and scripts/checks/registry.py's registration procedures each name the
    ci_rca_taxonomy, verification-registry and scripts_root_allowlist surfaces, and scripts/CLAUDE.md
    retains its mirror-test sentence.
  - >-
    docs/contracts/plan-obligations.yaml is a valid Class D contract at status ratified with
    evaluator {check: validate_plan_scope_closure}, a TOP-LEVEL amendment_log, a file-router route
    whose topic equals its subject, and validate_contract_drift reports it clean.
  - >-
    scripts/plan_obligations.py is registered in file-router.yaml's
    scripts_root_allowlist.allowed_files and validate_placement passes.
  - >-
    Both prose surfaces stay within their config/prose_budgets.yaml budgets with no new or raised
    entry, as enforced by the already-registered validate_prose_limits.
  - >-
    The plan-document check family - validate_plan_documents, validate_graduation_completeness,
    validate_verification_registry, validate_handoff_full_tier, validate_test_coverage - returns zero
    failures.
  - Decision 170 is present in docs/DECISIONS.md carrying the Decision 167 typed envelope.
verification_plan:
  - step: 1
    phase: pre-deploy
    hermetic: true
    action: >-
      FIXTURE EVIDENCE - the check fails a synthetic plan missing a registration row, independent of
      the implementer's own test bodies
    command: >-
      bin/venv-python -c "import yaml,tempfile,pathlib,copy;from scripts.checks.roadmap.validate_plan_scope_closure import validate_plan_scope_closure;src=yaml.safe_load(open('docs/plans/PLAN-plan-obligation-closure.yaml'));bad=copy.deepcopy(src);bad['scope']=[r for r in bad['scope'] if r['file']!='config/ci_rca_taxonomy.yaml'];d=pathlib.Path(tempfile.mkdtemp())/'PLAN-synthetic-fixture.yaml';d.write_text(yaml.safe_dump(bad));f=[];validate_plan_scope_closure(f,plan_paths=[d]);assert f, 'check did not flag a plan missing its taxonomy row';assert any('ci_rca_taxonomy' in str(x) for x in f), f;print('fixture evidence ok')"
    expected: exit 0, prints fixture evidence ok
    fix_if: >-
      empty failure list - the closure rule does not fire, or the check has no plan_paths seam for
      fixture injection. This step exists because steps 2-6 are pytest selectors the implementer also
      writes; this one exercises the shipped behaviour against a plan the implementer did not author.
    graduation: graduate
    graduation_check_id: plan-obligations-fixture-evidence
  - step: 2
    phase: pre-deploy
    hermetic: false
    action: Closure derives every registration surface for a check-creating plan
    command: >-
      bin/venv-python -m pytest tests/test_plan_obligations.py::TestRegistrationClosure -q
    expected: passes; the report names the _manifest Entry, taxonomy row, mirror test and allowlist entry
    fix_if: a surface is missing from the map - all seven are enumerated in Constraints
    graduation: graduate
    graduation_check_id: plan-obligations-registration-closure
  - step: 3
    phase: pre-deploy
    hermetic: false
    action: The check is diff-scoped and never globs the plans directory
    command: >-
      bin/venv-python -m pytest tests/checks/roadmap/test_validate_plan_scope_closure.py::TestDiffScoped -q
    expected: >-
      passes - an empty diff evaluates zero plans, a one-plan diff evaluates exactly that plan, and a
      negative test asserts docs/plans/ is never globbed
    fix_if: >-
      the corpus is swept - 327 plans would be evaluated. Use plan_paths_from_changed, NOT
      validate_plan_documents' whole-directory glob.
    graduation: graduate
    graduation_check_id: plan-obligations-diff-scoped
  - step: 4
    phase: pre-deploy
    hermetic: false
    action: The check reads its map from the contract and holds no second copy
    command: >-
      bin/venv-python -m pytest tests/checks/roadmap/test_validate_plan_scope_closure.py::TestContractIsSourceOfTruth -q
    expected: passes - mutating the contract's map changes the check's behaviour
    fix_if: behaviour unchanged - the map is hardcoded, which defeats the contract's evaluator obligation
    graduation: graduate
    graduation_check_id: plan-obligations-contract-is-sot
  - step: 5
    phase: pre-deploy
    hermetic: false
    action: Delegated findings are namespaced, not double-appended
    command: >-
      bin/venv-python -m pytest tests/test_plan_obligations.py::TestDelegationNamespacing -q
    expected: >-
      passes - delegates are called with a throwaway list and their findings re-emitted under this
      check's own strings
    fix_if: >-
      the caller's list is passed straight through - validate_plan_documents and
      validate_graduation_completeness are independently sequenced, so one root cause would emit two
      lines attributed to the delegate's ci_rca category
    graduation: graduate
    graduation_check_id: plan-obligations-delegation-namespacing
  - step: 6
    phase: pre-deploy
    hermetic: false
    action: The CLI is advisory and read-only
    command: >-
      bin/venv-python -m pytest tests/test_plan_obligations.py::TestCliContract -q
    expected: passes - exit 0 on clean AND unmet-obligation plans, with no file modified
    fix_if: non-zero on unmet obligations - the CLI has become a gate, contradicting criterion 1
    graduation: graduate
    graduation_check_id: plan-obligations-cli-advisory
  - step: 7
    phase: pre-deploy
    hermetic: true
    action: The check resolves through manifest dispatch and sits in both tier sequences
    command: >-
      bin/venv-python -c "from scripts.checks import registry; registry.resolve('validate_plan_scope_closure'); pre={s.name for s in registry.pre_sequence()}; full={s.name for s in registry.full_sequence()}; assert 'validate_plan_scope_closure' in pre, 'absent from --pre'; assert 'validate_plan_scope_closure' in full, 'absent from full'; print('dispatch and both sequences ok')"
    expected: exit 0, prints dispatch and both sequences ok
    fix_if: >-
      UnknownCheckError or assertion - add the Entry to scripts/checks/roadmap/_manifest.py. Both-tier
      membership is safe: this check executes nothing from any plan document.
    graduation: graduate
    graduation_check_id: plan-obligations-dispatch-and-sequences
  - step: 8
    phase: pre-deploy
    hermetic: true
    action: The check has a taxonomy row
    command: >-
      bin/venv-python -c "import yaml;m=yaml.safe_load(open('config/ci_rca_taxonomy.yaml'))['function_to_category'];assert 'validate_plan_scope_closure' in m, 'unmapped check reds the fast tier'"
    expected: exit 0
    fix_if: assertion - add the function_to_category row (#874's round-4 blocker, reproduced)
    graduation: graduate
    graduation_check_id: plan-obligations-taxonomy-mapped
  - step: 9
    phase: pre-deploy
    hermetic: true
    action: Both new modules satisfy the strict mirror-test naming rule
    command: >-
      bin/venv-python -c "from pathlib import Path; from scripts.test_coverage_checker import check_test_file_exists; bad=[(m,r) for m in ('scripts/plan_obligations.py','scripts/checks/roadmap/validate_plan_scope_closure.py') for ok,r in [check_test_file_exists(Path(m))] if not ok]; assert not bad, bad; print('mirror tests ok')"
    expected: exit 0, prints mirror tests ok
    fix_if: >-
      a mirror is missing - validate_test_coverage is full-tier only, so an omission passes --pre and
      reds the full tier and post-merge main
    graduation: graduate
    graduation_check_id: plan-obligations-mirror-tests
  - step: 10
    phase: pre-deploy
    hermetic: true
    action: The engine is registered in the scripts-root allowlist
    command: >-
      bin/venv-python -c "import yaml;a=yaml.safe_load(open('docs/contracts/file-router.yaml'))['scripts_root_allowlist']['allowed_files'];assert any(str(x).endswith('plan_obligations.py') for x in a), 'plan_obligations.py absent from scripts_root_allowlist'"
    expected: exit 0
    fix_if: >-
      assertion - the allowlist has 57 explicit entries and no globs; validate_placement reds --pre
      without one. This is itself an instance of the obligation class this plan computes.
    graduation: graduate
    graduation_check_id: plan-obligations-scripts-allowlist
  - step: 11
    phase: pre-deploy
    hermetic: true
    action: The contract has the Class D shape the schema requires
    command: >-
      bin/venv-python -c "import yaml;d=yaml.safe_load(open('docs/contracts/plan-obligations.yaml'));c=d['contract'];assert c['class']=='D';assert c['status']=='ratified';assert c.get('ratified_via');assert c['evaluator'].get('check')=='validate_plan_scope_closure';assert 'amendment_log' in d and 'amendment_log' not in c;print('class D shape ok')"
    expected: exit 0, prints class D shape ok
    fix_if: >-
      shape failure - amendment_log is a TOP-LEVEL sibling of contract: and ContractMeta is
      extra=forbid. ratified_via is asserted for presence only; use the established
      "Decision 170 / PLAN-plan-obligation-closure" form.
    graduation: graduate
    graduation_check_id: plan-obligations-contract-shape
  - step: 12
    phase: pre-deploy
    hermetic: true
    action: The file-router route exists and its topic equals the contract subject
    command: >-
      bin/venv-python -c "import yaml;r=yaml.safe_load(open('docs/contracts/file-router.yaml'));c=yaml.safe_load(open('docs/contracts/plan-obligations.yaml'))['contract'];hit=[x for x in r['routes'] if x.get('topic')==c['subject'] and 'docs/contracts/plan-obligations.yaml' in x.get('targets',[])];assert hit, 'no route binding topic to subject';print('route ok')"
    expected: exit 0, prints route ok
    fix_if: missing - contract-population.yaml binds a route's topic to the contract's subject
    graduation: graduate
    graduation_check_id: plan-obligations-router-route
  - step: 13
    phase: pre-deploy
    hermetic: true
    action: The contract-drift validator scans the new contract and reports clean
    command: >-
      bin/venv-python -c "import pathlib;from scripts.checks.contracts.validate_contract_drift import validate_contract_drift;assert pathlib.Path('docs/contracts/plan-obligations.yaml').exists(), 'contract absent - nothing to scan';f=[];validate_contract_drift(f);bad=[x for x in f if 'plan-obligations' in str(x)];assert not bad, bad;print('drift clean for plan-obligations')"
    expected: exit 0, prints drift clean for plan-obligations
    fix_if: >-
      a failure names plan-obligations - the evaluator must contain the contract basename as an
      executable string literal, within ONE hop of the check module. Delegating the contract read
      further than scripts/plan_obligations.py breaks resolution.
    graduation: graduate
    graduation_check_id: plan-obligations-contract-drift-clean
  - step: 14
    phase: pre-deploy
    hermetic: true
    action: Both registration procedures name the three previously-omitted surfaces, mirror sentence intact
    command: >-
      bin/venv-python -c "import pathlib,re,sys;t1=pathlib.Path('scripts/CLAUDE.md').read_text();m1=re.search(r'## Adding a validate\.py check(.*?)(?=\n## |\Z)',t1,re.S);t2=pathlib.Path('scripts/checks/registry.py').read_text();m2=re.search(r'\"\"\"(.*?)\"\"\"',t2,re.S);assert m1 and m2,'procedure block not found';[sys.exit(f'{n} procedure omits {s}') for n,b in (('scripts/CLAUDE.md',m1.group(1)),('registry.py',m2.group(1))) for s in ('ci_rca_taxonomy','verification_registry','scripts_root_allowlist') if s not in b];assert 'test__manifest.py' in m1.group(1), 'scripts/CLAUDE.md lost its mirror-test sentence';print('both procedures complete')"
    expected: exit 0, prints both procedures complete
    fix_if: >-
      a surface is missing from a procedure BLOCK, or the mirror sentence was cut. Fund the addition
      from lines 40-41 only (196 B); lines 42-43 carry the mirror sentence and must survive.
    graduation: graduate
    graduation_check_id: plan-obligations-procedure-complete
  - step: 15
    phase: pre-deploy
    hermetic: true
    action: The critique skill invokes the obligation query and emits finding-origin attribution
    command: >-
      bin/venv-python -c "import pathlib;t=pathlib.Path('.claude/skills/plan-critique/SKILL.md').read_text();assert 'scripts.plan_obligations' in t, 'critic does not invoke the obligation query';assert 'finding-origin' in t.lower(), 'no finding-origin attribution in the output shape'"
    expected: exit 0
    fix_if: assertion - the critic still re-derives mechanical facts, or the output lacks the attribution field
    graduation: graduate
    graduation_check_id: plan-obligations-critic-consumes-report
  - step: 16
    phase: pre-deploy
    hermetic: true
    action: The plan command invokes the query and carries the split-as-first-class escalation
    command: >-
      bin/venv-python -c "import pathlib;t=pathlib.Path('.claude/commands/plan.md').read_text();assert 'scripts.plan_obligations' in t, 'Steps 4/6b do not invoke the obligation query';assert 'split' in t.lower(), 'convergence escalation lacks the split option'"
    expected: exit 0
    fix_if: assertion - the command file was not wired
    graduation: graduate
    graduation_check_id: plan-obligations-command-wired
  - step: 17
    phase: pre-deploy
    hermetic: true
    action: Decision 170 is present in the corpus
    command: >-
      bin/venv-python -c "import pathlib;t=pathlib.Path('docs/DECISIONS.md').read_text();assert '## Decision 170:' in t, 'Decision 170 absent'"
    expected: exit 0
    fix_if: >-
      absent - write it. Decision 169 was claimed by #883 mid-critique; if 170 is taken, shift to the
      next free number and update the contract's ratified_via and this step.
    graduation: waive
    graduation_waiver_reason: >-
      NOT a tautology - measured discriminating today. The waiver is on registry-row durability: the
      header number is unstable at plan time and this plan already lost one race, so a permanent row
      pinned to '## Decision 170:' breaks on the next concurrent merge.
      validate_decision_entry_conformance is the durable guard and is sequenced in both tiers.
  - step: 18
    phase: pre-deploy
    hermetic: true
    action: The plan-document check family returns zero failures
    command: >-
      bin/venv-python -c "from scripts.checks.roadmap.validate_plan_documents import validate_plan_documents; from scripts.checks.verification.validate_handoff_full_tier import validate_handoff_full_tier; from scripts.checks.verification.validate_graduation_completeness import validate_graduation_completeness; from scripts.checks.verification.validate_verification_registry import validate_verification_registry; f=[]; [fn(f) for fn in (validate_plan_documents, validate_handoff_full_tier, validate_graduation_completeness, validate_verification_registry)]; print(len(f)); assert not f, f"
    expected: exit 0, prints 0
    fix_if: a scope file lacks a test obligation, or a registry row is malformed
    graduation: waive
    graduation_waiver_reason: >-
      Measured tautological: exits 0 on the unchanged tree because the plan is already well-formed,
      so validate_verification_registry's added-entry differential - which materializes each new row
      in an origin/main worktree and requires FAIL there - would refuse the row. All four validators
      are themselves sequenced in both tiers, so a graduated row duplicates a live gate.
  - step: 19
    phase: pre-deploy
    hermetic: false
    action: Fast tier is green
    command: bin/venv-python -m scripts.validate --pre
    expected: exit 0
    fix_if: any check fails - fix forward; never disable a check to pass the tier
    graduation: not-applicable
  - step: 20
    phase: pre-deploy
    hermetic: false
    action: Full tier is green (handoff_policy obligation, Decision 163 / rec-2965)
    command: bin/venv-python -m scripts.validate
    expected: exit 0
    fix_if: >-
      any check fails - fix forward. Required because handoff_policy declares
      full_validation_required_before_commit. It is also the only tier running validate_test_coverage.
    graduation: not-applicable
test_obligations:
  - source: scripts/plan_obligations.py
    behavior: >-
      Derives all seven registration surfaces from scope shape, reads its map from the contract,
      namespaces delegated findings, and the CLI is advisory and non-mutating.
    verification_step: 2
    test_selector: tests/test_plan_obligations.py::TestRegistrationClosure
    red_green_expectation: red before (module absent, ImportError), green after
  - source: scripts/checks/roadmap/validate_plan_scope_closure.py
    behavior: >-
      Fails a diff-scoped plan omitting an obligated registration row; never globs the plans
      directory; exposes a plan_paths seam for fixture injection.
    verification_step: 1
    command: >-
      bin/venv-python -c "import yaml,tempfile,pathlib,copy;from scripts.checks.roadmap.validate_plan_scope_closure import validate_plan_scope_closure;src=yaml.safe_load(open('docs/plans/PLAN-plan-obligation-closure.yaml'));bad=copy.deepcopy(src);bad['scope']=[r for r in bad['scope'] if r['file']!='config/ci_rca_taxonomy.yaml'];d=pathlib.Path(tempfile.mkdtemp())/'PLAN-synthetic-fixture.yaml';d.write_text(yaml.safe_dump(bad));f=[];validate_plan_scope_closure(f,plan_paths=[d]);assert f, 'check did not flag a plan missing its taxonomy row';assert any('ci_rca_taxonomy' in str(x) for x in f), f;print('fixture evidence ok')"
    red_green_expectation: red before (check absent, ImportError), green after
  - source: scripts/checks/roadmap/_manifest.py
    behavior: Declares the check's Entry in both tiers with plan-scoped pre_globs.
    verification_step: 7
    command: >-
      bin/venv-python -c "from scripts.checks import registry; registry.resolve('validate_plan_scope_closure'); pre={s.name for s in registry.pre_sequence()}; full={s.name for s in registry.full_sequence()}; assert 'validate_plan_scope_closure' in pre, 'absent from --pre'; assert 'validate_plan_scope_closure' in full, 'absent from full'; print('dispatch and both sequences ok')"
    red_green_expectation: red before (UnknownCheckError), green after
  - source: scripts/checks/registry.py
    behavior: The docstring procedure names the three previously-omitted surfaces.
    verification_step: 14
    command: >-
      bin/venv-python -c "import pathlib,re,sys;t1=pathlib.Path('scripts/CLAUDE.md').read_text();m1=re.search(r'## Adding a validate\.py check(.*?)(?=\n## |\Z)',t1,re.S);t2=pathlib.Path('scripts/checks/registry.py').read_text();m2=re.search(r'\"\"\"(.*?)\"\"\"',t2,re.S);assert m1 and m2,'procedure block not found';[sys.exit(f'{n} procedure omits {s}') for n,b in (('scripts/CLAUDE.md',m1.group(1)),('registry.py',m2.group(1))) for s in ('ci_rca_taxonomy','verification_registry','scripts_root_allowlist') if s not in b];assert 'test__manifest.py' in m1.group(1), 'scripts/CLAUDE.md lost its mirror-test sentence';print('both procedures complete')"
    red_green_expectation: red before (both procedures omit the surfaces), green after
  - source: config/ci_rca_taxonomy.yaml
    behavior: Every registered check resolves to a category row.
    verification_step: 8
    command: >-
      bin/venv-python -c "import yaml;m=yaml.safe_load(open('config/ci_rca_taxonomy.yaml'))['function_to_category'];assert 'validate_plan_scope_closure' in m, 'unmapped check reds the fast tier'"
    red_green_expectation: red before (registered-but-unmapped once the check lands), green after
  - source: config/agent/verification_registry/registry.yaml
    behavior: Each graduate-disposition step has a well-formed row carrying plan_slug.
    verification_step: 20
    command: bin/venv-python -m scripts.validate
    waiver_reason: >-
      Registry rows are data, not behaviour. Their well-formedness is enforced by the already-
      registered validate_verification_registry, and their discriminating power by its added-entry
      differential on the implement PR - not by anything this plan could unit-test. Step 20 is the
      tier that runs both.
  - source: docs/contracts/plan-obligations.yaml
    behavior: Valid Class D contract, ratified, with an evaluator that genuinely reads it.
    verification_step: 11
    command: >-
      bin/venv-python -c "import yaml;d=yaml.safe_load(open('docs/contracts/plan-obligations.yaml'));c=d['contract'];assert c['class']=='D';assert c['status']=='ratified';assert c.get('ratified_via');assert c['evaluator'].get('check')=='validate_plan_scope_closure';assert 'amendment_log' in d and 'amendment_log' not in c;print('class D shape ok')"
    red_green_expectation: red before (file absent), green after
  - source: docs/contracts/file-router.yaml
    behavior: Carries the topic==subject route AND the scripts_root_allowlist entry.
    verification_step: 10
    command: >-
