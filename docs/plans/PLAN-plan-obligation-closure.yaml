    _c("validate_verification_registry") sequence entries.
  - >-
    Measured constraints at authoring time: scripts/validate.py 497/500 effective;
    .claude/skills/planning/SKILL.md 55810/55816 bytes (6 B); scripts/CLAUDE.md 2984/2984 (zero);
