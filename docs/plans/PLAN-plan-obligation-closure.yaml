    hatch letting the implementer add validator-demanded companion edits. Rejected on the operator's
    ruling that a sanctioned in-scope bypass becomes the path of least resistance and erodes the
    closed-world plan contract. Decision 55 names this exact instinct ("the supervisor's instinct was
    --skip-critique").
  - >-
    Rejected alternative: reframing the re-derivation gate and convergence-cap change as advisory
    tooling to avoid clearing the Decision 150 bar. Rejected as gaming the discriminator - an
    advisory obligation the planner may skip under load is precisely the Decision 163 failure mode.
    Round-1 critique independently upheld the Decision 169 routing against decision-entry.yaml's
    three-question rule, citing Decision 168 as the direct precedent for the shape.
  - >-
    Decision routing worked out explicitly: Decision 168 forces no Decision because a contract at
    status provisional_v0 needs no ratified_via (contracts_schema.py:193). Decision 165 forces none
    because the chosen remedy takes no budget raise. What remains is decision-entry.yaml's
    three-question rule applied to the gate-contract change, which clears all three - hence
    Decision 169. Registering checks satisfies Decision 163 (is it enforced) but does not touch
    Decision 150 (is it significant); they answer different questions.
  - >-
    Two copies of the registration procedure are incomplete in the same way: scripts/CLAUDE.md's
    "## Adding a validate.py check" section and scripts/checks/registry.py's module docstring both
    name the module, the @register decoration, the sequence insert and the validate.py re-export, and
