schema_version: 4
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: "convergence-health-prod-drift-red"
intent: >-
  Restore the convergence-health sensor to green and convert the prod-class Lambda code-drift
  alarm from a permanently-failing step into a working true-positive alarm, then close the
  observability gap that let a dead sensor look healthy for 22 hours.
plan_type: IMPLEMENTATION
verification_tier: V3
plan_path: docs/plans/PLAN-convergence-health-prod-drift-red.yaml
phase: >-
  T2.43 (prod-class code-drift sensor, Decision 125/126) with T2.38 (ducklake sensor) touched
  symmetrically; monitor-lane observability per Decision 62.
scope:
  - file: config/agent/data_quality/source_registry.yaml
    action: Modify
    purpose: >-
      Register TWO canonical_ids, both unregistered today and both latent instances of the same
      defect. (1) prod_code_drift, filed by detect_prod_code_drift -- its absence is what reds the
      workflow. (2) executor-hotfix, filed by scripts/executor/branch_lifecycle.py:400 -- dormant
      only because the executor is frozen (Decision 67), and a guaranteed collateral red once the
      widened guard in this plan starts scanning producer modules.
  - file: scripts/convergence_health/code_drift.py
    action: Modify
    purpose: >-
      Defect B. Replace the equality freshness test in BOTH detect_prod_code_drift (line 296) and
      detect_ducklake_code_drift (line 128) with the reachability oracle; add an empty-latest_sha
      guard; re-express _build_drift_acceptance and both context builders against the new oracle
      so the filed rec's acceptance command is satisfiable by a correct redeploy (Decision 103).
  - file: scripts/checks/ops_governance/check_source_registry.py
    action: Modify
    purpose: >-
      Defect C. Widen the hardcoded-source-literal scan from the portal files to the enumerated
      producer-module set (see constraints), and add registry.examined() so the check declares an
      outcome (Decision 170 touch-it-fix-it).
  - file: scripts/checks/ops_governance/_manifest.py
    action: Modify
    purpose: >-
      Add pre=True with pre_globs covering the full scan set to the check_source_registry Entry, so
      an unregistered source is blocked pre-merge rather than detected post-merge (Decision 73).
  - file: config/check_accounting_baseline.yaml
    action: Modify
    purpose: >-
      Remove the check_source_registry row (line 36) now that the check declares an examined()
      outcome. Removal is a permitted shrink under the Decision 170 ratchet; re-adding is not.
  - file: docs/contracts/build-lambda.yaml
    action: Modify
    purpose: >-
      Add a deploy_record field-semantics stanza defining freshness as reachability (not equality)
      and stating that a null source_git_sha from a break-glass local deploy is deliberately
      treated as stale. This is a Class D contract, so the change also owes a new amendment_log[]
      entry (see constraints). Decision 86 routing -- field semantics belong in a contract.
  - file: scripts/preflight/ci_rca_signals.py
    action: Modify
    purpose: >-
      Add a NEW sibling check _check_convergence_sensor_liveness, modelled directly on
      _check_ci_rca_liveness (lines 194-249): same creds_status guard, same subprocess `gh run
      list` shape with a timeout, same degrade-to-None error handling -- pointed at
      --workflow convergence-health.yml. It returns its OWN payload shape and does NOT touch
      _check_convergence_rca_gap's payload contract.
  - file: scripts/session/preflight.py
    action: Modify
    purpose: >-
      Call the new liveness check, surface it under its own report key and its own printed line,
      and include it in the one-line summary. Deliberately a separate key from
      convergence_rca_gap_alert, whose consumers at lines 414 and 502 hard-subscript
      ['red_age_hours']; a distinct payload means those subscripts stay correct and untouched.
  - file: tests/convergence_health/test_code_drift.py
    action: Modify
    purpose: >-
      Decompose to stay under the 500-SLOC gate (currently 478 effective lines; tests/ is gated by
      iter_gated_py_files). Retain the ducklake-side cases here and add reachability cases.
      Decision 128 -- decompose by default, never raise the budget.
  - file: tests/convergence_health/test_code_drift_prod.py
    action: Create
    purpose: >-
      Decomposition target -- prod-side drift cases: the reachability oracle, the
      workflow_dispatch case that caused this incident (recorded sha newer than the latest
      prod-source commit must report FRESH), fail-closed on a null sha, fail-closed on an
      unresolvable sha, and fail-closed on an empty latest_sha.
  - file: tests/checks/ops_governance/test_check_source_registry.py
    action: Modify
    purpose: >-
      Cover the widened scan (an unregistered source literal in a producer module fails the guard),
      that the enumerated scan set is exactly what is scanned, and the examined() declaration.
  - file: tests/session/preflight/test_ci_rca_signals.py
    action: Modify
    purpose: >-
      Cover the liveness check: a failing latest convergence-health run alerts even when the
      convergence record is green; a successful latest run does not; missing creds, a gh failure
      and a malformed payload each degrade to None so preflight never crashes (rec-2027 pattern).
bundled_recommendations: []
infrastructure_dependencies: []
acceptance_criteria:
  - >-
    validate_source returns without raising for both 'prod_code_drift' and 'executor-hotfix',
    and no producer-module source literal in the enumerated scan set is unregistered.
  - >-
    Deployed-code freshness is evaluated by the reachability oracle: the latest watched-source
    commit REACHABLE FROM the recorded source_git_sha equals the latest watched-source commit on
    HEAD. A deploy made from a commit that postdates the newest source change is therefore fresh.
  - A null, unresolvable, or empty source_git_sha or latest_sha is treated as stale (fail closed), never as fresh.
  - The filed drift rec's acceptance command is satisfiable by a correct redeploy under the reachability oracle.
  - check_source_registry fails when any module in the enumerated scan set hardcodes an unregistered source literal.
  - >-
    check_source_registry runs in the fast tier with pre_globs that actually cover every path in
    the enumerated scan set plus the registry file and schedule.yaml, so an unregistered source is
    blocked pre-merge.
  - check_source_registry declares an examined() outcome and is absent from config/check_accounting_baseline.yaml.
  - tests/convergence_health/test_code_drift.py is under 500 effective lines after decomposition, with no sloc_budgets.yaml entry added.
  - >-
    Preflight surfaces a convergence-health sensor-liveness alert when the latest run of that
    workflow did not succeed, even when the convergence record status is green, and degrades to
    None (never raising) on missing creds or any gh failure.
  - A scheduled convergence-health run completes successfully after merge and files no prod_code_drift rec.
verification_plan:
  - step: 1
    phase: pre-deploy
    action: Both previously-unregistered sources are registered and accepted by the write-time validator
    command: bin/venv-python -c "from scripts.executor.rec_write_guidance import validate_source; validate_source('prod_code_drift'); validate_source('executor-hotfix'); print('REGISTERED')"
    expected: prints REGISTERED and exits 0
    fix_if: >-
      Raises ValueError "Unknown source" -- the canonical_id entry is missing or misspelled in
      config/agent/data_quality/source_registry.yaml.
    hermetic: true
    graduation: graduate
    graduation_check_id: drift-and-hotfix-sources-registered
  - step: 2
    phase: pre-deploy
    action: >-
      The reachability oracle holds for both sensors, including the dispatch-deploy case that
      caused this incident and every fail-closed case
    command: bin/venv-python -m pytest tests/convergence_health/test_code_drift.py tests/convergence_health/test_code_drift_prod.py -q
    expected: >-
      all tests pass, including a case where the recorded sha postdates the latest source-touching
      commit and is reported FRESH, and cases where null / unresolvable / empty report STALE
    fix_if: >-
      A recorded sha that postdates the latest source commit still reports stale -- the comparison
      is still equality, not reachability. A null or unresolvable sha reports fresh -- the
      fail-closed default is inverted.
    hermetic: false
    graduation: graduate
    graduation_check_id: convergence-drift-reachability-tests
  - step: 3
    phase: pre-deploy
    action: The registry guard rejects an unregistered source literal in a producer module
    command: bin/venv-python -m pytest tests/checks/ops_governance/test_check_source_registry.py -q
    expected: passes, including a case asserting a producer-module literal outside the portal files is flagged
    fix_if: The producer-module fixture passes the guard -- the scan file list was not widened, only the regex was reviewed.
    hermetic: false
    graduation: graduate
    graduation_check_id: source-registry-guard-producer-scan
  - step: 4
    phase: pre-deploy
    action: >-
      The guard runs in the fast tier AND its pre_globs actually cover every scanned path, so the
      pre-merge blocking claim is true rather than nominal
    command: bin/venv-python -c "import fnmatch; from scripts.checks.ops_governance._manifest import ENTRIES; from scripts.checks.ops_governance.check_source_registry import SCANNED_PATHS; e=[x for x in ENTRIES if x.name=='check_source_registry'][0]; assert e.pre is True, e; g=list(e.pre_globs or []); req=list(SCANNED_PATHS)+['config/agent/data_quality/source_registry.yaml','.github/agents/schedule.yaml']; missing=[p for p in req if not any(fnmatch.fnmatch(p,pat) for pat in g)]; assert not missing, missing; print('PRE_TIER_GLOBS_OK')"
    expected: prints PRE_TIER_GLOBS_OK and exits 0
    fix_if: >-
      AssertionError listing missing paths -- pre_globs is narrower than the scan set, so an edit
      to an uncovered producer module still escapes the fast tier and acceptance criterion 6 is
      false. Widen pre_globs (never narrow SCANNED_PATHS to match).
    hermetic: true
    graduation: graduate
    graduation_check_id: source-registry-guard-pre-globs-cover-scan-set
  - step: 5
    phase: pre-deploy
    action: check_accounting is satisfied by the examined() declaration and the baseline shrink
    command: bin/venv-python -c "from scripts.checks.hygiene.validate_check_accounting import validate_check_accounting; f=[]; validate_check_accounting(f); assert not f, f; print('ACCOUNTING_OK')"
    expected: prints ACCOUNTING_OK and exits 0
    fix_if: >-
      Failure naming check_source_registry -- either examined() was not added, or the name was not
      removed from config/check_accounting_baseline.yaml, or both.
    hermetic: false
    graduation: graduate
    graduation_check_id: check-accounting-source-registry-clean
  - step: 6
    phase: pre-deploy
    action: The decomposed test module is under the SLOC gate with no budget raise
    command: bin/venv-python -c "from pathlib import Path; p=Path('tests/convergence_health/test_code_drift.py'); s=len([l for l in p.read_text().splitlines() if l.strip() and not l.strip().startswith('#')]); assert s<500, s; import yaml; b=yaml.safe_load(Path('config/sloc_budgets.yaml').read_text()) or {}; assert 'tests/convergence_health/test_code_drift.py' not in (b.get('budgets') or {}); print('SLOC_OK', s)"
    expected: prints SLOC_OK with a value under 500 and exits 0
    fix_if: >-
      AssertionError on the SLOC value means the file was extended rather than decomposed;
      AssertionError on the budgets key means a budget raise was taken instead (Decision 128).
    hermetic: true
    graduation: graduate
    graduation_check_id: test-code-drift-sloc-under-gate
  - step: 7
    phase: pre-deploy
    action: >-
      The sensor-liveness check alerts on a green record with a dead sensor, and degrades to None
      on every failure path so preflight cannot crash
    command: bin/venv-python -m pytest tests/session/preflight/test_ci_rca_signals.py -q
    expected: >-
      passes, including a green-record-plus-failing-latest-run case that alerts, a
      green-record-plus-successful-run case that does not, and creds-missing / gh-failure /
      malformed-payload cases that each return None
    fix_if: >-
      The green-record-plus-dead-sensor case returns None -- the liveness check is still gated
      behind a record-is-red early return, which is the exact blind spot this closes.
    hermetic: false
    graduation: graduate
    graduation_check_id: convergence-sensor-liveness-signal
  - step: 8
    phase: pre-deploy
    action: Preflight runs end to end with the new alert wired in and does not raise
    command: bin/venv-python -m scripts.session.preflight
    expected: exits 0 and writes logs/.preflight-report.json containing the new sensor-liveness key
    fix_if: >-
      KeyError on 'red_age_hours' means the liveness payload was merged into
      convergence_rca_gap_alert instead of being given its own key -- preflight.py lines 414 and
      502 hard-subscript that field.
    hermetic: false
    graduation: not-applicable
  - step: 9
    phase: pre-deploy
    action: Fast-tier presubmit is green across the whole change
    command: bin/venv-python -m scripts.validate --pre
    expected: exit 0
    fix_if: Any failing check -- fix at source, never by narrowing the check or waiving the budget.
    hermetic: false
    graduation: not-applicable
  - step: 10
    phase: post-deploy
    action: After merge, the latest scheduled convergence-health run on main succeeded
    command: gh run list --branch main --workflow convergence-health.yml --limit 1 --json conclusion --jq '.[0].conclusion' | grep -qx success && echo SENSOR_GREEN
    expected: prints SENSOR_GREEN
    fix_if: >-
      Any other conclusion -- read that run's failing step log and RCA it. Do not disable the step
      or add continue-on-error (Decision 55 anti-masking).
    graduation: not-applicable
  - step: 11
    phase: post-deploy
    action: The corrected sensor reports no drift for the current deploy state
    command: git fetch --unshallow origin main || git fetch origin main; bin/venv-python -m scripts.convergence_health --prod-drift
    expected: exits 0 and prints a prod_code_drift result whose action is "none"
    fix_if: >-
      action is "file" or "update" -- check the deploy records against the latest prod-source
      commit. If the recorded sha postdates it, the oracle is still wrong. A non-zero exit means a
      source is still unregistered.
    graduation: not-applicable
  - step: 12
    phase: post-deploy
    action: No false-positive prod_code_drift rec was created by the corrected sensor
    command: bin/venv-python -m scripts.sync.ops pull >/dev/null 2>&1; bin/venv-python -c "import json,pathlib; rows=[json.loads(l) for l in pathlib.Path('logs/.recommendations-log.jsonl').read_text().splitlines() if l.strip()]; open_prod=[r for r in rows if r.get('source')=='prod_code_drift' and r.get('status')=='open']; assert not open_prod, open_prod; print('NO_FALSE_POSITIVE')"
    expected: prints NO_FALSE_POSITIVE and exits 0
    fix_if: >-
      An open prod_code_drift rec exists -- confirm against the deploy records whether the drift is
      real. If it is not, step 11's diagnosis applies; close the false rec through the portal,
      never by hand-editing the cache.
    graduation: not-applicable
test_obligations:
  - source: scripts/convergence_health/code_drift.py
    behavior: >-
      Freshness is the reachability oracle, not equality: the latest watched-source commit
      reachable from the recorded sha must equal the latest on HEAD. Null, unresolvable and empty
      inputs are stale.
    verification_step: 2
    test_selector: tests/convergence_health/test_code_drift_prod.py
    red_green_expectation: >-
      red before, green after -- the dispatch-deploy case (recorded sha postdating the latest
      prod-source commit) reports drift under the current equality comparison and reports fresh
      after the change.
  - source: config/agent/data_quality/source_registry.yaml
    behavior: prod_code_drift and executor-hotfix remain registered canonical_ids accepted by validate_source.
    verification_step: 1
    command: bin/venv-python -c "from scripts.executor.rec_write_guidance import validate_source; validate_source('prod_code_drift'); validate_source('executor-hotfix'); print('REGISTERED')"
    red_green_expectation: >-
      red before, green after -- validate_source raises ValueError for both ids today and returns
      cleanly once the entries are registered.
  - source: scripts/checks/ops_governance/check_source_registry.py
    behavior: >-
      An unregistered source literal in any enumerated producer module fails the guard, and the
      check declares an examined() outcome.
    verification_step: 3
    test_selector: tests/checks/ops_governance/test_check_source_registry.py
    red_green_expectation: >-
      red before, green after -- a producer-module fixture carrying an unregistered literal passes
      the guard today and fails it after the scan is widened.
  - source: scripts/checks/ops_governance/_manifest.py
    behavior: >-
      check_source_registry declares pre=True with pre_globs that cover every scanned path, the
      registry file and schedule.yaml.
    verification_step: 4
    command: bin/venv-python -c "import fnmatch; from scripts.checks.ops_governance._manifest import ENTRIES; from scripts.checks.ops_governance.check_source_registry import SCANNED_PATHS; e=[x for x in ENTRIES if x.name=='check_source_registry'][0]; assert e.pre is True, e; g=list(e.pre_globs or []); req=list(SCANNED_PATHS)+['config/agent/data_quality/source_registry.yaml','.github/agents/schedule.yaml']; missing=[p for p in req if not any(fnmatch.fnmatch(p,pat) for pat in g)]; assert not missing, missing; print('PRE_TIER_GLOBS_OK')"
    red_green_expectation: >-
      red before, green after -- the Entry declares only full_segment today, so both the pre
      assertion and the glob-coverage assertion fail before the change.
  - source: scripts/preflight/ci_rca_signals.py
    behavior: >-
      A failing latest convergence-health run alerts even when the convergence record is green,
      and every failure path degrades to None so preflight never raises.
    verification_step: 7
    test_selector: tests/session/preflight/test_ci_rca_signals.py
    red_green_expectation: >-
      red before, green after -- no sensor-liveness check exists today, so the tests fail to
      import before the change.
  - source: scripts/session/preflight.py
    behavior: >-
      The liveness alert is surfaced under its own report key and printed line, leaving the
      convergence_rca_gap_alert payload contract (and its ['red_age_hours'] subscripts) unchanged.
    verification_step: 8
    command: bin/venv-python -m scripts.session.preflight
    red_green_expectation: >-
      red before, green after -- the report carries no sensor-liveness key today; after the change
      preflight completes and the key is present.
constraints:
  - >-
    Decision 55 anti-masking. Do NOT fix the red by swallowing validate_source's raise, by adding
    continue-on-error to the prod-drift step, or by removing the step. The alarm must keep failing
    loud on a genuine inability to file.
  - >-
    Do NOT write anything to s3://agent-platform-data-lake/convergence/personal/*. The
    convergence-health job assumes agent-platform-github-ci-branch, which carries an explicit
    Deny on s3:PutObject and s3:DeleteObject for that prefix (terraform/personal/oidc_ci_roles.tf,
    sid DenyConvergenceRecordWrite), asserted by
    scripts/checks/iam_tf/validate_convergence_writer_isolation.py clause (c) and mirrored for
    PlatformDev in platform_roles.tf (DEP-13 / Decision 144). The single-writer set is
    {github_ci_apply, github_ci_planner main-sub}. An earlier draft of this plan proposed an S3
    heartbeat in that prefix; it would have failed AccessDenied on every run and kept the workflow
    red. Sensor liveness is therefore read from the GitHub Actions run API, requiring no IAM change.
  - >-
    Fail closed on uncertainty: a null source_git_sha (break-glass local deploy, which sets no
    GITHUB_SHA), a sha unresolvable in history, or an empty latest_sha is STALE, never fresh.
    Absence of proof of freshness is not proof of freshness.
  - >-
    Do NOT change write_deploy_record's GITHUB_SHA semantics. The record is an honest statement of
    which commit was deployed; the sensor's comparison was the defect. Changing the writer would
    invalidate deploy-prod-lambdas.yml's and deploy-ducklake-lambdas.yml's smoke preconditions,
    which assert source_git_sha == github.sha.
  - >-
    The widened scan set is ENUMERATED, not discretionary. Scan exactly these producer modules
    alongside the existing portal files, exported as SCANNED_PATHS so verification step 4 can
    assert glob coverage: scripts/convergence_health/code_drift.py,
    scripts/convergence_health/escalate.py, scripts/checks/_budget_recs.py,
    scripts/ci_rca/probe_health.py, scripts/preflight/ci_rca_gauges.py,
    scripts/executor/jsonl_store.py, scripts/executor/branch_lifecycle.py,
    scripts/ducklake_smoke/lambda_ops_gates.py. Do NOT sweep scripts/** wholesale -- an
    unbounded sweep risks collateral reds on unrelated "source": "..." dict keys.
  - >-
    docs/contracts/build-lambda.yaml is a Class D contract. check_amendment_log_for_class_d
    (scripts/checks/contracts/_population.py, dispatched from validate_contract_drift.py, a
    pre=True check) FAILS a top-level key change with no new amendment_log[] entry. Adding the
    deploy_record stanza therefore also requires an amendment_log entry in the same edit.
  - >-
    Do NOT add convergence-health to ci-rca.yml's workflow_run filter. config/ci_rca_taxonomy.yaml
    marks it ci_rca:excluded because a standing environmental red would mint a critical rec per
    push -- a rec storm plus a planning-queue wedge. Decision 62's alarm-not-gate monitor lane is
    the sanctioned treatment.
  - >-
    Do NOT add a live-state or network probe to scripts/validate.py. It validates the working tree
    deterministically; sensor run-health is runtime state. A probe there would be non-deterministic
    in the fast tier (Decision 153 budget) and would red CI itself -- a required check -- turning a
    deliberately non-wedging alarm into a merge blocker (Decision 83 non-wedging).
  - >-
    Decision 128: the test-module SLOC crossing is resolved by decomposition, never by a
    config/sloc_budgets.yaml raise and never by a --update-sloc-budgets re-seed.
  - >-
    The reachability oracle requires full git history. convergence-health.yml already checks out
    with fetch-depth 0; do not reduce it. Guard the shallow case explicitly so a future regression
    fails loud rather than silently reporting false drift.
  - >-
    PROD_SOURCE_PATHSPECS must stay in sync with deploy-prod-lambdas.yml's on.push.paths
    (rec-2686, single conceptual source). This plan changes the comparison, not the pathspecs.
  - Only files listed in Scope may be modified. Out-of-scope findings become recs, not inline fixes.
context:
  - >-
    "Decision-scout verdict + CITE list (verbatim decision ids): FLAGS_FOUND. CITE: Decision 66,
    Decision 61, Decision 55, Decision 169. Flagged and resolved in scope: Decision 170 (examined()
    + baseline shrink), Decision 103 (acceptance oracle re-expressed), Decision 73 (pre=True fast
    tier), Decision 86 (deploy_record contract stanza). RELATED: Decision 84, Decision 131,
    Decision 79, Decision 48, Decision 155, Decision 166, Decision 125, Decision 126. Additional
    decisions surfaced by plan-critique and honoured here: Decision 92 point 2 and Decision 144
    points 3 and 7 (convergence single-writer set / anti-spoofing Deny), Decision 75 (frame
    challenge -- use the platform-native primitive), Decision 153 (fast-tier budget)."
  - "gates: decision-scout=FLAGS_FOUND; plan-critique=<verdict> after <N> round(s)"
  - >-
    Incident record. convergence-health failed on ~20 consecutive scheduled runs from 2026-08-17
    10:59Z, one notification email each. The convergence RECORD was green throughout -- only the
    sensor workflow was red -- which is why preflight reported convergence_health green.
  - >-
    Three compounding defects. (A) prod_code_drift was never registered, so file_rec raised and the
    step exited 1; latent since T2.43 because a no-drift tick never reaches the portal. (B) The
    freshness test compared GITHUB_SHA (HEAD at deploy time) for equality against the last
    source-touching commit; these coincide only for push-triggered deploys. (C) The registry guard
    scans only schedule.yaml and the portal files, so a producer module could ship an unregistered
    source undetected.
  - >-
    Defect A is not unique. Scanning the producer modules for this plan found a SECOND unregistered
    source, executor-hotfix at scripts/executor/branch_lifecycle.py:400, which would raise the
    identical error whenever a hotfix rec is filed -- dormant only because the executor is frozen
    (Decision 67). It is registered here because the widened guard would otherwise red this PR, and
    because it is the same defect. This is direct evidence that defect C, not defect A, is the
    load-bearing gap.
  - >-
    Why it fired when it did. The repository was renamed agent-platform -> theseus, which broke
    OIDC trust subjects and made the normal push-triggered apply/deploy path unavailable
    (corroborated by the 2026-08-15 OIDC outage cited in scripts/ci/convergence_advisory.py, the
    oidc-trust-contraction-closure and oidc-immutable-subject-recovery branches, and
    terraform-apply-sandbox push failures on 2026-08-15 followed by workflow_dispatch successes).
    Recovery therefore ran through workflow_dispatch, which stamped a HEAD sha unrelated to prod
    source (7fa00f2 at 10:37Z, then 149c36b at 15:09Z) and exposed defect B. Both recovery deploys
    ran IN GitHub Actions, not on the admin container -- a true break-glass local deploy sets no
    GITHUB_SHA and would have written source_git_sha null.
  - >-
    There is no real drift today. The deployed sha 149c36b postdates d024e63f, the latest
    prod-source commit, so the corrected oracle reports fresh and files nothing. Verification step
    11 is the live confirmation.
  - >-
    Liveness design, revised after plan-critique. The first draft proposed an S3 heartbeat under
    convergence/personal/, which is IAM-Denied to the sensor's own role and would have re-created
    the red it was meant to fix. The accepted design instead mirrors _check_ci_rca_liveness
    (scripts/preflight/ci_rca_signals.py:194-249), which already shells out to `gh run list` with a
    creds guard and degrade-to-None handling -- the platform-native "did workflow X last succeed"
    primitive, in the very file being edited. This removes the workflow edit, the record.py
    helpers, and the entire IAM exposure, taking scope from 14 files to 12.
  - >-
    Verification tier note. No scope file appears in any src/lambdas/*/manifest.yaml, so Decision
    79's manifest-derived V3 trigger does not fire and the deterministic tier is V2. V3 is a
    voluntary over-declaration because the only honest proof that the red is fixed is a live sensor
    run and a live portal read. Steps 10-12 are that proof; there is no Lambda build/deploy/smoke
    obligation and none is missing.
  - >-
    Follow-on filed as rec-3189: the convergence record is written only by the
    write-convergence-record composite action, so an operator-run admin-container terraform apply
    writes nothing and the record silently retains the last CI value. The preferred fix is an
