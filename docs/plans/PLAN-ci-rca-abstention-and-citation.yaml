schema_version: 3
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: ci-rca-abstention-and-citation
intent: >-
  Stop discarding two signals the CI-RCA agent already emits: a self-declared low confidence that
  reaches no review surface, and a citation to a workflow file that can never match the citation
  pattern. Then correct rec-2923's filed narrative, which is currently being offered to a human as
  ready to close.
plan_type: IMPLEMENTATION
verification_tier: V2
plan_path: docs/plans/PLAN-ci-rca-abstention-and-citation.yaml
phase: >-
  Ad hoc CI-RCA quality remediation behind rec-2923; the independent half, split from
  PLAN-ci-rca-evidence-scope-declaration on the zero-shared-files seam.
scope:
- file: scripts/ops_portal/ci_rca_schema.py
  action: Modify
  purpose: >-
    _WHY_CHAIN_CITATION_RE (line 38) is `[\w./-]+\.(py|yaml|tf|md|sh):\d+` - it accepts `yaml` but not
    `yml`, so no citation to any GitHub workflow or action file in this repo can ever match. Add `yml`
    to the alternation. Loosening-only: the pattern has exactly two consumers, `_gap_has_file_citation`
    (line 78) and `_validate_terminus` (line 152), both positive presence checks.
- file: scripts/preflight/ci_rca_signals.py
  action: Modify
  purpose: >-
    _derive_ci_rca_undetermined_open filters the abstention surface on `rca_confidence ==
    "undetermined"` at line 61 - the single predicate. The enum is high|medium|low|undetermined, so a
    `low` rec reaches no review surface. Widen to {low, undetermined}. FIVE sites in total: the
    predicate (61), two docstrings (45, 96), the printed section title (104), and the overflow label at
    118 ("showing 5 of N open undetermined recs"), which test_print_ci_rca_undetermined_recs_overflow
    asserts on. Preserve the substrings "CI-RCA Abstention Review" and "Decision 73 L5".
- file: scripts/ci_rca/probe_health.py
  action: Modify
  purpose: >-
    Three sites, not one. The gauge predicate at line 109 counts `undetermined` only and drives
    escalate()'s auto-filed rec at rate >= 0.3; widen it to match the surface. Then _build_context
    (147-159) and _build_rec_fields (162-179) must move with it - left alone the auto-filed rec asserts
    "the CI-RCA evidence probe abstained (rca_confidence=undetermined) on n/m" about recs where the
    probe did not abstain, and points remediation at scripts/ci_rca/evidence.py. That is rec-2923's own
    defect class, manufactured by the fix for rec-2923.
- file: scripts/preflight/ci_rca_gauges.py
  action: Modify
  purpose: >-
    _compute_ci_rca_abstention keys the dict `undetermined_count` (line 25) and
    print_ci_rca_abstention_gauge prints "N/M undetermined (X%)" (line 66). Both become false once the
    counted set is {low, undetermined}. Rename the key and the label to something set-accurate so the
    widening does not relocate the one-word-two-sets defect from predicate-vs-predicate to
    predicate-vs-label.
- file: scripts/ops_portal/ci_rca_lifecycle.py
  action: Modify
  purpose: >-
    Add a `correct_rec_context(rec_id, updates, profile=None)` helper beside stamp_fixed_by_sha (line
    215), which already implements the identical _fetch_rec_from_reader -> mutate -> update_rec shape.
    It must refuse to write unless the READ blob carries a fingerprint, apply the caller's field
    updates to the parsed context, assert _validate_ci_rca_context_v2 returns [] on the merged result,
    and write the WHOLE blob back. This is the tested home for the rec-2923 correction; an inline
    heredoc in a VP step would be an untested production mutation, and a one-shot under scripts/ would
    face the 100 percent changed-file coverage gate for code that runs once.
- file: docs/contracts/ci-rca-lifecycle.yaml
  action: Modify
  purpose: >-
    Record that the abstention surface and gauge both mean {low, undetermined}, that this is advisory
    visibility rather than a gating change, the benign back_validate_ci_rca reclassification the
    citation fix causes, and a `procedure:` note for the one-shot rec-context correction alongside the
    existing closure_dependency.manual_route.
- file: tests/ops_data_portal/test_ci_rca_schema.py
  action: Modify
  purpose: >-
    Add TestCitationPatternExtensions - a differential fixture asserting the PRE-fix pattern rejects
    `.github/workflows/ci.yml:12` and the post-fix pattern accepts it, plus a guard that every
    previously-accepted extension still matches.
- file: tests/session/preflight/test_ci_rca_signals.py
  action: Modify
  purpose: >-
    Add TestAbstentionSurfaceConfidenceMatrix - low surfaces, undetermined still surfaces, high and
    medium do not, absent rca_confidence does not; the retitled section keeps both asserted substrings;
    the overflow label at line 118 matches the widened wording.
- file: tests/test_ci_rca_probe_health.py
  action: Modify
  purpose: >-
    Add TestAbstentionGaugeWidened - a low-confidence row counts toward the rate, and the auto-filed
    rec's context and title describe the widened set rather than claiming probe abstention.
- file: tests/session/preflight/test_ci_rca_gauges.py
  action: Modify
  purpose: Add TestAbstentionLabelAccuracy - the emitted key and printed label name the widened set.
- file: tests/test_ci_rca_lifecycle.py
  action: Modify
  purpose: >-
    Add TestCorrectRecContext - the helper writes the whole blob, refuses on a fingerprint-less read,
    refuses when the merged context fails validation, and preserves sibling keys.
- file: config/agent/verification_registry/registry.yaml
  action: Modify
  purpose: Graduate the five counterfactuals named in the VP as standing regression guards.
bundled_recommendations: []
infrastructure_dependencies: []
acceptance_criteria:
- >-
  AC1 - _WHY_CHAIN_CITATION_RE accepts `yml` as well as `yaml`, and the change is differential: a
  fixture citing `.github/workflows/ci.yml:12` is REJECTED by the pre-fix pattern and ACCEPTED after,
  while `.yaml`, `.py`, `.tf`, `.md` and `.sh` citations still match.
- >-
  AC2 - The change is loosening-only and cannot newly reject a historical rec: both consumers are
  positive `.search()` presence checks, so widening the alternation strictly increases the match set.
  This is established by AC1's differential fixture, not by a grep for the absence of a negative
  fixture - such a grep is tautological and would be rejected by Decision 132's VF-06 differential
  admission gate.
- >-
  AC3 - A rec with rca_confidence=`low` is returned by the abstention derivation and printed;
  `undetermined` still is; `high`, `medium` and an absent value are not. All five sites move together -
  predicate (61), docstrings (45, 96), section title (104), overflow label (118) - and the title still
  contains "CI-RCA Abstention Review" and "Decision 73 L5".
- >-
  AC4 - The gauge in probe_health.py counts the same set as the surface, AND its emitted prose moves
  with it: _build_context and _build_rec_fields no longer assert the probe "abstained" on recs it
  classified, and no longer point remediation at scripts/ci_rca/evidence.py for a
  self-rated-low-confidence population.
- >-
  AC5 - scripts/preflight/ci_rca_gauges.py's dict key and printed label name the widened set. After
  the change no emitted string in the abstention path says "undetermined" while counting {low,
  undetermined}.
- >-
  AC6 - The benefit is stated accurately as a counterweight to a premature-closure prompt, NOT as a
  gating change and NOT as mere extra visibility. print_ci_rca_recs splits open ci_rca recs into
  [SOFT -- LIKELY RESOLVED] and [HARD BLOCK] (ci_rca_signals.py:324-349) and preflight.py:306 always
  supplies the correlation. rec-2923's `file` is .github/actions/subagent-plan-review/action.yml,
  which commit 0726593 (PR #812) modified, so it currently prints under SOFT with a ready-made
  `--status closed --resolution "Verified resolved by main commit"` command. A Critical rec whose
  stated cause is factually wrong is being offered for closure; the abstention entry is what
  contradicts that offer.
- >-
  AC7 - Blast radius is quantified on BOTH surfaces. Surface: exactly one open ci_rca rec exists today
  (rec-2923, at `low`), so it gains one entry. Gauge: the trailing-14-day rate moves from 0/19 = 0.00
  to 4/19 = 0.21 against the 0.3 auto-file threshold and a min_sample of 5 - no auto-file today, with
  roughly two `low` recs of margin. Steady state, the last 20 ci_rca recs split 11 high / 4 medium / 5
  low with the field set on all 20.
- >-
  AC8 - rec-2923's correction covers EVERY field in context_v2_json that carries the false narrative,
  not just why_chain: `proximate_cause` (asserts the retry returned STARVED), `why_chain`,
  `detection_gap.gap_explanation` (asserts starvation was the intended fail-closed exit),
  `corrective_action` and `preventive_action` (both point at the dead `case *)` at action.yml:86-89).
  Correcting why_chain alone would leave a Critical rec whose why_chain contradicts its own
  proximate_cause two keys away - a new factual inconsistency introduced by a plan whose premise is
  correcting factual wrongness.
- >-
  AC9 - The top-level `context` COLUMN is deliberately left uncorrected and the reason is recorded: it
  is in _UPDATE_CONTENT_VALIDATED_FIELDS (ops_data_portal.py:422) and would trip the Decision 66
  write-time content gate, which is a separate concern from the context_v2_json narrative fields. The
  contract records that the column still carries the superseded summary.
- >-
  AC10 - The correction preserves the rest of the blob. update_rec does `merged = {**existing,
  **updates}` - a record-level shallow merge - so a partial context_v2_json would replace the whole
  column. `fingerprint` and `evidence_bundle_ref` survival are both ASSERTED, not assumed.
  (`occurrence_count` is not present in rec-2923's blob and is not claimed.)
- >-
  AC11 - rec-2923 remains OPEN. ci-rca-lifecycle.yaml's bump_rule forbids mutating a closed head, so
  the correction must land while it is open; closure belongs to the plan that fixes the reviewer path.
- >-
  AC12 - The correction is run through the tested `correct_rec_context` helper, not an inline heredoc,
  so the read-mutate-write logic is covered and the pre-write validation guard is itself under test.
- >-
  AC13 - Every changed Python source line is covered under the changed-file 100 percent coverage gate,
  and literal `bin/venv-python -m scripts.validate --pre` and `bin/venv-python -m scripts.validate`
  both exit zero before PR readiness.
verification_plan:
- step: 1
  phase: pre-deploy
  action: >-
    Prove the citation widening differentially - the pre-fix pattern must REJECT a yml citation that
    the post-fix pattern accepts, with no previously-accepted extension lost.
  command: bin/venv-python -m pytest tests/ops_data_portal/test_ci_rca_schema.py::TestCitationPatternExtensions
  expected: >-
    The pre-fix pattern rejects `.github/workflows/ci.yml:12`; the post-fix pattern accepts it;
    `.yaml`, `.py`, `.tf`, `.md` and `.sh` citations all still match.
  fix_if: >-
    If the yml case still fails, the alternation was extended in the wrong group. If a previously-
    accepted extension now fails, the pattern was rewritten rather than widened - this is
    loosening-only. Do NOT replace this with a grep for the absence of a negative fixture; that is
    tautological and Decision 132's VF-06 differential would reject the resulting registry row.
  hermetic: true
  graduation: graduate
  graduation_check_id: ci-rca-citation-accepts-yml
- step: 2
  phase: pre-deploy
  action: Prove the abstention surface admits low and still excludes high, medium and absent.
  command: bin/venv-python -m pytest tests/session/preflight/test_ci_rca_signals.py::TestAbstentionSurfaceConfidenceMatrix
  expected: >-
    A `low` fixture surfaces; `undetermined` still does; `high`, `medium` and a rec with no
    rca_confidence do not. The retitled section retains "CI-RCA Abstention Review" and "Decision 73
    L5", and the overflow label matches the widened wording.
  fix_if: >-
    Line 61 is the ONLY predicate; 45 and 96 are docstrings, 104 is the title and 118 is the overflow
    label. If test_print_ci_rca_undetermined_recs_overflow fails, site 118 was missed. If the advisory-
    wording test fails, the retitle dropped an asserted substring.
  hermetic: true
  graduation: graduate
  graduation_check_id: ci-rca-abstention-surface-admits-low
- step: 3
  phase: pre-deploy
  action: Prove the gauge counts the widened set and its auto-filed rec describes that set truthfully.
  command: bin/venv-python -m pytest tests/test_ci_rca_probe_health.py::TestAbstentionGaugeWidened
  expected: >-
    A low-confidence row contributes to the count and rate. The auto-filed rec's context and title no
    longer claim the probe abstained, and no longer name scripts/ci_rca/evidence.py as the remediation
    target for a self-rated-low population.
  fix_if: >-
    If only line 109 moved, _build_context (147-159) and _build_rec_fields (162-179) still describe the
    old set - the widened gauge would then file a rec that is itself factually wrong.
  hermetic: true
  graduation: graduate
  graduation_check_id: ci-rca-abstention-gauge-widened-truthfully
- step: 4
  phase: pre-deploy
  action: Prove no emitted string still labels the widened set "undetermined".
  command: bin/venv-python -m pytest tests/session/preflight/test_ci_rca_gauges.py::TestAbstentionLabelAccuracy
  expected: The gauge dict key and the printed label both name the widened set.
  fix_if: A surviving "undetermined" label means the predicate moved but the prose did not - the same one-word-two-sets defect, relocated.
  hermetic: true
  graduation: graduate
  graduation_check_id: ci-rca-abstention-label-matches-set
- step: 5
  phase: pre-deploy
  action: Prove the correction helper is safe before pointing it at production data.
  command: bin/venv-python -m pytest tests/test_ci_rca_lifecycle.py::TestCorrectRecContext
  expected: >-
    The helper writes the whole blob and preserves sibling keys; refuses when the READ blob has no
    fingerprint; refuses when the merged context fails _validate_ci_rca_context_v2; and never issues a
    write on either refusal path.
  fix_if: >-
    If a refusal path still writes, the validation runs after update_rec rather than before. If sibling
    keys are lost, the helper is replacing rather than merging into the parsed context.
  hermetic: true
  graduation: graduate
  graduation_check_id: ci-rca-correct-rec-context-refuses-unsafe-writes
- step: 6
  phase: pre-deploy
  action: >-
    Correct every false-narrative field in rec-2923's context_v2_json while the rec remains open. Runs
    AFTER step 1 - the corrected blob cannot pass validation until the yml fix lands, because
    detection_gap.gap_explanation cites action.yml:36.
  command: |
    bin/venv-python - <<'PY'
    import json
    from scripts.ops_portal.ci_rca_lifecycle import correct_rec_context
    from scripts.ops_data_portal import _fetch_rec_from_reader
    correct_rec_context("rec-2923", {
        "proximate_cause": (
            "Step 15 of run 30615075007 exited 1 because review_verdict.py classified review.json as "
            "STARVED and exited 1 by contract, which under GitHub's inherited errexit aborted the "
            "composite step body at the classifier call -- before the retry or the case block ran."
        ),
        "why_chain": [
            "review_verdict.py classified review.json as STARVED and exited 1 by contract, which "
            "under the inherited errexit aborted the composite step body at the classifier call.",
            "The same-budget retry never executed and the case block never ran, so outputs.outcome "
            "was never written -- the job log shows REVIEW_OUTCOME empty at the record-write step.",
            "The always-run record writer missed its starved carve-out on the empty value and wrote "
            "status=red at 3ae1863 for a run whose terraform apply step was skipped.",
            "GitHub runs composite bash bodies with -e and the body's own `set -uo pipefail` does not "
            "clear it, so the T2.39 c2 retry and c3 anti-masking carve-out were dead code from the "
            "day they landed until PR #812 -- a gate whose contract was unit-tested but never driven "
            "under the harness invocation it runs in "
            "(.github/actions/subagent-plan-review/review.sh:30).",
        ],
        "corrective_action": (
            "None required at the reviewer: PR #812 fixed the inherited-errexit defect via review.sh. "
            "Verify the next terraform-apply-sandbox run reaches a PROCEED or an explicit starved "
            "outcome rather than an empty one, and confirm the convergence record is not falsely red."
        ),
        "preventive_action": (
            "Guard the class rather than the line: a composite `shell: bash` step body must not carry "
            "non-trivial logic under GitHub's inherited `bash --noprofile --norc -e -o pipefail`, and "
            "its contract must be driven under that exact invocation in test. The STARVED branch this "
            "rec originally cited (action.yml:86-89) was itself dead code and never executed."
        ),
    })
    ctx = json.loads(_fetch_rec_from_reader("rec-2923")["context_v2_json"])
    assert ctx.get("fingerprint"), "fingerprint did not survive"
    assert ctx.get("evidence_bundle_ref"), "evidence_bundle_ref did not survive"
    assert "never executed" in " ".join(ctx["why_chain"])
    assert "STARVED, so the composite" not in ctx["proximate_cause"]
    print("OK", ctx["fingerprint"][:12])
    PY
  expected: >-
    Exits 0 printing OK and a fingerprint prefix. rec-2923 stays open; fingerprint and
    evidence_bundle_ref survive; no context_v2_json field still asserts the retry ran or that no red
    record was latched.
  fix_if: >-
    If validation fails inside the helper, step 1 has not landed - gap_explanation still cites
    action.yml:36. If a survival assertion fails, the helper replaced rather than merged; investigate
    rather than retrying. On portal auth failure confirm with `aws sts get-caller-identity --profile
    agent_platform` - there is no offline outbox (Decision 84 I-4).
  hermetic: false
  graduation: waive
  graduation_waiver_reason: >-
    A one-shot mutation of a specific production row. It is not repeatable - a second run is a no-op
    against already-corrected data - so it cannot serve as a standing regression check. The helper's
    safety properties ARE graduated, at step 5.
- step: 7
  phase: pre-deploy
  action: Run focused lint and the fast presubmit before commit, then rerun after the feat commit exists.
  command: >-
    bin/venv-python -m ruff check scripts/ops_portal/ scripts/preflight/ scripts/ci_rca/probe_health.py
    && bin/venv-python -m scripts.validate --pre
  expected: Ruff and the complete fast validator exit zero on both the working and committed trees.
  fix_if: Stop and repair; never report constituent passes as gate success.
  hermetic: false
  graduation: waive
  graduation_waiver_reason: Aggregate lint plus presubmit is an orchestration gate, not one registry node.
- step: 8
  phase: pre-deploy
  action: Run literal full validation before commit and again after the feat commit.
  command: bin/venv-python -m scripts.validate
  expected: Exit zero, including 100 percent changed-source coverage, full pytest, workflow guards, plan replay, registry, pre-commit.
  fix_if: Stop before push or PR and add behavior-relevant tests; do not waive coverage or lower thresholds.
  hermetic: false
  graduation: waive
  graduation_waiver_reason: The full repository validator is not one stable registry node.
constraints:
- >-
  The citation change is LOOSENING-ONLY. Widen the alternation; do not rewrite the pattern and do not
  touch either consumer's presence-check semantics.
- >-
  Every graduated registry row must be DIFFERENTIAL - it must fail on origin/main and pass on HEAD.
  Decision 132's VF-06 gate (verification_graduation.run_differential) rejects any row whose check
  passes identically on both, so a "grep finds no counterexample" row is inadmissible by construction.
- >-
  Widen predicate AND prose together. Five sites in ci_rca_signals.py (61, 45, 96, 104, 118), three in
  probe_health.py (109, 147-159, 162-179), two in ci_rca_gauges.py (25, 66). Moving a predicate without
  its labels relocates the defect instead of fixing it.
- >-
  Do NOT change the /plan gate. print_ci_rca_recs' SOFT/HARD split is untouched; this plan changes an
  advisory surface only.
- >-
  All recommendation writes transit the ops portal (Decision 84), through the tested helper. Nothing
  edits logs/.recommendations-log.jsonl.
- >-
  rec-2923 must remain OPEN - bump_rule forbids mutating a closed head, and closure belongs to the
  plan that fixes the reviewer path.
- No rescue agents or workaround loops (Decision 55).
context:
- >-
  "Decision-scout verdict + CITE list (verbatim decision ids): FLAGS_FOUND (2 rounds, run against the
  pre-split parent plan; this plan is a strict subset of that scope plus label-consistency files, and
  introduces no new architectural surface). CITE: Decision 55, Decision 66, Decision 73, Decision 84,
  Decision 132, Decision 142."
- >-
  "gates: decision-scout=FLAGS_FOUND after 2 round(s) on the parent; plan-critique=REVISE after 1
  round(s) on this plan, round 2 pending re-dispatch against this revision"
- >-
  Split rationale: this plan and PLAN-ci-rca-evidence-scope-declaration share ZERO source files. The
  parent had accreted to 19 files gated behind a rebase on GAL-03, a five-pin-site schema version bump
  and a new envelope field threaded through three modules. These changes need none of that. THREE
  files are shared with the sibling, not one: (i) scripts/ops_portal/ci_rca_schema.py - line 38 here,
  new model fields after line 127 there, non-adjacent and trivial; (ii)
  config/agent/verification_registry/registry.yaml - additive rows, also shared with GAL-03; and
  (iii) docs/contracts/ci-rca-lifecycle.yaml - BOTH plans extend a 206-line contract, which is the
  real conflict surface and must be merged by hand rather than resolved mechanically. Whichever plan
  lands second rebases and reconciles the contract edit.
- >-
  CORRECTED PREMISE, recorded because two earlier drafts of this plan got it wrong in opposite
  directions. rec-2923 is NOT hard-blocking /plan. print_ci_rca_recs splits open ci_rca recs into
  [SOFT -- LIKELY RESOLVED] and [HARD BLOCK] (ci_rca_signals.py:324-349), preflight.py:306 always
  passes the correlation, and the correlation matches on "a recent main commit modified the rec's file
  field" - rec-2923's file is .github/actions/subagent-plan-review/action.yml and commit 0726593 (PR
  #812) modified exactly that path. The session preflight confirms it: ci_rca_unresolved_recs is empty
  and ci_rca_likely_resolved_recs contains rec-2923. So the preflight is printing a ready-made close
  command for a Critical rec whose stated cause is false. That is the real justification for this
  plan - not "visibility", and not "it already hard-blocks".
- >-
  Origin: rec-2923 filed a factually wrong narrative for run 30615075007 - it asserted a same-budget
  retry ran and starved, and that apply was blocked WITHOUT latching the convergence record red.
  Neither is true. PR #812 (rec-2924) established that inherited errexit aborted the composite step at
  the first classifier call, so the retry never ran, `outcome` was never written, the job log shows
  REVIEW_OUTCOME empty at the record-write step, and that step then wrote status=red for a run in
  which terraform apply was skipped.
- >-
  Why the citation bug matters rather than being cosmetic: rec-2923 carries warn_mode_reject
  {reasons: [schema_deficiency], mode_at_write: warn}, and the deficiency is exactly the missing
  file:line citation - its terminus cites action.yml:86-89 and its gap_explanation cites action.yml:36,
  and neither counts because the pattern accepts `yaml` but not `yml`. Every GitHub workflow and action
  file in this repo is `.yml`, so the citation requirement is unsatisfiable for the entire class of
  failures originating in CI configuration. rec-2928 tracks converging the extensions repo-wide; this
  plan fixes the regex, which is the immediate bug.
- >-
  Sharper edge, recorded because it shapes the follow-on: the source location rec-2923 cited as its
  systemic cause, action.yml:86-89, is the STARVED branch PR #812 later proved was dead code that never
  executed. The citation hook points at SOURCE, not evidence, so it rewards reasoning from source - the
  behaviour that produced the defect. Fixing the yml gap is a bug fix, not an endorsement of that
  shape; the typed-epistemic-anchoring follow-on named in the sibling plan addresses it.
- >-
  Why the abstention hole matters: ci_rca_signals.py filtered on `undetermined` alone while the enum is
  high|medium|low|undetermined. Across the last 20 ci_rca recs the split is 11 high / 4 medium / 5 low
  with the field set on all 20 - about a quarter of recent RCA output declares itself not-sound and
  none of it was surfaced. The 86 recs with no rca_confidence at all are legacy from before the field
  existed, not a live gap.
- >-
  Verified schema dependency of the correction text: rec-2923 carries schema_version 2, whose
  why_chain ceiling is 400 chars (ci_rca_schema.py:136-137); the longest replacement entry is 355. Under
  schema_version 1 the ceiling is 250 and it would fail. The helper's pre-write validation catches this
  rather than leaving it to inspection.
- >-
  Benign second-order effect of the citation fix: back_validate_ci_rca recomputes against the CURRENT
  schema, so rec-2923 reclassifies non_conformant -> conformant once the pattern accepts yml. Benign
  schema-wise, but note it would certify the OLD narrative as conformant if step 6 were skipped - which
  is why the correction is in this plan rather than deferred.
- >-
  bundled_recommendations is deliberately EMPTY. Listing rec-2923 would emit a `Resolves:` trailer,
  fire rec-autoclose.yml, and stamp fixed_by_sha to a commit that does not fix the reviewer path -
  which under ci-rca-lifecycle.yaml's regression_vs_drop ancestry check either drops real recurrences
  or manufactures a spurious Critical REGRESSION. A reasoned 12k exception, discharged by step 6
  correcting the rec in place while it stays open.
- >-
  SLOC headroom is comfortable: ci_rca_schema.py 272 SLOC, ci_rca_signals.py 293, probe_health.py 211,
  ci_rca_lifecycle.py 311, all unregistered against the 500 default. If any crossed, decompose
  (Decision 128) rather than raise.
pre_implementation_checklist:
- Branch confirmed not on main
- docs/PROJECT_CONTEXT.md read
- DECISIONS.md read
- All files in scope located and readable
- VP step 6 runs only AFTER step 1 has landed in the working tree
- Acceptance criteria understood and verifiable
execution_steps:
- >-
  scripts/ops_portal/ci_rca_schema.py - add `yml` to _WHY_CHAIN_CITATION_RE's alternation (line 38).
