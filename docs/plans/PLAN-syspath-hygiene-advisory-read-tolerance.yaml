schema_version: 2
slug: "syspath-hygiene-advisory-read-tolerance"
intent: >-
  Clear the red main tip by making a sys.path-dependent test robust, remove the repo-wide ambient
  duplicate-path pollution that broke it, and stop a transient warehouse-read blip on the DCG-03
  orphan guard from failing an ops job that did all of its real work correctly -- so post-merge
  failures are attributed to the thing that actually failed.
plan_type: IMPLEMENTATION
verification_tier: V2
plan_path: docs/plans/PLAN-syspath-hygiene-advisory-read-tolerance.yaml
phase: >-
  Phase Platform -- CI-RCA remediation lane (Decision 72 RCA-as-plan-source). Not a tier_item;
  intent falls under the ci_rca soft-warn exception category, so the Tier Item Freshness Gate is
  skipped by construction.

scope:
  - file: tests/test_build_lambda_config.py
    action: Modify
    purpose: >-
      Fix test_sys_path_injection_when_root_absent (rec-2876). The setup calls
      sys.path.remove(root_str) exactly once, but list.remove() drops only the FIRST occurrence,
      so with N ambient copies of the repo root the following `assert root_str not in sys.path`
      fires. Drain EVERY copy (`while root_str in sys.path: sys.path.remove(root_str)`), save the
      original occurrence COUNT, and restore exactly that many copies in the finally block. The
      existing finally restores at most one copy, which is also wrong under N>1 and is corrected
      by the same change. This is the load-bearing fix that unreds main.
  - file: tests/test_ci_rca_taxonomy.py
    action: Modify
    purpose: >-
      Guard the unconditional module-scope `sys.path.insert(0, str(ROOT))` behind
      `if str(ROOT) not in sys.path:`, matching the already-correct pattern at
      tests/test_agent_telemetry_writer.py:13. Unguarded, it appends a duplicate repo-root entry
      every time the module body executes.
  - file: tests/test_ci_rca_vacuous_pass.py
    action: Modify
    purpose: Same guard as tests/test_ci_rca_taxonomy.py -- removes one duplicate-path producer.
  - file: tests/test_ci_claude_p_retry.py
    action: Modify
    purpose: Same guard as tests/test_ci_rca_taxonomy.py -- removes one duplicate-path producer.
  - file: tests/test_ci_rca_tier_map.py
    action: Modify
    purpose: Same guard as tests/test_ci_rca_taxonomy.py -- removes one duplicate-path producer.
  - file: tests/test_verification_checks.py
    action: Modify
    purpose: >-
      Same guard, applied to the inline `sys.path.insert(0, str(Path(__file__).parent.parent))`
      form (this file has no ROOT local; bind one or guard the expression directly).
  - file: tests/test_ci_rca_evidence_ast.py
    action: Modify
    purpose: Same guard as tests/test_ci_rca_taxonomy.py -- removes one duplicate-path producer.
  - file: scripts/session/postflight.py
    action: Modify
    purpose: >-
      Guard the unconditional module-scope `sys.path.insert(0, str(Path(__file__).resolve()
      .parent.parent.parent))` at line 46. Added after plan-critique round 1 measured that the
      pollution is NOT confined to tests/: a pytest run collecting none of the six tests/ modules
      still accumulated 5 repo-root copies, sourced from this file and the two below.
      compute_affected_artifacts returns {} for all three, so no tier escalation and no deploy leg.
  - file: scripts/roadmap/plan_audit.py
    action: Modify
    purpose: Guard the unconditional module-scope `sys.path.insert(0, str(ROOT))` at line 30.
  - file: scripts/agent_development/run_skill.py
    action: Modify
    purpose: Guard the unconditional module-scope `sys.path.insert(0, str(ROOT))` at line 30.
  - file: tests/test_syspath_hygiene.py
    action: Create
    purpose: >-
      Behavioural regression guard proving the guards actually work, not merely that the source
      looks different. Asserts that re-executing each of the nine guarded module bodies adds ZERO
      additional copies of the repo root to sys.path. Measured baseline at plan time: importing
      the six tests/ modules alone takes the count from 1 to 7 (adds exactly 6). This is the only
      check that distinguishes a correct guard from a bare re-indent of the same unguarded insert,
      which the grep-shaped step 2 alone cannot catch.
  - file: scripts/ops_portal/reader_transient.py
    action: Create
    purpose: >-
      Sole home for `is_reader_unavailable(exc) -> bool`, the deterministic classifier for a
      transient DuckLake reader outage: requests.ConnectionError/Timeout, or a RuntimeError whose
      message matches the reader's transient status set with NO structured `error_type` marker (a
      structured handler error, or any 4xx, is NOT transient and still gates). Extracted verbatim
      in behaviour from the already-landed private copy at scripts/data_quality_execute.py:76.
      Its docstring states plainly that a 502 indicates transient unavailability and is NOT
      reliably a cold-resume signal -- the framing this incident disproved. Homed in
      scripts/ops_portal/ beside its writer-side counterpart writer_transport.py; deliberately NOT
      in src/, because the two active manifests that wildcard-include `src/` (data-pipeline,
      ops-compaction; seven manifests are active in total) would package any new src/ file and
      escalate this plan to V3 with two production Lambda build/deploy/smoke-test legs for a
      pure-logic helper.
  - file: scripts/data_quality_execute.py
    action: Modify
    purpose: >-
      Import is_reader_unavailable from scripts.ops_portal.reader_transient and delete the local
      _is_reader_unavailable and _TRANSIENT_HTTP_RE definitions. Behaviour must be unchanged; this
      is a de-duplication so the transient semantics cannot drift between the two consumers.
  - file: scripts/ops_portal/decisions.py
    action: Modify
    purpose: >-
      Make the DCG-03 orphan guard tolerant of transient reader unavailability.
      _assert_no_orphaned_current_rows currently lets any RuntimeError from
      active_reader.current_state("ops_decisions") propagate as a fatal invariant violation.
      Wrap ONLY that read: when is_reader_unavailable(exc) is true, emit a distinct, greppable
      marker, mirror it to GITHUB_STEP_SUMMARY when that env var is set, and return without
      running the orphan comparison. Every other exception re-raises unchanged (fail-closed), and
      a genuine orphan still raises exactly as today. The guard's inputs (_orphaned_current_ids,
      _load_orphan_baseline, orphan_baseline.yaml) and its raise-on-genuine-orphan path are
      untouched, and the read stays on the Decision 84 I-3 closed named-verb boundary -- no
      fallback read path, no caller SQL, no new Lambda verb.
  - file: tests/ops_data_portal/test_reader_transient.py
    action: Create
    purpose: >-
      Cover is_reader_unavailable: each member of the reader's transient set classifies transient;
      a transient-status message that ALSO carries an error_type marker does NOT; a 4xx does NOT;
      a non-RuntimeError does NOT; requests.ConnectionError/Timeout DO (guarded so the test
      degrades cleanly where requests is absent -- requirements-fast.txt does not ship it). Also
      carries the derive-the-set equality test (Decision 143 pattern, as Decision 154 used for
      DUCKLAKE_ARTIFACT_NAMES): the classifier accepts exactly
      src.common.iceberg_reader._READER_TRANSIENT_STATUS and rejects its complement, so the
      authority and the classifier cannot drift. Reading src/ is not modifying it, so this adds no
      Lambda artifact and no tier escalation.
  - file: tests/ops_data_portal/test_decisions_divergence_guard.py
    action: Modify
    purpose: >-
      Add branch coverage for the new tolerance via the existing injectable fake-reader seam:
      (a) a reader raising a transient RuntimeError makes _assert_no_orphaned_current_rows return
      without raising AND emit the named marker; (b) a reader raising a non-transient RuntimeError
      still raises; (c) a reader returning a genuine NEW orphan still raises the DCG-03 error.
      Assert on the marker text so the corrected framing (transient unavailability, NOT an
      asserted cold-resume) cannot silently regress.

bundled_recommendations:
  - rec-2876

closes_criteria: []

infrastructure_dependencies: []

acceptance_criteria:
  - >-
    test_sys_path_injection_when_root_absent passes when collected alongside every
    sys.path-inserting test module in one worker -- the exact condition that failed CI run
    30223119628 on main tip f550d15.
  - >-
    Zero unguarded module-scope sys.path.insert calls remain anywhere under tests/, scripts/ or
    src/ (measured baseline at plan time: 9 -- six under tests/, three under scripts/).
  - >-
    Re-executing each of the nine guarded module bodies adds zero additional repo-root copies to
    sys.path (measured baseline: the six tests/ modules alone add 6, taking the count 1 -> 7).
  - >-
    The transient-classifier function has exactly one definition, located in
    scripts/ops_portal/reader_transient.py, and its accepted status set is asserted equal to
    src.common.iceberg_reader._READER_TRANSIENT_STATUS rather than restated.
  - >-
    A transient reader outage during the DCG-03 orphan guard produces a named marker and a normal
    return; a non-transient reader error and a genuine NEW orphan both still raise.
  - >-
    scripts/data_quality_execute.py behaviour is unchanged by the extraction (its existing test
    file passes untouched).
  - >-
    No Lambda artifact is affected by this scope, so no build/deploy/smoke-test leg is required
    (compute_affected_artifacts returns {}).

verification_plan:
  - step: 1
    phase: pre-deploy
    action: >-
      Reproduce the exact CI failure condition and prove it is fixed -- collect the six
      sys.path-inserting test modules together with the target test in one worker.
    command: >-
      bin/venv-python -m pytest tests/test_ci_rca_taxonomy.py tests/test_ci_rca_vacuous_pass.py
      tests/test_ci_claude_p_retry.py tests/test_ci_rca_tier_map.py tests/test_verification_checks.py
      tests/test_ci_rca_evidence_ast.py
      "tests/test_build_lambda_config.py::TestGetLambdaFilePatterns::test_sys_path_injection_when_root_absent"
      --randomly-seed=12345 -q
    expected: >-
      All collected tests pass. Before the fix this exact command fails with
      "AssertionError: assert '/home/user/agent-platform' not in [...]" (verified at plan time).
    fix_if: >-
      Still failing means the drain loop is absent or the finally block restored the wrong count;
      a failure inside one of the six guarded modules means a guard was applied incorrectly and
      broke that module's own import resolution.
    hermetic: true
    graduation: graduate
    graduation_check_id: "syspath-injection-test-under-polluted-path"
  - step: 2
    phase: pre-deploy
    action: >-
      Prove the duplicate-path producer class is gone repo-wide -- no module-scope (column-0)
      sys.path.insert remains under tests/, scripts/ or src/. Exit-code-bearing via grep negation,
      so a surviving producer fails the step (plan-critique round 1, R2).
    command: '! grep -rEn "^sys\.path\.insert" tests/ scripts/ src/ --include=*.py'
    expected: >-
      Exit 0 with no output. Baseline at plan time was 9 matches -- six under tests/ and three
      under scripts/ (session/postflight.py:46, roadmap/plan_audit.py:30,
      agent_development/run_skill.py:30).
    fix_if: >-
      Any surviving hit re-introduces the ambient duplicate-repo-root condition for every future
      test that reasons about sys.path. Note this step alone cannot distinguish a real guard from
      a bare re-indent -- step 3 is what closes that gap.
    hermetic: true
    graduation: graduate
    graduation_check_id: "no-unguarded-module-scope-syspath-insert"
  - step: 3
    phase: pre-deploy
    action: >-
      Prove the guards are behaviourally correct, not merely re-indented -- re-executing each of
      the nine guarded module bodies must add zero repo-root copies to sys.path.
    command: bin/venv-python -m pytest tests/test_syspath_hygiene.py --randomly-seed=12345 -q
    expected: >-
      All pass -- zero additional repo-root copies across all nine modules (measured baseline:
      the six tests/ modules alone add 6).
    fix_if: >-
      A non-zero delta means a guard is cosmetic (e.g. the insert was indented under an unrelated
      block rather than under an `if str(ROOT) not in sys.path` test), which step 2's grep would
      wrongly pass.
    hermetic: true
    graduation: graduate
    graduation_check_id: "syspath-modules-add-no-duplicate-root"
  - step: 4
    phase: pre-deploy
    action: >-
      Exercise the extracted transient classifier across its full truth table, including the
      negative cases that must still gate.
    command: bin/venv-python -m pytest tests/ops_data_portal/test_reader_transient.py --randomly-seed=12345 -q
    expected: >-
      All pass -- each transient status classifies transient; transient-status-with-error_type
      does NOT; 4xx does NOT; non-RuntimeError does NOT.
    fix_if: >-
      A too-broad classifier would swallow structured handler errors and genuine 4xx failures,
      converting a real defect into a silent skip -- the exact masking Decision 55 forbids.
    hermetic: true
    graduation: graduate
    graduation_check_id: "reader-transient-classifier-truth-table"
  - step: 5
    phase: pre-deploy
    action: >-
      Close the reader/classifier drift channel -- assert the classifier's accepted set EQUALS
      src.common.iceberg_reader._READER_TRANSIENT_STATUS (derive-the-set, Decision 143 pattern)
      rather than restating {502,503,504} independently.
    command: >-
      bin/venv-python -m pytest tests/ops_data_portal/test_reader_transient.py -k derive
      --randomly-seed=12345 -q
    expected: >-
      The derive-the-set test passes -- classifier accepts exactly the reader's authoritative set
      and rejects its complement.
    fix_if: >-
      A hard-coded status set in the classifier has diverged from the reader's authority; the
      extraction would then only have de-duplicated the scripts/-side copy while leaving the
      channel that actually matters open (plan-critique round 1, R5).
    hermetic: true
    graduation: graduate
    graduation_check_id: "reader-transient-set-equals-reader-authority"
  - step: 6
    phase: pre-deploy
    action: >-
      Prove the DCG-03 guard tolerates ONLY transient unavailability -- transient skips with the
      named marker, non-transient raises, genuine orphan raises.
    command: >-
      bin/venv-python -m pytest tests/ops_data_portal/test_decisions_divergence_guard.py
      --randomly-seed=12345 -q
    expected: All pass, including the three new branch cases and the marker-text assertion.
    fix_if: >-
      If the genuine-orphan case stops raising, the Decision 149 DCG-03 invariant has been
      weakened rather than made transient-tolerant, and the change must be reverted.
    hermetic: true
    graduation: graduate
    graduation_check_id: "dcg03-orphan-guard-transient-tolerance"
  - step: 7
    phase: pre-deploy
    action: >-
      Prove the transient semantics have exactly one definition AND that it lives in the new
      shared module -- count alone would not prove the old private copy was the one deleted.
    command: 'test "$(grep -rEn "def (_)?is_reader_unavailable|_TRANSIENT_HTTP_RE" scripts/ src/ --include=*.py | wc -l)" -eq 3 && test "$(grep -rEn "def (_)?is_reader_unavailable|_TRANSIENT_HTTP_RE" scripts/ops_portal/reader_transient.py | wc -l)" -eq 3'
    expected: >-
      Exit 0. Exactly 3 matching lines repo-wide (the def, the regex constant, and its in-function
      use), all 3 inside scripts/ops_portal/reader_transient.py. Baseline at plan time is 3, all
      inside scripts/data_quality_execute.py (lines 20, 76, 92).
    fix_if: >-
      A total other than 3 means the extraction dropped or duplicated a line; 3 total but fewer
      than 3 in reader_transient.py means the local copy in scripts/data_quality_execute.py
      survived, so the two consumers can still drift.
    hermetic: true
    graduation: graduate
    graduation_check_id: "reader-transient-classifier-single-definition"
  - step: 8
    phase: pre-deploy
    action: >-
      Prove the extraction did not change data-quality behaviour, and that the directly-touched
      consumer suites still pass together.
    command: >-
      bin/venv-python -m pytest tests/test_data_quality_execute.py
      tests/ops_data_portal/test_decisions.py tests/test_build_lambda_config.py
      tests/test_plan_audit.py tests/test_run_skill.py tests/test_postflight_gates.py
      --randomly-seed=12345 -q
    expected: All pass with no changes required to tests/test_data_quality_execute.py.
    fix_if: >-
      A data-quality failure means the extracted classifier is not behaviourally identical to the
      private copy it replaced; re-diff the two implementations rather than editing the DQ tests.
      A plan_audit/run_skill/postflight failure means one of the three scripts/ guards broke that
      module's own import resolution.
    hermetic: true
    graduation: graduate
    graduation_check_id: "reader-transient-extraction-consumer-parity"
  - step: 9
    phase: pre-deploy
    action: Run the authoritative fast-tier presubmit gate over the whole change.
    command: bin/venv-python -m scripts.validate --pre
    expected: PASS -- ruff, mypy, prompt checks, diff-aware pytest, SLOC and placement guards all green.
    fix_if: >-
      A SLOC failure would mean a scope file crossed its budget; per Decision 128 decompose rather
      than raise. A placement failure would mean scripts/ops_portal/reader_transient.py needs a
      file-router/allowlist entry.
    hermetic: false
    graduation: waive
    graduation_waiver_reason: >-
      This step IS the presubmit gate. Graduating it into scripts/verification_checks' registry
      would register the fast tier as a standing check run BY the fast tier -- a circular
      self-invocation, and the same recursion the _VALIDATE_DEPTH guard exists to prevent. Its
      constituent checks are already independently registered; there is nothing left to graduate.
  - step: 10
    phase: post-deploy
    action: >-
      Re-point rec-2874's fixed_by_sha at the commit that actually removes the fragility, replacing
      b0272f6 (which added rec-autoclose to the ci-rca watched-workflow filter and fixed nothing).
      This is NOT cosmetic -- see the corrected rationale in Context.
    command: 'SHA=$(git rev-parse origin/main) && bin/venv-python -c "import sys; from scripts.ops_portal.ci_rca_lifecycle import stamp_fixed_by_sha; stamp_fixed_by_sha(''rec-2874'', sys.argv[1]); print(''stamped'', sys.argv[1])" "$SHA"'
    expected: >-
      Prints "stamped <sha>"; rec-2874's context_v2_json.fixed_by_sha equals this plan's
      squash-merge SHA.
    fix_if: >-
      stamp_fixed_by_sha raises if rec-2874 is absent from the current projection -- re-run
      the portal sync first. Note scripts/ops_portal/ci_rca_lifecycle.py has no argparse/__main__,
      so the importable helper must be called directly as above; a `-m` invocation will fail.
  - step: 11
    phase: post-deploy
    action: Confirm the bundled recommendation actually closed after merge (closure obligation).
    command: >-
      bin/venv-python -m scripts.ops_data_portal --sync && grep -c '"id": "rec-2876".*"status": "closed"'
      logs/.recommendations-log.jsonl
    expected: rec-2876 present with status closed, resolution naming this plan's merge commit.
    fix_if: >-
      Still open means the Resolves trailer was missing or malformed in the squash-merge body; fall
      back to the documented ops_data_portal --update-rec path (Decision 70).

constraints:
  - No rescue agents or workaround loops (Decision 55).
  - >-
    Decision 55 fail-closed default is mandatory: ONLY is_reader_unavailable(exc) may skip the
    guard. Every other exception, and every genuine orphan, must still raise. A bare
    `except Exception: pass` around the read is an explicit non-goal.
  - >-
    Decision 55 anti-masking: the skip must be observable, not a bare logger.warning. It emits a
    distinct greppable marker and mirrors to GITHUB_STEP_SUMMARY when set, following Decision 154's
    marker shape.
  - >-
    Decision 84 I-3: the orphan read stays on the closed named-verb boundary (reader.current_state).
    Do not add a fallback read path, caller SQL, or a new Lambda verb.
  - >-
    Do NOT modify src/common/iceberg_reader.py. The two active manifests that wildcard-include
    `src/` would package any edit there and escalate this plan to V3 with two production Lambda
    deploy legs. READING it from a test (step 5's derive-the-set assertion) is explicitly fine and
    adds no artifact. The reader's retry policy is deliberately left alone -- retry tuning would
    not have prevented the incident (see Context).
  - >-
    Decision 128: if a scope file crosses its SLOC budget, decompose into a facade package -- never
    raise the budget, never re-seed via --update-sloc-budgets. Headroom measured at plan time:
    decisions.py 286/500, ci_rca_lifecycle.py 247/500, all test files well under.
  - Decision 131 / tests CLAUDE.md - no cross-test imports; shared helpers go in tests/fixtures/ or conftest.
  - Portal-only writes (Decision 84); never re-stage from the local read cache.

context:
  - >-
    "Decision-scout verdict + CITE list (verbatim decision ids)": verdict FLAGS_FOUND, 107 of 107
    decisions triaged. CITE list verbatim - Decision 149 (owns _assert_no_orphaned_current_rows;
    its clause 3 created the guard and grounds its RuntimeError in Decision 55 - this plan narrows
    that failure contract and says so, see the Decision 155 draft), Decision 154 (structurally
    identical same-day precedent: a pre-condition infra failure stops latching a hard block, via a
    NAMED marker plus itemised reversal conditions - the marker shape is modelled on it),
    Decision 88 (Neon catalog egress budget; see the R1 note below on why invariant (i) is NOT
    load-bearing for this plan's justification), Decision 72 (RCA-as-plan-source - this plan is the
    required /plan review that AGENTS.md forbids bypassing with an inline patch), Decision 84 (I-3
    closed named-verb read boundary), Decision 142 (fingerprint chain lifecycle - see the VP step
    10 rationale), Decision 103 (semantic verdicts are close_proposed, never a bare direct close),
    Decision 62 (2026-06-16 amendment - the ratified precedent for tolerating reader-502-driven
    check failure on this substrate), Decision 143 (derive-the-set-assert-equality, used by step 5).
  - "gates: decision-scout=FLAGS_FOUND; plan-critique=REVISE->PROCEED after 2 round(s)"
  - >-
    ROOT CAUSE A (reproduced locally, not inferred). rec-2876. CI run 30223119628 is the post-merge
    push run on main tip f550d15 (event=push, head_sha=f550d15), conclusion failure, still
    attempt=1 with no re-run - main is red right now. tests/test_build_lambda_config.py:182 calls
    sys.path.remove(root_str) once; the gw1 worker held 11 copies of the repo root; list.remove()
    drops only the first, so line 184's `assert root_str not in sys.path` fired.
  - >-
    CORRECTION TO rec-2876's OWN RCA. Its detection_gap claims the --pre tier skipped the test
    because "the failing PR touched neither" build_lambda_config.py nor its test file. That is
    false: PR #771 (f550d15) touched BOTH and in fact ADDED the failing test. --pre ran it and it
    PASSED, because run_pytest_diff executes only the CHANGED test files and none of PR #771's
    changed test files pollute sys.path. The full tier runs the whole suite under -n auto, where a
    worker accumulates enough copies to trip. The escape is environment-dependent, not
    selection-dependent - which also means the test is shard-order flaky, so a CI re-run could mask
    it without fixing anything.
  - >-
    PRODUCER SET IS REPO-WIDE, NOT tests/-ONLY (plan-critique round 1, R3 - measured). An earlier
    draft claimed guarding the six tests/ modules would stop the condition being produced. That was
    false: a pytest run collecting NONE of the six still accumulated 5 repo-root copies, sourced
    from scripts/session/postflight.py:46, scripts/roadmap/plan_audit.py:30 and
    scripts/agent_development/run_skill.py:30. All three are now in scope; compute_affected_artifacts
    returns {} for them, so the tier is unchanged. Baseline is 9 unguarded inserts repo-wide.
  - >-
    ROOT CAUSE C (evidence from the failing job log, run 30101021966 job 89506781941). This was NOT
    a cold start. Step 7 (which touches DuckLake) succeeded in 2s at 14:28:14. Step 8 then ran
    ~2m20s of continuous successful warehouse traffic (fidelity report: written=0 failed=1
    skipped=130, live_entries_checked=104) before dec-151's WRITE 502'd at 14:30:35.49. The reader
    502s followed at 14:30:36.21 / 14:30:38.50 / 14:30:42.79. Neon was warm and under load
    immediately beforehand, so neither pre-warming nor longer retry spacing would have prevented
    this run's failure - both were evaluated against this evidence and rejected.
  - >-
    WHY THIS IS NOT MASKING (rewritten after plan-critique round 1, R1). The justification rests on
    two STRUCTURAL facts, not on Decision 55's recovery carve-out. (1) The substantive signal is
    independent and loud: _fetch_decision_from_reader sits INSIDE the per-row try at
    scripts/ops_portal/decisions.py:335, so a persistent reader outage trips `failed` on every one
    of ~150 rows and exits 1 via rec-autoclose.yml:156 (rec-autoclose is in the ci-rca watched
    filter) LONG before the orphan guard is reached. The guard can only be the sole casualty when
    the reader served the entire row loop and blipped on the final read - exactly the observed
    incident. (2) The guard checks PERSISTENT state (a warehouse row with no matching header), not
    a transient event, so a skipped run DELAYS detection to the next backfill rather than losing
    it. Corroborating precedent: scripts/data_quality_execute.py:139 already implements this exact
    tolerance on this exact substrate, and Decision 62's 2026-06-16 amendment already ratified
    tolerating reader-502-driven check failure here. EXPLICITLY NOT RELIED ON: Decision 55's
    "deterministic recovery remains valid" carve-out and Decision 88 invariant (i) both ratify
    deterministic RETRY / REOPEN, not deterministic SKIP; citing them as authority for a skip
    over-reads both, and an earlier draft of this plan did so.
  - >-
    WHAT FIX C ACTUALLY BUYS. Run 30101021966 was going to fail regardless - dec-151's write
    genuinely failed, and the workflow ends with `sys.exit(1 if result["failed"] else 0)`. The
    orphan-guard read merely crashed first and mis-attributed the cause. Fix C is therefore a
    FAILURE-ATTRIBUTION fix, not an availability fix for that incident. Its real value is the
    common run shape - 130 skipped / 0 written - where there is no write failure at all and a
    transient blip on the advisory read kills an otherwise-perfect job. It also prevents a false
    Critical REGRESSION rec: today such a blip fails the job, fires ci-rca, matches the closed
    7a0964cf chain head, and classify_closed_head returns "regression"
    (ci_rca_lifecycle.py:178-192 returns drop only when the failing sha is an ANCESTOR of
    fixed_by_sha), so file_regression_record files a REGRESSION-prefixed priority=critical rec that
    re-triggers the /plan hard block.
  - >-
