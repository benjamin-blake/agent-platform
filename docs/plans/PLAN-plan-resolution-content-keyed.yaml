    verification_step: 8
    command: test "$(grep -c 'commits on .git log origin/main..HEAD' .claude/skills/planning/SKILL.md)" = "0"
    red_green_expectation: red before (1 occurrence at :336), green after.
  - source: docs/DECISIONS.md
    behavior: Decisions 132 and 148 each carry an amendment line naming the replacement mechanism.
    verification_step: 10
    command: test "$(grep -c 'implementation_declared' docs/DECISIONS.md)" -ge "2"
    red_green_expectation: red before (0 occurrences), green after.
  - source: config/agent/verification_registry/registry.yaml
    behavior: Every graduated step has a row that survives the differential admission gate.
    verification_step: 11
    command: bin/venv-python -m scripts.validate
    red_green_expectation: >-
      red before (validate_graduation_completeness fails a graduate step with no new-in-diff row),
      green after.
constraints:
  - No rescue agents or workaround loops (Decision 55). On an unrecoverable failure, stop and RCA.
  - >-
    Commit-message shape must remain UNVERIFIED by this repo. This plan removes a commit-subject
    dependency; it must not introduce a replacement obligation on commit grammar anywhere.
  - >-
    Adopt Decision 170's ratified vocabulary; do NOT mint a parallel one. registry.examined(count)
    with count == 0 IS the vacuous/empty-domain declaration, and registry.skipped(reason) is reserved
    for "could not examine", never "examined nothing". An earlier draft of this plan invented an
    "N/A" marker for exactly this; that invention is withdrawn. Follow
    validate_licence_consistency.py:198 as the adoption precedent.
  - >-
    TOUCH-IT-FIX-IT (Decision 170). Both modified checks are frozen in
    config/check_accounting_baseline.yaml (:75, :129). Editing a baselined check's defining module
    without adopting the declaration in the SAME PR fails validate_check_accounting in both tiers.
    Adopt and shrink the baseline together; a baseline edit alone is also refused.
  - >-
    Baseline derivation (Decision 159). Use push_context_base() with a fallback, NOT a hardcoded
    `git show origin/main:<path>`. On the post-merge full-tier run on main the declaration is already
    true at origin/main, so an origin/main-anchored resolver returns empty and both checks declare
    vacuous -- silently recreating this plan's own defect on the branch where it matters most.
  - >-
    Resolver read semantics. Use a RAW yaml.safe_load plus a .get lookup -- NOT _common.load_plan,
    whose PlanDocument validation would make a schema-invalid plan redden the resolver and break both
    checks' deliberate "schema validity is validate_plan_documents' concern" carve-out and its pinned
    tests. Fail-loud covers OSError and YAMLError on the WORKING-TREE read only. A baseline that does
    not resolve is a legitimate "not declared at baseline".
  - >-
    Guard placement at BOTH call sites. The reachability guard exists today only in _implement_pr_leg
    (validate_vp_replay.py:170); _plan_only_pr_leg (136-165) has none and takes no failed list. When
    the base is unreachable the plan-only leg must DEFER every plan, matching today's conservative
    outcome. Without this, every baseline read fails with the same exit code the baseline-absent rule
    reads as "not declared", so every declared plan resolves, hands off, and is then skipped --
    neither deferred, replayed, nor labelled.
  - >-
    Registry capacity is a hard constraint. config/agent/verification_registry/registry.yaml is at
    5949 of its 6000-line cap (Decision 166) at 13.6 lines per row -- THREE rows fit. This plan
    graduates exactly three steps; every other step waives with a substantive reason. Do not add a
    fourth row, and do not raise the cap (that needs an authorizing Decision this plan does not mint).
  - >-
    Byte budgets are binding and one is at ZERO. .claude/skills/planning/SKILL.md is 55788 of 55788 --
    the replacement sentence must be no longer than the one it removes.
    .claude/skills/implement/SKILL.md has 6 bytes (48196/48202); compress the "Run the full gate
    locally first" preamble, fallback the Wait-for-CI paragraph. No prose raise (Decision 165 requires
    an authorizing Decision, which this plan does not mint).
  - >-
    Decision 148 makes scripts/checks/_common.py the SOLE home for plan-resolution helpers. The new
    resolver lands there; do not create a second home.
  - >-
    The optional field must not force a schema_version bump or any edit to an existing plan, and must
    not be back-filled onto other plans -- that would fabricate implementation history.
  - >-
    Decision 128/130 -- every test file in scope stays under 500 SLOC. Current sizes measured -
    test_validate_graduation_completeness.py 372, test_validate_vp_replay.py 340,
    test_edit_scope_guard.py 313, test_optional_fields.py 211. All have room; decompose rather than
    raise if any approaches the limit.
context:
  - >-
    "Decision-scout verdict + CITE list (verbatim decision ids): FLAGS_FOUND (125 of 125 triaged),
    re-dispatched against THIS scope. CITE: Decision 132, Decision 148, Decision 85, Decision 169,
    Decision 150 (+ Decision 167), Decision 151, Decision 55, Decision 76, Decision 131. CONTRADICT
    flags, all resolved in this revision: Decision 170 [WARN] (touch-it-fix-it on both baselined
    modules, and a ratified examined()/skipped() vocabulary this plan was duplicating) -> adopted;
    Decision 159 [WARN] (origin/main-anchored baseline silently no-ops post-merge) -> push_context_base
    adopted; Decision 165 [WARN] (zero-headroom prose budgets, no authorizing Decision for a raise) ->
    both edits constrained byte-neutral; Decision 128 [NOTE] (test-file sizes) -> scout's figures were
    stale, measured 372/313 not 445/429, ample room; Decision 166 [NOTE] (registry 6000-line cap) ->
    graduations cut from 8 to 3, the number that fits. SPIRIT: Decision 163 [WARN] (the declaration is
    a flag an agent must remember) -> see the successor-seam residual below. RELATED: Decision 155,
    Decision 142, Decision 87."
  - >-
    "gates: decision-scout=FLAGS_FOUND (this scope, 125 of 125); plan-critique=REVISE after 3 rounds
    on the predecessor scope then re-scoped, plus REVISE on rounds 1 and 2 of this scope; round 3
    pending against this revision"
  - >-
    Q1 ADJUDICATION, recorded because it qualifies this plan's authorization. Decision 132's reversal
    condition triggers on the false-negative rate proving material IN PRACTICE, and names a
    `Resolves: rec-NNNN` secondary trigger as an illustrative ("e.g.") alternative -- so declining that
    specific remedy is authorized, but the trigger is a measured-materiality finding this plan does not
    supply. This plan proceeds on the DECIDABILITY defect instead - absence of a signal is being used
    as a claim, and no predicate over {marker present?} can separate "genuinely plan-less" from
    "marker destroyed" - not on a rate measurement. Stated plainly rather than dressed as a rate finding.
  - >-
    Q2 ADJUDICATION and its provenance. The `[Amendment YYYY-MM-DD: ...]` grammar in
    docs/contracts/decision-entry.yaml is CONVENTION-ONLY -- no validator, no stored guard (Decision
    151 / Decision 146 operator-disposed stance) -- so nothing would have failed had Decisions 132/148
    been left stale. The convention nonetheless requires every clarification to cite a ratified source,
    and with no Decision minted the only legal source is explicit operator direction. That direction
    was given during this plan's authoring and is the recorded provenance for both amendment lines.
  - >-
    Q4 ADJUDICATION. Nothing in the corpus requires or forbids a numbered Decision for a change of
    this shape. The significance bar is a ceiling on what MAY become an entry, not a floor obliging
    one (decision-entry.yaml's routing_rule - the bound is on what may appear in significance.value,
    "never an acceptance mandate that a specific row must be claimed"). Minting one would be
    defensible, since this negates a clause of two live Decisions and the corpus's practice for that
    is an amending entry -- but it is not required, and this plan deliberately does not mint one.
  - >-
    THE DEFECT, stated precisely. Both gates locate the plan they verify by scanning commit subjects
    on `git log origin/main..HEAD` for feat({slug}) (scripts/checks/_common.py:208 feat_commit_slugs,
    consumed at validate_vp_replay.py:150 and :174 and validate_graduation_completeness.py:186 --
    line numbers re-verified post-rebase; the checks were untouched by the 18 commits main advanced).
    When no such subject is found, neither fails - each prints a no-op PASS. That is deliberate,
    because most PRs legitimately implement no plan. The consequence is that the checks use the
    ABSENCE of a signal as a claim, and absence has two indistinguishable causes - genuinely
    plan-less, or plan-implementing with the marker destroyed.
  - >-
    WHY CONTENT AND NOT COMMITS. The asymmetry - an automated `git add -A` DESTROYS commit-subject
    signals (by leaving the intended marker commit empty) while PRESERVING tree content. Moving the
    applicability signal into the plan file makes it robust to any commit topology. This is explicitly
    NOT the diff-based resolution Decision 132 rejected - that was heuristic inference from which
    source files changed. This is an explicit, schema-validated declaration that travels in the diff.
  - >-
    PARTIAL REUSE, stated honestly. validate_vp_replay.py:145 already resolves plans from the diff via
    _common.plan_paths_from_changed(changed_files), and push_context_base() plus the
    `git show <base>:<path>` idiom already exist in _common.py and two sibling checks. What is
    genuinely NEW is the two-tree comparison primitive that combines them.
  - >-
    RESOLVER SPECIFICATION, pinned so no improvisation is needed. Candidate set - the plan files
    already present in `changed_files` (reuse plan_paths_from_changed), NOT a whole-docs/plans scan.
    Signature - widen `_implement_pr_leg(root, failed)` to accept `changed_files`, matching the seam
    both test suites already inject. Baseline - push_context_base() with fallback. Placement - inside
    the reachability guard at both call sites. Comparison - working tree true AND baseline not-true,
    where baseline not-true covers both "false" and "file absent at the base". Read - raw
    yaml.safe_load, never load_plan.
  - >-
    NO COST TO LOSING feat({slug}). Branch commit subjects never reach main - the merging agent
    composes the squash commit message at merge time. Every other feat({slug}) mention in the repo
    (AGENTS.md, implement/SKILL.md's commit flow, the PR template) is a CONVENTION, never a
    resolution. --allow-empty on marker commits remains optional hygiene at most and is NOT in scope.
  - >-
    REJECTED ALTERNATIVES from the predecessor plan. (A) A new guard requiring any recognised commit
    prefix when checkpoint commits are present - catches total loss only, misses the partial case.
    (B) The same guard demanding feat() specifically - fails every legitimately plan-less PR,
    including planning and audit PRs. (C) The same predicate relocated into the two existing checks -
    identical false positives to (B). The decisive objection to all three is that each would make
    commit-message shape a VERIFIED requirement, which this repo has deliberately never had.
  - >-
    FABLE ADVICE-CONSULT informed this design - vacuous-pass / fail-open gate problem, prescription is
    three-state semantics where not-applicable requires positive evidence, plus mutation-style
    validation that the gate can still fail. Precedent - pytest exits 5 on no-tests-collected,
    Terraform's -detailed-exitcode separates no-changes from success. Notably the repo reached the
    same conclusion independently and ratified it as Decision 170 while this plan was being authored,
    which is why the three-state design is now an ADOPTION rather than an invention.
  - >-
    DISCLOSED RESIDUAL -- the successor seam (Decision 163 spirit flag). The new signal is robust to
    commit topology but is still written by the same agent at the same step as the old one, so an
    implement session that skips the plan-file edit yields a clean pass. This is strictly narrower
    than the defect being closed (which fired by accident, with no agent omission required), and
    Decision 170's channel materially improves it - an omitted declaration now surfaces the check as
    VACUOUS in the accounting output rather than being invisible. VP step 7 guards the instruction's
    presence; nothing guards an agent ignoring it. Recorded per Decision 132's precedent.
  - >-
    SCOPE-GUARD INTERACTION. edit_scope_guard.py denies fail-closed for any file outside the active
    plan's Scope, and this plan makes the implement flow edit the plan file itself. The guard is inert
    today (re-verified post-rebase - nothing sets CLAUDE_ACTIVE_PLAN, no .claude/active_plan marker),
    so this is pre-emptive - but without the exemption, activation would later break every implement
    session unless each plan listed its own path in its own Scope.
  - >-
    GRADUATION ADMISSION AND CAPACITY. validate_verification_registry re-runs each added row against a
    baseline worktree AND live, rejecting rows that pass on both; a test_selector row naming a whole
    file that exists at the baseline is rejected. The three graduated rows are - step 1
    (test_selector naming TestImplementationDeclaredResolver, verified 0 occurrences at origin/main),
    step 5 and step 7 (both grep_count rows discriminating 4->0 and 0->=1). Capacity forced the cut
    from eight graduations to three; the five now-waived steps each name the standing repo-wide
    mechanism that guards their property instead.
  - >-
    SURFACE-RETIREMENT OBLIGATION (12k trigger 2) fires on the mechanism cutover even with no Delete
    row, satisfied by three sweeps - VP step 5 (code surface), VP step 8 (instruction surface), VP
    step 10 (decision-log surface).
  - >-
    PREREQUISITE LANDED. The tests/test_plan_document.py decomposition shipped separately and is on
    main as of this rebase - the monolith is gone, tests/roadmap/plan_document/ exists with 4 modules,
    map_source_to_test resolves to tests/roadmap/plan_document (the path the mirror algebra actually
    produces, NOT tests/test_plan_document/), and zero registry rows still name the deleted file. Both
    of round 2's blockers are dissolved rather than worked around.
  - >-
    Branch was 18 commits behind origin/main and was rebased onto it at the human's direction before
    this revision; every premise was re-verified post-rebase rather than assumed. Two moved materially
    - planning/SKILL.md dropped from 6 bytes of headroom to ZERO, and the decision corpus grew from
    169 to 172, adding Decision 170 which this revision now adopts.
  - >-
    DEFERRED, and unsafe to build before this lands - a turn-boundary Stop hook that commits and
    pushes checkpoint work so an ephemeral container cannot lose it. Its full design, the harness
    Stop-hook interaction, the public-repo exposure of `git add -A` (checkpoint pushes are irrevocable
    publication), and a T4.1 progress_note recording the executor-side step-wrapper contract against
    CD.43's existing option_set entry git_as_store_commit_at_step_boundaries all move to that
    follow-on plan. Also deferred - switching branch integration from rebase to merge, and
    substrate-owned freshness. rec-2362 is unbundled and returns to the open queue.
