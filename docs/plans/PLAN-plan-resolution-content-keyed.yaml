schema_version: 4
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: "plan-resolution-content-keyed"
intent: >-
  Re-key the two plan-verification gates off commit-message convention and onto an explicit,
  schema-validated declaration carried in the plan file itself, and adopt Decision 170's ratified
  examined()/skipped() channel so a vacuous pass is declared rather than indistinguishable from a
  real one. Contributes to the North Star by hardening the verification safety envelope that admits
  every other change.
plan_type: IMPLEMENTATION
verification_tier: V2
plan_path: docs/plans/PLAN-plan-resolution-content-keyed.yaml
phase: >-
  Platform engineering -- verification-system correctness. Ad-hoc, user-initiated (soft-warn
  category user_explicit_out_of_scope), naming no carrier tier_item; mirrors the
  PLAN-vp-replay-hermetic-traps precedent. Closes the trigger-seam false negative Decision 132
  disclosed as a residual limitation, via the remedy that Decision's own reversal condition
  prescribes ("revisit the resolution mechanism ... rather than reverting the gate"). Prerequisite
  for a deferred turn-boundary checkpoint-commit hook, which is unsafe until this lands.
scope:
  - file: scripts/roadmap/plan_document.py
    action: Modify
    purpose: >-
      Add the optional `implementation_declared` boolean to PlanDocument. Optional and defaulted, so
      the entire existing corpus keeps validating unchanged (Decision 85 / the Decision 132 clause-1
      precedent) and no schema_version bump is owed; absence means "not yet implemented".
  - file: scripts/checks/_common.py
    action: Modify
    purpose: >-
      Add the content-based plan resolver and retire feat_commit_slugs (defined at :208) once no
      caller remains. Decision 148 makes this module the SOLE home for resolution helpers, so the new
      resolver lands here and nowhere else.
  - file: scripts/checks/verification/validate_vp_replay.py
    action: Modify
    purpose: >-
      Re-key BOTH legs off commit subjects -- the implement leg at :174 and the plan-only leg's
      co-presence test at :150, inside _plan_only_pr_leg (136-165) -- and adopt Decision 170's
      examined()/skipped() declaration.
  - file: scripts/checks/verification/validate_graduation_completeness.py
    action: Modify
    purpose: Same re-key at :186 and the same Decision 170 declaration.
  - file: config/check_accounting_baseline.yaml
    action: Modify
    purpose: >-
      Remove validate_graduation_completeness (:75) and validate_vp_replay (:129) from the frozen
      baseline as both modules adopt the declaration. Shrink-only, which the baseline's own guard
      permits; leaving them listed while editing their defining modules fails validate_check_accounting
      in both tiers (the touch-it-fix-it rule).
  - file: .claude/hooks/edit_scope_guard.py
    action: Modify
    purpose: >-
      Exempt the active plan's own path from the scope denial. The implement flow must now edit the
      plan file to set the declaration; without this, an activated guard would deny that edit
      fail-closed and every future plan would need a boilerplate self-reference in its own Scope.
  - file: .claude/skills/implement/SKILL.md
    action: Modify
    purpose: >-
      Instruct the flow to set `implementation_declared: true` in the plan file BEFORE the mandatory
      full-validation run. Byte-neutral -- 6 bytes of headroom (48196/48202); compress the "Run the
      full gate locally first" preamble, with the Wait-for-CI paragraph as the named fallback target.
  - file: .claude/skills/planning/SKILL.md
    action: Modify
    purpose: >-
      Correct the now-false hermetic-authoring note at :334-337, which tells every future planning
      agent that "the implement PR resolves PLAN-{slug}.yaml from feat({slug}) commits on git log
      origin/main..HEAD". This surface has ZERO bytes of headroom (55788/55788), so the replacement
      must be no longer than the sentence it removes.
  - file: docs/DECISIONS.md
    action: Modify
    purpose: >-
      Add an `[Amendment YYYY-MM-DD: ...]` line to Decision 132 and Decision 148, both of which name
      the retired commit-subject mechanism in their Decision text. Provenance for the clarification
      (Decision 151 clause 3(iii)) is EXPLICIT OPERATOR DIRECTION given during this plan's authoring;
      no new Decision is minted.
  - file: tests/roadmap/plan_document/test_optional_fields.py
    action: Modify
    purpose: >-
      Add TestImplementationDeclared beside the existing TestClosesCriteria /
      TestGraduationDisposition / TestFallbackReevaluation classes. At 211 SLOC of a 500 limit this
      module has ample room.
  - file: tests/checks/_common/test_primitives.py
    action: Modify
    purpose: >-
      Add TestImplementationDeclaredResolver; remove the feat_commit_slugs assertions at :173 and
      :188, keeping the origin_main_reachable half of the :187 test, which survives.
  - file: tests/checks/verification/test_validate_vp_replay.py
    action: Modify
    purpose: >-
      Re-point both legs' tests at the resolver and add TestContentKeyedResolution, including the
      mutation-style meta-test proving a resolved plan with a failing VP step still reddens the check.
      340 SLOC of a 500 limit.
  - file: tests/checks/verification/test_validate_graduation_completeness.py
    action: Modify
    purpose: Same re-point plus TestContentKeyedResolution and the same meta-test. 372 SLOC of a 500 limit.
  - file: tests/test_edit_scope_guard.py
    action: Modify
    purpose: >-
      Add TestActivePlanSelfEditExempt covering the exemption and confirming out-of-scope files are
      still denied. 313 SLOC of a 500 limit.
  - file: config/agent/verification_registry/registry.yaml
    action: Modify
    purpose: >-
      One row per graduated step. The file is at 5949 of its 6000-line cap (Decision 166) averaging
      13.6 lines per row, so only THREE rows fit -- which is exactly the number of steps this plan
      graduates. Every other step waives with a substantive reason.
bundled_recommendations: []
infrastructure_dependencies: []
acceptance_criteria:
  - >-
    PlanDocument accepts an optional `implementation_declared` boolean; every plan in docs/plans/
    still validates with no edits and no schema_version bump.
  - >-
    scripts/checks/_common.py exposes a resolver returning the plans whose `implementation_declared`
    is true in the working tree and was not true at the diff base, and feat_commit_slugs has no
    caller anywhere under scripts/checks/.
  - >-
    The resolver derives its baseline via push_context_base() with a fallback to origin/main, so the
    post-merge full-tier run on main does not silently resolve nothing (Decision 159's diff-base
    class fix).
  - >-
    The resolver reads the plan with a raw YAML load, failing loudly only on an OSError or a YAML
    parse error in the WORKING TREE. A plan that parses but fails PlanDocument schema validation is
    NOT a resolver failure -- both checks keep their existing "schema validity is
    validate_plan_documents' concern" SKIP carve-out. A baseline that does not resolve is a
    legitimate "not declared at baseline", never an error.
  - >-
    validate_vp_replay resolves BOTH legs from the declaration, so a branch that declares an
    implementation has its hermetic pre-deploy steps replayed regardless of commit topology,
    including when every content commit is an automated checkpoint. The plan-only DEFER outcome and
    its printed reason survive.
  - >-
    When the diff base is unreachable, the plan-only leg DEFERs every plan (matching today's
    conservative behaviour) and the implement leg declares skipped(reason); no plan is left with no
    outcome.
  - >-
    validate_graduation_completeness resolves its implement-PR obligation the same way and is
    likewise independent of commit topology.
  - >-
    Both checks declare through Decision 170's channel -- registry.examined(count) where count == 0
    is the empty-domain VACUOUS declaration, and registry.skipped(reason) reserved for "could not
    examine", never for "examined nothing". Neither module invents a separate outcome vocabulary.
  - >-
    Both check names are removed from config/check_accounting_baseline.yaml, so
    validate_check_accounting's touch-it-fix-it rule is satisfied rather than tripped.
  - >-
    Each check has a mutation-style meta-test proving it can still fail - a resolved plan with a
    failing verification step reddens the check rather than passing.
  - >-
    Neither check reads commit subjects to decide applicability, and no check anywhere fails a branch
    because of what its commit subjects do or do not say.
  - >-
    The stale instruction at .claude/skills/planning/SKILL.md:334-337 no longer describes
    commit-subject resolution, and that file is no larger than its 55788-byte budget.
  - >-
    Decision 132 and Decision 148 each carry an amendment line recording that the commit-subject
    resolution mechanism their text describes has been replaced.
  - >-
    edit_scope_guard allows an Edit/Write to the active plan's own path and still denies a file
    outside the active plan's Scope.
  - >-
    The implement flow sets the declaration in the plan file before the mandatory full-validation
    run, so the gates resolve it from the working tree without needing any commit to exist.
  - Every graduated step has a registry row admitted by the differential gate, within the 6000-line cap.
verification_plan:
  - step: 1
    phase: pre-deploy
    action: >-
      Exercise the content resolver -- a plan whose declaration flipped resolves; a plan already
      declared at the baseline does not re-resolve; a diff with no declaration resolves nothing; a
      plan file ABSENT at the baseline resolves as newly-declared rather than erroring; an unreadable
      or YAML-malformed working-tree plan raises rather than returning an empty list; a plan that
      parses but is schema-invalid does NOT raise; the baseline derives from push_context_base().
    command: bin/venv-python -m pytest tests/checks/_common/test_primitives.py -q
    expected: "All tests pass; output reports `passed` and no failures."
    fix_if: >-
      A resolver that returns empty on an unreadable working-tree plan reintroduces the
      absence-as-claim defect. One that ERRORS on a baseline-absent plan breaks this plan's own
      implement PR. One that errors on a schema-invalid plan breaks both checks' carve-out. One that
      hardcodes origin/main silently resolves nothing on the post-merge main run (Decision 159).
    hermetic: false
    graduation: graduate
    graduation_check_id: plan-resolution-content-resolver
  - step: 2
    phase: pre-deploy
    action: >-
      Exercise validate_vp_replay's two re-keyed legs, the unreachable-base behaviour, the Decision
      170 declaration, and the mutation-style meta-test proving the check still reddens on a
      genuinely failing VP step.
    command: bin/venv-python -m pytest tests/checks/verification/test_validate_vp_replay.py -q
    expected: "All tests pass; output reports `passed` and no failures."
    fix_if: >-
      If the meta-test passes while the injected failing step is present, the check has become
      incapable of failing and is now decorative -- the exact condition this plan is closing.
    hermetic: false
    graduation: waive
    graduation_waiver_reason: >-
      Decision 170's check-accounting channel is now the standing guard for this exact property -- an
      examined(0) declaration surfaces this check as VACUOUS in the accounting output, which is what a
      registry row here would be asserting. A row would duplicate a repo-wide mechanism that already
      watches every registered check, and the registry is at 5949 of its 6000-line cap.
  - step: 3
    phase: pre-deploy
    action: Same for validate_graduation_completeness -- re-keyed leg, Decision 170 declaration, can-it-fail meta-test.
    command: bin/venv-python -m pytest tests/checks/verification/test_validate_graduation_completeness.py -q
    expected: "All tests pass; output reports `passed` and no failures."
    fix_if: As step 2 -- a meta-test that cannot redden the check means the gate is decorative.
    hermetic: false
    graduation: waive
    graduation_waiver_reason: >-
      Same as step 2 -- the accounting channel's vacuous-status detection is the standing guard for
      this check, and the registry cannot absorb duplicate rows at 51 lines of remaining headroom.
  - step: 4
    phase: pre-deploy
    action: >-
      Prove the schema change is backwards compatible -- the new field validates, absence stays
      valid, and the ENTIRE existing plan corpus still passes unmodified.
    command: bin/venv-python -m pytest tests/roadmap/plan_document/ -q && bin/venv-python -m scripts.roadmap.plan_document
    expected: "Tests pass, and every plan reports `validates against PlanDocument schema` with exit 0."
    fix_if: >-
      Any existing plan failing means the field was added as required rather than optional; make it
      optional rather than editing the corpus.
    hermetic: false
    graduation: waive
    graduation_waiver_reason: >-
      validate_plan_documents is a registered check that already re-validates the whole corpus in both
      tiers, so corpus back-compatibility has a standing guard; a registry row would shadow it.
  - step: 5
    phase: pre-deploy
    action: >-
      Prove the core invariant AND the code-surface retirement structurally -- no module anywhere
      under scripts/checks/ references the commit-subject resolver, so commit-message shape imposes
      no requirement on any branch and the retired helper leaves no stale caller.
    command: test -d scripts/checks && test "$(grep -rl 'feat_commit_slugs' scripts/checks/ --include=*.py | wc -l)" = "0"
    expected: Exit 0 (zero files reference the retired resolver; 4 do today, including its definition).
    fix_if: >-
      A non-zero count means a consumer still keys on commit subjects, or a rewritten docstring names
      the retired symbol while explaining the retirement -- describe the change without naming
      feat_commit_slugs anywhere under scripts/checks/.
    hermetic: true
    graduation: graduate
    graduation_check_id: no-commit-subject-plan-resolution
  - step: 6
    phase: pre-deploy
    action: >-
      Prove Decision 170 adoption landed on both modules and the frozen baseline was shrunk to match,
      satisfying the touch-it-fix-it rule rather than tripping it.
    command: test "$(grep -c 'examined(' scripts/checks/verification/validate_vp_replay.py)" -ge "1" && test "$(grep -c 'examined(' scripts/checks/verification/validate_graduation_completeness.py)" -ge "1" && test "$(grep -c 'validate_vp_replay\|validate_graduation_completeness' config/check_accounting_baseline.yaml)" = "0"
    expected: Exit 0 (both modules declare; neither name remains baselined -- 0/0 and 2 today).
    fix_if: >-
      A module edited without adopting the declaration while still listed in the baseline fails
      validate_check_accounting in both tiers. Follow the validate_licence_consistency.py:198
      precedent - registry.examined(total, unit="...").
    hermetic: true
    graduation: waive
    graduation_waiver_reason: >-
      validate_check_accounting AST-scans every registered check's defining module for exactly this
      declaration and enforces the baseline shrink itself, in both tiers -- this step is a plan-time
      pre-check of a one-time adoption, so a registry row would shadow the repo-wide guard.
  - step: 7
    phase: pre-deploy
    action: >-
      Prove the implement flow actually sets the declaration -- if this instruction is ever lost,
      implement sessions silently stop declaring and both gates go quietly vacuous, which is this
      plan's own failure mode reappearing one level up.
    command: test "$(grep -c 'implementation_declared' .claude/skills/implement/SKILL.md)" -ge "1"
    expected: Exit 0 (the flow names the field; 0 occurrences today).
    fix_if: >-
      A zero count means nothing in the documented flow sets the declaration, so every future
      implement PR resolves vacuous and verifies nothing.
    hermetic: true
    graduation: graduate
    graduation_check_id: implement-flow-sets-declaration
  - step: 8
    phase: pre-deploy
    action: >-
      Sweep the instruction surface for the retired mechanism, and confirm the byte budget still holds
      on a zero-headroom surface.
    command: test "$(grep -c 'commits on .git log origin/main..HEAD' .claude/skills/planning/SKILL.md)" = "0" && test "$(wc -c < .claude/skills/planning/SKILL.md)" -le "55788"
    expected: Exit 0 (the stale sentence is gone -- 1 occurrence today -- and the file is within budget).
    fix_if: >-
      A count of 1 means Layer-4 methodology still describes the retired mechanism. An over-budget
      size means the replacement was longer than the sentence removed; this surface has ZERO bytes of
      headroom, so shorten the replacement rather than taking a raise.
    hermetic: true
    graduation: waive
    graduation_waiver_reason: >-
      A one-time correction of a specific sentence. Once the stale text is gone it cannot regress
      without someone re-authoring it, and a registry row pinned to this exact phrase would go red on
      any future legitimate rewording of that paragraph.
  - step: 9
    phase: pre-deploy
    action: >-
      Exercise the scope-guard exemption -- the active plan's own path is allowed, a file outside the
      active plan's Scope is still denied, and the no-active-plan case still allows everything.
    command: bin/venv-python -m pytest tests/test_edit_scope_guard.py -q
    expected: "All tests pass; output reports `passed` and no failures."
    fix_if: >-
      If the exemption widens beyond the single active plan path, the guard stops being fail-closed
      for the case it exists to cover.
    hermetic: false
    graduation: waive
    graduation_waiver_reason: >-
      The hook is inert until a plan context is declared (nothing sets CLAUDE_ACTIVE_PLAN today), so a
      standing registry row would guard a dormant code path; its mirror test file is the appropriate
      guard until activation lands, and the registry has room for only three rows.
  - step: 10
    phase: pre-deploy
    action: >-
      Prove the two Decision entries describing the retired mechanism carry their amendment lines, so
      the decision log does not keep asserting a dead mechanism.
    command: test "$(grep -c 'implementation_declared' docs/DECISIONS.md)" -ge "2"
    expected: Exit 0 (both Decision 132 and Decision 148 reference the replacement; 0 today).
    fix_if: >-
      A count below 2 means one of the two entries still describes commit-subject resolution with no
      amendment. Provenance for the clarification is explicit operator direction recorded in context;
      no new Decision is minted.
    hermetic: true
    graduation: waive
    graduation_waiver_reason: >-
      A one-time documentation amendment on two specific entries. The amendment convention is
      explicitly enforcement-free (Decision 151 / Decision 146 operator-disposed stance), so a
      registry row here would unilaterally impose enforcement the convention deliberately declines.
  - step: 11
    phase: pre-deploy
    action: Run the full local gate before handoff.
    command: bin/venv-python -m scripts.validate
    expected: "Exit 0 with a final `Validation Summary (scope: all)` PASS and no failures."
    fix_if: >-
      Any failure blocks handoff; fix and re-run the full tier from the start. Watch specifically for
      validate_check_accounting (touch-it-fix-it on both modified checks), validate_prose_limits on
      the two zero-or-near-zero-headroom skill surfaces, validate_structural_size_limits on the
      registry's 6000-line cap, and validate_graduation_completeness, which this plan modifies and
      must satisfy against its own change.
    hermetic: false
    graduation: waive
    graduation_waiver_reason: >-
      A command_exit_zero row for the full validator is tautological under scripts/validate.py's own
      _VALIDATE_DEPTH and PYTEST_CURRENT_TEST short-circuit guards -- it exits 0 on both differential
      legs, so the admission gate rejects it as non-discriminating. Established repo disposition.
