rollback: >-
  Single-PR revert. The change is self-contained - the new field is optional and unused by anything
  else, and reverting restores commit-subject resolution exactly as it stands today. The Decision 170
  adoption reverts with it, restoring both baseline entries. No data migration, no external state.
