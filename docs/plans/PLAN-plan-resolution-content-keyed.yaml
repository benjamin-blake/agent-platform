schema_version: 4
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: "plan-resolution-content-keyed"
intent: >-
  Re-key the two plan-verification gates off commit-message convention and onto an explicit,
  schema-validated declaration carried in the plan file itself, so their applicability predicate
  becomes decidable and their "nothing to do" outcome rests on positive evidence rather than the
  absence of a signal. Contributes to the North Star by hardening the verification safety envelope
  that admits every other change.
plan_type: IMPLEMENTATION
verification_tier: V2
plan_path: docs/plans/PLAN-plan-resolution-content-keyed.yaml
phase: >-
  Platform engineering -- verification-system correctness. Ad-hoc, user-initiated (soft-warn
  category user_explicit_out_of_scope), naming no carrier tier_item; mirrors the
  PLAN-vp-replay-hermetic-traps precedent. Closes the trigger-seam false negative Decision 132
  disclosed as a residual limitation, via the remedy that Decision's own reversal condition
  prescribes ("revisit the resolution mechanism ... rather than reverting the gate"). Prerequisite
  for a deferred turn-boundary checkpoint-commit hook, which is unsafe until this lands.
scope:
  - file: scripts/roadmap/plan_document.py
    action: Modify
    purpose: >-
      Add the optional `implementation_declared` boolean to PlanDocument. Optional and defaulted, so
      the entire existing corpus keeps validating unchanged and no schema_version bump is owed;
      absence means "not yet implemented".
  - file: scripts/checks/_common.py
    action: Modify
    purpose: >-
      Add the content-based plan resolver and retire feat_commit_slugs (defined at :208) once no
      caller remains. The resolver reuses the existing `git show origin/main:<path>` baseline idiom
      from two sibling checks; the genuinely new part is the two-tree comparison.
  - file: scripts/checks/verification/validate_vp_replay.py
    action: Modify
    purpose: >-
      Re-key BOTH legs off commit subjects -- the implement leg at :174 and the plan-only leg's
      co-presence test at :150, which sits inside _plan_only_pr_leg (136-165). Split the output into
      PASS / FAIL / N/A.
  - file: scripts/checks/verification/validate_graduation_completeness.py
    action: Modify
    purpose: Same re-key at :186 and the same three-state split.
  - file: .claude/hooks/edit_scope_guard.py
    action: Modify
    purpose: >-
      Exempt the active plan's own path from the scope denial. The implement flow must now edit the
      plan file to set the declaration; without this, an activated guard would deny that edit
      fail-closed and every future plan would need a boilerplate self-reference in its own Scope.
  - file: .claude/skills/implement/SKILL.md
    action: Modify
    purpose: >-
      Instruct the flow to set `implementation_declared: true` in the plan file BEFORE the mandatory
      full-validation run. Byte-neutral -- 6 bytes of headroom (48196/48202); compress the "Run the
      full gate locally first" preamble, with the Wait-for-CI paragraph as the named fallback target.
  - file: .claude/skills/planning/SKILL.md
    action: Modify
    purpose: >-
      Correct the now-false hermetic-authoring note at :334-337, which tells every future planning
      agent that "the implement PR resolves PLAN-{slug}.yaml from feat({slug}) commits on git log
      origin/main..HEAD". This surface has ZERO bytes of headroom (55788/55788), so the replacement
      must be strictly the same size or smaller -- a replace-in-place that is shorter than the
      sentence it removes.
  - file: tests/roadmap/plan_document/test_optional_fields.py
    action: Modify
    purpose: >-
      Add TestImplementationDeclared beside the existing TestClosesCriteria /
      TestGraduationDisposition / TestFallbackReevaluation classes. At 211 SLOC of a 500 limit this
      module has ample room.
  - file: tests/checks/_common/test_primitives.py
    action: Modify
    purpose: >-
      Add TestImplementationDeclaredResolver; remove the feat_commit_slugs assertion at :173 and the
      one at :188, keeping the origin_main_reachable half of the :187 test, which survives. This
      package is _common.py's mapped 100%-coverage home.
  - file: tests/checks/verification/test_validate_vp_replay.py
    action: Modify
    purpose: >-
      Re-point both legs' tests at the resolver and add TestContentKeyedResolution, including the
      mutation-style meta-test proving a resolved plan with a failing VP step still reddens the check.
  - file: tests/checks/verification/test_validate_graduation_completeness.py
    action: Modify
    purpose: Same re-point plus TestContentKeyedResolution and the same can-this-check-actually-fail meta-test.
  - file: tests/test_edit_scope_guard.py
    action: Modify
    purpose: >-
      Add TestActivePlanSelfEditExempt covering the exemption and confirming out-of-scope files are
      still denied.
  - file: config/agent/verification_registry/registry.yaml
    action: Modify
    purpose: >-
      One row per graduated verification_plan step. Every test_selector row's node_id names a class
      absent at origin/main (verified), so the differential admission gate can discriminate.
bundled_recommendations: []
infrastructure_dependencies: []
acceptance_criteria:
  - >-
    PlanDocument accepts an optional `implementation_declared` boolean; every plan in docs/plans/
    still validates with no edits and no schema_version bump.
  - >-
    scripts/checks/_common.py exposes a resolver returning the plans whose `implementation_declared`
    is true in the working tree and was not true at origin/main, and feat_commit_slugs has no caller
    anywhere under scripts/checks/.
  - >-
    The resolver reads the plan with a raw YAML load, failing loudly only on an OSError or a YAML
    parse error in the WORKING TREE. A plan that parses but fails PlanDocument schema validation is
    NOT a resolver failure -- both checks keep their existing "schema validity is
    validate_plan_documents' concern" SKIP carve-out. A baseline that does not resolve at origin/main
    is a legitimate "not declared at baseline", never an error.
  - >-
    validate_vp_replay resolves BOTH legs from the declaration -- the implement leg and the
    plan-only leg's co-presence test -- so a branch that declares an implementation has its hermetic
    pre-deploy steps replayed regardless of commit topology, including when every content commit is
    an automated checkpoint. The plan-only DEFER outcome and its printed reason survive.
  - >-
    When origin/main is unreachable, the plan-only leg DEFERs every plan (matching today's
    conservative behaviour) and the implement leg SKIPs; no plan is left with no outcome, and neither
    unreachability nor an absent baseline is ever reported as N/A or PASS.
  - >-
    validate_graduation_completeness resolves its implement-PR obligation the same way and is
    likewise independent of commit topology.
  - >-
    Each check's declaration-resolution leg emits three distinct outcomes -- PASS, FAIL, and an
    explicit `N/A` line printed only on positive evidence that no plan declared an implementation in
    this diff. The pre-existing origin/main-unreachable SKIP stays a separate, distinct outcome.
  - >-
    Each check has a mutation-style meta-test proving it can still fail - a resolved plan with a
    failing verification step reddens the check rather than passing.
  - >-
    Neither check reads commit subjects to decide applicability, and no check anywhere fails a branch
    because of what its commit subjects do or do not say.
  - >-
    The stale instruction at .claude/skills/planning/SKILL.md:334-337 no longer describes
    commit-subject resolution, and that file is no larger than its 55788-byte budget.
  - >-
    edit_scope_guard allows an Edit/Write to the active plan's own path and still denies a file
    outside the active plan's Scope.
  - >-
    The implement flow sets the declaration in the plan file before the mandatory full-validation
    run, so the gates resolve it from the working tree without needing any commit to exist.
  - Every graduated verification_plan step has a registry row admitted by the differential gate.
verification_plan:
  - step: 1
    phase: pre-deploy
    action: >-
      Exercise the content resolver -- a plan whose declaration flipped resolves; a plan already
      declared at origin/main does not re-resolve; a diff with no declaration resolves nothing; a
      plan file ABSENT at origin/main resolves as newly-declared rather than erroring; an unreadable
      or YAML-malformed working-tree plan raises rather than returning an empty list; a plan that
      parses but is schema-invalid does NOT raise.
    command: bin/venv-python -m pytest tests/checks/_common/test_primitives.py -q
    expected: "All tests pass; output reports `passed` and no failures."
    fix_if: >-
      A resolver that returns empty on an unreadable working-tree plan reintroduces the
      absence-as-claim defect. One that ERRORS on a baseline-absent plan breaks this plan's own
      implement PR, since its plan file is not on origin/main. One that errors on a schema-invalid
      plan breaks both checks' double-reporting carve-out and their pinned tests.
    hermetic: false
    graduation: graduate
    graduation_check_id: plan-resolution-content-resolver
  - step: 2
    phase: pre-deploy
    action: >-
      Exercise validate_vp_replay's two re-keyed legs, the unreachable-origin behaviour, the
      three-state output, and the mutation-style meta-test proving the check still reddens on a
      genuinely failing VP step.
    command: bin/venv-python -m pytest tests/checks/verification/test_validate_vp_replay.py -q
    expected: "All tests pass; output reports `passed` and no failures."
    fix_if: >-
      If the meta-test passes while the injected failing step is present, the check has become
      incapable of failing and is now decorative -- the exact condition this plan is closing.
    hermetic: false
    graduation: graduate
    graduation_check_id: vp-replay-content-keyed
  - step: 3
    phase: pre-deploy
    action: Same for validate_graduation_completeness -- re-keyed leg, three-state output, can-it-fail meta-test.
    command: bin/venv-python -m pytest tests/checks/verification/test_validate_graduation_completeness.py -q
    expected: "All tests pass; output reports `passed` and no failures."
    fix_if: As step 2 -- a meta-test that cannot redden the check means the gate is decorative.
    hermetic: false
    graduation: graduate
    graduation_check_id: graduation-completeness-content-keyed
  - step: 4
    phase: pre-deploy
    action: >-
      Prove the schema change is backwards compatible -- the new field validates, absence stays
      valid, and the ENTIRE existing plan corpus still passes unmodified.
    command: bin/venv-python -m pytest tests/roadmap/plan_document/ -q && bin/venv-python -m scripts.roadmap.plan_document
    expected: "Tests pass, and every plan reports `validates against PlanDocument schema` with exit 0."
    fix_if: >-
      Any existing plan failing means the field was added as required rather than optional; make it
      optional rather than editing the corpus.
    hermetic: false
    graduation: graduate
    graduation_check_id: plan-document-corpus-back-compat
  - step: 5
    phase: pre-deploy
    action: >-
      Prove the core invariant AND the code-surface retirement structurally -- no module anywhere
      under scripts/checks/ references the commit-subject resolver, so commit-message shape imposes
      no requirement on any branch and the retired helper leaves no stale caller.
    command: test -d scripts/checks && test "$(grep -rl 'feat_commit_slugs' scripts/checks/ --include=*.py | wc -l)" = "0"
    expected: Exit 0 (zero files reference the retired resolver; 4 do today, including its definition).
    fix_if: >-
      A non-zero count means a consumer still keys on commit subjects, or a rewritten docstring names
      the retired symbol while explaining the retirement -- describe the change without naming
      feat_commit_slugs anywhere under scripts/checks/.
    hermetic: true
    graduation: graduate
    graduation_check_id: no-commit-subject-plan-resolution
  - step: 6
    phase: pre-deploy
    action: >-
      Prove the three-state output landed -- each check emits the canonical `N/A` marker, distinct
      from PASS, so a not-applicable outcome is greppable and auditable.
    command: test "$(grep -c 'N/A' scripts/checks/verification/validate_vp_replay.py)" -ge "1" && test "$(grep -c 'N/A' scripts/checks/verification/validate_graduation_completeness.py)" -ge "1"
    expected: Exit 0 (both checks carry the marker; both are 0 today).
    fix_if: >-
      A zero count means the check still prints PASS for the not-applicable case. `N/A` is the
      canonical spelling -- prose elsewhere in this plan writes N-A only to stay YAML-safe.
    hermetic: true
    graduation: waive
    graduation_waiver_reason: >-
      Steps 2 and 3 assert the three outcomes through the checks' real code paths; this grep only
      confirms a marker string is present, so a registry row would guard the spelling rather than the
      behaviour and would go red on any future rewording.
  - step: 7
    phase: pre-deploy
    action: >-
      Prove the implement flow actually sets the declaration -- if this instruction is ever lost,
      implement sessions silently stop declaring and both gates go quietly not-applicable, which is
      this plan's own failure mode reappearing one level up.
    command: test "$(grep -c 'implementation_declared' .claude/skills/implement/SKILL.md)" -ge "1"
    expected: Exit 0 (the flow names the field; 0 occurrences today).
    fix_if: >-
      A zero count means nothing in the documented flow sets the declaration, so every future
      implement PR resolves to N/A and verifies nothing.
    hermetic: true
    graduation: graduate
    graduation_check_id: implement-flow-sets-declaration
  - step: 8
    phase: pre-deploy
    action: >-
      Sweep the instruction surface for the retired mechanism -- the planning skill's
      hermetic-authoring note must no longer tell future planning agents that plans resolve from
      commit subjects -- and confirm the byte budget still holds on a zero-headroom surface.
    command: test "$(grep -c 'commits on .git log origin/main..HEAD' .claude/skills/planning/SKILL.md)" = "0" && test "$(wc -c < .claude/skills/planning/SKILL.md)" -le "55788"
    expected: Exit 0 (the stale sentence is gone -- 1 occurrence today -- and the file is within budget).
    fix_if: >-
      A count of 1 means Layer-4 methodology still describes the retired mechanism. An over-budget
      size means the replacement was longer than the sentence removed; this surface has ZERO bytes of
      headroom, so shorten the replacement rather than taking a raise.
    hermetic: true
    graduation: graduate
    graduation_check_id: planning-skill-no-commit-subject-resolution
  - step: 9
    phase: pre-deploy
    action: >-
      Exercise the scope-guard exemption -- the active plan's own path is allowed, a file outside the
      active plan's Scope is still denied, and the no-active-plan case still allows everything.
    command: bin/venv-python -m pytest tests/test_edit_scope_guard.py -q
    expected: "All tests pass; output reports `passed` and no failures."
    fix_if: >-
      If the exemption widens beyond the single active plan path, the guard stops being fail-closed
      for the case it exists to cover.
    hermetic: false
    graduation: graduate
    graduation_check_id: edit-scope-guard-active-plan-exempt
  - step: 10
    phase: pre-deploy
    action: Run the full local gate before handoff.
    command: bin/venv-python -m scripts.validate
    expected: "Exit 0 with a final `Validation Summary (scope: all)` PASS and no failures."
    fix_if: >-
      Any failure blocks handoff; fix and re-run the full tier from the start. Watch specifically for
      validate_graduation_completeness, which this plan modifies and must satisfy against its own
      change, and for validate_prose_limits on the two zero-or-near-zero-headroom skill surfaces.
    hermetic: false
    graduation: waive
    graduation_waiver_reason: >-
      A command_exit_zero row for the full validator is tautological under scripts/validate.py's own
      _VALIDATE_DEPTH and PYTEST_CURRENT_TEST short-circuit guards -- it exits 0 on both differential
      legs, so the admission gate rejects it as non-discriminating. Established repo disposition.
test_obligations:
  - source: scripts/roadmap/plan_document.py
    behavior: >-
      The optional implementation_declared field validates when present, absence stays valid, and no
      existing plan breaks.
    verification_step: 4
    test_selector: tests/roadmap/plan_document/test_optional_fields.py::TestImplementationDeclared
    red_green_expectation: red before (the field is rejected by extra=forbid), green after.
  - source: scripts/checks/_common.py
    behavior: >-
      The resolver returns plans whose declaration flipped, resolves nothing when none did, treats a
      baseline-absent plan as newly-declared, fails loudly on an unreadable or YAML-malformed
      working-tree plan, and does not fail on a schema-invalid one.
    verification_step: 1
    test_selector: tests/checks/_common/test_primitives.py::TestImplementationDeclaredResolver
    red_green_expectation: red before (the resolver does not exist), green after.
  - source: scripts/checks/verification/validate_vp_replay.py
    behavior: >-
      Both legs resolve from the declaration, unreachable origin/main DEFERs rather than resolving,
      output is three-state, and the check still reddens on a genuinely failing VP step.
    verification_step: 2
    test_selector: tests/checks/verification/test_validate_vp_replay.py::TestContentKeyedResolution
    red_green_expectation: >-
      red before (a checkpoint-only branch with a declaration resolves nothing and no-ops), green after.
  - source: scripts/checks/verification/validate_graduation_completeness.py
    behavior: Same content-keyed resolution, three-state output, and can-it-fail property.
    verification_step: 3
    test_selector: tests/checks/verification/test_validate_graduation_completeness.py::TestContentKeyedResolution
    red_green_expectation: >-
      red before (a checkpoint-only branch with a declaration resolves nothing and no-ops), green after.
  - source: .claude/hooks/edit_scope_guard.py
    behavior: The active plan's own path is allowed; out-of-scope files are still denied fail-closed.
    verification_step: 9
    test_selector: tests/test_edit_scope_guard.py::TestActivePlanSelfEditExempt
    red_green_expectation: red before (the active plan path is denied like any other), green after.
  - source: .claude/skills/implement/SKILL.md
    behavior: The documented flow sets implementation_declared before the mandatory full-validation run.
    verification_step: 7
    command: test "$(grep -c 'implementation_declared' .claude/skills/implement/SKILL.md)" -ge "1"
    red_green_expectation: red before (0 occurrences), green after.
  - source: .claude/skills/planning/SKILL.md
    behavior: >-
      The hermetic-authoring note no longer describes commit-subject plan resolution, and the file
      stays within its zero-headroom byte budget.
    verification_step: 8
    command: test "$(grep -c 'commits on .git log origin/main..HEAD' .claude/skills/planning/SKILL.md)" = "0"
    red_green_expectation: red before (1 occurrence at :336), green after.
  - source: config/agent/verification_registry/registry.yaml
    behavior: Every graduated step has a row that survives the differential admission gate.
    verification_step: 10
    command: bin/venv-python -m scripts.validate
    red_green_expectation: >-
      red before (validate_graduation_completeness fails a graduate step with no new-in-diff row),
      green after.
constraints:
  - No rescue agents or workaround loops (Decision 55). On an unrecoverable failure, stop and RCA.
  - >-
    Commit-message shape must remain UNVERIFIED by this repo. This plan removes a commit-subject
    dependency; it must not introduce a replacement obligation on commit grammar anywhere. No check
    may fail a branch because of what its commit subjects do or do not say.
  - >-
    The declaration must be resolvable from the WORKING TREE via a diff against origin/main, not from
    commit history. The mandatory pre-handoff full-validation run happens before any commit is made,
    so a signal that requires a commit to exist would deadlock it.
  - >-
    Resolver read semantics, pinned three ways because two of them are easy to conflate. (a) Use a
    RAW yaml.safe_load plus a .get lookup -- NOT _common.load_plan, whose PlanDocument validation
    would make a schema-invalid plan redden the resolver and break both checks' deliberate
    "schema validity is validate_plan_documents' concern" carve-out and its pinned tests. (b)
    Fail-loud covers OSError and YAMLError on the WORKING-TREE read only. (c) A baseline that does
    not resolve at origin/main is a legitimate "not declared at baseline" -- brand-new plan files are
    absent there by construction, including THIS plan's own file on its own implement PR.
  - >-
    Guard placement, pinned at BOTH call sites. The origin_main_reachable guard exists today only in
    _implement_pr_leg (validate_vp_replay.py:170); _plan_only_pr_leg (136-165) has none and takes no
    failed list. When origin/main is unreachable the plan-only leg must DEFER every plan, matching
    today's conservative outcome (feat_commit_slugs returns [] on a failed git call). Without this,
    every `git show origin/main:<path>` fails with the same exit 128 the baseline-absent rule reads as
    "not declared", so every declared plan resolves, hands off, and is then SKIPped by the implement
    leg -- neither deferred, replayed, nor labelled with any outcome.
  - >-
    N/A is a positive-evidence outcome and the canonical marker spelling. A check may print it only
    when it has established that no plan declared an implementation in this diff. Note
    _common.get_changed_files() silently falls back to `git diff --name-only HEAD` when the
    origin/main diff fails; that pre-existing second degradation path is out of scope, but do not
    build new N/A semantics on top of it.
  - >-
    The optional field must not force a schema_version bump or any edit to an existing plan. If the
    corpus needs editing, the field was modelled wrong. Do not back-fill the field onto other plans --
    that would fabricate implementation history.
  - >-
    Decision 132's reversal condition authorizes exactly this - revisit the resolution mechanism
    rather than reverting the gate. Do not weaken either gate's failure behaviour while re-keying it.
  - >-
    Byte budgets are binding and one is at ZERO. .claude/skills/planning/SKILL.md is 55788 of 55788 --
    the replacement sentence must be no longer than the one it removes.
    .claude/skills/implement/SKILL.md has 6 bytes (48196/48202); compress the "Run the full gate
    locally first" preamble, and if that is insufficient the named fallback target is the Wait-for-CI
    paragraph, which restates wake-signal detail AGENTS.md already owns. No prose raise; this plan
    mints no Decision to authorize one.
context:
  - >-
    "Decision-scout verdict + CITE list (verbatim decision ids): re-dispatched against THIS scope
    after the predecessor scope's run; verdict and CITE list to be folded in verbatim on return.
    Prior run (predecessor scope, at Decision 169) returned FLAGS_FOUND, 122 of 122 triaged, with
    Decision 127 / 163 / 165 / 168 flags that are MOOT here - this scope adds no ambient prose, takes
    no budget raise, mints no Decision, and creates no registry-without-a-reader."
  - >-
    "gates: decision-scout=re-dispatched against this scope (pending); plan-critique=REVISE after 3
    rounds on the predecessor scope then re-scoped, plus REVISE on rounds 1 and 2 of this scope; the
    round-2 blockers were both in the test-decomposition half, which has since landed on main as a
    separate PR, removing 7 scope entries from this plan"
  - >-
    PREREQUISITE LANDED. The tests/test_plan_document.py decomposition shipped separately and is on
    main as of this rebase. Verified post-rebase - the monolith is gone, tests/roadmap/plan_document/
    exists with 4 modules plus __init__.py, map_source_to_test resolves to tests/roadmap/plan_document
    (the path the mirror algebra actually produces, NOT tests/test_plan_document/), zero registry rows
    still name the deleted file, and test_optional_fields.py sits at 211 SLOC of a 500 limit. Both of
    round 2's blockers are dissolved rather than worked around, and this plan drops from 19 scope
    entries to 13.
  - >-
    THE DEFECT, stated precisely. Both gates locate the plan they verify by scanning commit subjects
    on `git log origin/main..HEAD` for feat({slug}) (scripts/checks/_common.py:208 feat_commit_slugs,
    consumed at validate_vp_replay.py:150 and :174 and validate_graduation_completeness.py:186 --
    line numbers re-verified post-rebase, the checks were untouched by the 18 commits main advanced).
    When no such subject is found, neither fails - each prints a no-op PASS. That is deliberate,
    because most PRs legitimately implement no plan. The consequence is that the checks use the
    ABSENCE of a signal as a claim, and absence has two indistinguishable causes - genuinely
    plan-less, or plan-implementing with the marker destroyed. No predicate over {marker present?}
    can separate them. Decision 132 disclosed this as an accepted rare false negative; any automated
    commit-writing mechanism makes it systematic.
  - >-
    WHY CONTENT AND NOT COMMITS. The asymmetry that makes this work - an automated `git add -A`
    DESTROYS commit-subject signals (by leaving the intended marker commit empty) while PRESERVING
    tree content. Moving the applicability signal into the plan file therefore makes it robust to any
    commit topology. This is explicitly NOT the diff-based resolution Decision 132 rejected - that
    was heuristic inference from which source files changed. This is an explicit, schema-validated
    declaration that merely travels in the diff.
  - >-
    PARTIAL REUSE, stated honestly. validate_vp_replay.py:145 already resolves plans from the diff via
    _common.plan_paths_from_changed(changed_files) for its plan-only leg, and the
    `git show origin/main:<path>` baseline read is the established idiom in two sibling checks. What
    is genuinely NEW is the two-tree comparison primitive that combines them.
  - >-
    RESOLVER SPECIFICATION, pinned so no improvisation is needed. Candidate set - the plan files
    already present in `changed_files` (reuse plan_paths_from_changed), NOT a whole-docs/plans scan,
    which would cost a `git show` per plan. Signature - widen `_implement_pr_leg(root, failed)` to
    accept `changed_files`, matching the seam both test suites already inject. Placement - inside the
    origin_main_reachable guard at both call sites (see the guard-placement constraint). Comparison -
    working tree true AND baseline not-true, where baseline not-true covers both "false" and "file
    absent at origin/main". Read - raw yaml.safe_load, never load_plan.
  - >-
    NO COST TO LOSING feat({slug}). Branch commit subjects never reach main - the merging agent
    composes the squash commit message at merge time (the audit found implement/SKILL.md's "inherits
    the PR body" claim empirically false). Every other feat({slug}) mention in the repo (AGENTS.md,
    implement/SKILL.md's commit flow, the PR template) is a CONVENTION, never a resolution. So once
    nothing resolves plans from feat(), its absence has no downstream consumer. --allow-empty on
    marker commits remains optional hygiene at most and is deliberately NOT in scope.
  - >-
    REJECTED ALTERNATIVES, all three from the predecessor plan. (A) A new guard requiring any
    recognised commit prefix when checkpoint commits are present - catches total loss only, misses the
    partial case, and passes while both gates still no-op. (B) The same guard demanding feat()
    specifically - fails every legitimately plan-less PR, including planning and audit PRs. (C) The
    same predicate relocated into the two existing checks - identical false positives to (B), since
    any turn-boundary mechanism fires on planning sessions too. The decisive objection to all three is
    that each would make commit-message shape a VERIFIED requirement, which this repo has deliberately
    never had - no conformance gate exists, and the only surfaces touching commit subjects use them
    for resolution, never verification.
  - >-
    FABLE ADVICE-CONSULT informed this design. Industry framing - this is a vacuous-pass / fail-open
    gate problem; the prescription is three-state semantics (PASS / FAIL / NOT-APPLICABLE) where
    not-applicable requires positive evidence of inapplicability, plus mutation-style validation that
    the gate can still fail. Precedent - pytest exits 5 on no-tests-collected, Terraform's
    -detailed-exitcode separates no-changes from success, and selection-based CI systems treat the
    selector as trusted computing base keyed on structural inputs, never free-text convention. One
    piece of that advice is deliberately NOT adopted - it proposed retaining feat({slug}) as a
    consistency tripwire (declaration-without-marker fails), but that re-introduces a commit-shape
    obligation to protect a marker that is no longer load-bearing.
  - >-
    DISCLOSED RESIDUAL -- the successor seam. The new signal is robust to commit topology but is still
    written by the same agent at the same step as the old one, so an implement session that skips the
    plan-file edit entirely yields a silent N/A on both gates. This is strictly narrower than the
    defect being closed (which fired by accident, with no agent omission required), but it is not
    zero. VP step 7 guards the instruction's presence; nothing guards an agent ignoring it. Recorded
    per Decision 132's precedent of stating residual limitations explicitly.
  - >-
    SCOPE-GUARD INTERACTION. .claude/hooks/edit_scope_guard.py denies fail-closed for any file outside
    the active plan's Scope, and this plan makes the implement flow edit the plan file itself. The
    guard is inert today (re-verified post-rebase - nothing sets CLAUDE_ACTIVE_PLAN and no
    .claude/active_plan marker exists), so this is pre-emptive - but without the exemption, activation
    would later break every implement session unless each plan listed its own path in its own Scope,
    boilerplate that fails closed when forgotten.
  - >-
    GRADUATION ADMISSION RULE. validate_verification_registry re-runs each added row against an
    origin/main worktree AND live, rejecting any row that passes on both. A test_selector row naming a
    WHOLE FILE that already exists at origin/main passes on both legs and is rejected. Every
    test_selector node_id in this plan therefore names a class VERIFIED absent at origin/main --
    TestImplementationDeclared, TestImplementationDeclaredResolver, TestContentKeyedResolution (both
    files), TestActivePlanSelfEditExempt (all confirmed 0 occurrences at origin/main). Steps 5, 7 and
    8 are grep_count rows and discriminate cleanly (4 to 0, 0 to >=1, 1 to 0).
  - >-
    SURFACE-RETIREMENT OBLIGATION (12k trigger 2) fires on the mechanism cutover even with no Delete
    row, and is satisfied by two sweeps - VP step 5 covers the code surface (no feat_commit_slugs
    reference anywhere under scripts/checks/, including its own definition) and VP step 8 covers the
    instruction surface (the planning skill's stale note).
  - >-
    Branch was 18 commits behind origin/main and was rebased onto it at the human's direction before
    this rewrite; overlapping scope files - .claude/skills/planning/SKILL.md and
    config/agent/verification_registry/registry.yaml both changed on main, and every premise was
    re-verified post-rebase rather than assumed. Two changed materially - planning/SKILL.md dropped
    from 6 bytes of headroom to ZERO (55788/55788), and the decision corpus grew from 169 to 172,
    which is why decision-scout was re-dispatched.
  - >-
    DEFERRED, and unsafe to build before this lands - a turn-boundary Stop hook that commits and
    pushes checkpoint work so an ephemeral container cannot lose it. Its full design, the harness
    Stop-hook interaction, the public-repo exposure of `git add -A` (checkpoint pushes are irrevocable
    publication - unreachable commits stay fetchable by SHA after branch deletion), and a T4.1
    progress_note recording the executor-side step-wrapper contract against CD.43's existing
    option_set entry git_as_store_commit_at_step_boundaries, all move to that follow-on plan. Also
    deferred - switching branch integration from rebase to merge, and substrate-owned freshness (a
    SubagentStart / UserPromptSubmit TTL-guarded fetch retiring the fetch instructions embedded in
    gate dispatch prompts). rec-2362 is unbundled and returns to the open queue.
pre_implementation_checklist:
  - Branch confirmed not on main
  - docs/PROJECT_CONTEXT.md read
  - only the plan-cited decision sections
  - All files in scope located and readable
  - Acceptance criteria understood and verifiable
  - >-
    Read validate_vp_replay.py and validate_graduation_completeness.py IN FULL before editing -- both
    have a two-leg structure, and validate_vp_replay's plan-only leg (136-165) contains a
    feat_commit_slugs call at :150 that is easy to miss when re-keying only the obvious implement leg
    at :174.
  - >-
    Measure both skill surfaces before and after editing; planning/SKILL.md has ZERO bytes of headroom.
execution_steps:
  - >-
    Add the optional `implementation_declared: bool = False` field to PlanDocument in
    scripts/roadmap/plan_document.py. Optional and defaulted, so the existing corpus validates
    untouched; do not bump schema_version.
  - >-
    Add the content resolver to scripts/checks/_common.py per the pinned RESOLVER SPECIFICATION -
    candidate set from plan_paths_from_changed(changed_files), baseline read via
    `git show origin/main:<path>`, working-tree true AND baseline not-true, read with a raw
    yaml.safe_load. Fail loudly on OSError or YAMLError from the working-tree read only; treat a
    non-resolving baseline as not-declared and a schema-invalid plan as not-a-resolver-concern.
  - >-
    Re-key BOTH of validate_vp_replay's legs. The implement leg at :174 resolves from the declaration.
    The plan-only leg's co-presence test at :150 -- inside _plan_only_pr_leg (136-165) -- becomes
    declaration-based too - a plan in the diff whose declaration flipped hands off to the implement
    leg, everything else DEFERs with its printed reason preserved. Add the origin_main_reachable guard
    to the plan-only leg so an unreachable baseline DEFERs everything rather than resolving everything.
    Split the output into PASS, FAIL and an explicit `N/A` line, keeping SKIP distinct.
  - >-
    Re-key validate_graduation_completeness at :186 the same way, with the same three-state split and
    the same preservation of its existing SKIP and schema-error carve-out semantics.
  - >-
    Retire feat_commit_slugs from scripts/checks/_common.py (defined at :208) once neither check calls
    it. Describe the retirement in the rewritten docstrings WITHOUT naming the symbol anywhere under
    scripts/checks/, or VP step 5's sweep goes red on the docstring itself.
  - >-
    Exempt the active plan's own path in .claude/hooks/edit_scope_guard.py -- resolve the active plan
    path and allow an edit whose target is exactly that file, leaving every other denial intact.
  - >-
    Update .claude/skills/implement/SKILL.md so the flow sets `implementation_declared: true` in the
    plan file BEFORE the mandatory full-validation run. Absorb the bytes by compressing the "Run the
    full gate locally first" preamble; if insufficient, compress the Wait-for-CI paragraph, which
    restates wake-signal detail AGENTS.md already owns.
  - >-
    Rewrite .claude/skills/planning/SKILL.md:334-337 so it describes declaration-based resolution
    instead of feat({slug}) commits on git log origin/main..HEAD. This surface has ZERO bytes of
    headroom - the replacement must be no longer than the sentence it replaces.
  - >-
    Update the five test files - resolver cases (including baseline-absent and schema-invalid), both
    re-keyed legs, the unreachable-origin DEFER behaviour, three-state assertions, the scope-guard
    exemption, the two mutation-style meta-tests, and the two feat_commit_slugs assertions in
    tests/checks/_common/test_primitives.py at :173 and :188 (keep the origin_main_reachable half of
    the :187 test, which survives). New classes must be named exactly as the test_obligations declare,
    since the graduated registry rows depend on those node_ids being absent at origin/main.
  - >-
    Add one config/agent/verification_registry/registry.yaml row per graduated step, each carrying
    plan_slug plan-resolution-content-keyed. If a row genuinely cannot discriminate between the
    pre-change and post-change trees, reclassify that step to waive with a substantive reason rather
    than weakening the row.
  - >-
    Execute the Verification Plan -- run each step; loop until pass; on unrecoverable failure stop and
    RCA (Decision 55).
  - >-
    Report - what was implemented, verification results, and explicit confirmation that a branch whose
    content commits are all automated checkpoints still has its VP steps replayed.
rollback: >-
  Single-PR revert. The change is self-contained - the new field is optional and unused by anything
  else, and reverting restores commit-subject resolution exactly as it stands today. No data
  migration, no external state, and no other plan depends on the field until the deferred
  checkpoint-hook plan lands.
