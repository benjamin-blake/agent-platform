constraints:
  - No rescue agents or workaround loops (Decision 55). On an unrecoverable V3 failure, stop and RCA.
  - >-
    Agents never self-direct a terraform apply. terraform/personal applies via CI behind the
    tf-gated-apply Environment; terraform/github is operator-directed (plan presented, human
    accepts, then apply); terraform/bootstrap is human-only -- the agent files a rec and stops.
  - >-
    Do NOT add terraform/github or terraform/bootstrap to any auto-apply workflow. The guard is
    AWS-IAM-only and has zero github_* awareness, so a ruleset diff would classify as safe to
    auto-apply. Bringing that channel into CI is deliberately deferred to rec-3126.
  - >-
    Never rename any AWS resource. agent-platform-* IAM roles, the agent-platform-data-lake
    bucket, /agent-platform/* SSM paths, the agent_platform Glue database and profile, and all
    Lambda names stay exactly as they are. Decision 101's other point-(b) rows remain frozen.
  - >-
    The relicense is FORWARD ONLY. Every version published up to the flip commit remains
    Apache-2.0 irrevocably; make no retroactive claim anywhere in LICENSE, NOTICE, README or
    Decision 171.
  - >-
    Do not rewrite historical old-slug references in docs/DECISIONS.md run URLs, archived
    docs/plans/, docs/INTENT-*.md, docs/audit-prompts/ or audits/. Redirects keep them resolvable
    and audits/ deliverables are sealed.
  - >-
    Do not raise any budget. terraform/github/CLAUDE.md sits at exactly its prose budget, so its
    edit must be a net-neutral-or-shrinking substitution; docs/PROJECT_CONTEXT.md has 36 bytes of
    headroom. No # raise-approved marker is authored by this plan.
  - >-
    The rename moment requires a quiet window: no in-flight PRs, no pending gated-apply approval
    holding the concurrency group, and a green convergence record before the apply.
  - >-
    Do not author a local terraform init/validate/plan command. Neither terraform nor gh is
    installed in the DEV container; CI's required terraform-validate check and the
    speculative-plan job are the authoritative verifiers.

context:
  - >-
    "Decision-scout verdict + CITE list (verbatim decision ids)": round 1 BLOCK (Decision 166
    structural-size, resolved by the PR #906 terraform decomposition landing on main); round 2
    FLAGS_FOUND, 123 of 123 triaged. CITE list: Decision 48, Decision 55, Decision 75, Decision
    77, Decision 83, Decision 84, Decision 92, Decision 93, Decision 94, Decision 98, Decision
    101, Decision 111, Decision 119, Decision 126, Decision 127, Decision 128, Decision 131,
    Decision 132, Decision 144, Decision 150, Decision 158, Decision 163, Decision 165, Decision
    166, Decision 167, Decision 169, Decision 170.
  - >-
    "gates: decision-scout=FLAGS_FOUND (round 2, after a round-1 BLOCK); plan-critique=<verdict>
    after <N> round(s)" -- plan-critique runs as a multi-perspective panel with a 3-round
    convergence rule at explicit human direction, not the single-agent default.
  - >-
    Decision 101 already ratifies Theseus as the platform's external brand and records
    theseus.support as owned, but its point (b) freezes the repository name as an internal
    identifier "not to be altered without a separate explicit decision" and defers the deep rename
    post-MVP. Decision 171 is that explicit decision: it promotes ONLY the repository-name row into
    the presentation layer and re-affirms every other (b) row as frozen.
  - >-
    Decision 101 point (f) defers "a paid service offering" as separately gated. Decision 171
    discharges that gate for the licence half only -- it authorises dual licensing, not a built
    commercial surface.
  - >-
    Header budget: docs/DECISIONS.md carries 123 live H2 entries against a 132 ceiling. A single
    entry was chosen over splitting rename and relicence at explicit human direction; the entry
    therefore carries a split reversal stanza so either half can be reversed independently.
  - >-
    BUSL-1.1 was chosen over AGPL and FSL because its default text restricts PRODUCTION USE,
    reaching internal for-profit use by third parties that copyleft and non-compete licences do
    not. Parameters: Licensor "Benjamin Blake"; Change License Apache-2.0; Change Date = flip date
    + 4 years (BUSL's cap) pinned to the first of the following month; Additional Use Grant is a
    clarifying restatement of BUSL's baseline permitting non-production use, personal research,
    evaluation and development. Canonical licence text: https://mariadb.com/bsl11/ -- reproduce
    verbatim, filling only the Parameters block.
  - >-
    GitHub's licence detector (licensee) is backed by choosealicense.com, which does NOT include
    BUSL-1.1 despite it being a valid SPDX identifier. Do not gate anything on a licence badge
    appearing; record whatever .license.spdx_id returns as an observation, not a failure.
  - >-
    NOTICE anchors on the last pre-flip commit SHA AND states a self-verifying rule (any snapshot
    whose root LICENSE is the Apache text is Apache-licensed) so the boundary survives squash-merge
    SHA churn. Verify the SHA immediately before the final push (VP step 6).
  - >-
    The in-place rename is deliberate over a fresh repository: a new repo confers no additional
    legal protection, since the published Apache snapshot stays Apache for whoever holds it, while
    destroying the public track record and the PR/commit reference graph the decision log depends
    on. Record this in Decision 171.
  - >-
    Deployment design informed by a Fable advice-consult (2026-08-14). Its ordering is adopted:
    bootstrap trust first (the riskiest edit, made while everything is healthy and locally
    repairable), personal-root trust second, live verification third, rename fourth, trust
    narrowing last. Its headline recommendation -- rename via the GitHub API rather than Terraform
    -- was NOT adopted: its central premise (that terraform/github is un-initable from the admin
    container) was refuted by an operator diagnostic on 2026-08-14 showing init succeeds,
    integrations/github v6.12.1 signature-verified, state readable with 5 managed resources.
  - >-
    Safety property of the ordering: no step leaves the system with CI broken AND the repair
    requiring CI. Before the rename every apply runs under a fully working old-slug CI. After it,
    either trust is correct or the recovery is an owner-executed rename-back needing neither CI nor
    Terraform, because the old-slug subs are still trusted. Irreversibility begins only at VP step
    22, which is gated on step 21's live proof of all five roles.
  - >-
    github_repository.name is NOT ForceNew: the provider calls Repositories.Edit() then
    d.SetId(repo.GetName()), handling rename natively. github_repository_ruleset.repository is not
    ForceNew either. The expected plan is in-place updates across the five resources referencing
    github_repository.this.name; any destroy or replace of github_repository.this is an ABORT
    (prevent_destroy = true would block it regardless). Documented fallback if the reviewed plan is
    wrong: abort and rename via the GitHub API, accepting a state rm + re-import reconcile debt.
  - >-
    Decision 119's premise is STALE as of 2026-08-14: an operator diagnostic found
    terraform/personal init succeeds with kislerdm/neon installed self-signed and no mirror, and
    the github.com release-asset URLs Decision 119 names as permanently 403ing all return 200 --
    only the HTML browse page still 403s. This plan does NOT rely on that finding (one container,
    one moment; the boundary has moved before) and keeps every terraform step CI-delegated. File a
    follow-on rec at implement time so the docs resting on that premise are re-grounded.
  - >-
    Follow-on recs to file at implement time (do not expand this plan's scope): commercial-contact
    routing once theseus.support exists (ROADMAP-SEMANTO S1.2/S1.3, deferred_post_mvp); the stale
    Decision 119 premise above; the deploy-paths.yaml misclassification of terraform/github as a
    "hashicorp/*-only root" when it uses integrations/github; and the stale pre-Decision-94 comment
    at terraform/github/environments.tf:21-22 asserting "the sub is still refs/heads/main".
  - >-
    Already filed: rec-3126, bringing terraform/github onto a governed plan + always-gated-apply CI
    channel. Deliberately deferred past this plan so a brand-new apply channel's first exercise is
    not the change that can break every OIDC trust claim in the repo.
  - >-
    The class-(a) / class-(b) split is load-bearing and must be encoded as an explicit path
    allowlist in validate_licence_consistency, never a repo-wide grep: roughly twenty legitimate
    bare "agent-platform" occurrences are AWS naming (SSM paths, Project tags, terraform variable
    defaults) that must NOT be rewritten.
  - >-
    PR ORDERING (revised at critique): sweep + trust cleanup runs BEFORE the relicense, not after.
    Leaving PR-3 as licence drafting would have parked BUSL parameterisation and an advisory legal
    review inside the window where trust is still dual and the old slug is un-narrowed. The user's
    hard constraint (rename FIRST, relicense SECOND) is unaffected -- the relicense still lands
    after the rename. The new check ships with the relicense, so its slug-staleness red-green is
    demonstrated by fixtures in the mirror test rather than by tree state.
  - >-
    Change Date rounds DOWN to the exact four-year anniversary of the flip, never up. An earlier
    draft said "pinned to the first of the following month", which would have pushed the date up to
    ~30 days PAST the anniversary and breached BUSL-1.1's own cap. A published version's Change
    Date may only ever be moved EARLIER, never later -- moving it later is the same retroactive
    claim the forward-only rule forbids in the other direction.
  - >-
    The boundary file is LICENSING.md, deliberately NOT NOTICE. Pre-flip snapshots are
    Apache-licensed and Apache-2.0 section 4(d) gives a root NOTICE file a specific redistribution
    obligation; putting BUSL boundary prose there is genuinely ambiguous for a downstream Apache
    licensee. Its self-verifying rule must be provenance-scoped ("any commit of THIS repository AS
    PUBLISHED BY THE LICENSOR at or before <SHA>/apache-final") -- an unscoped rule keyed on the
    content of a mutable LICENSE file lets a post-flip BUSL licensee revert it and self-certify
    Apache.
  - >-
    RESOLVED (operator decision, post-critique): the Additional Use Grant stays a clarifying
    restatement of BUSL's baseline AND carries an explicit non-limitation clause. The licensing
    critique's objection was that BUSL's grant slot exists to permit LIMITED PRODUCTION use, so an
    enumerated list there invites an expressio unius reading -- the enumeration taken as exhaustive,
    NARROWING the baseline the body already grants. The operator's fix is the standard drafting
    remedy rather than a switch to "None": state that the enumeration is illustrative and not
    exhaustive, and that it neither limits nor qualifies the rights granted by the licence body.
    That preserves the evaluator-facing clarity the restatement was chosen for (dec-111's curated
    portal serves exactly that audience) while removing the narrowing risk. Draft it so the
    non-limitation sentence sits INSIDE the Additional Use Grant parameter value, not as a floating
    note elsewhere in the file -- a clause in a different section does not qualify the parameter.
    VP step 4 asserts the non-limitation language is present, so this cannot be silently dropped
    during drafting. Flag it to the external legal reviewer as one of the named items.
  - >-
    Sole-copyright-ownership premise is UNVERIFIED and must not be silently assumed. GitHub ToS
    inbound=outbound puts contributions under the outbound licence (BUSL), which confers no right
    to sublicense commercially -- hence CONTRIBUTING.md. The clone here is SHALLOW (60 commits from
    2026-08-04) so repo-wide authorship cannot be measured from it; in that window 59 of 60 commits
    are authored by Benjamin Blake, 1 by "Claude <noreply@anthropic.com>", and 54 carry a
    Co-Authored-By trailer. Record the provenance question in Decision 171 and file a rec for a
    real CLA/DCO mechanism rather than treating a README sentence as sufficient.
  - >-
    Additional follow-on recs to file at implement time: a dependency-licence audit (benign while
    outbound is Apache-2.0, NOT benign once a commercial licence is sold -- blocking before any
    sale, not before the flip); and a real CLA/DCO mechanism per the row above.
  - >-
    Decision 171 must record why Apache-2.0 is an acceptable BUSL Change License: BUSL-1.1 requires
    the Change License be GPL-compatible, and Apache-2.0 is GPLv3-compatible (not GPLv2). This is
    well-precedented but the reasoning is currently nowhere in the repo.
  - >-
    CI-DELEGATION CLAIM, QUALIFIED (critique-gate finding). This plan discounts the 2026-08-14
    terraform/personal init diagnostic as one-container/one-moment, yet PR-2's terraform/github plan
    is NOT CI-delegable -- that root has no CI path by this plan's own constraint -- and depends on
    initing integrations/github, a third-party github.com-hosted provider, i.e. exactly the class
    Decision 119 calls blocked. The single most consequential apply therefore rests on the
    diagnostic class discounted elsewhere. That asymmetry is why the GitHub-API rename is a
    first-class execution branch in PR-2, not a footnote.
  - >-
    Branch was rebased onto origin/main e86c271 at authoring time; preflight reported 0 commits
    behind, 0 ahead, no uncommitted changes, and an empty ci_rca_unresolved_recs list.

pre_implementation_checklist:
  - Branch confirmed not on main
  - docs/PROJECT_CONTEXT.md read
  - only the plan-cited decision sections
  - All files in scope located and readable
  - Acceptance criteria understood and verifiable
  - Operator confirms a quiet window -- no in-flight PRs, no pending gated-apply approval
  - Operator confirms admin-container access for the two bootstrap applies and the rename apply
  - External legal review of the BUSL parameters offered to the operator (advisory, non-blocking)

execution_steps:
  - >-
    PR-1 (dual trust). Convert local.github_repo to local.github_repos in terraform/personal/oidc.tf
    and terraform/bootstrap/github_ci_apply.tf; expand every sub site in oidc_ci_roles.tf (branch 2,
    pr 2) and oidc_pipeline_roles.tf (planner 3, deploy 1) to iterate the list; expand the apply
    role across both Decision 94 sub forms. Run VP steps 1-3 and 13, then open the PR.
  - >-
    PR-1 apply, part A (operator, human-only). File a rec describing the bootstrap change and STOP.
    A human applies terraform/bootstrap from the admin container with the agent_platform_admin
    profile after reviewing the plan. Then run VP step 15. Bootstrap goes FIRST, deliberately.
  - >-
    PR-1 apply, part B (CI). Merge the PR; the trust diff trips the guard to exit 2 and routes to
    the gated-apply job. The operator approves the tf-gated-apply Environment. Then run VP steps 14
    and 16. Do not proceed while either is red.
  - >-
    PR-2 (rename). Flip repository_name to theseus in terraform/github/variables.tf and make the
    net-neutral substitution in terraform/github/CLAUDE.md. Run VP step 13, open and merge the PR.
  - >-
    PR-2 apply (operator-directed, admin container). Resolve the tf-gated-apply reviewer id FIRST
    -- gated_apply_reviewer_user_ids has no default and its validation rejects an empty list, and
    the runbook's `gh api /user --jq .id` will not work (gh absent, api.github.com egress-blocked
    from DEV); use the admin container or the GitHub MCP get_me tool. Then
    terraform -chdir=terraform/github plan with the documented vars. PRESENT the plan and STOP.
    Expected shape: in-place updates only. ABORT on ANY of: a destroy, replace or import action on
    ANY of the five resources referencing github_repository.this.name
    (github_repository.this, github_repository_ruleset.main_protection,
    github_actions_repository_permissions.this, github_workflow_repository_permissions.this,
    github_repository_environment.tf_gated_apply); any diff to the Environment's reviewers; any
    change to required_status_checks. Only after explicit human acceptance, apply.
  - >-
    PR-2 apply, FALLBACK BRANCH (first-class, not a footnote). If terraform init cannot resolve
    the integrations/github provider in the admin container, or the presented plan trips any abort
    condition above, do NOT force it: the owner renames via GitHub Settings or
    PATCH /repos/benjamin-blake/agent-platform with {"name":"theseus"}. This is atomic and
    Terraform-independent. It leaves terraform/github state drifted (the github_repository state ID
    is the repo NAME), which nothing detects -- terraform-drift.yml is WORKDIR: terraform/personal
    only -- so file a rec immediately for the state reconcile (expect state rm + re-import) and do
    not run a routine terraform/github apply until it is done, or that apply will silently rename
    the repository forward again.
  - >-
    After either branch: run VP steps 17, 18, 19 and 20, then assert a clean (no-op)
    terraform/github plan so state and reality agree before anything else touches that root.
  - >-
    Live-exercise all five roles under the new slug per VP step 21 -- trivial PR opened and merged,
    a terraform-drift cycle, a governed Lambda deploy, and one gated apply or Reconcile. This gates
    everything after it.
  - >-
    PR-4 (relicense + decision) -- LAST. Fetch the canonical BUSL-1.1 text and fill only its Parameters
    block; move the current Apache text verbatim to LICENSE-APACHE; write NOTICE with the SHA and
    the self-verifying rule; add the COMMERCIAL-LICENSE.md placeholder and its prose_allowlist row;
    rewrite README's H1, License section and CLA note; name the project in PROJECT_CONTEXT. Author
    Decision 171 with its Decision 167 envelope (amends [101]) AND the reciprocal forward-pointer
    inside Decision 101. Re-check the next free decision number at execution time -- a concurrent
    PR may have claimed 171. Run VP steps 4-7, 12 and 13, then open and merge the PR.
  - >-
    PR-3 (sweep, cleanup, guard) -- runs BEFORE the relicense so dual trust is narrowed promptly
    after step 21 rather than waiting on licence drafting and legal review. Update the class-(a)
    slug sites. Write
    validate_licence_consistency with an explicit class-(a) path allowlist, an examined() count
    declaration, and both invariants; register it across all seven surfaces including the
    verification-registry row for graduated step 3 and the ci_rca_taxonomy row; write the mirror
    test to 100% line coverage. Remove the old-slug subs from both trust roots. Run VP steps 8-13,
    then open the PR.
  - >-
    PR-3 applies. Bootstrap contraction is again operator-only (file a rec, STOP, human applies);
    the personal-root contraction routes through gated-apply as before. Then run VP step 22.
  - >-
    Post-merge: run VP step 23 to sync Decision 171 to ops_decisions, and file the four follow-on
    recs named in Context. Confirm rec-3126 remains open and unbundled.
  - >-
    Execute the Verification Plan -- run each step; loop until pass; on unrecoverable V3 failure
    stop and RCA (Decision 55).
  - 'Report: what was implemented, verification results'

rollback: >-
  BEFORE VP step 22 (trust narrowing) rollback is cheap and needs neither CI nor Terraform: the
  owner renames theseus back to agent-platform via Settings or PATCH /repos. The old-slug subs are
  still trusted because cleanup has not run, so CI resumes on the next run. Clear any red
  convergence record via the acknowledge-and-retry unlatch, and route ci_rca recs raised during the
  broken window through normal review (Decision 55/72, forward-fix, never auto-revert).
  AFTER step 22 a rename-back is NOT a self-contained recovery, and an earlier draft of this plan
  was wrong to claim it was. Only github_ci_apply lives in the admin-local bootstrap root; the
  OTHER FOUR roles live in terraform/personal, whose sole sanctioned apply channel is
  terraform-apply-sandbox.yml -- which must authenticate as repo:benjamin-blake/agent-platform,
  precisely the sub step 22 deleted. Renaming back post-22 therefore CREATES the forbidden state
  this plan's ordering exists to avoid: CI broken, and the repair running through CI. Post-22 the
  sanctioned recovery is FORWARD-FIX under theseus. If a rename-back is genuinely unavoidable it
  requires an out-of-band operator apply of terraform/personal from the admin container re-adding
  the old-slug subs -- outside Decision 126's routine model, so it is break-glass requiring
  explicit human direction, and it must be pre-authorised BEFORE step 22 runs, never improvised
  after. This asymmetry is the reason step 22 is gated on step 21's CloudTrail proof of all five
  roles.
  The relicense half rolls back independently by reverting its own PR; note that any version
  already published under BUSL-1.1 stays available under BUSL-1.1 to whoever holds it, exactly as
  the forward-only rule cuts the other way.
