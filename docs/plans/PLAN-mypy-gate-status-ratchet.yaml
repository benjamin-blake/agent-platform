rollback: >-
  Fully revertible in one commit with no external state to unwind: the only out-of-repo write is
  the ops_decisions projection from --backfill-decisions-md, which is an append-only SCD2 ETL
  from docs/DECISIONS.md and re-converges on the next backfill after a revert. Reverting restores
  the informational `_scaffold_mypy_full` scaffold and deletes config/mypy_baseline.yaml,
  scripts/checks/typing/, and tests/checks/typing/. If only the ENFORCEMENT needs backing out
  while the governance stands, drop `_c("validate_mypy_ratchet")` from
  registry.full_sequence() and leave the baseline file and tamper guard in place -- the roster
  then survives as a measured, tamper-guarded record of the debt with no gate, which is a
  strictly better resting state than the pre-plan status quo and requires no Decision reversal.
