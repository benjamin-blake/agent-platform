schema_version: 3
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: "mypy-gate-status-ratchet"
intent: >-
  Close audit finding VTS-15 by giving mypy an owned gate status: Decision 161 records the
  human's choice of an error-count DOWNWARD-RATCHET, and the enforcement lands with it -- a
  governed per-file baseline plus a registered check that fails on an unmarked increase and
  always allows decreases. Converts "type hints required" (AGENTS.md) from an unenforced
  style mandate into a mechanical, monotonically-improving gate.
plan_type: IMPLEMENTATION
verification_tier: V2
plan_path: docs/plans/PLAN-mypy-gate-status-ratchet.yaml
phase: >-
  Audit remediation of VTS-15 (audits/validate-test-suite-4df4d48.yaml, severity medium,
  confidence CONFIRMED, effort S, roadmap_crossref.classification novel with item_ids: []).
  Soft-warn category: user_explicit_out_of_scope -- no tier_item exists for mypy/typing gate
  status (grep of docs/ROADMAP-PLATFORM.yaml for mypy/typing/type-hint returns zero hits), so
  the Tier Item Freshness Gate does not fire. VTS-15's acceptance clause is "A Decision names
  mypy's gate status; if (ii)/(iii), the corresponding check lands with it" -- this plan
  discharges both halves in one PR.
scope:
  - file: pyproject.toml
    action: Modify
    purpose: >-
      Add a MINIMAL [tool.mypy] block -- python_version = "3.12" and
      disable_error_code = ["import-untyped"]. No [tool.mypy] configuration exists anywhere in
      the repo today (verified: pyproject.toml carries only tool.pytest.ini_options, tool.ruff,
      tool.ruff.lint, tool.coverage.run, tool.coverage.report; no mypy.ini / setup.cfg /
      .mypy.ini exists). MEASURED THIS SESSION, both options tried against the same tree:
      `disable_error_code = ["import-untyped"]` and `ignore_missing_imports = true` produce the
      IDENTICAL reduction -- `mypy scripts/ src/` falls 262 errors/147 files -> 127 errors/57
      files, and `mypy src/` falls 143/59 -> 82/28. Choose disable_error_code because it is
      SURGICAL: it silences only the missing-third-party-stub category (yaml, pandas, psycopg2,
      networkx, boto3, botocore) and leaves [import-not-found] LIVE, so a typo'd or deleted
      INTERNAL import still fails the ratchet. `ignore_missing_imports = true` would suppress
      both categories and silently swallow that real-defect class -- a strictly worse trade for
      identical noise reduction. Zero [import-not-found] errors exist today (verified), so this
      leaves no hidden debt. Residual error-code mix after silencing (measured): 28 assignment,
      26 union-attr, 23 arg-type, 21 attr-defined, 6 var-annotated, 6 call-arg, 4 misc, 4 index,
      3 no-redef, 1 each type-var/str-unpack/return -- genuine type-logic debt, which is exactly
      what the ratchet must track.
  - file: config/mypy_baseline.yaml
    action: Create
    purpose: >-
      The governed baseline: a PER-FILE error-count registry, `entries: {repo-relative path:
      int}`, seeded AFTER the pyproject block lands (ordering is load-bearing -- seeding first
      would bake ~135 stub-noise errors into the roster). Seeds to 57 entries summing to 127
      (44 scripts/ files, 13 src/ files); the dirtiest single entry is
      scripts/execute_recommendation.py at 28. PER-FILE rather than a single repo-wide total
      because a bare total lets "fixed 5 in file A, added 5 in file B" pass silently, gives no
      blame locality, and -- decisively -- has nowhere to hang the per-entry approval marker
      that the SLOC/coverage precedents put on the changed line. A file with NO entry carries an
      implicit baseline of 0 (any error fails), exactly mirroring how an unregistered file
      carries the implicit 500 in config/sloc_budgets.yaml and the implicit 100.0 in
      config/coverage_baseline.yaml. Header comment states the seeding invocation, the marker
      grammar, and that this is a one-time grandfather of pre-existing debt, not a precedent.
  - file: scripts/checks/typing/__init__.py
    action: Create
    purpose: >-
      New check domain package. scripts/checks/ already carries 16 domain subpackages
      (ci_guards, contracts, decisions, deps, executor, hygiene, iam_tf, lambda_pkg, misc,
      ops_governance, product, prompts, prose, roadmap, sloc, verification); `typing` is the
      correct new home rather than dumping into misc/. No file-router.yaml entry is required --
      scripts_root_allowlist governs depth-1 scripts/ files only, and subpackage homes under
      scripts/checks/ are explicitly unconstrained by that key.
  - file: scripts/checks/typing/mypy_baseline.py
    action: Create
    purpose: >-
      Hosts BOTH checks plus the baseline's own load/compare/seed semantics in ONE module --
      the AGENTS.md collocation rule ("collocate semantic definitions with their enforcement
      counterparts in a single file"), and the exact shape of the closest in-repo sibling
      scripts/checks/misc/coverage_baseline.py (which hosts load_baseline + compare +
      measure_and_check + validate_coverage_baseline_edits together). Contents -- (a)
      `load_baseline()` / `_parse_entry_lines()` raw-text line parser (raw text, NOT
      yaml.safe_load, because the approval marker lives in an inline comment that safe_load
      drops -- same rationale as validate_sloc_budget_raises); (b) `_run_mypy()` +
      `_parse_error_counts()` turning mypy stdout into {path: count}, counting only ": error:"
      lines and never ": note:" lines; (c) `@registry.register("validate_mypy_ratchet")` --
      FULL TIER ONLY -- fails any file whose measured count EXCEEDS its baseline entry (or
      exceeds 0 when unregistered), prints a non-blocking ratchet-down advisory when measured is
      BELOW its entry, mirroring validate_sloc_limits' advisory arm; (d)
      `@registry.register("validate_mypy_baseline_edits")` -- BOTH TIERS -- the cheap tamper
      guard: reads config/mypy_baseline.yaml at origin/main via an injectable base_reader,
      fails any RAISED entry or NEW registration lacking an inline `# baseline-raised: dec-NNN
      <reason>` marker naming a real `## Decision NNN:` header in docs/DECISIONS.md, and SKIPs
      (non-failing) when origin/main or the base file is unreachable -- byte-for-byte the
      contract of validate_sloc_budget_raises._default_base_reader and
      coverage_baseline._default_base_reader, so the seeding PR itself (no base file) SKIPs
      instead of self-failing; (e) an `if __name__ == "__main__"` block exposing
      `--update` (downward-only re-seed: lowers entries whose file improved, drops files now
      clean or deleted, NEVER raises, NEVER seeds a newly-dirty unregistered file). Marker token
      is `baseline-raised`, deliberately DISTINCT from sloc's `raise-approved` and coverage's
      `baseline-lowered` -- three registries with three direction-correct tokens means a marker
      copy-pasted from one registry cannot silently authorize an edit in another. Estimated
      ~230 SLOC, well under 500.
  - file: scripts/checks/registry.py
    action: Modify
    purpose: >-
      Three-place ritual, place 2 (scripts/CLAUDE.md). In `pre_sequence()`, insert
      `_c("validate_mypy_baseline_edits")` adjacent to the existing
      `_c("validate_coverage_baseline_edits")` / `_c("validate_sloc_budget_raises")` tamper-guard
      cluster. In `full_sequence()`, REPLACE the scaffold step `_s("mypy_full")` with
      `_c("validate_mypy_ratchet")` at the same ordinal, and add
      `_c("validate_mypy_baseline_edits")`. Currently 238 SLOC; net change is roughly zero.
  - file: scripts/validate.py
    action: Modify
    purpose: >-
      Three-place ritual, place 3, PLUS the SLOC reclaim this plan depends on. HARD CONSTRAINT
      MEASURED THIS SESSION - scripts/validate.py is at 499 SLOC and is NOT registered in
      config/sloc_budgets.yaml (verified: `grep -c "scripts/validate.py"
      config/sloc_budgets.yaml` returns 0), so the unregistered hard limit of 500 applies and
      the file has exactly ONE line of headroom. Decision 128 forbids answering that with a
      budget raise. The plan therefore reclaims first - DELETE `_scaffold_mypy_full` (its `def`,
      `print`, `result =`, `if`, and inner `print` = 5 SLOC) and its `"mypy_full":
      _scaffold_mypy_full` entry in the `scaffold_fns` dict (1 SLOC) = -6 SLOC - then ADD
      exactly ONE facade re-export line, `from scripts.checks.typing.mypy_baseline import
      validate_mypy_baseline_edits, validate_mypy_ratchet  # noqa: F401,E402` (103 characters,
      inside the 127 line-length limit, so both names land on ONE line) = +1 SLOC. Net 499 - 6 +
      1 = 494 SLOC, restoring 6 lines of headroom rather than consuming the last one. The
      deletion is not incidental cleanup - `_scaffold_mypy_full` IS the informational `mypy
      src/` run that VTS-15 indicts, and validate_mypy_ratchet is its enforcing replacement, so
      the code being removed is precisely the code being superseded. CONSEQUENCE, stated
      explicitly - this plan adds NO `--update-mypy-baseline` argparse flag to validate.py
      (an add_argument stanza plus its dispatch branch plus the `not any((...))` guard edit is
      ~9 SLOC, which would push the file to 503 and breach). The re-seed utility instead lives
      as a `__main__` entry point on the check module itself, invoked as `bin/venv-python -m
      scripts.checks.typing.mypy_baseline --update`; seven check modules already carry
      `__name__ == "__main__"` blocks (validate_convergence_writer_isolation,
      validate_iam_policy_size, validate_authority_budget, validate_ci_refresh_read_coverage,
      validate_boundary_attached, validate_ghas_probe, validate_reconcile_pending_gate), so this
      is established repo shape, not an improvisation. The `--pre` diff-aware
      `_scaffold_mypy_diff` is UNTOUCHED and stays informational.
  - file: tests/checks/typing/__init__.py
    action: Create
    purpose: >-
      Required per-package __init__.py for every mirror test directory (Decision 131 clause 4,
      prepend import mode). Verified live this session -
      `map_source_to_test(Path("scripts/checks/typing/mypy_baseline.py"))` resolves to
      `tests/checks/typing/test_mypy_baseline.py`, so the mirror convention (not the retiring
      colocate-in-tests/test_validate.py grandfather) governs this new file.
  - file: tests/checks/typing/test_mypy_baseline.py
    action: Create
    purpose: >-
      The behavior oracle. Every test must FAIL without the corresponding production change
      (AGENTS.md). Required cases, grouped - PARSER - a well-formed `path: N  # comment` line
      parses to (N, marker); a comment-only line, a blank line, and the `entries:` key line are
      skipped; a malformed line is ignored rather than raising. MYPY OUTPUT PARSER - a
      fixture of real mypy-shaped stdout yields the right {path: count}; `: note:` lines are NOT
      counted; a "Found N errors in M files" summary line is not miscounted as an error.
      RATCHET (validate_mypy_ratchet, injected measurement so no test invokes mypy) - measured
      == baseline PASSES; measured > baseline appends to `failed`; measured < baseline PASSES
      and prints a ratchet-down advisory; an UNREGISTERED file with >=1 error FAILS (proves the
      implicit-zero rule); an unregistered file with 0 errors passes; a baseline entry for a
      file that no longer has errors does not fail. TAMPER GUARD
      (validate_mypy_baseline_edits, injected base_reader exactly as
      tests/checks/sloc/test_validate_sloc_budget_raises.py and
      tests/checks/misc/test_coverage_baseline.py do) - an unmarked RAISE fails; the same raise
      carrying `# baseline-raised: dec-161 <reason>` passes; a marker citing a Decision number
      with no `## Decision N:` header fails; a NEW unmarked entry fails; a DECREASE always
      passes unmarked; a REMOVED entry always passes unmarked; base_reader returning None SKIPs
      without failing; an absent current file returns early without failing. UPDATER - `--update`
      lowers an improved entry, drops a now-clean file, and refuses to raise or to seed a
      newly-dirty unregistered file. The new module carries NO config/coverage_baseline.yaml
      entry, so the Decision 159 / Decision 48 100%-per-file coverage standard applies to it in
      full - these cases must reach 100%, not merely pass.
  - file: tests/test_checks_registry.py
    action: Modify
    purpose: >-
      Remove `"mypy_full"` from the `FROZEN_FULL_SCAFFOLDS` tuple (the scaffold-anchor order
      invariant) and from the explanatory comment at line 63 that enumerates the full-tier
      scaffolds. Add `"validate_mypy_ratchet"` and `"validate_mypy_baseline_edits"` to the
      per-tier REQUIRED_*_CHECKS membership floors in the SAME commit (scripts/CLAUDE.md /
      Decision 104 growth-safe floor rule). These edits are themselves the reachability proof -
      dispatch is `globals()[name](failed)`, so if the scripts/validate.py facade re-export line
      is ever dropped, the floor tests KeyError rather than silently passing. Use membership
      assertions only; never a hardcoded exact count (validate_test_count_coupling).
  - file: docs/DECISIONS.md
    action: Modify
    purpose: >-
      Author `## Decision 161: <title> (Decided)`. RE-CHECK the max header at authoring time -
      measured 160 this session, and a concurrent PR may have claimed 161 (the numbering-race
      note in the planning skill; the referential guard catches a mismatch, so shifting to the
      next free number at execution time is safe). Entry carries the three required markers
      from docs/contracts/decision-entry.yaml (Status, Date, Decision) plus Warehouse ID,
      Problem, Rationale, Reversal conditions, Related. This is FORWARD governance mirroring
      Decisions 151/152/144/126 - the Decision 105 CD-ratification lane (R1-R3) is NOT engaged
      and no candidate_decision flips state. It clears the Decision 150 significance bar - a
      durable CI-enforcement architectural commitment with reversal-relevant consequences, the
      `numbered_decision` routing row, not `operational_fact` or `field_semantics`. SIZE
      DISCIPLINE, measured this session - docs/DECISIONS.md + docs/DECISIONS_ARCHIVE.md are
      629,909 bytes combined against the 700,000 ceiling (70,091 bytes headroom) and 113 of 120
      live `## Decision` headers (7 headers headroom), enforced by
      scripts/checks/decisions/validate_decisions_size.py, whose own relief-valve text names "a
      leaner per-entry authoring size norm" as a live concern. Target roughly 2,500-3,000 bytes,
      BELOW the 3,676-byte closest sibling Decision 159 - state the choice, the mechanism, the
      tier rationale, and the reversal conditions, and route mechanism detail to the check
      module docstring and the baseline file header rather than restating it in the log.
bundled_recommendations: []
infrastructure_dependencies: []
acceptance_criteria:
  - >-
    docs/DECISIONS.md contains a `## Decision 161:` (or the next free number) entry that names
    mypy's gate status as an error-count downward-ratchet, carries the Status/Date/Decision
    required markers, and passes validate_decision_entry_conformance,
    validate_decisions_size, and validate_reversal_stanzas.
  - >-
    pyproject.toml carries a [tool.mypy] block containing `disable_error_code` with
    "import-untyped" and NOT containing `ignore_missing_imports`, so [import-not-found] still
    surfaces.
  - >-
    config/mypy_baseline.yaml exists with per-file `entries`, seeded after the pyproject block,
    totalling the measured post-silencing count (57 entries summing to 127 at planning time;
    re-measure at implement time and use the measured value).
  - >-
    validate_mypy_ratchet is registered, appears in registry.full_sequence(), is ABSENT from
    registry.pre_sequence(), and FAILS when any file's measured mypy error count exceeds its
    baseline entry (or exceeds zero when the file is unregistered).
  - >-
    validate_mypy_ratchet PASSES, with a printed ratchet-down advisory and no entry in `failed`,
    when a file's measured count is BELOW its baseline entry -- decreases are always allowed.
  - >-
    validate_mypy_baseline_edits is registered, appears in BOTH registry.pre_sequence() and
    registry.full_sequence(), fails an unmarked raise or new registration, passes a raise
    carrying `# baseline-raised: dec-NNN <reason>` that names a real Decision header, passes all
    decreases and removals unmarked, and SKIPs when origin/main is unreachable.
  - >-
    Both check names resolve via `globals()` in scripts.validate (the single facade re-export
    line is present), and tests/test_checks_registry.py's per-tier membership floors include
    both.
  - >-
    The `mypy_full` scaffold is fully retired: `_scaffold_mypy_full` and its `scaffold_fns`
    entry are deleted from scripts/validate.py, `_s("mypy_full")` is gone from
    registry.full_sequence(), `"mypy_full"` is gone from FROZEN_FULL_SCAFFOLDS, and no
    `mypy_full` token remains anywhere under scripts/ or tests/.
  - >-
    scripts/validate.py measures at most 500 SLOC by validate_sloc_limits' own counting rule
    (non-blank, non-comment-leading lines), with NO new entry added to config/sloc_budgets.yaml
    and no `# raise-approved` marker introduced.
  - >-
    tests/checks/typing/test_mypy_baseline.py exercises scripts/checks/typing/mypy_baseline.py
    to 100% line coverage (the module is new and unbaselined, so the Decision 159 / Decision 48
    100% standard applies), and every added test fails without its production change.
  - >-
    `bin/venv-python -m scripts.validate --pre` exits 0 and the full tier
    (`bin/venv-python -m scripts.validate`) exits 0, per handoff_policy.
verification_plan:
  - step: 1
    phase: pre-deploy
    hermetic: true
    action: >-
      Confirm the [tool.mypy] block is SURGICAL -- disable_error_code carries "import-untyped"
      and ignore_missing_imports is absent, so a typo'd internal import still fails the ratchet.
    command: >-
      bin/venv-python -c "import tomllib,sys;c=tomllib.load(open('pyproject.toml','rb')).get('tool',{}).get('mypy');
      print('block',c);
      sys.exit(0 if c and 'import-untyped' in (c.get('disable_error_code') or []) and 'ignore_missing_imports' not in c else 1)"
    expected: >-
      Prints the parsed block showing disable_error_code containing 'import-untyped' and no
      ignore_missing_imports key; exits 0.
    fix_if: >-
      Exit 1 with ignore_missing_imports present means the blunt option was used -- it also
      silences [import-not-found], hiding typo'd/deleted internal imports for identical noise
      reduction. Replace it with disable_error_code = ["import-untyped"] and re-seed the
      baseline. Exit 1 with no block at all means pyproject.toml was not edited.
    graduation: waive
    graduation_waiver_reason: >-
      Kernel-expressible as command_exit_zero, but graduating it pins a standing registry check
      to one specific spelling of a two-key config block whose legitimate future evolution
      (adding strict flags, adding per-module overrides during burn-down) would red the gate for
      an improvement. The durable guard against the failure this step probes is
      validate_mypy_ratchet itself: if ignore_missing_imports were reintroduced, error counts
      would fall below every baseline entry and the ratchet's advisory arm would surface it.
  - step: 2
    phase: pre-deploy
    hermetic: true
    action: >-
      Confirm config/mypy_baseline.yaml is well-formed, that every registered path still exists
      on disk (no stale entries), that no entry is non-positive, and report the seeded totals.
    command: >-
      bin/venv-python -c "import yaml,pathlib,sys;e=yaml.safe_load(open('config/mypy_baseline.yaml'))['entries'];
      missing=[p for p in e if not pathlib.Path(p).exists()];bad=[p for p,v in e.items() if int(v)<1];
      print('entries',len(e),'total',sum(int(v) for v in e.values()),'missing',missing,'nonpositive',bad);
      sys.exit(0 if not missing and not bad else 1)"
    expected: >-
      Prints entries/total (57 and 127 at planning-time measurement; use the value re-measured
      at implement time), with missing [] and nonpositive []; exits 0.
    fix_if: >-
      A non-empty `missing` list means the baseline was seeded from a stale tree or a file was
      renamed after seeding -- re-run `bin/venv-python -m scripts.checks.typing.mypy_baseline
      --update`. A non-empty `nonpositive` list means a zero-valued entry was written; a
      zero-error file must be ABSENT from the registry (the implicit-zero rule), not registered
      at 0. A totals mismatch against a fresh `mypy scripts/ src/` run means the baseline was
      seeded BEFORE the pyproject block landed -- re-seed.
    graduation: waive
    graduation_waiver_reason: >-
      The path-existence half is kernel-expressible, but the totals half is this session's
      transient measurement -- a standing check pinned to 57/127 would red on the first
      legitimate ratchet-down, which is the exact behavior the whole mechanism exists to
      encourage. Stale-entry detection is better folded into the ratchet's own updater than
      duplicated as a separate registry row.
  - step: 3
    phase: pre-deploy
    hermetic: true
    action: >-
      Confirm the three-place ritual is complete AND that the SLOC reclaim held: both checks
      dispatch via globals() in scripts.validate, tier membership is exactly as designed
      (baseline_edits in both tiers, ratchet in full only), mypy_full is gone from the full
      sequence, and scripts/validate.py is at most 500 SLOC.
    command: |
      bin/venv-python -c "
      import sys, pathlib, importlib
      v = importlib.import_module('scripts.validate')
      from scripts.checks import registry
      pre = [s.name for s in registry.pre_sequence()]
      full = [s.name for s in registry.full_sequence()]
      sloc = len([l for l in pathlib.Path('scripts/validate.py').read_text(encoding='utf-8').splitlines() if l.strip() and not l.strip().startswith('#')])
      c = {
        'dispatch_ratchet': hasattr(v, 'validate_mypy_ratchet'),
        'dispatch_edits': hasattr(v, 'validate_mypy_baseline_edits'),
        'edits_in_pre': 'validate_mypy_baseline_edits' in pre,
        'edits_in_full': 'validate_mypy_baseline_edits' in full,
        'ratchet_in_full': 'validate_mypy_ratchet' in full,
        'ratchet_not_in_pre': 'validate_mypy_ratchet' not in pre,
        'mypy_full_gone': 'mypy_full' not in full,
        'sloc_ok': sloc <= 500,
      }
      print('sloc', sloc, c)
      sys.exit(0 if all(c.values()) else 1)
      "
    expected: >-
      Prints `sloc 494` (or any value <= 500) and every flag True; exits 0.
    fix_if: >-
      dispatch_* False means the single facade re-export line is missing from scripts/validate.py
      -- `globals()[name](failed)` will KeyError at dispatch. ratchet_not_in_pre False means the
      57-second mypy run leaked into the 5-minute fast-tier budget; remove it from
      pre_sequence(). sloc_ok False means the reclaim did not land -- delete `_scaffold_mypy_full`
      and its scaffold_fns entry rather than registering a budget or adding a raise marker
      (Decision 128 forbids the raise).
    graduation: waive
    graduation_waiver_reason: >-
      A composite of eight assertions spanning three different standing guards -- reachability is
      already owned by tests/test_checks_registry.py's floor tests, the SLOC ceiling by
      validate_sloc_limits, and tier membership by the same floor tests. A registry row here
      would be a third copy of guarantees two live gates already enforce, and would red whenever
      a future decomposition legitimately moves validate.py's line count.
  - step: 4
    phase: pre-deploy
    hermetic: true
    action: >-
      Stale-reference sweep for the scaffold-to-check cutover (closure obligation): confirm the
      retired `mypy_full` token survives nowhere under scripts/ or tests/, including comments.
    command: >-
      if grep -rq "mypy_full" scripts/ tests/; then echo "STALE mypy_full references remain:";
      grep -rn "mypy_full" scripts/ tests/; exit 1; else echo "CLEAN: no mypy_full references";
      fi
    expected: "Prints `CLEAN: no mypy_full references`; exits 0."
    fix_if: >-
      Any hit is a surviving reference to the retired scaffold. At planning time exactly four
      sites exist -- scripts/checks/registry.py's `_s("mypy_full")`, scripts/validate.py's
      `_scaffold_mypy_full` def and its scaffold_fns key, tests/test_checks_registry.py's
      FROZEN_FULL_SCAFFOLDS entry, and the explanatory comment near line 63 of that same test
      file. Delete each; the comment counts.
    graduation: waive
    graduation_waiver_reason: >-
      Expressible as grep_count == 0, but the assertion is inherently one-shot: it is meaningful
      only across the cutover commit. Once merged, `mypy_full` can never reappear except by
      someone deliberately reintroducing the scaffold, at which point step 3's
      `mypy_full_gone` flag and the FROZEN_FULL_SCAFFOLDS anchor test both fire. A standing
      registry row asserting the absence of a deleted identifier is durable dead weight.
  - step: 5
    phase: pre-deploy
    hermetic: false
    action: >-
      TEETH TEST for the ratchet -- prove it fails on a real, newly-introduced type error and
      passes on the clean tree. Runs the check against the clean tree, appends a genuinely
      ill-typed function to an unregistered (implicit-zero) file, re-runs, then restores.
    command: |
      cp scripts/checks/typing/__init__.py /tmp/mypy_vp5.bak && \
      bin/venv-python -c "from scripts.checks.typing.mypy_baseline import validate_mypy_ratchet as v; f=[]; v(f); print('CLEAN_FAILED=%d' % len(f))" && \
      printf '\n\ndef _vp_probe(x: int) -> str:\n    return x\n' >> scripts/checks/typing/__init__.py && \
      bin/venv-python -c "from scripts.checks.typing.mypy_baseline import validate_mypy_ratchet as v; f=[]; v(f); print('DIRTY_FAILED=%d' % len(f))"; \
      cp /tmp/mypy_vp5.bak scripts/checks/typing/__init__.py && rm -f /tmp/mypy_vp5.bak && \
      bin/venv-python -c "from scripts.checks.typing.mypy_baseline import validate_mypy_ratchet as v; f=[]; v(f); print('RESTORED_FAILED=%d' % len(f))"
    expected: >-
      `CLEAN_FAILED=0`, then `DIRTY_FAILED=1` (the injected `return x` on a `-> str` signature is
      a [return-value] error in a file with no baseline entry, so the implicit-zero rule trips),
      then `RESTORED_FAILED=0`.
    fix_if: >-
      CLEAN_FAILED=1 means the baseline is out of step with the tree -- almost always because it
      was seeded before the pyproject block; re-seed. DIRTY_FAILED=0 is the serious failure: the
      ratchet is structurally inert. Check that unregistered files are compared against an
      implicit 0 rather than being skipped, and that the mypy stdout parser is actually matching
      ": error:" lines (a parser that silently returns {} makes every comparison vacuous).
      RESTORED_FAILED nonzero means the restore leg did not run -- restore the file from git.
    graduation: not-applicable
  - step: 6
    phase: pre-deploy
    hermetic: false
    action: >-
      TEETH TEST for the tamper guard plus the full unit oracle -- run the new test module,
      which exercises unmarked-raise-fails, marked-raise-passes, bogus-Decision-citation-fails,
      decrease-and-removal-always-pass, and unreachable-base-SKIPs via an injected base_reader.
    command: bin/venv-python -m pytest tests/checks/typing/test_mypy_baseline.py -q
    expected: All tests pass; exits 0.
    fix_if: >-
      A failing marked-raise-passes case usually means the inline-comment marker regex is being
      applied to yaml.safe_load output (which discards comments) instead of the raw file text --
      parse raw lines, as validate_sloc_budget_raises does. A failing unreachable-base case means
      the base_reader None branch fails instead of SKIPping, which would self-red the seeding PR
      (config/mypy_baseline.yaml does not exist at origin/main yet).
    graduation: waive
    graduation_waiver_reason: >-
      Kernel-expressible as test_selector, but the full tier's standing `unit_tests` scaffold
      already collects and runs tests/checks/typing/ as part of the whole suite, so a registry
      row would execute the identical selector a second time in the same tier for no added
      signal.
  - step: 7
    phase: pre-deploy
    hermetic: false
    action: >-
      Confirm the new module reaches 100% line coverage. It is new and carries no
      config/coverage_baseline.yaml entry, so the Decision 159 / Decision 48 100%-per-file
      standard applies to it in full.
    command: >-
      bin/venv-python -m pytest tests/checks/typing/ --cov=scripts/checks/typing
      --cov-report=term-missing -q
    expected: >-
      scripts/checks/typing/mypy_baseline.py reports 100% with an empty Missing column.
    fix_if: >-
      Uncovered lines are typically the `__main__` updater branch and the early-return guards
      (absent baseline file, unreachable base_reader). Add direct unit tests for the updater
      function and both early returns rather than adding a coverage_baseline entry -- a new file
      taking a grandfather entry on the day it lands would be exactly the debt the Decision 159
      roster is being paid down to remove.
    graduation: waive
    graduation_waiver_reason: >-
      metric_under_threshold-expressible, but per-file coverage is already the standing
      validate_test_coverage gate's whole job (Decision 159). A registry row measuring one file's
      coverage would be a second, narrower gate on a surface an existing full-tier gate already
      covers, and would drift from it the moment the coverage machinery changes.
  - step: 8
    phase: pre-deploy
    hermetic: true
    action: >-
      Confirm the Decision entry landed, is conformant, and did not breach the size ceilings:
      the header exists, the three required markers from docs/contracts/decision-entry.yaml are
      present, live headers stay at or under 120, and combined live+archive bytes stay at or
      under 700,000.
    command: |
      bin/venv-python -c "
      import re, pathlib, sys
      live = pathlib.Path('docs/DECISIONS.md').read_text(encoding='utf-8')
      arc = pathlib.Path('docs/DECISIONS_ARCHIVE.md').read_bytes()
      nums = [int(n) for n in re.findall(r'^## Decision (\d+):', live, re.M)]
      target = max(nums)
      body = re.search(r'^## Decision %d:.*?(?=^## Decision |\Z)' % target, live, re.M | re.S).group(0)
      markers = all(('**%s:**' % m) in body for m in ('Status', 'Date', 'Decision'))
      combined = len(live.encode('utf-8')) + len(arc)
      print('decision', target, 'markers', markers, 'headers', len(nums), 'combined', combined, 'entry_bytes', len(body))
      sys.exit(0 if target >= 161 and markers and len(nums) <= 120 and combined <= 700000 else 1)
      "
    expected: >-
      Prints the new decision number (161 or the next free number), markers True, headers 114
      (of 120), combined under 700,000, and an entry_bytes value in the 2,500-3,000 range;
      exits 0.
    fix_if: >-
      markers False means a required marker from docs/contracts/decision-entry.yaml is missing or
      misspelled -- it must be the exact bold colon-terminated `**Status:**` / `**Date:**` /
      `**Decision:**` form. headers > 120 or combined > 700,000 means a ceiling was breached;
      the relief valve is compaction of superseded bodies or a leaner entry, never a raise.
      entry_bytes well above 3,000 means mechanism detail belongs in the check module docstring
      and the baseline file header instead.
    graduation: waive
    graduation_waiver_reason: >-
      Every assertion here is already owned by a standing full-and-fast-tier check --
      validate_decision_entry_conformance for the required markers and
      validate_decisions_size for both ceilings. This step exists to catch the mistake inside
      this session's edit loop, before those gates run; graduating it would mint a third
      independent copy of two already-enforced invariants.
  - step: 9
    phase: pre-deploy
    hermetic: false
    action: >-
      Run the DECISIONS.md ETL to project the new Decision into ops_decisions and refresh the
      local read cache, then confirm dec-161 is present in the cache.
    command: >-
      bin/venv-python -m scripts.ops_data_portal --backfill-decisions-md &&
      grep -c "dec-161" logs/.decisions-index.jsonl
    expected: >-
      Backfill reports the new/changed row and exits 0; the grep count is at least 1. (Use the
      actual decision id if the number shifted at authoring time.)
    fix_if: >-
      A credential failure means the agent_platform assume-role chain is unavailable -- confirm
      with `aws sts get-caller-identity --profile agent_platform`; the write must FAIL LOUDLY and
      be re-run after connectivity is restored (Decision 84 I-4, no offline outbox). A zero grep
      count after a successful backfill means the entry's header or markers did not parse -- fix
      the entry per step 8 and re-run. Never hand-edit logs/.decisions-index.jsonl; it is a read
      cache and never a write source.
    graduation: not-applicable
constraints:
  - >-
    Decision 128 (SLOC decompose-by-default): scripts/validate.py is at 499/500 SLOC and
    UNREGISTERED. Do NOT add a config/sloc_budgets.yaml entry for it, do NOT add a
    `# raise-approved` marker, and do NOT run `--update-sloc-budgets` to seed it. The reclaim
    (delete `_scaffold_mypy_full`, add exactly one facade line) is the required answer. Every
    file in scope stays under 500.
  - >-
    scripts/CLAUDE.md three-place ritual is mandatory and must land in ONE commit: the
    `@registry.register` module under scripts/checks/typing/, the name inserted in the ordered
    tier sequence(s) in scripts/checks/registry.py, and the `from
    scripts.checks.typing.mypy_baseline import ...  # noqa: F401,E402` re-export in
    scripts/validate.py's facade block. Dispatch is `globals()[name](failed)` -- omitting the
    re-export makes the check KeyError and reddens tests/test_checks_registry.py.
  - >-
    Tier placement is fixed by two measured facts and must not be "improved" by moving the
    ratchet into --pre. (a) Cold `mypy scripts/ src/` takes 57s and .mypy_cache is gitignored,
    so CI is ALWAYS cold; the fast tier carries a hard 5-minute budget assertion (Decision
    73/135/153) and the preflight already reports 10 fast-tier budget breaches in the last 7
    days. (b) Decisively: `pr-validate` installs requirements-fast.txt WITHOUT `-c
    requirements.lock` (`mypy>=1.5.0`, unpinned), so the fast tier's mypy version floats and
    error counts would drift spuriously, while `main-validate` installs `-c requirements.lock`
    (mypy==2.3.0). A count-comparing ratchet is only sound under the pinned interpreter.
  - >-
    Ratchet scope is `scripts/ src/`, which SUPERSEDES the retired `mypy src/` scaffold.
    Justification: `mypy src/` already reports errors in scripts/ via follow-imports (verified --
    `scripts/ops_data_portal.py:415` appears in its output), so "src-only" was never a real
    boundary. `scripts/ src/` is the honest closure of hand-authored production Python (362
    files) and matches SLOC governance's whole-repo scope (Decision 130). tests/ is deliberately
    EXCLUDED -- fixtures, mocks, and monkeypatching carry different typing norms and would
    balloon the roster without governing production type safety.
  - >-
    Ordering is load-bearing: the [tool.mypy] block lands BEFORE config/mypy_baseline.yaml is
    seeded. Seeding first would bake roughly 135 missing-stub errors into the roster and the
    ratchet would then track stub availability rather than type-logic debt.
  - >-
    Every behavior-changing edit needs an automated test that FAILS without the change (AGENTS.md).
    Running an existing suite is not a substitute.
  - >-
    bundled_recommendations is [] by explicit human constraint for this whole workstream. File NO
    new recommendations anywhere -- not for the typing debt burn-down, not for the pre-merge
    blocking upgrade path, not for rec-2923.
  - >-
    Do NOT promote validate_test_coverage to --pre and do not touch the coverage gate -- out of
    scope. Do NOT touch rec-2923 or the ci-rca / subagent-plan-review subsystem.
  - >-
    VP commands are POSIX/coreutils only (grep/test/find/sed/printf/cp). NEVER `rg` -- the CI
    runner replays hermetic pre-deploy VP steps via /bin/sh on ubuntu-latest, which has no
    ripgrep (a prior slice burned on exit 127).
  - >-
    Every mypy-invoking or pytest-invoking VP step is `hermetic: false` BY DESIGN.
    validate_vp_replay runs in the --pre sequence, so marking a 57-second mypy step hermetic
    would load the same 5-minute fast-tier budget the tier placement above exists to protect.
  - >-
    Do not `Edit` or `Write` logs/.decisions-index.jsonl or logs/.recommendations-log.jsonl
    (Single Portal Invariant). docs/DECISIONS.md is the markdown ETL SOURCE, not a read cache,
    so editing it and running `--backfill-decisions-md` is the sanctioned ratification path
    (Decisions 84/92/146).
  - No rescue agents or workaround loops (Decision 55).
context:
  - >-
    Origin: audit finding VTS-15 (audits/validate-test-suite-4df4d48.yaml) -- "mypy is advisory
    in both tiers with 143 standing errors, and no decision owns the advisory status", severity
    medium, confidence CONFIRMED, roadmap_crossref.classification novel with item_ids: []. Its
    acceptance clause is "A Decision names mypy's gate status; if (ii)/(iii), the corresponding
    check lands with it". The human has chosen option (iii), the count-ratchet, with explicit
    governance sign-off; options (i) advisory-forever and (ii) changed-files blocking were both
    rejected -- (ii) specifically for dirty-file inheritance, where a PR touching a still-dirty
    file would be blocked until that file is cleaned, ballooning unrelated scope. The per-file
    baseline design defeats that failure mode directly: a PR may touch a file with 28
    grandfathered errors and passes as long as it adds none.
  - >-
    Measured ground truth, re-verified this session (mypy 2.3.0, matching requirements.lock).
    BEFORE any config: `mypy src/` = 143 errors/59 files; `mypy scripts/ src/` = 262 errors/147
    files (362 source files checked). AFTER `disable_error_code = ["import-untyped"]`: `mypy
    src/` = 82/28; `mypy scripts/ src/` = 127/57 (44 scripts files, 13 src files); identical
    result from `ignore_missing_imports = true`, which is why the surgical option is free.
    Timing: cold 57s for scripts+src, 30s for src only, 1s warm. Two consecutive runs produced
    byte-identical per-file counts (deterministic). Zero [import-not-found] errors exist today.
    Dirtiest file: scripts/execute_recommendation.py at 28.
  - >-
    Decision-scout verdict + CITE list (verbatim decision ids): PENDING -- this plan is authored
    by a planning subagent under the Design-B trampoline, which hands back a GATE_REQUEST for
    the decision-scout gate rather than dispatching it inline (the fresh-context requirement
    cannot be satisfied from the authoring context). The implementing session must not proceed
    past a gate that has not returned a Verdict line. Decisions this plan already expects to
    cite: Decision 128 (SLOC raise gate + decompose-by-default, the marker mechanism this
    mirrors), Decision 159 (config/coverage_baseline.yaml + validate_coverage_baseline_edits,
    the closest structural sibling), Decision 130 (whole-repo SLOC scope), Decision 102/43 (SLOC
    ratchet lineage), Decision 73/135/153 (two-tier presubmit + fast-tier budget), Decision 150
    (significance bar), Decision 134/145/146 (DECISIONS.md size governance and archival),
    Decision 84 (warehouse SoT + portal), Decision 86 (rationale routes to Decisions), Decision
    148 (hermetic VP authoring), Decision 104 (registry membership floors), Decision 131 (mirror
    test placement), Decision 55 (fail loud, no workaround loops).
  - "gates: decision-scout=<verdict>; plan-critique=<verdict> after <N> round(s)"
  - >-
    ci-rca deferral rationale (recorded per the Related-Work check). Preflight reports
    `ci_rca_unresolved_recs: []` -- there is NO hard block. The one open Critical source=ci_rca
    rec, rec-2923 ("Sandbox subagent review starved; inherited errexit voided the retry and
    latched a false red", source_file .github/actions/subagent-plan-review/action.yml), appears
    under `ci_rca_likely_resolved_recs`. It is ACTIVELY owned and being remediated by a
    concurrent session (PRs #818/#820/#821/#823 are its approved plans and fixes) and is fully
    DISJOINT from this plan: no shared source_file, no shared Decision, and a different failure
    category (V3 harness / subagent-review failure vs this plan's mypy-regression category).
    The human has authorized proceeding. Do not touch rec-2923.
  - >-
    Preflight state at planning time: venv=True, creds=ok, branch=claude/mypy-gate-status-ratchet-plan,
    main 0 behind / 0 ahead (base 2e60bdd), uncommitted_changes false, ops_outbox empty,
    main_files_changed_since_branch [] so the Main Divergence Assessment finds no overlap,
    budget_bypass_alert null, open_recs 880 / non_automatable 753 (surfaced as context only per
    Decision 73). Advisory notes: 10 fast-tier budget breaches in the last 7 days (dominant
    phase validate_verification_registry) -- directly relevant to this plan's tier choice; and a
    stale Platform End-State fingerprint.
  - >-
    Complexity: 10 scope files exceeds the >5-file STRATEGIC heuristic, but STRATEGIC
    classification is SUSPENDED (AGENTS.md Temporary Operational Constraints, Decision 67 -- the
    executor that consumes decomposed recommendations is frozen, so STRATEGIC plans produce dead
    work). Authored as a single larger IMPLEMENTATION plan per the freeze override. The ten files
    are one atomic unit -- the three-place ritual alone spans three of them and cannot be split
    across PRs without leaving a KeyErroring check on main.
  - >-
    verification_tier V2 rationale: no `.tf` in scope (infrastructure_dependencies is [], no
    speculative-plan pipeline engagement), and `compute_affected_artifacts()` over the full scope
    list returns {} -- no Lambda artifact is affected, so no build/deploy/smoke-test steps are
    required. The single external touch is the ops-portal `--backfill-decisions-md` ETL, which
    every Decision-authoring plan performs; repo precedent classifies those V2
    (PLAN-decision-scout-bounded-retrieval, PLAN-coverage-diff-base-baseline, both
    IMPLEMENTATION/V2 with DECISIONS.md in scope).
  - >-
    Closure obligation: this plan is NOT rec-resolving (bundled_recommendations is [] by explicit
    constraint) but IS surface-retiring -- the `mypy_full` informational scaffold is cut over to
    the enforcing `validate_mypy_ratchet` check. VP step 4 is the required stale-reference sweep
    for that cutover, and acceptance criterion 8 states the full retirement condition.
  - >-
    Known non-goal, deliberately deferred with NO rec filed (per the explicit no-new-recs
    constraint): pre-merge BLOCKING. Because the ratchet is full-tier-only and main-validate runs
    on push to main, a type regression is detected POST-merge and spawns a source=ci_rca
    priority=critical rec (forward-fix, never auto-revert) rather than blocking the PR. This is
    real enforcement in this repo's model but is strictly weaker than a pre-merge gate. The
    upgrade path -- a separate CI job invoking the ratchet in parallel with pr-validate, on the
    `terraform-validate` job pattern, installed with `-c requirements.lock`, later added to the
    `main-protection` required checks via terraform/github -- is named in Decision 161's reversal
    conditions so the choice is reversible and traceable, not silently permanent.
  - >-
    Marker-token rationale, for the plan-critique gate to check for honesty: three baseline
    registries now coexist, each with a direction-correct token -- sloc uses
    `# raise-approved: dec-NNN` (budgets rising is the bad direction), coverage uses
    `# baseline-lowered: dec-NNN` (coverage falling is the bad direction), and mypy uses
    `# baseline-raised: dec-NNN` (error counts rising is the bad direction). Distinct tokens are
    deliberate: a single shared token would let a marker written for one registry be copy-pasted
    into another and silently authorize an unrelated regression.
