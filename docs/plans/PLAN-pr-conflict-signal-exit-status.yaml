schema_version: 4
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: "pr-conflict-signal-exit-status"
intent: >-
  Restore the merge-conflict wake guarantee that pr-conflict-signal.yml exists to provide, by
  removing the inherited-errexit abort that silently truncates the PR sweep, and install a
  zero-population ratchet so the silent-green variant of this defect class cannot return.
plan_type: IMPLEMENTATION
verification_tier: V2
plan_path: docs/plans/PLAN-pr-conflict-signal-exit-status.yaml
phase: >-
  Platform hardening / CI-signal reliability. Serves the event-driven wake contract in AGENTS.md
  "Push -> PR -> CI -> merge flow" step 4 (Decision 76/83); no tier_item is named -- this is an
  ad_hoc_rec (rec-2735, source=code-review), a soft-warn exception category, so the Tier Item
  Freshness Gate is skipped by rule.
scope:
  - file: scripts/ci/pr_conflict_signal.sh
    action: Create
    purpose: >-
      Extracted body of the conflict-poll step. Clears the inherited errexit FIRST (set +e), then
      handles exit status explicitly on every gh call; a per-PR failure logs, marks, counts and
      continues so the sweep always completes. Extraction target for the workflow leg is
      scripts/ci/ per config/composite_action_body_baseline.yaml's header (Decision 162 R3).
  - file: .github/workflows/pr-conflict-signal.yml
    action: Modify
    purpose: >-
      Reduce the step to a thin delegation (bash scripts/ci/pr_conflict_signal.sh) and add
      actions/checkout@v7 (the job has none today -- it only shelled out to gh). Keeps the step
      name unchanged so the r3_workflows baseline key stays stable, and keeps
      continue-on-error: true (load-bearing: this advisory job must never red a build).
  - file: scripts/checks/ci_guards/validate_pr_conflict_signal.py
    action: Modify
    purpose: >-
      Teach the guard to resolve the delegate script and run its five semantic assertions against
      the script contents. Verified empirically: without this change extraction produces exactly 5
      guard failures. Also assert the delegate exists, that checkout precedes the delegation step,
      and that the script clears inherited errexit.
  - file: tests/test_pr_conflict_signal_wiring.py
    action: Create
    purpose: >-
      Drives the REAL extracted script under the literal GitHub workflow-step argv, and drives the
      real workflow YAML's own run body under the argv that YAML implies, with a gh shim on PATH.
      Mirrors tests/test_subagent_review_wiring.py (rec-2924 precedent).
  - file: tests/checks/ci_guards/test_validate_pr_conflict_signal.py
    action: Modify
    purpose: >-
      Update the mocked pass-path fixture to the post-extraction delegation shape and add
      fail-path cases for the new assertions (missing delegate, checkout ordering, uncleared
      errexit). The existing pass-against-real-workflow-file case must keep passing.
  - file: config/composite_action_body_baseline.yaml
    action: Modify
    purpose: >-
      Lower the r3_workflows ceiling for this body from 36 to its post-extraction count. A
      DECREASE, which is unrestricted and must NOT carry a raise-approved marker (Decision 165).
  - file: scripts/checks/ci_guards/validate_masked_errexit_steps.py
    action: Create
    purpose: >-
      New guard closing the silent-green class repo-wide: a step with continue-on-error true whose
      body runs under inherited errexit and contains an unguarded command substitution. Measured
      population after this fix is ZERO, so it installs with no grandfather roster and no Decision.
  - file: tests/checks/ci_guards/test_validate_masked_errexit_steps.py
    action: Create
    purpose: >-
      Prove the guard fires on a synthetic violator (non-vacuity) and stays clean on the real tree,
      plus the negative cases it must NOT flag (guarded assignment, set +e present, loud step).
  - file: scripts/checks/registry.py
    action: Modify
    purpose: >-
      Register validate_masked_errexit_steps in BOTH pre_sequence() and full_sequence(), matching
      how validate_pr_conflict_signal is registered at lines 162/204 (Decision 104).
  - file: scripts/validate.py
    action: Modify
    purpose: >-
      Single-line re-export of the new check, matching the existing line-77 form. MUST be exactly
      one line -- this file measures 497 effective lines against a 500 limit.
bundled_recommendations:
  - rec-2735
infrastructure_dependencies: []
acceptance_criteria:
  - >-
    A gh failure while polling one PR no longer aborts the sweep: every remaining PR is still
    polled, and a conflicted one still receives its wake comment.
  - >-
    The extracted script clears the inherited errexit before its first command substitution, and
    every gh call's exit status is handled explicitly.
  - >-
    The 5-attempt poll loop retries a FAILED CALL as well as an UNKNOWN value; today, under
    inherited -e, only the UNKNOWN branch is even reachable.
  - >-
    The wiring test drives the real script under the literal workflow argv, and proves the harness
    actually delivers errexit before any behavioural case depends on it.
  - >-
    A comments-read that fails after retries posts the wake ANYWAY (bias inverted -- a duplicate
    wake is cheap, a missed wake strands a session) and emits a greppable marker.
  - >-
    Any per-PR failure is mirrored to $GITHUB_STEP_SUMMARY with a greppable marker, and the script
    exits non-zero, while continue-on-error true keeps the job green.
  - >-
    UNKNOWN-after-poll-bound still never produces a false wake, and the head-SHA marker still
    suppresses a repost -- both pre-existing invariants survive the rewrite.
  - >-
    validate_pr_conflict_signal resolves the delegate and passes against the real workflow file.
  - >-
    validate_masked_errexit_steps is registered in both presubmit tiers and reports zero violations
    across .github/workflows/ and .github/actions/ after the fix.
  - >-
    The r3_workflows ceiling for this body is lowered to its measured post-extraction count, with
    no raise-approved marker on the entry.
  - Full bin/venv-python -m scripts.validate exits 0.
verification_plan:
  - step: 1
    phase: pre-deploy
    action: >-
      Run the full wiring suite: harness-delivers-errexit proof, sweep continuation, retry-on-failed-call,
      UNKNOWN-no-false-wake, head-SHA idempotency, comments-read-failure posts anyway, marker emission.
    command: bin/venv-python -m pytest tests/test_pr_conflict_signal_wiring.py -q
    expected: All cases pass, including the case asserting the harness itself delivers errexit.
    fix_if: >-
      A failure here means the script still aborts under inherited -e, or the harness is not
      reproducing the real argv. If EVERY case passes on the UNFIXED script, the harness is wrong
      (a child bash does not inherit its parent's options) -- fix the harness first.
    hermetic: false
    graduation: graduate
    graduation_check_id: pr-conflict-signal-wiring-suite
  - step: 2
    phase: pre-deploy
    action: >-
      Isolate the rec-2735 regression: a gh failure on the FIRST PR must still leave the SECOND PR
      polled and woken. This is the wake guarantee.
    command: bin/venv-python -m pytest tests/test_pr_conflict_signal_wiring.py -q -k "sweep_continues or continuation"
    expected: >-
      Passes, and the assertion is on the SECOND PR receiving its comment -- not merely on an exit
      code, which the old body also produced.
    fix_if: >-
      If this passes against the pre-fix body, the test is not exercising the defect: confirm the
      shim makes gh exit non-zero for PR one and that the body runs under bash -e.
    hermetic: false
    graduation: graduate
    graduation_check_id: pr-conflict-sweep-continues-past-gh-failure
  - step: 3
    phase: pre-deploy
    action: >-
      Execute the REAL workflow YAML's run body under the argv that YAML implies (absent shell key
      -> bash -e), proving the workflow-side wiring, not a hand-copied approximation.
    command: bin/venv-python -m pytest tests/test_pr_conflict_signal_wiring.py -q -k "real_workflow"
    expected: >-
      The body parsed from .github/workflows/pr-conflict-signal.yml resolves and runs the delegate
      from the repo root and completes the sweep under errexit.
    fix_if: >-
      Path resolution failure means the delegation assumes a working directory checkout does not
      provide; a shell-key mismatch means the argv derivation is wrong.
    hermetic: false
    graduation: graduate
    graduation_check_id: pr-conflict-signal-real-workflow-body-wiring
  - step: 4
    phase: pre-deploy
    action: Run the updated structural guard's own test suite (pass path plus each new fail path).
    command: bin/venv-python -m pytest tests/checks/ci_guards/test_validate_pr_conflict_signal.py -q
    expected: All cases pass, including the pre-existing pass-against-real-workflow-file case.
    fix_if: >-
      Five "missing ..." failures mean the guard is still reading the inline run text instead of
      resolving the delegate script.
    hermetic: false
    graduation: graduate
    graduation_check_id: pr-conflict-signal-guard-suite
  - step: 5
    phase: pre-deploy
    action: Run the updated guard against the real workflow tree.
    command: bin/venv-python -c "from scripts.checks.ci_guards.validate_pr_conflict_signal import validate_pr_conflict_signal as c; f=[]; c(f); assert f==[], f; print('clean')"
    expected: Prints clean; no failures appended.
    fix_if: The named failures identify which semantic assertion lost its referent after extraction.
    hermetic: true
    graduation: graduate
    graduation_check_id: pr-conflict-signal-guard-clean-on-real-workflow
  - step: 6
    phase: pre-deploy
    action: >-
      Prove the new masked-errexit guard is not vacuous -- it must FIRE on a synthetic violator and
      stay silent on each legitimate negative (guarded assignment, set +e present, loud step).
    command: bin/venv-python -m pytest tests/checks/ci_guards/test_validate_masked_errexit_steps.py -q
    expected: >-
      Fires on the synthetic violator; does not fire on any negative case. A guard that only ever
      passes proves nothing.
    fix_if: >-
      No fire on the synthetic violator means the detection regex never matches -- assert against a
      fixture byte-identical in shape to the pre-fix pr-conflict-signal body.
    hermetic: false
    graduation: graduate
    graduation_check_id: masked-errexit-guard-fires-on-synthetic-violator
  - step: 7
    phase: pre-deploy
    action: >-
      Run the new guard across the real tree. Population must be zero -- this is the claim that lets
      it install with no grandfather roster.
    command: bin/venv-python -c "from scripts.checks.ci_guards.validate_masked_errexit_steps import validate_masked_errexit_steps as c; f=[]; c(f); assert f==[], f; print('zero violations')"
    expected: Prints zero violations.
    fix_if: >-
      A non-empty result means either the fix is incomplete, or the rule is broader than the
      measured silent subset (19 LOUD instances exist and are deliberately out of scope) -- narrow
      the rule to continue-on-error steps, do not baseline the difference.
    hermetic: true
    graduation: graduate
    graduation_check_id: masked-errexit-steps-zero-violations
  - step: 8
    phase: pre-deploy
    action: Confirm the new check is registered in BOTH presubmit tiers (Decision 104).
    command: bin/venv-python -c "from scripts.checks import registry; p={s.name for s in registry.pre_sequence()}; f={s.name for s in registry.full_sequence()}; assert 'validate_masked_errexit_steps' in p and 'validate_masked_errexit_steps' in f; print('registered in both tiers')"
    expected: Prints registered in both tiers.
    fix_if: Missing from either sequence means only one of registry.py's two call sites was edited.
    hermetic: true
    graduation: graduate
    graduation_check_id: masked-errexit-check-registered-both-tiers
  - step: 9
    phase: pre-deploy
    action: >-
      Confirm the R3 ratchet is clean and the lowered ceiling matches the measured post-extraction
      body, with no raise-approved marker on the decreased entry.
    command: bin/venv-python -c "from scripts.checks.ci_guards.validate_composite_action_shell_bodies import validate_composite_action_shell_bodies as c; f=[]; c(f); assert f==[], f; from scripts.checks.ci_guards._workflow_shell_bodies import scan_workflow_bodies; import yaml,pathlib; k='.github/workflows/pr-conflict-signal.yml::detect-conflicts::poll-open-claude-prs-and-wake-conflicted-ones'; live=scan_workflow_bodies()[k]; dec=yaml.safe_load(pathlib.Path('config/composite_action_body_baseline.yaml').read_text())['r3_workflows'][k]; assert dec==live, (dec,live); print('ratchet clean, ceiling', dec)"
    expected: >-
      Ratchet clean and the declared ceiling equals the live measured count (was 36 pre-extraction).
    fix_if: >-
      A KeyError means the step name changed and the baseline key moved -- restore the step name or
      rekey the entry. A mismatch means the ceiling was not lowered to the measured value.
    hermetic: true
    graduation: graduate
    graduation_check_id: pr-conflict-signal-r3-ceiling-matches-live
  - step: 10
    phase: pre-deploy
    action: >-
      Confirm scripts/validate.py stayed within its 500-effective-line limit after the re-export
      (it measured 497 before this change).
    command: bin/venv-python -c "from scripts.checks.structural.size_limits import effective_lines; import pathlib; n=effective_lines(pathlib.Path('scripts/validate.py').read_text()); assert n<=500, n; print('validate.py effective lines:', n)"
    expected: Prints a count of 500 or less (expected 498).
    fix_if: >-
      Over the limit means the re-export was written as a multi-line parenthesised import -- collapse
      it to one line. Do NOT raise the budget (Decision 128: decompose or fit, never default to a raise).
    hermetic: true
    graduation: waive
    graduation_waiver_reason: >-
      Duplicates the standing repo-wide validate_sloc_limits check, which already guards every
      Python file each presubmit run; graduating a second per-file assertion for the same property
      would add a redundant registry slot. Retained as a VP step only because this specific file has
      3 lines of headroom and the change adds a line to it, making it the one plausible breach.
  - step: 11
    phase: pre-deploy
    action: Full-tier validation before any commit or PR (handoff_policy gate).
    command: bin/venv-python -m scripts.validate
    expected: Exit 0.
    fix_if: >-
      Fix forward; never disable a check to pass. A ci-rca rec on failure is reviewed in a /plan
      session, not patched inline (Decision 55/72).
    hermetic: false
    graduation: not-applicable
  - step: 12
    phase: post-deploy
    action: >-
      After the squash merge closes rec-2735 via the Resolves trailer, refresh the read cache and
      confirm the rec is closed.
    command: bin/venv-python -m scripts.sync.ops pull && bin/venv-python -c "import json,pathlib; rows=[json.loads(l) for l in pathlib.Path('logs/.recommendations-log.jsonl').read_text().splitlines() if l.strip()]; r=next(x for x in rows if x['id']=='rec-2735'); assert r['status']=='closed', r['status']; print('rec-2735', r['status'])"
    expected: Prints rec-2735 closed.
    fix_if: >-
      Still open means rec-autoclose.yml did not fire -- close via the portal fallback:
      bin/venv-python -m scripts.ops_data_portal --update-rec rec-2735 --status closed --resolution "..."
    hermetic: false
    graduation: not-applicable
test_obligations:
  - source: scripts/ci/pr_conflict_signal.sh
    behavior: >-
      A gh failure on any single PR must never abort the sweep; remaining PRs are still polled and
      conflicted ones still woken.
    verification_step: 2
    test_selector: tests/test_pr_conflict_signal_wiring.py
    red_green_expectation: >-
      Red against the pre-fix inline body (the abort truncates the sweep, so PR two never gets its
      comment); green after extraction and explicit exit-status handling.
  - source: .github/workflows/pr-conflict-signal.yml
    behavior: >-
      The step remains a thin delegation whose body still resolves and runs the script under the
      errexit-inheriting argv its own YAML implies, with checkout preceding it.
    verification_step: 3
    test_selector: tests/test_pr_conflict_signal_wiring.py
    red_green_expectation: >-
      Red if the delegation path is wrong or checkout is absent (the script is not on disk); green
      with checkout@v7 ahead of a repo-root-relative delegation.
  - source: scripts/checks/ci_guards/validate_pr_conflict_signal.py
    behavior: >-
      The five semantic assertions follow the delegate into the script rather than reading the
      now-one-line inline run text.
    verification_step: 4
    test_selector: tests/checks/ci_guards/test_validate_pr_conflict_signal.py
    red_green_expectation: >-
      Red before the guard update (extraction yields exactly 5 "missing ..." failures, confirmed by
      simulation at plan time); green once the delegate is resolved.
  - source: scripts/checks/ci_guards/validate_masked_errexit_steps.py
    behavior: >-
      Fires on a continue-on-error step whose body inherits errexit and holds an unguarded command
      substitution; stays silent on guarded assignments, bodies clearing errexit, and loud steps.
    verification_step: 6
    test_selector: tests/checks/ci_guards/test_validate_masked_errexit_steps.py
    red_green_expectation: >-
      Red before the guard exists (no such module); green with both the firing case and every
      negative case asserted.
  - source: scripts/checks/registry.py
    behavior: The new check runs in both the fast and full presubmit tiers.
    verification_step: 8
    command: bin/venv-python -c "from scripts.checks import registry; p={s.name for s in registry.pre_sequence()}; f={s.name for s in registry.full_sequence()}; assert 'validate_masked_errexit_steps' in p and 'validate_masked_errexit_steps' in f; print('registered in both tiers')"
    red_green_expectation: Red before registration (absent from both sets); green after both call sites are edited.
  - source: config/composite_action_body_baseline.yaml
    behavior: >-
      The r3_workflows ceiling for this body equals the live measured count and carries no
      raise-approved marker.
    verification_step: 9
    command: bin/venv-python -c "from scripts.checks.ci_guards.validate_composite_action_shell_bodies import validate_composite_action_shell_bodies as c; f=[]; c(f); assert f==[], f; from scripts.checks.ci_guards._workflow_shell_bodies import scan_workflow_bodies; import yaml,pathlib; k='.github/workflows/pr-conflict-signal.yml::detect-conflicts::poll-open-claude-prs-and-wake-conflicted-ones'; live=scan_workflow_bodies()[k]; dec=yaml.safe_load(pathlib.Path('config/composite_action_body_baseline.yaml').read_text())['r3_workflows'][k]; assert dec==live, (dec,live); print('ratchet clean, ceiling', dec)"
    red_green_expectation: Red while the entry still declares the pre-extraction ceiling of 36; green once lowered to the measured count.
  - source: scripts/validate.py
    behavior: >-
      The re-export stays a single line, so the facade keeps exposing the new check without pushing
      the file past its 500-effective-line limit.
    verification_step: 10
    command: bin/venv-python -c "from scripts.checks.structural.size_limits import effective_lines; import pathlib; n=effective_lines(pathlib.Path('scripts/validate.py').read_text()); assert n<=500, n; print('validate.py effective lines:', n)"
    waiver_reason: >-
      Re-export only -- a single import line with no branching or behaviour of its own, so there is
      no behaviour to drive red-then-green. Its correctness is fully observed by verification step 8
      (the check must appear in both registry sequences, which requires this module to import
      cleanly); the only genuine risk this file carries is the 3-line SLOC headroom, which is what
      the linked step asserts.
constraints:
  - >-
    continue-on-error true on the poll step is load-bearing and must survive: this advisory wake job
    must never red a build. The guard asserts it today; keep that assertion.
  - >-
    Do NOT implement rec-2735's own acceptance command literally. It asks for a $? check placed
    AFTER the mergeable assignment, which is unreachable code under inherited -e -- implementing it
    literally would ship a fresh instance of the defect class being fixed. The rec's own corrected
    context says so. Record the acceptance as superseded in the closing resolution.
  - >-
    Clear errexit FIRST (set +e), before the first command substitution. A guard placed after the
    assignment never executes.
  - >-
    The wiring test must spawn the script under the literal errexit-inheriting argv. A convenience
    "bash script.sh" harness drops the -e that is the entire root cause and passes vacuously
    (rec-2924's stated rationale; Decision 162 R2).
  - >-
    The r3_workflows edit is a DECREASE and must NOT carry a # raise-approved marker. Decision 165
    made marker validation retroactive and authorization-based; an unauthorized marker would fail
    on every subsequent run.
  - >-
    The new guard must be filesystem-only -- no subprocess, no network -- to stay inside the fast
    tier budget (Decision 153), matching the sibling ci_guards.
  - >-
    The scripts/validate.py re-export must be exactly ONE line. The file measures 497 effective
    lines against a 500 limit; a multi-line parenthesised import consumes the headroom.
  - >-
    Keep the workflow step's NAME unchanged. The r3_workflows key is a slug of that name, so a
    rename silently orphans the baseline entry and registers a new unbaselined body.
  - >-
    Scope the new guard to the SILENT subset (continue-on-error steps) only. The 19 loud instances
    are deliberately out of scope; widening the rule would require a grandfather roster and a
    Decision, which is exactly what scoping to zero population avoids.
  - No rescue agents or workaround loops (Decision 55).
  - Only files listed in Scope may be modified.
context:
  - >-
    "Decision-scout verdict + CITE list (verbatim decision ids)": FLAGS_FOUND (120 of 120 decisions
    triaged). CITE: Decision 162, Decision 165, Decision 166, Decision 104. RELATED: Decision 128,
    Decision 130, Decision 131, Decision 83, Decision 76, Decision 73, Decision 153, Decision 132,
    Decision 163, Decision 100, Decision 75, Decision 154, Decision 149.
  - >-
    "gates: decision-scout=FLAGS_FOUND; plan-critique=<verdict> after <N> round(s)"
  - >-
    Root cause, verified on disk: the poll step declares no shell key, so GitHub runs it as
    "bash -e {0}". The body's own "set -uo pipefail" does NOT clear the inherited -e (set only
    touches named options) and there is no set +e. Every gh call is a bare command substitution, so
    a gh failure ABORTS the step -- and continue-on-error true then reports a GREEN job with the
    remainder of the sweep silently unswept.
  - >-
    Scout flag 1 (Decision 155, WARN) accepted and acted on: the originally proposed "fail-closed"
    comments-read was fail-OPEN with respect to the wake guarantee. Bias inverted -- an unreadable
    comments-read posts the wake anyway and emits a greppable marker. A duplicate wake is cheap and
    self-limiting; a missed wake strands a session.
  - >-
    Scout flag 2 (Decision 55, NOTE) accepted and acted on: a non-zero exit under continue-on-error
    leaves the job green, so ci-rca never fires and no CC-web session reads a UI annotation. The
    script therefore mirrors every failure to $GITHUB_STEP_SUMMARY with a greppable marker (the
    _starved_marker idiom already used in .github/actions/subagent-plan-review/review.sh). Filing a
    rec from this workflow was considered and deferred -- it has no OIDC or portal dependencies today.
  - >-
    Scout flag 3 (Decision 48, NOTE) accepted, resolved MORE strongly than the scout suggested: rather
    than a one-off live workflow_dispatch, VP step 3 parses the real workflow YAML, derives the argv
    its own shell key implies, and executes its actual run body. That is hermetic, repeatable and
    CI-enforced forever, and covers the shell-key and path-resolution risks the scout named; checkout
    ordering is covered structurally by the guard. A live dispatch remains available post-merge as an
    optional confidence check (execution_steps) via mcp__github__actions_run_trigger -- the gh CLI is
    not available in CC-web.
  - >-
    Measured population of the defect class at plan time: 44 CI shell bodies declare set -u / set -o
    pipefail without ever clearing errexit; 20 of those hold at least one bare X=$(...) assignment.
    Of those 20, exactly ONE is masked by continue-on-error into a green job -- this workflow. The
    other 19 fail loudly (they red the step or job) and are out of scope.
  - >-
    That measurement is why the new guard costs nothing to install: scoped to the silent subset, its
    population is zero the moment this fix lands, so it needs no grandfather roster and no numbered
    Decision. A ratchet can only be installed roster-free at the instant its population empties, and
    this PR is that instant. Follow-on recs to file post-merge, both deliberately NOT bundled here:
    (a) extend Decision 162 R2 (literal-argv test coverage) to the workflow leg, whose composite-only
    scoping rationale weakens once a workflow body actually lives in scripts/ci/; (b) ratchet the 19
    loud instances, which does need a roster and a Decision.
  - >-
    Precedent being reused: rec-2924 (closed) fixed the identical inherited-errexit defect in
    .github/actions/subagent-plan-review/ by extracting the body to review.sh and adding
    tests/test_subagent_review_wiring.py driving it under the literal composite argv. rec-2735 asks
    for "one shared idiom"; this is it, applied to the workflow leg.
  - >-
    Verified by simulation at plan time, not assumed: running validate_pr_conflict_signal against a
    post-extraction workflow shape produces exactly 5 failures (claude/* head filter, mergeable poll,
    UNKNOWN-skip handling, CONFLICTING-only comment gate, head-SHA dedup marker). The guard update is
    therefore mandatory, not optional polish.
  - >-
    The workflow has no checkout step today because it only shells out to gh. Adding
    actions/checkout@v7 is safe here: the triggers are push:[main] and workflow_dispatch, both
    trusted refs, so no PR-controlled code enters a job holding pull-requests: write. The scout
    confirmed no active decision governs this.
  - >-
    The new .sh is governed by Decision 166's shell class in config/structural_size_budgets.yaml
    (500 effective lines, 2000 max line chars). The extracted body is ~100 lines, so it lands under
    budget with no roster entry -- a grandfather entry here would be a raise, not a decrease.
  - >-
    Branch protection requires exactly pr-validate and terraform-validate (Decision 83), so this
    advisory job can never wedge the merge gate regardless of its exit status.
  - >-
    Preflight at plan time: main 0 behind / 0 ahead, so the Main Divergence Assessment found no
    overlap and no rebase decision was required. ci_rca_unresolved_recs was empty, so the /plan hard
    block did not apply and the Related-Work check is unconstrained.
  - >-
    Tier Item Freshness Gate skipped by rule: rec-2735 is source=code-review, an ad_hoc_rec
    soft-warn exception category naming no tier_item.
pre_implementation_checklist:
  - Branch confirmed not on main
  - docs/PROJECT_CONTEXT.md read
  - only the plan-cited decision sections
  - All files in scope located and readable
