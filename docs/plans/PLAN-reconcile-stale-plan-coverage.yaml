schema_version: 1
slug: "reconcile-stale-plan-coverage"
intent: >-
  Make Reconcile TOTAL over the guard-BLOCK x stale-saved-plan cell -- today the DEP-10 fresh-replan
  fallthrough is structurally unreachable whenever the deterministic guard routes, so a red episode
  whose saved plan.bin has been staled by its own partial gated apply can only re-latch red and burn
  a human approval -- then use the repaired path ONCE to clear the stranded DEP-02 probe role and the
  red convergence record at 99eb274, which is currently blocking every terraform/personal CD apply.
plan_type: IMPLEMENTATION
verification_tier: V3
plan_path: docs/plans/PLAN-reconcile-stale-plan-coverage.yaml
closes_criteria: []
phase: >-
  Platform T2 -- rec-2847 (open, High, risk=high) against tier_item T2.37/T2.47 (Reconcile heal
  button + DEP-10 stale-plan fallthrough). The teardown half discharges the DEP-02 live-proof
  obligation that PLAN-iam-write-surface-completion.yaml explicitly DECOUPLED and handed forward
  (its "TEARDOWN DECOUPLED" context entry, TODO-TEARDOWN-ROUTE = route A). Closes no exit criterion:
  T2.37/T2.47 criteria were adjudicated met when Reconcile landed, and this plan repairs a defect in
  the landed surface rather than completing a criterion -- hence closes_criteria: []; the roadmap
  touch is a T2.48 progress_note only.
scope:
  - file: .github/workflows/reconcile.yml
    action: Modify
    purpose: >-
      THE FIX (rec-2847 part (a)). Insert ONE new aggregator step (id: route) immediately after the
      saved-plan apply step, computing needs_fresh_plan = 'true' when EITHER the saved-plan apply
      reported stale=true OR the saved-plan guard reported routed=true; then re-point the six
      existing DEP-10 fallthrough steps (replan, guard_fresh, review_fresh, apply_fresh,
      upload_fresh_plan_sha256, the upload-artifact step) and the `resolved` aggregator from
      `steps.apply.outputs.stale == 'true'` onto `steps.route.outputs.needs_fresh_plan == 'true'`,
      and re-word the wake comment off `STALE` onto the new `fresh_reason`. NOTHING ELSE MOVES: the
      guard, the review gate, the sha256 EMIT/VERIFY pair, the run-scoped
      RECONCILE_FRESH_PLAN_ARTIFACT hand-off, and the whole gated-apply-reconcile job are REUSED
      verbatim -- gated-apply-reconcile needs zero edits because it already branches on
      needs.apply-reconcile.outputs.fresh_plan_pending.
  - file: scripts/verify_ci_workflow.py
    action: Modify
    purpose: >-
      Add `_check_recovery_workflow_topology()` (rec-2847 part (c), NARROWED -- see the
      REC-2847 PARTIAL CLOSURE context entry): a yaml-parsed structural guard over reconcile.yml
      asserting the four invariants this plan establishes -- (i) the `route` step exists and its
      body references BOTH cause signals; (ii) no fresh-replan fallthrough step is gated on
      `steps.apply.outputs.stale` any more, and each is gated on `needs_fresh_plan`; (iii) the
      saved-plan apply step still carries the stale-signature detection (the DEP-10 stale path is
      ADDED TO, never replaced); (iv) the cross-job hand-off is intact (`fresh_plan_pending` job
      output declared, download+verify gated on it, fetch-saved-plan gated on its negation).
      Register it in the module's `_COMMANDS` map alongside its siblings. Currently 314 SLOC of a
      500 budget, so ~50 added SLOC needs no decomposition and no budget entry (Decision 128).
  - file: scripts/checks/ci_guards/validate_ci_workflow_guards.py
    action: Modify
    purpose: >-
      Wire the new guard into `_load_guards()` as label `recovery-workflow-topology`, so it runs in
      BOTH the --pre and full tiers via the already-registered validate_ci_workflow_guards check.
      validate.py is the CI source of truth -- no ci.yml edit is needed or permitted.
  - file: tests/verify_ci_workflow/test_apply_and_terraform.py
    action: Modify
    purpose: >-
      Positive + negative tests for `_check_recovery_workflow_topology` in the file that already
      owns the terraform-apply/reconcile-adjacent guard tests. The LOAD-BEARING negative is the
      exact-defect fixture: a reconcile.yml shape whose fallthrough steps are gated on
      `steps.apply.outputs.stale == 'true'` with no `route` step MUST fail -- i.e. the guard would
      have caught the live defect. Plus: missing route step fails; missing `fresh_plan_pending` job
      output fails; a gated job whose download step is not gated on fresh_plan_pending fails; a
      shape that DROPS the saved-plan stale-signature detection fails; and the real on-disk tree
      passes.
  - file: docs/ROADMAP-PLATFORM.yaml
    action: Modify
    purpose: >-
      T2.48 progress_note ONLY -- discharge the TODO-TEARDOWN-ROUTE handoff the sibling plan left
      open: record that route A was taken (fix rec-2847, then dispatch Reconcile), the teardown
      outcome (probe role destroyed, record green), and the two follow-on rec ids. No criterion or
      item status flip (Status-Trusted-Never-Inferred).
bundled_recommendations:
  - rec-2847
infrastructure_dependencies:
  - >-
    HARD CROSS-PLAN DEPENDENCY -- the TEARDOWN HALF (VP steps 7-11) CANNOT RUN until
    docs/plans/PLAN-iam-write-surface-completion.yaml has completed its human-gated
    terraform/bootstrap admin apply. The probe-role destroy needs iam:ListInstanceProfilesForRole
    AND iam:RemoveRoleFromInstanceProfile on role/agent-platform-*, which that plan grants (its
    P0-1 gap) in BOTH the identity policy and the permissions-boundary DataPlaneAllow ceiling.
    Without both layers the gated apply dies AccessDenied exactly as run 30264239445 did (rec-2882).
    VP step 7 is the live gate on this dependency and MUST pass before VP step 8 is dispatched.
  - >-
    THE FIX HALF (VP steps 1-6) HAS NO SUCH DEPENDENCY and can merge at any time: it touches
    .github/workflows/** and scripts/**, NOT terraform/personal/**, so it does not match
    terraform-apply-sandbox.yml's path filter, does not trigger a speculative plan or an apply, and
    is therefore mergeable while the convergence record is RED. Sequence the PR accordingly -- do
    not hold the fix behind the sibling plan.
  - >-
    The fix is dispatch-ref-resolved, which is WHY it can heal a pre-fix red commit. GitHub reads
    reconcile.yml's own job/step/`if:` definitions at the dispatch ref (Decision 154 / rec-2862
    narrowing, restated at the top of reconcile.yml). The `route` step is a plain `run:` in that
    file -- not a composite action -- so it exists on dispatch even though RED_SHA (99eb274)
    predates it. Every `uses: ./.github/actions/...` reference still resolves from the RED_SHA
    checkout; this plan adds NO composite action and changes NONE, so that split is untouched.
  - >-
    Guard classification is UNCHANGED. scripts/terraform_apply_guard.py and
    .github/actions/deterministic-guard/action.yml are NOT in scope. A destroy still BLOCKs (exit
    2 -> routed=true, action exits 0), the tf-gated-apply Environment is still the authorization
    boundary (Decision 92), and the human approval still gates the apply. This plan changes only
    WHICH plan artifact the already-approved gated job applies, never WHAT gates.
  - >-
    A fresh re-plan at RED_SHA cannot silently widen the diff. (a) Every source_code_hash in
    terraform/personal is `try(filemd5(...), null)` AND carries `ignore_changes =
    [source_code_hash]` (ducklake_lambdas.tf:59/74, 84/94, 278/302, 323/347;
    ducklake_catalog_dr.tf:190/205, 225/255; ducklake_maintenance.tf:159/197;
    ducklake_maintenance_smoke.tf:147/180; prod_lambdas.tf:36-37/349/385/425), so the artifact-fetch
    step landing lambda-packages/ under .dispatch-tooling/ rather than the workspace root cannot
    manufacture a lambda code diff. (b) A red convergence record is the SOLE hard block on the
    sandbox apply path, so no terraform/personal apply has landed since 99eb274 -- state is
    99eb274 plus the partial gated apply, and planning at RED_SHA is therefore the correct base,
    not a rollback of later work.
acceptance_criteria:
  - >-
    The guard-BLOCK x stale-saved-plan cell is COVERED: on a saved-plan guard-BLOCK, apply-reconcile
    re-plans fresh, re-runs the deterministic guard against the fresh plan, and (on the expected
    fresh guard-ROUTE) uploads it as RECONCILE_FRESH_PLAN_ARTIFACT with a sha256 job output, so
    gated-apply-reconcile applies the FRESH plan after the human approval instead of a saved plan.bin
    that terraform will reject as stale. Verified structurally pre-merge (VP 1-6) and end-to-end
    post-merge by the DEP-02 teardown run (VP 8-9).
  - >-
    The pre-existing stale-apply route is ADDED TO, not replaced: `steps.apply` still emits
    stale=true on terraform's stale-plan signature, and a guard-PASS run's behaviour is
    bit-for-bit unchanged (on PASS, `steps.guard.outputs.routed` is empty, so needs_fresh_plan
    depends solely on stale exactly as today). The change is strictly additive on the BLOCK route.
  - >-
    Decision 77 no-TOCTOU holds on the new route: the fresh plan is re-guarded by the SAME
    deterministic guard before anything is handed anywhere, is subagent-reviewed whenever the fresh
    guard PASSes (unchanged `review_fresh` condition), is byte-verified across the job boundary by
    the symmetric sha256 EMIT/VERIFY pair, and is applied only behind the tf-gated-apply
    Environment approval. Nothing is ever applied unguarded or unapproved.
  - >-
    A NEW standing --pre gate makes the defect non-reintroducible: label
    `recovery-workflow-topology` runs inside validate_ci_workflow_guards in BOTH tiers, and a
    negative test proves it FAILS against the exact pre-fix shape (fallthrough steps gated on
    `steps.apply.outputs.stale` with no `route` step) -- i.e. it would have caught the live defect
    that a plan author plus decision-scout, plan-critique and code-review all missed.
  - >-
    `agent-platform-probe-liveproof-role` is ABSENT from live AWS (iam:GetRole under the
    agent_platform_admin profile returns NoSuchEntity), and the gated destroy applied with ZERO
    AccessDenied in the run log.
  - >-
    The sandbox convergence record at s3://agent-platform-data-lake/convergence/personal/sandbox.json
    reads status=green (it is status=red at commit_sha 99eb2740c4402051e47ef12fa2d0e3a08f20a4a3,
    run 30264239445, as of this plan's authoring), unblocking terraform/personal CD applies.
  - >-
    rec-2847's closure is HONEST, not a blanket claim: it is closed with a resolution that names
    exactly what landed (part (a) in full; part (c) narrowed to reconcile.yml's red-recovery
    topology) AND names the follow-on rec id carrying its unlanded part (b) -- the single-heal-verb
    demotion of terraform-apply-sandbox's acknowledge_red_commit -- plus the generalised topology
    sweep. The follow-on rec is filed BEFORE rec-2847 is closed.
verification_plan:
  - step: 1
    phase: pre-deploy
    action: >-
      Assert the new `route` aggregator step exists in apply-reconcile and reads BOTH cause signals
      -- a route step that only reads one of them reproduces the defect in a new location.
    command: |-
      f=.github/workflows/reconcile.yml; rc=0
      grep -qF 'id: route' "$f" || { echo "MISSING route step"; rc=1; }
      grep -qF 'SAVED_PLAN_STALE: ${{ steps.apply.outputs.stale }}' "$f" || { echo "MISSING stale cause"; rc=1; }
      grep -qF 'SAVED_PLAN_ROUTED: ${{ steps.guard.outputs.routed }}' "$f" || { echo "MISSING guard-route cause"; rc=1; }
      grep -qF 'needs_fresh_plan=true' "$f" || { echo "MISSING needs_fresh_plan emit"; rc=1; }
      grep -qF 'fresh_reason=guard_routed' "$f" || { echo "MISSING guard_routed reason"; rc=1; }
      exit $rc
    expected: >-
      Exit 0 with no MISSING lines -- the route step is present and both the stale-saved-plan cause
      and the guard-routed cause feed it.
    fix_if: >-
      MISSING guard-route cause is the defect itself: needs_fresh_plan would then still only ever be
      true on the stale-apply path, leaving the guard-BLOCK cell exactly as uncovered as before.
    hermetic: true
    graduation: waive
    graduation_waiver_reason: >-
      Duplicated by assertion (i) of `_check_recovery_workflow_topology`, which this same plan lands
      as a standing --pre gate inside validate_ci_workflow_guards. A verification-registry row would
      be a third copy of an invariant that already has a first-class, yaml-parsed (not grep-proxy)
      gate in validate.py.
  - step: 2
    phase: pre-deploy
    action: >-
      Assert the defect is GONE at the gating layer: zero fallthrough steps still gated on the
      saved-plan apply's stale output, and at least six gated on the new aggregate signal (replan,
      guard_fresh, review_fresh, apply_fresh, upload_fresh_plan_sha256, upload-artifact).
    command: |-
      f=.github/workflows/reconcile.yml; rc=0
      n=$(grep -cF "steps.apply.outputs.stale == 'true'" "$f"); echo "legacy_stale_only_gates=$n"
      [ "$n" -eq 0 ] || rc=1
      m=$(grep -cF "steps.route.outputs.needs_fresh_plan == 'true'" "$f"); echo "needs_fresh_plan_gates=$m"
      [ "$m" -ge 6 ] || rc=1
      exit $rc
    expected: >-
      Exit 0, legacy_stale_only_gates=0 and needs_fresh_plan_gates>=6.
    fix_if: >-
      legacy_stale_only_gates>0 -- at least one fallthrough step was left on the old signal and is
      still unreachable on a guard-BLOCK. needs_fresh_plan_gates<6 -- a step was re-pointed to a
      different expression or missed entirely, so the fresh path is only partially reachable
      (worse than the status quo: a half-executed fallthrough can upload no artifact while
      reporting routed=true, stranding the gated job with no plan at all).
    hermetic: true
    graduation: waive
    graduation_waiver_reason: >-
      Duplicated by assertion (ii) of `_check_recovery_workflow_topology`, which performs the same
      check over the PARSED per-step `if:` expressions rather than a whole-file grep count -- the
      registry-row form would be the strictly weaker of the two.
  - step: 3
    phase: pre-deploy
    action: >-
      Assert the pre-existing DEP-10 stale-apply detection survived intact -- this plan ADDS a
      second entry condition to the fallthrough, it must not silently delete the first.
    command: |-
      f=.github/workflows/reconcile.yml; rc=0
      grep -qF 'saved plan is stale|plan file can no longer be applied|state was changed' "$f" || { echo "MISSING stale signature grep"; rc=1; }
      grep -qF 'stale=true' "$f" || { echo "MISSING stale=true emit"; rc=1; }
      grep -qF 'STALE_PLAN_FRESH_REPLAN' "$f" || { echo "MISSING STALE_PLAN_FRESH_REPLAN notice"; rc=1; }
      exit $rc
    expected: Exit 0 with no MISSING lines.
    fix_if: >-
      A MISSING line means the guard-BLOCK route was implemented by REPLACING the stale route rather
      than unioning with it -- a guard-PASS run whose saved plan is stale would then latch red with
      no fallthrough, converting a fixed cell into a newly-broken one.
    hermetic: true
    graduation: waive
    graduation_waiver_reason: >-
      Duplicated by assertion (iii) of `_check_recovery_workflow_topology`. This is a
      don't-regress-the-sibling-path assertion whose natural home is the standing gate, not a
      registry row that only fires when someone re-runs this plan's VP.
  - step: 4
    phase: pre-deploy
    action: >-
      Assert the cross-job hand-off this fix REUSES is still wired end to end: apply-reconcile
      declares the fresh_plan_pending output, gated-apply-reconcile's download and sha256-VERIFY
      steps are gated on it, and fetch-saved-plan is gated on its negation (so the two plan sources
      remain mutually exclusive).
    command: |-
      f=.github/workflows/reconcile.yml; rc=0
      grep -qF 'fresh_plan_pending: ${{ steps.upload_fresh_plan_sha256.outcome' "$f" || { echo "MISSING fresh_plan_pending job output"; rc=1; }
      grep -qF 'fresh_plan_sha256: ${{ steps.upload_fresh_plan_sha256.outputs.sha256 }}' "$f" || { echo "MISSING fresh_plan_sha256 job output"; rc=1; }
      a=$(grep -cF "needs.apply-reconcile.outputs.fresh_plan_pending == 'true'" "$f"); echo "download_and_verify_gates=$a"
      [ "$a" -ge 2 ] || rc=1
      grep -qF "needs.apply-reconcile.outputs.fresh_plan_pending != 'true'" "$f" || { echo "MISSING fetch-saved-plan negation gate"; rc=1; }
      exit $rc
    expected: >-
      Exit 0, download_and_verify_gates>=2 (the actions/download-artifact step and the sha256 VERIFY
      step), and the fetch-saved-plan negation gate present.
    fix_if: >-
      A missing output or gate means the fresh plan never crosses the job boundary: gated-apply-
      reconcile would fall back to fetch-saved-plan and apply the STALE saved plan.bin -- the exact
      failure this plan exists to remove, now reached by a longer road.
    hermetic: true
    graduation: waive
    graduation_waiver_reason: >-
      Duplicated by assertion (iv) of `_check_recovery_workflow_topology`, which reads the parsed
      job outputs and per-step `if:` expressions. Also: this asserts pre-existing machinery this
      plan deliberately does not modify, so a registry row would be guarding someone else's surface
      from this plan's row.
  - step: 5
    phase: pre-deploy
    action: >-
      Run the new guard directly against the real on-disk tree AND prove it is actually wired into
      the presubmit tier -- an unwired guard is a comment, not a gate (Decision 60).
    command: |-
      bin/venv-python -c "
      from scripts.checks.ci_guards.validate_ci_workflow_guards import _load_guards
      from scripts.verify_ci_workflow import _check_recovery_workflow_topology
      labels = [label for label, _ in _load_guards()]
      assert 'recovery-workflow-topology' in labels, labels
      _check_recovery_workflow_topology()
      print('PASS recovery-workflow-topology wired:', labels)
      "
    expected: >-
      Exit 0, printing a PASS line whose label list contains recovery-workflow-topology. The
      import of `_load_guards` (not a source grep) is what proves real tuple membership.
    fix_if: >-
      AssertionError on the label list -- the guard function exists but was never added to
      `_load_guards()`, so validate --pre never calls it. An AssertionError raised from inside
      `_check_recovery_workflow_topology` means the workflow edits and the guard disagree; fix
      whichever is wrong, never loosen the guard to match a broken workflow.
    hermetic: true
    graduation: waive
    graduation_waiver_reason: >-
      This step IS the standing gate being invoked directly -- graduating it would register a
      verification-registry row whose sole job is to call a check that validate.py already calls in
      both tiers. That is a literal self-duplication, not a regression guard.
  - step: 6
    phase: pre-deploy
    action: >-
      Run the new unit tests, including the LOAD-BEARING negative that rebuilds the exact pre-fix
      reconcile.yml shape and asserts the guard REJECTS it -- the "would this have caught the bug"
      proof, not a structural existence check.
    command: bin/venv-python -m pytest tests/verify_ci_workflow/test_apply_and_terraform.py -k recovery_workflow_topology -q
    expected: >-
      All selected tests pass, and the selection is non-empty (at least one positive against the
      real file and five negatives: pre-fix stale-only gating, missing route step, missing
      fresh_plan_pending output, ungated download step, dropped stale-signature detection).
    fix_if: >-
      "no tests ran" means the -k selector does not match the new test names -- rename the tests to
      contain recovery_workflow_topology rather than weakening the selector. A failing pre-fix
      negative means the guard does not actually detect the defect it was written for, which makes
      the whole part-(c) claim false.
    hermetic: false
    graduation: waive
    graduation_waiver_reason: >-
      A pytest selector over tests/ already runs in BOTH standing tiers (pytest_diff in --pre when
      the test file changes, and the full-tier pytest run unconditionally). A verification-registry
      test_selector row would be a third invocation of the same tests with no additional coverage.
  - step: 7
    phase: post-deploy
    action: >-
      HARD CROSS-PLAN DEPENDENCY GATE. Before dispatching anything, prove LIVE that the sibling
      plan's human-gated terraform/bootstrap admin apply has landed and that the apply role can
      actually complete an IAM role destroy under the identity/boundary intersection. Run in the
      ADMIN container -- PlatformDev holds no iam:SimulatePrincipalPolicy/iam:GetRole. The account
      id is resolved at runtime and never written down (Decision 101).
    command: |-
      ACCT=$(aws sts get-caller-identity --profile agent_platform_admin --query Account --output text)
      aws iam simulate-principal-policy --profile agent_platform_admin \
        --policy-source-arn "arn:aws:iam::${ACCT}:role/agent-platform-github-ci-apply" \
        --action-names iam:ListInstanceProfilesForRole iam:RemoveRoleFromInstanceProfile iam:DeleteRole iam:DeleteRolePolicy \
        --resource-arns "arn:aws:iam::${ACCT}:role/agent-platform-probe-liveproof-role" \
        --query 'EvaluationResults[].[EvalActionName,EvalDecision]' --output text
    expected: >-
      Four rows, every EvalDecision = allowed. simulate-principal-policy evaluates the principal's
      identity policies AND its attached permissions boundary, so `allowed` here means the
      intersection permits the destroy -- exactly what run 30264239445 lacked.
    fix_if: >-
      Any implicitDeny/explicitDeny -- the sibling plan
      (docs/plans/PLAN-iam-write-surface-completion.yaml) has not completed its bootstrap admin
      apply, or granted the verb in only one of the two layers. STOP: do NOT dispatch Reconcile.
      Dispatching now burns a human Environment approval and re-latches red for the fourth time.
      An AccessDenied on simulate-principal-policy itself means you are in the DEV container --
      re-run in ADMIN.
  - step: 8
    phase: post-deploy
    action: >-
      Dispatch the input-free Reconcile action from main and observe the repaired route take effect:
      resolve-target resolves 99eb274, the saved-plan guard BLOCKs the destroy, the new `route` step
      sets needs_fresh_plan=true (fresh_reason=guard_routed), a fresh plan is produced and
      re-guarded, and the fresh plan.bin is uploaded as RECONCILE_FRESH_PLAN_ARTIFACT while
      gated-apply-reconcile waits on the tf-gated-apply Environment. Human-gated: a reviewer must
      then approve in the GitHub Actions UI. rec_id is deliberately omitted (rec-2847 will be closed
      by this plan's own merge, and the input is a traceability link only -- Reconcile always reads
      the red commit from the record).
    command: |-
      gh workflow run reconcile.yml --ref main
      sleep 15
      RUN=$(gh run list --workflow reconcile.yml --limit 1 --json databaseId --jq '.[0].databaseId')
      echo "reconcile run: $RUN"
      gh run view "$RUN" --json status,jobs --jq '{status:.status, jobs:[.jobs[]|{name,status,conclusion}]}'
    expected: >-
      apply-reconcile completes successfully (its own apply step SKIPPED -- routed -- with the
      fresh-replan steps EXECUTED, not skipped), and gated-apply-reconcile sits in
      waiting/queued pending the Environment approval. The wake comment on PR #779 should say the
      fresh plan was routed to tf-gated-apply.
    fix_if: >-
      apply-reconcile succeeded with replan/guard_fresh SKIPPED -- the dispatch resolved an OLD copy
      of reconcile.yml; confirm the fix is merged to main and that --ref main was used. resolve-
      target reporting actionable=false means someone already cleared the record; re-check the
      record and stop. A failure inside `replan` means terraform could not plan at RED_SHA -- read
      the log, do NOT retry blindly (Decision 55).
  - step: 9
    phase: post-deploy
    action: >-
      After the human approves the tf-gated-apply Environment, assert the gated apply of the FRESH
      plan succeeded with zero AccessDenied -- the specific failure mode of run 30264239445.
    command: |-
      RUN=$(gh run list --workflow reconcile.yml --limit 1 --json databaseId --jq '.[0].databaseId')
      gh run view "$RUN" --json conclusion,jobs --jq '{conclusion:.conclusion, jobs:[.jobs[]|{name,conclusion}]}'
      n=$(gh run view "$RUN" --log 2>/dev/null | grep -ci "accessdenied" || true)
      echo "accessdenied_lines=${n:-0}"
      [ "${n:-0}" -eq 0 ]
    expected: >-
      conclusion=success, both apply-reconcile and gated-apply-reconcile conclusion=success, and
      accessdenied_lines=0.
    fix_if: >-
      accessdenied_lines>0 names a verb the sibling plan still does not grant -- capture the verb
      and the resource, and file it rather than patching inline (Decision 55/72). A stale-plan error
      in the gated job means fresh_plan_pending did not reach it: re-check VP step 4's assertions
      against the merged file.
  - step: 10
    phase: post-deploy
    action: >-
      Prove the probe role is GONE from live AWS -- terraform reporting a successful destroy is not
      the same claim. ADMIN container (PlatformDev has no iam:GetRole).
    command: |-
      out=$(aws iam get-role --role-name agent-platform-probe-liveproof-role --profile agent_platform_admin 2>&1) || true
      printf '%s\n' "$out" | head -3
      printf '%s' "$out" | grep -q "NoSuchEntity" && echo "PROBE ABSENT (expected)"
    expected: >-
      Exit 0 printing "PROBE ABSENT (expected)" -- get-role fails with NoSuchEntity.
    fix_if: >-
      get-role SUCCEEDS -- the role still exists, so the destroy did not actually run (most likely
      the gated job applied a plan that no longer contained it). Do not re-dispatch until VP step 9's
      log has been read. An AccessDenied here means you are in the DEV container.
  - step: 11
    phase: post-deploy
    action: >-
      Assert the convergence record has flipped to green, which is what actually unblocks
      terraform/personal CD applies. Readable from the DEV container under the agent_platform
      profile (verified at authoring time).
    command: |-
      aws s3 cp s3://agent-platform-data-lake/convergence/personal/sandbox.json - --profile agent_platform | tee /dev/stderr | grep -qE '"status"[[:space:]]*:[[:space:]]*"green"'
    expected: >-
      The record prints and matches status green. At authoring time it reads
      {"status": "red", "commit_sha": "99eb2740c4402051e47ef12fa2d0e3a08f20a4a3", "run_id": "30264239445", ...}.
    fix_if: >-
