rollback: >-
  The fix half is a single-commit revert of .github/workflows/reconcile.yml plus the guard and its
  tests; reverting restores the pre-fix behaviour (guard-BLOCK -> gated job applies the saved plan
  verbatim), which is the status quo ante, not a new failure mode. The teardown half has no
  rollback in the ordinary sense: a failed gated apply leaves the convergence record red at 99eb274
  and the probe role live -- i.e. exactly today's state -- and the recovery is to read the run log
  and file (Decision 55), never to re-dispatch blindly. If the repaired route itself fails, the
  break-glass fallback is route B from the sibling plan (an admin fresh-plan apply with the human
  present); that fallback is precisely why rec-2847 part (b) is deliberately NOT landed here.
