    `SAVED_PLAN_ROUTED: ${{ steps.guard.outputs.routed }}`, body emitting `needs_fresh_plan=true` +
    `fresh_reason=stale_saved_plan` when SAVED_PLAN_STALE is true, `needs_fresh_plan=true` +
    `fresh_reason=guard_routed` when SAVED_PLAN_ROUTED is true, else `needs_fresh_plan=false` +
    empty `fresh_reason`. `if: success()` (NOT always()) is deliberate -- a genuine non-stale apply
    failure or a guard internal error must keep short-circuiting to the always-run red record write,
    exactly as today.
    THE STEP'S `name:` IS LOAD-BEARING AND FIXED, NOT free text: it MUST be exactly
    `Resolve fresh-plan entry condition (saved-plan stale OR saved-plan guard-routed)`. VP step 8
    asserts step conclusions through the GitHub REST jobs API, which keys steps by NAME (it does not
    expose `id`), so any deviation makes the only runtime proof this plan gets read `<ABSENT>`. If
    the name must change, change VP step 8's assertion string in the same commit.
