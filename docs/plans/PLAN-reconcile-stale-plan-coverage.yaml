    step's `pre-apply-failure` / `failed-step` expressions -- Decision 154 requires them computed
    inline from steps.apply / steps.apply_fresh, and `route` must not appear in them.
    WHILE YOU ARE IN THAT BLOCK, kill the newly-dead branch rather than leaving it: post-fix, the
    else-branch's `routed=${GUARD_ROUTED:-false}` can NEVER yield true, because reaching the else
    branch means NEEDS_FRESH != 'true', which (by the route step's own union) means the saved-plan
