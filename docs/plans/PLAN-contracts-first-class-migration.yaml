  - "docs/DECISIONS.md -- author exactly one entry with the three bold markers and an envelope
    carrying number, significance.value numbered_decision and a non-empty significance.justification,
    amends [118, 167], under 6,144 bytes; then add the two annotations naming Decision 168 inside
    Decisions 118 and 167."
  - "Regenerate docs/decisions-index.json via `bin/venv-python -m scripts.decisions_index --write`."
  - "config/agent/verification_registry/registry.yaml -- add exactly THREE rows with the full shape
