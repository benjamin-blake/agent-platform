  - All files in scope located and readable
  - Acceptance criteria understood and verifiable
  - Re-checked the current max '## Decision NNN:' header before authoring the entry
  - Confirmed map_source_to_test's resolved package path before creating the test package
  - Confirmed the gate-visible non-ritual count before writing the pin
execution_steps:
  - "scripts/contracts_schema.py -- add ContractClass.D and ContractStatus.active; add optional typed
    subject/evaluator; validator requires both for D and requires ratified_via when status is
    ratified; _validate_class_shape raises for D. Add NO baseline-dependent rule here."
  - "scripts/contracts.py -- add load_contract_meta; add the three active edges and omit
    ratified->active and draft->active; make load_all_contracts skip D with a docstring note naming
    context_docs.py's bare except as the silent-failure mode being guarded."
  - "scripts/checks/contracts/_shared.py -- add the merge-base path-set baseline, the -M rename map
    and the evaluator resolver, each with an explicit injection seam; document why this is not a
    generalisation of the decisions-domain _baseline.py."
  - "scripts/checks/contracts/validate_contract_drift.py -- implement (a)-(m) from the scope entry,
    in that branch order. Read the pin from the INJECTED contracts_dir."
  - "docs/contracts/contract-population.yaml -- author the Class D self-hosting contract; re-derive
    the pin before committing and record the zero-slack rationale."
  - "docs/contracts/file-router.yaml -- add the route row; its topic is the new contract's subject."
  - "scripts/test_coverage_checker.py -- register the gate in _CONCERN_SPLIT_TEST_PACKAGES, then run
