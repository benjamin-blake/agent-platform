pre_implementation_checklist:
  - Branch confirmed not on main
  - docs/PROJECT_CONTEXT.md read
  - only the plan-cited decision sections
  - All files in scope located and readable
  - Acceptance criteria understood and verifiable
  - Re-checked the current max '## Decision NNN:' header before authoring the entry
execution_steps:
  - "scripts/contracts_schema.py -- add ContractClass.D and ContractStatus.active; add optional
    typed subject/evaluator to ContractMeta with a required-for-D validator; add the Class D branch
    to _validate_class_shape (no fields, no verbs, subject and evaluator both present)."
  - "scripts/contracts.py -- add load_contract_meta (envelope-only, never constructs
    ContractDocument); add the three active edges to _ALLOWED_TRANSITIONS and deliberately omit
    ratified->active and draft->active; make load_all_contracts skip class D explicitly with a
    docstring note naming preflight/context_docs.py as the consumer being protected."
  - "docs/contracts/contract-population.yaml -- author the Class D self-hosting contract: subject,
    evaluator, the declared-shape grammar, the evaluator-kind union and its verification rules, the
    subject namespace rule, the change-detection rule, the census field list, and ratchet.grandfathered_max: 23
    with a note that evaluator_none and status_active pins are the sweep's to set."
  - "scripts/checks/contracts/validate_contract_drift.py -- narrow the skip branch; add the memoized
    origin/main file-set baseline delegating reachability to _common.origin_main_reachable; validate
    Class D via load_contract_meta; add subject-uniqueness over the union namespace; extend Pass 2
    with the canonical-dump amendment rule for Class D; print the census; enforce the pin read from
    the contract at check time; advisory-SKIP only the baseline-dependent legs when origin/main is
    unreachable."
  - "docs/contracts/file-router.yaml -- add the contract-population route row naming both admissible shapes."
  - "tests/checks/contracts/test_validate_contract_drift.py and tests/test_contracts.py --
    add the fixture classes named in the Verification Plan. Every new-behaviour fixture must fail
    against the pre-change gate; a fixture that passes both before and after is tautological and
    must be replaced, not waived."
  - "docs/DECISIONS.md -- author exactly one entry with the Decision 167 typed envelope
    (significance.value: numbered_decision, amends: [118, 167]), recording the ruling and citing
    contract-population.yaml for every shape. Keep it under 6,144 bytes. Include the explicit clause
    that this is NOT migration-step-3 completion and that the population sweep is the completing act."
  - "audits/contract-first-governance-33c8667.yaml -- append one dated amendment note under
    meta.contract_notes in the amendment_2026-08-07 form: the ratchet's why, a pointer to
    contract-population.yaml for the how, and an explicit statement that findings, severities and
    Q1-Q9 verdicts are unchanged."
  - "File the Critical drain recommendation via the ops portal (machine enforcers for contracts
