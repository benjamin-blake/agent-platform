work_areas: []
rollback: >-
  Every change is additive and forward-only. Reverting restores the original skip branch and the
  single-file test module; no existing contract file's content changed except one file-router route
  row; the new Decision entry and its two annotation lines are removed by the same revert, and
  docs/decisions-index.json regenerates from the reverted corpus. The enum widenings are additive, so
  no persisted status or class value becomes invalid on revert -- except contract-population.yaml
  itself, which the revert deletes.
