schema_version: 4
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: "contracts-first-class-migration"
intent: >-
  Make docs/contracts/ a first-class destination for MECHANISM content by giving mechanism
  contracts a real class in the CD.25 taxonomy (Class D), so that routing specification OUT of
  docs/DECISIONS.md stops meaning routing it to a less-governed surface. Installs the obligation
  forward-only on NEW contract files, makes subject-uniqueness well-posed for the first time,
  extends amendment-log-on-change and status-transition enforcement to the new class, and pins the
  grandfathered population as a visible downward-only ratchet.
plan_type: IMPLEMENTATION
verification_tier: V2
plan_path: docs/plans/PLAN-contracts-first-class-migration.yaml
phase: >-
  Migration step 3 (MECHANISM HALF ONLY) of audits/contract-first-governance-33c8667.yaml.
  Per-finding disposition, stated precisely so a future session does not read these as closed --
  CFG-04: substrate installed (a new file with neither shape fails the gate); its acceptance's
  second clause (seed the existing free-form files) is UNMET. CFG-05: mechanism installed
  (subject-uniqueness); its acceptance's second clause (the seeded population passes) is UNMET, and
  the detector catches no existing named instance (see the subject-recall constraint below).
  CFG-09: LEAST addressed of the three and the only high-severity one -- amendment-log-on-change
  reaches Class D only, so an edit to marker-grammar.yaml or decision-entry.yaml still requires no
  log after this lands, and router coverage moves 8/39 -> 9/40. The completing act for all three is
  the population sweep. Steps 1 (PR #863) and 2 (Decision 167, PR #871) are merged. Platform
  tier_item T2.56 is not_started with both criteria open; this plan closes none and declares no
  closes_criteria. EXPLICITLY NOT step-3 completion, and it does NOT fire Decision 167 clause 3.
scope:
  - file: scripts/contracts_schema.py
    action: Modify
    purpose: >-
      (a) Add `D` to ContractClass -- the mechanism/procedure class, whose body is heterogeneous by
      nature. (b) Add `active` to ContractStatus, meaning in force and consumed but never put
      through the CD.25 ritual; it exists so the sweep can seed the grandfathered files honestly
      instead of asserting they are `ratified`, which would claim they passed a ritual that has
      never run. (c) Add optional typed `subject: str | None` and `evaluator: DeclaredEvaluator |
      None` to ContractMeta. (d) Put the REACHABLE Class D rules on ContractMeta's own model
      validator, because the Class D path never constructs a ContractDocument: D MUST carry both
      subject and evaluator; `status: active` is REJECTED AT BIRTH for EVERY class (A/B/C/D alike),
      so no contract can be born claiming in-force status without ratification; and
      `evaluator.none_grandfathered` is likewise rejected at birth. (e) Give
      _validate_class_shape an explicit Class D branch that RAISES ("Class D must be loaded via
      load_contract_meta") rather than silently falling through to the Class C else-branch -- this
      makes the mis-routing loud instead of adding a dead branch that reads as enforcement.
  - file: scripts/contracts.py
    action: Modify
    purpose: >-
      (a) Add `load_contract_meta(path) -> ContractMeta`: an ENVELOPE-ONLY loader validating only
      `data["contract"]`, never constructing ContractDocument. This is how Class D escapes
      `extra="forbid"` (contracts_schema.py:155) without relaxing the shared model. The rejected
      alternative -- nesting D bodies under a `spec:` key -- would push every consumer of the
      free-form population one level down; the concrete verified instance is validate_placement's
      top-level `routes:` read (validate_placement.py:19,38). NOTE the earlier draft also cited
      _marker_guard reading marker-grammar.yaml; that is FALSE (_marker_guard.py:7-9 states it is
      "the enforcement counterpart, not the semantics source" and nothing safe_loads that file), and
      the corrected argument must not be inherited by the sweep. (b) Add the `active` edges to
      _ALLOWED_TRANSITIONS -- active->ratified (the sweep's terminus), active->deprecated,
      active->superseded -- and deliberately NO ratified->active and NO draft->active.
      (c) load_all_contracts CONTINUES to return only Class A/B/C, explicitly skipping D. This is
      load-bearing against a SILENT regression, not a loud one: without it _is_ritual_contract
      returns True for a D file, load_contract raises on extra=forbid, and
      scripts/preflight/context_docs.py:270's bare `except Exception: pass` would swallow it and
      kill the whole provisional scan.
  - file: scripts/checks/contracts/_shared.py
    action: Modify
    purpose: >-
      Add the memoized origin/main PATH-SET baseline reader for docs/contracts/ (one
      `git ls-tree -r --name-only`), plus the rename map derived from `git diff -M --name-status`.
      Reachability delegates to the existing _common.origin_main_reachable -- never a private
      duplicate (Decision 134 clause 3). Deliberately NOT a generalisation of
      scripts/checks/decisions/_baseline.py: that module is a decision-NUMBER-set reader in the
      decisions domain, this is a PATH-set reader in the contracts domain, and Decision 104 forbids
      a cross-domain shared helper. The shared thing (reachability) IS shared; the domain primitive
      is not. Record this reasoning in the module docstring so the non-generalisation reads as a
      decision rather than an oversight.
  - file: scripts/checks/contracts/validate_contract_drift.py
    action: Modify
    purpose: >-
      The mechanism, in the gate that already owns this population. (a) NARROW the skip branch at
      lines 70-72 -- a file carrying neither a ritual `contract:` block with `class:` nor a valid
      Class D shape FAILS if new vs the origin/main baseline, and is counted as grandfathered
      otherwise. (b) Class D validation via load_contract_meta, PLUS a raw-mapping check that a
      Class D file carries no top-level `fields:` or `verbs:` -- enforced on the parsed dict the
      gate already holds, because this is the seam through which a genuine Class A table schema
      could be authored as Class D to escape check_required_inline_fields and resolve_refs.
      (c) NEW-FILE PROHIBITIONS, all three symmetric -- a new file may not declare `status: active`,
      may not declare `evaluator: {none_grandfathered: ...}`, and may not omit either admissible
      shape. (d) SUBJECT-UNIQUENESS over the union of declared subjects and ritual contract ids,
      deduped PER FILE so a ritual contract declaring its own id as its subject does not collide
      with itself. (e) Pass 2 for Class D -- run validate_status_transition on the ContractMeta
      pair (this is what closes the land-as-draft-then-flip-to-active path; without it Class D never
      reaches _ALLOWED_TRANSITIONS at all, because check_status_transition takes a ContractDocument
      that a D body cannot become), and amendment-log-on-change by comparing canonical
      yaml.safe_load dumps with `amendment_log` excluded. (f) RENAME-AWARE base resolution: resolve
      a changed file's base content through the `-M` rename map, so rename-plus-mutate cannot skip
      the amendment check by leaving no content at the new path. (g) PIN DIRECTION: a decrease in
      ratchet.grandfathered_max is free; any INCREASE fails regardless of amendment log -- the pin
      lives in the file the gate reads, so without this the ratchet is self-amending in the same PR
      that violates it. (h) CENSUS every run --
      scanned / ritual / declared / grandfathered / evaluator_none_grandfathered / status_active /
      skipped -- with a floor assertion, so an enforced pass is distinguishable from a vacuous one.
      (i) FAIL-CLOSED HARDENING: a missing docs/contracts/ directory becomes a FAILURE (today it
      returns early and passes, which would silently evaporate every check here at once); an
      unreadable or unparseable pin fails; UnicodeDecodeError joins the except tuple (it subclasses
      ValueError, not OSError, so today it escapes and crashes the run); and when origin/main is
      unreachable the baseline-dependent legs advisory-SKIP ONLY IF no docs/contracts file is in the
      diff -- otherwise they FAIL, so the skip cannot be induced from inside the PR (verified
      reachable: ci.yml's pr-validate uses fetch-depth 0 but the terraform job uses 2).
  - file: docs/contracts/contract-population.yaml
    action: Create
    purpose: >-
      The mechanism's own semantics and the first Class D contract -- self-hosting, so the file
      defining the obligation must satisfy it. Carries the declared-shape key grammar, the
      evaluator-kind union and its verification rules, the three new-file prohibitions, the subject
      namespace rule, the change-detection rule, the census field list, and
      `ratchet.grandfathered_max` (see the count below). Records that the
      evaluator_none_grandfathered and status_active pins are deliberately unset -- their opening
      balance is unknown until the sweep runs. Must stay under the Decision 166 `contracts`
      structural class limits (500 effective lines, 2,000 max line chars,
      config/structural_size_budgets.yaml:92-99).
  - file: docs/contracts/file-router.yaml
    action: Modify
    purpose: >-
      One route row for contract-population.yaml so the obligation is discoverable BEFORE an author
      composes a new contract (Decision 66). The row's description names the admissible shapes. Must
      also record why `subject:` and file-router's existing `topic:` are separate namespaces over
      the same population -- 82 topic values already exist and several are subject-shaped for these
      very files, so introducing a second name without reconciling it is the CFG-05 shape one level
      up. The sweep may fold them; this plan states the boundary.
  - file: scripts/test_coverage_checker.py
    action: Modify
    purpose: >-
      Register scripts/checks/contracts/validate_contract_drift.py in
      _CONCERN_SPLIT_TEST_PACKAGES (line 212) so its tests resolve to a package rather than a single
      file. Required because the existing test module is 457 effective SLOC against the 500 hard
      limit and is UNREGISTERED in config/sloc_budgets.yaml -- the new fixtures cannot fit, and
      Decision 128 makes decomposition the default response, never a budget raise.
  - file: tests/checks/contracts/test_validate_contract_drift.py
    action: Delete
    purpose: >-
      Decomposed into the concern-split package below (Decision 131 mirror convention; tests/
      decisions_md/ and tests/ops_writer/ are the live precedents). Content moves, nothing is lost.
  - file: tests/checks/contracts/validate_contract_drift/
    action: Create
    purpose: >-
      Concern-split test package with __init__.py (prepend import mode) carrying the existing eight
      CD.25 category classes plus the new fixture modules. The exact directory name MUST be taken
      from map_source_to_test's resolved value after the registration above, not assumed --
      Verification Plan step 11 asserts it rather than trusting this path.
  - file: tests/test_coverage_checker/
    action: Modify
    purpose: >-
      Add the mapping test that asserts scripts/checks/contracts/validate_contract_drift.py resolves
      to an existing test DIRECTORY after the _CONCERN_SPLIT_TEST_PACKAGES registration, and that
      the pre-decomposition single-file module no longer exists. A real test rather than an inline
      one-liner, so the obligation's evidence is executable by its linked step.
  - file: tests/test_contracts.py
    action: Modify
    purpose: >-
      Unit coverage for load_contract_meta (a Class D envelope validates with arbitrary body keys
      present; a D file missing subject or evaluator raises; a doc born at `status: active` or at
      `evaluator.none_grandfathered` raises for every class) and for the new transition edges.
  - file: tests/test_contracts_schema.py
    action: Modify
    purpose: >-
      Coverage for the ContractClass and ContractStatus widenings and the ContractMeta validator's
      new rules. Named as a test_selector below, so it must appear in scope.
  - file: config/agent/verification_registry/registry.yaml
    action: Modify
    purpose: >-
      Registry rows for the graduated checks below. Currently ~4,712 lines against Decision 166
      point 6's calibrated 6,000 ceiling -- adequate headroom, but named in scope because the
      implementing session writes to it.
  - file: docs/decisions-index.json
    action: Modify
    purpose: >-
      Regenerated via `bin/venv-python -m scripts.decisions_index --write` after the new entry
      lands. validate_decisions_index_freshness is registered UNGATED in --pre
      (scripts/checks/registry.py:116) and fails on drift, so omitting this would fail the plan's
      own presubmit step.
  - file: docs/DECISIONS.md
    action: Modify
    purpose: >-
      EXACTLY ONE new numbered entry (Decision 168 at authoring time -- re-check the max header at
      implement time; numbers are not reserved at draft time), PLUS the two guard-mandated
      supersession annotations required by its own envelope. Declaring `amends: [118, 167]` makes
      validate_supersession_annotations harvest those edges (it reads envelope-borne amends at
      lines 86-90 precisely so a typed envelope cannot escape it), and _is_annotated then requires
      the literal string "Decision 168" inside Decision 118's and Decision 167's blocks. Those two
      annotations are the bookkeeping for the one new entry, not additional Decisions. The entry
      records the RULING only; every key shape lives in contract-population.yaml and is cited, never
      restated (Decision 150 field_semantics row; Decision 167 clause 2). It must also state the two
      honesty clauses agreed at planning: that this is NOT step-3 completion and the sweep is the
      completing act, and that subject-uniqueness PREVENTS future duplicate-territory claims while
      DETECTING none of CFG-05's existing named instances.
  - file: audits/contract-first-governance-33c8667.yaml
    action: Modify
    purpose: >-
      Append ONE dated amendment LINE to the meta.contract_notes BLOCK SCALAR (it is a `|-` scalar,
      not a mapping -- adding a YAML key there would be a parse error), mirroring the existing
      `amendment_2026-08-07:` text-line precedent at line 27. Records the ratchet's WHY and POINTS
      AT contract-population.yaml for the HOW; restating the spec here would re-commit the routing
      defect this audit diagnoses. States that findings, severities and Q1-Q9 verdicts are
      unchanged. audits/*.yaml is `governed: false` in the workflow_outputs structural class, so no
      size gate applies.
bundled_recommendations: []
infrastructure_dependencies: []
acceptance_criteria:
  - A NEW docs/contracts/*.yaml file carrying neither a ritual `contract:` block with `class:` nor a
    valid Class D declared shape FAILS the gate, naming the file and the missing shape; the same
    file present at the origin/main baseline passes and is counted as grandfathered.
  - "The three new-file prohibitions are symmetric and all enforced: a NEW file declaring the
    grandfather-only `active` status FAILS (for EVERY class, not just D); a NEW file declaring
    `evaluator.none_grandfathered` FAILS; and neither is reachable by landing a conforming file
    first and mutating it in a second PR, because Class D status transitions are checked in Pass 2."
  - A Class D file carrying a top-level `fields:` or `verbs:` mapping FAILS, closing the seam by
    which a genuine Class A table schema could be authored as Class D to escape the Class A rules.
  - Two files declaring the same subject FAIL, over a namespace that is the union of declared
    subjects and ritual contract ids, deduped per file so a ritual contract declaring its own id
    does not collide with itself.
  - A Class D file whose parsed content changed vs the merge-base with no new amendment_log[] entry
    FAILS Pass 2; a comment-only or formatting-only edit to the same file passes; and a file that
    was RENAMED and mutated in the same diff still has its base resolved through the rename map, so
    the amendment check cannot be skipped by renaming.
  - Raising `ratchet.grandfathered_max` FAILS regardless of any accompanying amendment_log entry;
    lowering it passes. The pin cannot be relaxed by the same PR that would breach it.
  - The gate prints a census (scanned / ritual / declared / grandfathered /
    evaluator_none_grandfathered / status_active / skipped) on every run, with a floor assertion, so
    a vacuous pass is distinguishable from an enforced one.
  - The grandfathered count exceeding the pin FAILS; the pin is read from contract-population.yaml
    at check time, never hardcoded, and an unreadable or unparseable pin FAILS rather than passing.
  - "The pin's value equals the GATE-VISIBLE non-ritual population, which is 21 -- verified by
    direct enumeration: 37 *.yaml files = 16 ritual + 21 non-ritual, plus 2 *.md the gate's glob
    structurally cannot see. The audit's figure of 23 counts those two .md members (CFG-05's own
    text says so), and this plan declares them out of scope, so 23 would ship the balance sheet
    slack by exactly two on day one."
  - The existing live population passes unchanged, and scripts/preflight/context_docs.py's
    provisional scan is unaffected. Population counts asserted in tests are DERIVED from the scan,
    never hardcoded literals (tests/CLAUDE.md test-count-coupling rule).
  - A missing docs/contracts/ directory FAILS rather than passing; a non-UTF-8 contract file fails
    as a category-1 defect rather than crashing the run.
  - With origin/main unreachable, the baseline-dependent legs advisory-SKIP only when NO
    docs/contracts file is in the diff, and FAIL otherwise; subject-uniqueness and Class D
    structural validation still run in both cases.
  - docs/contracts/contract-population.yaml passes the gate it defines, as a Class D contract with a
    declared subject and a registry-resolvable evaluator.
verification_plan:
  - step: 1
    phase: pre-deploy
    action: >-
      RED FIXTURE -- synthesise the absence-shaped defect through the contracts_dir seam: a NEW
      contract file carrying neither admissible shape must fail. Asserts the SPECIFIC error string,
      not merely that `failed` is non-empty.
    command: "bin/venv-python -m pytest tests/checks/contracts/validate_contract_drift -q -k DeclaredShapeObligation"
    expected: "Pass. The failure message names the file and the missing shape; the baseline-present twin passes."
    fix_if: "The gate returns no failure for a new keyless file -- the skip-branch narrowing did not take effect."
    hermetic: true
    graduation: graduate
    graduation_check_id: "contracts-new-file-declared-shape-required"
  - step: 2
    phase: pre-deploy
    action: >-
      The three symmetric new-file prohibitions. Each asserts its OWN error string -- without that,
      the `active` fixture is TAUTOLOGICAL, since `active` is absent from ContractStatus today and
      so already fails the unmodified gate via load_contract for an unrelated reason.
    command: "bin/venv-python -m pytest tests/checks/contracts/validate_contract_drift -q -k NewFileProhibitions"
    expected: "New-file active, new-file none_grandfathered, and a Class D carrying top-level fields/verbs each fail with their own message; baseline-present twins pass."
    fix_if: "Any fixture passes for the wrong reason, or a new file mints itself into the unverified band."
    hermetic: true
    graduation: graduate
    graduation_check_id: "contracts-new-file-prohibitions"
  - step: 3
    phase: pre-deploy
    action: "Class D status transitions run in Pass 2 -- the land-as-draft-then-flip path is closed."
    command: "bin/venv-python -m pytest tests/checks/contracts/validate_contract_drift -q -k StatusTransition"
    expected: "A Class D file flipped draft->active across the merge-base FAILS; active->ratified passes."
    fix_if: "Transitions are unenforced for D -- check_status_transition is still being handed a ContractDocument a D body cannot become."
    hermetic: true
    graduation: graduate
    graduation_check_id: "contracts-class-d-status-transition"
  - step: 4
    phase: pre-deploy
    action: "Subject-uniqueness over the union namespace, including the per-file self-collision case."
    command: "bin/venv-python -m pytest tests/checks/contracts/validate_contract_drift -q -k SubjectUniqueness"
    expected: "Two files sharing a subject fail; a declared subject colliding with a ritual contract id fails; a ritual contract declaring its OWN id as subject passes."
    fix_if: "Collisions pass, the namespace was split, or self-collision produces a false positive."
    hermetic: true
    graduation: graduate
    graduation_check_id: "contracts-subject-uniqueness"
  - step: 5
    phase: pre-deploy
    action: "Pass 2 amendment-log-on-change for Class D, including the rename-plus-mutate case and the comment-only negative."
    command: "bin/venv-python -m pytest tests/checks/contracts/validate_contract_drift -q -k AmendmentLog"
    expected: "Content change without a new entry fails with the amendment-specific message; comment-only passes; a renamed-and-mutated file resolves its base through the -M map and still fails."
    fix_if: "Rename skips the check, or a whitespace edit is rejected as an amendment."
    hermetic: true
    graduation: graduate
    graduation_check_id: "contracts-declared-amendment-log-on-change"
  - step: 6
    phase: pre-deploy
    action: "The ratchet -- pin direction, pin sourcing, and the rename-becomes-new case."
    command: "bin/venv-python -m pytest tests/checks/contracts/validate_contract_drift -q -k Ratchet"
    expected: "Raising grandfathered_max fails even with an amendment entry; lowering passes; an unreadable pin fails; a renamed grandfathered file must conform; the pin is read from the INJECTED contracts_dir, not the real tree."
    fix_if: "The pin is self-amending, is read from the real tree so tmp_path fixtures never trip it, or a rename inherits the exemption."
    hermetic: true
    graduation: graduate
    graduation_check_id: "contracts-grandfather-ratchet"
  - step: 7
    phase: pre-deploy
    action: "Fail-closed hardening -- missing directory, non-UTF-8 file, and the induced-skip case."
    command: "bin/venv-python -m pytest tests/checks/contracts/validate_contract_drift -q -k FailClosed"
    expected: "Missing docs/contracts/ FAILS; a non-UTF-8 file is a cat-1 defect not a traceback; origin/main unreachable WITH contract files in the diff FAILS, without them SKIPs."
    fix_if: "Any of the three passes silently -- each is a path that would disable the whole gate at once."
    hermetic: true
    graduation: graduate
    graduation_check_id: "contracts-fail-closed-hardening"
  - step: 8
    phase: pre-deploy
    action: >-
      REGRESSION and CENSUS -- the real live population still passes, the census reports derived
      counts, and the self-hosting contract passes the gate it defines.
    command: "bin/venv-python -m pytest tests/checks/contracts/validate_contract_drift -q -k 'RealPopulation or Census or SelfHosting'"
    expected: "Zero failures against docs/contracts/; the census line carries every field with scanned derived from the scan, not a literal; contract-population.yaml validates as Class D."
    fix_if: "An existing contract regressed, a count is hardcoded, or the self-hosting file cannot satisfy its own obligation."
    hermetic: true
    graduation: graduate
    graduation_check_id: "contracts-live-population-and-census"
  - step: 9
    phase: pre-deploy
    action: "Schema and loader unit coverage -- Class D envelope, birth prohibitions, transition edges."
    command: "bin/venv-python -m pytest tests/test_contracts.py tests/test_contracts_schema.py -q"
    expected: "load_contract_meta accepts a D envelope with arbitrary body keys; missing subject or evaluator raises; birth at active or at none_grandfathered raises for EVERY class; active->ratified allowed, ratified->active and draft->active forbidden."
    fix_if: "extra=forbid still rejects heterogeneous bodies, or a birth prohibition applies only to Class D."
    hermetic: true
    graduation: graduate
    graduation_check_id: "contracts-class-d-schema-and-transitions"
  - step: 10
    phase: pre-deploy
    action: "The decision entry and its two guard-mandated annotations satisfy the decisions guards."
    command: "bin/venv-python -m pytest tests/checks/decisions -q"
    expected: "Conformance, supersession-annotation, index-freshness and size checks all pass with the new entry, both annotations, and the regenerated index present."
    fix_if: "The envelope is malformed, an amends victim lacks its annotation, or docs/decisions-index.json was not regenerated."
    hermetic: true
    graduation: waive
    graduation_waiver_reason: >-
      Kernel-expressible as a test_selector, but graduating it would pin a standing registry check to
      THIS entry's transient content (entry 168, its two victims, and an index snapshot that
      regenerates on every future entry), producing a guard that reddens on unrelated future
      decisions. The durable guards for this surface are already registered and run in both tiers.
  - step: 11
    phase: pre-deploy
    action: >-
      Assert the concern-split registration actually resolved -- do not trust this plan's guess at
      the package path.
    command: "bin/venv-python -m pytest tests/test_coverage_checker -q -k contract_drift"
    expected: "The mapping test asserts map_source_to_test resolves the gate to an existing DIRECTORY containing the split modules, and that the old single-file module is gone."
    fix_if: "It still resolves to a .py path -- the _CONCERN_SPLIT_TEST_PACKAGES registration did not take, or the package was created at the wrong name."
    hermetic: true
    graduation: not-applicable
  - step: 12
    phase: pre-deploy
    action: "SLOC -- confirm the decomposition actually cleared the limit rather than moving the problem."
    command: "bin/venv-python -m scripts.validate --check sloc_limits"
    expected: "Pass. No test module in the new package approaches 500 effective SLOC, and no budget raise was registered."
    fix_if: "A split module is still oversized, or a raise was seeded instead of decomposing (Decision 128 forbids it)."
    hermetic: false
    graduation: not-applicable
  - step: 13
    phase: pre-deploy
    action: "Fast-tier presubmit."
    command: "bin/venv-python -m scripts.validate --pre"
    expected: "Exit 0, with the contract drift census line present and the fast-tier budget (300s) still met."
    fix_if: "Any check regresses, or the added git reads push the fast tier over its Decision 153 budget."
    hermetic: false
    graduation: waive
    graduation_waiver_reason: >-
      Kernel-expressible as command_exit_zero, but graduating the presubmit gate into the registry
      that the presubmit gate itself reads is circular, and the step is already the authoritative
      pre-merge gate by construction. Recorded as a waiver rather than not-applicable because the
      kernel COULD express it -- the reason it must not be graduated is circularity, not inexpressibility.
  - step: 14
    phase: pre-deploy
    action: >-
      FULL-TIER presubmit -- required by this plan's own handoff_policy, and its absence was a
      reproduced gate failure on the first draft of this plan.
    command: "bin/venv-python -m scripts.validate"
    expected: "Exit 0 across the full sequence, including the tree-scoped checks the fast tier skips."
    fix_if: "A full-tier-only check fails -- most likely supersession annotations or index freshness, which the fast tier scopes differently."
    hermetic: false
    graduation: not-applicable
test_obligations:
  - source: scripts/checks/contracts/validate_contract_drift.py
    behavior: >-
      A NEW contract file must carry one of two admissible shapes and may not declare the
      grandfather-only status or evaluator form; Class D bodies carry no fields/verbs; subjects are
      unique across the union namespace; Class D content changes require an amendment entry and
      transitions are checked; the pin is downward-only; the gate fails closed.
    verification_step: 1
    test_selector: tests/checks/contracts/validate_contract_drift
    red_green_expectation: >-
      Red before, green after -- and each fixture asserts its OWN error string, so no fixture can be
      satisfied by an incidental pre-existing failure. Reverting the skip-branch narrowing makes the
      synthetic keyless file pass, so the fixture fails. This is the scripts/verification_checks.py
      is_admitted standard applied deliberately -- a check that passes both before and after the
      change is tautological and must be replaced, never waived.
  - source: scripts/contracts_schema.py
    behavior: >-
      ContractClass admits D; ContractStatus admits active; ContractMeta requires subject and
      evaluator for D and rejects birth at active or at none_grandfathered for every class;
      _validate_class_shape raises rather than silently treating D as C.
    verification_step: 9
    test_selector: tests/test_contracts_schema.py
