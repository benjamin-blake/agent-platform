constraints:
  - "EXACTLY ONE new numbered Decision entry. The only other docs/DECISIONS.md edits permitted are
    the two guard-mandated supersession annotations on Decisions 118 and 167, which
    validate_supersession_annotations requires as bookkeeping for that single entry's declared
    amends edges. Dropping `amends` to avoid them is NOT permitted -- it would hide real
    relationships in the very plan whose subject is honest governance metadata."
  - The Decision entry records the RULING only. Every key shape, enum value, prohibition, census
    field and pin lives in docs/contracts/contract-population.yaml and is cited, never restated.
  - "FORWARD-ONLY. The 21 gate-visible free-form files are NOT seeded here -- that is the follow-on
    population sweep. No existing contract file's content changes except file-router.yaml (one route
    row)."
  - "The three new-file prohibitions must stay SYMMETRIC. `status: active` and
    `evaluator: {none_grandfathered: ...}` are both grandfathering-only forms, unmintable by a new
    author. The key is named `none_grandfathered` rather than `none` deliberately: the key itself
    states WHY there is no evaluator, so a future agent reading a seeded file cannot mistake it for
    a generally-available choice, and there is no bare `none` form to reach for."
  - This plan does NOT flip Decision 167 clause 3's WARN-tier per-entry cap to hard-fail, and does
    NOT constitute migration-step-3 completion. The Decision entry states this explicitly so the
    judgement is recorded rather than left to whichever future session next touches
    validate_decisions_size.
  - "CFG-11 (the two .md contracts' invisibility to the *.yaml glob and the size engine) is OUT OF
    SCOPE, and so is a Class D status-transition leg for the grandfathered population. Both are
    named as inherited by the sweep, whose completion test requires skipped=0 across all 39 files
    including both .md members."
  - "Do not relax extra=forbid on the shared ContractDocument, and do not nest Class D bodies under
    a `spec:` key -- the verified reason is validate_placement's top-level routes: read
    (validate_placement.py:19,38). Do NOT repeat the marker-grammar claim from this plan's first
    draft; it was false."
  - Counts asserted in tests must be DERIVED from the scan, never hardcoded literals -- the
    population grows, the literal does not (tests/CLAUDE.md test-count-coupling rule, enforced in
    both tiers).
  - Decompose, never raise. The test module crosses its SLOC limit and is handled by a concern-split
    package; a `# raise-approved:` registration is not an acceptable substitute (Decision 128).
  - No rescue agents or workaround loops (Decision 55). An unrecoverable verification failure stops
    and routes to RCA rather than being patched inline.
  - Tests are synthetic-fixture only, via the existing contracts_dir=tmp_path seam, plus the real
    live-population regression. No network, no credentials.
