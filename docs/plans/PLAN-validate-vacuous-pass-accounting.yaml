rollback: >-
  The channel, the baseline and schema v3 unwind together, not separately -- a consumer keyed to the
  v3 shape would break on a partial revert. Reverting the commit restores schema_version 2 evidence
  and the single-channel check contract with no data migration, since validation-result.json is
  regenerated every full run and is never read as history. The one piece with independent blast
  radius is the graduation-guard base fix: if it blocks a legitimate PR, revert THAT hunk alone
  (the guard returns to its inert `git diff HEAD` behaviour, which is the status quo ante) and file
  the finding rather than weakening the guard's verdict logic.
