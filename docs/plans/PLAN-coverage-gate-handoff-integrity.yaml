schema_version: 3
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: "coverage-gate-handoff-integrity"
intent: >-
  Turn main genuinely green by paying the coverage debt rec-2965 surfaced, and close the structural
  gap that let it land: every schema_version-3 IMPLEMENTATION plan is required to declare
  full_validation_required_before_commit, yet nothing checked that the plan's executable steps
  actually run the full tier. Records the governance principle the session converged on and opens
  three tier_items for the direction-setting work.
plan_type: IMPLEMENTATION
verification_tier: V2
plan_path: docs/plans/PLAN-coverage-gate-handoff-integrity.yaml
phase: >-
  Platform hygiene / CI-RCA remediation. Resolves ci-rca rec-2965 (Critical, open). Opens three new
  tier_items under the governance-integrity theme; no product-roadmap phase dependency.

scope:
  - file: tests/checks/roadmap/test_validate_candidate_decision_ratification.py
    action: Modify
    purpose: >-
      Add four tests covering the four uncovered defensive arms of the ratification guard
      (_dec_number falsy-pointer return, _load_roadmap except-Exception arm, roadmap-not-found
      guard, doc-is-None early return), taking the checker from 92.1% to 100% and clearing the
      post-merge failure. Prototyped this session: 114 statements, 0 missed, 30 tests pass.
  - file: scripts/checks/verification/validate_handoff_policy_consistency.py
    action: Create
    purpose: >-
      New registered check. A diff-added or diff-modified docs/plans/PLAN-*.yaml that declares
      handoff_policy.full_validation_required_before_commit must carry at least one
      verification_plan step invoking the full tier. Placed in scripts/checks/verification/ beside
      the other plan-PR obligation gates, with changed_files / root / load_plan injection seams and
      an advisory SKIP on unreachable origin/main, mirroring validate_graduation_completeness.
  - file: tests/checks/verification/test_validate_handoff_policy_consistency.py
    action: Create
    purpose: >-
      Mirror test file. Carries the tier-membership assertion that fails without the registry
      change, the four behavioural branches, and the matcher-discrimination proofs. Covers the new
      source file to 100%.
  - file: scripts/checks/registry.py
    action: Modify
    purpose: >-
      Register the new check in pre_sequence (pre_globs=("docs/plans/**",), so it costs nothing on
      PRs that touch no plan) and in full_sequence. Currently 100% covered; sequence entries stay
      covered by existing tests.
  - file: scripts/validate.py
    action: Modify
    purpose: >-
      Add the facade re-export line the registry contract requires -- dispatch is
      globals()[name](failed) with no auto-discovery, and TestFacadeCompleteness parametrizes over
      the live registry, so the check is unreachable without it.
  - file: AGENTS.md
    action: Modify
    purpose: >-
      Correct the two-tier presubmit table: the full-tier row's "When" column reads "Post-merge on
      main", which drops the pre-handoff obligation the implement skill mandates and licenses the
      cheaper reading that the full tier is CI's job. Add the pre-handoff obligation and the
      CC-web-vs-executor cost rationale.
  - file: docs/DECISIONS.md
    action: Modify
    purpose: >-
      Append Decision 163 recording the autonomy/enforcement-shape principle, the declared-vs-
      executed failure mode, and the pre-handoff full-tier obligation. Append-only; no existing
      entry body is edited (forward-direction amend-only convention, Decision 126/143).
  - file: docs/decisions-index.json
    action: Modify
    purpose: Regenerate the derived index so validate_decisions_index_freshness passes.
  - file: docs/ROADMAP-PLATFORM.yaml
    action: Modify
    purpose: >-
      Add three tier_items for the direction-setting work (clause-to-check traceability, exception-
      grammar removal with a shrink-only baseline, and the normative/contract/ADR layering). Forward
      intent routes to tier_items per Decision 86; no implementation in this plan.

bundled_recommendations:
  - rec-2965

infrastructure_dependencies: []

acceptance_criteria:
  - scripts/checks/roadmap/validate_candidate_decision_ratification.py measures 100% line coverage
    against the CI-scoped file set, with no config/coverage_baseline.yaml entry added.
  - The four previously-uncovered arms are each exercised by a named test that fails if the arm is
    removed -- not merely reached incidentally.
  - validate_handoff_policy_consistency fails a diff-added plan that carries no full-tier
    verification_plan step, and passes the same plan once such a step is added.
  - >-
    The matcher classifies docs/plans/PLAN-esb-fallback-spec-carrier.yaml (PR #836, the motivating
    case) as NON-COMPLIANT, classifies this plan as compliant, accepts a single command chaining
    '--pre && <full>', and does not match a bare 'import scripts.validate' inside a python -c body.
  - The check is diff-scoped -- the 9 historical plans lacking a full-tier step do not fail, and a
    run over all committed plans stays green.
  - The check is registered in BOTH the pre and full tiers and is reachable via the
    scripts/validate.py facade.
  - scripts/checks/verification/validate_handoff_policy_consistency.py measures 100% line coverage.
  - AGENTS.md's two-tier table states the pre-handoff full-tier obligation explicitly.
  - Decision 163 exists as a live '## Decision 163:' header carrying a Significance line and
    reversal conditions, and docs/decisions-index.json is fresh against it.
  - The three named tier_items exist and the platform roadmap validates.
  - bin/venv-python -m scripts.validate exits 0 (full tier) before commit.
  - rec-2965 is closed via the Resolves trailer after merge.

verification_plan:
  - step: 1
    phase: pre-deploy
    action: >-
      Measure the ratification guard against the exact file set CI scopes on a push that changes it,
      reproducing the failing configuration rather than a local vacuous pass.
    command: >-
      bin/venv-python -c "import importlib.util,sys;from pathlib import
      Path;R=Path('.').resolve();s=importlib.util.spec_from_file_location('t',R/'scripts'/'test_coverage_checker.py');m=importlib.util.module_from_spec(s);sys.path.insert(0,str(R));s.loader.exec_module(m);e=m.check_per_file_coverage([R/'scripts/checks/roadmap/validate_candidate_decision_ratification.py']);print('ERRORS:',e);sys.exit(1
      if e else 0)"
    expected: "ERRORS: [] and exit 0. Before the change this prints the 92.1% error string."
    fix_if: >-
      Any non-empty error list means an arm is still unreached. Re-run step 2 to identify which line
      numbers remain, and add the missing test rather than registering a baseline entry.
    graduation: graduate
    graduation_check_id: ratification-guard-coverage-100
  - step: 2
    phase: pre-deploy
    action: >-
      Confirm zero missed statements and attribute any residue to specific line numbers. Uses the
      PARENT-DIRECTORY --cov spec; a single-file or dotted-module spec silently collects no data
      (Decision 159 cl.2 / rec-943) and would report 0.00%.
    command: >-
      _COVERAGE_SUBPROCESS=1 bin/venv-python -m pytest
      tests/checks/roadmap/test_validate_candidate_decision_ratification.py
      --cov=scripts/checks/roadmap --cov-report=term-missing -q
    expected: >-
      The row for validate_candidate_decision_ratification.py reads 114 statements, 0 miss, 100%
      with an empty Missing column. Lines 131, 216-219, 232-234 and 238 no longer appear.
    fix_if: >-
      A non-empty Missing column names the unreached arm directly. If total statements have drifted
      from 114 the source changed -- re-derive rather than assuming the prototype still holds. If
      the report shows 0.00%, the --cov spec was narrowed back to a single file.
    graduation: waive
    graduation_waiver_reason: >-
      Duplicates step 1's assertion through a second measurement path, and its --cov spec is
      directory-scoped so the row it prints covers sibling modules whose coverage this plan does not
      own -- a graduated row keyed on it would fail for reasons unrelated to this change. Step 1 is
      the graduated regression guard; this step exists for line-level attribution during
      implementation.
  - step: 3
    phase: pre-deploy
    action: >-
      Prove the check FAILS a diff-added plan carrying no full-tier step (the direction that catches
      the PR #836 defect) and PASSES the same plan once one is added.
    command: >-
      bin/venv-python -m pytest
      "tests/checks/verification/test_validate_handoff_policy_consistency.py::TestHandoffPolicyConsistency::test_plan_without_full_tier_step_fails"
      "tests/checks/verification/test_validate_handoff_policy_consistency.py::TestHandoffPolicyConsistency::test_plan_with_full_tier_step_passes"
      -q
    expected: Both tests pass. Before the change pytest exits 4 (file not found).
    fix_if: >-
      If the negative test passes trivially, confirm the fixture genuinely omits a full-tier step
      and that a --pre-only command is not being matched as full-tier.
    graduation: graduate
    graduation_check_id: handoff-policy-fails-noncompliant-passes-compliant
  - step: 4
    phase: pre-deploy
    action: >-
      Prove the check is a no-op outside its trigger conditions -- a plan outside the diff is
      untouched, and origin/main being unreachable yields an advisory SKIP rather than a hard fail.
    command: >-
      bin/venv-python -m pytest
      "tests/checks/verification/test_validate_handoff_policy_consistency.py::TestHandoffPolicyConsistency::test_plan_outside_diff_is_untouched"
      "tests/checks/verification/test_validate_handoff_policy_consistency.py::TestHandoffPolicyConsistency::test_unreachable_origin_main_skips"
      -q
    expected: Both tests pass.
    fix_if: >-
      A failure means the check is scanning all plans instead of the diff, or hard-failing on a
      detached clone. Restrict to _common.plan_paths_from_changed and mirror
      validate_graduation_completeness's advisory SKIP.
    graduation: graduate
    graduation_check_id: handoff-policy-noop-outside-trigger
  - step: 5
    phase: pre-deploy
    action: >-
      Pin the full-tier matcher against all four discrimination cases. The matcher splits a command
      on shell separators (&&, ||, ;, newline) and treats a segment as a full-tier invocation iff it
      matches the module entry point '-m scripts.validate' (not followed by a word character or dot)
      AND does not contain '--pre'. Measured this session against all committed plans.
    command: >-
      bin/venv-python -m pytest
      "tests/checks/verification/test_validate_handoff_policy_consistency.py::TestFullTierMatcher"
      -q
    expected: >-
      All matcher tests pass, asserting: PLAN-esb-fallback-spec-carrier.yaml is NON-COMPLIANT (its
      only shell invocation is --pre; its 'import scripts.validate as v' inside a python -c must NOT
      count); this plan is compliant; 'validate --pre && validate' is accepted; a bare python-import
      does not match.
    fix_if: >-
      If PLAN-esb-fallback-spec-carrier.yaml is classified compliant, the matcher is matching the
      Python import -- require the '-m' entry-point form. If a chained command is falsely failed,
      the matcher is testing the whole command string instead of per-segment.
    graduation: graduate
    graduation_check_id: handoff-policy-matcher-discriminates-836
  - step: 6
    phase: pre-deploy
    action: >-
      Confirm the check is diff-scoped in practice: a run over all committed plans stays green
      despite 9 of them lacking a full-tier step.
    command: >-
      bin/venv-python -c "import sys;sys.path.insert(0,'.');from
      scripts.checks.verification.validate_handoff_policy_consistency import
      validate_handoff_policy_consistency as v;f=[];v(f);print('FAILED:',f);sys.exit(1 if f else 0)"
    expected: "FAILED: [] and exit 0. Before the change this exits non-zero with ImportError."
    fix_if: >-
      Any failure naming a historical plan means the check is scanning all plans instead of the
      diff. The 9 non-compliant historical plans are grandfathered stock; only the flow is gated.
    graduation: graduate
    graduation_check_id: handoff-policy-check-diff-scoped
  - step: 7
    phase: pre-deploy
    action: >-
      Confirm the check is registered in BOTH tiers and reachable through the validate.py facade --
      the registry contract that makes it actually run.
    command: >-
      bin/venv-python -c "import sys;sys.path.insert(0,'.');from scripts.checks import
      registry;import scripts.validate as
      v;n='validate_handoff_policy_consistency';pre={s.name for s in registry.pre_sequence() if
      s.kind=='check'};full={s.name for s in registry.full_sequence() if
      s.kind=='check'};print('pre:',n in pre,'full:',n in full,'facade:',hasattr(v,n));sys.exit(0 if
      (n in pre and n in full and hasattr(v,n)) else 1)"
    expected: "pre: True full: True facade: True, exit 0. Before the change all three are False."
    fix_if: >-
      A False facade means the scripts/validate.py re-export line is missing -- validate --pre will
      KeyError on the check name and TestFacadeCompleteness will fail.
    graduation: graduate
    graduation_check_id: handoff-policy-registered-both-tiers
  - step: 8
    phase: pre-deploy
    action: Confirm the new check file has its mirror test and measures 100% line coverage.
    command: >-
      bin/venv-python -c "import importlib.util,sys;from pathlib import
      Path;R=Path('.').resolve();s=importlib.util.spec_from_file_location('t',R/'scripts'/'test_coverage_checker.py');m=importlib.util.module_from_spec(s);sys.path.insert(0,str(R));s.loader.exec_module(m);p=R/'scripts/checks/verification/validate_handoff_policy_consistency.py';ok,msg=m.check_test_file_exists(p);e=m.check_per_file_coverage([p]);print('test_file_ok:',ok,'|
      ERRORS:',e);sys.exit(0 if ok and not e else 1)"
    expected: "test_file_ok: True | ERRORS: [] and exit 0."
    fix_if: >-
      test_file_ok False means the mirror path is wrong -- resolve it with map_source_to_test rather
      than guessing. A non-empty error list means the new check has unreached branches; cover them
      rather than registering a baseline entry.
    graduation: graduate
    graduation_check_id: handoff-policy-check-coverage-100
  - step: 9
    phase: pre-deploy
    action: Confirm AGENTS.md's two-tier table no longer presents the full tier as post-merge-only.
    command: >-
      bin/venv-python -c "import sys,re;from pathlib import
      Path;t=Path('AGENTS.md').read_text(encoding='utf-8');rows=[l for l in t.splitlines() if
      l.startswith('| Full ')];print(rows);sys.exit(0 if rows and
      re.search(r'pre-handoff|before handoff',rows[0],re.I) else 1)"
    expected: The full-tier row prints and names the pre-handoff obligation; exit 0.
    fix_if: >-
      Exit 1 means the row was not updated or its leading cell text changed. Exactly one line starts
      with '| Full ' today.
    graduation: graduate
    graduation_check_id: agents-md-full-tier-pre-handoff-stated
  - step: 10
    phase: pre-deploy
    action: >-
      Confirm Decision 163 landed with the required conformance markers and that the derived index
      is fresh.
    command: >-
      bin/venv-python -c "import sys,re;from pathlib import
      Path;t=Path('docs/DECISIONS.md').read_text(encoding='utf-8');m=re.search(r'^##
      Decision 163:.*?(?=^## Decision |\\Z)',t,re.M|re.S);print('found:',bool(m));print('significance:',bool(m)
      and 'Significance:' in m.group(0));print('reversal:',bool(m) and 'Reversal' in
      m.group(0));sys.exit(0 if m and 'Significance:' in m.group(0) and 'Reversal' in m.group(0) else
      1)" && bin/venv-python -m scripts.decisions_index --check
    expected: All three flags True, exit 0, and the index --check reports no drift.
    fix_if: >-
      A missing Significance or Reversal section fails validate_decision_entry_conformance /
      validate_reversal_stanzas. Index drift is fixed with `--write`. If 163 was claimed by a
      concurrent merge, shift to the next free number consistently across the header, the Warehouse
      ID line, and any roadmap references.
    graduation: graduate
    graduation_check_id: dec-163-conformance-and-index-fresh
  - step: 11
    phase: pre-deploy
    action: >-
      Confirm the three NAMED tier_items exist and the roadmap still validates -- asserting the new
      content, not merely that the file is well-formed.
    command: >-
      bin/venv-python -c "import sys,yaml;sys.path.insert(0,'.');from pathlib import
      Path;d=yaml.safe_load(Path('docs/ROADMAP-PLATFORM.yaml').read_text(encoding='utf-8'));ids={i['id']
      for i in (d.get('tier_items') or [])};want={'T2.54','T2.55','T2.56'};print('missing:',sorted(want-ids));from
      scripts.checks.roadmap.validate_platform_roadmap import validate_platform_roadmap as
      v;f=[];v(f);print('FAILED:',f);sys.exit(0 if not (want-ids) and not f else 1)"
    expected: "missing: [] and FAILED: [] and exit 0. Before the change the three ids are missing."
    fix_if: >-
      If the ids differ from T2.54-T2.56 because those were taken, update this command to the ids
      actually allocated. Referential failures name the offending reference -- correct it; do not
      delete the criterion to pass.
    graduation: graduate
    graduation_check_id: governance-tier-items-present-and-roadmap-valid
  - step: 12
    phase: pre-deploy
    action: >-
      Run the full tier to completion before any commit -- the obligation this plan makes
      enforceable, applied to itself.
    command: bin/venv-python -m scripts.validate
    expected: >-
      Exit 0 with a final 'Validation Summary (scope: all)' PASS. This command is itself the
      full-tier invocation the new check requires of this plan, so the plan is self-compliant.
    fix_if: >-
      Any failure blocks commit per handoff_policy.timeout_disposition. Fix and rerun the full tier
      from the start; child output, --pre output, or CI results cannot substitute.
    graduation: waive
    graduation_waiver_reason: >-
      Graduating a full scripts.validate invocation would make validate_vp_replay re-enter
      scripts/validate from inside a validate run -- exactly the recursion the repo's
      _VALIDATE_DEPTH / _COVERAGE_SUBPROCESS / PYTEST_CURRENT_TEST guards exist to prevent. The
      obligation is instead enforced structurally by the graduated checks in steps 3-7.
  - step: 13
    phase: post-deploy
    action: >-
      After merge, confirm rec-2965 closed via the Resolves trailer rather than assuming the
      autoclose workflow ran. Uses the portal --sync surface, never scripts.sync.ops directly
      (AGENTS.md Single Portal Invariant).
    command: >-
      bin/venv-python -m scripts.ops_data_portal --sync && bin/venv-python -c "import
      json,sys;rows=[json.loads(l) for l in open('logs/.recommendations-log.jsonl') if
      l.strip()];r=next((x for x in rows if x.get('id')=='rec-2965'),None);print(r and
      r.get('status'));sys.exit(0 if r and r.get('status')=='closed' else 1)"
    expected: Prints 'closed' and exits 0.
    fix_if: >-
      If still open, the rec-autoclose workflow did not fire -- close manually with
      `bin/venv-python -m scripts.ops_data_portal --update-rec rec-2965 --status closed
      --resolution "..."` per Decision 70.

constraints:
  - Only files listed in Scope may be modified.
  - >-
    Pay the coverage debt; do NOT add a config/coverage_baseline.yaml entry for
    validate_candidate_decision_ratification.py. Decision 159 cl.2 frames that roster as a one-time
    grandfather, explicitly not a precedent for future debt.
  - >-
    Do NOT raise any config/sloc_budgets.yaml entry. No scope file approaches its budget: the new
    check and its mirror test are new files, and tests/test_checks_registry.py is NOT in scope --
    the per-tier membership sets are subset floors (REQUIRED_PRE_CHECKS <= actual), so a new check
    needs no edit there, and TestFacadeCompleteness parametrizes over the live registry
    automatically.
  - >-
    The check must be diff-scoped to added/modified plans. 9 of 306 committed plans lack a full-tier
    step; stock is grandfathered, flow is zero-tolerance.
  - >-
    Use the PARENT-DIRECTORY --cov spec in any coverage command. A single-file or dotted-module spec
    silently collects zero data (Decision 159 cl.2 / rec-943) and reports a false 0.00%.
  - >-
    Never call scripts.sync.ops or ops_writer directly (AGENTS.md Single Portal Invariant). The
    agent surface is file_rec / update_rec / sync via scripts.ops_data_portal.
  - >-
    docs/DECISIONS.md is append-only here. State the amendment in the new entry only; do not edit
    Decision 73's or Decision 159's bodies (forward-direction amend-only convention, Decision
    126/143, reused by 145 pt 2, 153 and 160 pt 3).
  - >-
    Decision numbers are not reserved at draft time. Re-check the max live '## Decision NNN:' header
    at implement time; 163 was free at authoring (max live 162, 115 live headers against Decision
    160's 120 ceiling).
  - No rescue agents or workaround loops (Decision 55). On unrecoverable failure, stop and RCA.
  - >-
    Tier_items in this plan are forward intent only -- declare them, implement nothing. Decision 86
    routes forward intent to tier_items, rationale to Decisions.

context:
  - >-
    "Decision-scout verdict + CITE list (verbatim decision ids): FLAGS_FOUND. CITE: 48, 73, 104, 128,
    130, 131, 132, 134, 135, 150, 151, 153, 159, 160, 161. Decisions triaged: 115 of 115."
  - "gates: decision-scout=FLAGS_FOUND; plan-critique=REVISE round 1, re-dispatched after revision"
  - >-
    Root cause of rec-2965, established by direct measurement this session and correcting the rec's
    own text: the four uncovered arms are NOT new code from PR #836. The pre-836 file measured 87%
    (63 statements, 8 missed at lines 53, 65-67, 77-80 -- the identical four arms). PR #836 extracted
    them into _load_roadmap and raised the ratio to 92.1%. The file's only prior commit is a
    1646-file history graft, so it had never faced a real per-file coverage gate.
  - >-
    The gate is diff-scoped and therefore transient. Feeding wave 4's six-file docs-only list to
    get_changed_source_files returns [], so merging any docs-only commit prints 'No source file
    changes to check.' and main-validate reports green while the gap persists. This plan must
    therefore land BEFORE the paused wave 4, or the red signal self-clears unfixed.
  - >-
    The obligation is UNIVERSAL, not conditional. HandoffPolicy.full_validation_required_before_commit
    is Literal[True] and handoff_policy is REQUIRED on every schema_version-3 IMPLEMENTATION plan
    (plan_document.py:223-224), forbidden otherwise. So "declares the policy" is equivalent to "is a
    v3 IMPLEMENTATION plan" -- no plan can opt out, and with STRATEGIC suspended this gates every
    future implementation plan. The no-op branch is only constructible from a legacy
    schema_version<3 plan or a v3 REPORT-ONLY plan.
  - >-
    Matcher hazard, measured: PLAN-esb-fallback-spec-carrier.yaml (PR #836) contains
    'import scripts.validate as v' inside a python -c body at its step 3, while its only shell
    invocation is '--pre' at step 12. A naive "any scripts.validate not followed by --pre" matcher
    classifies that Python import as a full-tier run and lets the motivating case PASS. The pinned
    matcher requires the '-m scripts.validate' entry-point form and evaluates per shell segment;
    verified to catch #836, accept a chained '--pre && <full>', and reject the bare import. Under the
    pinned matcher 9 of 306 committed plans are non-compliant.
  - >-
    Why rec-2970 is not bundled: its stated acceptance names two specific routes (promote
    validate_test_coverage to the pre tier under a costed policy, or make the vacuous-pass path print
    a no-op warning). This plan takes a third -- making the already-mandated pre-handoff full-tier run
    structurally enforceable. Measured marginal cost of the pre-tier route is 3.4-10.2s per changed
    source file (38.5s for a 3-file set) against a hard 300s fast-tier budget with no waiver under
    Decision 153 cl.2, and Decision 161 declined fast-tier placement for a cheaper ~57s measurement on
    those same grounds three days earlier. Update rec-2970 with this context; do not close it.
  - >-
    Decision 73 [WARN] from the scout was raised against an earlier draft that promoted
    validate_test_coverage into pre_sequence. That promotion is NOT in scope, so the fast-tier budget
    is untouched -- the new check is filesystem-and-git only, gated by pre_globs=("docs/plans/**",).
    Recorded so the flag is not silently dropped.
  - >-
    Decision 128 [SPIRIT WARN] from the scout was raised against an earlier draft that took a third
    marked SLOC raise on tests/test_checks_registry.py. Resolved by removing that file from scope
    entirely. The first draft chose a leg on an existing check specifically to dodge that budget;
    plan-critique correctly identified that a budget constraint was choosing the architecture, and
    that the constraint was illusory (subset floors + registry-parametrized facade tests).
  - >-
    Lambda disposition: docs/ROADMAP-PLATFORM.yaml is a declared assets entry of the active
    data-pipeline artifact, so compute_affected_artifacts flags it. No build/deploy/smoke step is
    required -- the change is inert forward-intent tier_item text, and data-pipeline.zip deploys via
    the governed CD channel (.github/workflows/deploy-prod-lambdas.yml) per Decision 126, with
    build_lambda --deploy marked break-glass-only. Precedent: 75 of 118 plans touching this file sit
    at V1/V2.
  - >-
    Governance finding surfaced en route, deliberately NOT fixed here: the 641->643 raise on
    tests/test_checks_registry.py carries '# raise-approved: dec-161', but Decision 161's body never
    names that file or authorises a SLOC raise on it, and Decision 159 cl.5 granted exactly ONE raise
    for it. validate_sloc_budget_raises is a shape check -- it verifies the marker cites a real
    header, not that the cited Decision authorises that file's raise. An audit of every marker across
    sloc_budgets.yaml, coverage_baseline.yaml and mypy_baseline.yaml found this is currently the only
    unbacked one. File as a rec; resolution is the owner's call.
  - >-
    scripts/checks/misc/validate_test_coverage.py itself measures 72.4% (58 statements, 16 missed at
    lines 11-27 and 41-42) with no baseline entry, so the gate module would fail its own gate the
    moment anyone edits it. Left out of scope as a separate paydown; file as a rec. This is the
    'cliff' instance -- the first toucher pays the whole backlog.
  - >-
    Complexity: 9 scope files exceeds the >5 heuristic that would suggest STRATEGIC, but STRATEGIC is
