---
schema_version: 1
slug: "ducklake-applied-schema-gate"
intent: >-
  Enforce, in the governed DuckLake code-deploy channel, that a serving Lambda never ships code
  requiring an ops-table column the physical table does not have -- the sequencing hole that took
  ops_decisions hard-down for read AND write on 2026-07-24. Enforcement is static and zero-egress: a
  merge-time declaration gate plus a deploy-time refusal that splits the maintenance deploy (which
  must land FIRST, because it performs the reconcile) from the serving deploy (which must land LAST).
plan_type: IMPLEMENTATION
verification_tier: V3
plan_path: docs/plans/PLAN-ducklake-applied-schema-gate.yaml
phase: >-
  No tier_item alignment. Soft-warn exception category `hotfix` -- forward-fix follow-up to a live
  production incident (ducklake-writer-errors CloudWatch alarm, 2026-07-24T14:31:12Z). Consumes
  T2.26 c9's landed result (ops_execution_plans is DuckLake-resident) but does not advance T2.26.
scope:
  - file: config/lambda/ducklake/field_semantics.static.yaml
    action: Modify
    purpose: >-
      Add three keys per `contract_table_ops.<table>`: `reconcile_scope` (ducklake | exempt, with
      `exempt_reason`); `pending_reconcile` ({history: [...], current: [...]}) listing contract
      columns whose physical ALTER is owed; and `reconciled` ({history: {at, evidence}, current:
      {...}}) recording the reconcile_columns response that justified each clear, so a proven clear is
      distinguishable from a convenience clear. Seed ops_decisions.pending_reconcile with `intent` on
      both sides. This is the existing hand-authored sidecar already carrying non-contract per-table
      operational metadata at exactly this history/current grain (see `migration_columns`).
  - file: scripts/schema_to_field_semantics.py
    action: Modify
    purpose: >-
      Accept and subset-validate the three new sidecar keys, mirroring `_enforce_migration_columns_subset`
      (rec-2232). Emit NONE of them into the generated field_semantics.yaml -- see the
      GENERATED-ARTEFACT DECISION in context.
  - file: scripts/checks/ops_governance/validate_reconcile_pending_gate.py
    action: Create
    purpose: >-
      One module, two entrypoints sharing one predicate. Merge-time check (registered in both
      validate.py tiers): fail closed on an unclassified contract ops table; fail when a field added to
      docs/contracts/ops_*.yaml in the diff is absent from pending_reconcile; fail when a
      pending_reconcile or reconciled entry names a column the contract does not declare. Plus a
      `--deploy-gate` entrypoint returning non-zero while any reconcile_scope=ducklake table has a
      non-empty pending_reconcile, called verbatim by the workflow so the two cannot drift.
  - file: scripts/checks/registry.py
    action: Modify
    purpose: Register validate_reconcile_pending_gate in BOTH the --pre and full tiers.
  - file: scripts/validate.py
    action: Modify
    purpose: Add the facade re-export import so the @registry.register decorator executes.
  - file: scripts/build_lambda_deploy.py
    action: Modify
    purpose: >-
      Add an `only_functions: set[str] | None` parameter to deploy_functions() that filters the
      function_zip_map built by _build_ducklake_function_zip_keys(). Required because --ducklake-only
      is currently all-or-nothing across five functions, which makes the maintenance-first ordering
      this plan needs unexpressible.
  - file: scripts/build_lambda.py
    action: Modify
    purpose: >-
      Add a `--ducklake-functions <comma-list>` CLI flag threading through to only_functions. Absent,
      behaviour is unchanged (all five), so every existing caller and the break-glass path are untouched.
  - file: .github/workflows/deploy-ducklake-lambdas.yml
    action: Modify
    purpose: >-
      Split the single deploy job into deploy-maintenance (maintenance + maintenance-smoke + the three
      layers; NOT gated) -> reconcile-gate (calls --deploy-gate) -> deploy-serving (writer + reader +
      catalog-dr; gated). The existing smoke job hangs off deploy-serving.
  - file: docs/contracts/deploy-paths.yaml
    action: Modify
    purpose: >-
      Decision 126 cl.2 navigation obligation -- add a recovery row for the new red-pipeline state
      (deploy refused, reconcile owed, remedy is an admin-tier verb the agent cannot invoke). Pointer
      only; never a second source of truth for the rule.
  - file: config/agent/verification_registry/registry.yaml
    action: Modify
    purpose: Decision 132 cl.2 -- registry rows for the two `graduate`-dispositioned VP steps.
  - file: tests/checks/ops_governance/test_validate_reconcile_pending_gate.py
    action: Create
    purpose: Unit coverage over the merge-time gate and the --deploy-gate entrypoint.
  - file: tests/build_lambda_deploy/test_function_subset.py
    action: Create
    purpose: >-
      Unit coverage that only_functions filters the deploy set, that an unknown function name fails
      loudly rather than silently deploying nothing, and that omitting it preserves all-five behaviour.
bundled_recommendations: []
infrastructure_dependencies: []
acceptance_criteria:
  - >-
    All six ops tables from generate()['ops_tables'] carry an explicit reconcile_scope, and the gate
    FAILS if any is unset. Classification: `ducklake` for ops_recommendations, ops_decisions,
    ops_priority_queue, ops_execution_plans and ops_smoke_events; `exempt` for ops_session_log alone.
  - >-
    ops_decisions.pending_reconcile lists `intent` under BOTH history and current, and the generator
    rejects any pending_reconcile or reconciled entry naming a column absent from the contract.
  - >-
    validate_reconcile_pending_gate FAILS a PR adding a field to docs/contracts/ops_*.yaml without a
    matching pending_reconcile entry, and the message contains the literal reconcile_columns invoke.
  - >-
    deploy_functions(only_functions=...) deploys exactly the named subset; an unrecognised name raises
    rather than deploying nothing; omitting the argument deploys all five as before.
  - >-
    deploy-ducklake-lambdas.yml runs deploy-maintenance BEFORE reconcile-gate, and deploy-serving only
    after reconcile-gate passes. ducklake_maintenance is NOT gated by the refusal.
  - >-
    The check is registered in both validate.py tiers and `bin/venv-python -m scripts.validate --pre`
    exits 0 on this branch.
  - >-
    OPERATOR-GATED, merge-blocking: the deployed ducklake_maintenance deploy record proves it carries
    the column BEFORE the reconcile runs; reconcile_columns then reports `intent` in added_history and
    added_current; ducklake_reader current_state("ops_decisions") returns rows; and
    --backfill-decisions-md writes dec-151 and dec-152 without a 502.
verification_plan:
  - step: 1
    phase: pre-deploy
    action: >-
      Exercise the merge-time gate -- unclassified table FAILS, diff-added-but-undeclared column FAILS,
      declared column PASSES, non-subset pending/reconciled entry FAILS, unreachable origin/main
      advisory-SKIPs with a printed reason rather than false-greening.
    command: >-
      bin/venv-python -m pytest tests/checks/ops_governance/test_validate_reconcile_pending_gate.py -q
    expected: >-
      All tests pass. The undeclared-column test asserts the failure string contains both the column
      name and the substring "reconcile_columns".
    fix_if: >-
      If the unclassified-table test passes when it should fail, the gate is iterating the sidecar
      rather than the contract -- invert it; generate()['ops_tables'] is authoritative. If the
      advisory-skip false-greens, it must print its reason and be unreachable when origin/main resolves.
    hermetic: false
    graduation: graduate
    graduation_check_id: "reconcile-pending-gate-unit-tests"
  - step: 2
    phase: pre-deploy
    action: >-
      Prove the deploy split is real: only_functions filters the deploy set, an unknown name fails
      loudly, and the default still deploys all five.
    command: bin/venv-python -m pytest tests/build_lambda_deploy/test_function_subset.py -q
    expected: All tests pass.
    fix_if: >-
      A test that passes with an unknown function name means the filter silently intersects to empty --
      a subset deploy that deploys nothing and reports success is exactly the false-green this plan
      exists to remove. Raise on unrecognised names.
    hermetic: false
    graduation: graduate
    graduation_check_id: "build-lambda-deploy-function-subset"
  - step: 3
    phase: pre-deploy
    action: >-
      Run the real merge-time gate against the real repo: all six ops tables classified, and the seeded
      ops_decisions/intent crossing declared rather than undeclared.
    command: >-
      bin/venv-python -c "from scripts.checks.ops_governance.validate_reconcile_pending_gate import
      validate_reconcile_pending_gate as v; f=[]; v(f); print('FAILURES=%d' % len(f)); assert not f, f"
    expected: Prints FAILURES=0, exit 0.
    fix_if: >-
      FAILURES>0 naming an unclassified table means reconcile_scope was seeded for only the tables this
      incident touched. Classify all six against docs/ROADMAP-PLATFORM.yaml T2.26 exit criteria and the
      sidecar's own per-table `status` -- NOT against AGENTS.md, which is stale on ops_execution_plans.
      Never silence the gate by narrowing the table set it iterates.
    hermetic: true
    graduation: waive
    graduation_waiver_reason: >-
      This step runs the check that execution step 4 registers as a standing guard in both validate.py
      tiers (registration is confirmed by VP step 4); a registry row would duplicate an
      already-standing check with no added regression coverage.
  - step: 4
    phase: pre-deploy
    action: >-
      Confirm registration in BOTH validate.py tiers. The pattern is deliberately loose on the _c()
      call shape because current main writes many --pre entries as _c(name, pre_globs=(...)).
    command: >-
      test "$(grep -c 'validate_reconcile_pending_gate' scripts/checks/registry.py)" = "2"
      && grep -q "validate_reconcile_pending_gate" scripts/validate.py && echo REGISTERED_BOTH_TIERS
    expected: Prints REGISTERED_BOTH_TIERS, exit 0.
    fix_if: >-
      A count of 1 means the check landed in one tier only. Decide and record whether the --pre entry is
      pre_globs-gated; if it is, the globs MUST include both docs/contracts/ops_*.yaml and
      config/lambda/ducklake/field_semantics.static.yaml, or a column-add PR skips the gate entirely.
    hermetic: true
    graduation: graduate
    graduation_check_id: "reconcile-pending-gate-registered-both-tiers"
  - step: 5
    phase: pre-deploy
    action: >-
      Confirm the workflow job ordering is what the design requires: maintenance ungated, serving gated
      behind the reconcile gate.
    command: >-
      bin/venv-python -c "import yaml; j=yaml.safe_load(open('.github/workflows/deploy-ducklake-lambdas.yml'))['jobs'];
      assert 'reconcile-gate' not in (j['deploy-maintenance'].get('needs') or []), 'maintenance must not be gated';
      assert 'reconcile-gate' in j['deploy-serving']['needs'], 'serving must be gated';
      assert 'deploy-maintenance' in j['reconcile-gate']['needs'], 'gate must run after maintenance deploy';
      print('JOB_ORDER_OK')"
    expected: Prints JOB_ORDER_OK, exit 0.
    fix_if: >-
      If maintenance is gated behind reconcile-gate, the reconcile becomes a silent no-op: reconcile_columns
      derives its ALTER list from the DEPLOYED maintenance function's bundled field_semantics.yaml, so a
      maintenance function that never received the new column adds nothing and reports
      columns_pre_existing=true. That is the precise false-green this ordering exists to prevent.
    hermetic: true
    graduation: graduate
    graduation_check_id: "ducklake-deploy-maintenance-before-serving"
  - step: 6
    phase: pre-deploy
    action: Confirm the gate lands non-wedging -- the fast presubmit tier is green on this branch.
    command: bin/venv-python -m scripts.validate --pre
    expected: Exit 0, within the Decision 153 / Decision 73 300s fast-tier budget.
    fix_if: >-
      If --pre goes red on the new check, the seeded sidecar entries are malformed. Do not delete the
      check or drop `intent` from the contract to get green. If the run breaches the budget, the gate is
      doing more than a static YAML read plus one _common diff -- narrow it, do not raise the budget.
    hermetic: false
    graduation: waive
    graduation_waiver_reason: >-
      The command is a bare command_exit_zero over `scripts.validate --pre` itself. Graduating it into
      config/agent/verification_registry/registry.yaml -- which `validate --pre` consumes -- is circular:
      the registry row would assert the success of the runner evaluating it.
  - step: 7
    phase: post-deploy
    action: >-
      PREREQUISITE TO THE RECONCILE. Prove the deployed ducklake_maintenance actually carries `intent`
      before invoking the reconcile. Without this, an all-empty reconcile result is indistinguishable
      from a successful no-op and the operator would clear pending_reconcile over a still-broken table.
    command: >-
      aws s3 cp s3://agent-platform-data-lake/deploy-records/ducklake/agent-platform-ducklake-maintenance.json -
      --profile agent_platform --region eu-west-2
    expected: >-
      source_git_sha is the merge commit that introduced `intent` into the generated field_semantics.yaml,
      or a descendant of it. Verify with `git merge-base --is-ancestor f0e701d <source_git_sha>`.
    fix_if: >-
      An older sha means deploy-maintenance has not run since the column landed -- dispatch
      deploy-ducklake-lambdas and re-check. Do NOT proceed to step 8 on a stale record; the reconcile
      would silently add nothing.
  - step: 8
    phase: post-deploy
    action: >-
      OPERATOR-EXECUTED, HUMAN-DIRECTED BREAK-GLASS (Decision 126 cl.1; Decision 151 cl.2 -- "never
      autonomous"; Decision 143 cl.2 -- admin-tier, unreachable from PlatformDev or CI). The implementing
      agent MUST NOT attempt this and holds no lambda:InvokeFunction on ducklake_maintenance. Stop and
      request it. Capture the FULL response body -- it is the evidence recorded in step 11.
    command: >-
      aws lambda invoke --function-name agent-platform-ducklake-maintenance --cli-binary-format
      raw-in-base64-out --payload
      '{"action":"reconcile_columns","data_path":"s3://agent-platform-data-lake/ducklake/","meta_schema":"ducklake_ops","table":"ops_decisions"}'
      --profile agent_platform_admin --region eu-west-2 /tmp/reconcile-ops-decisions.json
      && cat /tmp/reconcile-ops-decisions.json
    expected: >-
      ok=true AND `intent` appears in added_history AND added_current. Given step 7 proved the deployed
      spec carries `intent`, an all-empty added_* with columns_pre_existing=true is acceptable ONLY as
      evidence of a prior successful reconcile -- it is a HARD FAILURE if step 7 was skipped or stale.
    fix_if: >-
      `intent` in one of added_history/added_current but not the other means only one physical table
      reconciled -- do NOT clear pending_reconcile for the missing side. AccessDenied means the wrong
      profile; never widen a CI or PlatformDev role to reach this function.
  - step: 9
    phase: post-deploy
    action: >-
      Verify the incident is resolved through the closed named-verb read boundary (Decision 84 I-3):
      ops_decisions reads again. The single warm catalog read this plan spends (Decision 88). Row-key
      presence is a secondary signal only -- step 8's response body is the authoritative schema oracle,
      because a freshly added column is NULL for every row and may be omitted from row serialization.
    command: >-
      bin/venv-python -c "from src.common.iceberg_reader import make_reader;
      r=make_reader(profile='agent_platform'); rows=r.current_state('ops_decisions');
      assert rows, 'no rows returned'; print('OPS_DECISIONS_READ_OK rows=%d intent_key_present=%s'
      % (len(rows), 'intent' in rows[0]))"
    expected: >-
      Prints OPS_DECISIONS_READ_OK with a non-zero row count. intent_key_present may legitimately be
      False if the reader omits null-valued keys -- that is NOT a failure.
    fix_if: >-
      A continuing HTTP 502 means the reconcile did not land -- re-read step 8's response body. Do NOT
      weaken _assert_no_orphaned_current_rows (scripts/ops_portal/decisions.py:163) or add a 502
      tolerance (Decision 149 cl.3: the guard is never weakened to accommodate a broken substrate).
  - step: 10
    phase: post-deploy
    action: >-
      Confirm the write path recovered via the sanctioned ETL (Decision 84: the only legitimate re-write
      path; never re-stage from logs/.decisions-index.jsonl).
    command: bin/venv-python -m scripts.ops_data_portal --backfill-decisions-md 2>&1 | tail -5
    expected: >-
      Fidelity report shows failed=0, with no "ducklake_writer write_ops ops_decisions failed (HTTP 502)"
      line for dec-151 or dec-152.
    fix_if: >-
      A surviving 502 on a specific decision id means that entry carries a further unreconciled column --
      add it to pending_reconcile and re-run steps 7-8; do not skip the entry.
  - step: 11
    phase: post-deploy
    action: >-
      Close the loop with recorded proof: move `intent` from pending_reconcile into `reconciled` for both
      history and current, pasting step 8's added_history/added_current as the evidence value, commit, and
      confirm the deploy gate now permits.
    command: >-
      bin/venv-python -m scripts.checks.ops_governance.validate_reconcile_pending_gate --deploy-gate
      && echo DEPLOY_GATE_CLEAR
    expected: Prints DEPLOY_GATE_CLEAR, exit 0.
    fix_if: >-
      Still refusing means pending_reconcile was cleared on only one of history/current. Clear a side ONLY
      when step 8's response body evidences that side reconciled -- clearing it to make the gate green is
      the exact failure this plan exists to prevent, and the `reconciled` evidence field exists so that a
      later reader can tell the difference.
constraints:
  - >-
    No rescue agents or workaround loops (Decision 55). A failing post-deploy leg stops and RCAs.
  - >-
    reconcile_columns is ADMIN-TIER and never autonomous (Decision 143 cl.2; Decision 151 cl.2;
    Decision 126 cl.1). The implementing agent stops and requests operator execution for VP step 8.
    Never widen a CI or PlatformDev role to reach ducklake_maintenance.
  - >-
    Both gates must be STATIC and zero-egress (Decision 88). Neither may invoke ducklake_maintenance to
    introspect the catalog -- github_ci_branch is never granted invoke on it, and
    ducklake_maintenance_smoke is env-pinned to the disposable smoke catalog and structurally cannot see
    production ops_decisions. That blindness is why deploy run 8 reported green over a broken table.
  - >-
    The merge-time check and the deploy gate MUST be one module with two entrypoints. Two implementations
    of the same predicate will drift, and the drifting one will be the deploy gate, because it runs least.
  - >-
    The gate uses scripts/checks/_common helpers (ROOT, run, get_changed_files/get_status_aware_diff) --
    Decision 104 makes _common the SOLE home for these, and Decision 135 owns the affected-set diff. Do
    not roll a private git-diff helper.
  - >-
    The gate must stay a static YAML read plus one _common diff. Decision 153 preserves hard-fail on the
    --pre 300s budget for every non-full_suite_forced breach; a gate that walks the catalog or shells out
    repeatedly will breach it.
  - >-
    Do not hand-edit config/lambda/ducklake/field_semantics.yaml -- it is GENERATED (Decision 65,
    Decision 118). Sidecar keys are authored in field_semantics.static.yaml.
  - >-
    Signal and sequencing only. Do not add write buffering, an outbox, retry/replay, or any path that
    re-stages ops rows from logs/.decisions-index.jsonl (Decision 84 I-4).
  - >-
    `--ducklake-functions` must default to all five when omitted, so every existing caller and the
    Decision 125 break-glass path behave exactly as today.
  - >-
    Files outside the Scope table are not modified. Out-of-scope findings become recommendations via
    scripts/ops_data_portal.py, not inline fixes.
context:
  - >-
    "Decision-scout verdict + CITE list (verbatim decision ids)": round 2 verdict FLAGS_FOUND, 106 of 106
    decisions triaged. CITE list: dec-143, dec-151, dec-084, dec-081, dec-149, dec-142, dec-072, dec-126,
    dec-125, dec-039, dec-062, dec-092, dec-144, dec-113, dec-065, dec-118, dec-129, dec-088, dec-055,
    dec-079, dec-132, dec-128, dec-153, dec-104, dec-135, dec-086, dec-103, dec-130, dec-131.
  - "gates: decision-scout=FLAGS_FOUND; plan-critique=<verdict> after <N> round(s)"
  - >-
    INCIDENT ORIGIN. CloudWatch alarm `ducklake-writer-errors` (terraform/personal/ducklake_lambdas.tf:430)
    entered ALARM at 2026-07-24T14:31:12Z on a 1-error datapoint in the 14:16-14:31 window. Source was
    rec-autoclose run 581 (14:26:27Z, commit f0e701d) and again run 585 (16:21:23Z, commit f0049ac), both
    failing with `ducklake_writer write_ops ops_decisions failed (HTTP 502)` for dec-151/dec-152, then
    `ducklake_reader 'read_ops_current' failed (HTTP 502)` raised at scripts/ops_portal/decisions.py:163.
    ops_decisions was confirmed still hard-down for BOTH read and write on 2026-07-25 during this planning
    session; ops_recommendations is unaffected (1538 rows).
  - >-
    ROOT CAUSE. PR f0e701d (Decision 151 / audit finding DCG-06) added the nullable `intent` column to
    docs/contracts/ops_decisions.yaml and the generated field_semantics.yaml. deploy-ducklake-lambdas run 8
    fired automatically on merge at 14:26:27Z and went green, so the deployed reader/writer began requiring
    `intent`. The admin-tier reconcile_columns that physically ALTERs the table was never run. Leg 1 of 3
    self-executes on merge; legs 2 and 3 wait on a human, and nothing enforced the ordering.
  - >-
    THE ORDERING CONSTRAINT, and why the deploy must be split (plan-critique round 2, blocking finding).
    reconcile_columns does NOT take a column list -- reconcile_table_columns (src/common/ducklake_tables.py)
    derives its ALTER set from resolve_table_spec(table).fields, which loads the field_semantics.yaml
    BUNDLED INTO THE DEPLOYED ducklake_maintenance package. So the reconcile can only add columns the
    deployed maintenance function already knows about. A refusal job that blocks all five functions
    therefore blocks maintenance too, the reconcile adds nothing, and handler.py computes
    columns_pre_existing = not added_* -- reporting `true` for a table that was never touched. An earlier
    draft of this plan accepted that result as success, which would have converted a loud
    human-forgetfulness failure into a silent mechanised one. Hence: maintenance deploys FIRST and ungated;
    the gate refuses only the serving deploy; and VP step 7 proves the deployed maintenance carries the
    column before the reconcile is allowed to run.
  - >-
    IN-SCOPE TABLE SET, and the stale oracle. generate()['ops_tables'] returns SIX tables. Neither
    available field discriminates: `status` marks ops_priority_queue `dormant` though Decision 84 makes it
    a live DuckLake table, and resolve_table_spec() succeeds for all six. Hence the explicit
    reconcile_scope with fail-closed on unset. CRITICAL: AGENTS.md's source-of-truth-by-table section is
    STALE -- it still lists ops_execution_plans as Athena/Iceberg, but T2.26 exit criterion c9 is `met`
    (2026-07-21; table provisioned on the catalog with history + current, merge_key rec_id, no Iceberg
    write path surviving), and the sidecar itself records `status: live  # T2.26 c9: DuckLake migration
    landed`. The authoritative oracle for this classification is docs/ROADMAP-PLATFORM.yaml T2.26 exit
    criteria plus the sidecar's own per-table status -- NOT AGENTS.md. An earlier draft of this plan
    classified ops_execution_plans `exempt` on AGENTS.md's authority, which would have permanently
    exempted a live table from the very gate this plan builds. Filed separately: rec-2852 (AGENTS.md
    staleness).
  - >-
    GENERATED-ARTEFACT DECISION. None of reconcile_scope, pending_reconcile or reconciled is emitted into
    the generated config/lambda/ducklake/field_semantics.yaml. Consequences, all intended: the generated
    file's bytes are unchanged by this plan, so validate_field_semantics_drift stays green without a
    regeneration commit; field_semantics.yaml stays out of Scope; and compute_affected_artifacts() returns
    {} for every scope file, so no per-Lambda build/deploy/smoke obligation attaches (had the keys been
    emitted, field_semantics.yaml affects four `status: active` artifacts and Decision 79 / CD.16 would
    apply). The deploy gate reads the sidecar directly.
  - >-
    DESIGN PIVOT HISTORY. Draft 1 proposed a new config/ducklake/applied_schema.yaml. Rejected: it invents
    a fourth config zone against the three-zone layout in config/CLAUDE.md (T-1.7 -- NOT Decision 127,
    which governs the sanctioned-prose taxonomy; an earlier draft mis-cited this); its one-entry-per-table
    grain was coarser than physical reality, since every reconcile surface models history and current
    separately; and its gate was advisory for a MARKED crossing, so a PR that declared its pending column
    would still merge, still deploy, and still break production.
  - >-
    ZONE PLACEMENT, stated as a deliberate exception rather than claimed as automatic conformance.
    config/CLAUDE.md defines config/lambda/<name>/ as bundled runtime payloads and config/agent/<consumer>/
    as agent- and CI-read content. pending_reconcile is read only by a CI check and a workflow job, which
    is config/agent/-class by that definition. It is nonetheless sited in field_semantics.static.yaml
    because that sidecar is the established non-bundled exception in that directory, is the generator's
    input, and already carries migration_columns at exactly this grain -- splitting sibling keys across two
    zones would cost more than the irregularity. Decision 86's "field/contract semantics -> docs/contracts/"
    routing rule was weighed and not followed for the same reason: these keys annotate physical deployment
    state, not contract semantics, and belong with the generator input they constrain.
  - >-
    CORRECTION TO A TEMPTING FALSE LEAD, verified independently by plan-critique round 2. The sidecar's
    existing `migration_columns` key is populated for ops_recommendations and null for ops_decisions, which
    invites the conclusion that populating it would have prevented the incident. It would not.
    reconcile_table_columns derives its ALTER list from resolve_table_spec(table).fields -- the full
    contract -- and a repo-wide grep finds ZERO runtime consumers of migration_columns: the generator
    subset-validates it and emits it as inert metadata. pending_reconcile is therefore a new sibling key,
    not a repurposing -- migration_columns' semantics (columns historically added via migration, already
    applied) are the opposite of pending and must not be overloaded.
  - >-
    OUT OF SCOPE, FILED. rec-2849 (ci-rca.yml's workflow_run filter omits rec-autoclose, so its failures
    file nothing -- why this incident produced no ci_rca rec); rec-2850 (the SNS alerts topic has one
    subscription, an email endpoint -- no CloudWatch alarm reaches ops_recommendations); rec-2851
    (PlatformDev holds no cloudwatch:GetMetricStatistics, no logs:FilterLogEvents/DescribeLogGroups, and no
    lambda:InvokeFunction on ducklake_maintenance, so an agent handed an alarm cannot triage it from AWS at
    all -- scoped to Decision 129's forward-fix prefix shape, NOT an enumeration of the three actions this
    incident needed); rec-2852 (AGENTS.md source-of-truth-by-table stale on ops_execution_plans).
  - >-
    KNOWN RESIDUAL RISKS, named rather than silently omitted. (1) The diff leg of the merge-time gate needs
    a resolvable origin/main; when unreachable it advisory-SKIPs with a printed reason (the Decision 132
    limitation-B precedent used by validate_vp_replay). In CI origin/main always resolves, so the hole is
    local-only. (2) pending_reconcile is operator-maintained; the new `reconciled` evidence field makes a
    convenience clear detectable after the fact but does not mechanically prevent one. A continuous
    truth-probe would cost recurring metered Neon catalog egress on every deploy (Decision 88); a periodic,
    not per-deploy, drift probe is the natural follow-on. (3) The Decision 125 break-glass path
    `build_lambda --ducklake-only --deploy` bypasses the workflow refusal entirely -- the gate binds the
    governed channel, not every possible deploy. The intent line is scoped to the governed channel
    accordingly. (4) While any ducklake-scoped table has a non-empty pending_reconcile, the refusal blocks
    ALL serving deploys, including unrelated writer/reader hotfixes, and leaves deploy-ducklake-lambdas red
    on main -- a red that ci-rca cannot see, because that workflow is absent from its workflow_run filter
    (rec-2849). Fail-closed is the correct posture here, but the blast radius is real.
  - >-
    DEPLOY-TRIGGER FACT (corrected -- an earlier draft asserted the opposite).
    deploy-ducklake-lambdas.yml's push filter is config/lambda/ducklake/**, which MATCHES
    field_semantics.static.yaml. Every sidecar edit -- declaring a pending column or clearing it -- fires
    the workflow on push to main. This is benign and arguably desirable: clearing auto-triggers the
    now-permitted serving deploy. No workflow_dispatch is needed, and an operator should not wait for one.
  - >-
    CI-RCA DEFERRAL RATIONALE (required: ci_rca_unresolved_recs was non-empty at planning time). rec-2836
    ("Terraform init flakes on kislerdm/neon 504 Gateway Timeout from github.com", source=ci_rca,
    priority=Critical, filed 2026-07-24T17:10:56Z, file scripts/checks/_terraform.py) is open. This plan
    satisfies none of the three Related-Work conditions: different file, different Decision Record,
    different failure category (a terraform-init network flake vs a warehouse schema-sequencing defect).
    Deferral is deliberate and was surfaced to the human at Step 6b, who directed proceed-and-flag.
  - >-
    MAIN-DIVERGENCE NOTE (corrected -- draft 1 asserted the opposite and was wrong). The branch was 21
    commits behind origin/main at draft-1 time, and FIVE of those touch this plan's pre-existing scope
    files: 5d770b9 (#748), 3793a0b (#746 check-corpus-curation), 05eff8b (DCG-08), b438fd5 (#727),
    22b35a3 (#738). The check-corpus curation wave changed the exact registration API this plan edits: Step
    gained `pre_globs: tuple[str,...] | None`, `_c()` accepts pre_globs for diff-gating --pre entries,
    validate_decisions_index_freshness was added, and `_s("coverage_report")` became
    `_s("verifier_coverage_report")`. The branch was rebased onto d4db904; the implementer must read
    registry.py and validate.py at that base or later.
  - >-
    DATA-MODEL ASSESSMENT: no table, merge_key, identity scheme, or warehouse write path changes; no Fable
    escalation required. The one grain call is on the new sidecar keys -- grain is ONE ENTRY PER (ops table,
    physical table) where physical table is history or current, matching reconcile_table_columns' loop and
    action_reconcile_columns' added_history/added_current response shape. Draft 1's one-entry-per-table
    grain would have recorded a half-reconciled table as fully reconciled.
  - >-
    SLOC: the new check is expected around 140 lines; build_lambda_deploy.py (371) gains roughly 20 and
    build_lambda.py (270) roughly 10 -- both stay well under the 500 default, so no Decision 128
    decomposition or raise is in play. New test files land under tests/ per the Decision 130/131 mirror
    convention (tests/build_lambda_deploy/ already exists).
