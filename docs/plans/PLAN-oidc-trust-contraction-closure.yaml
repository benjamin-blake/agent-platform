  - >-
    ci-rca DEFERRAL (Related-Work check). rec-3147 (Critical, open, coverage regression in
    scripts/checks/ci_guards/validate_oidc_failopen_guards.py) is deferred by explicit human direction:
    it is owned by another agent under docs/plans/PLAN-oidc-failopen-guard-coverage.yaml. This plan
