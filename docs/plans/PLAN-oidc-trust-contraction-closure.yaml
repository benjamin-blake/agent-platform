schema_version: 4
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: "oidc-trust-contraction-closure"
intent: >-
  Close the trust-contraction chain left open by the 2026-08-15 rename incident so a deliberately
  TEMPORARY iam:UpdateAssumeRolePolicy widening stops being open-ended: drive github_ci_deploy's
  missing live-assume evidence deliberately, contract local.github_repos to the immutable OIDC
  subject in both terraform roots, and revert the widening in the same operator bootstrap apply,
  strictly after the personal-root contraction.
plan_type: IMPLEMENTATION
verification_tier: V3
plan_path: docs/plans/PLAN-oidc-trust-contraction-closure.yaml
phase: >-
  Platform hardening; no tier_item. Ad-hoc closure of the Decision 172 contraction chain
  (rec-3143 -> rec-3142 -> the rec-3132 widening revert). T2.50 / DEP-05 (the protected amendment
  channel over the repo-side gate surface) is COMPLETE as of 2026-07-24, both exit criteria met --
  this plan neither closes nor depends on it, and deliberately does NOT repeat the pre-DEP-05
  justification that the narrow IAMRoleReconcile grant is "the only control" against a fleet-wide
  trust rewrite. DEP-05's CODEOWNERS protected-path channel is now a second, independent control
  (see the merge-gate note in execution_steps). The revert stands on rec-3132's own time-box.
scope:
  - file: terraform/personal/oidc.tf
    action: Modify
    purpose: >-
      Contract local.github_repos to the immutable entry alone (remove benjamin-blake/agent-platform
      and benjamin-blake/theseus); re-ground the dual-slug-transition comment to the contracted
      steady state. Consumed by oidc_ci_roles.tf (branch, pr) and oidc_pipeline_roles.tf (planner,
      deploy).
  - file: terraform/bootstrap/github_ci_apply.tf
    action: Modify
    purpose: >-
      Same contraction in the mirrored local.github_repos list. The two roots cannot reference each
      other, so cross-root agreement is a test invariant -- both lists MUST change in this one commit.
  - file: terraform/bootstrap/github_ci_apply_policy.tf
    action: Modify
    purpose: >-
      Revert the rec-3132 widening: drop the github_ci_planner and github_ci_deploy ARNs from the
      IAMRoleReconcile Sid, delete the TEMPORARY / REVERT OBLIGATION comment block the revert
      discharges, and RE-GROUND (not retain verbatim) the TRUST-ONLY paragraph, whose "DEP-05 is
      still open" premise went stale when T2.50 completed on 2026-07-24.
  - file: tests/checks/iam_tf/test_oidc_trust_slug_invariants.py
    action: Modify
    purpose: >-
      Add TestImmutableSubjectEntry::test_every_entry_is_immutable_format -- every entry in both
      roots' local.github_repos must match the OWNER@ID/REPO@ID format. A FORMAT assertion, never a
      count assertion (Decision 172 point 2's pre-stage playbook adds a future name's immutable entry
      additively before any later rename; a count assertion would wrongly reject that).
  - file: tests/checks/iam_tf/test_iam_role_reconcile_trust_scope.py
    action: Create
    purpose: >-
      Standing guard pinning the IAMRoleReconcile Sid's Resource set to exactly
      {agent-platform-github-ci-branch, agent-platform-github-ci-pr}. This is the machine-checkable
      expiry the original widening lacked -- it existed only as an HCL comment, which is precisely
      why it outlived the event it was scoped to (Decision 163 spirit; Decision 143 clause 1).
  - file: config/agent/verification_registry/registry.yaml
    action: Modify
    purpose: >-
      Add the NEW-in-diff registry row VP step 6's graduate disposition owes
      (plan_slug == oidc-trust-contraction-closure, check_id == oidc-trust-contraction-guards).
      validate_graduation_completeness's implement-PR leg fails the PR without it (T3.21).
  - file: docs/DECISIONS.md
    action: Modify
    purpose: >-
      Discharge Decision 172's legacy-entries-provably-dead-with-proof reversal condition. DEFERRED
      to a second commit AFTER the live evidence lands (VP step 12) -- see the timing note in Context.
  - file: docs/decisions-index.json
    action: Modify
    purpose: >-
      Regenerate the committed decisions index, which any docs/DECISIONS.md edit drifts.
      validate_decisions_index_freshness runs in BOTH presubmit tiers. Travels with the same
      deferred second commit.
bundled_recommendations:
  - rec-3143
infrastructure_dependencies:
  - >-
    terraform/personal/oidc.tf -- IAM trust diff on four roles (branch, pr, planner, deploy). Always
    out-of-budget under the deterministic guard, so it guard-BLOCKs and routes to the tf-gated-apply
    GitHub Environment for human approval (Decision 77 / Decision 92). Applies at merge from the
    speculative plan.bin persisted on the PR (no re-plan, Decision 77 no-TOCTOU).
  - >-
    terraform/bootstrap/** -- OPERATOR-ONLY, never auto-applied (Decision 126; the
    terraform-apply-sandbox path filter is terraform/personal/** on both push and pull_request, and
    terraform/bootstrap is deliberately excluded as the T2.23 self-grant break). The bootstrap edits
    sit INERT in the merged tree until a human applies them by hand under agent_platform_admin.
  - >-
    ORDERING IS LOAD-BEARING. The terraform/personal contraction MUST apply FIRST: it rewrites trust
    on github_ci_planner and github_ci_deploy, which requires github_ci_apply to still hold
    iam:UpdateAssumeRolePolicy on those two roles -- exactly what the rec-3132 widening grants.
    Reverting the widening first strands the contraction behind the same AccessDenied that partially
    failed PR-1's gated apply (run 31879737554, commit 9d9c4e0). PRECISION: bootstrap's exclusion
    from every auto-apply path removes the AUTOMATIC race only. Nothing mechanically stops an
    operator applying bootstrap early -- VP step 9 is the ordering control, and it is a procedural
    gate, not a machine gate. Treat it as the load-bearing human checkpoint it is.
  - >-
    .github/CODEOWNERS maps /terraform/bootstrap/ to @benjamin-blake and main-protection enforces
    require_code_owner_review = true (T2.50 c1). This PR touches two terraform/bootstrap files, so it
    WILL report REVIEW_REQUIRED / BLOCKED. Merging needs a code-owner review or a deliberate,
    audit-logged admin bypass -- the standard CI-green -> squash-merge loop will not clear it.
  - >-
    No boundary or authority-budget change is implied. terraform/bootstrap/github_ci_apply_boundary.tf
    already permits iam:UpdateAssumeRolePolicy at the ceiling; the identity policy is the narrow
    layer (confirmed by rec-3132's RCA: "The permissions boundary is NOT the blocker").
acceptance_criteria:
  - >-
    agent-platform-github-ci-deploy records a live sts:AssumeRoleWithWebIdentity under the immutable
    OIDC subject. Primary evidence is the S3 deploy record's source_git_sha matching the dispatched
    commit (immediate, deterministic); Role.RoleLastUsed.LastUsedDate advancing past the rename at
    2026-08-15T12:55:57Z is the corroborating signal, allowing for IAM's last-used reporting lag.
  - >-
    local.github_repos in BOTH terraform/personal/oidc.tf and terraform/bootstrap/github_ci_apply.tf
    contains exactly the immutable entry benjamin-blake@217728084/theseus@1252427466. The two legacy
    name-only entries are gone from both roots; the immutable entry is untouched.
  - >-
    Every trust SUBJECT on all five CI roles is immutable-format after the contraction, asserted over
    ALL statements of each role's trust document (github_ci_planner has two). For github_ci_apply,
    BOTH Decision 94 sub forms (ref:refs/heads/main and environment:tf-gated-apply) survive. Live
    re-assume is proven by dispatch for deploy and apply; for branch, pr and planner it is a
    CONDITIONAL observation -- each is confirmed against a NAMED exerciser run that demonstrably ran
    after the bootstrap apply, not against an unbounded wait.
  - >-
    The IAMRoleReconcile Sid in the LIVE inline policy on agent-platform-github-ci-apply lists
    exactly the branch and pr role ARNs -- the planner and deploy ARNs are gone. Verified by
    aws iam get-role-policy against live IAM, never by reading the HCL.
  - >-
    Two standing guards fail against the pre-change tree and pass after: every local.github_repos
    entry is immutable-format, and the IAMRoleReconcile Resource set is exactly branch + pr. The
    stale TEMPORARY / REVERT OBLIGATION comment block is gone from the file.
  - >-
    Decision 172's legacy-entries-provably-dead-with-proof reversal condition is discharged only
    AFTER its facts are true: removed from the stanza, recorded as a dated amendment note, stanza
    still well-formed, decisions index regenerated. No new numbered Decision is minted.
verification_plan:
  - step: 1
    phase: post-deploy
    action: >-
      DRIVE rec-3143. Before any file edit, dispatch the governed prod-Lambda code-deploy channel on
      main so github_ci_deploy mints an assume under the immutable subject. Record the run id and the
      dispatched commit sha.
    command: >-
      echo "Dispatch via MCP: mcp__github__actions_run_trigger(method='run_workflow',
      owner='benjamin-blake', repo='theseus', workflow_id='deploy-prod-lambdas.yml', ref='main')
      -- record run id + head sha, wait for completion, then run step 2 (the gate)."
    expected: >-
      The deploy job assumes agent-platform-github-ci-deploy, builds/uploads/deploys the three prod
      artifacts, and the smoke job asserts status=disabled / skipped_comparison=true / statusCode=400.
      Measured blast radius at plan time: compute_affected_artifacts over the 89 files changed since
      the last prod deploy (d024e63) returns exactly {'data-pipeline': ['docs/ROADMAP-PLATFORM.yaml']}
      -- handler code byte-identical, ops-compaction untouched, all three functions schedule-disabled
      (Decision 61/37/116).
    fix_if: >-
      Do NOT read the run conclusion as success -- this step asserts nothing on its own and step 2 is
      the gate. If DEPLOY_ROLE_PROVISIONED is not 'true' and the assume fails, the "Classify
      assume-role outcome" step warns and the run reports GREEN having deployed nothing. On a failed
      assume, read that classifier's warning in the job log and treat it as a live trust regression --
      do NOT re-dispatch blindly.
  - step: 2
    phase: post-deploy
    action: >-
      GATE on the immediate, deterministic evidence: the S3 deploy record proves the deploy job
      actually ran under the assumed role. Promoted ahead of RoleLastUsed because IAM last-used data
      is reported with delay, so RoleLastUsed cannot be a same-minute gate.
    command: >-
      aws s3 cp s3://agent-platform-data-lake/deploy-records/prod/agent-platform-findings-processor.json -
      --region eu-west-2 --profile agent_platform_admin | bin/venv-python -c "import json,sys,os;
      d=json.load(sys.stdin); sha=d['source_git_sha'];
      assert sha==os.environ['DISPATCHED_SHA'], (sha, os.environ['DISPATCHED_SHA']);
      print('deploy-record-fresh-ok', sha[:8])"
    expected: >-
      "deploy-record-fresh-ok <sha8>" where the sha is the commit the step-1 dispatch ran against, not
      d024e63. Export DISPATCHED_SHA from step 1's recorded head sha before running.
    fix_if: >-
      A stale sha means the deploy job no-opped -- the bootstrap-window false green described in step
      1's fix_if. Do NOT proceed to the contraction: contracting while a role has no proof is the
      exact failure mode Decision 172 point 4 exists to prevent. RCA the trust document instead.
  - step: 3
    phase: post-deploy
    action: >-
      CORROBORATE with RoleLastUsed. iam:GetRole is denied to agent_platform/PlatformDev, so this
      needs the admin profile.
    command: >-
      aws iam get-role --role-name agent-platform-github-ci-deploy --profile agent_platform_admin
      --query 'Role.RoleLastUsed.LastUsedDate' --output text
    expected: >-
      A timestamp strictly later than 2026-08-15T12:55:57Z (the rename). At plan time it reads
      2026-08-14T10:32:24Z. Record ONLY the role logical name and the timestamp in any committed
      artefact or PR body -- never the ARN or raw CLI output (Decision 101; the 12-digit account id
      is shape-blocked by the pre-commit never-commit hook).
    fix_if: >-
      IAM last-used reporting lags, so an unchanged timestamp immediately after the run is NOT by
      itself proof of failure. Re-read after ~15 minutes, up to three times. Only if step 2 ALSO
      failed is this a confirmed regression; if step 2 passed and this still has not advanced after
      the retry window, proceed and note the discrepancy -- step 2 is the authoritative gate.
  - step: 4
    phase: pre-deploy
    hermetic: true
    action: Assert the contraction landed in BOTH roots and removed only the two legacy name-only entries.
    command: >-
      bin/venv-python -c "import re,pathlib; paths=['terraform/personal/oidc.tf',
      'terraform/bootstrap/github_ci_apply.tf'];
      get=lambda p: re.findall(r'\"([^\"]+)\"', re.search(r'github_repos\s*=\s*\[([^\]]*)\]',
      pathlib.Path(p).read_text(),re.S).group(1));
      lists=[get(p) for p in paths];
      assert all(l==['benjamin-blake@217728084/theseus@1252427466'] for l in lists), lists;
      print('contracted-ok', lists[0])"
    expected: "contracted-ok ['benjamin-blake@217728084/theseus@1252427466']"
    fix_if: >-
      Any name-only entry surviving means the contraction is incomplete in that root. The immutable
      entry MISSING is the catastrophic case -- it is the only subject this repository can mint
      post-rename, and removing it (or narrowing to the name-only theseus slug) re-breaks OIDC
      completely. That exact mistake is what Decision 172 caught in the original rename plan.
    graduation: waive
    graduation_waiver_reason: >-
      Duplicates the pytest guard graduated at step 6, which asserts the same invariant in its durable
      format-based form over both roots. Graduating a second registry slot for the same predicate would
      register two checks that can never disagree.
  - step: 5
    phase: pre-deploy
    hermetic: true
    action: >-
      Assert the IAMRoleReconcile widening is reverted AND its stale comment block is gone. Asserted
      over the WHOLE FILE, not a slice from the Sid line: the TEMPORARY / REVERT OBLIGATION paragraph
      sits at lines 187-202, ABOVE the Sid at line 203, so a Sid-anchored slice cannot see it -- the
      precise blind spot that would let the comment outlive the code it describes yet again.
    command: >-
      bin/venv-python -c "import pathlib;
      t=pathlib.Path('terraform/bootstrap/github_ci_apply_policy.tf').read_text();
      s=t[t.index('Sid    = \"IAMRoleReconcile\"'):];
      s=s[:s.index('Sid    = \"IAMRoleMetadataWrite\"')];
      assert 'github-ci-planner' not in s and 'github-ci-deploy' not in s, 'widening still present';
      assert 'github-ci-branch' in s and 'github-ci-pr' in s, 'narrow grant was over-removed';
      assert 'REVERT OBLIGATION' not in t, 'stale REVERT OBLIGATION paragraph survives';
      assert 'RENAME WINDOW ONLY' not in t, 'stale TEMPORARY paragraph survives';
      assert 'rec-3132' not in t, 'stale rec-3132 time-box marker survives';
      assert 'DEP-05 (a dedicated trust-boundary control) is' not in t,
      'stale DEP-05-is-open premise survives (T2.50 completed 2026-07-24)';
      print('reconcile-narrow-ok')"
    expected: "reconcile-narrow-ok"
    fix_if: >-
      planner/deploy surviving means the revert did not land. branch/pr MISSING means the revert
      over-removed and broke the legitimate narrow grant the pipeline needs for ordinary trust
      reconcile. A surviving REVERT OBLIGATION / RENAME WINDOW / rec-3132 / DEP-05-is-open string
      means the comment block was not discharged and re-grounded alongside the code.
    graduation: waive
    graduation_waiver_reason: >-
      Duplicates the pytest guard graduated at step 6, which pins the exact Resource set rather than
      substring-probing it. The grep form is retained here only as a fast pre-commit signal and to
      catch the stale-comment strings the set-equality guard does not look at.
  - step: 6
    phase: pre-deploy
    hermetic: false
    action: >-
      Run both standing guards. These are the durable regression barrier and must be red before the
      change and green after -- run them against the PRE-change tree first to prove red.
    command: >-
      bin/venv-python -m pytest tests/checks/iam_tf/test_oidc_trust_slug_invariants.py
      tests/checks/iam_tf/test_iam_role_reconcile_trust_scope.py -q
    expected: >-
      All tests pass on the post-change tree. On the pre-change tree,
      test_every_entry_is_immutable_format fails (2 of 3 entries per root are name-only) and
      test_resource_set_is_exactly_branch_and_pr fails (4 ARNs, not 2).
    fix_if: >-
      A guard that passes on the pre-change tree is not guarding anything -- fix the assertion, not
      the tree. Note test_slug_lists_are_identical_across_roots must also stay green: it is what
      catches a contraction that narrows one root and misses the other.
    graduation: graduate
    graduation_check_id: "oidc-trust-contraction-guards"
  - step: 7
    phase: pre-deploy
    hermetic: false
    action: >-
      Full-tier presubmit before commit/PR (Decision 163 / handoff_policy: the fast tier alone does
      not discharge the pre-handoff obligation).
    command: bin/venv-python -m scripts.validate
    expected: Exit 0 with an empty failed-checks list.
    fix_if: >-
      Forward-fix on the branch (Decision 55). Note rec-3147 (open ci-rca, 100%-coverage regression in
      validate_oidc_failopen_guards) is owned by another agent under
      docs/plans/PLAN-oidc-failopen-guard-coverage.yaml -- if the full tier reds on THAT check and
      nothing else, it is that agent's fix, not this plan's; do not patch it inline.
    graduation: not-applicable
  - step: 8
    phase: post-deploy
    action: >-
      HARD ORDERING GATE. After the PR merges and the tf-gated-apply job is approved and converges,
      confirm all FOUR personal-root roles are contracted in LIVE IAM. Do not run step 9 until this
      passes. Iterates ALL trust statements (github_ci_planner has two -- its pull_request subs live
      in the second and are invisible to a Statement[0] read), coerces scalar-or-list condition
      values, and aggregates failures so no role's result can be masked by a later one.
    command: >-
      rc=0; for r in branch pr planner deploy; do n="agent-platform-github-ci-$r";
      aws iam get-role --role-name "$n" --profile agent_platform_admin --query
      'Role.AssumeRolePolicyDocument.Statement' --output json | bin/venv-python -c "import json,re,sys;
      subs=[]; [subs.extend([v] if isinstance(v,str) else list(v)) for st in json.load(sys.stdin)
      for _o,b in (st.get('Condition') or {}).items() for k,v in b.items() if k.endswith(':sub')];
      legacy=[s for s in subs if not re.match(r'^repo:[A-Za-z0-9_.-]+@[0-9]+/[A-Za-z0-9_.-]+@[0-9]+:',s)];
      ok=bool(subs) and not legacy; print('$n','OK' if ok else 'LEGACY-SURVIVES',len(subs),'subs');
      sys.exit(0 if ok else 1)" || rc=1; done; exit $rc
    expected: >-
      OK for all four roles with a non-zero sub count each, and exit 0. The suffix set differs per role
      by design (main / agent/* / pull_request / refs/pull/*) -- this asserts the SUBJECT FORM over
      every statement, never a suffix count.
    fix_if: >-
      LEGACY-SURVIVES or a zero sub count on any role means the gated apply partially applied, exactly
      as PR-1 did. STOP. Do NOT run the bootstrap apply -- reverting the widening now would strand the
      remaining contraction behind the AccessDenied the widening exists to prevent. Recover via
      Reconcile (reconcile.yml), which re-plans fresh and routes to tf-gated-apply; the
      terraform-apply-sandbox acknowledge-and-retry path is NOT a route to gated-apply on a
      guard-BLOCK change (rec-3132's recorded lesson).
  - step: 9
    phase: post-deploy
    action: >-
      OPERATOR ACTION, strictly after step 8 passes. Apply terraform/bootstrap by hand under
      agent_platform_admin -- carrying BOTH the apply role's own trust contraction and the
      IAMRoleReconcile revert in one apply. Review the plan output before applying; STOP on any
      destroy or replace of aws_iam_role.github_ci_apply or aws_iam_role_policy.github_ci_apply.
      Record the apply completion timestamp; steps 12-14 compare against it.
    command: >-
      echo "OPERATOR: terraform -chdir=terraform/bootstrap plan -var-file=terraform/bootstrap/terraform.bootstrap.tfvars
      # review, then apply, then: export BOOTSTRAP_APPLY_TS=\$(date -u +%Y-%m-%dT%H:%M:%S+00:00).
      Agent executes only after a human reviews the plan and explicitly directs it (Decision 126)."
    expected: >-
      The plan shows in-place updates to the apply role's assume_role_policy (3 subject entries -> 1,
      both Decision 94 sub forms retained) and its inline policy (IAMRoleReconcile 4 ARNs -> 2). No
      destroy, no replace. BOOTSTRAP_APPLY_TS exported for the liveness steps.
    fix_if: >-
      Any destroy/replace of the live apply role or its policy would break every in-flight CI job --
      STOP and RCA. The bootstrap tfvars file is gitignored; regenerate it rather than committing it.
  - step: 10
    phase: post-deploy
    action: >-
      Prove the widening is GONE in live IAM (never by reading the HCL). Output is mapped to role
      short names so no account id is printed (Decision 101).
    command: >-
      aws iam get-role-policy --role-name agent-platform-github-ci-apply --policy-name
      agent-platform-github-ci-apply --profile agent_platform_admin --query 'PolicyDocument'
      --output json | bin/venv-python -c "import json,sys; d=json.load(sys.stdin);
      s=[x for x in d['Statement'] if x.get('Sid')=='IAMRoleReconcile'][0];
      got=sorted(r.rsplit('/',1)[-1] for r in s['Resource']);
      assert got==['agent-platform-github-ci-branch','agent-platform-github-ci-pr'], got;
      print('widening-reverted-ok', got)"
    expected: "widening-reverted-ok ['agent-platform-github-ci-branch', 'agent-platform-github-ci-pr']"
    fix_if: >-
      A four-element list means the bootstrap apply did not land. This is the only step that closes
      the rec-3132 revert obligation; the HCL assertion at step 5 proves intent, this proves effect.
  - step: 11
    phase: post-deploy
    action: >-
      Prove github_ci_apply keeps BOTH Decision 94 sub forms under the immutable entry after its trust
      contraction. RoleLastUsed is per-ROLE and cannot distinguish the forms, so this document proof
      is the only evidence for the environment form.
    command: >-
      aws iam get-role --role-name agent-platform-github-ci-apply --profile agent_platform_admin
      --query 'Role.AssumeRolePolicyDocument.Statement' --output json | bin/venv-python -c "import json,sys;
      subs=[]; [subs.extend([v] if isinstance(v,str) else list(v)) for st in json.load(sys.stdin)
      for _op,body in (st.get('Condition') or {}).items()
      for k,v in body.items() if k.endswith(':sub')];
      i='repo:benjamin-blake@217728084/theseus@1252427466';
      assert sorted(subs)==[f'{i}:environment:tf-gated-apply', f'{i}:ref:refs/heads/main'], sorted(subs);
      print('both-sub-forms-ok')"
    expected: "both-sub-forms-ok"
    fix_if: >-
      A missing environment:tf-gated-apply form silently UNGATES every gated apply -- the VP9
      regression Decision 94 exists to prevent. Restore it in the same bootstrap apply immediately.
  - step: 12
    phase: post-deploy
    action: >-
      POST-CONTRACTION LIVENESS, deploy role. Dispatch the prod channel a second time, then RUN the
      comparison. Between the two dispatches nothing in the Lambda-packaged set changes (terraform/**,
      tests/**, config/agent/**, docs/DECISIONS.md and docs/decisions-index.json are all unpackaged),
      so this ships byte-identical code.
    command: >-
      aws iam get-role --role-name agent-platform-github-ci-deploy --profile agent_platform_admin
      --query 'Role.RoleLastUsed.LastUsedDate' --output text | bin/venv-python -c "import sys,os;
      t=sys.stdin.read().strip(); b=os.environ['BOOTSTRAP_APPLY_TS'];
      assert t>b, f'no advance: {t} <= {b}'; print('deploy-liveness-ok', t)"
    expected: >-
      "deploy-liveness-ok <timestamp>" with the timestamp later than BOOTSTRAP_APPLY_TS. Dispatch
      deploy-prod-lambdas.yml on main first and allow for IAM last-used reporting lag (step 3's retry
      window applies).
    fix_if: >-
      No advance after the retry window means the contraction broke this role's assume. Restore the
      name-only entries in terraform/personal/oidc.tf via the gated path immediately, then RCA -- do
      not leave CI unable to deploy while investigating.
  - step: 13
    phase: post-deploy
    action: >-
      POST-CONTRACTION LIVENESS, apply role. Dispatch terraform-apply-sandbox (the
      acknowledge-and-retry path re-plans fresh and applies; a converged sandbox makes it a no-op that
      still writes a green convergence record), then RUN the comparison. Proves the
      ref:refs/heads/main form post-contraction.
    command: >-
      aws iam get-role --role-name agent-platform-github-ci-apply --profile agent_platform_admin
      --query 'Role.RoleLastUsed.LastUsedDate' --output text | bin/venv-python -c "import sys,os;
      t=sys.stdin.read().strip(); b=os.environ['BOOTSTRAP_APPLY_TS'];
      assert t>b, f'no advance: {t} <= {b}'; print('apply-liveness-ok', t)"
    expected: >-
      "apply-liveness-ok <timestamp>" later than BOOTSTRAP_APPLY_TS, and the convergence record at
      convergence/personal/sandbox.json green.
    fix_if: >-
      A failed assume here is not the sub-form distinction -- step 11 already proved the document, so
      a failure points at the OIDC provider or the subject literal. A red convergence record is drift
      surfaced by the fresh re-plan; triage it as ordinary drift (Decision 55/72), not as a
      contraction failure.
  - step: 14
    phase: post-deploy
    action: >-
      POST-CONTRACTION LIVENESS, remaining three roles -- a CONDITIONAL observation, not an unbounded
      wait. These self-exercise (branch on any ci.yml run, pr on any PR's terraform-validate, planner
      on the hourly terraform-drift cron at 17 * * * *). For each role, name the exerciser run that
      ran after BOOTSTRAP_APPLY_TS, then assert the advance. Aggregates failures across all three.
    command: >-
      rc=0; for r in branch pr planner; do n="agent-platform-github-ci-$r";
      t=$(aws iam get-role --role-name "$n" --profile agent_platform_admin --query
      'Role.RoleLastUsed.LastUsedDate' --output text);
      bin/venv-python -c "import sys,os; t=sys.argv[1]; b=os.environ['BOOTSTRAP_APPLY_TS'];
      ok=t>b; print(sys.argv[2],'OK' if ok else 'NO-ADVANCE',t); sys.exit(0 if ok else 1)"
      "$t" "$n" || rc=1; done; exit $rc
    expected: >-
      OK for all three with exit 0. Planner may need up to one hour (the drift cron cadence); re-run
      rather than treating the first NO-ADVANCE as failure, and record the exerciser run id for each.
    fix_if: >-
      A role that has not advanced after its named exerciser has DEMONSTRABLY run (check that run's
      assume-role step in its job log) is a real regression -- roll back the personal-root contraction
      via the gated path and RCA. Do not declare failure on a role whose exerciser has not yet fired;
      that is an unmet precondition, not evidence.
  - step: 15
    phase: post-deploy
    action: >-
      DEFERRED DISCHARGE (second commit, after step 11's live proof). Edit docs/DECISIONS.md per the
      exact text in Context, regenerate the index, then assert the discharge landed, the stanza is
      still well-formed, and the index is fresh. Scoped to the reversal-conditions STANZA, not the
      whole Decision 172 section -- the amendment note deliberately NAMES the discharged condition id,
      so a section-wide absence assertion would fail against this plan's own prescribed edit.
    command: >-
      bin/venv-python -m scripts.preflight.decision_conditions >/dev/null &&
      bin/venv-python -m scripts.decisions_index --check &&
      bin/venv-python -c "import pathlib,re;
      t=pathlib.Path('docs/DECISIONS.md').read_text();
      sec=t.split('## Decision 171')[0];
      fence=re.search(r'\`\`\`yaml reversal-conditions(.*?)\`\`\`', sec, re.S).group(1);
      assert 'id: legacy-entries-provably-dead-with-proof' not in fence,
      'discharged condition still in the Decision 172 stanza';
      assert 'id: future-rename-not-prestaged' in fence, 'stanza conditions list must stay non-empty';
      assert 'contraction discharged' in sec, 'no dated amendment note recording the discharge';
      print('decision-172-discharged-ok')"
    expected: "Exit 0 from all three; decision-172-discharged-ok printed."
    fix_if: >-
      A MALFORMED stanza exit means the edit broke the fence or emptied the conditions list -- the
      list must stay NON-EMPTY (future-rename-not-prestaged remains). An index-drift failure means the
      regeneration step was skipped: bin/venv-python -m scripts.decisions_index --write.
  - step: 16
    phase: post-deploy
    action: >-
      Close the recommendation ledger and VERIFY the closures. rec-3143 closes at merge via the
      Resolves trailer (its evidence landed at step 2, BEFORE merge). rec-3142 is satisfied only by
      the post-merge gated apply, so it is closed explicitly with the post-apply evidence, never by
      the trailer (Decision 103).
    command: >-
      bin/venv-python -m scripts.ops_data_portal --update-rec rec-3142 --status closed --resolution
      "Contracted local.github_repos to the immutable entry in both roots; gated apply converged and
      all five roles verified live under the immutable subject (VP steps 8, 11-14). The rec-3132
      IAMRoleReconcile widening reverted in the same operator bootstrap apply, strictly after." &&
      bin/venv-python -m scripts.ops_data_portal --sync &&
      bin/venv-python -c "import json,pathlib;
      rows={r['id']: r for r in (json.loads(l) for l in
      pathlib.Path('logs/.recommendations-log.jsonl').read_text().splitlines() if l.strip())};
      bad=[i for i in ('rec-3142','rec-3143') if rows.get(i,{}).get('status')!='closed'];
      assert not bad, bad; print('rec-closures-verified-ok')"
    expected: >-
      "rec-closures-verified-ok". rec-3132 needs no action -- it was already closed on 2026-08-15 when
      the widening LANDED, so no open rec tracks the revert (this plan is its only tracking vehicle).
    fix_if: >-
      A portal write that cannot complete FAILS LOUDLY -- there is no offline outbox (Decision 84 I-4).
      Re-file after restoring connectivity; never hand-edit logs/.recommendations-log.jsonl, and never
      call scripts.sync.ops or any drain/pull CLI directly (Single Portal Invariant). If rec-3143 is
      not closed, rec-autoclose.yml did not fire -- close it with the same --update-rec form.
