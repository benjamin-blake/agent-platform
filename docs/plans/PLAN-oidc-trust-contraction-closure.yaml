  - "gates: decision-scout=FLAGS_FOUND (all 6 flags adopted, no pivot); plan-critique=PROCEED after 1 round(s)"
  - >-
    WHY THIS PLAN EXISTS. terraform/bootstrap/github_ci_apply_policy.tf's IAMRoleReconcile Sid grants
    iam:UpdateAssumeRolePolicy on four roles; two of them (planner, deploy) are marked TEMPORARY
    (rec-3132) with the end condition "remove both in PR-3's bootstrap apply". That removal never
    happened because PR-3 no longer exists as planned: Decision 172 point 4 rehomed the trust
    contraction out of PLAN-repo-rename-relicense onto rec-3142, and the widening must SURVIVE until
    rec-3142 runs. The head of the chain (rec-3143) was unscheduled -- the rename plan's own amended
    acceptance criterion says of it "which no plan drives -- it advances on the next ducklake/prod
    Lambda deploy." A trust verb, the highest risk class in this repo's taxonomy, was left widened
    indefinitely waiting on an event nobody had scheduled. This plan schedules it.
  - >-
    VEHICLE ASSESSMENT (checked, not assumed). deploy-prod-lambdas.yml is the lower-blast-radius
    vehicle. deploy-ducklake-lambdas.yml's reconcile-gate currently PASSES
    (validate_reconcile_pending_gate --deploy-gate exits 0), so it would not block -- but it redeploys
    the live DuckLake writer/reader that every ops-portal call transits, including this plan's own rec
    closures. Rejected on blast radius, not on the gate. A zero-blast-radius PR-context identity anchor
    (the shape #915 added to pr-validate) is structurally impossible: github_ci_deploy's live trust
    carries only :ref:refs/heads/main subjects, so no pull_request-context job can assume it, and
    widening trust to enable an anchor would be worse than the problem it verifies.
  - >-
    EVIDENCE DISCIPLINE. Workflow run conclusions are NOT accepted as proof of an assume. Seven of the
    repo's 26 assume steps carry continue-on-error; #916 closed the three worst masking sites, but the
    two deploy workflows retain a SCOPED tolerance -- while vars.DEPLOY_ROLE_PROVISIONED is not 'true',
    a failed assume warns and the run reports GREEN having deployed nothing. RoleLastUsed plus the S3
    deploy record are the evidence. CloudTrail lookup-events is AccessDenied to both available
    profiles -- do not reach for it.
  - >-
    WHY RoleLastUsed SUFFICES FOR THE DEPLOY ROLE. RoleLastUsed is per-ROLE, not per-sub-form, so it
    normally corroborates liveness without proving the form. For github_ci_deploy specifically it DOES
    prove the form: its trust carries only :ref:refs/heads/main subjects, and the two name-only entries
    cannot be minted post-rename, so any successful assume after 2026-08-15T12:55:57Z necessarily
    matched the immutable entry. This inference does NOT transfer to github_ci_apply, where two sub
    FORMS share one entry -- hence the separate document proof at step 12.
  - >-
    WHY THE CONTRACTION CANNOT CHANGE AN ASSUME OUTCOME. It removes only entries that are provably
    unmintable, so the surviving entry -- and therefore every assume decision -- is textually unchanged.
    The residual risk is a typo in the surviving entry, which steps 9 and 12's document proofs catch
    exactly. Steps 13-15 add live post-contraction re-assume for all five roles anyway, per the
    "prove it, do not argue it" standard.
  - >-
    rec-3132 IS ALREADY CLOSED (2026-08-15), closed when the widening LANDED rather than when it
    reverts. No open rec tracks the revert obligation -- it survives only as an HCL comment and a note
    in PLAN-repo-rename-relicense. This plan is its sole tracking vehicle, which is itself the drift
    being closed. Do not attempt to close rec-3132 again.
  - >-
    DECISION 171 ALREADY ASSERTS THIS HAPPENED. Its Reversal-conditions prose reads "that window closed
    with Decision 172's contraction" -- currently untrue, since the contraction has not landed. This
    plan makes the repository's own Decision text true. No edit to Decision 171 is needed or made
    (forward-direction amendment convention, Decision 126/143).
  - >-
    ONE PLAN, ONE PR, THREE ORDERED APPLIES -- and no rec-3139 exposure. All file edits land in a
    single commit, so validate_vp_replay replays this plan's hermetic pre-deploy steps (4, 5, 7)
