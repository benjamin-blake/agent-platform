rollback: >-
  Per stage. Before step 9 (bootstrap apply): the personal-root contraction is reverted by restoring
  the two name-only entries in terraform/personal/oidc.tf and re-applying through tf-gated-apply -- the
  widening is still live at that point, so the apply role retains the trust-rewrite grant it needs.
  After step 9: the widening is gone, so a personal-root trust rollback would AccessDeny; recovery is
  a second operator bootstrap apply restoring the ARNs first, then the personal rollback -- the exact
  inverse of this plan's ordering, and operator-tier both times. Note the immutable entry is never
  removed at any stage, so no rollback path can reproduce the 2026-08-15 total outage; the worst case
  is a return to the current over-wide steady state, not an outage. The test, registry and
  DECISIONS.md changes are independently revertible and carry no infrastructure effect.
