schema_version: 4
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: "agents-md-ambient-trim"
intent: >-
  Reduce the root ambient-context load every agent session pays by trimming ~7,650 bytes (~23%)
  from AGENTS.md -- deleting dead content, condensing rationale into the Decision entries that own
  it, and replacing restatement with pointers to the owning surface -- without weakening any
  load-bearing rule. Lower ambient cost per session is a direct multiplier on the platform's
  agent-efficiency North Star.
plan_type: IMPLEMENTATION
verification_tier: V2
plan_path: docs/plans/PLAN-agents-md-ambient-trim.yaml
phase: >-
  Prose-surface governance maintenance (Decision 43/110/127 prose taxonomy; Decision 147 Path A
  compact-in-place). Names no tier_item deliberately: this is a human-directed ad hoc trim plus
  rec-3098, so the Tier Item Freshness Gate is skipped under the user_explicit_out_of_scope /
  ad_hoc_rec soft-warn exception (soft warning issued at planning time, not a tier_item claim).
  T3.14 measures prose surfaces but is deferred_post_mvp and is NOT advanced by this plan.
scope:
  - file: AGENTS.md
    action: Modify
    purpose: >-
      Apply the 17 adjudicated edits (8 deletes, 9 condenses) totalling ~7,650 bytes. Never split
      into @-imported fragments (Decision 110/114). The "### Commit-message conventions" section
      and both Safety-section deploy bullets are OUT of scope and must not be touched.
  - file: docs/DECISIONS.md
    action: Modify
    purpose: >-
      Append a dated amendment to Decision 84 carrying the Iceberg-DELETE-resurrection mechanism
      being condensed out of AGENTS.md. Grounds (corrected at critique): the OUTCOME half is
      already duplicated at scripts/checks/ops_governance/validate_warehouse_write_sources.py:22-27
      and adjacently at src/common/outbox_retirement.py:4-5, but the CAUSAL half -- that
      _prepare_record refreshes last_updated_timestamp = now, which is WHY the re-staged row wins
      the SCD2 dedupe -- is recorded nowhere. The amendment rehomes that causal link into the
      Decision that owns the rationale (Decision 86 routing), rather than leaving it only in a
      check docstring.
  - file: scripts/checks/ops_governance/validate_warehouse_write_sources.py
    action: Modify
    purpose: >-
      Comment-only repoint at line 53 ("see the AGENTS.md re-enable runbook caveat") onto
      T4.12 / Decision 84, so the reference does not dangle once the runbook is deleted.
  - file: scripts/preflight/ci_rca_gauges.py
    action: Modify
    purpose: >-
      DOCSTRING-text repoint at line 42 ("until Lambda scheduled agents re-enable (AGENTS.md
      runbook)") onto T4.12. The line sits inside _escalate_ci_rca_probe_health's docstring (its
      first statement, spanning roughly lines 38-47), NOT a '#' comment -- which is why VP step 15
      verifies it by AST comparison rather than a comment-line filter.
  - file: docs/contracts/inference-provider.yaml
    action: Modify
    purpose: >-
      Repoint operative_state.scheduled_agents.ref (line 90, 'AGENTS.md runbook') onto T4.12, and
      add the amendment_log[] entry that check_amendment_log_for_class_d requires for any parsed
      content change to a Class D contract.
  - file: docs/INTENT-ci-rca-methodology.md
    action: Modify
    purpose: >-
      FOURTH citation site, found at the critique gate and missed by the planning sweep (which
      searched phrase variants but never the bare string repo-wide). Line 523 reads "until Lambda
      scheduled agents re-enable (see the AGENTS.md runbook)" -- repoint onto T4.12. Legal despite
      the Decision 86 intent-doc freeze: validate_intent_doc_freeze gates a doc's EXISTENCE against
      the docs/intent-migration/MANIFEST.yaml grandfather set, never its content, so a one-line
      prose repoint inside an already-grandfathered doc adds no new standing surface.
  - file: tests/test_agents_md_citations.py
    action: Create
    purpose: >-
      Standing guard that no tracked file cites a deleted AGENTS.md runbook. Red today (FOUR live
      citations), green after -- and discharges the surface-retiring closure obligation. Must build
      its search patterns from split literals (e.g. "AGENTS.md" + " runbook") so the file never
      contains the literal it searches for; otherwise it self-matches and can never pass. The
      repo's alternative precedent is the _self_path exclusion at
      scripts/checks/ops_governance/validate_warehouse_write_sources.py:32,40.
bundled_recommendations:
  - rec-3098
infrastructure_dependencies: []
acceptance_criteria:
  - "AGENTS.md is at most 26,000 bytes (from 33,150), i.e. a reduction of at least 7,000 bytes."
  - "config/prose_budgets.yaml is byte-identical to origin/main; S1 root_ambient_load_set remains 33161."
  - "The '### Commit-message conventions' section of AGENTS.md is byte-identical to origin/main."
  - "AGENTS.md still contains at least one literal occurrence of the string 'deploy-paths.yaml'."
  - >-
    No tracked file outside docs/plans/, docs/audit-prompts/, audits/ and logs/ cites an AGENTS.md
    runbook (the strings 'AGENTS.md runbook' and 'AGENTS.md re-enable runbook' are absent).
  - >-
    docs/contracts/inference-provider.yaml carries a new amendment_log[] entry
    (change_class: prose_improvement, semantic_break: false) and validate_contract_drift passes.
  - >-
    Decision 84 carries a dated amendment recording the Iceberg-DELETE-resurrection mechanism, and
    validate_decisions_size still passes on both surviving ceilings.
  - >-
    rec-3098 is closed with an explicit resolution string via ops_data_portal --update-rec, NOT via
    the Resolves: squash trailer (Decision 103 forbids direct-closing a semantic verdict).
  - >-
    Every named load-bearing rule survives in substance: the STRATEGIC suspension and its CD.17/T4.2
    reversal condition, the per-Lambda (not blanket) gating rule stated operatively in AGENTS.md,
    the send_later/trigger-out-of-scope rule, the auto-merge-does-not-subsume-conflict-wake rule,
    the get_rec_write_guidance()-before-file_rec() rule, the read-cache-is-never-a-write-source hard
    rule, the Windows-subprocess bullet, and the PowerShell prohibition.
  - "bin/venv-python -m scripts.validate --pre exits 0."
verification_plan:
  - step: 1
    phase: pre-deploy
    action: Measure the trimmed surface and confirm the reduction target is met without breaching budget.
    command: >-
      bin/venv-python -c "import pathlib; a=len(pathlib.Path('AGENTS.md').read_bytes());
      c=len(pathlib.Path('CLAUDE.md').read_bytes()); print('AGENTS.md',a,'S1',a+c);
      assert a<=26000, f'AGENTS.md {a} > 26000'; assert a+c<=33161, f'S1 {a+c} over budget'"
    expected: "AGENTS.md at most 26000 bytes and S1 at most 33161; prints both figures."
    fix_if: >-
      Over 26000 means fewer edits landed than adjudicated -- re-check the 17 edits against the plan
      rather than deleting extra content. Over 33161 is impossible unless content was added.
    hermetic: true
    graduation: waive
    graduation_waiver_reason: >-
      A standing byte-threshold check on AGENTS.md would duplicate validate_prose_limits, which
      already governs S1 against config/prose_budgets.yaml as the sole ratchet. A second guard on
      one surface is the redundancy that registry explicitly warns against.
  - step: 2
    phase: pre-deploy
    action: Confirm the budget file was not reseeded or otherwise modified (deliberate reservation).
    command: "git diff --exit-code origin/main -- config/prose_budgets.yaml && echo UNCHANGED"
    expected: "Exit 0 and prints UNCHANGED -- no diff against origin/main."
    fix_if: >-
      Any diff means the S1 advisory was acted on. Revert the file entirely: the freed headroom is
      reserved for the named successor plan (see Context).
    hermetic: true
    graduation: waive
    graduation_waiver_reason: >-
      Asserting a config file never changes is a plan-scoped boundary for this one PR, not a durable
      invariant -- the successor plan must be free to reseed it. Graduating this would block that.
  - step: 3
    phase: pre-deploy
    action: Confirm the scope boundary held -- the Commit-message conventions section is untouched.
    command: >-
      git diff origin/main -- AGENTS.md | grep -E '^[-+].*(feat\(\{slug\}\)|plan\(\{slug\}\)|roadmap\(\{ids\}\)|scope\(\{slug\}\)|audit\(\{slug\}\))'
      && echo BOUNDARY_VIOLATION && exit 1 || echo BOUNDARY_OK
    expected: "Prints BOUNDARY_OK -- no added or removed line touches the conventions table rows."
    fix_if: >-
      BOUNDARY_VIOLATION means an edit strayed into the section reserved for the successor plan.
      Restore those lines exactly as they are on origin/main.
    hermetic: true
    graduation: waive
    graduation_waiver_reason: >-
      This is a one-time merge-conflict-avoidance boundary agreed with the operator for this PR
      only; as a standing check it would permanently freeze a section that is expected to change.
  - step: 4
    phase: pre-deploy
    action: Confirm the deploy-paths.yaml Class D evaluator still resolves against AGENTS.md.
    command: "test \"$(grep -c 'deploy-paths.yaml' AGENTS.md)\" -ge 1 && echo EVALUATOR_LITERAL_PRESENT"
    expected: "Prints EVALUATOR_LITERAL_PRESENT (currently 2 occurrences, at the two Safety deploy bullets)."
    fix_if: >-
      Zero occurrences breaks docs/contracts/deploy-paths.yaml's {agent_surface: AGENTS.md}
      evaluator, failing validate_contract_drift Pass 1 on every PR. Restore the Safety bullets.
    hermetic: true
    graduation: waive
    graduation_waiver_reason: >-
      Verified at plan time that validate_contract_drift resolves every Class D evaluator in Pass 1
      repo-wide on every run (not diff-scoped), so this invariant already has a standing guard;
      graduating a grep would double-guard it.
  - step: 5
    phase: pre-deploy
    action: >-
      Stale-reference sweep (surface-retiring closure obligation) -- no citation of the deleted
      runbook survives anywhere in the live tree.
    command: >-
      ! git grep -lI -e 'AGENTS\.md runbook' -e 'AGENTS\.md re-enable runbook' -- .
      ':!docs/plans' ':!docs/audit-prompts' ':!audits' ':!logs' && echo NO_DANGLING_CITATIONS
    expected: "Prints NO_DANGLING_CITATIONS -- zero matches outside history/plan/audit directories."
    fix_if: >-
      Each match is a dangling pointer to deleted ambient content. Repoint it at T4.12 / Decision 84
      the same way as the four known sites; do not restore the runbook. Uses git grep (tracked files
      only) rather than grep -r, which would descend into .venv and other untracked trees.
    hermetic: true
    graduation: waive
    graduation_waiver_reason: >-
      This exact invariant ships as tests/test_agents_md_citations.py in this same PR, so graduating
      a registry check would create two guards for one invariant on the same commit.
  - step: 6
    phase: pre-deploy
    action: Run the new dangling-citation guard test (green side of the red/green pair).
    command: "bin/venv-python -m pytest tests/test_agents_md_citations.py -v"
    expected: "All tests pass."
    fix_if: >-
      A failure names the surviving citation -- repoint it. If the test errors on collection, the
      exclusion globs are wrong; scope them to the live tree only.
    hermetic: false
    graduation: waive
    graduation_waiver_reason: >-
      The step runs the very test being added, so graduating it into the verification registry would
      register a check whose entire body is "run this one pytest file" -- pytest already runs it in
      both validate tiers.
  - step: 7
    phase: pre-deploy
    action: >-
      Prove the red side -- the same guard fires against the pre-change tree, confirming it is a
      real regression guard and not a vacuous pass.
    command: >-
      test "$(git grep -lI -e 'AGENTS\.md runbook' -e 'AGENTS\.md re-enable runbook' origin/main -- .
      ':!docs/plans' ':!docs/audit-prompts' ':!audits' ':!logs' | tee /dev/stderr | wc -l)" -eq 4
      && echo RED_SIDE_PROVEN_4_SITES
    expected: >-
      Prints the four filenames then RED_SIDE_PROVEN_4_SITES -- exactly 4 files on origin/main:
      docs/INTENT-ci-rca-methodology.md,
      docs/contracts/inference-provider.yaml,
      scripts/checks/ops_governance/validate_warehouse_write_sources.py and
      scripts/preflight/ci_rca_gauges.py -- matching the four Scope rows that repoint them.
    fix_if: >-
      Fewer than 4 means the guard is vacuous or the patterns are wrong. MORE than 4 means a fifth
      citation site exists that this plan does not repoint: add it to Scope rather than narrowing
      this command. Deliberately unscoped by path -- the planning sweep missed a site precisely
      because it searched only the directories it already expected to fix, so a red-side proof
      restricted to the author's prior belief cannot falsify the citation inventory.
    hermetic: false
    graduation: waive
    graduation_waiver_reason: >-
      A one-time red/green demonstration against a specific base commit; it is meaningless as a
      standing check because origin/main advances past the pre-change state immediately on merge.
  - step: 8
    phase: pre-deploy
    action: Confirm the Class D contract edit carries its required amendment_log entry.
    command: >-
      bin/venv-python -c "from scripts.checks.contracts.validate_contract_drift import
      validate_contract_drift as v; f=[]; v(f); print(f); assert not f, f; print('CONTRACT_DRIFT_OK')"
    expected: "Prints [] then CONTRACT_DRIFT_OK -- no 'Contract drift (amendment)' failure for inference-provider.yaml."
    fix_if: >-
      "parsed content changed but no new amendment_log[] entry was added" means the entry is missing
      or duplicates an existing one. Add a distinct entry: date, semantic_break: false,
      change_class: prose_improvement, summary naming the ref repoint. Do not bump contract_version
      (deploy-paths.yaml's 2026-08-13 prose_improvement precedent did not). NOTE: the check module
      has no __main__ block, so `python -m` on it silently exits 0 without running anything -- this
      step must import and call the function, never invoke the module.
    hermetic: false
    graduation: waive
    graduation_waiver_reason: >-
      validate_contract_drift is itself the registered standing check for this invariant; this step
      simply invokes it, so there is nothing left to graduate.
  - step: 9
    phase: pre-deploy
    action: >-
      Confirm the Iceberg resurrection mechanism landed on Decision 84 and the decision-log ceilings
      still hold.
    command: >-
      bin/venv-python -c "import pathlib,re; t=pathlib.Path('docs/DECISIONS.md').read_text(encoding='utf-8');
      m=re.search(r'^## Decision 84:.*?(?=^## Decision |\Z)', t, re.S|re.M);
      assert m, 'Decision 84 section not found'; s=m.group(0);
      assert 'Amendment 2026-08-17, PLAN-agents-md-ambient-trim' in s, 'amendment absent from Decision 84 section';
      assert '_prepare_record' in s and 'last_updated_timestamp' in s, 'causal half missing from the amendment';
      print('DECISION_84_AMENDMENT_OK')" && bin/venv-python -c "from
      scripts.checks.decisions.validate_decisions_size import validate_decisions_size as v; f=[];
      v(f); assert not f, f; print('DECISIONS_SIZE_OK')"
    expected: "Prints DECISION_84_AMENDMENT_OK then DECISIONS_SIZE_OK."
    fix_if: >-
      An assertion failure means the amendment is missing from Decision 84's own section, or landed
      without the causal half (_prepare_record refreshing last_updated_timestamp) that exists nowhere
      else. Deliberately section-scoped and plan-slug-anchored: a bare file-wide grep for
      'Amendment 2026-08-17' or '_prepare_record' is VACUOUS -- both already match on origin/main for
      unrelated reasons (Decisions 148 and 132 carry same-dated amendments from commit 7fa00f2;
      Decision 81 line 4836 mentions _prepare_record about a different claim), so a file-wide grep
      passes with this amendment entirely absent. The literal
      'PLAN-agents-md-ambient-trim' occurs 0 times in DECISIONS.md today, which is what makes this
      red-capable. validate_decisions_size lives at scripts/checks/decisions/ (NOT
      scripts.checks.governance, which does not exist) and has no __main__ block, so it must be
      imported and called rather than invoked with python -m.
    hermetic: true
    graduation: waive
    graduation_waiver_reason: >-
      The ceilings are already enforced by the registered validate_decisions_size check, and the
      amendment-presence half is a one-time landing assertion for this specific dated entry.
  - step: 10
    phase: pre-deploy
    action: >-
      Confirm every load-bearing rule promised to survive is still present in AGENTS.md after the
      trim (the anti-over-deletion check).
    command: >-
      bin/venv-python -c "import pathlib,sys; t=pathlib.Path('AGENTS.md').read_text(encoding='utf-8');
      req=['STRATEGIC','CD.17','get_rec_write_guidance','send_later','auto-merge','sys.executable',
      \"encoding='utf-8'\",'PowerShell','read cache is never a write source','manifest.yaml','never_on_main'];
      missing=[r for r in req if r not in t]; print('MISSING:',missing) or sys.exit(1 if missing else 0)"
    expected: "Prints MISSING: [] and exits 0 -- every load-bearing anchor survived."
    fix_if: >-
      Any listed anchor missing means a condense went too far and removed a rule rather than its
      rationale. Restore the operative sentence for that rule; do not restore the surrounding prose.
    hermetic: true
    graduation: waive
    graduation_waiver_reason: >-
      These anchors are deliberately reworded by the very next plan (successor migration step 4), so
      a standing substring guard on AGENTS.md prose would fail on legitimate future edits -- a
      brittle-by-construction check.
  - step: 11
    phase: pre-deploy
    action: >-
      Close rec-3098 through the portal with an explicit resolution and verify the closure landed
      (Decision 103: a semantic verdict is never a direct autoclose).
    command: >-
      bin/venv-python -m scripts.ops_data_portal --update-rec rec-3098 --status closed --resolution
      "Defect removed by deletion: the AGENTS.md re-enable runbook and its mis-attributed
      rec-curator caveat were deleted wholesale by PLAN-agents-md-ambient-trim, so no stale T2.26
      attribution remains in ambient context. The correct T4.3-then-T4.12 chain is already carried
      by docs/PROJECT_CONTEXT.md. The rec's literal acceptance grep is not satisfiable post-deletion
      (its first conjunct expects the caveat to exist and name T4.3); closed on removal-of-defect
      evidence per Decision 103, not via the Resolves trailer."
    expected: "Portal write succeeds; rec-3098 status is closed with the resolution recorded."
    fix_if: >-
      A portal failure fails loudly with no offline outbox (Decision 84 I-4) -- confirm the chain
      with aws sts get-caller-identity --profile agent_platform and re-run. Never hand-edit
      logs/.recommendations-log.jsonl.
    hermetic: false
    graduation: waive
    graduation_waiver_reason: >-
      A one-shot operational write against live warehouse state for a single rec id; it is not
      expressible as a repeatable regression guard and requires credentials.
  - step: 12
    phase: pre-deploy
    action: >-
      Verify rec-3098 reads closed from the warehouse-backed cache (bundled-rec closure obligation).
    command: >-
      bin/venv-python -m scripts.sync.ops pull >/dev/null 2>&1; bin/venv-python -c "import json,pathlib;
      r=[json.loads(l) for l in pathlib.Path('logs/.recommendations-log.jsonl').read_text().splitlines()
      if l.strip()]; m=[x for x in r if x.get('id')=='rec-3098']; print(m[0]['status'], '|',
      (m[0].get('resolution') or '')[:60]); assert m and m[0]['status']=='closed'"
    expected: "Prints 'closed | Defect removed by deletion: ...' and the assert passes."
    fix_if: >-
      Still open means the step-11 write did not commit. Re-run step 11 and re-pull; do not edit the
      read cache, which is never a write source.
    hermetic: false
    graduation: waive
    graduation_waiver_reason: >-
      Asserts a single rec id's terminal lifecycle state at one moment in time -- inherently
      non-repeatable and credential-bound, so it cannot serve as a standing regression guard.
  - step: 13
    phase: pre-deploy
    action: >-
      Run the authoritative fast presubmit and confirm the expected S1 under-budget advisory appears
      and is correctly non-blocking.
    command: "bin/venv-python -m scripts.validate --pre 2>&1 | tee /tmp/pre.log; grep -i 'below budget' /tmp/pre.log || true"
    expected: >-
      validate --pre exits 0. The S1 'bytes below budget 33161; reseed config/prose_budgets.yaml to
      ratchet down' advisory is present and does NOT fail the run.
    fix_if: >-
      A non-zero exit is a real failure -- diagnose it. If the advisory is absent, the trim did not
      land. Do NOT reseed the budget in response to the advisory under any circumstances.
    hermetic: false
    graduation: waive
    graduation_waiver_reason: >-
      Marking a step that invokes scripts/validate.py as graduated would register a check that runs
      validate.py from inside validate.py -- the recursion the hermetic-authoring rule forbids.
  - step: 14
    phase: pre-deploy
    action: >-
      Prove the validate_warehouse_write_sources.py repoint changed no executable code, by comparing
      the docstring-stripped AST against origin/main.
    command: >-
      bin/venv-python -c "import ast,subprocess; p='scripts/checks/ops_governance/validate_warehouse_write_sources.py';
      s=lambda src:(lambda t:[setattr(n,'body',n.body[1:]) for n in ast.walk(t) if isinstance(n,(ast.Module,ast.FunctionDef,ast.AsyncFunctionDef,ast.ClassDef))
      and ast.get_docstring(n) is not None] and ast.dump(t) or ast.dump(t))(ast.parse(src));
      b=subprocess.run(['git','show','origin/main:'+p],capture_output=True,text=True).stdout;
      assert b.strip(), 'BASE_UNREADABLE: git show returned empty -- fetch origin/main, do not read this as a code change';
      assert s(b)==s(open(p).read()), 'executable code changed'; print('NO_EXECUTABLE_CHANGE')"
    expected: "Prints NO_EXECUTABLE_CHANGE -- the docstring-stripped AST is identical to origin/main."
    fix_if: >-
      An assertion failure means executable code changed, so the test_obligations waiver ("comment
      text only") is void. Either revert the logic change or replace the waiver with a real
      red/green test. AST equality is used rather than a '#'-line grep because a grep cannot
      distinguish a comment from a docstring line.
    hermetic: true
    graduation: waive
    graduation_waiver_reason: >-
      Asserts a property of this PR's own diff against a specific base commit; it is meaningless as a
      standing check because the diff disappears the moment the change merges.
  - step: 15
    phase: pre-deploy
    action: >-
      Prove the ci_rca_gauges.py repoint changed no executable code. The edited line is inside
      _escalate_ci_rca_probe_health's DOCSTRING, not a '#' comment, so a comment-line filter cannot
      verify it -- AST comparison is required.
    command: >-
      bin/venv-python -c "import ast,subprocess; p='scripts/preflight/ci_rca_gauges.py';
      s=lambda src:(lambda t:[setattr(n,'body',n.body[1:]) for n in ast.walk(t) if isinstance(n,(ast.Module,ast.FunctionDef,ast.AsyncFunctionDef,ast.ClassDef))
      and ast.get_docstring(n) is not None] and ast.dump(t) or ast.dump(t))(ast.parse(src));
      b=subprocess.run(['git','show','origin/main:'+p],capture_output=True,text=True).stdout;
      assert b.strip(), 'BASE_UNREADABLE: git show returned empty -- fetch origin/main, do not read this as a code change';
      assert s(b)==s(open(p).read()), 'executable code changed'; print('NO_EXECUTABLE_CHANGE')"
    expected: "Prints NO_EXECUTABLE_CHANGE -- the docstring-stripped AST is identical to origin/main."
    fix_if: >-
      An assertion failure means executable code changed, so the test_obligations waiver is void.
      Either revert the logic change or replace the waiver with a real red/green test.
    hermetic: true
    graduation: waive
    graduation_waiver_reason: >-
      Asserts a property of this PR's own diff against a specific base commit; it is meaningless as a
      standing check because the diff disappears the moment the change merges.
test_obligations:
  - source: AGENTS.md
    behavior: >-
      Deleting the ambient re-enable runbook leaves no dangling citation to it anywhere in the live
      tree -- the failure mode this change could plausibly introduce.
    verification_step: 6
    test_selector: "tests/test_agents_md_citations.py::test_no_dangling_agents_md_runbook_citations"
    red_green_expectation: >-
      Red before against FOUR live citations -- validate_warehouse_write_sources.py:53,
      ci_rca_gauges.py:42, inference-provider.yaml:90 and docs/INTENT-ci-rca-methodology.md:523
      (the fourth was missed by the planning sweep and found at the critique gate) -- green after
      all four are repointed. VP step 7 proves the red side unscoped so the count cannot be
      self-confirming.
  - source: scripts/checks/ops_governance/validate_warehouse_write_sources.py
    behavior: "The check's logic is unchanged; only the comment's pointer target moves to T4.12 / Decision 84."
    verification_step: 14
    command: "assert s(b)==s(open(p).read()), 'executable code changed'; print('NO_EXECUTABLE_CHANGE')"
    waiver_reason: >-
      Comment-text-only edit with no behavior change, so no test can go red-then-green on it. The
      linked step proves it positively by comparing the docstring-stripped AST against origin/main
      (strictly stronger than a comment-line grep), and the repointed target itself is guarded by
      the new dangling-citation test.
  - source: scripts/preflight/ci_rca_gauges.py
    behavior: >-
      The gauge's logic is unchanged; only the pointer target inside
      _escalate_ci_rca_probe_health's DOCSTRING moves to T4.12.
    verification_step: 15
    command: "assert s(b)==s(open(p).read()), 'executable code changed'; print('NO_EXECUTABLE_CHANGE')"
    waiver_reason: >-
      Docstring-text-only edit with no behavior change, so no test can go red-then-green on it. Note
      this is a docstring, NOT a '#' comment (the planning draft misclassified it), which is why the
      linked step uses AST comparison rather than a comment-line filter that would silently fail to
      match. The repointed target is guarded by the new dangling-citation test.
  - source: docs/contracts/inference-provider.yaml
    behavior: >-
      The scheduled_agents ref points at a live owner (T4.12) and the Class D amendment_log
      discipline is satisfied; the provider-tier body and its Decision 116 note are untouched.
