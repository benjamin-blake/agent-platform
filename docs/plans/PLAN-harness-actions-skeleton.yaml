constraints:
  - >-
    THE SINGLE NEW MECHANISM IS THE JOURNAL, AND IT IS DECLARED. This run's diagnosed recurrence engine
    is remediate-by-adding-mechanism: across five waves, every failed fix was additive. This plan adds
    exactly one thing -- two warehouse tables and their writer -- because no existing mechanism stores
    task state. Everything else REUSES what exists: the OIDC trust from CD.21, CLAUDE_CODE_OAUTH_TOKEN
    from claude.yml, native workflow triggers, GitHub concurrency groups, and the standing pytest suite.
    Any reviewer finding a second new mechanism should treat it as a defect.
  - >-
    NO STEP FUNCTIONS, NO DURABLE FUNCTIONS, NO TASK TOKEN, NO LAMBDA IN THE LOOP. An earlier design in
    this run proposed Step Functions holding the task tree with a .waitForTaskToken callback. It was
    rejected as TWO BRAINS: the SFN execution history would be a second live copy of a task tree the
    warehouse-as-source-of-truth invariant already mandates. The seam is asymmetric on purpose -- DOWN
    is a dispatch, UP is a journal write. There is no token, so there is nothing to leak, and recovery
    is an idempotent sweep rather than a heartbeat.
  - >-
    ONE ACTIONS JOB = ONE WHOLE TASK-ATTEMPT, NEVER ONE TOOL CALL. Runner startup is 10-60 seconds. A
    per-tool-call crossing would make latency dominate everything the design buys. The loop inside the
    job is an ordinary loop with no external orchestration per turn.
  - >-
    THE TRIGGER IS IDENTITY-GATED. This repo is public, anyone can open an issue, and the runner holds
    credentials. Gate on actor or an operator-applied label, never on issue or comment body content.
    Note that .github/workflows/claude.yml today gates on `contains(github.event.issue.body, '@claude')`
    -- that is the content shape, and it must not be copied into a workflow that writes branches.
  - >-
    THE 15-MINUTE ENVELOPE IS NOT THIS PLAN'S CONTROL. An earlier design bounded agent work by a
    system-prompt instruction. That is a good cost and capability control but a weak correctness
    control, and its failure mode is a poison pill: a too-long command is killed, retried, killed
    again. Actions gives the same control as a HARD limit via timeout-minutes, with a 6-hour ceiling
    instead of 15 minutes. Use the hard limit; the prompt constraint is optional and additive.
  - >-
    CD.43 IS NOT CLOSED BY THIS PLAN. CD.43 (workspace_store_selection) was written expecting a race
    between S3 workspace strategies. Under this design the workspace is the Actions checkout and the
    question does not arise in that form. Say so in the roadmap rather than silently marking it
    answered -- a criterion closed by a question that changed shape is a false closure.
  - >-
    IMPLEMENT SEQUENTIALLY, GRAIN AS A TREE. Parallel subagent execution is OUT OF SCOPE (milestone 4).
    But parent_task_id ships in milestone 1, because schema is cheap and re-graining persistence later
    is not. A sequential run is the degenerate case: a tree with one leaf.
  - >-
    SET THE PROMPT CACHE TTL TO ONE HOUR. Anthropic prompt caching is server-side and prefix-keyed, so
    a fresh runner hits an existing cache exactly like a long-lived process -- the concern that a
    stateless substrate breaks caching is unfounded. What IS real is the gap between attempts eating
    the default 5-minute TTL. One parameter fixes it; step 14 measures what a miss actually costs.
  - >-
    OUT OF SCOPE, WITH NAMED TRIGGERS. Milestone 3 (dispatcher Lambda, wait-on-external-event routing)
    enters when cross-task dependencies or scheduled runs outlive a single workflow. Milestone 4
    (parallel leaf tasks under a concurrency group) enters when a real task tree has more than one
    ready leaf. A durable waiter (SFN or durable functions) re-enters ONLY if a falsifier in step 14
    fires. None of these is scheduled; each is contingent.

context:
  - >-
    WHY THE SPIKE WAS RETIRED, stated once so the Decision can be short. The two-arm comparison could
    not discriminate, for a reason neither arm's design revealed: an agent's real state is a git
    working tree plus a transcript, not a 256KB checkpoint blob. Both AWS arms hit a 256KB cap
    (durable-functions checkpoints and Step Functions state alike) and were therefore forced to
    offload the real state to S3 and hand-build the same workspace layer. What remained to compare was
    replay of control-flow position, worth roughly one duplicated tool call -- and even that number was
    decided by the shared loop's per-iteration cursor rather than by either substrate.
  - >-
    THE FRAME THAT WAS MISSING FOR THREE RE-PLANS. Every version of this question was asked as "which
    AWS service hosts the loop". The load-bearing question was "which substrate hands you the working
    tree for free". Exactly one option in the constraint set does: a GitHub Actions runner, with the
    repo already checked out, no VPC, no standing cost, and native GitHub integration because it is
    GitHub. The tell that the earlier design was inverted: Actions had already been proposed as the
    OVERFLOW route, and a design whose fallback strictly dominates its primary is upside down.
  - >-
    THE DURABLE-SUSPENSION CONCERN, AND WHY IT IS NOT A STRUCTURAL GAP. The operator's sharpest
    objection was that a workflow cannot suspend durably, await an external event mid-run, loop, or
    resume past six hours. That is all true of a single workflow RUN. It is not true of the harness,
    because this platform already implements suspension as checkpoint-and-relaunch at the transcript
    level -- subscribe_pr_activity, the CI-green comment wake, and the merge-conflict wake, with the
    standing rule to end the turn rather than busy-wait. An agent's waits are event-shaped, not
    process-shaped, and GitHub fires native triggers on exactly those events. What is genuinely unknown
    is not whether resume works but what it COSTS and which races it opens, which is milestone 2.
  - >-
    WHAT THE OPERATOR'S OBJECTIONS CHANGED. Four facts moved the design: concurrency is capped per
    ACCOUNT not per repository (so the pool does not scale with a multi-product platform); there is no
    job priority, only FIFO; free minutes are contingent on the repo being public; and putting the
    executor on Actions collapses CI, execution and deploy into one failure domain. The first three are
    answered by the control plane being vendor-neutral from milestone 1 plus a written Decision clause
    -- not by adding AWS compute. The fourth is weaker than it appears: during a GitHub outage an agent
    running on AWS cannot push, test, review or merge, so it is a brain with no hands. What must survive
    an outage is STATE, which is exactly what the journal seam protects.
  - >-
    A CORRECTION CARRIED FORWARD RATHER THAN QUIETLY DROPPED. An earlier version of this design offered
    Step Functions MaxConcurrency as the answer to the concurrency cap. That was wrong: MaxConcurrency
    bounds SFN's dispatch rate, but dispatched jobs still contend FIFO with CI in the shared
    per-account runner pool. The lever that actually protects CI is a GitHub-side concurrency group,
    which is why one appears in the workflow scope row and is asserted by step 3 rather than left to
    the implementer.
  - >-
    HOW THIS PLAN WAS AUTHORED, because the provenance bears on how it should be read. It was written
    by the overseer directly rather than by a dispatched author, at the operator's instruction, after
    two Fable consults -- the second of which was reopened with the operator's counter-arguments and
    partially conceded. It has NOT yet been through the three-lens critique. Treat every judgment here
    as unreviewed until that lands.

pre_implementation_checklist:
  - "Confirm the CD.21 OIDC role can write the two new tables; if not, that grant is the one out-of-band change."
  - "Confirm CLAUDE_CODE_OAUTH_TOKEN is readable from a workflow other than claude.yml."
  - "Read .github/workflows/claude.yml's `if:` block before writing the new trigger -- it is the content-gated shape to avoid."
  - "Confirm Decision 173 is still the next free number at authoring time (main moves)."
  - "Confirm no scripts/harness/ package exists yet, so the Decision 67 frozen executor is untouched."

execution_steps:
  - "Write docs/contracts/harness-task-model.yaml FIRST -- both grains, both write modes, ULID at the boundary, parent_task_id, partitioning, claim/lease and sequence semantics. No loop code before this file exists."
  - "Create the two warehouse tables per the contract, with the writer path the journal client will use."
  - "Write scripts/harness/task_tree.py and its test; prove the depth-2 tree round-trips before anything reads it."
  - "Write scripts/harness/journal.py with claim/lease and the sequence check; write both race tests and watch them fail first."
  - "Write scripts/harness/checkpoint.py storing refs, not payloads; prove size-independence with the 10x transcript case."
  - "Write scripts/harness/loop.py as checkpoint-in/checkpoint-out, importing no substrate SDK."
  - "Write scripts/harness/cli.py; exit non-zero on a lost claim."
  - "Write .github/workflows/harness-task.yml: identity gate, concurrency group, timeout-minutes, OIDC role, 1-hour prompt cache TTL."
  - "Write tests/harness/test_workflow_gating.py and test_no_orchestration_state_leak.py as CLASS sweeps, not site checks."
  - "Author docs/plans/reports/harness-skeleton-findings.yaml with the not-tested register and the pre-registered falsifiers BEFORE running M2, so thresholds cannot be set after seeing the numbers."
  - "Write Decision 173 with both clauses; verify the byte count against the 6,144 per-entry cap."
  - "Update ROADMAP-PLATFORM.yaml: T4.1/T4.2 answered by Decision 173; CD.43 explicitly NOT closed."
  - "Register the single graduated row (harness-workflow-identity-gate) in the verification registry."
  - "Run the full validate tier (VP step 11) before commit, per handoff_policy."
  - "Deploy M1 and run VP step 12 end-to-end; read the result back from the journal, not the workflow log."
  - "Run M2 (VP step 13): force a mid-task kill, relaunch, confirm exactly two attempts against one task_id."
  - "Record the resume tax and judge every falsifier (VP step 14). A fired falsifier is a result to write down, not a failure to fix."

rollback: >-
  Every artifact in this plan is additive and independently removable: delete scripts/harness/,
  tests/harness/, .github/workflows/harness-task.yml, docs/contracts/harness-task-model.yaml and
  docs/plans/reports/harness-skeleton-findings.yaml, drop the single registry row, and revert the two
  bookkeeping edits. NOTHING here is count-gated or otherwise pinned in place by a standing check --
  the one graduated row asserts the workflow's identity gate, so removing the workflow and the row
  together is coherent and leaves main green. The two warehouse tables are the only durable residue;
  they are append-only and SCD2 respectively, so they are dropped rather than mutated, and no other
  table references them. Decision 173 is NOT rolled back even if the skeleton is abandoned -- its
  clause 1 records why the AWS spike was retired, which stays true regardless, and clause 2 records
  the publicness dependency, which stays true regardless. If the harness is abandoned, supersede
  Decision 173 with a new entry rather than deleting it.
