rollback: >-
  Both halves are additive and independently revertible. Reverting scripts/executor/acceptance_lint.py
  and the one-line ops_data_portal.py call site restores the current lint behaviour exactly (the new
  arm is off by default, so none of the five callers depends on it). Removing the hygiene check
  module plus its _manifest.py Entry, taxonomy row and mirror test unregisters the alarm with no
  residue. The ops.yaml semantics edit reverts as text, and because get_rec_write_guidance() only
  projects it, no code change has to be unwound alongside. No infrastructure, no data migration, no
  schema change.
