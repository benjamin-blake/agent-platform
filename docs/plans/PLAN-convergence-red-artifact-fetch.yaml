execution_steps:
  - >-
    Part 1a -- scripts/ci/ducklake_artifacts.py: add fetch_reviewed(names, artifact_sha, bucket,
    region, packages_dir, s3_client) that, for each name in DUCKLAKE_ARTIFACT_NAMES, downloads
    lambda-packages/<artifact_sha>/<name> into packages_dir and raises DucklakeArtifactError on any
    fetch failure (mirroring the existing assert path's fail-closed wording), then server-side
    copy_object's each per-sha object onto its fixed key lambda-packages/<name>. Do NOT rewrite the
    per-sha key -- it is the immutable reviewed reference, and a self-copy would move ~183 MB for no
    gain. Print DUCKLAKE_FETCH_OK on success so VP13 can attribute a green record to this route.
    Extend main() with --mode fetch. Keep s3_client injectable.
  - >-
    Part 1b -- tests/test_ducklake_artifacts.py: add test_fetch_set_equals_assert_set,
    test_fetch_reviewed_fails_closed_on_missing_object, a dual-write assertion, and a test that the
    fetch path never invokes build_ducklake_only.
  - >-
    Part 1c -- .github/actions/build-ducklake-artifacts/action.yml: add mode 'fetch' that calls the
    new CLI path with --skip-build; keep the unknown-mode error branch exhaustive.
  - >-
    Part 1d -- .github/workflows/terraform-apply-sandbox.yml: switch the gated-apply job's build step
    to mode:fetch. Leave the apply-sandbox push job on mode:assert.
  - >-
    Part 1e -- .github/workflows/reconcile.yml, the load-bearing step. In BOTH apply-reconcile and
    gated-apply-reconcile: (i) add a second actions/checkout@v7 pinned to the dispatch ref with
    path: .dispatch-tooling, placed AFTER the existing RED_SHA root checkout -- a root-path checkout
    cleans $GITHUB_WORKSPACE, so a side-checkout placed before it is wiped; (ii) reference the
    composite action as ./.dispatch-tooling/.github/actions/build-ducklake-artifacts, since `uses:
    ./...` resolves from the checked-out workspace, not the workflow ref; (iii) ALSO set the
    action's working-directory input to .dispatch-tooling -- the composite body runs `python3 -m
    scripts.ci.ducklake_artifacts` under that directory, so leaving it at the default "." would
    resolve the OLD RED_SHA module, which has no fetch mode and would die on unrecognized
    arguments. This third point is what makes Part 1 actually reach the stuck episode; without it
    the plan's headline claim fails. Consequence to state in the workflow comment: lambda-packages/
    lands under .dispatch-tooling/, NOT at the workspace root. That is safe because the fetch path's
    load-bearing output is the fixed-key S3 object, and every DuckLake function and layer carries
    ignore_changes = [source_code_hash] (ducklake_lambdas.tf:74,94,302,347), so a verbatim
    saved-plan apply never re-evaluates filemd5 against the local tree. (iv) Set mode:fetch.
    (v) NARROW the file header: replace the blanket "tooling runs at the dispatch ref" claim with
    the truth -- only the artifact-fetch step does; guard.py, review_verdict.py, fetch-saved-plan,
    materialise-tfvars, terraform-init-retry and write-convergence-record still resolve from RED_SHA.
  - >-
    Part 2 -- scripts/build_lambda_config.py: exact-pin the five floor-pinned DUCKLAKE_DEPS entries
    at the versions the reviewed layer carries; keep the existing explanatory comments. Add
    test_ducklake_deps_all_exact_pinned to tests/test_build_lambda_config.py.
  - >-
    Part 3a -- .github/actions/write-convergence-record/action.yml: add the pre-apply-failure input
    (default "false") and a branch, placed after the routed branch and before the STARVED branch,
    that merges a non-status infra_error marker (routed_at-style timestamp, run_url, commit_sha,
    failed_step) with status read-modify-written unchanged and a read-back verify asserting status
    did not move.
  - >-
    Part 3b -- wire pre-apply-failure at all four call sites as the conjunction defined in
    constraints: every apply-step id in the job reports 'skipped' AND a named pre-apply step reports
    'failure'. First ADD the missing step ids this depends on -- apply-sandbox: "Materialise tfvars
    from Secrets Manager", "Terraform init"; gated-apply: "Terraform init", "Fetch saved plan from
    S3" (reconcile's build step already carries id: build_ducklake). Apply-step ids per job:
    apply-sandbox=apply; gated-apply=apply; apply-reconcile=apply AND apply_fresh (two apply steps,
    so BOTH must report skipped); gated-apply-reconcile=apply. apply-reconcile's existing `resolved`
    aggregator step may carry the computation, provided its own expression satisfies both clauses.
  - >-
    Part 3c -- scripts/convergence_health/record.py and assess.py: parse the marker, add infra_error
    to HealthVerdict, floor severity at "low" when present, and keep it out of the red-age
    escalation path. Extend tests/convergence_health/test_assess.py and test_record.py.
  - >-
    Part 3d -- create tests/test_convergence_infra_error_acceptance.py modelled on
    tests/test_terraform_drift_acceptance.py: parse the two workflow files and assert every
    pre-apply-failure expression references only named pre-apply step ids and the input defaults false.
  - >-
    Part 3e -- docs/contracts/environment-taxonomy.md: amend the "Sandbox gated-apply path" block to
    state the three-branch write semantics. Then file Decision 154 in docs/DECISIONS.md using the
    draft in context, re-checking the current max ## Decision header first.
  - Execute Verification Plan -- run each step; loop until pass; on unrecoverable V3 failure stop and RCA (Decision 55)
  - >-
    Merge with a "Resolves: rec-2862, rec-2824, rec-2522" trailer, then hand VP steps 10-12 to the
    operator: dispatch Reconcile, approve the gated apply, confirm green.
  - 'Report: what was implemented, verification results'

