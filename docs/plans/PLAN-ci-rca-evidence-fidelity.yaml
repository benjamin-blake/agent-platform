  - >-
    ARCHITECTURE: this plan CARRIES the failed-check fact rather than re-deriving it. validate.py
    already writes logs/debug/validation-result.json with an exact failed_checks list on the
    failure path (validate.py:615), and ci-rca.yml already downloads a cross-run artifact from the
