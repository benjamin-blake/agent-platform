schema_version: 3
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: "ci-rca-evidence-fidelity"
intent: >-
  Make CI-RCA name the check that actually failed by CARRYING that fact from the producer instead
  of re-deriving it from prose: validate.py already knows which check failed and writes it to
  logs/debug/validation-result.json, but that file is never shipped to the RCA job, so the
  classifier scrapes logs and fabricates. Three post-merge canary failures whose true cause was
  "Coverage below 100%" were each filed as validate_invariants, sending critical recommendations
  at an innocent file.
plan_type: IMPLEMENTATION
verification_tier: V2
plan_path: docs/plans/PLAN-ci-rca-evidence-fidelity.yaml
phase: >-
  ci_rca rec-driven forward fix (Decision 72 / Decision 73). Claims NO tier_item alignment and
  declares no closes_criteria, so the Tier Item Freshness Gate's soft-warn exception genuinely
  applies. The one roadmap edit in scope is data reconciliation, not tier_item advancement:
  T1.13 c9(b) is marked `met` but this plan's production evidence falsifies it, and the Freshness
  Gate's output discipline forbids dropping that silently.
scope:
  - file: scripts/validate.py
    action: Modify
    purpose: >-
      Attribute each appended failure label to the check that appended it, at the single dispatch
      chokepoint _dispatch_check (line 272-278): snapshot len(failed) before the call, and record
      (check_name, label) for each newly appended entry. This is what makes the diagnosis exact
      rather than heuristic -- validate.py already holds the registered check name at dispatch.
  - file: scripts/checks/validation_result.py
    action: Modify
    purpose: >-
      Bump to schema_version 2 and add failed_check_attributions ([{check, label}]) alongside the
      existing failed_checks label list. Additive: failed_checks keeps its current shape and
      meaning, so nothing that reads it breaks.
  - file: .github/workflows/ci.yml
    action: Modify
    purpose: >-
      Upload logs/debug/validation-result.json as an artifact on failure from the main-validate
      job, mirroring the existing pytest-junit and selection-manifest upload steps.
  - file: .github/workflows/main-canary.yml
    action: Modify
    purpose: >-
      Same upload for the canary job -- this is the workflow that produced all three misdiagnosed
      bundles, so without it the primary fix does not reach the failure class that motivated it.
  - file: .github/workflows/ci-rca.yml
    action: Modify
    purpose: >-
      Best-effort download of the failing run's own validation-result artifact (same shape as the
      existing "Fetch junit report" step at line 200-213, continue-on-error) and pass it to the
      evidence generator. Absent artifact degrades to the log path, never fails the job.
  - file: scripts/ci_rca/taxonomy.py
    action: Modify
    purpose: >-
      Add the Priority-0 attribution path (consume failed_check_attributions; exact, no string
      matching) ABOVE the existing ladder, and add the completeness-gated refusal that preempts
      BOTH Priority 4 (whole-log substring scan) and Priority 5 (regex fallback) when evidence is
      incomplete and no authoritative source named the check.
  - file: scripts/ci_rca/evidence.py
    action: Modify
    purpose: >-
      Accept the validation-result artifact, thread the retrieval envelope's completeness into
      classification, and route the refusal verdict to the degenerate signature. Minimal delta by
      design -- the file is at 488 SLOC against the 500 ceiling.
  - file: config/ci_rca_taxonomy.yaml
    action: Modify
    purpose: >-
      Extend function_to_category from 38 entries to cover all 93 registered checks (56 currently
      have no category, so Priority 3 returns None and the substring scan fabricates for them),
      and declare the evidence_insufficient failure category. Deliberately NOT added to
      agent_only_categories -- machine-emitted at one call site only.
  - file: scripts/checks/ci_guards/validate_ci_rca_taxonomy.py
    action: Modify
    purpose: >-
      Add a registry-totality assertion (every registry.all_checks() name present in
      function_to_category) -- the same shape as this check's existing workflow_to_tier coverage
      assertion, so it is the same concern, not a new one. Also add evidence_insufficient to the
      hardcoded code-emitted-sentinel set beside "unknown" (line 44).
  - file: scripts/ci_rca/fetch_logs.py
    action: Modify
    purpose: >-
      Replace _run_log's 1-byte-per-read head-only stream (which terminates gh at the cap) with
      CHUNKED reads retaining a bounded head buffer plus a bounded rolling tail buffer, under an
      explicit total-drain byte ceiling and wall-clock bound that replace the removed terminate()
      as the anti-hang mechanism. Keeps the five source fragments pinned by verify_ci_workflow's
      structural guard byte-identical.
  - file: scripts/ci_rca/log_evidence.py
    action: Modify
    purpose: >-
      Add bound_text_windowed (head + elision marker + tail within the SAME max_bytes/max_lines
      budget) and admit "head_tail_window" as a truncation_reason, preserving the
      observed == included + omitted balance invariant and the ci-rca-log-evidence/v2 schema.
  - file: scripts/ci_rca/fingerprint.py
    action: Modify
    purpose: >-
      Add the degenerate deterministic signature for the refusal verdict
      (evidence_insufficient::<truncation_reason>) so truncated-evidence failures dedup onto one
      chain per workflow instead of keying on an arbitrary truncated tail line.
  - file: scripts/verify_ci_workflow.py
    action: Modify
    purpose: >-
      Extend the CI-RCA workflow guards to pin the new upload (ci.yml, main-canary.yml) and
      download (ci-rca.yml) steps, so the artifact path cannot be silently removed -- the same
      false-green protection the existing fetch-step guards provide.
  - file: docs/ROADMAP-PLATFORM.yaml
    action: Modify
    purpose: >-
      Roadmap data reconciliation only. Flip T1.13 c9 from `met` to `open` with a
      [RE-GROUNDED 2026-08-04] note: c9(b) requires "classify_failure must prefer the structured
      failed-step list over the current naive substring scan", and three production bundles prove
      the substring scan still wins. Follows the in-item c10 precedent (met -> open, audit
      CIRCA-01). Also note that c8's "there is zero actions/upload-artifact in the repo today"
      premise is now stale -- two upload steps exist, which is what makes c8's own SECONDARY
      execution-manifest route cheap enough to take here.
  - file: tests/validate/test_failed_check_attribution.py
    action: Create
    purpose: >-
      Cover dispatch-level attribution. A NEW file deliberately: tests/validate/test_tiers.py is
      at 499 SLOC against the 500 ceiling, so adding there would force a Decision 128 budget raise.
  - file: tests/checks/test_validation_result.py
    action: Modify
    purpose: Cover schema_version 2 and the failed_check_attributions field.
  - file: tests/test_ci_rca_taxonomy.py
    action: Modify
    purpose: >-
      Cover the Priority-0 attribution path; replace the vacuous Priority-3 tests (they feed
      synthetic function-name block entries validate.py never emits) with real-label cases; cover
      the refusal against both Priority 4 and Priority 5.
  - file: tests/test_ci_rca_fetch_logs.py
    action: Modify
    purpose: >-
      Rewrite TestStreamingTransport's three terminate-at-cap tests (lines 179-215:
      test_exact_byte_cap_is_complete_but_cap_plus_one_is_truncated,
      test_line_cap_terminates_on_first_byte_of_next_line,
      test_sigterm_ignoring_child_is_killed_after_truncation) for dual-window semantics, and
      repoint the SIGTERM case at the new drain ceiling. Add real-scale dual-window coverage.
  - file: tests/test_ci_rca_log_evidence.py
    action: Modify
    purpose: Cover bound_text_windowed, head_tail_window, and windowed-envelope validation.
  - file: tests/test_ci_rca_fingerprint.py
    action: Modify
    purpose: >-
      Cover the degenerate refusal signature. This is the mirror-rule target for
      scripts/ci_rca/fingerprint.py per map_source_to_test -- NOT
      tests/ci_rca/evidence/test_fingerprint.py, which is a different file.
  - file: tests/ci_rca/evidence/test_generate.py
    action: Modify
    purpose: >-
      Cover artifact consumption and completeness threading in the evidence generator
      (scripts/ci_rca/evidence.py maps to the tests/ci_rca/evidence/ package).
  - file: tests/checks/ci_guards/test_validate_ci_rca_taxonomy.py
    action: Modify
    purpose: >-
      Cover the registry-totality assertion INCLUDING a mutation case proving it fails when a
      registered check has no category, plus the evidence_insufficient sentinel exemption.
  - file: tests/verify_ci_workflow/test_ci_rca_and_canary.py
    action: Modify
    purpose: Cover the new upload/download workflow-step guards.
  - file: tests/fixtures/ci_rca/oversized_validate_log.py
    action: Create
    purpose: >-
      Real-scale fixture GENERATOR (not a committed multi-MB log): synthesises a full-tier
      validate failure log exceeding both DEFAULT_MAX_BYTES and DEFAULT_MAX_LINES from real
      structural elements, terminating in the real "Failed checks:\n  - Coverage below 100%"
      block captured from run 30768605340. Lives in tests/fixtures/ because that package is
      exempt from the no-cross-test-import guard by construction.
bundled_recommendations:
  - rec-2957
  - rec-2958
  - rec-2973
infrastructure_dependencies: []
acceptance_criteria:
  - >-
    validate.py attributes each failure label to the check that appended it, and
    logs/debug/validation-result.json carries schema_version 2 with
    failed_check_attributions=[{"check": "validate_test_coverage", "label": "Coverage below 100%"}]
    on the real failure path.
  - >-
    Given that artifact, classification returns failed_check="validate_test_coverage" from the
    Priority-0 attribution path -- NOT "validate_invariants", the fabricated answer three
    production bundles reported.
  - >-
    Every one of the 93 registered checks resolves to a category in function_to_category, and
    validate_ci_rca_taxonomy FAILS when a registered check is unmapped.
  - >-
    When evidence is incomplete, no validation-result artifact is present, and no authoritative
    source named the check, classification returns failure_category="evidence_insufficient"
    instead of a substring-scan or regex-fallback guess -- verified against BOTH Priority 4 and
    Priority 5 trigger shapes.
  - >-
    The refusal verdict fingerprints on evidence_insufficient::<truncation_reason>: two distinct
    truncated logs sharing a truncation_reason produce the SAME fingerprint (recurrences dedup),
    and differing truncation_reasons produce different fingerprints.
  - >-
    Dual-window retrieval keeps the "Failed checks:" block inside the evidence body for an
    oversized log while staying within DEFAULT_MAX_BYTES and DEFAULT_MAX_LINES, and a child
    process that outruns the drain ceiling is killed rather than drained without bound.
  - >-
    No config/sloc_budgets.yaml entry is raised, scripts/ci_rca/evidence.py stays at or below 500
    SLOC, and tests/validate/test_tiers.py (499/500) is not modified.
  - >-
    verify_ci_workflow's guards pass, covering both the unchanged fetch-step invariants and the
    new upload/download steps.
  - Full-tier `bin/venv-python -m scripts.validate` exits 0 before the implementation PR is opened.
verification_plan:
  - step: 1
    phase: pre-deploy
    action: >-
      Prove attribution is exact at the dispatch chokepoint -- the whole primary fix rests on the
      check name being carried, not inferred.
    command: >-
      bin/venv-python -m pytest tests/validate/test_failed_check_attribution.py -q
    expected: >-
      All pass, including a case where a dispatched check appends a prose label and the recorded
      attribution names the registered check, not the label.
    fix_if: >-
      Attribution empty or mis-keyed -- the len(failed) snapshot is taken outside _dispatch_check,
      so labels appended by scaffolding steps are being credited to the previous check.
    hermetic: false
    graduation: graduate
    graduation_check_id: validate-attributes-label-to-check
  - step: 2
    phase: pre-deploy
    action: >-
      Prove the artifact itself carries the attribution under schema_version 2, on the failure
      path specifically (exit_code=1) -- the success path writes an empty list and would mask a bug.
    command: bin/venv-python -m pytest tests/checks/test_validation_result.py -q
    expected: >-
      All pass, including schema_version == 2 and a failure-path record whose
      failed_check_attributions is non-empty and index-independent of failed_checks.
    fix_if: >-
      schema_version still 1 means the bump was missed; an empty attributions list on the failure
      path means write_completed is being called with the label list only.
    hermetic: false
    graduation: graduate
    graduation_check_id: validation-result-schema-v2-attributions
  - step: 3
    phase: pre-deploy
    action: >-
      THE regression this plan exists to fix: classify from the artifact and prove it names the
      check that actually failed, via the exact path rather than any string matching.
    command: >-
      bin/venv-python -c "import json,tempfile,pathlib; from scripts.ci_rca.taxonomy import
      classify_failure; art={'schema_version':2,'exit_code':1,'failed_checks':['Coverage below
      100%'],'failed_check_attributions':[{'check':'validate_test_coverage','label':'Coverage
      below 100%'}]}; p=pathlib.Path(tempfile.mkdtemp())/'validation-result.json';
      p.write_text(json.dumps(art)); log='  [PASS] validate_invariants: All invariant checks
      passed\n'; cat,check,src=classify_failure(log, validation_result_path=p);
      print(cat,check,src); assert check=='validate_test_coverage', check;
      assert src=='validation_result_attribution', src"
    expected: >-
      Prints "code_regression validate_test_coverage validation_result_attribution" and exits 0.
    fix_if: >-
      check == 'validate_invariants' means the Priority-0 path is wired BELOW the substring scan
      rather than above it -- exactly the pre-fix precedence.
    hermetic: true
    graduation: graduate
    graduation_check_id: ci-rca-names-real-failed-check
  - step: 4
    phase: pre-deploy
    action: >-
      Prove the taxonomy covers the whole registry and that the guard can actually fail. 56 of 93
      checks are currently uncategorised, so a guard that only checks the 38 already present
      would go green while most of the surface stays fabrication-prone.
    command: >-
      bin/venv-python -m pytest tests/checks/ci_guards/test_validate_ci_rca_taxonomy.py -q
    expected: >-
      All pass, including the mutation case that removes a registered check from
      function_to_category and asserts the guard appends a failure.
    fix_if: >-
      The mutation case passes without the guard failing -- totality is being asserted over the
      map's own keys rather than over registry.all_checks().
    hermetic: false
    graduation: graduate
    graduation_check_id: ci-rca-taxonomy-covers-registry
  - step: 5
    phase: pre-deploy
    action: >-
      Independent cross-check of step 4's premise against the live registry, so the assertion
      cannot pass on a stale or partial map.
    command: >-
      bin/venv-python -c "import scripts.validate; from scripts.checks.registry import
      all_checks; from scripts.ci_rca.taxonomy import load_taxonomy;
      missing=sorted(set(all_checks())-set(load_taxonomy().get('function_to_category') or {}));
      print(len(missing), missing[:5]); assert not missing, missing"
    expected: Prints "0 []" and exits 0.
    fix_if: >-
      Non-empty list names the unmapped checks -- add each to function_to_category against an
      already-declared failure category.
    hermetic: true
    graduation: graduate
    graduation_check_id: ci-rca-every-registered-check-categorised
  - step: 6
    phase: pre-deploy
    action: >-
      Prove the refusal preempts BOTH Priority 4 (substring scan) and Priority 5 (regex fallback)
      when evidence is incomplete and no artifact is present. Covering only Priority 4 leaves the
      hole open, since the regex fallback fabricates from a truncated log just as readily.
    command: >-
      bin/venv-python -m pytest tests/test_ci_rca_taxonomy.py -q -k
      "refusal or evidence_insufficient or incomplete or attribution"
    expected: >-
      All selected tests pass, including the substring-trigger shape that produced rec-2958 and a
      log whose only signal is a log_pattern_to_category regex hit.
    fix_if: >-
      A regex-trigger case returns a log_pattern_to_category verdict -- move the refusal gate
      above the pattern loop, not just above the substring scan.
    hermetic: false
    graduation: graduate
    graduation_check_id: ci-rca-refusal-preempts-scan-and-regex
  - step: 7
    phase: pre-deploy
    action: >-
      Prove the refusal fingerprints degenerately, so recurrences dedup onto one chain per
      workflow rather than keying on wherever the byte cap happened to land.
    command: bin/venv-python -m pytest tests/test_ci_rca_fingerprint.py -q
    expected: >-
      All pass, including same-truncation_reason-same-fingerprint and
      different-truncation_reason-different-fingerprint.
    fix_if: >-
      Two truncated logs sharing a truncation_reason produce different fingerprints -- the
      signature is still derived from error_signature_from_log_tail.
    hermetic: false
    graduation: graduate
    graduation_check_id: ci-rca-refusal-degenerate-fingerprint
  - step: 8
    phase: pre-deploy
    action: >-
      Prove evidence_insufficient is emitted from the classifier and is not agent-assignable --
      the safeguard against the near-synonym decay that ruled out naming it "undetermined".
    command: >-
      bash -c 'grep -q "evidence_insufficient" scripts/ci_rca/taxonomy.py &&
      ! bin/venv-python -c "import sys,yaml; sys.exit(0 if \"evidence_insufficient\" in
      (yaml.safe_load(open(\"config/ci_rca_taxonomy.yaml\")).get(\"agent_only_categories\") or [])
      else 1)"'
    expected: Exits 0 -- emitted by the classifier, absent from agent_only_categories.
    fix_if: >-
      Non-zero means either the classifier does not emit it, or it leaked into the
      agent-assignable set and the interchangeable-use risk is reopened.
    hermetic: true
    graduation: graduate
    graduation_check_id: ci-rca-evidence-insufficient-not-agent-assignable
  - step: 9
    phase: pre-deploy
    action: >-
      Prove the fixture is genuinely oversized -- it must exceed BOTH caps, else every downstream
      window assertion is vacuous.
    command: >-
      bin/venv-python -c "from tests.fixtures.ci_rca.oversized_validate_log import build_log;
      from scripts.ci_rca.log_evidence import DEFAULT_MAX_BYTES, DEFAULT_MAX_LINES; t=build_log();
      b=len(t.encode('utf-8')); n=len(t.splitlines()); print(b,n);
      assert b > DEFAULT_MAX_BYTES and n > DEFAULT_MAX_LINES;
      assert 'Failed checks:' in ''.join(t.splitlines(True)[-100:])"
    expected: Prints byte/line counts both above the caps and exits 0.
    fix_if: >-
      Exits non-zero -- the generator is too small, or the summary block is not in the final 100
      lines; scale the synthetic body up and re-anchor the block at the tail.
    hermetic: true
    graduation: graduate
    graduation_check_id: ci-rca-oversized-fixture-exceeds-caps
  - step: 10
    phase: pre-deploy
    action: >-
      Prove dual-window retrieval retains the tail anchor within budget -- the D1 claim, which
      still matters for the workflows that emit no validation-result artifact.
    command: >-
      bin/venv-python -c "from tests.fixtures.ci_rca.oversized_validate_log import build_log;
      from scripts.ci_rca.log_evidence import bound_text_windowed, DEFAULT_MAX_BYTES,
      DEFAULT_MAX_LINES; body,lim=bound_text_windowed(build_log(), DEFAULT_MAX_BYTES,
      DEFAULT_MAX_LINES); assert 'Failed checks:' in body and 'Coverage below 100%' in body;
      assert lim['included_bytes'] <= DEFAULT_MAX_BYTES and lim['included_lines'] <=
      DEFAULT_MAX_LINES; assert lim['truncation_reason'] == 'head_tail_window';
      assert lim['observed_bytes'] == lim['included_bytes'] + lim['omitted_bytes']"
    expected: Exits 0 -- tail anchor present, both budgets respected, balance invariant holds.
    fix_if: >-
      AssertionError on the anchor means the tail window is too small or the elision marker
      displaced it; on the balance invariant means omitted counts do not account for the elided
      middle plus the marker.
    hermetic: true
    graduation: graduate
    graduation_check_id: ci-rca-window-retains-tail-anchor
  - step: 11
    phase: pre-deploy
    action: >-
      Prove the transport change is bounded. Removing terminate() removes the old anti-hang
      mechanism, so the replacement drain ceiling must demonstrably kill a runaway child.
    command: bin/venv-python -m pytest tests/test_ci_rca_fetch_logs.py -q
    expected: >-
      All pass, including the rewritten dual-window cases and the repointed SIGTERM-ignoring
      child case, which must now be killed by the drain ceiling rather than by the cap.
    fix_if: >-
      The SIGTERM case hangs or the test times out -- the drain ceiling is not enforced, or is
      checked only between reads and never fires on a child that produces output slowly.
    hermetic: false
    graduation: graduate
    graduation_check_id: ci-rca-drain-ceiling-kills-runaway-child
  - step: 12
    phase: pre-deploy
    action: >-
      Prove the windowed body still yields a schema-valid ci-rca-log-evidence/v2 envelope -- a
      body the validator rejects strands the pipeline at the workflow's `test -s` guard.
    command: bin/venv-python -m pytest tests/test_ci_rca_log_evidence.py tests/ci_rca/evidence -q
    expected: All pass, including windowed-envelope validation and artifact consumption.
    fix_if: >-
      Failure in _validate_limits means head_tail_window was not admitted to the allowed
      truncation_reason set, or the golden-body assertions were not updated.
    hermetic: false
    graduation: graduate
    graduation_check_id: ci-rca-log-evidence-and-generator-green
  - step: 13
    phase: pre-deploy
    action: >-
      Prove the workflow guards still hold, covering both the unchanged fetch-step invariants and
      the new upload/download steps.
    command: bin/venv-python -m pytest tests/verify_ci_workflow -q
    expected: >-
      All pass. The five pinned fetch_logs.py fragments are evaluated against the real file by
      test_passes_on_real_post_change_step_body; the new upload/download steps are pinned by the
      guards added in this plan.
    fix_if: >-
      "bounded retrieval invariant missing" names the fragment whose text changed -- restore it
      verbatim, or update BOTH scripts/verify_ci_workflow.py and its test in the same commit.
    hermetic: false
    graduation: graduate
    graduation_check_id: ci-rca-workflow-guards-green
  - step: 14
    phase: pre-deploy
    action: >-
      Prove no SLOC budget was raised and the two zero-headroom files were respected
      (Decision 128 decompose-by-default).
    command: >-
      bash -c 'bin/venv-python -m scripts.validate --pre; rc=$?; test $rc -eq 0 || exit 1;
      test -z "$(git diff origin/main -- config/sloc_budgets.yaml | grep -E "^\+[^+]")" || exit 1;
      git diff --name-only origin/main | grep -qx "tests/validate/test_tiers.py" && exit 1 || exit 0'
    expected: >-
      Exits 0 -- validate --pre passed, no budget line was added, and test_tiers.py (499/500) is
      untouched.
    fix_if: >-
      validate --pre non-zero means an SLOC violation; an added budget line means a raise was
      attempted -- decompose per the Decision 80/104/124 facade pattern instead.
    hermetic: false
    graduation: waive
    graduation_waiver_reason: >-
      Composite of a validate.py tier invocation and two git-diff assertions against origin/main;
      the diff halves depend on this branch's transient state, so it is not expressible as a
      standing single-command registry check.
  - step: 15
    phase: pre-deploy
    action: >-
      Pre-handoff full tier (Decision 163). The declared handoff_policy is only meaningful if the
      full tier actually runs before the PR opens.
    command: bin/venv-python -m scripts.validate
    expected: Exit 0 with no failed checks in the Validation Summary.
    fix_if: >-
      Any failed check -- fix forward before opening the PR. Coverage below 100% on the touched
      files is the likeliest failure (Decision 159); add tests rather than a baseline entry unless
      the line is genuinely unreachable.
    hermetic: false
    graduation: not-applicable
  - step: 16
    phase: post-deploy
    action: >-
      After the squash-merge, prove the Resolves: trailer closed all three recs AND stamped
      fixed_by_sha on each -- an unstamped closed head fails closed to REGRESSION on the next
      matching failure (Decision 142).
    command: >-
      bash -c 'bin/venv-python -m scripts.ops_data_portal --sync >/dev/null && bin/venv-python -c
      "import json,pathlib; rows=[json.loads(l) for l in
      pathlib.Path(\"logs/.recommendations-log.jsonl\").read_text().splitlines() if l.strip()];
      ids={\"rec-2957\",\"rec-2958\",\"rec-2973\"};
      sel={r[\"id\"]:r for r in rows if r.get(\"id\") in ids};
      assert all(sel[i][\"status\"]==\"closed\" for i in ids), {i:sel[i][\"status\"] for i in ids};
      assert all(json.loads(sel[i][\"context_v2_json\"] or \"{}\").get(\"fixed_by_sha\") for i in ids)"'
    expected: All three recs closed with a non-empty fixed_by_sha in context_v2_json.
    fix_if: >-
      status still open -- the Resolves: trailer was malformed or rec-autoclose.yml did not run.
      Closed but no fixed_by_sha -- the rec was closed outside the trailer path, so re-stamp via
      stamp_fixed_by_sha rather than leaving the false-REGRESSION trap armed.
    graduation: not-applicable
constraints:
  - >-
    The D1 transport change REMOVES the existing bound, and must replace it. _run_log currently
    reads stdout one byte per read() and process.terminate()s at the cap; draining a multi-MB log
    that way inside a timeout-minutes:20 job is a latency regression, and dropping terminate()
    removes the hang bound. Required: chunked reads, an explicit total-drain byte ceiling AND
    wall-clock bound, and the three terminate-at-cap tests at tests/test_ci_rca_fetch_logs.py:179-215
    rewritten rather than deleted. Do NOT describe this as "only the window shape changes".
  - >-
    Evidence stays BOUNDED in the emitted body. Do not raise DEFAULT_MAX_BYTES or
    DEFAULT_MAX_LINES -- the body bound is deliberate (Decision 72 provenance, rec-2117/2118/2718).
    This knowingly leaves BOTH bundled fetcher recs' suggested acceptance oracles unsatisfied:
    rec-2973 expects a MiB-scale DEFAULT_MAX_BYTES constant, and rec-2957 expects a
