    AST-based drift guard; that was the wrong primitive and is deliberately abandoned.
  - >-
    Why attribution and not just the artifact: validation-result.json stores LABELS
    ("Coverage below 100%"), not check names, so the artifact alone would still need a label map.
    Dispatch runs through one chokepoint (_dispatch_check, validate.py:272-278), so attributing
    each appended label to its check is ~4 lines and makes the mapping exact and drift-proof.
  - >-
    Two independent defects were required to produce the fabrication, verified empirically:
    classify_failure over the real "Failed checks:" block alone returns
    ('unknown','unknown','taxonomy_fallback'), and over head+tail STILL returns
    ('code_regression','validate_invariants','function_to_category'). Widening the retrieval
    window alone therefore does NOT fix the symptom.
  - >-
    Priority 3 (_classify_via_failed_checks_block) has never fired in production: it maps block
    entries through function_to_category, keyed on validate_* FUNCTION names, but all 96 checks
    append human LABELS. Its existing unit tests pass only because they feed synthetic
    function-name entries validate.py never emits -- a vacuous test, which is why step 4
    mutation-proves the new guard can fail.
  - >-
    Measured coverage gap: 93 registered checks, 38 function_to_category entries, 56 checks with
    no category at all. Any fix asserting only label-map totality would go green while ~60% of the
    check surface stayed fabrication-prone -- hence the registry-totality assertion in step 5.
  - >-
    Decision 142 fingerprint fork, ACKNOWLEDGED AND INTENTIONAL: compute_fingerprint_v2 takes
    failure_category and error_signature, and both change here -- the category via the new
    classification paths, and the signature because error_signature_from_log_tail keys on
    lines[-1] of the retrieved body, which moves from a mid-pytest progress marker to the real
    tail. Open non-pytest ci_rca chains therefore re-key one-way and are orphaned. This mirrors
    the deliberate v1->v2 _V2_SALT disjointness precedent, which likewise did not remap historical
    records. Accepted, not incidental.
  - >-
    The refusal verdict deliberately participates in fingerprint identity, but via the degenerate
    evidence_insufficient::<truncation_reason> form. Inheriting error_signature_from_log_tail
    would key identity on wherever the byte cap landed -- fabricating IDENTITY instead of
    CATEGORY, the same bug one layer down. Collapsing all truncated-evidence failures onto one
    chain per workflow is correct: the honest claim is "cause unidentifiable", and the actionable
    defect is the evidence pipeline.
  - >-
    Category strings are frozen once hashed, so a later rename orphans every historical chain and
    breaks closed-head detection. This is why a deliberately vague catch-all ("other") was
    rejected in favour of naming the cause now.
  - >-
    T1.13 relationship: this plan claims NO tier_item alignment and declares no closes_criteria,
