rollback: >-
  Revert the squash-merge commit. The dual-window change is behaviour-only inside _run_log and
  bound_text_windowed with no persisted state, and the ci-rca-log-evidence/v2 envelope stays
  backward-compatible (head_tail_window is an additive truncation_reason), so a revert restores
  the prior retrieval shape without stranding envelopes. Two caveats: fingerprints computed while
