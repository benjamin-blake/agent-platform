rollback: >-
  Revert the squash-merge commit. The artifact path is additive (uploads are new steps; the
  download is continue-on-error; failed_checks keeps its shape and schema_version 2 is a superset),
  and the ci-rca-log-evidence/v2 envelope stays backward-compatible (head_tail_window is an
  additive truncation_reason), so a revert restores prior behaviour without stranding envelopes or
  artifacts. Three caveats: fingerprints computed while the change was live do not revert -- those
  chains stay re-keyed either way; any rec closed by the Resolves: trailer must be reopened via the
