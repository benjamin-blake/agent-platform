schema_version: 4
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: "decompose-test-plan-document"
intent: >-
  Decompose tests/test_plan_document.py (495/500 SLOC, unregistered) into its mirror-convention
  concern-split test package tests/roadmap/plan_document/, so PLAN-plan-resolution-content-keyed
  has headroom to add coverage for a new PlanDocument field without a budget raise, and repoint
  every graduated verification-registry row left dangling by this and four prior test moves.
plan_type: IMPLEMENTATION
verification_tier: V2
plan_path: docs/plans/PLAN-decompose-test-plan-document.yaml
phase: >-
  Platform maintenance -- Decision 128 decompose-by-default test-SLOC debt, off-roster voluntary
  wave (the rec-2709 24-home roster is retired; this file was never on it).
scope:
  - file: scripts/test_coverage_checker.py
    action: Modify
    purpose: >-
      Add "scripts/roadmap/plan_document.py" to _CONCERN_SPLIT_TEST_PACKAGES (the frozenset at
      line 209) so map_source_to_test resolves the source to the test PACKAGE DIRECTORY
      tests/roadmap/plan_document via rule 3 (DIRECT CONCERN-SPLIT, line 352) rather than the
      flat file tests/test_plan_document.py. One line added to the set literal; no logic change.
  - file: tests/test_coverage_checker/test_coverage_checker_map.py
    action: Modify
    purpose: >-
      Add a mirror-test case asserting map_source_to_test(scripts/roadmap/plan_document.py)
      resolves to tests/roadmap/plan_document, following the existing
      test_maps_scripts_sync_ops_to_concern_split_package pattern. This is the red/green
      evidence for the scope row above.
  - file: tests/roadmap/__init__.py
    action: Create
    purpose: >-
      Mirror test package init (Decision 131: every mirror test directory carries an
      __init__.py for prepend import mode). tests/roadmap/ does not exist yet.
  - file: tests/roadmap/plan_document/__init__.py
    action: Create
    purpose: Mirror test package init for the concern-split package itself (Decision 131).
  - file: tests/roadmap/plan_document/test_schema.py
    action: Create
    purpose: >-
      Relocated verbatim: TestPlanDocumentSchema, TestSchemaVersion2, TestSchemaVersion3
      (29 tests, ~182 lines).
  - file: tests/roadmap/plan_document/test_loader_cli.py
    action: Create
    purpose: >-
      Relocated verbatim: TestLoader, TestCli, TestValidateIntegration (11 tests, ~99 lines).
  - file: tests/roadmap/plan_document/test_optional_fields.py
    action: Create
    purpose: >-
      Relocated verbatim: TestClosesCriteria, TestGraduationDisposition,
      TestFallbackReevaluation, TestTestObligations (59 tests, ~353 lines).
  - file: tests/fixtures/plan_document_helpers.py
    action: Create
    purpose: >-
      Home the four shared helpers (_base, _base_v2, _mutate, _mutate_v2) plus the re-rooted
      FIXTURES and REPO_ROOT constants. tests/CLAUDE.md forbids cross-test imports;
      tests/fixtures/ is exempt by construction (names never start with test_). Direct
      precedent: tests/fixtures/ops_writer_helpers.py (rec-2709 Wave 9).
  - file: tests/test_plan_document.py
    action: Delete
    purpose: >-
      Superseded by the package above. Deleted LAST, only after all 99 relocated tests pass in
      their new homes.
  - file: config/agent/verification_registry/registry.yaml
    action: Modify
    purpose: >-
      Repoint 11 graduated rows whose check_spec names a test path that no longer exists (4
      created by this plan's Delete row, 7 pre-existing across four earlier test moves). Rows
      are edited IN PLACE -- check_id stays stable, so no row is added and the file's effective
      line count is materially unchanged. Bundles rec-3076.
  - file: tests/validate/test_driver_seam.py
    action: Modify
    purpose: >-
      IN_SCOPE_PATHS (line 43) carries the literal "tests/test_plan_document.py" from a prior
      plan's scope manifest. Replace it with the three new module paths so a repo-wide live-code
      sweep can assert zero references. Verified behaviourally inert: no registry row carries
      tests/test_plan_document.py as its guard_target, so _in_scope_rows selects nothing
      different either way.
bundled_recommendations:
  - rec-3076
infrastructure_dependencies: []
acceptance_criteria:
  - >-
    map_source_to_test(Path("scripts/roadmap/plan_document.py")) resolves to
    tests/roadmap/plan_document, and check_test_file_exists returns (True, "test package found").
  - >-
    tests/roadmap/plan_document/ collects exactly 99 tests -- the same count
    tests/test_plan_document.py collects on origin/main -- split 29 (test_schema.py) /
    11 (test_loader_cli.py) / 59 (test_optional_fields.py), and all 99 pass.
  - >-
    Every one of the ten relocated classes appears exactly once across the three new modules;
    no class is dropped, duplicated, or renamed.
  - >-
    TestFallbackReevaluation::test_all_historical_plans_still_valid_with_field_absent validates
    against the real docs/plans directory (336+ PLAN-*.yaml files), not an empty glob -- i.e. the
    re-rooted path is proven non-vacuous, not merely green.
  - >-
    config/agent/verification_registry/registry.yaml contains zero references to all six deleted
    test paths, and every repointed node_id both collects AND passes under pytest.
  - >-
    Each new module is under 500 SLOC; config/sloc_budgets.yaml gains no entry, no raised entry,
    and no raise-approved marker (Decision 128 / Decision 165).
  - >-
    config/agent/verification_registry/registry.yaml stays under its 6000 effective-line
    structural budget (config/structural_size_budgets.yaml:184).
  - >-
    A recommendation is filed for ci-rca-close-then-recur-reopen-backstop, whose guarded test
    method exists nowhere in the repo; that row is NOT mechanically repointed.
  - The full validate tier passes end to end.
verification_plan:
  - step: 1
    phase: pre-deploy
    action: >-
      Assert the concern-split registration resolves the source to the test PACKAGE DIRECTORY
      and that the package satisfies check_test_file_exists. Guards the affected_tests.py:275
      consumer too -- a wrong mapping silently drops these tests from the --pre affected set.
    command: 'bin/venv-python -c "from pathlib import Path; from scripts.test_coverage_checker import map_source_to_test, check_test_file_exists; import sys; m=map_source_to_test(Path(''scripts/roadmap/plan_document.py'')); ok,why=check_test_file_exists(Path(''scripts/roadmap/plan_document.py'')); print(m, ok, why); sys.exit(0 if str(m).replace(chr(92),''/'').endswith(''tests/roadmap/plan_document'') and ok else 1)"'
    expected: >-
      Prints a path ending tests/roadmap/plan_document, then True and "test package found";
      exits 0.
    fix_if: >-
      Exits 1 with "missing test package: tests/roadmap/plan_document" -- the entry was added to
      _CONCERN_SPLIT_TEST_PACKAGES before the package directory existed with >=1 test_*.py.
      Create the package first, then re-run. If it still ends tests/test_plan_document.py, the
      set entry is missing or misspelled (it must be the exact repo-relative POSIX string
      "scripts/roadmap/plan_document.py").
    hermetic: true
    graduation: waive
    graduation_waiver_reason: >-
      Kernel-expressible as a command_exit_zero slot, but graduating it would duplicate the
      standing guard this plan already adds -- the new mirror-test case in
      tests/test_coverage_checker/test_coverage_checker_map.py asserts the same mapping and runs
      in the ordinary suite on every PR. A registry row would re-run that same assertion under a
      second identity without adding coverage, while consuming registry lines against the
      Decision 166 6000-line ceiling (434 lines of headroom at plan time).
  - step: 2
    phase: pre-deploy
    action: >-
      Run the coverage-checker map suite. This is the focused red/green evidence for the
      scripts/test_coverage_checker.py test obligation: the new case fails without the
      _CONCERN_SPLIT_TEST_PACKAGES entry and passes with it.
    command: bin/venv-python -m pytest tests/test_coverage_checker/test_coverage_checker_map.py -p no:randomly -q
    expected: All cases pass, including the new plan_document concern-split mapping case.
    fix_if: >-
      The new case failing with a path ending tests/test_plan_document.py means the
      _CONCERN_SPLIT_TEST_PACKAGES entry is missing or misspelled. A failure in a PRE-EXISTING
      case means the entry disturbed an unrelated mapping -- verify plan_audit.py and
      find_plan.py still resolve to their flat homes.
    hermetic: false
    graduation: not-applicable
  - step: 3
    phase: pre-deploy
    action: >-
      Assert the mirror package carries its __init__.py files at BOTH levels (Decision 131) and
      that the three concern modules exist.
    command: 'bin/venv-python -c "import pathlib,sys; need=[''tests/roadmap/__init__.py'',''tests/roadmap/plan_document/__init__.py'',''tests/roadmap/plan_document/test_schema.py'',''tests/roadmap/plan_document/test_loader_cli.py'',''tests/roadmap/plan_document/test_optional_fields.py'']; missing=[p for p in need if not pathlib.Path(p).is_file()]; print(''missing:'',missing); sys.exit(1 if missing else 0)"'
    expected: 'Prints "missing: []" and exits 0.'
    fix_if: >-
      Any path listed. tests/roadmap/ is a NEW directory -- both its own __init__.py and the
      nested plan_document/__init__.py are required; creating only the inner one leaves
      tests.roadmap a namespace package and breaks prepend-import-mode collision-freedom.
    hermetic: true
    graduation: not-applicable
  - step: 4
    phase: pre-deploy
    action: >-
      Run the relocated suite and assert the exact 29 / 11 / 59 split, totalling the 99 tests
      the monolith collected on origin/main. Catches a class silently dropped or duplicated
      during the move.
    command: 'bin/venv-python -m pytest tests/roadmap/plan_document/test_schema.py tests/roadmap/plan_document/test_loader_cli.py tests/roadmap/plan_document/test_optional_fields.py -p no:randomly -q'
    expected: 99 passed, 0 failed, 0 errors.
    fix_if: >-
      Fewer than 99 collected means a class was dropped in the split; more means one was copied
      into two modules. Cross-check per module against the intended grouping (test_schema 29,
      test_loader_cli 11, test_optional_fields 59). Import errors on _base/_mutate mean the
      helper import from tests.fixtures.plan_document_helpers is missing or misaliased.
    hermetic: false
    graduation: waive
    graduation_waiver_reason: >-
      The 99 relocated tests ARE the standing regression guard -- they run in the ordinary suite
      on every PR. A registry test_selector row pointing at the same three modules would restate
      that suite membership rather than guard a distinct behaviour, and the exact-99 assertion is
      a one-shot migration-completeness check tied to this move, not a durable invariant (the
      count legitimately changes the moment PLAN-plan-resolution-content-keyed adds its field
      coverage -- graduating it would hand that plan a spurious failure).
  - step: 5
    phase: pre-deploy
    action: >-
      Prove the re-rooted docs/plans path is NON-VACUOUS. This is the silent-failure guard: from
      two directories deeper the original Path(__file__).parent.parent resolves to tests/roadmap,
      whose docs/plans glob returns [], so validate_paths([]) returns no failures and the
      assertion passes while guarding nothing. Assert the test sees the real corpus.
    command: 'bin/venv-python -c "import sys; from tests.fixtures.plan_document_helpers import REPO_ROOT; from scripts.roadmap.plan_document import validate_paths; paths=sorted((REPO_ROOT/''docs''/''plans'').glob(''PLAN-*.yaml'')); print(''plans discovered:'',len(paths)); failures=validate_paths(paths); print(''failures:'',len(failures)); sys.exit(0 if len(paths)>=300 and not failures else 1)"'
    expected: >-
      Prints a plan count of 336 or more (300 is the deliberately loose floor) and "failures: 0";
      exits 0.
    fix_if: >-
      "plans discovered: 0" means REPO_ROOT is mis-rooted -- from
      tests/fixtures/plan_document_helpers.py the repo root is Path(__file__).resolve().parents[2].
      Do NOT satisfy this step by lowering the floor; a zero-length glob is precisely the vacuous
      pass this step exists to catch.
    hermetic: true
    graduation: not-applicable
  - step: 6
    phase: pre-deploy
    action: >-
      Stale-reference sweep (Closure Obligation: this plan carries a Delete row). Assert the
      verification registry references NONE of the six deleted test paths -- the one this plan
      deletes plus the five already dangling.
    command: 'bin/venv-python -c "import pathlib,sys; t=pathlib.Path(''config/agent/verification_registry/registry.yaml'').read_text(encoding=''utf-8''); dead=[''tests/test_plan_document.py'',''tests/test_ci_rca_taxonomy.py'',''tests/checks/test_validate_deploy_channel_conformance.py'',''tests/checks/test_validate_prose_allowlist.py'',''tests/test_ci_rca_evidence.py'']; hits={d:t.count(d) for d in dead}; print(hits); sys.exit(0 if not any(hits.values()) else 1)"'
    expected: >-
      All five counts 0; exits 0. (Baseline before the fix: tests/test_plan_document.py 4,
      tests/test_ci_rca_taxonomy.py 5, the others 1 each.)
    fix_if: >-
      Any non-zero count names a row still pointing at a deleted file. Note
      tests/test_ci_rca_evidence.py must not be confused with the live
      tests/test_ci_rca_evidence_ast.py / _input.py -- use exact-string counting, and beware that
      substring counting makes tests/test_ops_data_portal.py unusable here (it is a prefix of the
      live tests/test_ops_data_portal_decisions.py), which is why that path is verified by
      step 7 instead.
    hermetic: true
    graduation: waive
    graduation_waiver_reason: >-
      Kernel-expressible as a grep_count slot (count 0), but this asserts the absence of six
      specific historical strings -- a one-shot migration-completeness check on this session's
      transient repo state, not a durable behavioural invariant. The general, durable form of
      this guard (re-prove rows whose target moved) is exactly the systemic gap already tracked
      by rec-3119; graduating this narrow six-string variant would bank a check that goes stale
      the next time a test file legitimately moves.
  - step: 7
    phase: pre-deploy
    action: >-
      Assert EVERY registry check_spec test path resolves on disk. This is the general form of
      step 6 and the actual invariant: parse the registry, extract every node_id, path, and
      pytest command token beginning tests/, and require each file to exist. Covers
      tests/test_ops_data_portal.py, which substring counting cannot check safely.
    command: 'bin/venv-python -c "import yaml,pathlib,sys; d=yaml.safe_load(pathlib.Path(''config/agent/verification_registry/registry.yaml'').read_text(encoding=''utf-8'')); bad=[]; [bad.append((r[''check_id''],t)) for r in d[''entries''] for t in ([ (r.get(''check_spec'') or {}).get(''node_id'','''').split(''::'')[0] ] + [ (r.get(''check_spec'') or {}).get(''path'','''') ] + [ x.split(''::'')[0] for x in ((r.get(''check_spec'') or {}).get(''command'') or []) if isinstance(x,str) and x.startswith(''tests/'') ]) if t and t.startswith(''tests/'') and not pathlib.Path(t).exists()]; print(''dangling:'',bad); sys.exit(1 if bad else 0)"'
    expected: >-
      Prints "dangling: []" and exits 0. Baseline before the fix: 8 rows across 5 paths; after
      the 11 repoints plus the rec filed for the 12th, zero.
    fix_if: >-
      Any (check_id, path) pair printed. If the pair is
      ci-rca-close-then-recur-reopen-backstop, do NOT invent a repoint target -- its guarded
      method test_close_then_recur_backstop_reopens_recently_closed_match_once exists nowhere in
      the repo (the behaviour was superseded by TestCiRcaClosedHeadRegression's closed-head
      semantics). Retire or rec it per step 10; a fabricated target would graduate a guard that
      proves nothing.
    hermetic: true
    graduation: waive
    graduation_waiver_reason: >-
      This IS a durable invariant and the strongest candidate here, but it is not expressible in
      a single canonical primitive slot -- it requires parsing YAML, walking three heterogeneous
      check_spec shapes (node_id, path, command list), and stat-ing each extracted token, which
      is a check module, not a command_exit_zero one-liner. Standing it up properly is precisely
      the deliverable rec-3119 already tracks (a validate_registry_rows_still_pass.py module);
      graduating a shell-quoted one-liner here would pre-empt that design with a fragile
      duplicate.
  - step: 8
    phase: pre-deploy
    action: >-
      Assert every repointed node_id both COLLECTS and PASSES. Decision 132's differential
      admission gate keys on check_id, so in-place repoints are structurally outside it -- this
      step is the compensating evidence, and it deliberately runs the nodes rather than merely
      collecting them.
    command: 'bin/venv-python -m pytest "tests/roadmap/plan_document/test_optional_fields.py::TestTestObligations" "tests/roadmap/plan_document/test_schema.py::TestSchemaVersion3" "tests/roadmap/plan_document/test_schema.py::TestSchemaVersion2::test_v2_phase_pre_merge_rejected" "tests/roadmap/plan_document/test_optional_fields.py::TestGraduationDisposition" "tests/ci_rca/taxonomy/test_load_and_classify.py::TestEnumerateWorkflowNames::test_real_workflows_dir" "tests/ci_rca/taxonomy/test_convergence.py::TestConvergenceFingerprintDistinctness::test_distinct_fingerprints_across_convergence_starved_environment" "tests/ci_rca/evidence/test_fingerprint.py::TestBundleEmissionFanOut::test_single_failing_check_emits_exactly_one_bundle" "tests/checks/ops_governance/test_validate_deploy_channel_conformance.py" "tests/checks/hygiene/test_validate_prose_allowlist.py" -p no:randomly -q'
    expected: All collected and passing; exit 0.
    fix_if: >-
      An "ERROR: not found" names a repoint target that does not exist -- re-locate the class or
      method with grep before editing the row, never guess from the old path. A collected-but-
      failing node means the repoint aimed at a real node that does not actually guard the row's
      stated guard_target behaviour; re-read that row's guard_target and pick the node that does.
    hermetic: false
    graduation: not-applicable
  - step: 9
    phase: pre-deploy
    action: >-
      Assert the SLOC outcome: each new module under 500, the monolith gone, and no budget
      entry or raise taken (Decision 128 decompose-by-default; Decision 165 raise markers).
    command: 'bin/venv-python -c "import pathlib,sys; s=lambda f: len([l for l in pathlib.Path(f).read_text(encoding=''utf-8'').splitlines() if l.strip() and not l.strip().startswith(chr(35))]); mods=[''tests/roadmap/plan_document/test_schema.py'',''tests/roadmap/plan_document/test_loader_cli.py'',''tests/roadmap/plan_document/test_optional_fields.py'',''tests/fixtures/plan_document_helpers.py'']; sizes={m:s(m) for m in mods}; print(sizes); gone=not pathlib.Path(''tests/test_plan_document.py'').exists(); budg=pathlib.Path(''config/sloc_budgets.yaml'').read_text(encoding=''utf-8''); clean=''plan_document'' not in budg; print(''monolith_deleted'',gone,''no_budget_entry'',clean); sys.exit(0 if all(v<500 for v in sizes.values()) and gone and clean else 1)"'
    expected: >-
      All four sizes under 500 (projected ~182 / ~99 / ~353 / small), monolith_deleted True,
      no_budget_entry True; exits 0.
    fix_if: >-
      A module at or above 500 means the split was uneven -- rebalance classes across the three
      modules; do NOT register a budget entry or add a raise-approved marker, which is the
      exact anti-pattern Decision 128 forbids. no_budget_entry False means someone ran
      --update-sloc-budgets; revert that hunk.
    hermetic: true
    graduation: not-applicable
  - step: 10
    phase: pre-deploy
    action: >-
      Assert the registry stays within its structural budget and that the superseded row was
      handled by filing a recommendation rather than a fabricated repoint.
    command: 'bin/venv-python -c "import pathlib,sys,yaml; p=pathlib.Path(''config/agent/verification_registry/registry.yaml''); eff=len([l for l in p.read_text(encoding=''utf-8'').splitlines() if l.strip() and not l.strip().startswith(chr(35))]); cap=yaml.safe_load(pathlib.Path(''config/structural_size_budgets.yaml'').read_text(encoding=''utf-8'')); print(''effective'',eff,''budget 6000''); sys.exit(0 if eff<6000 else 1)"'
    expected: Effective line count under 6000 (5,566 at plan time); exits 0.
    fix_if: >-
      At or above 6000. Do NOT raise the budget in config/structural_size_budgets.yaml --
      Decision 166 point 6 pre-commits the response to archival, never a second raise. Since
      this plan only edits rows in place and adds none, exceeding the cap means rows were
      appended; remove them.
    hermetic: true
    graduation: not-applicable
  - step: 11
    phase: pre-deploy
    action: >-
      Confirm rec-3076 is resolvable -- its acceptance condition holds -- so the Resolves
      trailer closes a genuinely satisfied recommendation.
    command: 'bash -c ''! grep -q "tests/test_ci_rca_taxonomy.py" config/agent/verification_registry/registry.yaml && echo REC_3076_SATISFIED'''
    expected: Prints REC_3076_SATISFIED; exits 0.
    fix_if: >-
      No output means at least one of rec-3076's four rows still names the deleted file
      (node_id, guard_target, check_spec.path, or the syspath-injection command token -- all
      four sites must be repointed, not just the two node_ids the rec text mentions).
    hermetic: true
    graduation: not-applicable
  - step: 12
    phase: pre-deploy
    action: >-
      Run the full validate tier end to end (Decision 163 / validate_handoff_full_tier requires
      a verification_plan step invoking -m scripts.validate WITHOUT --pre). This is the
      authoritative pre-handoff gate and covers validate_test_coverage,
      validate_no_cross_test_imports, validate_sloc_limits, validate_sloc_budget_raises,
      validate_test_count_coupling, and the structural size budgets in one pass.
    command: bin/venv-python -m scripts.validate
    expected: Exit 0, no FAIL lines.
    fix_if: >-
      "missing test package: tests/roadmap/plan_document" -- ordering: create the package before
      registering the entry. A validate_no_cross_test_imports failure means a new module imports
      from another test_* module instead of tests.fixtures.plan_document_helpers. A
      validate_sloc_budget_raises failure means a budget entry or raise marker was added; remove
      it. Fix forward and re-run to completion -- per handoff_policy, do not commit on a timeout.
    hermetic: false
    graduation: not-applicable
test_obligations:
  - source: scripts/test_coverage_checker.py
    behavior: >-
      map_source_to_test resolves scripts/roadmap/plan_document.py to the test PACKAGE DIRECTORY
      tests/roadmap/plan_document (rule 3, direct concern-split) instead of the flat file
      tests/test_plan_document.py, keeping affected_tests.py's mirror-map channel pointed at the
      relocated tests.
    verification_step: 2
    test_selector: tests/test_coverage_checker/test_coverage_checker_map.py
    red_green_expectation: >-
      Red before, green after: without the _CONCERN_SPLIT_TEST_PACKAGES entry the new case
      asserts tests/roadmap/plan_document but the function returns tests/test_plan_document.py,
      so it fails; with the entry it passes.
  - source: config/agent/verification_registry/registry.yaml
    behavior: >-
      Every graduated row's check_spec names a test path that exists and passes, so no row
      survives in name while guarding a deleted premise.
    verification_step: 8
    command: bin/venv-python -m pytest
    waiver_reason: >-
      No red/green is obtainable for this source. Decision 132's differential admission gate
      (_added_entries) keys on check_id and diffs against origin/main, so a row repointed in
      place is structurally invisible to it -- and minting new check_ids to force admission
      would fail the gate's tautology refusal, because the repointed targets do not exist on
      origin/main. Step 8 is the compensating evidence (the repointed nodes must collect AND
      pass, not merely collect) and step 7 asserts the dangling-path count reaches zero. The
      durable fix for modified-row coverage is already tracked as rec-3119.
constraints:
  - >-
    Decision 128 -- decompose by default. Take NO budget raise: add no entry to
    config/sloc_budgets.yaml, raise no existing entry, add no raise-approved marker, and do not
    run --update-sloc-budgets. Every new module stays under 500 SLOC.
  - >-
    Decision 131 -- every mirror test directory carries an __init__.py. Both tests/roadmap/ and
    tests/roadmap/plan_document/ need one; tests/roadmap/ does not exist yet.
  - >-
    tests/CLAUDE.md -- no cross-test imports. The four shared helpers go in
    tests/fixtures/plan_document_helpers.py (exempt by construction), never imported from
    another test_* module. Alias on import so call sites stay byte-identical.
  - >-
    Pure test-file mechanics: relocate the ten classes VERBATIM. No behaviour change, no new
    test cases beyond the single coverage-checker mapping case, no assertion rewrites, no schema
    change to scripts/roadmap/plan_document.py.
  - >-
    Delete tests/test_plan_document.py LAST, after the relocated classes pass in their new
    homes (step 4 before step 9).
  - >-
    Do NOT repoint ci-rca-close-then-recur-reopen-backstop. Its guarded method exists nowhere;
    file a recommendation instead (Decision 55 -- no unilateral judgement repair).
  - >-
    Only modify files listed in the Scope table. Out-of-scope findings become recommendations
    via scripts/ops_data_portal.py, not inline fixes.
  - No rescue agents or workaround loops (Decision 55).
  - >-
    Decision 166 -- if the registry approaches its 6000-line budget, the response is archival,
    never a second raise. This plan edits rows in place and appends none.
context:
  - >-
    "Decision-scout verdict + CITE list (verbatim decision ids): FLAGS_FOUND (123 of 123
