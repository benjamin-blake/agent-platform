schema_version: 4
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: "root-scoped-diff-base"
intent: >-
  Forward-fix rec-3166 (main CI red) by pairing every diff-baseline derivation with the injected
  root it is evaluated against, so a check pointed at a fixture repository can never read the real
  repository's push-context base -- and add a static guard that fails this class at presubmit,
  where the original escape happened.
plan_type: IMPLEMENTATION
verification_tier: V2
plan_path: docs/plans/PLAN-root-scoped-diff-base.yaml
phase: >-
  CI-RCA forward fix (rec-3166, source=ci_rca, priority=critical). No tier_item; ci_rca is a
  soft-warn exception category, so the Tier Item Freshness Gate does not fire.
scope:
  - file: scripts/checks/_common.py
    action: Modify
    purpose: >-
      Widen push_context_base, get_changed_files and get_status_aware_diff to accept
      root: Path | None = None, and run EVERY git subprocess and EVERY (ROOT / path).exists()
      filter inside them against that root (default None -> ROOT, so existing callers are
      byte-identical). The GITHUB_EVENT_NAME / GITHUB_EVENT_BEFORE signal stays job-global.
  - file: scripts/checks/verification/validate_graduation_completeness.py
    action: Modify
    purpose: >-
      Pass root to both primitives, and move the base derivation AND the _plan_pr_leg call below
      the empty-domain early return so a nonexistent injected root is never used as a subprocess
      cwd. Preserve both PASS lines and exactly ONE terminal Decision 170 declaration.
  - file: scripts/checks/verification/validate_vp_replay.py
    action: Modify
    purpose: Pass root to get_changed_files and push_context_base (identical latent leak).
  - file: scripts/checks/verification/validate_handoff_full_tier.py
    action: Modify
    purpose: >-
      Pass root to get_changed_files (latent leak, same class), AND adopt the Decision 170
      declaration this edit obligates (touch-it-fix-it) on both reachable exit paths.
  - file: scripts/checks/decisions/validate_decisions_size.py
    action: Modify
    purpose: >-
      Pass root to the using_default_root-gated get_changed_files call -- a provable no-op there,
      since root is already rebound to _common.ROOT on the only path that reaches it -- so the file
      needs no waiver marker. Adopt the Decision 170 declaration this edit obligates on all five
      reachable exit paths.
  - file: config/check_accounting_baseline.yaml
    action: Modify
    purpose: >-
      Shrink-remove validate_handoff_full_tier and validate_decisions_size now that both declare
      (removal is always permitted; re-adding never is).
  - file: scripts/checks/hygiene/validate_root_scoped_diff_base.py
    action: Create
    purpose: >-
      AST guard over scripts/checks/**/*.py: fail when a function taking a `root` parameter calls
      push_context_base / get_changed_files / get_status_aware_diff without passing that root,
      unless the call line carries a `# root-scoped-ok: <reason>` marker. Declares
      registry.examined()/skipped() on every exit path.
  - file: scripts/checks/hygiene/_manifest.py
    action: Modify
    purpose: Register the new check (bare string literals only, Decision 169).
  - file: config/ci_rca_taxonomy.yaml
    action: Modify
    purpose: >-
      function_to_category row mapping validate_root_scoped_diff_base to code_regression.
  - file: config/agent/verification_registry/registry.yaml
    action: Modify
    purpose: Graduated rows for this plan's `graduate`-disposition pre-deploy steps.
  - file: docs/DECISIONS.md
    action: Modify
    purpose: >-
      Forward-reference amendment to Decision 159 cl.1 recording the ENV-global /
      git-probe-root-scoped split in push_context_base's contract.
  - file: tests/checks/_common/test_push_context_base.py
    action: Modify
    purpose: >-
      Add TestRootScopedProbes: with root=<fixture repo>, both push-context triggers resolve the
      FIXTURE's commits, never the real repo's; default root=None is unchanged.
  - file: tests/checks/_common/test_primitives.py
    action: Modify
    purpose: >-
      Cover the root passthrough in get_changed_files and get_status_aware_diff, including the
      fail-loud behaviour on a nonexistent root.
  - file: tests/checks/verification/test_validate_graduation_completeness.py
    action: Modify
    purpose: >-
      Add the rec-3166 regression tests (both push-context triggers) and de-vacuum
      test_registry_baseline_and_resolution_stay_correct_on_simulated_post_merge_main.
  - file: tests/checks/verification/test_validate_vp_replay.py
    action: Modify
    purpose: Root-scoped base regression coverage.
  - file: tests/checks/verification/test_validate_handoff_full_tier.py
    action: Modify
    purpose: Cover the root passthrough and the new declaration on both exit paths.
  - file: tests/checks/decisions/test_validate_decisions_size.py
    action: Modify
    purpose: Cover the root passthrough and the new declaration on all five exit paths.
  - file: tests/checks/hygiene/test_validate_root_scoped_diff_base.py
    action: Create
    purpose: >-
      Mirror test for the new guard: synthetic-violation negative control, waiver-marker
      suppression, and a live-tree dogfood assertion that the real scripts/checks tree is clean.
  - file: tests/checks/hygiene/test__manifest.py
    action: Modify
    purpose: Manifest mirror coverage for the new Entry.
bundled_recommendations:
  - rec-3166
infrastructure_dependencies: []
acceptance_criteria:
  - >-
    tests/checks/verification/test_validate_graduation_completeness.py::TestPlanPrLeg::test_net_new_plan_with_zero_dispositions_fails
    passes when push_context_base resolves a non-None base -- exercised for BOTH triggers (the
    GITHUB_EVENT_NAME=push env path and the on-main branch + merge-base==HEAD git-state path).
  - >-
    push_context_base, get_changed_files and get_status_aware_diff each accept an optional root and
    run every git subprocess and every path-existence filter against it. Calling them with NO root
    argument -- which is every existing caller in the tree -- produces byte-identical behaviour to
    today. (Scoped deliberately: passing a nonexistent root is a new fail-loud path, see criterion 8.)
  - >-
    No function in scripts/checks/** that accepts a `root` parameter calls push_context_base,
    get_changed_files or get_status_aware_diff without passing that root. The guard's
    `# root-scoped-ok:` suppression marker ships tested but with ZERO in-tree users -- every one of
    the six sweep hits is fixed by passing root, not waived.
  - >-
    validate_root_scoped_diff_base is registered in scripts/checks/hygiene/_manifest.py, carries a
    ci_rca_taxonomy row, declares registry.examined()/skipped() on every reachable exit path, and
    reports zero violations against the live tree.
  - >-
    test_registry_baseline_and_resolution_stay_correct_on_simulated_post_merge_main resolves the
    FIXTURE repo's before_sha as its base (proven by asserting on the derived base, not only on
    failed == []), closing the vacuous pass.
  - >-
    validate_graduation_completeness still composes exactly ONE terminal Decision 170 declaration
    on every path after the reorder, and both legs keep their Decision 132 obligations.
  - >-
    validate_check_accounting reports zero violations against this plan's own changed-file set:
    validate_handoff_full_tier and validate_decisions_size both declare on every reachable exit
    path, and both names are shrink-removed from config/check_accounting_baseline.yaml.
  - >-
    Calling a widened primitive with a nonexistent root raises rather than silently reading the real
    repository -- the pre-fix behaviour was the silent wrong-repo read that caused rec-3166, so
    failing loud here is the intended change (Decision 55), and it is covered by a test.
  - Decision 159 cl.1 carries a forward-reference amendment describing the ENV-global / git-root-scoped split.
  - rec-3166 is closed and no open source=ci_rca recommendation remains.
verification_plan:
  - step: 1
    phase: pre-deploy
    action: >-
      Prove the rec-3166 leak is closed at the primitive and at the failing check, on a NARROW,
      replay-budget-safe node set that discriminates against origin/main.
    command: >-
      bin/venv-python -m pytest
      tests/checks/_common/test_push_context_base.py::TestRootScopedProbes
      tests/checks/verification/test_validate_graduation_completeness.py::TestPlanPrLeg -q
    expected: >-
      Exit 0, well inside validate_vp_replay's 30s PER_STEP_TIMEOUT_SECONDS. Fails at origin/main
      (TestRootScopedProbes does not exist there, so collection errors) -- which is what makes the
      graduated row admissible under validate_verification_registry's differential gate.
    fix_if: >-
      test_net_new_plan_with_zero_dispositions_fails still reports the "merely-modified, zero
      dispositions -- pre-field plan carve-out" SKIP -- the base is still being derived against the
      real repo somewhere on the path.
    hermetic: true
    graduation: graduate
    graduation_check_id: root-scoped-diff-base-regression-suite
  - step: 2
    phase: pre-deploy
    action: >-
      Prove the new guard actually guards -- synthetic violation is caught, a `# root-scoped-ok:`
      marker suppresses it, and the live scripts/checks tree reports zero violations.
    command: bin/venv-python -m pytest tests/checks/hygiene/test_validate_root_scoped_diff_base.py -q
    expected: >-
      Exit 0. Fails at origin/main (the module does not exist there). The negative-control test
      confirms a root-taking function calling a bare primitive is reported; the live-tree test
      confirms the real repository is clean after this plan's fixes.
    fix_if: >-
      Live-tree test reports violations -- a call site was missed; add the root passthrough rather
      than a waiver. Negative control passes vacuously -- the AST matcher is not detecting the call
      shape (attribute vs bare name, or kwarg vs positional root).
    hermetic: true
    graduation: graduate
    graduation_check_id: root-scoped-diff-base-guard-tests
  - step: 3
    phase: pre-deploy
    action: >-
      Run the full regression surface across every touched check, including the two modules
      adopting Decision 170 declarations. Carried as non-hermetic so it is NOT replayed against the
      30s per-step budget (measured 18.08s / 148 tests before this plan's additions).
    command: >-
      bin/venv-python -m pytest tests/checks/_common/
      tests/checks/verification/test_validate_graduation_completeness.py
      tests/checks/verification/test_validate_vp_replay.py
      tests/checks/verification/test_validate_handoff_full_tier.py
      tests/checks/decisions/test_validate_decisions_size.py
      tests/checks/hygiene/ -q
    expected: Exit 0 across all five suites plus the hygiene package.
    fix_if: >-
      A declaration test fails -- an exit path in validate_handoff_full_tier (2 paths) or
      validate_decisions_size (5 paths) still returns without declaring.
    hermetic: false
    graduation: not-applicable
  - step: 4
    phase: pre-deploy
    action: >-
      Confirm the Decision 159 amendment landed and names the split, so the widened contract is
      recorded rather than silently assumed.
    command: grep -q "root-scoped" docs/DECISIONS.md && grep -q "Decision 159" docs/DECISIONS.md
    expected: Exit 0 -- the amendment text is present in DECISIONS.md.
    fix_if: >-
      Missing -- the contract widening shipped undocumented; add the forward-reference amendment
      clause before merging.
    hermetic: true
    graduation: waive
    graduation_waiver_reason: >-
      A one-off governance amendment. Graduating a standing grep on DECISIONS.md prose would
      ossify the wording of a document that is edited every session, guarding text rather than
      behaviour; the behavioural half of this contract is already graduated by steps 1 and 2.
  - step: 5
    phase: pre-deploy
    action: >-
      Run the fast presubmit tier, which now includes the new guard AND the check-accounting
      ratchet evaluated against this plan's own changed-file set.
    command: bin/venv-python -m scripts.validate --pre
    expected: >-
      Exit 0. Specifically, the "Check-accounting declaration ratchet" reports no violations --
      the touch-it-fix-it clause (Decision 170 cl.3) is satisfied for both edited baselined modules.
    fix_if: >-
      The ratchet names validate_handoff_full_tier or validate_decisions_size -- their declarations
      are missing or their baseline entries were not shrink-removed. The new guard fires on an
      unfixed call site. Or the reorder in validate_graduation_completeness broke its
      single-declaration accounting.
    hermetic: false
    graduation: not-applicable
  - step: 6
    phase: pre-deploy
    action: >-
      Run the full presubmit tier to completion before committing (handoff_policy
      full_validation_required_before_commit).
    command: bin/venv-python -m scripts.validate
    expected: Exit 0.
    fix_if: >-
      Any failure -- forward-fix on the branch, never revert PR #924. A timeout is dispositioned as
      blocked, not passed; resume later and rerun full from the start.
    hermetic: false
    graduation: not-applicable
  - step: 7
    phase: post-deploy
    action: Confirm rec-3166 closed through the Resolves trailer rather than being left open.
    command: >-
      bin/venv-python -m scripts.ops_data_portal --sync && grep '"rec-3166"'
      logs/.recommendations-log.jsonl | grep -q '"status": "closed"'
    expected: >-
      Exit 0 -- rec-3166 is closed in the warehouse-derived read cache after the squash merge fires
      rec-autoclose.yml.
    fix_if: >-
      Still open -- the Resolves trailer was missing or malformed in the squash commit body. Close
      it via the documented portal fallback:
      bin/venv-python -m scripts.ops_data_portal --update-rec rec-3166 --status closed --resolution "..."
  - step: 8
    phase: post-deploy
    action: >-
      Confirm main is actually unblocked -- no open source=ci_rca recommendation remains, so the
      next /plan session does not hit the unresolved-ci-rca HARD BLOCK.
    command: >-
      bin/venv-python -m scripts.ops_data_portal --sync && ! grep '"source": "ci_rca"'
      logs/.recommendations-log.jsonl | grep -q '"status": "open"'
    expected: Exit 0 -- zero open ci_rca recs.
    fix_if: >-
      A new ci_rca rec was filed by the post-merge main run -- this fix did not hold. RCA the new
      rec through /plan (Decision 55/72); do not inline-patch.
test_obligations:
  - source: scripts/checks/_common.py
    behavior: >-
      Every diff-base primitive resolves its git probes and path-existence filters against the
      injected root, never the real repository, while defaulting to ROOT when no root is given.
    verification_step: 1
    test_selector: tests/checks/_common/test_push_context_base.py::TestRootScopedProbes
    red_green_expectation: >-
      Red before the change (the fixture-scoped assertions see the real repo's HEAD~1), green
      after.
  - source: scripts/checks/verification/validate_graduation_completeness.py
    behavior: >-
      Net-new plan detection fires against the injected root under both push-context triggers, and
      the check still composes exactly one terminal declaration.
    verification_step: 1
    test_selector: tests/checks/verification/test_validate_graduation_completeness.py::TestPlanPrLeg
    red_green_expectation: >-
      Red before the change (the rec-3166 failure reproduces as the pre-field carve-out SKIP),
      green after.
  - source: scripts/checks/verification/validate_vp_replay.py
    behavior: Content-keyed plan resolution reads its base from the injected root's repository.
    verification_step: 3
    test_selector: tests/checks/verification/test_validate_vp_replay.py
    red_green_expectation: Red before the change under a simulated push context, green after.
  - source: scripts/checks/verification/validate_handoff_full_tier.py
    behavior: >-
      The changed-file set defaults from the injected root's repository, and the check declares an
      examined()/skipped() outcome on both of its reachable exit paths.
    verification_step: 3
    test_selector: tests/checks/verification/test_validate_handoff_full_tier.py
    red_green_expectation: >-
      Red before the change (no declaration is emitted on either path, and the changed-file default
      reads the real repo), green after.
  - source: scripts/checks/decisions/validate_decisions_size.py
    behavior: >-
      The get_changed_files call takes the (already-ROOT-rebound) root explicitly, and the check
      declares an examined()/skipped() outcome on all five reachable exit paths.
    verification_step: 3
    test_selector: tests/checks/decisions/test_validate_decisions_size.py
    red_green_expectation: >-
      Red before the change (no declaration is emitted on any of the five paths), green after.
  - source: scripts/checks/hygiene/validate_root_scoped_diff_base.py
    behavior: >-
      A root-taking function calling a ROOT-pinned diff-base primitive without passing root is
      reported, unless the call line carries a `# root-scoped-ok:` marker.
    verification_step: 2
    test_selector: tests/checks/hygiene/test_validate_root_scoped_diff_base.py
    red_green_expectation: >-
      Red before the module exists (import error), green after; the negative-control test fails if
      the AST matcher stops detecting the call shape.
constraints:
  - No rescue agents or workaround loops (Decision 55). The defect is a SILENT collapse to an empty
    added-plan set; neither the fix nor the guard may add a new silent path. Corollary - a
    nonexistent injected root must RAISE, not degrade quietly to the real repository.
  - Forward-fix only -- never revert PR #924 / commit 7fa00f2 (Decision 72, Decision 73).
  - Decision 104 -- widen the primitives IN PLACE in scripts/checks/_common.py. Never fork a
    root-aware variant, never import bare names; consumers keep the qualified `_common.<name>` form
    so the module stays the single interception point.
  - Decision 148 -- resolve_declared_plans must continue to take `base` as an injected parameter and
    must never call push_context_base() itself. This plan moves the derivation to the call site's
    root, it does not move it into the resolver.
  - Decision 169 -- the new Entry uses bare string literals for name/module/attr; never
    "module:attr", never computed.
  - >-
    Decision 170 -- ALL THREE clauses bind here. (cl.1/cl.2) The new check declares
    registry.examined()/registry.skipped() on every reachable exit path, and
    validate_graduation_completeness must still compose exactly ONE terminal declaration after the
    reorder. (cl.3, touch-it-fix-it) Editing a baselined non-declaring module obligates adopting its
    declaration in the SAME PR -- this plan edits two such modules
    (validate_handoff_full_tier at baseline line 75, validate_decisions_size at line 65), so both
    adopt declarations and both names are shrink-removed from the baseline.
    config/check_accounting_baseline.yaml is shrink-only against a frozen _BASELINE_SEED, so a new
    check can never be grandfathered and a removed name can never be re-added.
  - Decision 165 -- marker grammar is consolidated onto scripts/checks/_marker_guard.py for
    Decision-CITING raise/authorization markers across five named guards. `# root-scoped-ok:` is a
    free-text suppression marker on the `# count-coupling-ok:` precedent
    (validate_test_count_coupling.py:34), NOT an authorization grammar, so it does not belong in
    _marker_guard.py. Do not add it there.
  - Decision 131 -- mirror-rule test placement. scripts/checks/_common.py maps to the
    tests/checks/_common/ package (both test_primitives.py and test_push_context_base.py are valid
    homes); the other scope files map to single mirror files.
  - Decision 128 -- all scope files stay under 500 SLOC (_common.py is 223, the largest check is 235);
    decompose rather than raise, and add no `# raise-approved:` marker.
  - The push-context ENV signal (GITHUB_EVENT_NAME / GITHUB_EVENT_BEFORE) stays job-global -- only the
    git probes and path-existence filters become root-scoped. Do not root-scope the env read.
  - tests/conftest.py::_clear_push_context_env_vars strips GITHUB_EVENT_NAME and GITHUB_EVENT_BEFORE
    for EVERY test. New push-context tests must opt back in via their own monkeypatch.setenv inside
    the test body -- setting them in the shell will not reach the test process.
  - Keep the Decision 159 amendment OUT of that Decision's `**Problem:**` body -- that body is its
    triage_excerpt source. An `> **Amendment ...**` blockquote above the `**Status:**` line leaves
    scripts.decisions_index.build_index() byte-identical, so docs/decisions-index.json needs no edit.
  - Do not assert an exact len() against a growing production collection (tests/CLAUDE.md
    test-count-coupling rule) when asserting on the guard's violation list.
context:
  - >-
    rec-3166 (source=ci_rca, priority=critical, risk=high) is the sole open ci-rca rec and is the
    preflight HARD BLOCK. This plan satisfies Related-Work condition 1 (same file): its Scope
    includes scripts/checks/verification/validate_graduation_completeness.py, the rec's source_file.
  - >-
    Failure: main CI run 32020803735 (job main-validate, full-tier pytest step), head 7fa00f2, is
    RED. Failing test:
    tests/checks/verification/test_validate_graduation_completeness.py::TestPlanPrLeg::test_net_new_plan_with_zero_dispositions_fails.
  - >-
    Mechanism: validate_graduation_completeness.py:267 sets base = push_context_base() or
    "origin/main". push_context_base runs every git probe with cwd=_common.ROOT, so on a post-merge
    main push it returns a REAL outer-repo SHA. That SHA is then passed to
    _added_plan_paths(root=tmp_path, base=<outer sha>), where `git diff --diff-filter=A <outer sha>`
    exits non-zero and the added-set silently collapses to set(). is_net_new goes False and the
    merely-modified carve-out fires. The check had a `root` seam with no paired `base` seam.
  - >-
    Escape: outside push context push_context_base returns None, so the "origin/main" fallback
    engages and the fixture repo's own origin/main ref resolves -- PR CI ran the identical test
    under a benign env and passed. The escape is a tier misplacement of an environment-sensitive
    predicate, which is why the prevention is a STATIC AST guard (env-independent, fires identically
    in --pre and post-merge) rather than another runtime test.
  - >-
    Reproduced in this planning session: forcing push_context_base to return the outer repo's HEAD~1
    reproduces the exact CI stdout line ("SKIP (plan-PR leg): docs/plans/PLAN-gc-net-new.yaml
    (merely-modified, zero dispositions -- pre-field plan carve-out)"). A root-scoped prototype was
    then validated green across all four trigger paths: PR context, push event with a foreign
    GITHUB_EVENT_BEFORE, push event with no BEFORE, and the on-main branch/merge-base probe.
  - >-
    Second defect found while planning:
    TestContentKeyedResolution::test_registry_baseline_and_resolution_stay_correct_on_simulated_post_merge_main
    -- the test PR #924 added to lock down push-awareness -- is itself a VACUOUS PASS. It
    monkeypatches GITHUB_EVENT_BEFORE to the fixture's before_sha, but push_context_base runs
    `git cat-file -e` against the real repo, where that SHA is absent, so it falls through to the
    REAL repo's HEAD~1. The test then passes only because that unusable base makes every `git show`
    fail, yielding an empty baseline in which all rows look new. Independently reproduced by the
    plan-critique gate. Root-scoping fixes it automatically; the plan additionally asserts on the
    derived base so it cannot silently re-vacuum.
  - >-
    AST sweep of scripts/checks/** found 6 call sites in 4 files where a root-taking function calls a
    ROOT-pinned diff-base primitive bare: validate_graduation_completeness:266,267 (the live break),
    validate_vp_replay:226,241 (latent), validate_handoff_full_tier:75 (latent), and
    validate_decisions_size:167 (already safe behind a `using_default_root` conjunct, but fixed by
    passing root anyway -- a provable no-op there, since root is already _common.ROOT on the only
    path that reaches the call). The plan-critique gate reproduced this sweep path-for-path and
    line-for-line, and swept scripts/** OUTSIDE scripts/checks/ finding ZERO further instances.
    Full-closure scope was chosen over a minimal CI unblock by explicit human direction.
  - >-
    Guard-scope residual (disclosed, not fixed): the guard globs scripts/checks/** only.
    scripts/test_coverage_checker.py:466 calls push_context_base() bare and is one of Decision 159's
    three named consumers; it has no `root` parameter today so it is not a violation, but the guard
    would be blind if one were ever added. Widening the glob is a follow-on, not this CI unblock.
  - >-
    Registration obligations verified clean via `bin/venv-python -m scripts.roadmap.plan_obligations`
    against this Scope table (the ci_rca_taxonomy row was added in response to it). Note that
    plan_obligations does NOT model Decision 170's touch-it-fix-it clause -- that gap was caught by
    the plan-critique gate running validate_check_accounting against this plan's own Scope table.
  - >-
    Decision-scout verdict: FLAGS_FOUND (125 of 125 decisions triaged). CITE list (verbatim):
    Decision 135, Decision 148, Decision 132, Decision 169, Decision 104, Decision 55, Decision 72,
    Decision 73, Decision 131, Decision 128, Decision 163. Decision 165 and Decision 170 cl.3 were
    added by the plan-critique gate, which the scout's CITE list had missed.
  - >-
    Scout flag resolutions. (a) Decision 170 WARN -- resolved: the new check declares on every exit
    path, and criteria 6 and 7 cover the single-declaration reorder and the touch-it-fix-it ratchet.
    (b) Decision 159 NOTE -- accepted by the human: the ENV-global / git-root-scoped split widens
    push_context_base's sole-home contract, so docs/DECISIONS.md is in Scope for a forward-reference
    amendment to Decision 159 cl.1. (c) Decision 132 NOTE -- resolved: _plan_pr_leg consumes `base`
    BEFORE the empty-domain early return today, so the reorder moves the leg WITH the base
    derivation and emits both PASS lines directly; the critique gate traced all three resulting
    paths and confirmed no obligation, output line, or declaration is lost. (d) Decision 104 SPIRIT
    WARN -- resolved by widening all THREE primitives (including get_status_aware_diff) so the
    guard's primitive list is uniformly satisfiable.
  - >-
    Decision 135 pt 3 ("contract unchanged for existing callers") is scoped to BEHAVIOUR, not to a
    frozen signature -- a defaulted `root: Path | None = None` keeps every existing call
    byte-identical, so there is no contradiction. Recorded here because both _common.py:56 and
    Decision 159 cl.1 invoke that clause by name.
  - >-
    VP replay budget: the plan-critique gate measured the full regression surface at 18.08s / 148
    tests against validate_vp_replay's 30s PER_STEP_TIMEOUT_SECONDS, before this plan's new git-fixture
    tests. Steps 1 and 2 were therefore narrowed to discriminating node sets and the broad run was
    moved to non-hermetic step 3, so nothing this plan graduates can time out in replay.
