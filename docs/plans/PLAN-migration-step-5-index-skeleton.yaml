  - All five files in scope located and readable
  - Acceptance criteria understood and verifiable

execution_steps:
  - >-
    scripts/decisions_index.py -- in build_index(), move the _build_triage_excerpt() and
    _derive_category_tags() calls and their four resulting keys inside the existing `if is_live`
    branch that already guards `currency`, so live:false rows are built from the eight stable
    keys alone. Keep `live` on every row. Do not change either derivation helper -- their unit
    tests are pure and must keep passing.
  - >-
    scripts/decisions_index.py -- update the module docstring: the `triage_excerpt`,
    `category_tags` and `currency` derivation paragraphs state that all five projected keys are
    live-only, and one sentence records why (decision-scout never reads them for archived rows;
    the index pin grows with every projected field on every row -- the same rationale the
    docstring already gives for excluding `significance`).
  - >-
    Regenerate the artifact: `bin/venv-python -m scripts.decisions_index --write`. Expect
    docs/decisions-index.json to fall from 119,189 to about 107,367 bytes. Never hand-edit it.
  - >-
    tests/test_decisions_index.py -- add TestSkeletonArchiveRows (the class named in
    test_obligations) asserting the archive key set, the absence of all four dropped keys plus
    currency, and the per-row thinness ratio from VP step 1. Extend
    test_entry_shape_is_the_stable_projection_only to a three-way branch (skeleton keys for
    archive, skeleton|four|currency for live). Narrow
    test_category_tags_is_sorted_and_deduped_for_every_entry and
    test_every_entry_carries_a_list_of_strings to live rows -- both iterate every row today and
    would KeyError.
  - >-
    tests/test_decisions_index.py -- set _COMMITTED_INDEX_MAX_BYTES = 112_000 and rewrite
    TestCommittedIndexSizePin's docstring. It must record: the new arithmetic (120 x 796 + 54 x
    289 = 111,126, rounded up to 112,000) with its measured inputs; that 120 is the TARGET while
    132 is the enforced ceiling, that this is deliberate, and the one-entry consequence; that
    the pin is never raised and the response to binding is archival or collapsing entries into
    contracts; and the corrected attributions per the constraints above. Budget it at or under
