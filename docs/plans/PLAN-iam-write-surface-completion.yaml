execution_steps:
  - "terraform/bootstrap/github_ci_apply.tf -- RELOCATION FIRST (it is the enabler): hoist a new local for the reads-policy JSON, declare `resource \"aws_iam_policy\" \"github_ci_apply_reads\"` (name agent-platform-github-ci-apply-reads) carrying the 11 read-only Sids MOVED (not copied) out of github_ci_apply_policy_json, and declare `resource \"aws_iam_role_policy_attachment\" \"github_ci_apply_reads\"` binding it to aws_iam_role.github_ci_apply. Keep everything in this same file."
  - "terraform/bootstrap/github_ci_apply.tf -- add a rec-2793-style `lifecycle { precondition { condition = length(jsonencode(jsondecode(local.<name>))) <= 6144 ... } }` to BOTH managed policy resources (reads + boundary), hoisting the boundary's policy JSON into a local so its precondition can self-reference the rendered document. Leave the inline policy's existing 10,240 B precondition untouched."
  - "terraform/bootstrap/github_ci_apply.tf -- apply every grant change: extend IAMRoleDeleteBounded, LambdaFunctionWrite, CloudWatchLogsWrite, SecretsManagerDuckLakeNeonDSN, OIDCProviderReconcile, GlueCatalog, DynamoDBCounters and LambdaLayerVersionWrite; rescope SSMFeatureFlagsManage to SSMParameterProvisioning at parameter/agent-platform/* with ssm:DeleteParameter; widen SecretsManagerReadOnly's ARNs (in the relocated reads policy) and add the layer prefixes to LambdaRead; add the four new Sids SNSTopicWrite, DataLakeBucketConfigWrite, SecretsManagerMetadataWrite and AthenaWorkgroupDelete; extend the boundary DataPlaneAllow with iam:ListInstanceProfilesForRole, iam:RemoveRoleFromInstanceProfile and iam:UntagOpenIDConnectProvider. Every addition carries a collocated why-comment naming the provider behaviour or rec that motivates it."
  - "terraform/bootstrap/github_ci_apply.tf -- collocate the two records: an HCL comment on the IAMRolesRead Sid stating the retirement ORDERING rule (prune a role's ARN only AFTER its destroy has applied; the read-coverage check stops requiring it the moment the resource leaves terraform/personal, but the destroy's refresh GetRole still needs it), and an HCL comment on DenyIAMEscalation recording the simulate artifact (its four verbs return explicitDeny/implicitDeny ONLY when iam:PermissionsBoundary is omitted from the simulate context -- it is NOT a gap; do not 'fix' it)."
  - "scripts/checks/iam_tf/_read_coverage.py -- add a parser for a named aws_iam_policy resource's Statement array (returning [] when the resource is absent) and MOVE _parse_boundary_dataplane_statement here from _write_coverage, re-exporting it so existing importers keep working."
  - "scripts/checks/iam_tf/validate_ci_refresh_read_coverage.py -- union the inline statements with the reads-policy statements into apply_statements before any downstream assertion; fail loud if the reads policy resource is declared but no aws_iam_role_policy_attachment binds it to the role; wire in the new (b) and (c) sub-checks alongside check_write_coverage."
  - "scripts/checks/iam_tf/_write_companions.py (new) -- design (b): the phase-keyed LIFECYCLE_COMPANIONS table (rows for iam:CreateRole/create, lambda:CreateFunction/create, logs:CreateLogGroup/create+update, and the row that did not exist: iam:DeleteRole/delete -> iam:ListInstanceProfilesForRole + iam:RemoveRoleFromInstanceProfile, why='provider deleteRole() unconditionally calls deleteRoleInstanceProfiles()'), each with marker, optional companion_marker, phase and why; one checker that skips inert rows, asserts each companion at its marker, and for iam: companions ALSO asserts presence in the boundary DataPlaneAllow ceiling. Move check_identity_iam_actions_subset_of_boundary here. Delete the two hard-coded CREATE-only checkers."
