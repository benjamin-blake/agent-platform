rollback: >-
  Code side: revert the PR on main; the checks and the fixture are inert without the HCL, and no
  runtime path consumes them. Live IAM side: the change is additive at the identity layer plus one new
  attached managed policy, so rollback is a second human-gated bootstrap apply that reverts
  github_ci_apply.tf and re-inlines the 11 read Sids -- the relocation is reversible because the reads
  document's statements are byte-identical to the ones removed from the inline policy (the grant SET is
  unchanged by the move, only its container). Do NOT roll back by detaching the reads policy alone:
  that would strip the apply role's entire refresh-read surface and every subsequent `terraform plan`
  would fail AccessDenied before the guard runs. If the post-apply fixture shows an over-grant, prefer
  a forward-fix apply that narrows the offending Sid over a full revert. The convergence record must
  never be hand-edited during any rollback -- only a converged apply may write it green.
