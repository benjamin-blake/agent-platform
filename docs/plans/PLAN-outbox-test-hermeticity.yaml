schema_version: 3
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: "outbox-test-hermeticity"
intent: >-
  Close the test-hermeticity leak that lets the pytest suite write live records into the retired
  logs/.ops-outbox/ops_recommendations/ directory, and give OpsWriter's outbox path a real injection
  seam so the leak class cannot silently recur. Protects the warehouse-as-source-of-truth invariant
  (a retired outbox must stay empty) and removes a recurring per-session triage tax on the
  self-improvement loop.
plan_type: IMPLEMENTATION
verification_tier: V1
plan_path: docs/plans/PLAN-outbox-test-hermeticity.yaml
phase: >-
  Phase Platform -- operational data backbone hygiene (Decision 84 I-4 retired-outbox invariant).
  No product-phase dependency; no tier_item owns this directly.
scope:
  - file: scripts/ops_writer.py
    action: Modify
    purpose: >-
      Add module-level _OUTBOX_BASE constant and route both _write_to_outbox() and drain() through
      it, replacing the hardcoded Path(__file__).parent.parent computation that has no test seam.
      Must be NET-ZERO SLOC (file is at 569 of a 571 budget).
  - file: tests/fixtures/outbox_guard.py
    action: Create
    purpose: >-
      Pure, importable helper holding the retired-table set and the snapshot/diff logic for the
      hermeticity guard, so the logic is unit-testable without importing conftest.
  - file: tests/conftest.py
    action: Modify
    purpose: >-
      Add the autouse hermeticity guard that fails any individual test which writes into the real
      logs/.ops-outbox, and fails loudly on pre-existing retired-table files at session start.
  - file: tests/ops_writer/test_outbox_emit.py
    action: Modify
    purpose: >-
      Repair the three defective tests: the leaking .__func__ call, the two tautological assertions,
      and the failure-swallow test whose Path patch stops being meaningful after the refactor.
  - file: tests/test_outbox_hermeticity_guard.py
    action: Create
    purpose: Unit tests for the tests/fixtures/outbox_guard.py detection logic.
  - file: scripts/checks/ops_governance/validate_outbox_staleness.py
    action: Modify
    purpose: >-
      PHASE 2 (separable). Hard-fail on any file in a retired-outbox dir regardless of age, keeping
      the existing >24h warning-only behaviour for legacy staging dirs.
  - file: scripts/checks/registry.py
    action: Modify
    purpose: >-
      PHASE 2 (separable). Register validate_outbox_staleness in pre_sequence() so the hardened
      check blocks the PR rather than firing post-merge on main.
  - file: tests/checks/ops_governance/test_validate_outbox_staleness.py
    action: Modify
    purpose: PHASE 2 (separable). Cover the retired-vs-legacy split and the pre_sequence registration.
bundled_recommendations:
  - rec-2185
  - rec-2697
  - rec-2894
infrastructure_dependencies: []
acceptance_criteria:
  - >-
    Running the full pytest suite from a clean tree leaves logs/.ops-outbox empty (or absent) --
    this is rec-2894's own acceptance command and currently FAILS with exactly one leaked file.
  - >-
    scripts/ops_writer.py exposes a single module-level _OUTBOX_BASE used by both _write_to_outbox()
    and drain(); no remaining Path(__file__).parent.parent outbox computation exists in the module.
  - >-
    scripts/ops_writer.py SLOC is unchanged at 569 against its existing 571 budget, with no
    raise-approved marker added to config/sloc_budgets.yaml (Decision 128).
  - >-
    tests/ops_writer/test_outbox_emit.py no longer contains the self-writing "Fallback: write
    directly" block or the hand-rolled fake_write_to_outbox duplicate of production logic; both
    tests exercise the real OpsWriter._write_to_outbox against a patched _OUTBOX_BASE.
  - >-
    A test that writes into the real logs/.ops-outbox fails, attributed to that test by name, rather
    than leaking silently.
  - >-
    PHASE 2 only -- validate_outbox_staleness hard-fails on a file in a retired-outbox dir at any
    age, still only warns on a >24h legacy staging file, and is registered in both pre_sequence()
    and full_sequence().
verification_plan:
  - step: 1
    phase: pre-deploy
    action: >-
      Prove the specific leaking test no longer writes to the real outbox (the empirically confirmed
      root cause -- this exact command reproduces the defect on the pre-change tree).
    command: >-
      rm -rf logs/.ops-outbox && bin/venv-python -m pytest tests/ops_writer/test_outbox_emit.py -q &&
      test -z "$(find logs/.ops-outbox -type f 2>/dev/null)"
    expected: pytest exits 0 and the find returns no files, so the test command exits 0.
    fix_if: >-
      A .jsonl file appears under logs/.ops-outbox/ops_recommendations/. Means _write_to_outbox still
      resolves the real repo root -- check that the test patches scripts.ops_writer._OUTBOX_BASE and
      that _write_to_outbox reads the module global at call time rather than capturing it.
    hermetic: true
    graduation: waive
    graduation_waiver_reason: >-
      The autouse conftest hermeticity guard added by this plan IS the permanent in-suite enforcement
      of this exact invariant, running on every test rather than one file. A separate graduated
      verifier row would duplicate it at higher cost and lower coverage.
  - step: 2
    phase: pre-deploy
    action: Prove the guard's detection logic itself is correct via its unit tests.
    command: bin/venv-python -m pytest tests/test_outbox_hermeticity_guard.py -q
    expected: All tests pass, covering new-file detection, the retired-vs-legacy split, and the clean case.
    fix_if: >-
      A failure here means the guard would either miss real leaks or false-positive on legitimate
      legacy staging files. Fix tests/fixtures/outbox_guard.py before wiring conftest.
    hermetic: true
    graduation: not-applicable
  - step: 3
    phase: pre-deploy
    action: >-
      Prove end-to-end that a leaking test actually fails under the guard, by planting a throwaway
      probe test that writes to the real outbox and asserting pytest rejects it.
    command: >-
      printf 'from pathlib import Path\n\n\ndef test_probe_leak():\n    d = Path("logs/.ops-outbox/ops_recommendations")\n    d.mkdir(parents=True, exist_ok=True)\n    (d / "probe.jsonl").write_text("{}")\n'
      > tests/test_zz_outbox_probe.py; bin/venv-python -m pytest tests/test_zz_outbox_probe.py -q; rc=$?;
      rm -f tests/test_zz_outbox_probe.py; rm -rf logs/.ops-outbox; test "$rc" -ne 0
    expected: >-
      pytest exits non-zero (the probe test is failed by the guard), so the final test "$rc" -ne 0
      succeeds and the step exits 0. The probe file and the outbox are removed either way.
    fix_if: >-
      If rc is 0 the guard is not wired into the autouse path -- confirm the fixture in
      tests/conftest.py is @pytest.fixture(autouse=True) and that its check runs in teardown (after
      the yield), not only at setup.
    hermetic: true
    graduation: not-applicable
  - step: 4
    phase: pre-deploy
    action: >-
      Run rec-2894's own acceptance command -- the full suite from a clean tree, asserting the real
      outbox stays empty. This is the authoritative proof for all three bundled recs.
    command: >-
      rm -rf logs/.ops-outbox && bin/venv-python -m pytest tests/ -q &&
      test -z "$(find logs/.ops-outbox -type f 2>/dev/null)"
    expected: >-
      All tests pass (baseline before this change is 7505 passed / 13 skipped in ~12m39s) and the
      outbox is empty. Runtime must stay well inside the Decision 153 forced-run ceiling of 1500s.
    fix_if: >-
      If a test other than the known one fails the guard, that is a second leaker this plan has now
      exposed -- fix it in scope if it is an outbox-path defect, otherwise file a rec (AGENTS.md
      out-of-scope rule) rather than weakening the guard.
    hermetic: true
    graduation: not-applicable
  - step: 5
    phase: pre-deploy
    action: >-
      Prove the ops_writer.py change is net-zero SLOC and did not consume the 2-line budget headroom
      or require a Decision 128 raise.
    command: >-
      bin/venv-python -m scripts.validate --pre 2>&1 | grep -E "ops_writer.py: [0-9]+ SLOC" &&
      git diff origin/main -- config/sloc_budgets.yaml | grep -q "ops_writer" && exit 1 || exit 0
    expected: >-
      The SLOC line reports ops_writer.py at or below 571 (569 expected, unchanged), and
      config/sloc_budgets.yaml carries no diff for ops_writer.py.
    fix_if: >-
      If SLOC rose, do NOT raise the budget. Recover the line by deleting drain()'s local
      outbox_base assignment and referencing _OUTBOX_BASE at both of its use sites. If it still does
      not fit, decompose per Decision 128 rather than adding a raise-approved marker.
    hermetic: true
    graduation: not-applicable
  - step: 6
    phase: pre-deploy
    action: >-
      PHASE 2 only. Prove the hardened check hard-fails on a planted retired-table file at any age
      and still passes on a clean tree.
    command: bin/venv-python -m pytest tests/checks/ops_governance/test_validate_outbox_staleness.py -q
    expected: >-
      Tests pass, covering: a fresh file in ops_recommendations fails; a fresh file in a legacy
      staging dir does not fail; a >24h legacy file warns without failing; a clean tree passes.
    fix_if: >-
      If a legacy staging case now hard-fails, the retired-table set is too broad -- it must exclude
      ops_execution_plans, which AGENTS.md still lists as a live legacy staging path pending T2.26.
    hermetic: true
    graduation: graduate
    graduation_check_id: validate_outbox_staleness_retired_dirs
  - step: 7
    phase: pre-deploy
    action: PHASE 2 only. Prove the hardened check is registered in both presubmit tiers.
    command: >-
      bin/venv-python -c "from scripts.checks.registry import pre_sequence, full_sequence;
      names_pre = {s.name for s in pre_sequence()}; names_full = {s.name for s in full_sequence()};
      assert 'validate_outbox_staleness' in names_pre, 'missing from pre_sequence';
      assert 'validate_outbox_staleness' in names_full, 'missing from full_sequence'; print('registered in both tiers')"
    expected: Prints "registered in both tiers" and exits 0.
    fix_if: >-
      A missing pre_sequence entry means the hardened check only fires post-merge on main, which per
      Decision 73 files a critical ci_rca rec and blocks the planning queue -- the inverse of the
      intended placement. Add the _s(...)/_c(...) entry to pre_sequence().
    hermetic: true
    graduation: not-applicable
  - step: 8
    phase: pre-deploy
    action: Run the authoritative fast-tier presubmit gate over the whole change.
    command: bin/venv-python -m scripts.validate --pre
    expected: >-
      Exit 0. Note per Decision 135 that touching the root tests/conftest.py deterministically forces
      FULL-suite scope, so this run selects ~6930+ tests and takes ~13-20 minutes.
    fix_if: >-
      A budget warning on the forced full run is expected and passes per Decision 153; only a hard
      failure above the 1500s ceiling is a real failure. Any check failure must be fixed forward,
      never by adding --ignore-budget.
    hermetic: true
    graduation: not-applicable
constraints:
  - >-
    scripts/ops_writer.py is at 569 SLOC against a 571 budget, and 571 is ALREADY a raise above the
    500 default. Per Decision 128 the change must be net-zero and must NOT add a raise-approved
    marker to config/sloc_budgets.yaml. Decompose instead if it will not fit.
  - >-
    The retired-outbox hard-fail set is ops_recommendations, ops_decisions, ops_priority_queue plus
    any *_pending dir. It must NOT be taken verbatim from scripts/sync/ops.py's
    _DUCKLAKE_MIGRATED_TABLES, which also contains ops_execution_plans -- AGENTS.md still lists
    execution_plans as a live legacy staging path pending T2.26. Derive the set from that constant
    minus ops_execution_plans so it stays DRY, and cite why in a comment.
  - >-
    The apparent contradiction (sync/ops.py treats ops_execution_plans' outbox as never-drained,
    while AGENTS.md treats it as live legacy staging) is OUT OF SCOPE. File a recommendation via
    scripts.ops_data_portal rather than resolving it inline (AGENTS.md out-of-scope rule).
  - >-
    tests/conftest.py is 299 lines and unregistered in config/sloc_budgets.yaml; the guard must keep
    it under 500 so no budget registration is needed (Decision 130).
  - >-
    Per tests/CLAUDE.md, shared test helpers live in tests/fixtures/ (exempt from the
    cross-test-import guard because its names never start with test_). Do not import the guard logic
    from one test_* module into another.
  - >-
    The guard belongs in the ROOT tests/conftest.py, not a sub-package conftest -- Decision 131 cl.3
    places repo-wide guards there alongside the existing recursion and socket guards.
  - >-
    Per Decision 104, the rewritten tests must not introduce exact-count assertions against a
    curated collection without a "# count-coupling-ok:" waiver.
  - No rescue agents or workaround loops (Decision 55).
  - >-
    Do not weaken or delete the guard to make a failing test pass. A test that legitimately needs an
    outbox must point at tmp_path, never the real tree.
context:
  - >-
    ROOT CAUSE, empirically confirmed this session (not as diagnosed in rec-2894). With
    logs/.ops-outbox deleted, running ONLY
    tests/ops_writer/test_outbox_emit.py::TestOpsWriterOutbox::test_write_to_outbox_directly
    reproduces the exact artifact: logs/.ops-outbox/ops_recommendations/<uuid>.jsonl containing
    {"id": "rec-002", "title": "test"}. A full-suite run (7505 passed, 13 skipped, 759s) produced
    exactly ONE leaked file, so this test is the sole leaker across all 7518 tests.
  - >-
    rec-2894's stated attribution is WRONG and must not be trusted by the implementer. It asserts
    "tests/ops_writer/test_outbox_emit.py itself DOES isolate correctly (uses tmp_path throughout),
    so the culprit is a different test". The culprit is that very file.
  - >-
    MECHANISM. tests/ops_writer/test_outbox_emit.py:78-87 wraps the call in
    patch("scripts.ops_writer.Path") whose side_effect returns real pathlib.Path objects, making the
    patch a no-op, then calls writer._write_to_outbox.__func__(writer, table, entry) to deliberately
    bypass instance-level patching. OpsWriter._write_to_outbox (scripts/ops_writer.py:277) then
    computes Path(__file__).parent.parent / "logs" / ".ops-outbox" / table -- the real repo root.
  - >-
    WHY IT STAYED GREEN. Lines 89-93 ("Fallback: write directly to verify the logic shape") write the
    assertion's target file by hand into tmp_path, so the assertion passes regardless of what the
    production method did. The test provides ZERO coverage of the code it names. Its sibling
    test_s3_failure_writes_to_outbox has the same defect in another shape -- it replaces
    _write_to_outbox with a hand-rolled fake that re-implements production logic, then asserts on the
    fake's output.
  - >-
    WHY NO GUARD CAUGHT IT. OpsWriter has two guards that make outbox writes impossible from a test --
    write() rejects ops_recommendations at line 236 (Decision 81 cl.7 closed boundary) and
    _is_test_env() no-ops everything under PYTEST_CURRENT_TEST (line 194/249) -- but _write_to_outbox
    has NEITHER, and calling it directly bypasses both. The artifacts are gitignored
    (.gitignore:140) so git and CI never see them, and validate_outbox_staleness is warning-only and
    >24h-gated while CI runs on a fresh clone whose files are always minutes old.
  - >-
    THIRD FILING of one defect: rec-2185 (2026-06-11), rec-2697 (2026-07-14), rec-2894 (2026-07-30).
    rec-2697 diagnosed it correctly -- named the file, the payload, and the fix -- and still did not
    land. Three sessions have paid discovery cost.
  - >-
    IMPACT is worse than rec-2894's "preflight triage cost" framing. rec-2697 records the escalation:
    once files pass 24h, OutboxHealthVerifier (scripts/verifiers/outbox_health.py) flips ADVISORY to
    HARD_GATE and fails local FULL validate for reasons unrelated to any code change -- observed with
    8 stale files during the RS-01 session.
  - >-
    Decision 70 angle: rec-002 is one of five hollow bootstrap records physically deleted 2026-05-09.
    The leak re-materialises a purged record id inside an outbox Decision 84 I-4 retired -- the
    resurrection shape AGENTS.md warns about, harmless today only because nothing drains that dir.
  - >-
    SEAM PRECEDENT: scripts/sync/ops.py:40 already uses a module-level _OUTBOX_DIR constant patched
    by tests/sync/ops/test_drain.py. This plan applies the same pattern to ops_writer. Note
    ops_writer currently computes the same path twice -- via Path(__file__) at line 280 and via ROOT
    at line 670 -- so consolidating is also a duplication fix and is what makes net-zero SLOC possible.
  - >-
    GOTCHA: tests/ops_writer/test_outbox_emit.py:154-161 (test_write_to_outbox_failure_is_swallowed)
    relies on patch("scripts.ops_writer.Path", side_effect=Exception). After the refactor
    _write_to_outbox no longer calls the Path() constructor (_OUTBOX_BASE / table uses __truediv__),
    so that test would silently stop exercising the failure path and become a false pass. Re-point it
    at a genuinely unwritable _OUTBOX_BASE -- e.g. a path that is an existing FILE, so
    mkdir(parents=True) raises for real with no mocking.
  - >-
    Decision-scout verdict FLAGS_FOUND (108 of 108 decisions triaged). CITE list, verbatim ids:
    Decision 84 (I-4, governing clause), Decision 104, Decision 135, Decision 153, Decision 131,
    Decision 132, Decision 55. RELATED: Decision 70, Decision 73, Decision 148, Decision 130,
    Decision 81 cl.7.
  - >-
    Scout flag A resolved (Decision 103, WARN, human-approved): Decision 103 forbids closing on a
    semantic verdict (duplicate/superseded) via a direct close, and the Resolves: trailer IS a direct
    close. All three recs therefore close on DETERMINISTIC SATISFACTION -- one fix genuinely
    satisfies all three acceptance commands and the merge is the proof. Each resolution must be
    worded as the landed fix (e.g. "fixed by the _OUTBOX_BASE seam plus the conftest hermeticity
    guard"), NEVER as "duplicate".
  - >-
    Scout flag B resolved (Decision 149, WARN, human-approved): a plain session-start snapshot would
    absorb any already-leaked file into an uncommitted, per-machine baseline -- silent tolerance of
    undisposed divergence. Split instead: pre-existing files in RETIRED-table dirs fail loudly at
    session start (never legitimate); pre-existing files in LEGACY staging dirs may be baselined
    (they can be genuinely pending drain).
  - >-
    Scout flag C (Decision 62, NOTE): validate_outbox_staleness lives in full_sequence() only, so a
    hardened hard-fail would land post-merge on main and, per Decision 73, file a critical ci_rca rec
    that blocks the planning queue. Phase 2 therefore also registers it in pre_sequence(); it is a
    cheap hermetic filesystem walk that fits the fast-tier budget.
  - >-
    PHASE 2 (scope entries 6-8, VP steps 6-7) is SEPARABLE BY DESIGN and was the planning agent's
    judgment call, not an explicit human instruction -- the human approved flags A and B but did not
    rule on it. Phase 1 alone fully fixes the measured defect. Phase 2 adds coverage for
    non-pytest leak sources and encodes Decision 84 I-4 in code rather than prose. Dropping Phase 2
    is a clean excision of those three scope entries and two VP steps; nothing in Phase 1 depends on it.
  - >-
    CI-RCA HARD BLOCK DEFERRAL (required rationale). One unresolved ci-rca rec is open: rec-2882,
    "REGRESSION: github_ci_apply missing iam:ListInstanceProfilesForRole for IAM role destroy"
    (terraform/bootstrap/github_ci_apply.tf, Critical, filed 2026-07-27). It is a Terraform/IAM
    regression with zero file, subsystem, or causal overlap with this test-hermeticity work. The
    human directed on 2026-07-30 that other agents are handling the open CI-RCA recommendations and
    they may be deferred for this plan. Recorded here per the planning skill's HARD BLOCK escape.
  - >-
    Decision 135: modifying the ROOT tests/conftest.py deterministically sets full_suite_forced in
    the selection manifest, forcing FULL-suite scope on this PR's --pre run. Expected, not a defect.
    Per Decision 153 the 300s budget assertion warns-and-passes on a forced run and only hard-fails
    above the 1500s ceiling; the measured full suite is 759s, leaving ample margin.
  - >-
    Main divergence at planning time: origin/main at 4f8c1ab, branch 1 commit behind. The only
    changed files are docs/plans/PLAN-ci-rca-authority-anchor.yaml and
    docs/plans/reports/OVERSEER-github-actions-log-management.yaml -- no overlap with this scope, so
    the Step 11 commit-flow rebase is safe.
  - "gates: decision-scout=FLAGS_FOUND; plan-critique=<verdict> after <N> round(s)"
pre_implementation_checklist:
  - Branch confirmed not on main
  - docs/PROJECT_CONTEXT.md read
  - DECISIONS.md read
  - All files in scope located and readable
  - Acceptance criteria understood and verifiable
  - >-
    Reproduce the defect FIRST so the fix is proven against a live failure -- run "rm -rf
    logs/.ops-outbox && bin/venv-python -m pytest
    tests/ops_writer/test_outbox_emit.py::TestOpsWriterOutbox::test_write_to_outbox_directly -q" and
    confirm logs/.ops-outbox/ops_recommendations/<uuid>.jsonl appears, then delete it.
  - >-
    Confirm the SLOC starting point with "bin/venv-python -m scripts.validate --pre 2>&1 | grep
    ops_writer" -- expect "569 SLOC below budget 571", i.e. 2 lines of headroom.
execution_steps:
  - >-
    scripts/ops_writer.py -- add a module-level constant _OUTBOX_BASE = ROOT / "logs" / ".ops-outbox"
    beside ROOT (line 27). In _write_to_outbox (line ~280) replace the
    Path(__file__).parent.parent-derived path with "outbox_dir = _OUTBOX_BASE / table", reading the
    module global at call time so tests can patch it. In drain() (line ~670) DELETE the local
    "outbox_base = ROOT / ..." assignment and reference _OUTBOX_BASE directly at both of its use
    sites -- this deletion is what keeps the change net-zero SLOC.
  - >-
    tests/fixtures/outbox_guard.py -- create the pure helper: RETIRED_OUTBOX_TABLES (derived from
    scripts.sync.ops._DUCKLAKE_MIGRATED_TABLES minus ops_execution_plans, with a comment citing why),
    a predicate for whether a directory name is a retired dir (including any *_pending suffix), a
    snapshot(base) returning the set of files, and a diff function returning newly-added files. Keep
    it import-cheap -- importing the constant from scripts.sync.ops costs ~60ms and pulls only stdlib.
  - >-
    tests/conftest.py -- add an autouse fixture using that helper. At session start, fail loudly if
    any file already exists in a RETIRED dir (Decision 149 -- do not baseline it away); files in
    legacy staging dirs may be baselined. Per test, snapshot before and compare in teardown (after
    the yield); on a new file, delete it so the tree is left clean and then fail the test naming both
    the test id and the offending path. Keep the file under 500 lines (Decision 130).
  - >-
    tests/ops_writer/test_outbox_emit.py -- rewrite test_write_to_outbox_directly to patch
    scripts.ops_writer._OUTBOX_BASE to tmp_path and call writer._write_to_outbox(table, entry)
    normally (no .__func__, no Path patch), asserting the file landed under tmp_path with the right
    payload; DELETE the "Fallback: write directly" block entirely. Rewrite
    test_s3_failure_writes_to_outbox to drop fake_write_to_outbox and let the real method run against
    the patched _OUTBOX_BASE. Re-point test_write_to_outbox_failure_is_swallowed at a genuinely
    unwritable _OUTBOX_BASE (an existing file, so mkdir raises for real) instead of patching Path.
  - >-
    tests/test_outbox_hermeticity_guard.py -- create unit tests for the helper: a new file in a
    retired dir is detected; a new file in a legacy dir is detected; a pre-existing legacy file is NOT
    reported as new; a pre-existing retired file trips the session-start check; a clean tree is clean.
  - >-
    PHASE 2 (separable -- skip this step and the next two if Phase 2 is dropped).
    scripts/checks/ops_governance/validate_outbox_staleness.py -- iterate table dirs; any file in a
    retired dir appends to failed regardless of mtime, with a message naming the path and citing
    Decision 84 I-4; legacy dirs keep the existing >24h warning-only behaviour. Reuse the same
    retired-table derivation as the test helper rather than duplicating the literal set.
  - >-
    PHASE 2. scripts/checks/registry.py -- add validate_outbox_staleness to pre_sequence() alongside
    its existing full_sequence() entry (currently line ~184), matching the surrounding _s/_c idiom.
  - >-
    PHASE 2. tests/checks/ops_governance/test_validate_outbox_staleness.py -- extend to cover the
    retired-vs-legacy split (fresh retired file fails; fresh legacy file does not; >24h legacy file
    warns without failing; clean tree passes) and assert registration in both tiers.
  - >-
    Out-of-scope finding to file, do not fix inline -- scripts/sync/ops.py's
    _DUCKLAKE_MIGRATED_TABLES includes ops_execution_plans and comments that migrated tables' outbox
    dirs are never drained, while AGENTS.md lists execution_plans as a live legacy staging path
    pending T2.26. File this contradiction via "bin/venv-python -m scripts.ops_data_portal" after
    calling get_rec_write_guidance().
  - >-
    Execute Verification Plan -- run each step; loop until pass; on unrecoverable failure stop and
    RCA (Decision 55). Steps 6 and 7 are Phase 2 only.
  - >-
    Squash-merge commit body must carry "Resolves: rec-2185, rec-2697, rec-2894" so rec-autoclose.yml
    closes all three. Word each resolution as the landed fix (deterministic satisfaction), never as
    "duplicate" -- Decision 103 forbids a direct close on a semantic verdict.
  - 'Report: what was implemented, verification results'
work_areas: []
rollback: >-
  Every change is additive or test-local and revertable with a single git revert of the squash-merge
  commit; there is no data migration, no deployed artifact, and no infrastructure change. If the
  Phase 2 hardened check proves too aggressive in practice (e.g. an unforeseen legitimate writer to a
  retired dir), revert only scripts/checks/ops_governance/validate_outbox_staleness.py and its
  registry.py entry -- Phase 1's leak fix and hermeticity guard stand independently.
