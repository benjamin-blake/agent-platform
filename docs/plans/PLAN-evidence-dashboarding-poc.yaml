  - "gates: decision-scout=FLAGS_FOUND (2 dispatches, 106/106 triaged each; flags accepted/rejected as recorded above); plan-critique=PROCEED; report-critique=<filled at Step 10>"
  - >-
    CI-RCA HARD-BLOCK DEFERRED BY EXPLICIT HUMAN DIRECTION. rec-2836 ("Terraform init flakes on
