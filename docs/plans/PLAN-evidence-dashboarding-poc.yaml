schema_version: 1
slug: "evidence-dashboarding-poc"
intent: >-
  Stress-test (report-only) the owner's hypothesis that Evidence should become this repository's
  standard human-facing analytical presentation layer, and place the resulting work on the platform
  roadmap as a prerequisite analytical-layer item (T2.52) plus a bounded three-way proof of concept
  (T2.53) governed by a new pending presentation-layer boundary decision (CD.42) -- so the platform
  gains a legible human surface over its governed datasets without acquiring a second semantic
  authority or a disproportionate frontend dependency.
plan_type: REPORT-ONLY
verification_tier: V1
plan_path: docs/plans/PLAN-evidence-dashboarding-poc.yaml
phase: >-
  Platform tier_items T2.52 + T2.53 (both new, deferred_post_mvp) and an amendment to T2.51. No
  product-roadmap phase -- this is platform observability/presentation infrastructure.
scope:
  - file: docs/plans/reports/REPORT-evidence-dashboarding-poc.md
    action: Create
    purpose: >-
      The stress-test deliverable -- what the hypothesis gets right, premise re-grounding, the two
      structural collisions (Decision 127 prose taxonomy; CD.41 invariant (b) multi-file serving),
      verified npm supply-chain evidence, the second-semantic-layer analysis, public-repo exposure,
      alternatives adjudicated including QuickSight by name, the prerequisite analytical layer, the
      proof-of-concept design, and pre-committed adopt/constrain/reject criteria.
  - file: docs/ROADMAP-PLATFORM.yaml
    action: Modify
    purpose: >-
      Add tier item T2.52 (analytical/semantic layer -- aggregate named-verb class + rebuildable-
      derived-asset write mode) and tier item T2.53 (bounded three-way presentation-layer proof of
      concept, depends_on T2.52), both deferred_post_mvp with recorded deferral rationale; add
      candidate decision CD.42 (presentation-layer boundary, pending, gates T2.53); amend T2.51
      exit criteria c2/c3 and its progress_note (route the cost snapshot into a governed DuckLake
      table served by named verbs; rehome the renderer choice and the CD.41-(b) serving question to
      T2.53).
  - file: docs/plans/PLAN-evidence-dashboarding-poc.yaml
    action: Create
    purpose: The REPORT-ONLY planning artifact pointing at the deliverable.
bundled_recommendations: []
infrastructure_dependencies: []
acceptance_criteria:
  - >-
    docs/plans/reports/REPORT-evidence-dashboarding-poc.md exists and records: the two structural
    collisions (Decision 127 standing human-audience prose; CD.41 invariant (b) multi-file static
    serving), the verified npm supply-chain evidence with its point-in-time caveat, an explicit
    AWS QuickSight adjudication against Decisions 100/75, and pre-committed adopt / reject /
    constrain criteria.
  - >-
    docs/ROADMAP-PLATFORM.yaml contains schema-valid tier items T2.52 and T2.53 (both
    deferred_post_mvp, strategic:false, structured exit_criteria per Decision 136, each carrying a
    recorded deferral rationale per Decision 93) with T2.53 depends_on [T2.52], plus candidate
    decision CD.42 (state:pending, gates:[T2.53]).
  - >-
    T2.51's exit criteria c2 and c3 are amended (governed DuckLake table + named verbs; renderer and
    CD.41-(b) question rehomed to T2.53) with all five of its criteria still status:open, so no
    met_by provenance is re-pointed (Decision 136 / CD.39).
  - >-
    The roadmap validates (validate_platform_roadmap), this plan validates (plan_document), and the
    roadmap stays under its Decision 114 line ceiling.
verification_plan:
  - step: 1
    phase: pre-deploy
    action: Validate the platform roadmap schema after adding T2.52, T2.53 and CD.42.
    command: bin/venv-python -m scripts.roadmap.platform_roadmap docs/ROADMAP-PLATFORM.yaml
    expected: "PASS: docs/ROADMAP-PLATFORM.yaml validates against RoadmapDocument schema."
    fix_if: >-
      A schema/graph error prints -> fix the offending item or CD shape (id, depends_on, structured
      exit_criteria) and re-run.
    graduation: not-applicable
  - step: 2
    phase: pre-deploy
    action: >-
      Confirm T2.52 and T2.53 are well-shaped, both deferred, the dependency edge exists, and CD.42
      is pending and gates T2.53.
    command: bin/venv-python -c "import yaml; d=yaml.safe_load(open('docs/ROADMAP-PLATFORM.yaml')); it={i['id']:i for i in d['tier_items']}; cd={c['id']:c for c in d['candidate_decisions']}; a=it['T2.52']; b=it['T2.53']; assert a['status']=='deferred_post_mvp' and b['status']=='deferred_post_mvp'; assert a['strategic'] is False and b['strategic'] is False; assert b['depends_on']==['T2.52']; assert len(a['exit_criteria'])>=6 and len(b['exit_criteria'])>=10; assert all(c['status']=='open' for c in a['exit_criteria']+b['exit_criteria']); assert cd['CD.42']['state']=='pending' and cd['CD.42']['gates']==['T2.53']; print('T2.52+T2.53+CD.42 ok')"
    expected: "T2.52+T2.53+CD.42 ok"
    fix_if: >-
      KeyError/AssertionError -> the item or CD is missing, mis-typed, or under-specified; correct
      it and re-run.
    graduation: not-applicable
  - step: 3
    phase: pre-deploy
    action: >-
      Confirm the Decision 93 no-live-dep invariant is not violated -- no live (non-deferred) tier
      item depends on T2.52 or T2.53.
    command: bin/venv-python -c "import yaml; d=yaml.safe_load(open('docs/ROADMAP-PLATFORM.yaml')); bad=[i['id'] for i in d['tier_items'] if i['status'] not in ('deferred_post_mvp','complete','reserved') and ({'T2.52','T2.53'} & set(i.get('depends_on') or []))]; assert not bad, bad; print('no-live-dep ok')"
    expected: "no-live-dep ok"
    fix_if: >-
      A live item id prints -> it depends on a deferred item (Decision 93 invariant); remove the
      edge or reclassify.
    graduation: not-applicable
  - step: 4
    phase: pre-deploy
    action: >-
      Confirm T2.51's amendment is provenance-safe -- all five criteria still status:open, so no
      met_by is re-pointed (Decision 136 / CD.39) -- and that c2/c3 carry the amendment.
    command: bin/venv-python -c "import yaml; d=yaml.safe_load(open('docs/ROADMAP-PLATFORM.yaml')); t=[i for i in d['tier_items'] if i['id']=='T2.51'][0]; assert all(c['status']=='open' for c in t['exit_criteria']), 'a criterion is no longer open'; assert not any(c.get('met_by') for c in t['exit_criteria']); c={x['id']:x['text'] for x in t['exit_criteria']}; assert 'GOVERNED DUCKLAKE TABLE' in c['c2']; assert 'T2.53' in c['c3']; print('T2.51 amendment ok')"
    expected: "T2.51 amendment ok"
    fix_if: >-
      AssertionError -> either a criterion was already met/rehomed (add new criteria instead of
      rewriting text), or the amendment text is missing; correct and re-run.
    graduation: not-applicable
  - step: 5
    phase: pre-deploy
    action: Validate this REPORT-ONLY plan document against the PlanDocument schema.
    command: bin/venv-python -m scripts.roadmap.plan_document docs/plans/PLAN-evidence-dashboarding-poc.yaml
    expected: The plan validates (exit 0) against the PlanDocument schema.
    fix_if: A validation error prints -> fix the offending field and re-run.
    graduation: not-applicable
  - step: 6
    phase: pre-deploy
    action: >-
      Confirm the deliverable exists and carries the load-bearing findings -- both structural
      collisions, the QuickSight adjudication, and the pre-committed criteria.
    command: test -f docs/plans/reports/REPORT-evidence-dashboarding-poc.md && grep -c -E "T2\.52|T2\.53|CD\.42|Decision 127|CD\.41|QuickSight|Pre-committed" docs/plans/reports/REPORT-evidence-dashboarding-poc.md
    expected: A count >= 7 (the report names both new items, the new CD, both collisions, the managed alternative, and the criteria section).
    fix_if: File missing or count low -> write/repair the deliverable so it carries those findings.
    graduation: not-applicable
  - step: 7
    phase: pre-deploy
    action: >-
      Confirm the roadmap stays within its Decision 114 line ceiling (10,000) after the additions.
    command: bin/venv-python -c "n=sum(1 for _ in open('docs/ROADMAP-PLATFORM.yaml')); assert n<10000, n; print('roadmap lines', n, '< 10000 ceiling')"
    expected: A line count under 10,000.
    fix_if: At or over the ceiling -> compact terminal content in place (Decision 147) before adding.
    graduation: not-applicable
constraints:
  - No implementation this session -- REPORT-ONLY; nothing is adopted, scaffolded, or installed.
  - >-
    No npm install, no package.json, and no tracked JavaScript/TypeScript file is created by this
    plan. Live npm registry reads (npm view / npm pack) were performed in the scratchpad only, for
    evidence gathering, and left no repository artifact.
  - >-
    Confidential figures are never committed to this PUBLIC repository; the report cites no vendor
    cost amounts, account identifiers, or internal hostnames (Decisions 73/83/101).
  - >-
    STRATEGIC filing is frozen (Decision 67 / CD.17) -- both L-effort tier items are authored
    strategic:false with a freeze-override note, per the T2.19 / T2.51 pattern.
  - >-
    Roadmap edits are bookkeeping and forward intent only; no criterion status is flipped and no
    item status is inferred (Status-Trusted-Never-Inferred).
  - No rescue agents or workaround loops (Decision 55).
context:
