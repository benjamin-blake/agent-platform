    Decision-scout verdict + CITE list: FLAGS_FOUND on both dispatches (106/106 decisions triaged
    each). CITE: 84, 85, 86, 88, 93, 100, 101, 104, 105, 111, 114, 118, 127, 132, 133, 136, 137,
