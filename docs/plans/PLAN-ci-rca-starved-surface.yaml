- >-
  LIVE CLOSURE PROOF, gathered this planning session (Decision 103 -- closure needs a proof, not an
  assertion): workflow run 30620166416 (terraform-apply-sandbox, workflow_dispatch on 0726593)
  concluded `success`, and s3://agent-platform-data-lake/convergence/personal/sandbox.json read
