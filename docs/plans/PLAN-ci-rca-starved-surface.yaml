schema_version: 3
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: ci-rca-starved-surface
intent: >-
  Close the last open CI-RCA rec by discharging its preventive action rather than its symptom: make
  the convergence-record consumer refuse an undefined reviewer verdict instead of latching a false
  platform-halting red, and freeze the defect class that produced it -- CI-embedded shell whose
  control flow silently does not run, leaving an output undefined for a downstream consumer to
  misread.
plan_type: IMPLEMENTATION
verification_tier: V3
plan_path: docs/plans/PLAN-ci-rca-starved-surface.yaml
phase: >-
  Ad hoc CI-RCA remediation behind rec-2923; the named closer of the three-plan set opened by
  PLAN-ci-rca-abstention-and-citation (#823) and PLAN-ci-rca-evidence-scope-declaration (#827).
  Continues T2.39 (complete) rather than reopening it; no tier_item criterion flip is owed.
scope:
- file: .github/actions/write-convergence-record/assert_review_outcome.sh
  action: Create
  purpose: >-
    THE STRICT CONSUMER, and the centrepiece of this plan. rec-2923 had two independent failures:
    the producer died silently AND the consumer accepted an empty value. This script closes the
    second. Contract, driven from two env vars: when REVIEW_STEP_OUTCOME is `success` or `failure`
    (the review step RAN), REVIEW_OUTCOME must be exactly one of proceed|revise|starved -- empty or
    unrecognised is a contract violation, printed as a distinct ::error:: and exited non-zero BEFORE
    any S3 write. Otherwise (skipped / cancelled / absent -- the guard-routed and gated-apply call
    sites, which run no review step) REVIEW_OUTCOME must be EMPTY; a non-empty value there is
    equally a violation. Lands as a script rather than inline logic so it is shellcheckable and
    directly testable under the literal `bash --noprofile --norc -e -o pipefail` argv -- the first
    instance of the R1 rule this plan mints as Decision 162.
- file: .github/actions/write-convergence-record/action.yml
  action: Modify
  purpose: >-
    Add the `review-step-outcome` input (default "", meaning "no review step in this job"), and
    invoke assert_review_outcome.sh from the EXISTING body -- positioned AFTER the four existing
    skip/marker branches (refused, still-actionable, routed/pending_gated, pre-apply-failure
    infra_error) and IMMEDIATELY BEFORE the green/red write. Ordering is load-bearing and was
    corrected by the decision-scout gate: making the assert the action's first step would let a
    violation in an unrelated dimension suppress a Decision 92 / Decision 154 marker write those
    decisions require, and would hard-fail paths that legitimately carry an empty review-outcome.
    The rec-2923 shape (review ran, outcome empty) falls through all four branches to exactly this
    position, so detection is unchanged while every marker write stays intact. Invoke it as
    `if ! bash "$GITHUB_ACTION_PATH/assert_review_outcome.sh"; then exit 1; fi` -- an explicit
    conditional, never a bare call relying on the ambient errexit, since inherited-errexit
    dependence is the very defect being closed. The existing ~94-line body is otherwise untouched.
- file: .github/workflows/terraform-apply-sandbox.yml
  action: Modify
  purpose: >-
    Pass `review-step-outcome: ${{ steps.review.outcome }}` at the apply-sandbox record-write call
    site (line ~351), and an explicit empty value at the gated-apply call site (line ~882), which
    runs no review step. Both are inline per-call-site expressions, per Decision 154 point 4.
- file: .github/workflows/reconcile.yml
  action: Modify
  purpose: >-
    THREE distinct edits. (i) Extend the `resolved` aggregator (line ~512) to emit
    `review_step_outcome` alongside `review_outcome`, selected on the SAME branch as the value it
    validates -- the decision-scout gate caught that a naive `steps.review.outcome` would pair the
    saved-plan review's step outcome with the DEP-10 fresh-replan path's `review_fresh` VALUE, i.e.
    validate the wrong pair. Pass the aggregated pair to the record-write step; pass an explicit
    empty pair at the gated-apply-reconcile call site. (ii) Add `review_outcome` to the
    apply-reconcile job's `outputs:` block. (iii) rec-2664: a new NON-TERMINAL job (needs:
    apply-reconcile, gated on `review_outcome == 'starved'`) that files a durable rec via
    `ops_data_portal --file-rec`, assuming `agent-platform-github-ci-branch` -- the only CI role
    holding the DuckLakeInvokeCI writer grant; github_ci_apply has none, so the filing must NOT run
    in the apply job. The job applies nothing and is no part of the terminal route set (Decision
    158); VP step 9 re-proves the topology guard against the edited workflow.
- file: .github/actions/subagent-plan-review/review.sh
  action: Modify
  purpose: >-
    Emit a distinct greppable marker on each starved exit path, mirrored to $GITHUB_STEP_SUMMARY --
    the marker shape Decision 155 established for the DCG-03 orphan-guard skip, so the STARVED rate
    is operator-observable. No control-flow change: the fail-closed pre-write and the cleared
    errexit from PR #812 stay exactly as they are.
- file: .github/actions/subagent-plan-review/archive_transcripts.sh
  action: Create
  purpose: >-
    Copy review.json / review_retry.json to s3://agent-platform-data-lake/ci-rca-evidence/
    review-transcripts/<run_id>/ so a later investigation can see WHY the reviewer stalled. TOTAL by
    construction -- always exits 0, so it can never change the action's verdict and does not depend
    on `continue-on-error` in composite steps (a documented GitHub grey area). Its failure path
    prints its own distinct marker to stdout and $GITHUB_STEP_SUMMARY; never a bare `|| true`,
    because the one time the transcript is needed is by definition a moment when something already
    went wrong.
- file: .github/actions/subagent-plan-review/action.yml
  action: Modify
  purpose: >-
    Add a second step, `if: always()`, delegating to archive_transcripts.sh. `if:` on composite
    steps is well-supported; `continue-on-error` is not relied on, since the script is total.
- file: scripts/checks/ci_guards/validate_composite_action_shell_bodies.py
  action: Create
  purpose: >-
    The class guard (rec-2923's preventive_action), sibling of validate_composite_action_manifests.py,
    owner="platform". R1: any composite `shell: bash` body producing a step output consumed by an
    `outputs.<id>.value` binding must be a thin adapter delegating to a `.sh` under the action dir,
    and that script must write a fail-closed default for every declared output before any fallible
    command. R2: each such script must be referenced by a test spawning it under the literal
    `bash --noprofile --norc -e -o pipefail` argv. R3 (ratchet): non-output-producing inline bodies
    are checked against the baseline below and FAIL on a new entry or on growth. Every failure
    message cites Decision 162. Filesystem-only, no network, no subprocess -- it runs in the fast
    tier (Decision 153 budget).
- file: config/composite_action_body_baseline.yaml
  action: Create
  purpose: >-
    The R3 ratchet baseline: path -> effective (non-blank, non-comment) line count for each
    non-output-producing inline composite body. Seeded at the state THIS PR leaves the repo in --
    a ONE-TIME grandfather in the sense of Decision 130 clause 2, explicitly NOT a precedent -- so
    the PR installing the ratchet is not punished by its own rule. Fails on any new entry or any
    growth. Touch-it-fix-it binds from the NEXT edit onward: a behavioural edit to a baselined body
    must extract it, and the only escape is the loud grammar Decision 128 already uses -- an inline
    `# raise-approved: dec-NNN <reason>` marker on the baselined entry naming a real Decision
    header, absent which the PR fails. Seed entries: write-convergence-record (~94 effective lines,
    +2 from this plan's assert invocation), terraform-init-retry (24), build-ducklake-artifacts (22),
    plus any others the guard discovers at implementation time. Full extraction of
    write-convergence-record is deliberately NOT bundled into incident remediation -- it is the
    highest-blast-radius script in the system, and it gets its own owned follow-on rec (execution
    step 13).
- file: scripts/checks/registry.py
  action: Modify
  purpose: Register validate_composite_action_shell_bodies in the --pre and full tiers.
- file: scripts/validate.py
  action: Modify
  purpose: >-
    Facade import of the new check. validate.py is the single source of truth -- the check lands
    here before CI can reference it (Decision 73).
- file: tests/checks/ci_guards/test_composite_action_shell_bodies.py
  action: Create
  purpose: >-
    Mirror path per Decision 131. Negative fixtures prove each of R1/R2/R3 actually FIRES (a guard
    that has never been seen to fail is not a guard), plus a positive pass against the live repo,
    plus TestBaselineRatchet driving growth and new-entry rejection and the marker-override path.
- file: tests/test_convergence_review_outcome_contract.py
  action: Create
  purpose: >-
    Drives assert_review_outcome.sh under the literal `bash --noprofile --norc -e -o pipefail` argv
    across the full truth table: ran+valid -> 0; ran+EMPTY -> non-zero (the exact rec-2923 shape);
    ran+garbage -> non-zero; not-ran+empty -> 0; not-ran+non-empty -> non-zero. A guard-free module
    by deliberate placement -- the sibling plan's implementation (#823) lost a CI job to placing new
    classes in a module carrying a top-level pytest.importorskip("boto3"), which the fast tier skips
    wholesale and the VP-replay gate reads as a hard failure.
- file: tests/test_subagent_review_wiring.py
  action: Modify
  purpose: >-
    Extend the existing GITHUB_COMPOSITE_BASH harness with the STARVED marker + step-summary mirror
    assertions and the archival-totality cases (aws absent, aws failing -> script still exits 0, its
    distinct marker printed, outcome unchanged). Currently 335 SLOC; the additions must keep it
    under 500 or the module decomposes (Decision 128) -- never a budget raise.
- file: tests/verify_ci_workflow/test_apply_and_terraform.py
  action: Modify
  purpose: >-
    Assert the call-site pairing invariant at every record-write call site: `review-step-outcome`
    and `review-outcome` are drawn from the SAME path selection, and the two gated call sites pass
    an explicitly empty pair. Also holds the existing recovery-workflow-topology assertions
    unchanged against the edited reconcile.yml (Decision 158, two-site property).
- file: tests/test_checks_registry.py
  action: Modify
  purpose: Per-tier membership floors for the new required check name.
- file: config/agent/data_quality/source_registry.yaml
  action: Modify
  purpose: >-
    Register the `reconcile_starved` canonical_id, without which validate_source rejects the
    rec-2664 filing at runtime. Note validate_test_count_coupling couples registry growth to test
    count -- check it at implementation time.
- file: config/agent/verification_registry/registry.yaml
  action: Modify
  purpose: Graduated rows for the VP steps carrying graduation=graduate (Decision 132).
- file: docs/DECISIONS.md
  action: Modify
  purpose: >-
    Mint Decision 162 recording R1/R2/R3 as a durable repo-wide authoring commitment, with reversal
    conditions and a Significance line citing Decision 150. Human explicitly approved minting.
    Re-check the current max header at execution time -- 162 is free as of planning, but numbers are
    not reserved and a concurrent PR may claim it.
- file: docs/decisions-index.json
  action: Modify
  purpose: Regenerate via `bin/venv-python -m scripts.decisions_index --write`; never hand-edit.
- file: docs/contracts/composite-action-shape.yaml
  action: Create
  purpose: >-
    Machine-readable home for the R1/R2/R3 field semantics, collocated with its enforcement
    counterpart (Decision 86/127 routing; no prose doc under docs/).
- file: docs/contracts/file-router.yaml
  action: Modify
  purpose: Register the new contract as a discovery topic.
- file: docs/contracts/ci-rca-lifecycle.yaml
  action: Modify
  purpose: >-
    Record the STARVED marker + transcript-archival prefix semantics, and a procedure note for
    rec-2923's manual closure route alongside the existing closure_dependency.manual_route.
bundled_recommendations:
- rec-2664
infrastructure_dependencies:
- >-
  VERIFIED, not assumed: the transcript archival needs NO IAM change. terraform/bootstrap/
  github_ci_apply.tf's DataLakeObjectIO statement grants s3:GetObject/PutObject/DeleteObject on
  arn:aws:s3:::agent-platform-data-lake/* (whole bucket), and all three subagent-plan-review call
  sites run under github_ci_apply. This claim is load-bearing because that role's inline policy has
  ~84 bytes of headroom (Decision 156) -- an addition would have been infeasible inline and would
  have routed to the admin-only bootstrap root. VP step 11 re-proves the grant rather than trusting
  this note.
- >-
  No .tf file is in scope, so no terraform plan/apply is triggered and the CD.35 speculative-plan
  pipeline is not engaged.
acceptance_criteria:
- >-
  A record-write call site whose review step RAN but produced an empty or unrecognised outcome
  fails loudly with a distinct error BEFORE any S3 write -- it never latches red. This is the exact
  rec-2923 shape, and it is the criterion the whole plan exists to satisfy.
- >-
  An explicit `revise` still latches red exactly as before (Decision 154 point 4 preserved), and
  `starved` still skips the write exactly as before (T2.39 c3 preserved). Only the undefined value
  is intercepted.
- >-
  The four existing skip/marker branches (refused, still-actionable, routed/pending_gated,
  pre-apply-failure infra_error) still write their markers on every path, unaffected by the assert.
- >-
  At every record-write call site, `review-step-outcome` and `review-outcome` are provably drawn
  from the same path selection, and the two gated call sites pass an explicitly empty pair.
- >-
  A new composite `shell: bash` body that produces a consumed step output and carries inline logic
  FAILS the fast tier, with an error message citing Decision 162.
- >-
  A delegated output-producing script with no test driving it under the literal
  `bash --noprofile --norc -e -o pipefail` argv FAILS the fast tier.
- >-
  Adding a new inline composite body, or growing a baselined one, FAILS the fast tier unless the
  baseline entry carries an inline `# raise-approved: dec-NNN <reason>` marker naming a real
  Decision header.
- >-
  A starved review emits its distinct marker to both the job log and the step summary, and archives
  its transcripts; an archival failure emits its own distinct marker and leaves the review outcome
  and the step's exit status unchanged.
- >-
  A starved Reconcile run files a durable `reconcile_starved` rec through the ops portal, from a
  job holding the DuckLakeInvokeCI grant, and that job is no part of reconcile's terminal route set.
- >-
  rec-2923 is closed with `context_v2_json.fixed_by_sha` == 0726593d465f3772c004dd1bbb8585f6491b5376
  -- the commit that actually fixed the reviewer path -- and NOT this plan's merge sha.
- >-
  rec-2664 is closed by the Resolves trailer, and Decision 162 is live with the index and the size
  ceiling both coherent.
verification_plan:
- step: 1
  phase: pre-deploy
  action: >-
    Prove the class guard FIRES. Negative fixtures for R1 (inline logic in an output-producing
    body), R2 (delegated script with no literal-argv test), and R3 (new/grown baseline entry) must
    each be rejected; a positive fixture must pass.
  command: bin/venv-python -m pytest tests/checks/ci_guards/test_composite_action_shell_bodies.py -q
  expected: All tests pass, including every negative fixture asserting a specific violation string.
  fix_if: >-
    A negative fixture passes the guard -- the rule is not actually enforced and the guard is
    decoration. A guard that has never been observed to fail is not evidence of anything.
  hermetic: false
  graduation: graduate
  graduation_check_id: composite-action-shell-body-rules
- step: 2
  phase: pre-deploy
  action: Run the new guard against the live repository tree.
  command: bin/venv-python -c "from scripts.checks.ci_guards.validate_composite_action_shell_bodies import validate_composite_action_shell_bodies as v; f=[]; v(f); assert not f, f; print('CLEAN')"
  expected: Prints CLEAN. subagent-plan-review (the only output-producing action) is conformant post-#812.
  fix_if: >-
    Violations reported. If write-convergence-record is flagged under R1 the scope rule is wrong --
    it produces no step outputs and belongs under the R3 ratchet, not R1.
  hermetic: true
  graduation: graduate
  graduation_check_id: composite-action-shell-bodies-clean
- step: 3
  phase: pre-deploy
  action: >-
    Prove the ratchet ratchets: growth of a baselined entry and addition of a new entry are both
    rejected, and only the inline Decision-citing marker overrides.
  command: bin/venv-python -m pytest tests/checks/ci_guards/test_composite_action_shell_bodies.py::TestBaselineRatchet -q
  expected: All ratchet cases pass, including rejection of a free-form (non-marker) override attempt.
  fix_if: >-
    Growth is tolerated, or a bare override works -- the baseline has become a frictionless
    exemption, which is the Decision 128/130 failure mode this shape exists to avoid.
  hermetic: false
  graduation: graduate
  graduation_check_id: composite-action-baseline-ratchet-fails-on-growth
- step: 4
  phase: pre-deploy
  action: >-
    Drive assert_review_outcome.sh under the LITERAL GitHub composite-step argv across the full
    truth table. The ran+EMPTY case is the rec-2923 counterfactual and must exit non-zero.
  command: bin/venv-python -m pytest tests/test_convergence_review_outcome_contract.py -q
  expected: >-
    ran+proceed/revise/starved -> 0; ran+empty -> non-zero with the distinct error string;
    ran+garbage -> non-zero; not-ran+empty -> 0; not-ran+non-empty -> non-zero.
  fix_if: >-
    ran+empty exits 0. The strict consumer does not exist and the false-red path is still open --
    stop, this is the plan's core criterion.
  hermetic: false
  graduation: graduate
  graduation_check_id: convergence-review-outcome-strict-enum
- step: 5
  phase: pre-deploy
  action: >-
    Prove the assert is positioned AFTER the four skip/marker branches: a routed / refused /
    pre-apply-failure episode carrying an empty review-outcome must still take its own branch and
    write its marker, NOT hit the assert.
  command: bin/venv-python -m pytest tests/test_convergence_infra_error_acceptance.py tests/test_convergence_review_outcome_contract.py -q
  expected: Marker-writing branches unaffected; the assert is reached only on the green/red write path.
  fix_if: >-
    A marker write is suppressed by the assert -- the ordering regressed to the rejected
    first-step design and breaks Decision 92 / Decision 154 guarantees.
  hermetic: false
  graduation: graduate
  graduation_check_id: convergence-assert-ordering-preserves-markers
- step: 6
  phase: pre-deploy
  action: >-
    Drive review.sh under the literal argv for the STARVED marker, the step-summary mirror, and
    archival totality (aws absent and aws failing must both leave exit status and outcome unchanged
    while printing the archival failure marker).
  command: bin/venv-python -m pytest tests/test_subagent_review_wiring.py -q
  expected: All existing cases still pass; new marker and archival-totality cases pass.
  fix_if: >-
    An archival failure changes the exit code or the outcome value -- the best-effort side effect
    has become load-bearing, inverting its purpose.
  hermetic: false
  graduation: graduate
  graduation_check_id: subagent-review-starved-marker-and-archival
- step: 7
  phase: pre-deploy
  action: >-
    Assert the call-site pairing invariant across every record-write call site, including
    reconcile's aggregator emitting both halves from the same branch.
  command: bin/venv-python -m pytest tests/verify_ci_workflow/test_apply_and_terraform.py -q
  expected: >-
    Every call site pairs review-step-outcome with the review-outcome from the SAME selection; both
    gated call sites pass an explicitly empty pair.
  fix_if: >-
    The fresh-replan path pairs `steps.review.outcome` with `review_fresh`'s value -- the assert is
    then validating the wrong pair and can hard-fail a healthy run.
  hermetic: false
  graduation: graduate
  graduation_check_id: convergence-review-outcome-callsite-pairing
- step: 8
  phase: pre-deploy
  action: Confirm the new reconcile source is registered and accepted by the portal's validator.
  command: bin/venv-python -c "from scripts.executor.rec_write_guidance import validate_source; validate_source('reconcile_starved'); print('OK')"
  expected: Prints OK without raising.
  fix_if: >-
    Raises -- the rec-2664 filing job would fail at runtime on a real starved Reconcile, i.e. the
    observability gap it exists to close would still be open.
  hermetic: true
  graduation: graduate
  graduation_check_id: reconcile-starved-source-registered
- step: 9
  phase: pre-deploy
  action: >-
    Re-prove reconcile's terminal route set is intact after adding the rec-filing job (Decision 158
    two-site property).
  command: bin/venv-python -c "from scripts.verify_ci_workflow import _check_recovery_workflow_topology as c; c(); print('TOPOLOGY OK')"
  expected: Prints TOPOLOGY OK -- the new job is recognised as non-terminal and applies nothing.
  fix_if: >-
    The guard reads the new job as an apply route. Do not weaken the guard; restructure the job
    (e.g. as a separate workflow triggered on the starved signal).
  hermetic: true
  graduation: waive
  graduation_waiver_reason: >-
    Already enforced by the registered recovery-workflow-topology guard inside
    validate_ci_workflow_guards, which runs in both presubmit tiers; graduating a second row for
    the same assertion would duplicate an existing registry entry rather than add coverage.
- step: 10
  phase: pre-deploy
  action: Confirm Decision 162 landed, the index is fresh, and the header ceiling is not breached.
  command: bin/venv-python -m scripts.decisions_index --check && bin/venv-python -c "from scripts.checks.decisions.validate_decisions_size import validate_decisions_size as v; f=[]; v(f); assert not f, f; print('SIZE OK')"
  expected: Index fresh; SIZE OK. Live header count 115 of the 120 ceiling.
  fix_if: >-
    Index stale -- regenerate with --write, never hand-edit. Ceiling breached -- Decision 149's
    compact-in-place relief valve, not deletion of the new entry.
  hermetic: true
  graduation: waive
  graduation_waiver_reason: >-
    Duplicates the already-registered validate_decisions_index_freshness and validate_decisions_size
    checks, which run in the presubmit tiers on every PR; a graduated row would add a third
    invocation of the same two assertions.
- step: 11
  phase: pre-deploy
  action: >-
    Re-prove the load-bearing IAM claim rather than trusting the planning note: github_ci_apply
    grants PutObject across the whole data-lake bucket, so archival needs no IAM change.
  command: bin/venv-python -c "import pathlib,re; t=pathlib.Path('terraform/bootstrap/github_ci_apply.tf').read_text(); i=t.index('DataLakeObjectIO'); w=t[i:i+900]; assert 's3:PutObject' in w and 'arn:aws:s3:::agent-platform-data-lake/*' in w, w[:400]; print('GRANT OK')"
  expected: Prints GRANT OK.
  fix_if: >-
    The statement narrowed since planning. STOP -- do not add an IAM statement here; that role's
    inline policy has ~84 bytes of headroom (Decision 156) and any change routes to the admin-only
    bootstrap root, out of this plan's reach. File a rec instead.
  hermetic: true
  graduation: graduate
  graduation_check_id: ci-apply-datalake-putobject-grant-present
- step: 12
  phase: pre-deploy
  action: Fast presubmit tier, the authoritative pre-merge gate.
  command: bin/venv-python -m scripts.validate --pre
  expected: Exit 0, with the new check present in the fast tier's run list.
  fix_if: Any failure -- fix before pushing; the fast tier is authoritative on PR CI (Decision 73).
  hermetic: false
  graduation: waive
  graduation_waiver_reason: >-
    validate.py --pre is the gate itself; a graduated check invoking it would recurse (explicitly
    banned by the hermetic-authoring rule) and would be circular as a regression guard.
- step: 13
  phase: pre-deploy
  action: Full validation, required to complete and exit 0 before the commit/PR per handoff_policy.
  command: bin/venv-python -m scripts.validate
  expected: Exit 0.
  fix_if: >-
    Any failure. Timeout disposition is `blocked` -- resume later and rerun full from the start,
    never commit on a partial run.
  hermetic: false
  graduation: waive
  graduation_waiver_reason: >-
    Same recursion ban as step 12; the full tier is the gate, not a candidate for graduation into
    itself.
- step: 14
  phase: post-deploy
  action: >-
    Confirm rec-2923 is closed AND attributed to the commit that actually fixed the reviewer path,
    not to this plan's merge sha.
  command: bin/venv-python -c "import json; from scripts.ops_data_portal import _fetch_rec_from_reader as f; r=f('rec-2923'); c=json.loads(r['context_v2_json'] or '{}'); assert r['status']=='closed', r['status']; assert c.get('fixed_by_sha','').startswith('0726593'), c.get('fixed_by_sha'); print('rec-2923 closed, fixed_by_sha', c['fixed_by_sha'][:12])"
  expected: Prints the closed status and a fixed_by_sha beginning 0726593.
  fix_if: >-
    fixed_by_sha is this plan's merge sha -- rec-autoclose stamped it via a Resolves trailer that
    should not exist. Re-stamp explicitly; under Decision 142 point 3's ancestry test the wrong sha
    silently DROPS a genuine recurrence occurring between 0726593 and this merge.
  hermetic: false
  graduation: not-applicable
- step: 15
  phase: post-deploy
  action: Confirm rec-2664 closed via the Resolves trailer (rec-autoclose).
  command: bin/venv-python -c "from scripts.ops_data_portal import _fetch_rec_from_reader as f; r=f('rec-2664'); assert r['status']=='closed', r['status']; print('rec-2664 closed')"
  expected: Prints rec-2664 closed.
  fix_if: >-
    Still open -- rec-autoclose did not process the trailer. Fall back to ci-rca-lifecycle.yaml's
    closure_dependency.manual_route.
  hermetic: false
  graduation: not-applicable
- step: 16
  phase: post-deploy
  action: >-
    Confirm the live convergence record is not red -- the platform-wide hard block this whole rec
    is about must be clear after the change lands.
  command: aws s3 cp s3://agent-platform-data-lake/convergence/personal/sandbox.json - --profile agent_platform | bin/venv-python -c "import json,sys; d=json.load(sys.stdin); assert d.get('status') != 'red', d; print('convergence', d.get('status'), 'at', d.get('commit_sha','')[:12])"
  expected: >-
