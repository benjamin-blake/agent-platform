  corrective_action on both limbs -- the next post-fix run reached a real, non-empty outcome, and
  the false red latched at 3ae1863 is gone. This text belongs in the --resolution string.
- >-
  WHY NO `Resolves: rec-2923` TRAILER. rec-autoclose stamps context_v2_json.fixed_by_sha to the
  MERGE sha. Decision 142 point 3 then decides regression-vs-drop by asking whether a new failure's
  commit is an ancestor of fixed_by_sha. Stamping this plan's merge sha would make that test lie in
  one direction: a genuine recurrence of the reviewer defect occurring between 0726593 and this
  merge would be classified as a stale duplicate and suppressed. So rec-2923 closes via
  ci-rca-lifecycle.yaml's documented closure_dependency.manual_route with an explicit
  stamp_fixed_by_sha('rec-2923', '0726593...'), and bundled_recommendations deliberately carries
  ONLY rec-2664. Precedent: PLAN-ci-rca-abstention-and-citation made the same reasoned exception.
  Execution step 12 files the durable fix -- teach rec-autoclose an explicit fixed-by override -- so
  this stays a one-off rather than a recurring hand-edit.
- >-
  THE FABLE ADVICE-CONSULT THAT RESHAPED THIS PLAN. An earlier draft addressed only the producer.
  The consult's headline correction: the incident had TWO independent failures, and the consumer
  accepting an empty value is the one that turned a contained reviewer stall into a false
  platform-halting red. A strict consumer ranks above every producer-side control, because a
  consumer that switch-cases on a value and treats "anything unrecognised, including empty" as a
  legitimate branch is a latent bug regardless of how the producer fails. Adopted: strict consumer
  as the centrepiece; ratchet instead of a non-failing advisory (CI warnings have a measured
  half-life of about one sprint before becoming wallpaper); best-effort archival isolated and
  never silent; manual fix attribution; mint the ADR and have the lint message cite it. The
  "write the safe answer first, then overwrite on success" shape already in review.sh has a name --
  fail-safe defaults, Saltzer and Schroeder 1975.
- >-
  DIVERGENCE FROM THE CONSULT, stated rather than buried. It preferred archival as a separate step
  with `continue-on-error`. `continue-on-error` on composite-action steps is a long-standing GitHub
  grey area, so the design instead makes the script TOTAL (always exit 0) and relies only on `if:`,
  which is well-supported on composite steps. Same isolation guarantee, no dependence on contested
  behaviour. It also warned that a separate step needs the transcript handed across a step boundary
  -- here it does not: the files sit in the action's working directory, readable by the next step.
- >-
  TWO DESIGN ERRORS THE SECOND SCOUT ROUND CAUGHT, both corrected in Scope. (i) The assert was
  going to be the action's FIRST step; that would place it ahead of the refused / still-actionable /
  routed-pending_gated / pre-apply-failure branches, suppressing marker writes Decisions 92 and 154
  require and hard-failing paths that legitimately carry an empty review-outcome. It now sits after
  those four and immediately before the green/red write, where the rec-2923 shape lands anyway.
  (ii) `review-step-outcome: ${{ steps.review.outcome }}` is WRONG at reconcile's call site, which
  already draws its value from the `resolved` aggregator across the saved-plan and DEP-10
  fresh-replan paths -- it would have paired one path's step outcome with the other path's value.
  The aggregator now emits both halves from the same branch. Decision 154 point 4's aggregator ban
  is grounded in the apply-step subset rule and does not reach review steps.
- >-
  ANTI-MASKING ACCOUNT FOR THE NEW REFUSAL BRANCH, required by the scout. When the assert fires the
  step exits non-zero and the record is NOT written, leaving the PRIOR record in place. That is
  behaviourally identical to the already-sanctioned STARVED skip. It is not masked, on three
  independent surfaces: the job goes red in Actions; ci-rca watches the sandbox path and files a
  Critical (Decision 142); and stale_green_backlog escalates at severity=high within roughly two
  hours. Implementation must CONFIRM the backlog escalation actually covers this new branch rather
  than assuming inheritance from the STARVED branch.
- >-
  DECISION 162 SCOPE AND BUDGET. Live `## Decision` header count is 114; minting takes it to 115
  against a 120 ceiling (Decision 134), with the combined byte ceiling at 633,301 of 700,000 and
  Decision 145's live-byte ceiling retired by Decision 160. Headroom is 5 headers -- if it reaches
  ~2, the response is Decision 149's compact-in-place relief valve, not declining to record
  decisions. The entry needs a Significance line citing Decision 150 (the bar it clears: a durable
  repo-wide authoring commitment, guard-enforced, with reversal conditions) and explicit reversal
  conditions naming the revert path (delete the check registration and the baseline file).
- >-
  RATCHET SEEDING, and why it is not a quiet exemption. The baseline is seeded at the state THIS PR
  leaves the repo in, so the change installing the rule is not punished by it -- a one-time
  grandfather in the sense of Decision 130 clause 2, explicitly NOT a precedent. Touch-it-fix-it
  binds from the next edit onward, and the only override is Decision 128's own loud grammar: an
  inline `# raise-approved: dec-NNN <reason>` marker naming a real Decision header. A free-form
  documented escape was the first draft and was rejected by the scout as quieter than the mechanism
  it mirrors.
- >-
  SEQUENCING, deliberate. The narrow rule ships now and the write-convergence-record extraction is
  scheduled separately with an owner. Bundling the highest-blast-radius refactor into incident
  remediation is how remediation changes cause the next incident -- reviewers focus on the new rule
  and wave the refactor through. A lint rule that flags nothing on arrival is still worth having:
  its job is to freeze the class, and ratchets that start at zero are the easiest to keep at zero.
- >-
  KNOWN GAP, stated plainly. A live STARVED event cannot be forced, so the marker, the archival and
  the rec-2664 filing are proven by driving the scripts under the exact `bash --noprofile --norc -e
  -o pipefail` argv GitHub uses -- the strongest available proof, and precisely the test shape PR
  #812 established after unit tests that asserted the classifier's contract failed to catch that the
  caller detonated on it. Their first live exercise will be the next real starvation.
