schema_version: 4
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: "executor-substrate-evidence-fold"
intent: >-
  Persist the 2026-08-21 executor substrate-billing evidence round -- nine operator runtime
  estimates, two external doc-pass results, and the GitHub Actions usage-policy predicate -- into
  the roadmap's cost_projection and tier item T4.15, and encode one substrate-neutral design
  commitment: verification and validation run on GitHub Actions REGARDLESS of which layer-2
  persona substrate the spike selects. Evidence-persistence and predicate-encoding only. This plan
  SELECTS NO SUBSTRATE (CD.44 discipline point 1: selection is T4.15's act).
plan_type: IMPLEMENTATION
verification_tier: V2
plan_path: docs/plans/PLAN-executor-substrate-evidence-fold.yaml
phase: >-
  Platform T4 (executor). Tier item T4.15 -- the layer-2 substrate comparative spike. This plan
  adds evidence and exit criteria to that item; it closes none of its criteria and completes
  nothing.

fallback_reevaluation:
  reevaluated_on: "2026-08-21"
  substrate_status: >-
    CD.27's layer-2 incumbent remains the incumbent. This plan records billing and runtime
    evidence bearing on the comparison and selects nothing. Two candidates assessed this round
    (aws_native_codebuild_runner, agentcore_managed_runtime) were never members of CD.27's pinned
    five, so recording their elimination narrows no pinned option. The spike owned by T4.15 has
    not run.
  verdict: continue_on_current_substrate
  basis: >-
    Recorded against CD.27's fallback_spec trigger. No substrate semantics changed this round; the
    evidence discriminates AGAINST one never-pinned candidate on price and eliminates a second
    never-pinned candidate on structure. The pinned five stay economically indistinguishable at
    recorded scale, so no fallback condition is engaged and no obligation lapses.

scope:
  - file: docs/ROADMAP-PLATFORM.yaml
    action: Modify
    purpose: >-
      The evidence fold and the predicate encoding. Adds cost_projection.operator_estimates (nine
      OE entries in the compact flow style of audits/private-repo-self-hosted-ci-9a545d2.yaml's
      assumed_inputs); adds two ASSESSED rows to executor_substrate_billing's per-substrate
      envelope, each declaring a provenance class and in_pinned_candidate_set: false; narrows
      non_discrimination_conclusion; widens long_running_container's envelope to the recomputed
      band; extends two existing substrate_reevaluation_triggers rows IN PLACE to name the ToS
      predicate (the row COUNT must stay 4 -- a standing guard pins it); and adds T4.15 exit
      criteria c9 and c10. Line budget: 8,995 of 10,000 at authoring time (Decision 114 ceiling,
      Decision 147 compactness norm) -- roughly 1,005 lines of headroom, of which this plan
      consumes a visible slice; re-measure after any rebase.
  - file: tests/esb_text_fix/test_cost_projection.py
    action: Modify
    purpose: >-
      Amend the priced-row provenance guard so the two new rows can land WITHOUT the guard
      degrading to existence-only (Decision 165). Replaces the single hardcoded
      "AWS Price List bulk offer files" + "2026-08-01" needle pair with a CLOSED ENUMERATION of
      provenance classes, each carrying its own mandatory needle, retrieval date and region rule;
      an unrecognised or absent provenance_class FAILS. Also carries bundled rec-2946: the SFN
      transition guard parses tx_per_rec and rate out of the roadmap line it checks instead of
      hardcoding them as Python literals.
  - file: config/agent/verification_registry/registry.yaml
    action: Modify
    purpose: >-
      rec-2946's second surface. The graduated check sfn-transition-line-arithmetic-consistent
      duplicates the same tx_per_rec=30 / rate=0.000025 hardcoding as a bash one-liner, so fixing
      only the pytest guard would leave the rec half-open. Update its check_spec to parse the
      stated assumptions from the roadmap line, matching the amended pytest guard.

bundled_recommendations:
  - rec-2946

infrastructure_dependencies: []

acceptance_criteria:
  - >-
    cost_projection.operator_estimates exists with exactly nine entries OE-01..OE-09, each
    carrying id, input, assumed_value, why and sensitivity, under a source label that names the
    2026-08-21 session and explicitly disclaims measurement. Every why field is one line
    (Decision 110: the roadmap's ratified property is structured data, not narrative).
  - >-
    executor_substrate_billing.per_substrate_envelope_usd_per_month carries the two new ASSESSED
    rows, each declaring provenance_class and in_pinned_candidate_set false, and all four pinned
    rows survive unchanged in membership.
  - >-
    No arn:aws: literal reaches cost_projection; the Step Functions optimized integration is named
    as codebuild:startBuild.sync without the ARN prefix (Decision 101 + the standing public-repo
    boundary guard).
  - >-
    The priced-row guard is a closed enumeration: a row declaring an unrecognised provenance_class
    is REJECTED, a row declaring none is REJECTED, and a well-formed row of each class is
    ACCEPTED. Proven by fault injection in both directions, not by the guard merely passing.
  - >-
    non_discrimination_conclusion records that it NARROWED -- economics now discriminate against
    the codebuild-class candidate only -- and states that CD.27's pinned five are unchanged and
    stay economically indistinguishable at recorded scale.
  - >-
    T4.15 gains exit criterion c9 (status open) binding verification and validation to GitHub
    Actions regardless of the selected substrate, excluding verification wall-clock from the
    spike's per-arm measurements, citing Decision 163 clause 3 for the interactive/executor
    scoping and Decision 112's reversal condition as the conscious carry-forward trigger
    (Decision 75), and stating that T4.9 c1 is NOT rehomed.
  - >-
    T4.15 gains exit criterion c10 (status open) requiring the ratifying record to state the
    GitHub Actions usage-policy fit -- clause 5 satisfied, clause 4 binding, a measured burden
    posture, named re-evaluation triggers, and the BUSL-1.1 clause-3 note.
  - >-
    substrate_reevaluation_triggers still has EXACTLY four rows; the A2+ row and the
    repo-visibility row each name the ToS predicate in place; no row is duplicated.
  - >-
    rec-2946 is discharged on both surfaces: the pytest guard and the graduated registry check
    each derive tx_per_rec and rate from the roadmap line's own stated assumptions.
  - >-
    docs/ROADMAP-PLATFORM.yaml stays within the 10,000-line ceiling and the full presubmit tier
    exits 0.

verification_plan:
  - step: 1
    phase: pre-deploy
    action: >-
      Pre-handoff full presubmit tier. Schema validation, dependency graph, the roadmap line
      ceiling, contract conformance, coverage and the whole test suite. Required by
      handoff_policy and structurally enforced by validate_handoff_full_tier (Decision 163).
    command: |-
      bin/venv-python -m scripts.validate
    expected: Exit 0, no FAIL lines.
    fix_if: >-
      Any FAIL. Do not commit on a red full tier -- timeout_disposition is blocked, so a timed-out
      run resumes later and reruns full from the start rather than downgrading to --pre.
    hermetic: false
    graduation: not-applicable
  - step: 2
    phase: pre-deploy
    action: >-
      THE OPERATOR ESTIMATES ARE STRUCTURED, COMPLETE, AND HONEST ABOUT THEIR PROVENANCE. Nine
      entries, five required fields each, a source label that disclaims measurement, and one-line
      why fields so the roadmap does not accrete narrative (Decision 110 / Decision 147).
    command: |-
      bin/venv-python -c "import yaml; d=yaml.safe_load(open('docs/ROADMAP-PLATFORM.yaml')); oe=d['cost_projection']['operator_estimates']; ent=oe['entries']; ids=[e['id'] for e in ent]; assert ids==['OE-0%d'%n for n in range(1,10)], 'expected OE-01..OE-09 in order, got %r'%(ids,); req={'id','input','assumed_value','why','sensitivity'}; bad={e['id']: sorted(req-set(e)) for e in ent if req-set(e)}; assert not bad, 'entries missing required fields: %r'%(bad,); src=str(oe['source']); assert 'NOT measurement' in src, 'the source label does not disclaim measurement'; assert '2026-08-21' in src, 'the source label names no session date'; assert 'estimate' in src.lower(), 'the source label does not call these estimates'; verbose={e['id']: len(str(e['why'])) for e in ent if len(str(e['why']))>200}; assert not verbose, 'why fields breach the one-line discipline (Decision 110): %r'%(verbose,); assert [e for e in ent if 'HIGH' in str(e['sensitivity'])], 'no entry carries a HIGH sensitivity -- OE-01 is the dominant cost term'; print('OK', len(ent), 'operator estimates, all fields present, source disclaimed')"
    expected: "OK 9 operator estimates, all fields present, source disclaimed"
    fix_if: >-
      A missing entry or field, an absent disclaimer, or a why field over 200 characters -- move
      the extended justification to the PR body per the AGENTS.md change-record content rule.
    hermetic: true
    graduation: waive
    graduation_waiver_reason: >-
      The assertion lands as a standing pytest guard in tests/esb_text_fix/test_cost_projection.py,
      whose _anchors module names docs/ROADMAP-PLATFORM.yaml as a literal token so the
      affected_tests data-edge channel selects the package into --pre on every roadmap edit.
      Graduating a bash duplicate of that guard into the registry would reproduce precisely the
      duplication anti-pattern rec-2948 already flags against this plan's own sibling wave.
  - step: 3
    phase: pre-deploy
    action: >-
      THE TWO NEW ENVELOPE ROWS LAND WITHOUT DISTURBING THE PINNED SET OR THE PUBLIC BOUNDARY.
      Both rows carry an assessment verdict and in_pinned_candidate_set: false, so a later reader
      can tell assessed-but-unpinned from pinned (CD.44 GOV-2); the four pinned rows survive; and
      no ARN literal reaches cost_projection.
    command: |-
      bin/venv-python -c "import yaml; d=yaml.safe_load(open('docs/ROADMAP-PLATFORM.yaml')); cp=d['cost_projection']; env=cp['executor_substrate_billing']['per_substrate_envelope_usd_per_month']; new=['aws_native_codebuild_runner','agentcore_managed_runtime']; miss=[k for k in new if k not in env]; assert not miss, 'new envelope rows absent: %r'%(miss,); pinned=['durable_functions','sfn_over_stateless_workers','self_checkpointed_lambda_dynamodb','long_running_container']; gone=[k for k in pinned if k not in env]; assert not gone, 'a pinned row was dropped: %r'%(gone,); unpinned=[k for k in new if env[k].get('in_pinned_candidate_set') is not False]; assert not unpinned, 'new rows do not declare in_pinned_candidate_set false: %r'%(unpinned,); assert 'ELIMINATED' in str(env['aws_native_codebuild_runner'].get('assessment')), 'the codebuild row records no elimination verdict'; assert 'UNJUSTIFIED' in str(env['agentcore_managed_runtime'].get('assessment')), 'the agentcore row records no verdict'; blob=yaml.safe_dump(cp); assert 'arn:aws:' not in blob, 'an ARN literal reached cost_projection (Decision 101)'; assert 'startBuild.sync' in blob, 'the Step Functions optimized integration is not named'; print('OK 2 new rows, 4 pinned intact, no ARN literal')"
    expected: "OK 2 new rows, 4 pinned intact, no ARN literal"
    fix_if: >-
      A missing row, a missing in_pinned_candidate_set declaration, a dropped pinned row, or an
      arn:aws: literal. Name the integration codebuild:startBuild.sync without the prefix.
    hermetic: true
    graduation: waive
    graduation_waiver_reason: >-
      Same standing-pytest-guard home and same rec-2948 duplication argument as step 2. The
      public-repo half is additionally already covered in perpetuity by the existing
      test_public_repository_boundary_no_confidential_identifiers guard over the whole
      cost_projection blob.
  - step: 4
    phase: pre-deploy
    action: >-
      THE AMENDED PROVENANCE GUARD IS A CLOSED ENUMERATION, NOT AN EXISTENCE CHECK. Decision 165's
      category error is admitting a second class by relaxing into "some non-empty rate_basis
      exists". Fault-inject in BOTH directions: an unrecognised class and a class-less row must be
      rejected, and a well-formed row of each declared class must be accepted.
    command: |-
      bin/venv-python -c "from tests.esb_text_fix.test_cost_projection import PROVENANCE_CLASSES as P, priced_row_issues as f; assert len(P)>=2, 'the enumeration carries only %r'%(sorted(P),); assert f('decoy_unknown', {'provenance_class':'made_up_class','region':'eu-west-2','rate_basis':'AWS Price List bulk offer files, fetched 2026-08-01'}), 'an unrecognised provenance_class was ACCEPTED -- the guard degraded to existence-only (Decision 165)'; assert f('decoy_classless', {'region':'eu-west-2','rate_basis':'AWS Price List bulk offer files, fetched 2026-08-01'}), 'a row declaring no provenance_class was ACCEPTED'; assert f('decoy_wrong_needle', {'provenance_class':sorted(P)[0],'region':'eu-west-2','rate_basis':'trust me'}), 'a row whose rate_basis omits its class needle was ACCEPTED'; ok=[n for n,spec in P.items() if not f('probe_'+n, {'provenance_class':n,'region':(spec['region_required'] or 'not_region_qualified'),'rate_basis':spec['needle']+' :: retrieved '+spec['date'],'region_caveat':'probe'})]; assert len(ok)==len(P), 'a well-formed row was REJECTED for classes %r'%(sorted(set(P)-set(ok)),); print('OK closed enumeration over', sorted(P), '-- 3 decoys rejected,', len(ok), 'well-formed accepted')"
    expected: "OK closed enumeration over [...] -- 3 decoys rejected, N well-formed accepted"
    fix_if: >-
      Any decoy accepted means the guard is vacuous -- tighten it rather than shipping. Any
      well-formed row rejected means the class spec disagrees with the rows the plan actually
      writes; reconcile the spec, never loosen it to whatever the row happens to say.
    hermetic: true
    graduation: waive
    graduation_waiver_reason: >-
      The fault injection belongs beside the guard it fault-injects, and lands as pytest cases in
      the same module. Graduating a registry duplicate would be the rec-2948 anti-pattern applied
      to a check whose entire value is that it has exactly one authoritative definition.
  - step: 5
    phase: pre-deploy
    action: >-
      THE NON-DISCRIMINATION CONCLUSION NARROWS RATHER THAN INVERTS. The prior conclusion said
      economics discriminate nothing. The new evidence discriminates against ONE never-pinned
      candidate; the pinned five stay indistinguishable. Both halves must be on the page, or the
      narrowing reads as a selection.
    command: |-
      bin/venv-python -c "import re,yaml; d=yaml.safe_load(open('docs/ROADMAP-PLATFORM.yaml')); esb=d['cost_projection']['executor_substrate_billing']; c=str(esb['non_discrimination_conclusion']); assert re.search(r'codebuild', c, re.I), 'the conclusion does not name the discriminated candidate'; assert re.search(r'narrow', c, re.I), 'the conclusion does not record that it narrowed'; assert re.search(r'pinned', c, re.I), 'the conclusion does not state the pinned set is unchanged'; assert re.search(r'indistinguishable|do NOT discriminate|does not discriminate', c), 'the conclusion drops the surviving non-discrimination claim for the pinned set'; env=esb['per_substrate_envelope_usd_per_month']; lrc=str(env['long_running_container'].get('envelope')); assert re.match(r'^[\"]?5-20', lrc.strip().strip(chr(34))), 'long_running_container envelope was not widened to the recomputed 5-20 band, got %r'%(lrc,); print('OK conclusion narrowed, pinned set preserved, container band widened')"
    expected: "OK conclusion narrowed, pinned set preserved, container band widened"
    fix_if: >-
      A conclusion naming only the elimination reads as a partial selection and breaches CD.44
      discipline point 1. Restore the surviving pinned-set claim.
    hermetic: true
    graduation: waive
    graduation_waiver_reason: >-
      Standing pytest home as in step 2; the assertion is text-keyed to one YAML scalar and would
      add a third bash duplicate of an already-guarded document (rec-2948).
  - step: 6
    phase: pre-deploy
    action: >-
      T4.15 c9 -- THE SUBSTRATE-NEUTRAL VERIFICATION SPLIT, WITH ITS AUTHORITY AND ITS REVERSAL
      CONDITION BOTH NAMED. The criterion must bind across every arm, exclude verification
      wall-clock from the per-arm measurements, cite Decision 163 clause 3 for the
      interactive-versus-executor scoping, carry Decision 112's reversal condition so the
      carry-forward is conscious (Decision 75), and state that T4.9 c1 is not rehomed so no
      two-place obligation is created without met_by linkage (Decision 136).
    command: |-
      bin/venv-python -c "import re,yaml; d=yaml.safe_load(open('docs/ROADMAP-PLATFORM.yaml')); t=next(i for i in d['tier_items'] if i['id']=='T4.15'); bare=[c for c in t['exit_criteria'] if not isinstance(c,dict)]; assert not bare, 'a T4.15 criterion is a bare string (Decision 136): %r'%(bare,); cr={c['id']: c for c in t['exit_criteria']}; assert 'c9' in cr, 'c9 absent'; assert cr['c9']['status']=='open', 'c9 must be status open'; x=str(cr['c9']['text']); assert re.search(r'regardless', x, re.I), 'c9 does not bind across every arm'; assert 'validate.py' in x, 'c9 does not name validate.py'; assert 'GitHub Actions' in x, 'c9 does not name the verifier platform'; assert re.search(r'exclude', x, re.I), 'c9 does not exclude verification wall-clock from the per-arm measurements'; assert 'Decision 163' in x, 'c9 does not cite the interactive-versus-executor scoping authority'; assert 'Decision 112' in x, 'c9 carries no reversal condition -- the carry-forward is not conscious (Decision 75)'; assert re.search(r'T4\.9', x), 'c9 does not name T4.9'; assert re.search(r'not rehomed', x, re.I), 'c9 does not state that T4.9 c1 is NOT rehomed (Decision 136)'; print('OK c9 present and complete')"
    expected: "OK c9 present and complete"
    fix_if: >-
      A missing citation or a missing not-rehomed statement. Do not satisfy this by editing T4.9 --
      that item is deferred_post_mvp and out of scope; the re-grounding is filed as a rec instead.
    hermetic: true
    graduation: waive
    graduation_waiver_reason: >-
      Standing pytest home as in step 2. The criterion text is a one-off contract assertion on a
      single item; a registry duplicate would be a second unenforced-sync copy (rec-2948).
  - step: 7
    phase: pre-deploy
    action: >-
      T4.15 c10 -- THE GITHUB ToS PREDICATE, WITH THE BINDING CLAUSE IDENTIFIED. Clause 5 is
      satisfied and clause 4 is the constraint; a record that names only the satisfied clause has
      recorded the easy half. The retrieval date, the measured burden posture and the BUSL-1.1
      note all have to survive.
    command: |-
      bin/venv-python -c "import re,yaml; d=yaml.safe_load(open('docs/ROADMAP-PLATFORM.yaml')); t=next(i for i in d['tier_items'] if i['id']=='T4.15'); cr={c['id']: c for c in t['exit_criteria']}; assert 'c10' in cr, 'c10 absent'; assert cr['c10']['status']=='open', 'c10 must be status open'; y=str(cr['c10']['text']); assert 'clause 5' in y, 'c10 does not name the satisfied prohibited-use clause'; assert 'clause 4' in y, 'c10 does not name the BINDING clause -- the constraint half is missing'; assert '2026-08-21' in y, 'c10 carries no retrieval date for the quoted Terms'; assert re.search(r'disproportionate', y), 'c10 does not quote the burden test'; assert re.search(r'job-minutes|burden posture', y), 'c10 requires no MEASURED burden posture'; assert re.search(r'BUSL', y), 'c10 drops the BUSL-1.1 relicensing note'; assert re.search(r'visibility', y, re.I), 'c10 names no re-evaluation trigger'; print('OK c10 present and complete')"
    expected: "OK c10 present and complete"
    fix_if: >-
      A missing clause-4 identification is the substantive failure -- clause 5 alone understates
      the predicate the spike must discharge.
    hermetic: true
    graduation: waive
    graduation_waiver_reason: >-
      Standing pytest home as in step 2; same single-item contract-assertion and rec-2948
      duplication argument as step 6.
  - step: 8
    phase: pre-deploy
    action: >-
      THE TRIGGER ROWS ARE EXTENDED IN PLACE, NOT DUPLICATED. A standing guard pins the count at
      exactly four; adding rows for the ToS predicate would redden it, and duplicating the A2+ or
      visibility semantics would make two rows fire on one event.
    command: |-
      bin/venv-python -c "import re,yaml; d=yaml.safe_load(open('docs/ROADMAP-PLATFORM.yaml')); tr=d['cost_projection']['executor_substrate_billing']['substrate_reevaluation_triggers']; assert len(tr)==4, 'trigger count changed to %d -- the standing guard pins exactly 4'%(len(tr),); a2=[t for t in tr if 'A2+' in t]; vis=[t for t in tr if re.search(r'visibility', t, re.I)]; assert len(a2)==1, 'expected exactly 1 A2+ row, found %d'%(len(a2),); assert len(vis)==1, 'expected exactly 1 repo-visibility row, found %d'%(len(vis),); tos=re.compile(r'ToS|Terms|usage polic', re.I); assert tos.search(a2[0]), 'the A2+ row does not name the ToS predicate'; assert tos.search(vis[0]), 'the repo-visibility row does not name the ToS predicate'; scale=[t for t in tr if re.search(r'order of magnitude', t, re.I)]; assert len(scale)==1, 'the 100x-scale row that already carries the third ToS trigger is missing or duplicated'; print('OK 4 triggers, A2+ and visibility extended in place')"
    expected: "OK 4 triggers, A2+ and visibility extended in place"
    fix_if: >-
      A count other than 4 means rows were added instead of extended. Revert to in-place edits --
      the third ToS re-evaluation trigger (order-of-magnitude rec growth) is already row 2 verbatim
      and needs no new row.
    hermetic: true
    graduation: waive
    graduation_waiver_reason: >-
      The count half is already enforced in perpetuity by the existing
      test_executor_substrate_billing_block guard; only the in-place-extension half is new, and it
      lands beside it in the same module rather than as a registry duplicate (rec-2948).
  - step: 9
    phase: pre-deploy
    action: >-
      BUNDLED rec-2946 IS DISCHARGED ON BOTH SURFACES. The guard must derive tx_per_rec and rate
      from the roadmap line's own stated assumptions, so that changing the stated assumption
      changes what the guard expects. Proven by feeding the parser a MUTATED line -- a guard that
      still returns 30 and 0.000025 for a line stating 40 is still hardcoded.
    command: |-
      bin/venv-python -c "import json,yaml; from tests.esb_text_fix.test_cost_projection import parse_sfn_assumptions as p; real=yaml.safe_load(open('docs/ROADMAP-PLATFORM.yaml'))['cost_projection']['projected_100tb_scale']['breakdown']['step_functions_transitions']; lo,hi,tx,rate=p(real); assert (tx,rate)==(30,0.000025), 'parser disagrees with the live line, got %r %r'%(tx,rate); mutated=real.replace('30 transitions/rec','40 transitions/rec'); assert mutated!=real, 'the live line does not state its transitions/rec assumption in the expected form'; _,_,tx2,_=p(mutated); assert tx2==40, 'the parser ignored the mutated assumption and returned %r -- still hardcoded (rec-2946)'%(tx2,); spec=json.dumps([e for e in yaml.safe_load(open('config/agent/verification_registry/registry.yaml'))['entries'] if e['check_id']=='sfn-transition-line-arithmetic-consistent'][0]['check_spec']); assert 'tx_per_rec=30' not in spec and 'rate=0.000025' not in spec, 'the graduated registry check still hardcodes the assumptions -- rec-2946 is only half discharged'; print('OK rec-2946 discharged on both surfaces')"
    expected: "OK rec-2946 discharged on both surfaces"
    fix_if: >-
      A parser that ignores the mutation is still hardcoded. A registry check_spec still carrying
      the literals leaves the rec half-open -- fix both or do not claim the rec.
    hermetic: true
    graduation: waive
    graduation_waiver_reason: >-
      This step's whole point is that the arithmetic guard has ONE authoritative definition that
      parses its own inputs; graduating a bash copy of the mutation probe would recreate the second
      hardcoded surface rec-2946 exists to remove.
  - step: 10
    phase: pre-deploy
    action: >-
      THE WHOLE ESB GUARD PACKAGE IS GREEN AND THE LINE CEILING SURVIVES, RE-MEASURED RATHER THAN
      QUOTED. Baseline at authoring time was 7 passed / 8,995 lines.
    command: |-
      bin/venv-python -m pytest tests/esb_text_fix/ -q && bin/venv-python -c "import pathlib; n=len(pathlib.Path('docs/ROADMAP-PLATFORM.yaml').read_text(encoding='utf-8').splitlines()); assert n <= 10000, 'roadmap is %d lines, over the Decision 114 ceiling'%(n,); print('OK roadmap %d lines, %d of headroom'%(n, 10000-n))"
    expected: All esb_text_fix tests pass, then "OK roadmap N lines, M of headroom".
    fix_if: >-
      A red sibling guard means this wave broke a neighbouring ESB assertion. A breached ceiling
      escalates per Decision 147's reversal condition rather than being trimmed ad hoc.
    hermetic: false
    graduation: not-applicable

test_obligations:
  - source: tests/esb_text_fix/test_cost_projection.py
    behavior: >-
      The priced-row provenance guard is a closed enumeration -- an unrecognised or absent
      provenance_class is rejected and each declared class enforces its own needle, retrieval date
      and region rule -- and the SFN arithmetic guard parses tx_per_rec and rate from the line it
      checks rather than hardcoding them.
    verification_step: 10
    test_selector: tests/esb_text_fix/test_cost_projection.py::test_every_cost_line_names_region_and_rate_basis
    red_green_expectation: >-
      Red before, green after. On the pre-change guard the two new rows fail the hardcoded
      "AWS Price List bulk offer files" / "2026-08-01" needle pair, and agentcore additionally
      fails region == eu-west-2 because its published rates are region-unqualified; after the
      amendment both pass through their declared provenance classes while all three decoy rows in
      step 4 are still rejected.
  - source: docs/ROADMAP-PLATFORM.yaml
    behavior: >-
      Schema-valid and acyclic within the Decision 114 ceiling, with the operator estimates, the
      two assessed envelope rows, the narrowed conclusion, the four in-place trigger rows and
      T4.15 c9/c10 all present and structurally well-formed.
    verification_step: 1
    command: bin/venv-python -m scripts.validate
    waiver_reason: >-
      The roadmap is DATA, not behaviour. Its schema, dependency graph, criterion-status integrity
      and line ceiling are owned by the standing validate_platform_roadmap check; the content
      deltas this plan adds are asserted by steps 2-9, each fault-injected against decoy input
      rather than merely observed passing, and each landed as a standing pytest guard in the
      esb_text_fix package that the affected-tests data edge selects on every future roadmap edit.
  - source: config/agent/verification_registry/registry.yaml
    behavior: >-
      The graduated check sfn-transition-line-arithmetic-consistent derives tx_per_rec and rate
      from the roadmap line instead of carrying them as bash literals, and remains registered and
