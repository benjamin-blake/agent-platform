constraints:
  - No rescue agents or workaround loops (Decision 55).
  - >-
    Manifests are Python forever. A YAML manifest silently severs every driver graph edge (the
    oracle's AST scanner sees only Python). This overrides the repo's general machine-parseable
    preference and must be stated in the manifest header comment.
  - >-
    Module fields are bare string literals. No f-strings, no computed constants, no `module:attr`
    combined form -- _PATCH_STRING_RE is anchored and will not match a colon-suffixed literal.
  - >-
    Deriving the module path at the check's own site (`@register(module=__name__)`) is forbidden:
    it yields only a self-edge and drops the driver edge.
  - >-
    resolve() may cache modules but must NEVER cache the resolved callable -- a warm callable cache
    makes patch() silently no-op, which is a vacuous-pass hazard in a merge gate.
  - No module-level `__getattr__` on scripts/validate.py; the PEP 562 bridge is explicitly not shipped.
  - >-
    A manifest may only register targets inside its own package (enforced at compose time), keeping
    colocation honest.
  - Check modules must be import-side-effect-free; laziness changes when module scope executes.
  - >-
    The entry point, _schema.py, registry.py and every manifest are stdlib-only -- the venv-less
    required terraform-validate check wedges every PR if this is violated (Decision 83/148).
  - >-
    The oracle's failure bias is select-everything, never select-nothing: if the graph errors or a
    file will not parse, fall back to running the full set.
  - Scope is scripts/validate.py only; no other 450-500 SLOC file is touched by this plan.
