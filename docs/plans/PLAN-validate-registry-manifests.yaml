bundled_recommendations: []
infrastructure_dependencies: []
acceptance_criteria:
  - scripts/validate.py contains zero `from scripts.checks.<domain>...` re-export lines and is at or below 300 SLOC.
  - scripts/validate.py SLOC is invariant to check count -- adding a check touches only its module, its domain manifest, and the golden file.
  - Every registered check resolves via registry.resolve() and is callable; no check is reachable through an entry-module attribute.
  - Derived per-tier sequences are byte-identical to the sequences derived from the pre-change structure (zero behavioural reordering).
  - Every manifest module field is a bare string literal that full-matches dependency_graph._PATCH_STRING_RE (no `module:attr` combined form).
  - For every domain, a synthetic change to a check module selects both that check's own test module and the driver test module in the affected set.
  - String-derived graph edges per manifest equal len(ENTRIES) for that manifest.
  - No `patch("validate.<check>")` / `patch("scripts.validate.<check>")` sites remain outside an explicit scaffolding/stdlib allowlist.
  - "`python -m scripts.validate --terraform-only` succeeds with only pyyaml+pydantic installed."
  - scripts/validate.py defines no module-level `__getattr__`, and dispatch is registry.resolve (not globals(), not sys.modules attribute access).
  - Every public check function under scripts/checks/** is registered in exactly one manifest, or the orphan test fails naming the file and the fix.
  - docs/DECISIONS.md carries the three-condition applicability test and states explicitly that scripts/checks/_scaffolding.py does NOT qualify.
verification_plan:
  - step: 1
    phase: pre-deploy
    action: Prove the entry point shed the linear term and no manifest/registry is near budget.
    command: 'bin/venv-python -c "import pathlib; s=lambda p: len([l for l in pathlib.Path(p).read_text().splitlines() if l.strip() and not l.strip().startswith(chr(35))]); v=s(chr(115)+chr(99)+chr(114)+chr(105)+chr(112)+chr(116)+chr(115)+chr(47)+chr(118)+chr(97)+chr(108)+chr(105)+chr(100)+chr(97)+chr(116)+chr(101)+chr(46)+chr(112)+chr(121)); r=s(\"scripts/checks/registry.py\"); ms=[(str(p),s(p)) for p in pathlib.Path(\"scripts/checks\").rglob(\"_manifest.py\")]; assert v<=300, (\"validate.py\", v); assert r<=400, (\"registry.py\", r); assert all(n<=200 for _,n in ms), ms; print(\"validate.py\", v, \"registry.py\", r, \"manifests\", len(ms), \"max\", max(n for _,n in ms))"'
    expected: validate.py at or below 300 SLOC; registry.py at or below 400; every manifest at or below 200.
    fix_if: validate.py still over 300 means residual facade lines or driver code that belongs in the registry.
    hermetic: true
    graduation: waive
    graduation_waiver_reason: >-
      Duplicates the standing validate_sloc_limits gate for the absolute ceiling; the per-file
      thresholds here are this plan's transient design targets, not durable repo invariants, so
      graduating them would pin arbitrary numbers into the registry.
  - step: 2
    phase: pre-deploy
    action: Parity proof -- derived sequences must byte-match the sequences derived from the pre-change structure.
    command: 'bin/venv-python -m pytest tests/checks/test_sequence_snapshot.py -q'
    expected: Golden file reproduces exactly; zero reordering introduced by the rewiring.
    fix_if: A diff means derived phase-by-domain order does not match the legacy hand-ordered lists; force the order rather than accept the drift.
    hermetic: true
    graduation: graduate
    graduation_check_id: "validate-tier-sequence-parity-snapshot"
  - step: 3
    phase: pre-deploy
    action: Guard the colon bug -- every manifest module literal must be graph-matchable.
    command: 'bin/venv-python -c "import pathlib,ast; from scripts.dependency_graph import _PATCH_STRING_RE as R; bad=[]; [bad.extend([(str(p),n.value) for n in ast.walk(ast.parse(p.read_text())) if isinstance(n,ast.Constant) and isinstance(n.value,str) and n.value.startswith(\"scripts.checks.\") and not R.match(n.value)]) for p in pathlib.Path(\"scripts/checks\").rglob(\"_manifest.py\")]; assert not bad, bad; print(\"all manifest module literals graph-matchable\")"'
    expected: Empty list -- no combined module:attr strings, no f-strings, no computed constants.
    fix_if: Any hit is a severed graph edge; convert to a two-field bare-literal Entry.
    hermetic: true
    graduation: graduate
    graduation_check_id: "manifest-module-literals-graph-matchable"
  - step: 4
    phase: pre-deploy
    action: Chain sentinel -- a synthetic change to a check module must select its own test and the driver test.
    command: 'bin/venv-python -m pytest tests/checks/test_manifest_graph_sentinels.py -q -k chain'
    expected: For every domain, the affected set contains the check's own test module AND the driver test module.
    fix_if: A miss means the literal-edge chain is severed -- --pre would vacuously pass on that check.
    hermetic: true
    graduation: graduate
    graduation_check_id: "affected-set-chain-sentinel-per-domain"
  - step: 5
    phase: pre-deploy
    action: Cardinality sentinel -- string-derived edges per manifest must equal len(ENTRIES).
    command: 'bin/venv-python -m pytest tests/checks/test_manifest_graph_sentinels.py -q -k cardinality'
    expected: Edge count equals entry count for every manifest.
    fix_if: A mismatch catches the whole drift class at once -- computed strings, YAML-ification, a changed regex, a renamed scanner.
    hermetic: true
    graduation: graduate
    graduation_check_id: "manifest-string-edge-cardinality"
  - step: 6
    phase: pre-deploy
    action: Seam-migration completeness -- no hub patches remain outside the allowlist.
    command: 'bin/venv-python -m pytest tests/test_checks_registry.py -q -k seam_migration'
    expected: Zero patch("validate.<check>") sites; only allowlisted scaffolding/stdlib targets (shutil, time, run_*, _file_budget_*) remain.
    fix_if: A remaining hub patch means the seam migration is incomplete and the old coupling survives.
    hermetic: true
    graduation: graduate
    graduation_check_id: "no-validate-hub-check-patches"
  - step: 7
    phase: pre-deploy
    action: Resolution contract -- every registered entry imports, resolves, is callable, and attributes its failures.
    command: 'bin/venv-python -m pytest tests/test_checks_registry.py tests/checks/test_validation_result.py -q -k "resolution or duplicate or cross_package or attribution or dispatch"'
    expected: All entries resolve; duplicate names and cross-package targets are rejected at compose time; dispatch_recording attributes labels via the resolver callable.
    fix_if: A failure names the bad target -- this is the run-time-error class that replaces import-time checking.
    hermetic: true
    graduation: graduate
    graduation_check_id: "registry-entries-resolve"
  - step: 8
    phase: pre-deploy
    action: Orphan detection -- every public check under scripts/checks/** is registered exactly once.
    command: 'bin/venv-python -m pytest tests/test_checks_registry.py -q -k orphan'
    expected: No unregistered public check. This is a NEW guarantee -- today an exported-but-unregistered check silently never gates.
    fix_if: Failure message must name the file and the exact Entry line to add to the sibling _manifest.py.
    hermetic: true
    graduation: graduate
    graduation_check_id: "no-unregistered-checks"
  - step: 9
    phase: pre-deploy
    action: Spine import-closure -- entry point, schema, registry and all manifests stay stdlib-only.
    command: 'bin/venv-python -m pytest tests/test_checks_registry.py -q -k import_closure'
    expected: Resolving the terraform tier pulls in nothing beyond pyyaml+pydantic; the spine imports no third-party module.
    fix_if: A violation wedges the required terraform-validate check on every PR (Decision 83/148).
    hermetic: true
    graduation: graduate
    graduation_check_id: "spine-stdlib-only-import-closure"
  - step: 10
    phase: pre-deploy
    action: No-bridge assertion -- dispatch is registry-bound, not module-attribute-bound.
    command: 'bin/venv-python -c "import pathlib,ast,re; src=pathlib.Path(\"scripts/validate.py\").read_text(); t=ast.parse(src); assert not [n for n in t.body if isinstance(n,ast.FunctionDef) and n.name==\"__getattr__\"], \"module __getattr__ present -- bridge must not ship\"; assert \"globals()[\" not in src, \"globals() dispatch survives\"; assert not re.search(r\"from scripts\\.checks\\.\\w+\", src), \"facade re-export lines survive\"; assert \"registry.resolve\" in src, \"registry.resolve dispatch absent\"; print(\"dispatch is registry-bound; no bridge, no facade\")"'
    expected: No module __getattr__, no globals() dispatch, no domain re-export lines, registry.resolve present.
    fix_if: Any assertion firing means a retired mechanism survived the migration.
    hermetic: true
    graduation: graduate
    graduation_check_id: "entry-point-dispatch-is-registry-bound"
  - step: 11
    phase: pre-deploy
    action: Stale-reference sweep (closure obligation) -- the retired surface is unreachable repo-wide.
    command: 'bin/venv-python -c "import subprocess,sys; pats=[r\"from scripts\\.validate import\", r\"# noqa: F401,E402\"]; hits=[]; [hits.extend([(p,l) for l in subprocess.run([\"git\",\"grep\",\"-n\",\"-E\",p,\"--\",\"scripts/\",\"tests/\",\"config/\"],capture_output=True,text=True).stdout.splitlines()]) for p in pats]; hits=[h for h in hits if \"_manifest.py\" not in h[1]]; print(chr(10).join(str(h) for h in hits) or \"no stale facade references\"); sys.exit(1 if hits else 0)"'
    expected: No surviving `from scripts.validate import` consumer and no orphaned facade noqa markers.
    fix_if: A hit means a caller still depends on the retired hub surface.
    hermetic: true
    graduation: graduate
    graduation_check_id: "facade-surface-retired"
  - step: 12
    phase: pre-deploy
    action: Terraform tier runs venv-less with only pyyaml+pydantic (the required-check wedge risk).
    command: 'bin/venv-python -c "import subprocess,sys,os; e=dict(os.environ, CI=\"true\"); r=subprocess.run([sys.executable,\"-m\",\"scripts.validate\",\"--terraform-only\"],capture_output=True,text=True,encoding=\"utf-8\",errors=\"replace\",env=e); print(r.stdout[-1500:]); assert \"ModuleNotFoundError\" not in r.stderr, r.stderr[-1500:]; print(\"terraform tier imports clean\")"'
    expected: No ModuleNotFoundError; lazy resolution keeps heavy check deps off the terraform path.
    fix_if: An eager import sweep re-introduces the networkx failure class and wedges every PR.
    hermetic: false
    graduation: waive
    graduation_waiver_reason: >-
      Superseded as a standing guard by the step-9 import-closure test, which asserts the same
      invariant hermetically and without spawning a subprocess; this step is the end-to-end
      confirmation for this migration only.
  - step: 13
    phase: pre-deploy
    action: Full presubmit passes end to end.
    command: 'bin/venv-python -m scripts.validate'
    expected: Exit 0, all checks pass, and the summary shows the same check roster as before the change.
    fix_if: Any regression in the gate itself blocks the migration.
    hermetic: false
    graduation: not-applicable
  - step: 14
    phase: pre-deploy
    action: Precedent is documented with an explicit non-applicability call-out.
    command: 'bin/venv-python -c "import pathlib; d=pathlib.Path(\"docs/DECISIONS.md\").read_text(); need=[\"table-shaped\",\"logic-shaped\",\"_scaffolding.py\"]; missing=[n for n in need if n not in d]; assert not missing, missing; print(\"precedent + applicability test + non-applicability call-out present\")"'
    expected: The amends entry carries the growth-shape distinction, the three-condition test, and names _scaffolding.py as NOT qualifying.
    fix_if: Absent text invites the pattern being cargo-culted onto logic-shaped files.
    hermetic: true
    graduation: waive
    graduation_waiver_reason: >-
      A substring probe on prose is a weak proxy for the precedent actually being sound; the real
      check is plan-critique and the three-round review reading the decision text. Graduating a
      grep would create false confidence in a documentation-quality guarantee.
