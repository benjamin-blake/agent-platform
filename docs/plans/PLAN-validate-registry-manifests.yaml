schema_version: 4
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: "validate-registry-manifests"
intent: >-
  Retire scripts/validate.py's 207-SLOC facade re-export block -- the file's only term that grows
  with the check count -- by moving check wiring into per-domain declarative manifests dispatched
  through registry.resolve(), so the CI entry point's size becomes O(1) in check count and the
  500-SLOC ceiling stops being a recurring tax on every plan that adds a gate.
plan_type: IMPLEMENTATION
verification_tier: V2
plan_path: docs/plans/PLAN-validate-registry-manifests.yaml
phase: >-
  Platform hygiene / SLOC governance (Decision 128 decompose-by-default). Precedent-setting for the
  ~10 other repo files at 450-500 SLOC; establishes the table-shaped vs logic-shaped growth
  distinction and its applicability test.
scope:
  - file: scripts/validate.py
    action: Modify
    purpose: >-
      Delete the 207-SLOC facade re-export block and the networkx deferred-import workaround;
      dispatch via registry.resolve(name)(failed) instead of globals()[name]. No module __getattr__.
  - file: scripts/checks/_schema.py
    action: Create
    purpose: >-
      Stdlib-only Entry dataclass (name, module, attr, tiers, pre_globs, owner, product_coupled).
      Leaf module imported by manifests AND registry, so neither imports the other (cycle break).
  - file: scripts/checks/registry.py
    action: Modify
    purpose: >-
      Compose ENTRIES from all domain manifests; add resolve(name); derive pre/full sequences by
      tier tag; reject duplicate names and cross-package targets at compose time. Retain Step and
      the scaffold-step sequence entries.
  - file: scripts/checks/ci_guards/_manifest.py
    action: Create
    purpose: Declarative ENTRIES for the ci_guards domain (module paths as bare string literals).
  - file: scripts/checks/contracts/_manifest.py
