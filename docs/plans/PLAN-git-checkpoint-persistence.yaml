execution_steps:
  - >-
    ORDER MATTERS -- land the marker guarantee before anything emits checkpoint commits, so no window
    exists in which a checkpoint can strip a marker subject. Steps run in the order below; all of it ships
    in ONE PR so there is no cross-PR window either.
  - >-
    Add --allow-empty to all SIX named marker-commit invocations - .claude/skills/implement/SKILL.md
    (feat({slug}) in the IMPLEMENTATION Commit Flow AND the path-limited roadmap({ids}) bookkeeping commit
    at ~:328, which is the most vulnerable of the six because a path-limited commit finds nothing staged
    once `git add -A` has checkpointed the file), .claude/commands/plan.md (Steps 8 and 11; adjust Step
    11's "this commit may be empty -- skip it" caveat, which --allow-empty makes obsolete),
    .claude/commands/audit.md, and .claude/skills/planning/SKILL.md Step 10. Absorb the added bytes at zero
    net cost by local rewording on the two byte-capped skill surfaces (in planning/SKILL.md, dropping " on
    the branch" is exactly the 14 bytes " --allow-empty" adds).
  - >-
    Create scripts/checks/verification/validate_commit_markers.py. Declare the prefix registry as module
    constants - markers feat, plan, roadmap, scope, audit, fix, docs; checkpoint wip. Read `git log
    origin/main..HEAD --format=%s`; fail when at least one checkpoint-prefix subject is present and zero
    marker-prefix subjects are; treat merge commits and any unrecognised subject as neutral. Use
    scripts.checks._common.origin_main_reachable for the advisory-SKIP leg (never fail) rather than a new
    call site. Never raise at import (AGENTS.md Safety). The failure message states the universal
    obligation and names --allow-empty as the remedy. Keep the module under 500 SLOC and write it for 100%
    line coverage, which validate_test_coverage requires for scripts/.
  - >-
    Register it - one Entry in scripts/checks/verification/_manifest.py with bare string literals for
    module and attr, pre=True with pre_globs=None so it runs unconditionally in the --pre tier,
    full_segment full_after_lint; and one config/ci_rca_taxonomy.yaml function_to_category row mapping it
    to code_regression.
  - >-
    Write tests/checks/verification/test_validate_commit_markers.py - the marker seam (checkpoint-only
    branch fails; passes once a marker exists), every registered marker prefix, merge-commit neutrality,
    and the unreachable-origin advisory skip. Use scratch git repos, not the live repo.
  - >-
    Create .claude/hooks/stop_checkpoint_push.py. Its module docstring is the contract of record -- state
    the mechanism, the refusal set, the fail-open rule, the retry-once rule, and the known limitations, in
    the style of never_on_main.py's docstring. Read the Stop payload from stdin, fail-open on malformed
    JSON. Resolve the repo root from __file__. Branch via CLAUDE_HOOK_BRANCH_OVERRIDE or `git branch
    --show-current`. Refuse silently on - git unavailable, detached HEAD, branch main, or
    mid-rebase/merge/cherry-pick (unmerged paths, or .git/rebase-merge, .git/rebase-apply, MERGE_HEAD,
    CHERRY_PICK_HEAD present). Then - if the tree is dirty, capture index cleanliness, `git add -A`, and
    commit with the shared checkpoint-subject constant, whose rendered form is `wip({branch}): turn
    checkpoint` -- colon included, imported by both this hook and the guard from ONE definition, never
    re-typed (pre-commit chain runs; NEVER --no-verify); if the commit fails AND the tree changed because
    the hooks rewrote files, re-stage
    and retry EXACTLY ONCE; on final failure restore the index if it was clean, emit a systemMessage
    warning, exit 0. Push when anything is genuinely unpushed, guarded by a containment test so a
    squash-merged branch is never recreated; on non-fast-forward rejection retry --force-with-lease with NO
    preceding fetch; on any push failure warn and exit 0. Bound every subprocess with a timeout. Exit 0 on
    every path.
  - >-
    Register the hook in .claude/settings.json under a new "Stop" key using the same group form the
    existing SessionStart block uses, with an explicit timeout well under the 600s default. Do NOT add a
    matcher field.
  - >-
    Write tests/hooks/test_stop_checkpoint_push.py - load the module via importlib from path
