  - >-
    Decision-scout flag resolutions, all human-confirmed at Step 6b. D127: bundle rec-2362 as the
    AGENTS.md byte offset, absorb planning/SKILL.md at zero net bytes, take minimal
    Decision-170-authorized raises for S1 and implement/SKILL.md only. D132: build the structural
    marker guard IN THIS PLAN rather than relying on a skill instruction -- Decision 132's own
    reversal condition says to revisit the resolution mechanism when the feat({slug}) false negative
    proves material, and this hook makes it material by construction. D163: keep fail-open, but word
    the AGENTS.md invariant honestly -- the POLICY is absolute (unpushed work never existed), the
    MECHANISM is best-effort and loud. D165: Decision 170's body names both budget entries by path.
    D168: closed by the guard reading AGENTS.md's table directly.
  - >-
    REJECTED ALTERNATIVE (design change made during authoring, after Step 6b): a separate
    docs/contracts/commit-grammar.yaml holding the prefix registry. Dropped for two reasons. (1)
    docs/contracts/contract-population.yaml pins status_active_max: 16 bound to the live census BY
    EQUALITY -- validate_contract_drift fails in either direction -- so a new active Class D contract
    needs a pin raise, and that pin's raise_mechanism requires a NEW numbered Decision naming the key,
    stacking a third budget-raise authorization onto Decision 170. (2) A YAML copy of AGENTS.md's
    conventions table is precisely the two-surfaces-to-sync anti-pattern AGENTS.md's Agent-First
    section forbids ("One file is better than two files covering the same subject"). Having the guard
    parse the AGENTS.md table directly closes the Decision 168 flag more convincingly -- the registry
    gains a real reader instead of a second copy.
  - >-
    REJECTED ALTERNATIVE: detecting unpushed work by counting commits ahead of a fallback upstream.
    Observed live during this planning session -- the harness Stop hook (below) reported "2 unpushed
    commit(s)" on a branch whose HEAD was exactly origin/main. Mechanism, read from its source: when
    origin/$current_branch does not resolve it falls back to upstream="origin/HEAD" and counts
    `git rev-list origin/HEAD..HEAD`, so a freshly-rebased branch with no remote head yet counts the
    commits the rebase pulled in -- commits already on main. This hook must key the dirty-tree trigger
    on `git status --porcelain`, and the unpushed-commit trigger on an explicit upstream comparison
    that treats a MISSING upstream as "nothing unpushed unless ahead of origin/main" -- never on an
    ahead-count against a substituted ref.
  - >-
    HARNESS STOP HOOK INTERACTION (load-bearing -- read before writing this hook). The CC-web
    container ships its own Stop hook at ~/.claude/stop-hook-git-check.sh, registered in
    ~/.claude/launcher-settings.json (there is no ~/.claude/settings.json). It is CCR
    infrastructure, root-owned, re-provisioned per container, NOT repo-tracked and NOT removable
    from this repo. It EXITS 2 -- blocking the turn end and handing the message back to the model --
    on (a) uncommitted changes, (b) untracked files, (c) unpushed commits, and (d) local commits
    whose committer email is not noreply@anthropic.com or that carry no gpgsig header. Consequences
    for this plan: (1) it is the incumbent model-owns-persistence enforcement this invariant
    replaces, and its exit-2 blocking is the churn this plan removes; (2) both Stop hooks run and
    cross-source ordering is not guaranteed -- if this repo's hook runs first the harness hook then
    sees a clean tree, a resolved upstream and zero unpushed commits and exits 0 silently; if it runs
    first there is one blocked boundary and silence from the first checkpoint onward. Either order
    converges, which is why fail-open is safe here; (3) checkpoint commits MUST inherit the session
    signing config (commit.gpgsign=true, user.email=noreply@anthropic.com) -- never pass
    -c commit.gpgsign=false or otherwise suppress signing, or every checkpoint trips the harness
    hook's signing leg. Do NOT chase that leg with --amend --reset-author (AGENTS.md commit-signing
    subsection forbids it).
  - >-
    THE SEAM THIS PLAN EXISTS TO PROTECT: scripts/checks/_common.py:208 feat_commit_slugs() resolves
    plans from feat({slug}) subjects on `git log origin/main..HEAD`. Consumers:
    validate_vp_replay.py:150,174 and validate_graduation_completeness.py:186. Once every turn
    boundary checkpoints, `git add -A && git commit -m "feat({slug}): ..."` finds nothing staged,
    fails with "nothing to commit", and leaves no marker -- both gates silently take their
    plan-only/DEFER leg. Decision 132 disclosed this as an incidental false negative; this hook makes
    it systematic. --allow-empty is the mechanism; validate_commit_markers is the enforcement.
  - >-
    Stop-hook harness semantics, verified against the live Claude Code hooks documentation: the Stop
    event supports NO matcher field; input carries session_id, cwd, stop_hook_active and
    last_assistant_message; exit 0 sends stderr to the DEBUG LOG ONLY (Claude never sees it), exit 2
    blocks stopping, and the supported JSON output fields are continue/stopReason, systemMessage and
    terminalSequence (decision/reason are NOT used for Stop). The default hook timeout is 600s, which
    is why this plan sets an explicit shorter one.
  - >-
    Probed and confirmed in a scratch repo during planning: a pre-commit rejection exits 1 and leaves
    files STAGED, and a plain `git reset` cleanly restores the unstaged state with all work intact --
    this is why the hook captures index-cleanliness before staging and only restores when the index
    was clean beforehand (restoring unconditionally would unstage what the agent had staged). Push to
    a local bare remote uses no sockets, so the integration tests are hermetic under the repo's
    --disable-socket addopts.
  - >-
    Test-environment gotcha: the container sets commit.gpgsign=true globally with an SSH signer.
    Scratch repos created by the tests must set user.email, user.name AND commit.gpgsign=false
    locally, or every test commit attempts to sign and fails. The hook itself inherits the session's
    signing config, so real checkpoint commits are signed like any other (AGENTS.md commit-signing
    subsection needs no change).
  - >-
    CI cost is bounded and was checked: ci.yml fires only on pull_request to main and push to main,
    so a checkpoint push to a claude/* branch with no open PR triggers no workflow at all; with an
    open PR it fires pr-validate, whose concurrency group pr-validate-${{ github.ref }} sets
    cancel-in-progress: true. Residual disclosed risk: a checkpoint push while a PR is open replaces
    the PR head with a WIP state, so the implement flow's existing "confirm check runs before
    merging" step is what prevents merging an unvalidated checkpoint.
  - >-
    T4.1 Freshness Gate result (run at planning time): NOT silently complete (no src/lambdas/pick_rec/,
    no terraform/personal/executor_*.tf); no stale references requiring re-grounding -- the
    agent/{slug} branch naming in prepare_workspace is executor-substrate-scoped and is NOT the
    CC-web "never create an agent/ branch" rule, so it stands; no supersession (T4.1 owns the
    substrate and glue, T4.2 the personas, per T4.1's own intent); gating CD.43 is pending and
    constrains this annotation's wording (see constraints).
  - >-
    Branch was 2 commits behind origin/main at planning time; overlapping scope files: none (the two
    commits were unrelated plan documents). Rebased onto origin/main at f4c4f39 during planning at
    the human's direction, before the plan was written.
  - >-
    DRAFTED DECISION 170 (authored at /implement time, NOT during planning -- Decision 105 reserves
    execution for /implement). Re-check the current max '## Decision NNN:' header first; a concurrent
    PR may have claimed 170, and shifting to the next free number at execution time is safe (the
    referential guard catches header mismatches). If the number shifts, update the two
    config/prose_budgets.yaml markers, VP steps 9 and 11, and this plan's references in the same
    commit. Header - "## Decision 170: Substrate-owned git persistence -- the orchestrating layer,
    never the model, commits and pushes at every unit-of-work boundary (Decided)". Envelope - yaml
    block with number 170, status Decided, decided_date, significance.value numbered_decision and a
    justification naming the durable commitment. Problem - git persistence has been a model
    responsibility on every substrate this platform runs; on CC-web the container hibernates between
    turns and is reclaimed after inactivity, so any turn ending with uncommitted or unpushed work is
    one reclamation from losing it, and the loss is silent and model-tier-correlated (a lower-tier
    model that forgets to push loses work a higher-tier model keeps, making durability a function of
    model choice rather than of the platform). Decision - no model, of any tier, on any substrate, is
    responsible for git persistence; the orchestrating layer owns it at every unit-of-work boundary
    (CC-web - the Stop hook; executor - the step wrapper, T4.1, offered to CD.43 as a design input
    and not a store selection); unpushed work is treated as never having existed; persistence is
    fail-open but never gate-bypassing (the pre-commit chain gates every checkpoint, --no-verify is
    never used, the on-main prohibition holds on every path); checkpoint commits are registered
    grammar (wip({branch})) that collapse at squash-merge, and named marker commits use --allow-empty
    so their subjects survive for the grammar consumers. Budget-authorization clause (REQUIRED by
    Decision 165) - this Decision authorizes raising config/prose_budgets.yaml entries
    root_ambient_load_set and .claude/skills/implement/SKILL.md by exactly the bytes this Decision's
    invariant and marker-commit rule add to those two surfaces, offset first by the rec-2362
    de-duplication; no other entry is authorized. Reversal conditions - (a) if turn-boundary
    checkpointing measurably degrades the interactive loop (turn-end latency or CI churn), narrow the
    trigger, never move persistence back onto the model; (b) if fail-open proves to hide real losses,
    add a detection path (a session-start stranded-branch check), never convert the hook to exit 2 and
    wedge turn ends; (c) if CD.43 selects a workspace backing store incompatible with
    remote-branch-as-state-medium, the executor half of this invariant re-expresses itself in terms of
    that store -- the model-never-owns-persistence clause survives regardless. Rationale - persistence
    is a substrate property; making it a model responsibility makes durability a function of model
    diligence, which is exactly the class of thing the platform exists to remove from the model's
    plate. Significance - clears the Decision 150 bar - durable architectural commitment,
    reversal-relevant, and no cd_state_flip/operational_fact/field_semantics row owns it. Related -
    Decision 76 (hibernating container, the premise), Decision 138 (layered on-main guards), Decision
    148 and Decision 132 (the VP-replay legs this plan's marker guard protects), Decision 163
    (universal obligations enforced structurally -- the honesty wording), Decision 165 (the
    authorization mechanism this entry's budget clause satisfies), Decision 167 (envelope), Decision
    39 and Decision 67 (Step Functions substrate; executor freeze), Decision 86 (forward intent to
    tier_items - the T4.1 note). Roadmap refs - T4.1, CD.43, audits/gitops-agent-first-ddfb9cc.yaml.
pre_implementation_checklist:
  - Branch confirmed not on main
  - docs/PROJECT_CONTEXT.md read
  - only the plan-cited decision sections
  - All files in scope located and readable
  - Acceptance criteria understood and verifiable
  - >-
    Re-read the live Claude Code Stop-hook contract before writing the hook (matcher support, exit
    codes, JSON output fields) -- the harness surface is not repo-editable and may have moved.
  - >-
    Re-check the current max '## Decision NNN:' header in docs/DECISIONS.md before authoring
    Decision 170.
execution_steps:
  - >-
    ORDER MATTERS -- land the marker guarantee before anything emits checkpoint commits, so no window
    exists in which checkpoints can strip a marker subject. Steps run in the order below; all of it
    ships in ONE PR so there is no cross-PR window either.
  - >-
    Add --allow-empty to all five named marker-commit invocations - .claude/skills/implement/SKILL.md
    (feat({slug}), plus the checkpoint-commit note), .claude/commands/plan.md (both plan({slug})
    commits at Steps 8 and 11; adjust Step 11's "this commit may be empty -- skip it" caveat, which
    --allow-empty makes obsolete), .claude/commands/audit.md (audit({slug})), and
    .claude/skills/planning/SKILL.md Step 10 (reword to absorb the 14 added bytes at zero net cost --
    the surface has 6 bytes of headroom; dropping " on the branch" is exactly -14).
  - >-
    AGENTS.md - remove the duplicated validate.py SSOT sentence (rec-2362; keep ONE of the two at
    lines ~188 and ~246), add the wip({branch}) row to the commit-message conventions table, and add
    the substrate-owned-persistence invariant to '## Git-ops procedure'. Word the invariant per the
    Decision 163 resolution - the policy is absolute, the mechanism is best-effort and loud. Note the
    existing precedent that .claude/commands/plan.md Step 8 already mandates push-on-commit.
  - >-
    Create scripts/checks/verification/validate_commit_markers.py - parse AGENTS.md's commit-message
    conventions table into the registered prefix set with each row's role (marker vs checkpoint);
    read `git log origin/main..HEAD --format=%s`; fail when >=1 checkpoint-prefix subject is present
    and 0 marker-prefix subjects are; advisory-SKIP (never fail) when origin/main is unreachable,
    mirroring validate_vp_replay's disclosed limitation. Never raise at import (AGENTS.md Safety).
    Failure message must name --allow-empty as the remedy.
  - >-
    Register it - one Entry in scripts/checks/verification/_manifest.py with bare string literals for
    module and attr (never a combined "module:attr"), pre=True with pre_globs=None so it runs
    unconditionally in the --pre tier, full_segment="full_after_lint"; and one
    config/ci_rca_taxonomy.yaml function_to_category row mapping it to code_regression (matching its
    verification-domain siblings validate_vp_replay and validate_graduation_completeness).
  - >-
    Write tests/checks/verification/test_validate_commit_markers.py - the marker seam (checkpoint-only
    branch fails; passes once a marker exists), the AGENTS.md table parse, and the unreachable-origin
    advisory skip. Use scratch git repos, not the live repo.
  - >-
    Create .claude/hooks/stop_checkpoint_push.py. Read the Stop payload from stdin, fail-open on
    malformed JSON. Resolve the repo root from __file__. Branch via CLAUDE_HOOK_BRANCH_OVERRIDE or
    `git branch --show-current`, mirroring never_on_main.py's seam. Refuse silently on - git
    unavailable, detached HEAD, branch == main, or mid-rebase/merge/cherry-pick (unmerged paths, or
    .git/rebase-merge, .git/rebase-apply, MERGE_HEAD, CHERRY_PICK_HEAD present). Then - if the tree is
    dirty, capture index cleanliness, `git add -A`, `git commit -m "wip({branch}): turn checkpoint"`
    (pre-commit chain runs; NEVER --no-verify); on rejection restore the index if it was clean, emit a
    systemMessage warning, exit 0. Push whenever there is anything unpushed (a fresh checkpoint, OR a
    clean tree with commits ahead of the upstream, OR no upstream and ahead of origin/main) via `git
    push -u origin HEAD`; on non-fast-forward rejection retry `--force-with-lease` with NO preceding
    fetch; on any push failure emit a systemMessage warning naming the branch and exit 0. Bound every
    subprocess with a timeout. Exit 0 on every path.
  - >-
    Register the hook in .claude/settings.json under a new "Stop" key using the same group form the
    existing SessionStart block uses, with an explicit timeout well under the 600s default. Do NOT
    add a matcher field -- Stop does not support one.
  - >-
    Write tests/hooks/test_stop_checkpoint_push.py - load the module via importlib from path
    (tests/hooks/test_fresh_branch_base.py pattern). Cover every refusal, the dirty-tree
    commit-and-push against a local bare remote, the clean-tree-but-unpushed push, the
    no-push-when-not-ahead case, pre-commit rejection with index restore (install a synthetic failing
    .git/hooks/pre-commit in the scratch repo), non-fast-forward -> --force-with-lease, push-failure
    fail-open, the never---no-verify assertion, and the settings.json registration. Set user.email,
    user.name and commit.gpgsign=false in every scratch repo.
  - >-
    docs/ROADMAP-PLATFORM.yaml - append a dated progress_note bullet to T4.1 naming this plan,
    recording the step-wrapper contract - each state-machine step fetches the branch at the SHA handed
    to it by Step Functions, does its work, commits and pushes via wrapper code (the step_commit.py
    pattern; push is part of the step because Lambda has no durable filesystem), and returns the new
    SHA as step output, with retried steps idempotent against remote state by SHA comparison. State
    EXPLICITLY that remote-branch-as-state-medium is offered as a CANDIDATE input to CD.43's W1-W8
    evaluation and selects no store. Record-only - no executor code.
  - >-
    Author Decision 170 in docs/DECISIONS.md from the draft in context, including the
    budget-authorization clause naming both prose_budgets entries by path. Re-check the max header
    number first and shift if raced.
  - >-
    Measure the edited prose surfaces and set config/prose_budgets.yaml to the EXACT post-edit byte
    counts - root_ambient_load_set = wc -c CLAUDE.md + wc -c AGENTS.md, and
    .claude/skills/implement/SKILL.md = its own wc -c. Add '# raise-approved: dec-170 <reason>' to
    each raised entry. Seed no slack. Confirm planning/SKILL.md still fits without a raise.
  - >-
    Execute the Verification Plan -- run each step; loop until pass; on unrecoverable failure stop and
    RCA (Decision 55).
  - >-
    Report - what was implemented, verification results, and the exact byte deltas taken on each
    raised prose budget.
rollback: >-
  Single-PR revert. The hook is inert once its settings.json Stop block is removed, so a partial
  rollback (drop the Stop registration, keep the marker guard and --allow-empty edits) is safe and
  is the preferred first response if checkpointing proves disruptive -- the marker guard is a no-op
  on branches that carry no checkpoint commits, and --allow-empty is harmless without it.
