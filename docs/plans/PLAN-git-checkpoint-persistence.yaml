  - source: docs/DECISIONS.md
    behavior: Decision 170 exists with the Decision 167 typed envelope and names both budget entries.
    verification_step: 11
    command: test "$(grep -c '^## Decision 170:' docs/DECISIONS.md)" = "1"
    red_green_expectation: red before (no such header), green after.
constraints:
  - No rescue agents or workaround loops (Decision 55). On an unrecoverable failure, stop and RCA.
  - >-
    Decision 67 executor freeze -- the T4.1 annotation is RECORD-ONLY. Write no executor code, no
    src/lambdas/ persona or glue module, no terraform. The progress_note is the entire deliverable
    for that half.
  - >-
    CD.43 non-pre-emption -- the T4.1 annotation must present the remote-branch-as-state-medium
    property as a CANDIDATE design input to be evaluated against CD.43's W1-W8 criteria, never as a
    selection. CD.43 is pending and states it selects NO store; T4.1's own exit criterion says the
    backing store is 'not implied by prepare_workspace's implementation'. Wording that asserts the
    selection makes CD.43's criteria decorative, which CD.43's detail explicitly forbids.
  - >-
    Never --no-verify, under any path, in the hook or in any flow surface. The pre-commit chain
    (detect-secrets, the shape-based never-commit pygrep hook, ruff) is the security gate and must
    keep gating every checkpoint. A rejected checkpoint leaves work uncommitted and warns loudly.
  - >-
    The hook must never block the turn: exit 0 on every path, never exit 2, never emit
    continue:false. Stop-hook exit-0 stderr goes to the debug log only, so every warning must be a
    {"systemMessage": ...} JSON object on stdout.
  - >-
    Never bare --force. The divergence path uses --force-with-lease with NO preceding fetch of the
    branch -- fetching first refreshes the remote-tracking ref and defeats the lease. On lease
    failure, warn and leave the commit local.
  - >-
    Respect the never_on_main.py hard rule on every path. The hook invokes git directly and so
    bypasses the PreToolUse guard entirely; it must implement its own main refusal as a third layer
    behind never_on_main.py and pre-commit's no-commit-to-branch (Decision 138 authorizes the
    layering).
  - >-
    Do NOT push when the branch has no commits ahead of origin/main. Minting an empty remote head at
    the first turn end of every read-only session is the stale-branch debris GITOPS-04 flags.
  - >-
    Checkpoint commits inherit the session signing config unchanged -- never pass
    -c commit.gpgsign=false, -c user.email=..., or any identity/signing override. The harness Stop
    hook exits 2 on any local commit lacking a gpgsig header or whose committer email is not
    noreply@anthropic.com, so a suppressed-signing checkpoint would wedge every turn end. Never
    remediate that leg with --amend --reset-author (AGENTS.md commit-signing subsection).
  - >-
    Decision 128 -- both new source files and both new test files stay under 500 SLOC. Decompose
    rather than register a budget entry.
  - >-
    Decision 127 prose ceilings are binding and near-zero: measure each edited surface after editing
    and set its budget to the exact measured byte count. Do not seed slack.
  - >-
    Single Portal Invariant -- Decision 170 reaches the warehouse only via ops_data_portal
    --backfill-decisions-md. Never hand-edit logs/.decisions-index.jsonl.
context:
