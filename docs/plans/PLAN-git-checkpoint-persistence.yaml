schema_version: 4
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: "git-checkpoint-persistence"
intent: >-
  Move git persistence off the model and onto the substrate: a Stop hook that commits and pushes
  checkpoint work at every turn boundary, the structural marker guard that keeps the checkpoint
  commits from silently disabling the VP-replay gates, and the AGENTS.md invariant + Decision that
  bind both. Contributes to the North Star by making durable state a property of the harness rather
  than of model diligence -- a prerequisite for unattended executor operation.
plan_type: IMPLEMENTATION
verification_tier: V2
plan_path: docs/plans/PLAN-git-checkpoint-persistence.yaml
phase: >-
  Platform engineering -- git-ops substrate correctness. Audit-anchored on
  audits/gitops-agent-first-ddfb9cc.yaml (Q6 industry_adaptation, S7 assessment); ad-hoc,
  user-initiated (soft-warn category user_explicit_out_of_scope), naming no carrier tier_item --
  mirrors the PLAN-vp-replay-hermetic-traps precedent. Prerequisite for the gitops-audit
  remediation series (the later GITOPS-02 subject-conformance gate extends this plan's registry).
  Touches tier_item T4.1 for a record-only progress_note annotation; no product-roadmap phase.
scope:
  - file: .claude/hooks/stop_checkpoint_push.py
    action: Create
    purpose: >-
      Stop hook: commit and push checkpoint work at every turn boundary. Fail-open on every path
      (exit 0 always), never --no-verify, never on main, no-op mid-rebase/merge/cherry-pick.
  - file: .claude/settings.json
    action: Modify
    purpose: >-
      Register the hook under a new Stop block (Stop supports no matcher field) with an explicit
      bounded timeout so a hung git operation cannot stall the turn end for the 600s default.
  - file: tests/hooks/test_stop_checkpoint_push.py
    action: Create
    purpose: >-
      Unit + real-git integration coverage for every hook path, mirroring never_on_main.py's
      CLAUDE_HOOK_BRANCH_OVERRIDE seam and tests/hooks/test_fresh_branch_base.py's importlib-from-path
      loader.
  - file: scripts/checks/verification/validate_commit_markers.py
    action: Create
    purpose: >-
      Structural marker guard: fail when origin/main..HEAD carries checkpoint commits but no
      registered marker-prefix commit. Parses AGENTS.md's commit-message conventions table as its
      prefix registry, giving that table a real reader.
  - file: scripts/checks/verification/_manifest.py
    action: Modify
    purpose: Register the marker guard as a verification-domain Entry (Decision 169 manifest dispatch).
  - file: tests/checks/verification/test_validate_commit_markers.py
    action: Create
    purpose: >-
      Mirror test (Decision 131) covering the marker-seam behaviour, the AGENTS.md table parse, and
      the origin/main-unreachable advisory skip.
  - file: config/ci_rca_taxonomy.yaml
    action: Modify
    purpose: >-
      function_to_category row for the new check (registry-coverage constraint); code_regression,
      matching its verification-domain siblings.
  - file: AGENTS.md
    action: Modify
    purpose: >-
      Add the substrate-owned-persistence invariant to '## Git-ops procedure', add the wip({branch})
      row to the commit-message conventions table, and remove the duplicated validate.py SSOT
      sentence (rec-2362) as the byte offset.
  - file: config/prose_budgets.yaml
    action: Modify
    purpose: >-
      Decision-170-authorized raises for root_ambient_load_set and .claude/skills/implement/SKILL.md,
      each carrying a '# raise-approved: dec-170' marker (Decision 165 authorization-by-body).
  - file: .claude/skills/implement/SKILL.md
    action: Modify
    purpose: >-
      IMPLEMENTATION Commit Flow: --allow-empty on the feat({slug}) marker commit, plus a note that
      checkpoint commits exist on the branch and collapse at squash-merge.
  - file: .claude/skills/planning/SKILL.md
    action: Modify
    purpose: >-
      --allow-empty on the Step-10 revision commit, absorbed at zero net bytes (the surface has 6
      bytes of headroom).
  - file: .claude/commands/plan.md
    action: Modify
    purpose: --allow-empty on the Step 8 and Step 11 plan({slug}) marker commits.
  - file: .claude/commands/audit.md
    action: Modify
    purpose: --allow-empty on the audit({slug}) marker commit.
  - file: docs/ROADMAP-PLATFORM.yaml
    action: Modify
    purpose: >-
      Record-only: dated progress_note bullet on T4.1 capturing the step-wrapper contract as a
      CD.43 design input. No executor code (Decision 67).
  - file: docs/DECISIONS.md
    action: Modify
    purpose: Author Decision 170 (substrate-owned git persistence) per the draft in context below.
bundled_recommendations:
  - rec-2362
infrastructure_dependencies: []
acceptance_criteria:
  - >-
    .claude/hooks/stop_checkpoint_push.py exists and is registered under a Stop block in
    .claude/settings.json with an explicit timeout; the block declares no matcher field.
  - >-
    On a dirty working tree on a non-main branch the hook creates exactly one commit with subject
    'wip({branch}): turn checkpoint' and the remote branch ref advances to it.
  - >-
    On a clean tree with local commits ahead of the upstream (or no upstream and ahead of
    origin/main) the hook pushes without creating a commit; on a clean tree with nothing ahead it
    does nothing and creates no remote branch.
  - >-
    The hook is a silent no-op when git is unavailable, HEAD is detached, the branch is main, or the
    repository is mid-rebase/merge/cherry-pick (unmerged paths present).
  - >-
    The hook exits 0 on every path, never emits continue:false, and the string '--no-verify' does
    not appear in its source.
  - >-
    A pre-commit rejection leaves the work uncommitted, emits a systemMessage warning on stdout, and
    restores the pre-hook index when the index was clean before the hook ran.
  - >-
    A push failure (network, auth, timeout, or a failed --force-with-lease) leaves the local commit
    in place, emits a systemMessage warning naming the branch, and exits 0.
  - >-
    validate_commit_markers fails a branch whose origin/main..HEAD carries at least one checkpoint
    commit and no registered marker-prefix commit, and passes once a marker commit exists; it
    advisory-skips when origin/main is unreachable.
  - >-
    validate_commit_markers is registered in the verification domain manifest, resolves via
    scripts.checks.registry, runs in the --pre tier, and has a config/ci_rca_taxonomy.yaml row.
  - >-
    All five named marker-commit invocations across the four flow surfaces carry --allow-empty.
  - >-
    AGENTS.md '## Git-ops procedure' states the substrate-owned-persistence invariant and its
    commit-message conventions table carries a wip({branch}) row; the duplicated validate.py SSOT
    sentence appears exactly once in the file (rec-2362).
  - >-
    Both raised prose-budget entries carry a '# raise-approved: dec-170' marker and Decision 170's
    body names both entries by path; every prose surface is at or under its budget.
  - >-
    docs/ROADMAP-PLATFORM.yaml validates against the RoadmapDocument schema and T4.1's progress_note
    records the step-wrapper contract explicitly as a CD.43 design input, not a store selection.
  - >-
    Decision 170 exists in docs/DECISIONS.md with the Decision 167 yaml envelope
    (significance.value == numbered_decision) and is present in the decisions cache after backfill.
  - rec-2362 is closed in the warehouse after merge.
verification_plan:
  - step: 1
    phase: pre-deploy
    action: >-
      Exercise every hook path -- refusals (main, detached, clean tree, mid-rebase), commit+push on a
      dirty tree against a local bare remote, clean-tree-but-unpushed push, pre-commit rejection with
      index restore, non-fast-forward -> --force-with-lease, and push-failure fail-open.
    command: bin/venv-python -m pytest tests/hooks/test_stop_checkpoint_push.py -q
    expected: "All tests pass; output reports `passed` and no failures."
    fix_if: >-
      A refusal path commits anything, a failure path returns non-zero, the checkpoint subject does
      not match 'wip({branch}): turn checkpoint', or the bare remote ref does not advance.
    hermetic: false
    graduation: graduate
    graduation_check_id: stop-checkpoint-push-hook-tests
  - step: 2
    phase: pre-deploy
    action: >-
      Prove the security gate is never bypassed -- the hook source contains no --no-verify under any
      path. This is the standing guard for the pre-commit chain (detect-secrets, the shape-based
      never-commit hook, ruff) that gates every checkpoint.
    command: test "$(grep -c -- '--no-verify' .claude/hooks/stop_checkpoint_push.py || true)" = "0"
    expected: Exit 0 (zero occurrences).
    fix_if: >-
      Non-zero exit means --no-verify was introduced; remove it and leave the work uncommitted with a
      loud warning instead.
    hermetic: true
    graduation: graduate
    graduation_check_id: checkpoint-hook-never-no-verify
  - step: 3
    phase: pre-deploy
    action: >-
      Prove the hook is actually wired: settings.json declares a Stop block invoking the hook, with a
      bounded timeout and no matcher field.
    command: bin/venv-python -m pytest tests/hooks/test_stop_checkpoint_push.py::TestSettingsRegistration -q
    expected: "Tests pass; output reports `passed`."
    fix_if: >-
      The Stop key is absent, the command does not name stop_checkpoint_push.py, no timeout is set, or
      a matcher field is present (unsupported for Stop and silently ignored).
    hermetic: false
    graduation: graduate
    graduation_check_id: stop-hook-registered-with-timeout
  - step: 4
    phase: pre-deploy
    action: >-
      Exercise the marker guard, including the seam it exists to close: a branch carrying only
      checkpoint commits fails; the same branch passes once a marker commit exists; an unreachable
      origin/main advisory-skips rather than failing.
    command: bin/venv-python -m pytest tests/checks/verification/test_validate_commit_markers.py -q
    expected: "All tests pass; output reports `passed` and no failures."
    fix_if: >-
      The guard passes a marker-less branch (the seam is open), fails a branch with a marker (false
      positive), or hard-fails when origin/main is unreachable.
    hermetic: false
    graduation: graduate
    graduation_check_id: validate-commit-markers-tests
  - step: 5
    phase: pre-deploy
    action: >-
      Prove the guard is registered and dispatchable -- the verification domain's parametrized mirror
      test resolves every Entry, including the new one, through scripts.checks.registry.
    command: bin/venv-python -m pytest tests/checks/verification/test__manifest.py -q
    expected: "All tests pass; output reports `passed`."
    fix_if: >-
      The Entry is missing, uses a combined 'module:attr' string instead of two bare literals, or does
      not resolve to a callable of its own name.
    hermetic: false
    graduation: waive
    graduation_waiver_reason: >-
      The domain's existing parametrized mirror test is already the standing guard for every Entry in
      this manifest and covers the new row automatically; a separate registry slot would duplicate an
      guard that already grows with the manifest.
  - step: 6
    phase: pre-deploy
    action: >-
      Prove the marker-commit remedy landed on every surface that carries a literal named commit --
      one each in implement/SKILL.md, planning/SKILL.md and audit.md, two in plan.md.
    command: test "$(grep -c -- '--allow-empty' .claude/skills/implement/SKILL.md)" = "1" && test "$(grep -c -- '--allow-empty' .claude/skills/planning/SKILL.md)" = "1" && test "$(grep -c -- '--allow-empty' .claude/commands/plan.md)" = "2" && test "$(grep -c -- '--allow-empty' .claude/commands/audit.md)" = "1"
    expected: Exit 0 (per-file counts all match; an aggregate count would pass if one file held all five).
    fix_if: >-
      A count below 5 means a marker commit can still fail with 'nothing to commit' once checkpointing
      is live, silently stripping its subject from origin/main..HEAD.
    hermetic: true
    graduation: graduate
    graduation_check_id: marker-commits-allow-empty
  - step: 7
    phase: pre-deploy
    action: >-
      Prove the invariant and the checkpoint prefix are registered on the canonical git-ops surface --
      the same table validate_commit_markers parses.
    command: test "$(grep -c 'wip({branch})' AGENTS.md)" = "1" && grep -q 'substrate' AGENTS.md
    expected: Exit 0 (the conventions table carries exactly one wip({branch}) row).
    fix_if: >-
      A zero count means the guard's registry has no checkpoint prefix and every checkpoint commit
      would be unregistered; a count above 1 means the table has a duplicate row.
    hermetic: true
    graduation: graduate
    graduation_check_id: agents-md-wip-row-registered
  - step: 8
    phase: pre-deploy
    action: >-
      Verify the bundled rec-2362 fix -- the validate.py SSOT sentence appears exactly once in
      AGENTS.md (case-insensitively; the rec's own acceptance grep is case-sensitive and misses the
      capital-N copy at AGENTS.md:246).
    command: test "$(grep -ciE 'never add a check to' AGENTS.md)" = "1"
    expected: Exit 0 (exactly one occurrence).
    fix_if: >-
      A count of 2 means the duplicate survives and the byte offset for the prose raise was not taken;
      a count of 0 means the rule was deleted rather than de-duplicated.
    hermetic: true
    graduation: graduate
    graduation_check_id: agents-md-validate-ssot-single
  - step: 9
    phase: pre-deploy
    action: >-
      Prove both prose-budget raises are authorized by Decision 170 by body, not merely marked
      (Decision 165), and that Decision 170 names both entries by path.
    command: "test \"$(grep -c 'raise-approved: dec-170' config/prose_budgets.yaml)\" = \"2\" && grep -q 'root_ambient_load_set' docs/DECISIONS.md && grep -q 'implement/SKILL.md' docs/DECISIONS.md"
    expected: Exit 0 (two markers present and both entry keys named in the Decision body).
    fix_if: >-
      A missing marker fails validate_prose_budget_raises; a marker whose Decision body does not name
      the entry fails Decision 165 authorization even though the marker exists.
    hermetic: true
    graduation: waive
    graduation_waiver_reason: >-
      validate_prose_budget_raises is the authoritative standing enforcement for this property and
      already runs in the --pre tier; this step is a plan-time pre-check of a one-time raise, so a
      registry slot would shadow an existing check rather than add coverage.
  - step: 10
    phase: pre-deploy
    action: >-
      Prove the T4.1 annotation landed without breaking the roadmap schema, and that it records the
      step-wrapper contract as a CD.43 design input rather than pre-empting CD.43's W1-W8 store
      selection.
    command: bin/venv-python -m scripts.roadmap.platform_roadmap && grep -q 'CD.43' docs/ROADMAP-PLATFORM.yaml
    expected: "Output contains `PASS: docs/ROADMAP-PLATFORM.yaml validates against RoadmapDocument schema.` and exit 0."
    fix_if: >-
      A schema failure means the progress_note broke the tier_item shape; a note asserting the remote
      branch IS the state medium (rather than proposing it for W1-W8 evaluation) pre-empts CD.43 and
      must be reworded.
    hermetic: true
    graduation: waive
    graduation_waiver_reason: >-
      Roadmap schema validity is already enforced by validate_platform_roadmap in both tiers, and the
      CD.43-wording half is a one-time content assertion about this specific annotation that will not
      generalize into a standing regression guard.
  - step: 11
    phase: pre-deploy
    action: >-
      Prove Decision 170 exists with the Decision 167 typed envelope and clears the significance bar
      it claims.
    command: "test \"$(grep -c '^## Decision 170:' docs/DECISIONS.md)\" = \"1\" && grep -q 'value: numbered_decision' docs/DECISIONS.md"
    expected: Exit 0 (exactly one Decision 170 header, envelope present).
    fix_if: >-
      A missing header or envelope fails validate_decision_entry_conformance; if a concurrent PR
      claimed 170, shift to the next free number and update every reference in this plan's scope
      (prose_budgets markers included).
    hermetic: true
    graduation: waive
    graduation_waiver_reason: >-
      validate_decision_entry_conformance already forward-enforces the envelope on every new entry;
      this step guards a single one-time authoring act whose number may legitimately shift at
      execution time, so a pinned registry check would be wrong the moment it shifts.
  - step: 12
    phase: pre-deploy
    action: ETL Decision 170 into the warehouse and confirm it landed in the decisions cache.
    command: bin/venv-python -m scripts.ops_data_portal --backfill-decisions-md && grep -q 'dec-170' logs/.decisions-index.jsonl
    expected: Backfill exits 0 and dec-170 appears in the local decisions cache.
    fix_if: >-
      A portal failure means the assume-role chain is unavailable -- confirm with aws sts
      get-caller-identity --profile agent_platform and re-run; never hand-edit the cache.
    hermetic: false
    graduation: not-applicable
  - step: 13
    phase: pre-deploy
    action: Run the full local gate before handoff.
    command: bin/venv-python -m scripts.validate
    expected: "Exit 0 with a final `Validation Summary (scope: all)` PASS and no failures."
    fix_if: >-
      Any failure blocks handoff; fix and re-run the full tier from the start (a --pre pass is not a
      substitute).
    hermetic: false
    graduation: not-applicable
  - step: 14
    phase: post-deploy
    action: >-
      Confirm the bundled recommendation closed after the squash-merge (Resolves: trailer ->
      rec-autoclose).
    command: bin/venv-python -m scripts.ops_data_portal --sync && grep 'rec-2362' logs/.recommendations-log.jsonl
    expected: rec-2362 shows status closed.
    fix_if: >-
      Still open after ~5 min -- close directly via ops_data_portal --update-rec rec-2362 --status
      closed --resolution "..." per the implement skill's post-merge closeout fallback.
test_obligations:
  - source: .claude/hooks/stop_checkpoint_push.py
    behavior: >-
      Refuses on main/detached/clean-tree/mid-rebase; commits with the registered checkpoint subject
      and pushes on a dirty tree; pushes unpushed commits on a clean tree; never uses --no-verify;
      exits 0 on every failure path.
    verification_step: 1
    test_selector: tests/hooks/test_stop_checkpoint_push.py
    red_green_expectation: >-
      red before (the module does not exist), green after; each refusal and failure path fails
      individually if its guard is removed.
  - source: .claude/settings.json
    behavior: The Stop block registers the hook with a bounded timeout and declares no matcher field.
    verification_step: 3
    test_selector: tests/hooks/test_stop_checkpoint_push.py::TestSettingsRegistration
    red_green_expectation: red before (no Stop key in hooks), green after.
  - source: scripts/checks/verification/validate_commit_markers.py
    behavior: >-
      Fails a branch with checkpoint commits and no marker commit; passes once a marker exists;
      advisory-skips on unreachable origin/main; reads its prefix registry from AGENTS.md's table.
    verification_step: 4
    test_selector: tests/checks/verification/test_validate_commit_markers.py
    red_green_expectation: red before (the module does not exist), green after.
  - source: scripts/checks/verification/_manifest.py
    behavior: The new Entry resolves through scripts.checks.registry to a callable of its own name.
    verification_step: 5
    test_selector: tests/checks/verification/test__manifest.py
    red_green_expectation: >-
      red before (registry.resolve raises for an unregistered name), green after the Entry lands.
  - source: AGENTS.md
    behavior: >-
      The commit-message conventions table remains parseable by validate_commit_markers and yields a
      prefix set containing exactly one checkpoint-role row (the rec-2362 de-duplication is verified
      separately at VP step 8).
    verification_step: 4
    test_selector: tests/checks/verification/test_validate_commit_markers.py::TestAgentsMdRegistryParse
    red_green_expectation: >-
      red before (the table has no checkpoint prefix, so the guard cannot classify wip commits),
      green after.
  - source: config/ci_rca_taxonomy.yaml
    behavior: Every registered check has a failure-category row; the new check maps to code_regression.
    verification_step: 13
    command: bin/venv-python -m scripts.validate
    red_green_expectation: >-
      red before (validate_ci_rca_taxonomy fails on a registered check with no category row), green
      after.
  - source: config/prose_budgets.yaml
    behavior: Both raised entries carry a dec-170 marker whose Decision body names them by path.
    verification_step: 9
    command: "test \"$(grep -c 'raise-approved: dec-170' config/prose_budgets.yaml)\" = \"2\""
    red_green_expectation: red before (no dec-170 markers), green after.
  - source: .claude/skills/implement/SKILL.md
    behavior: The feat({slug}) marker commit carries --allow-empty.
    verification_step: 6
    command: test "$(grep -c -- '--allow-empty' .claude/skills/implement/SKILL.md)" = "1"
    red_green_expectation: red before (0 occurrences), green after.
  - source: .claude/skills/planning/SKILL.md
    behavior: The Step-10 revision commit carries --allow-empty, at zero net byte cost.
    verification_step: 6
    command: test "$(grep -c -- '--allow-empty' .claude/skills/planning/SKILL.md)" = "1"
    red_green_expectation: red before (0 occurrences), green after.
  - source: .claude/commands/plan.md
    behavior: Both plan({slug}) marker commits carry --allow-empty.
    verification_step: 6
    command: test "$(grep -c -- '--allow-empty' .claude/commands/plan.md)" = "2"
    red_green_expectation: red before (0 occurrences), green after.
  - source: .claude/commands/audit.md
    behavior: The audit({slug}) marker commit carries --allow-empty.
    verification_step: 6
    command: test "$(grep -c -- '--allow-empty' .claude/commands/audit.md)" = "1"
    red_green_expectation: red before (0 occurrences), green after.
  - source: docs/ROADMAP-PLATFORM.yaml
    behavior: T4.1 carries the step-wrapper annotation and the file still validates against the schema.
    verification_step: 10
    command: bin/venv-python -m scripts.roadmap.platform_roadmap
    red_green_expectation: >-
      green before and after on schema validity; the annotation's presence is the added assertion in
