    the feat({slug}) subject is absent. A Stop hook checkpointing via `git add -A` at every turn boundary
    makes `git commit -m "feat({slug}) ..."` fail with "nothing to commit" by construction, so what
    Decision 132 disclosed as an incidental false negative becomes systematic. --allow-empty is the
    mechanism; validate_commit_markers is the enforcement. CI is authoritative for the guard - pr-validate
    checks out at fetch-depth 0, so origin/main..HEAD resolves there.
  - >-
    DISCLOSED CONSEQUENCE -- the guard creates a de facto universal obligation that every branch carrying
    checkpoint commits must also carry a marker commit, and once the hook is live essentially every branch
    carries checkpoints. The guard's registered marker set must therefore cover the LIVE prefix set, not
    just AGENTS.md's table -- recent origin/main history includes `fix(...)` and `docs(...)` subjects the
    table does not list (the audit's GITOPS-02 finding). Register feat, plan, roadmap, scope, audit, fix
    and docs as markers and wip as the checkpoint; state the obligation in the module docstring and in the
    failure message, whose remedy line names --allow-empty. Reconciling AGENTS.md's table with this set is
    GITOPS-02's job, not this plan's.
  - >-
    DISCLOSED CONSEQUENCE -- the pre-commit chain contains FILE-MODIFYING hooks (trailing-whitespace,
    end-of-file-fixer) that rewrite files and exit non-zero. Without mitigation the first checkpoint of
    any turn that introduces trailing whitespace fails, work stays uncommitted, and the guarantee silently
    degrades from "every turn boundary" to "every other one" -- with the last boundary before container
    reclamation being exactly the one that matters. Mitigation - on a pre-commit failure, if the tree
    changed because the hooks rewrote it, re-stage and retry the commit EXACTLY ONCE, then give up and
    warn. Note also that the chain does NOT include ruff, despite session_start_precommit.sh's header
    saying so; do not restate that error.
  - >-
    HARNESS STOP HOOK INTERACTION (load-bearing). The CC-web container ships its own Stop hook at
    ~/.claude/stop-hook-git-check.sh, registered in ~/.claude/launcher-settings.json (there is no
    ~/.claude/settings.json). It is CCR infrastructure -- root-owned, re-provisioned per container, not
    repo-tracked, not removable from this repo. It EXITS 2 -- blocking the turn end and handing the message
    back to the model -- on uncommitted changes, untracked files, unpushed commits, and unsigned or
    wrong-identity commits. It is the incumbent model-owns-persistence enforcement this plan supersedes.
    Both Stop hooks run and cross-source ordering is not guaranteed - if this repo's hook runs first the
    harness hook then sees a clean tree, a resolved upstream and zero unpushed commits and exits 0
    silently; if it runs first there is one blocked boundary and silence from the first checkpoint onward.
    Either order converges, which is part of why fail-open is safe here.
  - >-
    DISCLOSED DEPENDENCY -- harness-provided hook EVENTS (Stop, SessionStart, PreToolUse) are an extension
    surface this repo already consumes via 11 tracked hook scripts in .claude/hooks/ registered by
    .claude/settings.json, but their contract is set by the harness and can change without notice. This
    plan adds a twelfth script on a fourth event. The harness's own hooks coexist with the repo's and
    cannot be disabled from here.
  - >-
    Stop-hook harness semantics, verified against the live Claude Code hooks documentation - the Stop
    event supports NO matcher field; input carries session_id, cwd, stop_hook_active and
    last_assistant_message; exit 0 sends stderr to the DEBUG LOG ONLY (Claude never sees it), exit 2
    blocks stopping, and the supported JSON output fields are continue/stopReason, systemMessage and
    terminalSequence. The default hook timeout is 600s, which is why this plan sets an explicit shorter
    one.
  - >-
    Probed and confirmed in a scratch repo during planning - a pre-commit rejection exits 1 and leaves
    files STAGED, and a plain `git reset` cleanly restores the unstaged state with all work intact, which
    is why the hook captures index-cleanliness before staging and only restores when the index was clean
    beforehand (restoring unconditionally would unstage what the agent had staged). Push to a local bare
    remote uses no sockets, so the integration tests are hermetic under the repo's --disable-socket
    addopts. Both structural guard command forms at VP steps 3 and 4 were verified to discriminate
    correctly against synthetic pass/fail fixtures.
  - >-
    Test-environment gotcha - the container sets commit.gpgsign=true globally with an SSH signer. Scratch
    repos created by the tests must set user.email, user.name AND commit.gpgsign=false locally, or every
    test commit attempts to sign and fails.
  - >-
    CI cost is bounded and was checked - ci.yml fires only on pull_request to main and push to main, so a
    checkpoint push to a claude/* branch with no open PR triggers no workflow at all; with an open PR it
    fires pr-validate, whose concurrency group pr-validate-${{ github.ref }} sets cancel-in-progress true.
    Residual disclosed risk - a checkpoint push while a PR is open replaces the PR head with a WIP state,
    so the implement flow's existing "confirm check runs before merging" step is what prevents merging an
    unvalidated checkpoint.
  - >-
    Lambda-artifact tolerance, recorded rather than left silent - compute_affected_artifacts() returns the
    status active data-pipeline artifact for this plan, solely because docs/ROADMAP-PLATFORM.yaml is a
    declared ASSET in src/lambdas/data-pipeline/manifest.yaml. Settled repo precedent is that a
    record-only roadmap edit does not escalate the tier (PLAN-ulf-01-evidence-closure and
    PLAN-verification-graduation-enforcement both carry ROADMAP-PLATFORM.yaml at V2), and the consuming
    scheduled agents are disabled per AGENTS.md's re-enable runbook. V2 stands; no build/deploy/smoke
    steps are owed.
  - >-
    T4.1 Freshness Gate result (run at planning time) - NOT silently complete (no src/lambdas/pick_rec/,
    no terraform/personal/executor_*.tf); no stale references requiring re-grounding - the agent/{slug}
    branch naming in prepare_workspace is executor-substrate-scoped and is NOT the CC-web "never create an
    agent/ branch" rule, so it stands; no supersession (T4.1 owns the substrate and glue, T4.2 the
    personas, per T4.1's own intent); gating CD.43 is pending and constrains this annotation's wording
    (see constraints).
  - >-
    Branch was 2 commits behind origin/main at planning time; overlapping scope files - none (the two
    commits were unrelated plan documents). Rebased onto origin/main at f4c4f39 during planning at the
    human's direction, before the plan was written.
  - >-
    DISCLOSED RESIDUAL -- PUBLIC-REPOSITORY EXPOSURE. `git add -A` plus an automatic push publishes every
    non-gitignored UNTRACKED file to a public repo with no model and no human in the loop. AGENTS.md's
    public-content boundary (Decisions 73/83/101) forbids AWS account ids, ARNs, ExternalIds,
    credentials, trading alpha and internal hostnames. The pre-commit chain is the only gate and its
    confidentiality coverage is narrow - a baselined detect-secrets plus one pygrep matching 12-digit ids
    INSIDE an ARN, AKIA/ASIA/AIDA key ids, and *_information_hub. A bare account id, an internal
    hostname, or strategy output sitting in an untracked scratch file passes all of it. Accepted because
    the alternative (`git add -u`, tracked modifications only) would omit new files, which are the
    highest-value work a checkpoint protects, and because the same `git add -A` already runs unreviewed
    in the IMPLEMENTATION Commit Flow today. The hook's docstring must state this boundary, and scratch
    work belongs outside the repo or in a gitignored path.
  - >-
    DISCLOSED RESIDUAL -- CONCURRENCY, not merely ordering, with the harness Stop hook. Claude Code runs
    the hooks matching one event in PARALLEL, so beyond the two orderings already recorded there is a
    third outcome - the harness hook's `git diff --quiet` / index inspection racing this hook's `git add
    -A` and commit, including .git/index.lock contention. That can yield a spurious harness exit 2
    (blocking a turn end) or a spurious lock failure on our side. Our fail-open covers our half only.
    Mitigate by treating an index.lock failure as an ordinary fail-open path with a systemMessage, and
    accept the spurious-block residual; do not attempt to serialize against a hook this repo cannot edit.
  - >-
    DISCLOSED RESIDUAL -- VP step 4's structural grep catches `sys.exit(2)` and a literal continue-false,
    but NOT `raise SystemExit(2)`, `sys.exit(EXIT_BLOCK)`, or a continue-false assembled through a
    variable. It complements the behavioural exit-0 assertions at step 1; it does not prove the hook can
    never wedge a turn end.
  - >-
    HERMETICITY DISPOSITION, recorded rather than left implicit -- VP steps 1, 5, 6 and 13 are
    hermetic false despite the local-bare-remote git tests being socket-free, because the planning
    skill's hermetic-authoring rule keeps pytest-invoking and validate-invoking steps out of
    validate_vp_replay's replay set (the replay budget is bounded at MAX_AGGREGATE_SECONDS 120 /
    MAX_REPLAYED_STEPS 20, and a full-suite replay would blow it). The consequence is that this plan's
    replayable evidence is its seven structural greps; the behavioural proof rides the graduated registry
    rows and the PR's own CI run instead.
  - >-
    DEFERRED to a follow-on plan, deliberately not bundled - (a) switching branch integration from rebase
    to merge, which would make the hook's --force-with-lease path vestigial and cuts conflict-resolution
    cost from O(commits) to O(1), a cost this plan's checkpointing multiplies; it needs validate_commit_
    markers' merge-commit neutrality to already exist, which this plan provides. (b) Substrate-owned
    freshness - a SubagentStart and/or UserPromptSubmit hook doing a TTL-guarded `git fetch origin main`,
    retiring the fetch instructions currently embedded in gate dispatch prompts (planning/SKILL.md:579,
    89 bytes; implement/SKILL.md:173, ~76 bytes). Both are the same anti-pattern this plan addresses --
    git housekeeping written into prompts instead of performed by the substrate.
