schema_version: 4
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: "git-checkpoint-persistence"
intent: >-
  Move git persistence off the model and onto the substrate: a Stop hook that commits and pushes
  checkpoint work at every turn boundary, and the structural marker guard that stops those
  checkpoint commits from silently disabling the VP-replay gates. Contributes to the North Star by
  making durable state a property of the harness rather than of model diligence, removing a
  model-tier-correlated failure mode from the interactive loop.
plan_type: IMPLEMENTATION
verification_tier: V2
plan_path: docs/plans/PLAN-git-checkpoint-persistence.yaml
phase: >-
  Platform engineering -- git-ops substrate correctness. Audit-anchored on
  audits/gitops-agent-first-ddfb9cc.yaml (Q6 industry_adaptation, S7 assessment); ad-hoc,
  user-initiated (soft-warn category user_explicit_out_of_scope), naming no carrier tier_item --
  mirrors the PLAN-vp-replay-hermetic-traps precedent. Prerequisite for the gitops-audit
  remediation series (the later GITOPS-02 subject-conformance gate reconciles AGENTS.md's
  commit-message conventions table with this plan's in-module prefix registry). Touches tier_item
  T4.1 for a record-only progress_note annotation; no product-roadmap phase.
fallback_reevaluation:
  reevaluated_on: "2026-08-14"
  substrate_status: >-
    CD.27's Lambda Durable Functions substrate is untouched by this plan. T4.1 and T4.2 both remain
    status not_started; no executor surface is created, modified, built or deployed here. The sole
    T4.1 touch is a record-only progress_note annotation.
  verdict: continue_on_current_substrate
  basis: >-
    This plan writes no executor code (Decision 67 freeze) and takes no dependency on Durable
    Functions resume semantics. It changes only the interactive CC-web substrate's hooks and the
    repo's pre-merge check set, so no CD.27 fallback trigger is engaged and the current substrate
    selection stands unre-examined on its own merits.
scope:
  - file: .claude/hooks/stop_checkpoint_push.py
    action: Create
    purpose: >-
      Stop hook -- commit and push checkpoint work at every turn boundary. Fail-open on every path
      (exit 0 always), never --no-verify, never on main, no-op mid-rebase/merge/cherry-pick. Its
      module docstring is the contract of record for the mechanism (collocation, AGENTS.md
      Agent-First rule) -- the ambient instruction surface carries only a pointer.
  - file: .claude/settings.json
    action: Modify
    purpose: >-
      Register the hook under a new Stop block with an explicit bounded timeout so a hung git
      operation cannot stall the turn end for the 600s default. Mirror the existing SessionStart
      group form; the matcher field is not meaningful for Stop, but its absence is not asserted as a
      gate (the harness's own Stop registration declares an empty matcher).
  - file: tests/hooks/test_stop_checkpoint_push.py
    action: Create
    purpose: >-
      Unit + real-git integration coverage for every hook path, mirroring never_on_main.py's
      CLAUDE_HOOK_BRANCH_OVERRIDE seam and tests/hooks/test_fresh_branch_base.py's
      importlib-from-path loader.
  - file: scripts/checks/verification/validate_commit_markers.py
    action: Create
    purpose: >-
      Structural marker guard -- fail when origin/main..HEAD carries checkpoint commits but no
      registered marker-prefix commit. Owns its prefix registry as module constants, collocated
      with the enforcement it backs.
  - file: scripts/checks/verification/_manifest.py
    action: Modify
    purpose: Register the marker guard as a verification-domain Entry (Decision 169 manifest dispatch).
  - file: tests/checks/verification/test_validate_commit_markers.py
    action: Create
    purpose: >-
      Mirror test (Decision 131) covering the marker seam, the full registered prefix set, merge-commit
      neutrality, and the origin/main-unreachable advisory skip. Must reach 100% coverage of the new
      module (validate_test_coverage scope includes scripts/).
  - file: config/agent/verification_registry/registry.yaml
    action: Modify
    purpose: >-
      One new entry per GRADUATED verification_plan step (ten rows, one per graduation_check_id).
      validate_graduation_completeness's implement-PR leg fails any graduate step with no
      new-in-diff registry row, and validate_verification_registry re-runs each added row
      differentially against origin/main and live -- so a row whose command is wrong or vacuous is
      rejected at admission, not merged.
  - file: config/ci_rca_taxonomy.yaml
    action: Modify
    purpose: >-
      function_to_category row for the new check (registry-coverage constraint); code_regression,
      matching its verification-domain siblings validate_vp_replay and validate_graduation_completeness.
  - file: AGENTS.md
    action: Modify
    purpose: >-
      Remove the duplicated validate.py SSOT sentence (rec-2362) and add a single pointer line to the
      hook under '## Git-ops procedure'. Net effect on the ambient load is +6 bytes; no invariant
      prose, no new conventions-table row -- the mechanism documents itself in the hook.
  - file: config/prose_budgets.yaml
    action: Modify
    purpose: >-
      Ratchet root_ambient_load_set DOWN to its new measured size (zero-headroom convention).
      Decreases only -- this plan takes no raise and needs no raise marker.
  - file: .claude/skills/implement/SKILL.md
    action: Modify
    purpose: >-
      --allow-empty on BOTH marker commits -- the feat({slug}) commit in the IMPLEMENTATION Commit
      Flow and the path-limited roadmap({ids}) bookkeeping commit at ~:328. Absorbed at zero net
      bytes by local rewording.
  - file: .claude/skills/planning/SKILL.md
    action: Modify
    purpose: >-
      --allow-empty on the Step-10 revision commit, absorbed at zero net bytes (dropping " on the
      branch" is exactly the 14 bytes " --allow-empty" adds).
  - file: .claude/commands/plan.md
    action: Modify
    purpose: --allow-empty on the Step 8 and Step 11 plan({slug}) marker commits.
  - file: .claude/commands/audit.md
    action: Modify
    purpose: --allow-empty on the audit({slug}) marker commit.
  - file: docs/ROADMAP-PLATFORM.yaml
    action: Modify
    purpose: >-
      Record-only -- dated progress_note bullet on T4.1 detailing CD.43's existing option_set entry
      git_as_store_commit_at_step_boundaries with the step-wrapper contract. No executor code
      (Decision 67).
bundled_recommendations:
  - rec-2362
infrastructure_dependencies: []
acceptance_criteria:
  - >-
    .claude/hooks/stop_checkpoint_push.py exists and is registered under a Stop block in
    .claude/settings.json with an explicit timeout well under the 600s default.
  - >-
    On a dirty working tree on a non-main branch the hook creates exactly one commit whose subject is
    the shared checkpoint constant rendered as 'wip({branch}): turn checkpoint' (colon included), the
    guard classifies that exact emitted subject as a checkpoint, and the remote branch ref advances.
    The hook and the guard import the constant from one definition; no second literal exists.
  - >-
    On a clean tree with local commits ahead of the upstream (or no upstream and ahead of
    origin/main) the hook pushes without creating a commit; on a clean tree with nothing ahead, and
    on a branch whose commits are already contained in origin/main, it does nothing and creates no
    remote branch.
  - >-
    The hook is a silent no-op when git is unavailable, HEAD is detached, the branch is main, or the
    repository is mid-rebase/merge/cherry-pick (unmerged paths present).
  - >-
    The hook exits 0 on every path; its source contains no sys.exit(2), no continue-false JSON
    output, and no '--no-verify'.
  - >-
    The hook's only force-push construct is --force-with-lease; no bare --force token appears in its
    source, and the divergence path's recorded push argv contains --force-with-lease.
  - >-
    A pre-commit rejection caused by the chain's file-modifying hooks (trailing-whitespace,
    end-of-file-fixer) is retried exactly once after re-staging; a second failure leaves the work
    uncommitted, emits a systemMessage warning, and restores the pre-hook index when the index was
    clean before the hook ran.
  - >-
    A push failure (network, auth, timeout, or a failed --force-with-lease) leaves the local commit
    in place, emits a systemMessage warning naming the branch, and exits 0.
  - >-
    validate_commit_markers fails a branch whose origin/main..HEAD carries at least one checkpoint
    commit and no registered marker-prefix commit, and passes once a marker commit exists; merge
    commits are neutral (neither marker nor checkpoint); it advisory-skips when origin/main is
    unreachable, via scripts.checks._common.origin_main_reachable.
  - >-
    validate_commit_markers is registered in the verification domain manifest, resolves via
    scripts.checks.registry, runs in the --pre tier, and has a config/ci_rca_taxonomy.yaml row.
  - >-
    All six LITERAL named marker-commit invocations carry --allow-empty -- two in implement/SKILL.md
    (feat({slug}) and the path-limited roadmap({ids})), one in planning/SKILL.md, two in
    commands/plan.md, one in commands/audit.md. Prose-form marker-commit instructions elsewhere in
    those files are a disclosed residual, not part of this criterion.
  - >-
    Every graduated VP step has a config/agent/verification_registry/registry.yaml row carrying this
    plan's slug (ten rows), and each row is admitted by validate_verification_registry's differential
    gate rather than rejected as non-discriminating.
  - >-
    The duplicated validate.py SSOT sentence appears exactly once in AGENTS.md (rec-2362,
    case-insensitively) and AGENTS.md carries a pointer to the hook.
  - >-
    The ambient load-set stays within its budget with NO raise -- config/prose_budgets.yaml's
    root_ambient_load_set is ratcheted DOWN to the new measured size and carries no raise marker;
    implement/SKILL.md and planning/SKILL.md are byte-neutral and need no budget edit.
  - >-
    docs/ROADMAP-PLATFORM.yaml validates against the RoadmapDocument schema and T4.1's progress_note
    names CD.43's existing option_set entry git_as_store_commit_at_step_boundaries, detailing it
    rather than proposing a new option or selecting a store.
  - rec-2362 is closed in the warehouse after merge.
verification_plan:
  - step: 1
    phase: pre-deploy
    action: >-
      Exercise every hook path -- refusals (main, detached, clean tree, mid-rebase), commit+push on a
      dirty tree against a local bare remote, clean-tree-but-unpushed push, no-push when already
      contained in origin/main, pre-commit autofixer retry-once, pre-commit hard rejection with index
      restore, non-fast-forward to --force-with-lease (asserting the recorded push argv), and
      push-failure fail-open.
    command: bin/venv-python -m pytest tests/hooks/test_stop_checkpoint_push.py -q
    expected: "All tests pass; output reports `passed` and no failures."
    fix_if: >-
      A refusal path commits anything, a failure path returns non-zero, the checkpoint subject does
      not match 'wip({branch}): turn checkpoint', the divergence path's argv lacks --force-with-lease,
      or the bare remote ref does not advance.
    hermetic: false
    graduation: graduate
    graduation_check_id: stop-checkpoint-push-hook-tests
  - step: 2
    phase: pre-deploy
    action: >-
      Prove the security gate is never bypassed -- the hook source contains no --no-verify under any
      path, so the pre-commit chain (trailing-whitespace, end-of-file-fixer, check-yaml, check-json,
      large-files, merge-conflict, no-commit-to-branch, detect-secrets, and the shape-based
      block-sensitive-identifiers pygrep hook) gates every checkpoint.
    command: test "$(grep -c -- '--no-verify' .claude/hooks/stop_checkpoint_push.py || true)" = "0"
    expected: Exit 0 (zero occurrences).
    fix_if: >-
      Non-zero exit means --no-verify was introduced; remove it and leave the work uncommitted with a
      loud warning instead.
    hermetic: true
    graduation: graduate
    graduation_check_id: checkpoint-hook-never-no-verify
  - step: 3
    phase: pre-deploy
    action: >-
      Prove the divergence path can never clobber a remote it has not seen -- --force-with-lease is
      present and no bare --force token appears. A behavioural test alone cannot catch this - a
      fallback push asserted only on success passes identically with bare --force.
    command: test "$(grep -c -- '--force-with-lease' .claude/hooks/stop_checkpoint_push.py)" != "0" && test "$(grep -o -- '--force[a-z-]*' .claude/hooks/stop_checkpoint_push.py | grep -cx -- '--force' || true)" = "0"
    expected: Exit 0 (lease form present, bare form absent).
    fix_if: >-
      A bare --force token means the hook can overwrite a remote branch it never observed; replace it
      with --force-with-lease and warn on lease failure rather than escalating.
    hermetic: true
    graduation: graduate
    graduation_check_id: checkpoint-hook-force-with-lease-only
  - step: 4
    phase: pre-deploy
    action: >-
      Prove the hook can never wedge a turn end -- no sys.exit(2) and no continue-false JSON output.
      This is the highest-blast-radius defect available (exit 2 blocks stopping on EVERY turn), and
      the fail-open contract has many exception paths, so a structural assertion complements the
      behavioural one at step 1.
    command: test "$(grep -cE 'sys\.exit\(2\)|continue.{0,3}False' .claude/hooks/stop_checkpoint_push.py || true)" = "0"
    expected: Exit 0 (neither blocking construct present).
    fix_if: >-
      Either construct means a checkpoint failure can block the session; every path must exit 0 and
      report through systemMessage instead.
    hermetic: true
    graduation: graduate
    graduation_check_id: checkpoint-hook-never-blocks-turn
  - step: 5
    phase: pre-deploy
    action: >-
      Prove the hook is actually wired -- settings.json declares a Stop block invoking the hook with a
      bounded timeout.
    command: bin/venv-python -m pytest tests/hooks/test_stop_checkpoint_push.py::TestSettingsRegistration -q
    expected: "Tests pass; output reports `passed`."
    fix_if: >-
      The Stop key is absent, the command does not name stop_checkpoint_push.py, or no timeout is set
      (leaving the 600s default). Do NOT assert absence of a matcher field -- the harness's own Stop
      registration declares `"matcher": ""`, so absence is a convention, not a contract.
    hermetic: false
    graduation: graduate
    graduation_check_id: stop-hook-registered-with-timeout
  - step: 6
    phase: pre-deploy
    action: >-
      Exercise the marker guard, including the seam it exists to close -- a branch carrying only
      checkpoint commits fails; the same branch passes once a marker commit exists; every registered
      marker prefix satisfies it; merge commits are neutral; an unreachable origin/main advisory-skips.
    command: bin/venv-python -m pytest tests/checks/verification/test_validate_commit_markers.py -q
    expected: "All tests pass; output reports `passed` and no failures."
    fix_if: >-
      The guard passes a marker-less branch (the seam is open), fails a branch with a marker (false
      positive), treats a merge commit as a checkpoint, or hard-fails when origin/main is unreachable.
    hermetic: false
    graduation: graduate
    graduation_check_id: validate-commit-markers-tests
  - step: 7
    phase: pre-deploy
    action: >-
      Prove the guard is registered and dispatchable -- the verification domain's parametrized mirror
      test resolves every Entry, including the new one, through scripts.checks.registry.
    command: bin/venv-python -m pytest tests/checks/verification/test__manifest.py -q
    expected: "All tests pass; output reports `passed`."
    fix_if: >-
      The Entry is missing, uses a combined 'module.attr' string instead of two bare literals, or does
      not resolve to a callable of its own name.
    hermetic: false
    graduation: waive
    graduation_waiver_reason: >-
      The domain's existing parametrized mirror test is already the standing guard for every Entry in
      this manifest and picks up the new row automatically; a separate registry slot would duplicate a
      guard that already grows with the manifest.
  - step: 8
    phase: pre-deploy
    action: >-
      Prove the marker-commit remedy landed on all six literal named invocations, counted per file --
      an aggregate count would pass if one file held them all.
    command: test "$(grep -c -- '--allow-empty' .claude/skills/implement/SKILL.md)" -ge "2" && test "$(grep -c -- '--allow-empty' .claude/skills/planning/SKILL.md)" -ge "1" && test "$(grep -c -- '--allow-empty' .claude/commands/plan.md)" -ge "2" && test "$(grep -c -- '--allow-empty' .claude/commands/audit.md)" -ge "1"
    expected: >-
      Exit 0 (at least 2 / 1 / 2 / 1 across the four surfaces). Floors, not equalities -- audit.md
      carries two further prose-form marker-commit instructions at ~:123 and ~:129 that a later plan
      may legitimately convert, and an equality pinned here would go red on that correct change.
    fix_if: >-
      Any shortfall means a marker commit can still fail with 'nothing to commit' once checkpointing is
      live, stripping its subject from origin/main..HEAD and silently no-opping validate_vp_replay and
      validate_graduation_completeness. The path-limited roadmap({ids}) commit is the most vulnerable
      and the easiest to miss.
    hermetic: true
    graduation: graduate
    graduation_check_id: marker-commits-allow-empty
  - step: 9
    phase: pre-deploy
    action: >-
      Verify the bundled rec-2362 fix -- the validate.py SSOT sentence appears exactly once in
      AGENTS.md (case-insensitively; the rec's own acceptance grep is case-sensitive and misses the
      capital-N copy at AGENTS.md:246).
    command: test "$(grep -ciE 'never add a check to' AGENTS.md)" = "1"
    expected: Exit 0 (exactly one occurrence).
    fix_if: >-
      A count of 2 means the duplicate survives; a count of 0 means the rule was deleted rather than
      de-duplicated.
    hermetic: true
    graduation: graduate
    graduation_check_id: agents-md-validate-ssot-single
  - step: 10
    phase: pre-deploy
    action: >-
      Prove the ambient instruction load did NOT grow to pay for this mechanism -- AGENTS.md points at
      the hook, and the load-set total is at or under its budget with the budget itself ratcheted down
      rather than raised.
    command: grep -q 'stop_checkpoint_push' AGENTS.md && test "$(grep -cE '^[^#].*# raise-approved' config/prose_budgets.yaml)" = "2" && test $(( $(wc -c < CLAUDE.md) + $(wc -c < AGENTS.md) )) -le "$(grep -A1 '^S1' config/prose_budgets.yaml | grep -o '[0-9]*$')"
    expected: >-
      Exit 0 -- the pointer is present, the ENTRY-LINE raise-marker count is unchanged at 2 (this
      plan adds none), and the measured load-set is within the registered budget.
    fix_if: >-
      A raise-marker count above 2 means this plan took a budget raise, which its whole premise
      forbids -- relocate the content into the hook docstring instead. An over-budget total means the
      pointer grew beyond the bytes the rec-2362 de-duplication freed.
    hermetic: true
    graduation: graduate
    graduation_check_id: ambient-load-no-raise
  - step: 11
    phase: pre-deploy
    action: >-
      Prove the T4.1 annotation landed, still validates, and details CD.43's EXISTING option-set entry
      rather than proposing a new option or selecting a store.
    command: bin/venv-python -m scripts.roadmap.platform_roadmap && test "$(grep -c 'CD.43 option_set entry git_as_store_commit_at_step_boundaries' docs/ROADMAP-PLATFORM.yaml)" = "1"
    expected: "Output contains `PASS: docs/ROADMAP-PLATFORM.yaml validates against RoadmapDocument schema.` and the phrase appears exactly once."
    fix_if: >-
      A schema failure means the progress_note broke the tier_item shape. A zero count means the note
      does not tie itself to CD.43's enumerated option and could be read as pre-empting the W1-W8
      selection, which CD.43's discipline_points forbid any dependent plan from doing.
    hermetic: true
    graduation: graduate
    graduation_check_id: t41-annotation-cites-cd43-option
  - step: 12
    phase: pre-deploy
    action: >-
      Prove every graduated step got its verification-registry row and that each row survived the
      differential admission gate -- a row whose command passes on BOTH the origin/main worktree and
      live is rejected as non-discriminating, which is exactly what a vacuous grep would be.
    command: bin/venv-python -m pytest tests/checks/verification/test_validate_verification_registry.py -q && test "$(grep -c 'plan_slug. git-checkpoint-persistence' config/agent/verification_registry/registry.yaml)" = "10"
    expected: Exit 0 -- ten rows carry this plan's slug and the registry check's tests pass.
    fix_if: >-
      A count below 10 means a graduate step has no row and validate_graduation_completeness will
      fail the implement PR. An admission rejection means that row's command does not discriminate
      between the pre-change and post-change trees -- fix the command or reclassify the step to
      waive with a substantive reason; never weaken the gate.
    hermetic: true
    graduation: waive
    graduation_waiver_reason: >-
      This step asserts the registry's own population for this plan, so graduating it would add a
      row that asserts the presence of rows including itself -- self-referential and unstable across
      any future plan. validate_graduation_completeness and validate_verification_registry are the
      standing enforcement and both already run in the --pre tier.
  - step: 13
    phase: pre-deploy
    action: Run the full local gate before handoff.
    command: bin/venv-python -m scripts.validate
    expected: "Exit 0 with a final `Validation Summary (scope: all)` PASS and no failures."
    fix_if: >-
      Any failure blocks handoff; fix and re-run the full tier from the start (a --pre pass is not a
      substitute). Watch specifically for validate_test_coverage's 100%-coverage floor on the new
      check module and validate_fallback_reevaluation on this plan file.
    hermetic: false
    graduation: waive
    graduation_waiver_reason: >-
      A command_exit_zero row for the full validator is tautological under scripts/validate.py's own
      _VALIDATE_DEPTH and PYTEST_CURRENT_TEST short-circuit guards -- it exits 0 on BOTH differential
      legs, so the admission gate rejects it as non-discriminating. This is the repo's established
      disposition for this step (PLAN-coverage-gate-handoff-integrity and ~25 sibling plans).
  - step: 14
    phase: post-deploy
    action: >-
      Confirm the bundled recommendation closed after the squash-merge (Resolves trailer to
      rec-autoclose).
    command: bin/venv-python -m scripts.ops_data_portal --sync && grep 'rec-2362' logs/.recommendations-log.jsonl
    expected: rec-2362 shows status closed.
    fix_if: >-
      Still open after ~5 min -- close directly via ops_data_portal --update-rec rec-2362 --status
      closed --resolution "..." per the implement skill's post-merge closeout fallback.
test_obligations:
  - source: .claude/hooks/stop_checkpoint_push.py
    behavior: >-
      Refuses on main/detached/clean-tree/mid-rebase; commits with the registered checkpoint subject
      and pushes on a dirty tree; pushes unpushed commits on a clean tree but never recreates a
      squash-merged branch; retries once after a pre-commit autofixer rewrite; uses --force-with-lease
      on divergence; exits 0 on every failure path.
    verification_step: 1
    test_selector: tests/hooks/test_stop_checkpoint_push.py
    red_green_expectation: >-
      red before (the module does not exist), green after; each refusal and failure path fails
      individually if its guard is removed.
  - source: .claude/settings.json
    behavior: The Stop block registers the hook with a bounded timeout and declares no matcher field.
    verification_step: 5
    test_selector: tests/hooks/test_stop_checkpoint_push.py::TestSettingsRegistration
    red_green_expectation: red before (no Stop key in hooks), green after.
  - source: scripts/checks/verification/validate_commit_markers.py
    behavior: >-
      Fails a branch with checkpoint commits and no marker commit; passes once a marker exists; treats
      merge commits as neutral; advisory-skips on unreachable origin/main via _common.
    verification_step: 6
    test_selector: tests/checks/verification/test_validate_commit_markers.py
    red_green_expectation: >-
      red before (the module does not exist), green after; 100% line coverage required by
      validate_test_coverage since the module lives under scripts/.
  - source: scripts/checks/verification/_manifest.py
    behavior: The new Entry resolves through scripts.checks.registry to a callable of its own name.
    verification_step: 7
    test_selector: tests/checks/verification/test__manifest.py
    red_green_expectation: >-
      red before (registry.resolve raises for an unregistered name), green after the Entry lands.
  - source: config/agent/verification_registry/registry.yaml
    behavior: >-
      Every graduated VP step has a registry row carrying this plan's slug, and each row discriminates
      between the pre-change and post-change trees (differential admission).
    verification_step: 12
    command: test "$(grep -c 'plan_slug. git-checkpoint-persistence' config/agent/verification_registry/registry.yaml)" = "10"
    red_green_expectation: red before (0 rows carry this slug), green after all ten land and are admitted.
  - source: config/ci_rca_taxonomy.yaml
    behavior: Every registered check has a failure-category row; the new check maps to code_regression.
    verification_step: 13
    command: bin/venv-python -m scripts.validate
    red_green_expectation: >-
      red before (validate_ci_rca_taxonomy fails on a registered check with no category row), green
      after.
  - source: AGENTS.md
    behavior: >-
      The duplicated validate.py SSOT sentence appears exactly once (rec-2362); the hook pointer is
      verified at step 10.
    verification_step: 9
    command: test "$(grep -ciE 'never add a check to' AGENTS.md)" = "1"
    red_green_expectation: red before (2 occurrences, at :188 and :246), green after.
  - source: config/prose_budgets.yaml
    behavior: >-
      root_ambient_load_set is ratcheted down to the measured size and this plan adds no raise marker
      (the pre-existing count of 2 is unchanged).
    verification_step: 10
    command: test "$(grep -cE '^[^#].*# raise-approved' config/prose_budgets.yaml)" = "2"
    red_green_expectation: >-
      green before and after by construction -- a regression assertion that the plan never takes a
      raise, failing the moment anyone adds one. The count MUST be anchored to entry lines - an
      unanchored `grep -c 'raise-approved'` returns 3, because the file's header comment at :17
      contains the literal marker template.
  - source: .claude/skills/implement/SKILL.md
    behavior: Both marker commits -- feat({slug}) and the path-limited roadmap({ids}) -- carry --allow-empty.
    verification_step: 8
    command: test "$(grep -c -- '--allow-empty' .claude/skills/implement/SKILL.md)" -ge "2"
    red_green_expectation: red before (0 occurrences), green after.
