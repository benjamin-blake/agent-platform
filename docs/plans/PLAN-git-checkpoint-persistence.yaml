    progress_note is a wrapped block scalar.
  - >-
    Add one config/agent/verification_registry/registry.yaml entry per GRADUATED step (ten rows, one per
    graduation_check_id, each carrying plan_slug git-checkpoint-persistence). Each row's command must
    DISCRIMINATE - validate_verification_registry re-runs added rows against an origin/main worktree AND
    live, and rejects any row that passes on both. If a row cannot discriminate, reclassify that VP step
    to waive with a substantive reason rather than weakening the row.
  - >-
    Authoring traps to avoid, both of which turn a correct implementation red - (a) VP step 3 greps the
    hook source for a bare --force token, and the module docstring is designated the contract of record
    and instructed to state limitations, so write "force-with-lease" or "a bare force push" in prose,
    never the literal flag; (b) VP step 12's registry-row count and VP step 11's CD.43 phrase are both
    single-line greps against wrapped YAML.
  - >-
    Execute the Verification Plan -- run each step; loop until pass; on unrecoverable failure stop and RCA
    (Decision 55).
  - >-
    Report - what was implemented, verification results, and the measured before/after byte totals for the
    ambient load-set showing it did not grow beyond budget.
rollback: >-
  Single-PR revert. The hook is inert once its settings.json Stop block is removed, so a partial rollback
  (drop the Stop registration, keep the marker guard and the --allow-empty edits) is safe and is the
  preferred first response if checkpointing proves disruptive -- the marker guard is a no-op on branches
  carrying no checkpoint commits, and --allow-empty is harmless without it.
