    .git/hooks/pre-commit in the scratch repo), non-fast-forward to --force-with-lease ASSERTING THE
    RECORDED PUSH ARGV, push-failure fail-open, and the settings.json registration. Set user.email,
    user.name and commit.gpgsign=false in every scratch repo.
  - >-
