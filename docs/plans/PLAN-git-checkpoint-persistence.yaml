  - >-
    REJECTED ALTERNATIVE -- detecting unpushed work by counting commits ahead of a fallback upstream.
    Observed live during planning -- the harness Stop hook reported "2 unpushed commit(s)" on a branch
    whose HEAD was exactly origin/main. Mechanism, read from its source - when origin/$current_branch
    does not resolve it falls back to upstream=origin/HEAD and counts `git rev-list origin/HEAD..HEAD`,
    so a freshly-rebased branch with no remote head yet counts commits already on main. Key the
    dirty-tree trigger on `git status --porcelain` and the unpushed trigger on an explicit upstream
    comparison that treats a MISSING upstream as "nothing unpushed unless ahead of origin/main" --
    never on an ahead-count against a substituted ref.
  - >-
    THE SEAM THIS PLAN EXISTS TO PROTECT, verified by the critique gate against live source -
    scripts/checks/_common.py:207 feat_commit_slugs() runs `git log origin/main..HEAD --format=%s` and
    returns [] on no match; validate_vp_replay.py:186-190 and validate_graduation_completeness.py:186-190
