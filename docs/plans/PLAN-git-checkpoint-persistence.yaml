constraints:
  - No rescue agents or workaround loops (Decision 55). On an unrecoverable failure, stop and RCA.
  - >-
    NO numbered Decision and NO prose-budget raise. This plan's premise is that persistence moves off
    the model; growing the ambient instruction load to describe that mechanism would relocate the work
    into every future session's context rather than removing it. The mechanism documents itself in the
    hook's docstring (AGENTS.md Agent-First collocation rule); AGENTS.md carries a pointer only. The
    justification rests ONLY on the interactive substrate -- the hook imposes no obligation an agent
    must remember, its behaviour is fully observable in `git log`, and its reversal is removing one
    settings.json key, all of which route below Decision 150's significance bar. Do NOT argue the
    no-Decision verdict from executor-side necessity (see the CD.43 constraint below).
  - >-
    The checkpoint subject is the literal `wip({branch}): turn checkpoint`, COLON INCLUDED, and the
    hook and the guard must share ONE constant rather than two hand-copied literals. The guard
    classifies by prefix grammar and treats unrecognised subjects as neutral, so a colon-less subject
    would make a checkpointed branch read as carrying zero checkpoint commits -- the guard would pass
    vacuously and the seam this plan exists to close would silently reopen on a one-character
    divergence.
  - >-
    Decision 67 executor freeze -- the T4.1 annotation is RECORD-ONLY. Write no executor code, no
    src/lambdas/ persona or glue module, no terraform.
  - >-
    CD.43 non-pre-emption -- CD.43's discipline_points state verbatim that "no dependent plan may cite
    this CD as authorizing a selection", and T4.1's exit criterion says the backing store is "not
    implied by prepare_workspace's implementation". The annotation must DETAIL CD.43's already-
    enumerated option_set entry git_as_store_commit_at_step_boundaries -- naming it by id -- and must
    not read as proposing a new option or selecting a store. Recording the option's W1/W2 profile is in
    bounds; choosing it is not. CRITICALLY, do NOT argue that commit-and-push per step is structurally
    FORCED (e.g. "a stateless Lambda has no durable filesystem, so there is no choice"). CD.27's
    layer-2 substrate is "pinned at ratification" by its own title and CD.27 is state pending; Fargate
    via ECS Run Task is retained in that same CD as an escape hatch and does carry a task-scoped
    filesystem. Arguing the option is compelled is materially the act of selecting it, which is exactly
    what CD.43's criteria-only discipline forbids a dependent plan from doing. Describe, never compel.
  - >-
    Never --no-verify, under any path, in the hook or in any flow surface. A rejected checkpoint leaves
    work uncommitted and warns loudly.
  - >-
    The hook must never block the turn -- exit 0 on every path, never exit 2, never emit
    continue-false. Stop-hook exit-0 stderr goes to the debug log only, so every warning must be a
    {"systemMessage" ...} JSON object on stdout.
  - >-
    Never bare --force. The divergence path uses --force-with-lease with NO preceding fetch of the
    branch -- fetching first refreshes the remote-tracking ref and voids the lease. On lease failure,
    warn and leave the commit local.
  - >-
    Respect the never_on_main.py hard rule on every path. The hook invokes git directly and so bypasses
    the PreToolUse guard entirely; it must implement its own main refusal as a third layer behind
    never_on_main.py and pre-commit's no-commit-to-branch (Decision 138 authorizes the layering).
  - >-
    Do NOT push when the branch has nothing genuinely unpushed. Two cases -- no commits ahead of
    origin/main (minting an empty remote head at the first turn end of every read-only session is the
    stale-branch debris GITOPS-04 flags), and a squash-merged branch whose commits are absent from
    origin/main by SHA but whose content is already contained in it (guard with `git cherry
    origin/main HEAD` empty, or an equivalent containment test, so a post-merge fetch --prune cannot
    make the hook recreate a deleted branch).
  - >-
    Checkpoint commits inherit the session signing config unchanged -- never pass -c
    commit.gpgsign=false, -c user.email=..., or any identity/signing override. The harness Stop hook
    exits 2 on any local commit lacking a gpgsig header or whose committer email is not
    noreply@anthropic.com, so a suppressed-signing checkpoint would wedge every turn end. Never
    remediate that leg with --amend --reset-author (AGENTS.md commit-signing subsection).
  - >-
    Bind origin/main reachability to scripts.checks._common.origin_main_reachable rather than
    hand-rolling a fourth `git rev-parse origin/main` call site; feat_commit_slugs and the two
    VP-replay consumers are the existing three.
  - >-
    Decision 128 -- both new source files and both new test files stay under 500 SLOC. Decompose
    rather than register a budget entry.
  - >-
    Single Portal Invariant -- rec-2362's closure transits the ops portal. Never hand-edit
    logs/.recommendations-log.jsonl.
context:
