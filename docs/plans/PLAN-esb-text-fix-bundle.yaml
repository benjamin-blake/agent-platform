rollback: >-
  Every change is additive or in-place document text plus a new self-contained test package, on a
  branch, with no infrastructure, schema, or data-path effect. Revert the branch commit to restore
  the prior text exactly. The only externally-visible consequence is the post-merge ops_decisions
  backfill of Decisions 39 and 75; because DECISIONS.md is the sole ETL source (Decision 84), a
  revert followed by the same automatic backfill restores the prior warehouse projection -- no
  manual warehouse repair is needed and no rec, queue, or telemetry row is touched.
