  - >-
    The NAT figure is published as a BRACKET ($33-35/month standing) with `confidence: medium`
    stated inline, never a point value -- it was not obtainable from the bulk offer files and is
    derived from published tier pricing plus one aggregator, cross-checked against the audit's
    independent ~$32/month note. Publishing false precision is the exact defect ESB-09 exists to
    correct.
  - >-
    Do NOT preserve the "$1-10" Step Functions figure anywhere, including as a struck-through or
    historical annotation. The audit established it overstates its own arithmetic 13-44x.
  - >-
    No rescue agents or workaround loops (Decision 55). On an unrecoverable failure, stop clean and
    RCA rather than patching around it.
  - >-
    Do NOT modify `.github/actions/subagent-plan-review/**` or `scripts/ci/review_verdict.py` --
    they belong to rec-2923's owner (see context).
  - >-
    Do NOT add build/deploy/smoke-test steps for the data-pipeline Lambda artifact. See the
    deploy-deferral entry in context; the ruling is deliberate and recorded.

