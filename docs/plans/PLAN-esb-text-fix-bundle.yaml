    VERIFICATION TIER V3, reasoned rather than defaulted. The plan's own execution steps make no
    external-system call, which argues for V2. But Decision 84 makes docs/DECISIONS.md the sole ETL
    source for ops_decisions, so editing Decisions 39 and 75 changes their content_hash and a real
    external write happens as a consequence -- and a silently-failed backfill would leave a future
    decision-scout reading pre-annotation text. Highest-tier-wins plus the VP honesty test both
    point to V3: twelve pre-deploy steps carrying graduation dispositions, plus exactly one
    post-deploy step verifying the CI-owned backfill. The deterministic tier floor computes V2 from
    scope (.py files present), and declaring above the floor passes validate_tier_floor.
  - >-
    rec-2923 DEFERRAL (Critical, source=ci_rca, open -- "Sandbox subagent review starved; inherited
    errexit voided the retry and latched a false red", source_file
    .github/actions/subagent-plan-review/action.yml). Deferred by explicit human authorization; it
    is owned by a separate agent under PLAN-ci-rca-starved-surface.yaml, which is in review and not
    yet on main (confirmed absent from this branch). This plan shares no file, no Decision Record
    and no failure category with it, so it satisfies the Related-Work Check via this logged
    deferral rationale rather than via one of the three overlap conditions.
  - >-
    WAVE BOUNDARIES. This is wave 1 of 5. Explicitly NOT in scope: the workspace backing-store
    decision (ESB-01's substantive half, wave 2); the CD.27 :821 fallback specification and its
    phantom re-evaluation carrier (ESB-02, wave 3); the persona-routing rationale against Decision
    116's principle (ESB-03). ESB-04 and ESB-06 are NOT remediated here -- they become
    ratification-time obligations recorded on CD.27 so layer-2 ratification trips over them.
    Silently dropping 2 of 11 findings would repeat exactly the defect ESB-02 documents: a
    promised-but-uncarried re-evaluation.
  - >-
    THE KEYSTONE IS ESB-05 AND IT IS WHERE CRITIQUE ATTENTION BELONGS. The three-property
    vocabulary authored here is inherited verbatim by waves 2, 3 and 5. If P1/P2/P3 are wrong,
    under-specified, or accidentally mechanism-bound, every later wave inherits the defect and the
    substrate evaluation stays frame-locked -- the Decision 75 failure mode this audit exists to
    catch, reproduced at the scoring layer. The properties are deliberately expressed in
    interruption/resume/completed-operation terms and never in checkpoint/replay/invocation terms.
  - >-
    Guard interactions verified this session, each of which would otherwise surface as a late CI
    failure: validate_platform_roadmap check (ii) force-flags bare-string criteria on any tier_item
    whose `- id:` line enters the diff (T4.2 has six); CandidateDecision is extra="forbid" so no new
    top-level CD key is possible; validate_supersession_annotations regexes three supersession
    verbs; validate_intent_doc_freeze permits annotating the INTENT doc because it is grandfathered
    with disposition_state pending; validate_decision_entry_conformance grandfathers MODIFIED
    entries and applies only to genuinely-new decision numbers; the roadmap sits at 8214 of its
    10,000-line Decision 114 ceiling, and DECISIONS.md is within both surviving Decision 134
    ceilings (the live-byte ceiling was retired by Decision 160).
  - >-
    affected_tests channel 2 performs a PRECISE path/quoted-token match over changed non-.py data
    artifacts. tests/esb_text_fix/_anchors.py therefore names docs/ROADMAP-PLATFORM.yaml,
    docs/DECISIONS.md and docs/INTENT-provider-agnostic-executor.md as literal quoted tokens, so
    the guard package is selected into the --pre tier automatically whenever a later wave edits
    those documents. This is what makes the vocabulary durable across waves 2, 3 and 5 rather than
    a one-session assertion.
  - >-
    DECISION 75 TRAILER ROUTING, decided and reasoned (raised at critique round 2, unruled). The
    ESB-11 content is an operational fact, and Decision 150's routing table sends operational facts
    to a rec or tier_item note rather than to a numbered Decision. Annotating Decision 75 anyway,
    for three reasons. (i) Decision 150's table governs the INFLOW of new numbered entries -- the
    significance gate on minting a `## Decision NNN:` header. This trailer mints no header and
    consumes no number, so the gate is not engaged. (ii) The defect is a false premise sitting
    INSIDE Decision 75's own body; ESB-11's acceptance is that a future reader of that prose does
    not inherit it, and only a co-located annotation achieves that -- a rec is invisible to someone
    reading the Decision. (iii) This is the same principle validate_supersession_annotations
    enforces for supersession (DPI-01: a reader of the victim entry must be able to discover the
    correction from the victim entry). The cost is bytes in the live corpus, which is bounded --
    two short trailers, no new header against the Decision 134 count.
  - >-
    CD.27 TITLE de-mechanisation is IN this wave (ESB-10), not deferred. Referential safety was
    verified before committing to it: the exact title string occurs nowhere in the repo but its own
    line, no code path reads a CandidateDecision title (only `.id`, `.state`, `.ratified_as`,
    `.filed_via` are consumed), and cross_tier_gates reference item ids rather than titles. Layer 1
    and layer 3 stay named in the retitle because both are ratified and uncontested; only layer 2 is
    what the Q5 spike decides. Deferring it was the alternative, but no later wave owns :748 under
    this plan's WAVE BOUNDARIES, so deferral would have left it unowned -- the same argument that
    decided :817.
  - >-
    validate_decisions_index_freshness (Decision 160) is a `--pre` guard directly downstream of
    docs/DECISIONS.md and is analysed here rather than left implicit. Its outcome for this plan is
    benign: docs/decisions-index.json derives `amends` and `title_supersedes` from the raw entry
    TITLE and `superseded_by` from a `(Superseded by Decision N)` marker, while both trailers here
    append to the BODY, change no title, and are constrained never to use a supersession verb or
    marker. So a trailing append cannot drift the index. Recorded as a verified finding rather than
    an assumption, with VP step 12's fix_if naming
    `bin/venv-python -m scripts.decisions_index --write` as the remedy if it ever does fire.
  - >-
    Preflight at plan time: venv ok, creds ok, working tree clean, 0 commits behind origin/main
    (so the Main Divergence Assessment found no overlap and no rebase was deferred), ops_outbox
    empty, open_recommendations 881 with the non-automatable soft cap breached (754, informational
    per Decision 73), ci_rca_unresolved = [rec-2923] only.

