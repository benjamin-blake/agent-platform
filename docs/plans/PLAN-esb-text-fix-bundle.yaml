constraints:
  - >-
    PUBLIC repository (Decision 73 / AGENTS.md). ESB-09 publishes infrastructure cost arithmetic,
    which is safe-to-publish platform engineering and NOT trading alpha. Even so: no AWS account
    ids, no ARNs, no IAM ExternalIds, and no internal hostnames may appear in any cost text. The
    never-commit pre-commit hook is the BACKSTOP; VP step 6 is the control.
  - >-
    Decision-annotation reconciliation, stated explicitly rather than paraphrased. Decision 145
    clause 2 forbids restating an AMENDMENT on its victim -- an amendment belongs only in the
    amending Decision. Neither trailer here is an amendment: each is a non-amending dated
    ANNOTATION recording that a premise in the entry has gone stale, which
    docs/contracts/decision-entry.yaml sanctions via `amendment_forms`, and for which CD.27's own
    discipline_points[8] is in-repo precedent. The three conditions that keep it non-amending are
    therefore binding: the original body is untouched, no supersession verb appears, and the
    substantive change lives in its new locus (CD.27's discipline_points / the reworded criteria).
    PIN THE FORM: use `> **Update (YYYY-MM-DD):**` for BOTH trailers and do NOT use
    `[Amendment ...]` -- labelling a non-amending annotation "Amendment" would put two entries in
    the corpus that amend nothing. Read the contract; do not copy the form from memory.
  - >-
    Avoid the tokens "Supersedes Decision N", "amends Decision N" and "partially supersedes
    Decision N" inside either trailer. validate_supersession_annotations regexes exactly those
    forms and would mint a phantom supersession edge requiring a waiver-file entry.
  - >-
    Decision 110 / Decision 147 / AGENTS.md machine-parseable-wins: no narrative prose in
    docs/ROADMAP-PLATFORM.yaml. The stability definition, worked example, resume properties and
    billing envelope are STRUCTURED KEYS. Rationale belongs on the DECISIONS.md side.
  - >-
    CandidateDecision is `extra="forbid"` (scripts/platform_roadmap_models.py:112). A new top-level
    key on CD.27 FAILS schema validation. `discipline_points` is typed `list[Any]`, so a MAPPING
    entry there is schema-valid and is the only viable slot for structured content. (Do not read the
    11 existing mapping-shaped entries across CD.24/27/29/30/36/38 as precedent for a convention --
    they are ACCIDENTAL: prose containing ": " that YAML split into key/value. The operative point
    is the `list[Any]` typing, not those artefacts. Authoring a DELIBERATE mapping here is new, and
    correct.)
  - >-
    Name the substrate trigger list `substrate_reevaluation_triggers`. Do NOT name it
    `re_evaluation_triggers`: `cost_projection` already carries a top-level `reevaluation_triggers`
    key, and two near-identical keys differing by one underscore in a single block is a drift
    surface in an agent-first document.
  - >-
    YAML HAZARD, verified by simulation this session: a `discipline_points` entry authored as a
    bare (unquoted) string containing a colon-space becomes a MAPPING when parsed, not a string.
    The reworded personas discipline point must therefore avoid `": "` or be explicitly quoted --
    otherwise VP step 2's `isinstance(p, str)` lookup finds 0 personas points and fails. This is
    exactly how CD.27's existing entries 6 and 7 became accidental mappings.
  - >-
    Never touch a `- id:` line in docs/ROADMAP-PLATFORM.yaml. validate_platform_roadmap check (ii)
    force-flags every bare-string criterion on any tier_item whose header appears in the diff, and
    T4.2's six criteria are bare strings. Edit criterion text in place only.
  - >-
    docs/ROADMAP-PLATFORM.yaml line :821 (the CD.27 self-checkpointed-Lambda fallback clause) is
    wave 3's (ESB-02). This plan owns :822 only. Be surgical.
  - >-
    Do NOT decide the workspace backing store. ESB-01's store choice is wave 2's; property P2 names
    the requirement and deliberately names no mechanism.
  - >-
    Decision 86: no new standing prose-architecture doc under docs/. All content lands in existing
    files. docs/INTENT-provider-agnostic-executor.md may be ANNOTATED (it is grandfathered,
    disposition_state pending, WAVE-4) but must be cited by CD.27 as PROVENANCE only -- never as
    gate authority, since it is a live retirement member.
  - >-
    Decision 88 clause 2: Neon catalog egress figures are a post-deploy MEASUREMENT via the
    catalog_stats action, explicitly "not a planning-time guess". Name the egress line and carry
    the measurement obligation; do NOT invent a dollar value for it.
  - >-
    Decision 130 / Decision 128: tests/ is in the whole-repo SLOC scan and its grandfather roster is
    CLOSED. Each new test module lands under 500 SLOC by decomposition. A budget raise is forbidden
    as the response, and `--update-sloc-budgets` will not auto-seed a new oversized file.
  - >-
    Decision 105 lane shape: the ESB-04/ESB-06 layer-2 preconditions are obligations on the
    RATIFYING DECISION'S TEXT, not a second `state:` field. CD.27 keeps `state: pending` and
    `filed_via: pending_log_decision_lambda` (no dec-pointer) so
    validate_candidate_decision_ratification R2 continues to pass; at ratification the canonical R1
    shape applies unchanged.
  - >-
    Every ESB-09 cost line names `region: eu-west-2` and a `rate_basis` of "AWS Price List bulk
    offer files, region eu-west-2, fetched 2026-08-01". Figures are GROSS -- Lambda's 400k GB-s /
